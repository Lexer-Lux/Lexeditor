<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Trinkets — separate-page proposal</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#251e16;color:#eee6d4;font:18px Georgia,serif;min-height:100vh;padding:4vh 6vw}button,input{font:inherit;color:inherit}header{display:flex;justify-content:space-between;align-items:center;border-bottom:3px solid #b73a2c;padding-bottom:18px;gap:20px}h1{font-size:44px;letter-spacing:5px;margin:0}small,.muted{color:#bcb3a3}main{display:grid;grid-template-columns:minmax(230px,1fr) minmax(260px,1.2fr);gap:24px;margin-top:24px;min-height:55vh}#list{display:flex;flex-direction:column;gap:8px}button{background:#332a22;border:1px solid #77664e;padding:16px;text-align:left;cursor:pointer}button[aria-selected=true]{background:#962d24;border-color:#dc8d64}button:focus-visible,input:focus-visible{outline:3px solid #e7c47c;outline-offset:3px}article{background:#1a1713;padding:30px;min-width:0}h2{font-size:30px;margin:0 0 22px}p{line-height:1.6}footer{display:flex;justify-content:space-between;gap:18px;margin-top:24px;border-top:1px solid #76664e;padding-top:18px}.proposal{margin-top:30px;font:14px Arial,sans-serif;color:#d4c5b0}#preview{display:flex;gap:12px;margin-top:16px}#preview button{padding:8px;font:14px Arial,sans-serif}input{background:#17130f;border:1px solid #76664e;padding:12px;width:100%;margin-bottom:12px}@media(max-width:650px){body{padding:24px}main{grid-template-columns:1fr}h1{font-size:34px}article{min-height:220px}}
</style>
<header><h1>TRINKETS</h1><span id="count"></span></header>
<main><section aria-label="Owned trinkets"><input id="search" type="search" aria-label="Find a trinket" placeholder="Find a trinket"><div id="list" role="listbox" aria-label="Trinkets"></div></section><article aria-live="polite"><h2 id="name"></h2><p id="effect"></p><p id="status" class="muted"></p></article></main>
<footer><span>↑ ↓ Select</span><span>Esc Back</span></footer>
<div class="proposal">INTERACTIVE PROPOSAL · Sample ownership and text. This is a separate read-only page, not an installed satchel tab.</div>
<div id="preview" aria-label="Preview controls"><button id="some">Show owned example</button><button id="empty">Show empty example</button></div>
<script>
const sample=[{id:'PROVISION_TRINKET_BUCK_ANTLER',name:'Buck Antler Trinket',effect:'Sample effect description for layout review.'},{id:'PROVISION_TRINKET_BEAVER_TOOTH',name:'Beaver Tooth Trinket',effect:'A longer sample effect description shows how the detail pane wraps text without covering the list or controls.'},{id:'PROVISION_TRINKET_FOX_CLAW',name:'Fox Claw Trinket',effect:'Sample effect description for layout review.'},{id:'PROVISION_TALISMAN_BEAR_CLAW',name:'Bear Claw Talisman',effect:'Excluded from this trinket-only view.'}];
// The future runtime adapter supplies actual ownership counts and localized text.
// Unknown counts are excluded; no state is written to inventory or attributes.
function ownedTrinkets(records,counts){return records.filter(r=>r.id.startsWith('PROVISION_TRINKET_')&&Number.isInteger(counts[r.id])&&counts[r.id]>0).sort((a,b)=>a.name.localeCompare(b.name));}
let inventory=Object.fromEntries(sample.map(r=>[r.id,1])),selected='',closed=false;
function render(){const owned=ownedTrinkets(sample,inventory),rows=owned.filter(r=>r.name.toLowerCase().includes(document.querySelector('#search').value.toLowerCase()));document.querySelector('#count').textContent=`${owned.length} owned`;if(!rows.some(r=>r.id===selected))selected=rows[0]?.id||'';const list=document.querySelector('#list');list.replaceChildren();for(const r of rows){const b=document.createElement('button');b.type='button';b.role='option';b.dataset.id=r.id;b.setAttribute('aria-selected',r.id===selected);b.tabIndex=r.id===selected?0:-1;b.textContent=r.name;b.onclick=()=>{selected=r.id;render();document.querySelector(`[data-id="${selected}"]`)?.focus()};list.append(b)}const row=rows.find(r=>r.id===selected);document.querySelector('#name').textContent=row?.name||(owned.length?'No matches':'No trinkets yet');document.querySelector('#effect').textContent=row?.effect||(owned.length?'Try another name.':'Trinkets you acquire will appear here.');document.querySelector('#status').textContent=row?'Owned · Passive effect':'';}
document.querySelector('#search').oninput=render;document.querySelector('#some').onclick=()=>{inventory=Object.fromEntries(sample.map(r=>[r.id,1]));render()};document.querySelector('#empty').onclick=()=>{inventory={};render()};document.querySelector('#list').onkeydown=e=>{if(!['ArrowUp','ArrowDown'].includes(e.key))return;e.preventDefault();const rows=[...document.querySelectorAll('[role=option]')];const i=rows.findIndex(r=>r.dataset.id===selected),next=Math.max(0,Math.min(rows.length-1,i+(e.key==='ArrowDown'?1:-1)));rows[next]?.click()};document.addEventListener('keydown',e=>{if(e.key==='Escape'){closed=true;document.querySelector('#status').textContent='Back requested · preview stays open';}});render();
</script></html>
