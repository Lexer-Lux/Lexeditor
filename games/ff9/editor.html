<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Lexeditor - Final Fantasy 9</title>
  <script>(()=>{const p=new URLSearchParams(location.search),k=p.get("lexTransition");if(!["load","resume"].includes(k))return;const r=document.documentElement;r.classList.add("lex-transition-entry");if(k==="load"){r.dataset.lexQuote=p.get("lexQuote")||"Loading editor…";r.classList.add("lex-transition-loading")}})()</script>
  <link rel="stylesheet" href="/shared/framework.css">
  <style>
    /* FF9 draws on the shared baseline and nothing else. The bespoke purple
       gradients were layered over by a later reset that only caught some of
       them, so the page still leaked its old palette. Colour now comes from
       the framework's tokens; only structure lives here. */
    *{box-sizing:border-box}
    body{display:flex;flex-direction:column;height:100vh;margin:0;overflow:hidden;
      color:var(--lex-text);background:var(--lex-bg);font:15px/1.35 var(--lex-font)}
    main{flex:1;min-height:0;padding:var(--lex-panel-gap);overflow:hidden}
    .ff9-layout,.lex-paged-list-detail{height:100%}
    .ff9-table,.ff9-detail{height:100%;min-height:0}
    .ff9-detail .lex-detail-panel-body{padding:10px;gap:10px}
    .ff9-detail input{font:inherit}
    .ff9-runtime-actions{display:flex;flex-wrap:wrap;gap:8px}
    .ff9-card{max-width:980px;padding:22px 24px;border:1px solid var(--lex-border);
      background:var(--lex-panel)}
    .ff9-card h2{margin:0 0 12px;font:30px/1.15 var(--lex-heading-font)}
    .ff9-card p{max-width:820px;margin:8px 0}
    .ff9-path{display:block;margin:7px 0;overflow-wrap:anywhere}
    .ff9-warning{display:inline-block;margin-top:10px;padding:5px 9px;
      color:var(--lex-accent-text);background:var(--lex-accent);font-weight:700}
    .ff9-source{color:var(--lex-muted)}
    #toolbar{display:flex;margin:var(--lex-panel-gap) var(--lex-panel-gap) 0;gap:8px}
    #toolbar:empty{display:none}
    .ff9-readonly{white-space:normal;overflow-wrap:anywhere}
    .lex-data-map-view{height:100%;overflow:hidden}
  </style>
</head>

  <div id="toolbar"></div>
  <main id="main"></main>
  <script src="/shared/framework.js"></script>

  let runtimeRefresh=null;
  async function refreshRuntime(){
    if(runtimeRefresh)return runtimeRefresh;
    runtimeRefresh=(async()=>{
      state.dashboard.runtime=await api("/api/runtime");
      state.dataMap=await api("/api/datamap");
      state.deployment=await api("/api/deployment");
    })();
    try{await runtimeRefresh}finally{runtimeRefresh=null}
  }
  async function runtimeAction(action){
    if(state.busy||state.activeSource!=="mine")return;
    if(dirtyCount()){state.runtimeError="Save or discard your changes before changing Memoria.";await render();return}
    if(action==="install"&&!window.confirm("Install the pinned Memoria release? Close FF9 and its launcher first. Existing settings will be preserved and changed game files backed up."))return;
    if(action==="recover"&&!window.confirm("Restore the game files from before the interrupted Memoria installation?"))return;
    state.busy=true;state.runtimeError="";await render();
    try{await api(`/api/runtime/${action}`,{});if(runtimeRefresh)await runtimeRefresh;await refreshRuntime()}
    catch(error){state.runtimeError=error.message;try{await refreshRuntime()}catch(refreshError){state.runtimeError+=` ${refreshError.message}`}}
    finally{state.busy=false;await render()}
  }

    const tabs=[{id:"memoria",label:"Memoria"},{id:"improved",label:"Improved Interface"},{id:"eat",label:"Better Eat"},{id:"xp",label:"XP Bars"},{id:"hpmp",label:"HP/MP Bars"},{id:"row",label:"Row Rework"}];
