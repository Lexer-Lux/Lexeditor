<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Lexeditor - Blank Game</title>
  <script>(()=>{const p=new URLSearchParams(location.search),k=p.get("lexTransition");if(!["load","resume"].includes(k))return;const r=document.documentElement;r.classList.add("lex-transition-entry");if(k==="load"){r.dataset.lexQuote=p.get("lexQuote")||"Loading editor…";r.classList.add("lex-transition-loading")}})()</script>
  <link rel="stylesheet" href="/shared/framework.css">
  <style>
    *{box-sizing:border-box}
    body{display:flex;flex-direction:column;height:100vh;margin:0;overflow:hidden;color:var(--lex-text);background:var(--lex-bg);font:15px/1.35 var(--lex-font)}
    .lex-shell-command-row{background:#fff}
    .lex-nav-frame,.lex-shell-header nav{background:#e5e9ed}
    main{flex:1;min-height:0;padding:var(--lex-panel-gap)}
    .blank-layout,.lex-paged-list-detail{height:100%}
    .blank-detail,.blank-table{height:100%;min-height:0}
    .blank-detail{overflow:visible}
    :root{--lex-accent:#72ff1e;--lex-accent-text:#102008;--lex-highlight:#405247}
    .blank-detail .lex-detail-panel-heading{padding:4px 18px 4px 4px;border-bottom:1px solid var(--lex-border);background:#f1f3f5}
    .blank-detail .lex-detail-panel-icon{display:grid;width:auto;height:100%;aspect-ratio:1;place-items:center;color:var(--lex-accent);border:1px solid var(--lex-border);background:#fff}
    .blank-detail .lex-detail-panel-icon svg{width:64%;height:64%;fill:none;stroke:currentColor;stroke-width:1.7}
    
    .blank-detail .lex-column-pin{width:1em;min-width:1em;height:1em;min-height:1em;flex-basis:1em}
    .blank-detail .lex-column-pin>svg{width:.95em;height:.95em}
    .blank-detail .lex-source-control-internal:not(:has(>select))>:is(.lex-reference-values,.lex-reference-placeholder){right:.35em}
    .blank-detail .lex-detail-panel-body{padding:10px;gap:10px}
    .blank-detail .lex-detail-section{flex:1 1 auto}
    .blank-button-row{display:flex;flex-wrap:wrap;gap:8px}
    .blank-button-row button{padding:7px 12px;color:var(--lex-accent-text);border:0;background:var(--lex-accent);cursor:pointer}
    .blank-statuses{display:flex;flex-wrap:wrap;gap:12px;align-items:center;padding:10px}
    .blank-subtab-panel>.lex-tabbed-panel-content{padding:12px}
    .blank-subtab-panel{display:flex;flex-direction:column;height:100%;min-height:0;border:1px solid var(--lex-border);background:var(--lex-panel)}
    .blank-table .lex-boolean-mark{display:block;font-size:1.45em;text-align:center}
    .blank-editable-table :is(input,select){width:100%;text-align:center}
    .blank-tweaks{height:100%}
    .blank-graphs{display:grid;grid-template-columns:repeat(auto-fit,minmax(400px,1fr));align-content:start;gap:16px;height:100%;overflow:auto}
    .blank-graphs .lex-curve-editor{display:block;min-width:0}
    .blank-graphs .lex-curve-plot{height:330px;aspect-ratio:auto}
    .blank-graphs .lex-curve-path-formula{display:block;filter:drop-shadow(1px 1px 1px var(--lex-panel))}
    .blank-graphs .lex-curve-formula{display:none}
  </style>
</head>
<body>
  <header id="lexeditor-shell"></header>
  <main id="main"></main>
  <script src="/shared/framework.js"></script>
  <script>
  "use strict";
  const {el,columnList,columnPreferences,detailPanel,tabbedPanel,detailSection,detailField,multiNumberRow,unitField,readonlyField,recordId,infoHelp,hoverable,panelLayout,provenanceControl,referenceDisplay,integrationStatus,pagedListDetail,booleanMark,clone,EditHistory,toggleRow,infoIcon}=LexeditorUI;
  const categories=["Common","Rare","Weapon","Armor"];
  const seed=[["Example Item","Common",25,true],["Second Item","Rare",100,false],["Fallback Potion","Common",50,true],["Null Sword","Weapon",255,false],["Default Hat","Armor",10,true],["CSS Crystal","Rare",75,true]];
  const vanillaRows=Array.from({length:48},(_unused,id)=>{const sample=seed[id%seed.length];return{id,name:id<seed.length?sample[0]:`Sample Record ${String(id+1).padStart(2,"0")}`,category:sample[1],value:(sample[2]+id*7)%256,enabled:id<seed.length?sample[3]:id%3!==0}});
  let rows=clone(vanillaRows);rows[0].value=40;
  const vanillaStats={HP:2400,STR:24,MAG:31,SPD:18};
  let demo={text:"Blank value",value:25,floatValue:.9999,enabled:false,choice:"alternate",refValues:[40,40,40,40],flags:{menu:true,gf:true},stats:{HP:2400,STR:30,MAG:31,SPD:18}};
  let saved={rows:clone(rows),demo:clone(demo)};
  const columns=[{key:"id",label:"ID",numberedId:true,sortable:true},{key:"name",label:"Name",sortable:true,edit:(row,value)=>{row.name=String(value)}},{key:"category",label:"Category",sortable:true,edit:(row,value)=>{row.category=String(value)}},{key:"value",label:"Value",numeric:true,sortable:true,edit:(row,value)=>{row.value=Math.max(0,Math.min(255,Number(value)||0))}}];
  let tab="one",subtab="controls",selected=0,sort={key:"name",dir:1},query="",page=0,pageSize=12,activeSource="mine";
  const prefs=columnPreferences("blank-records",columns,()=>render());
  const activeRows=()=>activeSource==="vanilla"?vanillaRows:rows;
  const selectedRow=()=>activeRows().find(value=>value.id===selected)||activeRows()[0];
  const vanillaRow=id=>vanillaRows.find(value=>value.id===id)||vanillaRows[0];
  const sortedRows=()=>[...activeRows()].filter(row=>!query||`${row.id} ${row.name} ${row.category} ${row.value}`.toLocaleLowerCase().includes(query.toLocaleLowerCase())).sort((left,right)=>{const a=left[sort.key],b=right[sort.key];return(typeof a==="string"?a.localeCompare(b):Number(a)-Number(b))*sort.dir});
  const dirtyCount=()=>activeSource==="mine"?Number(JSON.stringify({rows,demo})!==JSON.stringify(saved)):0;
  const refreshShell=()=>shell?.refresh?.();
  function sourceControl({control,current,vanilla,references=[],apply,internal=false}){return provenanceControl({control,current,vanilla,references,internal,apply:value=>{apply(value);refreshShell()}})}
  function numericReferenceControl(){const input=el("input",{type:"number",min:0,max:255,step:1,value:demo.value,disabled:activeSource!=="mine",oninput:event=>{if(event.target.value!=="")demo.value=Number(event.target.value);refreshShell()}});return sourceControl({control:unitField(input,"units"),current:()=>demo.value,vanilla:25,internal:true,apply:value=>{demo.value=Number(value);input.value=demo.value}})}
  function booleanReferenceControl(){const input=el("input",{type:"checkbox",checked:demo.enabled,disabled:activeSource!=="mine",onchange:event=>{demo.enabled=event.target.checked;refreshShell()}});return sourceControl({control:input,current:()=>demo.enabled,vanilla:true,apply:value=>{demo.enabled=!!value;input.checked=demo.enabled}})}
  function floatReferenceControl(){const input=el("input",{type:"number",min:-100,max:100,step:.0001,value:demo.floatValue,disabled:activeSource!=="mine",oninput:event=>{if(event.target.value!=="")demo.floatValue=Number(event.target.value);refreshShell()}});return sourceControl({control:input,current:()=>demo.floatValue,vanilla:.5,internal:true,apply:value=>{demo.floatValue=Number(value);input.value=demo.floatValue}})}
  function stackedReferenceControl(count,index){
    const input=el("input",{type:"number",min:0,max:255,step:1,value:demo.refValues[index],disabled:activeSource!=="mine",oninput:event=>{if(event.target.value!=="")demo.refValues[index]=Number(event.target.value);refreshShell()}});
    const references=[{name:"Reference Mod 1",shortName:"R1",value:30},{name:"Reference Mod 2",shortName:"R2",value:35}].slice(0,count-1);
    return sourceControl({control:input,current:()=>demo.refValues[index],vanilla:25,references,apply:value=>{demo.refValues[index]=Number(value);input.value=demo.refValues[index]}});
  }
  const TOGGLE_FLAGS=[
    {key:"menu",label:"Usable in menu",help:"The item can be used from the menu."},
    {key:"chars",label:"Target chars",help:"Targets party characters."},
    {key:"gf",label:"Target GF",help:"Targets a Guardian Force."},
    {key:"all",label:"Target all",help:"Targets every valid recipient at once."},
    {key:"both",label:"Target all both",help:"Targets both sides of the field."},
    {key:"dead",label:"Target dead",help:"Can target a knocked-out recipient."},
    {key:"quistis",label:"Quistis only",help:"Restricted to one character."},
    {key:"others",label:"GF compat others",help:"Applies compatibility to the other GFs."},
  ];
  function toggleRowControl(){
    return toggleRow({label:"Use flags",toggles:TOGGLE_FLAGS.map(flag=>({
      key:flag.key,label:flag.label,help:flag.help,checked:!!demo.flags[flag.key],
      disabled:activeSource!=="mine",
      change:value=>{demo.flags[flag.key]=value;refreshShell()},
    }))});
  }
  function informationPanel(){
    const row=value=>readonlyField(value);
    return detailPanel({className:"lex-information-panel",icon:infoIcon(),title:"Information",
      identity:null,meta:"Plugin setup and runtime state",body:[
      detailSection({title:"GAME",body:[
        detailField({label:"STATE",control:row("Ready"),
          help:infoHelp("Blank has no real game behind it, so it is always ready.")}),
        detailField({label:"ROOT",control:row("In-memory sample data")}),
      ]}),
      detailSection({title:"HELPER",body:[
        detailField({label:"REQUIRED",control:row("None"),
          help:infoHelp("Plugins that drive a real game require their helper before they will open. Blank requires none.")}),
      ]}),
      detailSection({title:"PROJECT",body:[
        detailField({label:"MOD",control:row("My Mod")}),
        detailField({label:"RECORDS",control:row(String(rows.length))}),
      ]}),
    ]});
  }
  function galleryPanel(title="Shared Control Gallery"){
    const textInput=el("input",{type:"text",value:demo.text,disabled:activeSource!=="mine",oninput:event=>{demo.text=event.target.value;refreshShell()}});
    const text=sourceControl({control:textInput,current:()=>demo.text,vanilla:"Blank value",internal:true,apply:value=>{demo.text=String(value);textInput.value=demo.text}});
    const select=el("select",{disabled:activeSource!=="mine",onchange:event=>{demo.choice=event.target.value;refreshShell()}},...[["default","Default"],["alternate","Alternate"]].map(([value,label])=>{const option=el("option",{value},label);option.selected=value===demo.choice;return option}));
    const selectSource=sourceControl({control:select,current:()=>demo.choice,vanilla:"default",internal:true,apply:value=>{demo.choice=String(value);select.value=demo.choice}});
    return detailPanel({className:"blank-detail",title,icon:blankIcon(),identity:recordId(0),meta:"Unthemed shared controls",body:[
      detailSection({title:"TEXT & NUMBERS",body:[detailField({label:"TEXT",help:infoHelp("A normal editable text value."),control:text}),detailField({label:"NUMBER",help:infoHelp("This integer accepts only whole values from 0 through 255. The Vanilla reference stays inside the field."),control:numericReferenceControl(),dataType:"INT",min:0,max:255}),detailField({label:"FLOAT",control:floatReferenceControl(),dataType:"FLOAT",min:-100,max:100}),detailField({label:"READ ONLY",control:readonlyField("Computed fallback")}),detailField({label:"MULTI-NUMBER",help:infoHelp("One property holding several numbers. Each pair reads label-then-box like an ordinary property row."),control:multiNumberControl(),dataType:"INT"})]}),
      detailSection({title:"REFERENCE STACKS",body:[1,2,3].map((count,index)=>detailField({label:`${count}-REF VALUE`,control:stackedReferenceControl(count,index),dataType:"INT",min:0,max:255}))}),
      detailSection({title:"CHOICES",body:[detailField({label:"ENABLED",control:booleanReferenceControl(),dataType:"BOOL"}),detailField({label:"SELECT",control:selectSource,dataType:"ENUM"}),detailField({label:"USE FLAGS",help:infoHelp("One property made of several related on/off switches. The row wraps onto more lines instead of squeezing its labels."),control:toggleRowControl(),dataType:"FLAGS"})]}),
      detailSection({title:"ACTIONS & LINKS",body:[detailField({label:"HOVERABLE",control:hoverable({content:"Example Item",targetType:"item",targetId:0,targetLabel:"Example Item",activate:()=>{selected=0;navigate("two")}})}),detailField({label:"BUTTONS",control:el("div",{class:"blank-button-row"},el("button",{type:"button"},"Confirm"),el("button",{type:"button",disabled:true},"Disabled"))})]}),
    ]});
  }
  function multiNumberControl(){
    const stats=[["HP",0,9999],["STR",0,255],["MAG",0,255],["SPD",0,255]];
    return multiNumberRow(stats.map(([label,min,max])=>{
      const input=el("input",{type:"number",min,max,step:1,value:demo.stats[label],disabled:activeSource!=="mine",
        "aria-label":`${label} value`,
        oninput:event=>{if(event.target.value!=="")demo.stats[label]=Number(event.target.value);refreshShell()}});
      return{label,control:sourceControl({control:input,current:()=>demo.stats[label],vanilla:vanillaStats[label],internal:true,
        apply:value=>{demo.stats[label]=Number(value);input.value=demo.stats[label]}})};
    }),{columns:2});
  }
  function blankIcon(){const svg=document.createElementNS("http://www.w3.org/2000/svg","svg");svg.setAttribute("viewBox","0 0 24 24");svg.setAttribute("aria-hidden","true");const path=document.createElementNS(svg.namespaceURI,"path");path.setAttribute("d","M5 3h10l4 4v14H5zM15 3v5h4M8 12h8M8 16h8");svg.append(path);return svg}
  function tablePanel(tableRows=sortedRows(),picked=selected,select=value=>{selected=value.id;render()}){return columnList({rows:tableRows,key:value=>value.id,selected:picked,select,sortState:sort,sort:key=>{sort=sort.key===key?{key,dir:-sort.dir}:{key,dir:1};render()},columnPreferences:prefs,columns,refresh:()=>{render();refreshShell()},enabledChange:(row,value)=>{row.enabled=value;render();refreshShell()},class:"blank-table","aria-label":"Blank Game shared Table"})}
  function editableField(row,key,{type="text",min,max,step,unit,dataType,help}={}){
    const base=vanillaRow(row.id);let control;
    if(type==="select")control=el("select",{disabled:activeSource!=="mine",onchange:event=>{row[key]=event.target.value;refreshShell()}},...categories.map(value=>{const option=el("option",{value},value);option.selected=value===row[key];return option}));
    else if(type==="checkbox")control=el("input",{type,checked:row[key],disabled:activeSource!=="mine",onchange:event=>{row[key]=event.target.checked;refreshShell()}});
    else control=el("input",{type,min,max,step,value:row[key],disabled:activeSource!=="mine",oninput:event=>{if(type!=="number"||event.target.value!=="")row[key]=type==="number"?Number(event.target.value):event.target.value;refreshShell()}});
    const wrapped=sourceControl({control:unit?unitField(control,unit):control,current:()=>row[key],vanilla:base[key],internal:type==="number",apply:value=>{row[key]=value;if(type==="checkbox")control.checked=!!value;else control.value=value}});
    return{control:wrapped,dataType:dataType||(type==="checkbox"?"BOOL":type==="number"?"INT":type==="select"?"ENUM":"STRING"),min,max,help};
  }
  function recordPanel(withPins=true,row=selectedRow()){
    const fields={name:editableField(row,"name"),category:editableField(row,"category",{type:"select"}),value:editableField(row,"value",{type:"number",min:0,max:255,step:1,unit:"units",dataType:"INT",help:infoHelp("A bounded whole-number property. Focus it to reveal its type and valid range.")}),enabled:editableField(row,"enabled",{type:"checkbox"})};
    const sortMarker=property=>sort.key===property?{"data-lex-sort":sort.dir>0?"asc":"desc"}:{};
    return detailPanel({className:"blank-detail",title:row.name,icon:blankIcon(),identity:recordId(row.id),meta:row.category,body:[detailSection({title:"GENERAL",body:[detailField({label:"NAME",...fields.name,attrs:sortMarker("name"),pin:withPins?prefs.pinButton("name","Name"):null}),detailField({label:"CATEGORY",...fields.category,attrs:sortMarker("category"),pin:withPins?prefs.pinButton("category","Category"):null}),detailField({label:"VALUE",...fields.value,attrs:sortMarker("value"),pin:withPins?prefs.pinButton("value","Value"):null}),detailField({label:"ENABLED",...fields.enabled,attrs:sortMarker("enabled"),pin:withPins?prefs.pinButton("enabled","Enabled"):null})]})]});
  }
  function inspectorPanel(){const row=selectedRow();return detailPanel({className:"blank-detail",title:"Inspector",identity:"LIVE",meta:"Third shared pane",body:[detailSection({title:"SELECTION",body:[detailField({label:"RECORD",control:readonlyField(row.name)}),detailField({label:"VALUE",control:readonlyField(String(row.value))})]}),detailSection({title:"INTEGRATION STATES",body:[el("div",{class:"blank-statuses"},integrationStatus("integrated"),integrationStatus("partial"),integrationStatus("not-integrated"))]}),detailSection({title:"REFERENCE DISPLAY",body:[referenceDisplay({current:row.value,sources:[{name:"Vanilla",value:vanillaRow(row.id).value}],apply:()=>{}})]})]})}
  function subtabPanel(){const tabs=[{id:"controls",label:"Controls"},{id:"references",label:"References"},{id:"states",label:"States"}];let content;if(subtab==="references")content=detailSection({title:"REFERENCE VALUES",body:[detailField({label:"NUMBER",control:numericReferenceControl(),dataType:"INT",min:0,max:255}),detailField({label:"BOOLEAN",control:booleanReferenceControl(),dataType:"BOOL"})]});else if(subtab==="states")content=detailSection({title:"STATUS TOKENS",body:[el("div",{class:"blank-statuses"},integrationStatus("integrated"),integrationStatus("partial"),integrationStatus("not-integrated"))]});else content=detailSection({title:"STANDARD CONTROLS",body:[detailField({label:"TEXT",control:el("input",{type:"text",value:demo.text,disabled:activeSource!=="mine",oninput:event=>{demo.text=event.target.value;refreshShell()}})}),detailField({label:"NUMBER",control:numericReferenceControl(),dataType:"INT",min:0,max:255}),detailField({label:"TOGGLE",control:booleanReferenceControl(),dataType:"BOOL"})]});return tabbedPanel({className:"blank-subtab-panel",tabs,active:subtab,label:"Blank Game tabbed-panel example",change:value=>{subtab=value;render()},content})}
  function editableTablePanel(){const editableColumns=[{key:"enabled",label:"Enabled",render:row=>editableField(row,"enabled",{type:"checkbox"}).control},{key:"id",label:"ID",numberedId:true},{key:"name",label:"Name",render:row=>editableField(row,"name").control},{key:"category",label:"Category",render:row=>editableField(row,"category",{type:"select"}).control},{key:"value",label:"Integer",numeric:true,render:row=>editableField(row,"value",{type:"number",min:0,max:255,step:1}).control},{key:"float",label:"Float",numeric:true,render:row=>{if(row.float==null)row.float=(row.id%3===0 ? .9999 : row.id%3===1 ? 10.5 : 100.25);return editableField(row,"float",{type:"number",min:-999,max:999,step:.0001,dataType:"FLOAT"}).control}}];const editablePrefs=columnPreferences("blank-editable",editableColumns,()=>render());return columnList({rows:sortedRows().slice(0,12),key:row=>row.id,columns:editableColumns,columnPreferences:editablePrefs,editable:true,class:"blank-table blank-editable-table","aria-label":"Editable shared Table"})}
  function tweaksPanel(){return detailPanel({className:"blank-detail blank-tweaks",title:"Tweaks",icon:blankIcon(),identity:"OFF",meta:"Plugin tweak controls",body:[detailSection({title:"TWEAKS",body:[detailField({label:"EXAMPLE TWEAK",help:infoHelp("Blank demonstrates the shared Tweaks layout. Real tweaks remain disabled until a mod enables them."),control:el("input",{type:"checkbox",checked:false})}),detailField({label:"TWEAK VALUE",control:el("input",{type:"number",min:0,max:100,step:1,value:50}),dataType:"INT",min:0,max:100})]})]})}
  function graphsPanel(){
    const cards=[['Linear',level=>level],['Quadratic',level=>level*level/100]].map(([title,evaluate])=>{
      const scale=el("input",{type:"number",min:0,max:5,step:.1,value:1,"aria-label":`${title} multiplier`});
      return LexeditorUI.curveEditor({title,variables:[{label:"A",control:scale}],domain:{min:1,max:100},range:{min:0,max:500},overlayExtrema:true,evaluate:level=>evaluate(level)*Number(scale.value),formula:title==="Linear"?"Value = Level × A":"Value = Level² × A / 100"});
    });
    return el("div",{class:"blank-graphs"},...cards);
  }
  function addRecord(){const id=activeRows().reduce((highest,row)=>Math.max(highest,row.id),-1)+1;rows.push({id,name:`New Record ${String(id+1).padStart(2,"0")}`,category:categories[0],value:0,enabled:true});selected=id;render();refreshShell()}
  function pagedTwoPanel(){const records=sortedRows();return pagedListDetail({rows:records,key:row=>row.id,slots:false,add:addRecord,addTitle:"Add a Blank record",addDisabled:activeSource!=="mine",selected,page,pageSize,noun:"records",className:"blank-layout",splitKey:"blank-two",rowsKey:"blank-two",defaultSplit:50,minLeft:320,minRight:360,search:{key:"blank-records",value:query,label:"Search Blank records",change:value=>{query=value;page=0;render()}},sync:next=>{page=next.page;pageSize=next.pageSize;if(next.selected!==null)selected=next.selected},change:next=>{page=next.page;pageSize=next.pageSize;if(next.selected!==null)selected=next.selected;render()},master:state=>tablePanel(state.rows,state.selected,state.select),detail:row=>recordPanel(true,row)})}
  const mapState={page:0,query:"",status:"",sort:["filename",1]};
  function dataMapPanel(){return LexeditorUI.dataMap({
    rows:[{filename:"No installed game files",controls:"Blank is an in-memory UI demonstration",notes:"Sample records demonstrate shared controls only. They do not read or save game data.",coverage:"unavailable",status:"not-integrated"}],
    page:mapState.page,query:mapState.query,status:mapState.status,sort:mapState.sort,
    changePage:value=>{mapState.page=value;render()},changeQuery:value=>{mapState.query=value;mapState.page=0;render()},
    changeStatus:value=>{mapState.status=value;mapState.page=0;render()},changeSort:key=>{mapState.sort=[key,-mapState.sort[1]];render()}}).content}
  function render(){let layout;if(tab==="datamap")layout=dataMapPanel();else if(tab==="info")layout=panelLayout([informationPanel()],"blank-layout",{layoutKey:"blank-info",defaultSizes:[100]});else if(tab==="graphs")layout=panelLayout([graphsPanel()],"blank-layout",{layoutKey:"blank-graphs",defaultSizes:[100]});else if(tab==="one")layout=panelLayout([galleryPanel()],"blank-layout",{layoutKey:"blank-one",defaultSizes:[100]});else if(tab==="three")layout=panelLayout([tablePanel(),recordPanel(),inspectorPanel()],"blank-layout",{layoutKey:"blank-three",defaultSizes:[34,38,28],minSizes:[280,340,260],stackAt:980});else if(tab==="subtabs")layout=panelLayout([subtabPanel()],"blank-layout",{layoutKey:"blank-subtabs",defaultSizes:[100]});else if(tab==="editable")layout=panelLayout([editableTablePanel()],"blank-layout",{layoutKey:"blank-editable",defaultSizes:[100]});else if(tab==="tweaks")layout=panelLayout([tweaksPanel()],"blank-layout",{layoutKey:"blank-tweaks",defaultSizes:[100]});else layout=pagedTwoPanel();document.querySelector("#main").replaceChildren(layout);refreshShell()}
  function navigate(value){tab=value;render()}
  const editHistory=new EditHistory({capture:()=>({rows,demo}),restore:snapshot=>{rows=clone(snapshot.rows);demo=clone(snapshot.demo)},render:async()=>render(),enabled:()=>activeSource==="mine",changed:()=>refreshShell()});
  const shell=LexeditorUI.mountShell({host:"#lexeditor-shell",brand:"LEXEDITOR",plugin:{id:"blank",name:"Blank Game",themeName:"blank",theme:{accent:"#72ff1e","accent-text":"#102008"}},tabs:[{id:"one",label:"1 Panel"},{id:"two",label:"2 Panels"},{id:"three",label:"3 Panels"},{id:"subtabs",label:"Tabbed Panel"},{id:"editable",label:"Editable Table"},{id:"tweaks",label:"Tweaks"},{id:"graphs",label:"Graphs"}],activeTab:()=>tab,navigate,help:()=>navigate("datamap"),helpActive:()=>tab==="datamap",helpTitle:"Open Blank Data Map",dirtyCount,readonly:()=>activeSource!=="mine",history:editHistory,save:async()=>{saved={rows:clone(rows),demo:clone(demo)};editHistory.clear()},discard:async()=>{rows=clone(saved.rows);demo=clone(saved.demo);editHistory.clear();render()},projectSnapshot:()=>({canCreate:false,projects:[{name:"My Mod",path:"In-memory Blank project",valid:true,current:true}]}),projectSources:()=>[{key:"vanilla",label:"Vanilla",path:"Packaged unchanged sample data"}],projectActiveSource:()=>activeSource,selectProjectSource:async value=>{activeSource=String(value||"mine");selected=0;page=0;render()},info:()=>navigate("info"),infoActive:()=>tab==="info",infoTitle:"Open Blank setup and runtime information"});
  editHistory.observe(document);render();LexeditorUI.finishPluginLoading();
  </script>
</body>
