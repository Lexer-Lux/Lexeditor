  <link rel="stylesheet" href="/shared/framework.css">
  <style>
    *{box-sizing:border-box}

    .blank-detail .lex-detail-panel-heading{padding:4px 18px 4px 4px;border-bottom:1px solid var(--lex-border);background:#f1f3f5}
    .blank-detail .lex-detail-panel-icon{display:grid;width:auto;height:100%;aspect-ratio:1;place-items:center;color:var(--lex-accent);border:1px solid var(--lex-border);background:#fff}
    .blank-detail .lex-detail-panel-icon svg{width:64%;height:64%;fill:none;stroke:currentColor;stroke-width:1.7}
    
    .blank-detail .lex-column-pin{width:1em;min-width:1em;height:1em;min-height:1em;flex-basis:1em}
    .blank-detail .lex-column-pin>svg{width:.95em;height:.95em}
    .blank-detail .lex-source-control-internal:not(:has(>select))>:is(.lex-reference-values,.lex-reference-placeholder){right:.35em}

    .blank-detail .lex-detail-panel-body{padding:10px;gap:10px}
    .blank-detail .lex-detail-section{flex:1 1 auto}
    .blank-button-row{display:flex;flex-wrap:wrap;gap:8px}
    .blank-button-row button{padding:7px 12px;color:var(--lex-accent-text);border:0;background:var(--lex-accent);cursor:pointer}
    .blank-statuses{display:flex;flex-wrap:wrap;gap:12px;align-items:center;padding:10px}
    .blank-subtab-panel>.lex-tabbed-panel-content{padding:12px}
    .blank-subtab-panel{display:flex;flex-direction:column;height:100%;min-height:0;border:1px solid var(--lex-border);background:var(--lex-panel)}
    .blank-table .lex-boolean-mark{display:block;font-size:1.45em;text-align:center}
    .blank-tweaks{height:100%}
    .blank-graphs{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,600px),1fr));align-content:start;gap:16px;height:100%;overflow:auto}
    .blank-graphs .lex-curve-editor{display:block;min-width:0}
    /* The drawing is 2:1; a fixed height gave it a differently shaped box, which
       letterboxed the graph and stranded the right-hand axis. */
    .blank-graphs .lex-curve-plot{height:auto}
    .blank-graphs .lex-curve-path-formula{display:block;filter:drop-shadow(1px 1px 1px var(--lex-panel))}
    .blank-graphs .lex-curve-formula{display:none}
  </style>
</head>
<body>
  <header id="lexeditor-shell"></header>
  <main id="main"></main>
  <script src="/shared/framework.js"></script>
  <script>
  "use strict";
  const {el,columnList,columnPreferences,detailPanel,tabbedPanel,detailSection,detailField,multiNumberRow,unitField,readonlyField,recordId,infoHelp,hoverable,panelLayout,provenanceControl,referenceDisplay,integrationStatus,pagedListDetail,booleanMark,clone,EditHistory,toggleRow,infoIcon}=LexeditorUI;
  const categories=["Common","Rare","Weapon","Armor"];

  const vanillaRows=Array.from({length:48},(_unused,id)=>{const sample=seed[id%seed.length];return{id,name:id<seed.length?sample[0]:`Sample Record ${String(id+1).padStart(2,"0")}`,category:sample[1],value:(sample[2]+id*7)%256,enabled:id<seed.length?sample[3]:id%3!==0}});

  let saved={rows:clone(rows),demo:clone(demo)};
  const columns=[{key:"id",label:"ID",numberedId:true,sortable:true},{key:"name",label:"Name",sortable:true,edit:(row,value)=>{row.name=String(value)}},{key:"category",label:"Category",sortable:true,edit:(row,value)=>{row.category=String(value)}},{key:"value",label:"Value",numeric:true,sortable:true,edit:(row,value)=>{row.value=Math.max(0,Math.min(255,Number(value)||0))}}];
  let tab="one",subtab="controls",selected=0,sort={key:"name",dir:1},query="",page=0,pageSize=12,activeSource="mine";

  const dirtyCount=()=>activeSource==="mine"?Number(JSON.stringify({rows,demo})!==JSON.stringify(saved)):0;
  const refreshShell=()=>shell?.refresh?.();
  function sourceControl({control,current,vanilla,references=[],apply,internal=false}){return provenanceControl({control,current,vanilla,references,internal,apply:value=>{apply(value);refreshShell()}})}
  function numericReferenceControl(){const input=el("input",{type:"number",min:0,max:255,step:1,value:demo.value,disabled:activeSource!=="mine",oninput:event=>{if(event.target.value!=="")demo.value=Number(event.target.value);refreshShell()}});return sourceControl({control:unitField(input,"units"),current:()=>demo.value,vanilla:25,internal:true,apply:value=>{demo.value=Number(value);input.value=demo.value}})}

  const TOGGLE_FLAGS=[

    {key:"chars",label:"Target chars",help:"Targets party characters."},
    {key:"gf",label:"Target GF",help:"Targets a Guardian Force."},
    {key:"all",label:"Target all",help:"Targets every valid recipient at once."},

      detailSection({title:"TEXT & NUMBERS",body:[detailField({label:"TEXT",help:infoHelp("Blank uses this sample to demonstrate the shared text control and Vanilla-reference behavior; it has no game-specific meaning."),control:text}),detailField({label:"NUMBER",help:infoHelp("This sample demonstrates an internal Vanilla reference: changing the live value leaves the unchanged reference available inside the same field."),control:numericReferenceControl(),dataType:"INT",min:0,max:255}),detailField({label:"FLOAT",control:floatReferenceControl(),dataType:"FLOAT",min:-100,max:100}),detailField({label:"READ ONLY",control:readonlyField("Computed fallback")}),detailField({label:"MULTI-NUMBER",help:infoHelp("One property holding several numbers. Each pair reads label-then-box like an ordinary property row."),control:multiNumberControl(),dataType:"INT"})]}),
      detailSection({title:"REFERENCE STACKS",body:[1,2,3].map((count,index)=>detailField({label:`${count}-REF VALUE`,control:stackedReferenceControl(count,index),dataType:"INT",min:0,max:255}))}),
      detailSection({title:"CHOICES",body:[detailField({label:"ENABLED",control:booleanReferenceControl(),dataType:"BOOL"}),detailField({label:"SELECT",control:selectSource,dataType:"ENUM"}),detailField({label:"USE FLAGS",help:infoHelp("One property made of several related on/off switches. The row wraps onto more lines instead of squeezing its labels."),control:toggleRowControl(),dataType:"FLAGS"})]}),

  function multiNumberControl(){
    const stats=[["HP",0,9999],["STR",0,255],["MAG",0,255],["SPD",0,255]];

      return{label,control:sourceControl({control:input,current:()=>demo.stats[label],vanilla:vanillaStats[label],internal:true,

  }
  function blankIcon(){const svg=document.createElementNS("http://www.w3.org/2000/svg","svg");svg.setAttribute("viewBox","0 0 24 24");svg.setAttribute("aria-hidden","true");const path=document.createElementNS(svg.namespaceURI,"path");path.setAttribute("d","M5 3h10l4 4v14H5zM15 3v5h4M8 12h8M8 16h8");svg.append(path);return svg}
  function tablePanel(tableRows=sortedRows(),picked=selected,select=value=>{selected=value.id;render()}){return columnList({rows:tableRows,key:value=>value.id,selected:picked,select,sortState:sort,sort:key=>{sort=sort.key===key?{key,dir:-sort.dir}:{key,dir:1};render()},columnPreferences:prefs,columns,refresh:()=>{render();refreshShell()},enabledChange:(row,value)=>{row.enabled=value;render();refreshShell()},class:"blank-table","aria-label":"Blank Game shared Table"})}
  function editableField(row,key,{type="text",min,max,step,unit,dataType,help}={}){

  function recordPanel(withPins=true,row=selectedRow()){

  }
  function inspectorPanel(){const row=selectedRow();return detailPanel({className:"blank-detail",title:"Inspector",identity:"LIVE",meta:"Third shared pane",body:[detailSection({title:"SELECTION",body:[detailField({label:"RECORD",control:readonlyField(row.name)}),detailField({label:"VALUE",control:readonlyField(String(row.value))})]}),detailSection({title:"INTEGRATION STATES",body:[el("div",{class:"blank-statuses"},integrationStatus("integrated"),integrationStatus("partial"),integrationStatus("not-integrated"))]}),detailSection({title:"REFERENCE DISPLAY",body:[referenceDisplay({current:row.value,sources:[{name:"Vanilla",value:vanillaRow(row.id).value}],apply:()=>{}})]})]})}
  function subtabPanel(){const tabs=[{id:"controls",label:"Controls"},{id:"references",label:"References"},{id:"states",label:"States"}];let content;if(subtab==="references")content=detailSection({title:"REFERENCE VALUES",body:[detailField({label:"NUMBER",control:numericReferenceControl(),dataType:"INT",min:0,max:255}),detailField({label:"BOOLEAN",control:booleanReferenceControl(),dataType:"BOOL"})]});else if(subtab==="states")content=detailSection({title:"STATUS TOKENS",body:[el("div",{class:"blank-statuses"},integrationStatus("integrated"),integrationStatus("partial"),integrationStatus("not-integrated"))]});else content=detailSection({title:"STANDARD CONTROLS",body:[detailField({label:"TEXT",control:el("input",{type:"text",value:demo.text,disabled:activeSource!=="mine",oninput:event=>{demo.text=event.target.value;refreshShell()}})}),detailField({label:"NUMBER",control:numericReferenceControl(),dataType:"INT",min:0,max:255}),detailField({label:"TOGGLE",control:booleanReferenceControl(),dataType:"BOOL"})]});return tabbedPanel({className:"blank-subtab-panel",tabs,active:subtab,label:"Blank Game tabbed-panel example",change:value=>{subtab=value;render()},content})}
  // The reference Tweaks page. A plugin's tweak surface is a settings page,
  // not a record table: groups of switches and bounded values, with dependent
  // controls disabled until their parent switch is on. Copy this shape.

    flags:{fastTravel:true,autoLoot:false,hardcore:false,permadeath:false}};
  function tweakSwitch(key,label,help){

          detailField({label:"PRESET NAME",dataType:"STRING",

  async function loadReshade(){

      const value=method==="adopt_reshade"
        ? await LexeditorUI.callWindow?.(method)
        : await LexeditorUI.callWindow?.(method,"blank",...args);
      if(value&&value.manifest)reshade=value;else await loadReshade();

    render();
  }
  async function saveReshade(manifest){

    render();
  }

  function graphsPanel(){
    const cards=[['Linear',level=>level],['Quadratic',level=>level*level/100]].map(([title,evaluate])=>{
      const scale=el("input",{type:"number",min:0,max:5,step:.1,value:1,"aria-label":`${title} multiplier`});

  }

  const mapState={page:0,query:"",status:"",sort:["filename",1]};
  function dataMapPanel(){return LexeditorUI.dataMap({
    rows:[{filename:"No installed game files",controls:"Blank is an in-memory UI demonstration",notes:"Sample records demonstrate shared controls only. They do not read or save game data.",coverage:"unavailable",status:"not-integrated"}],
    page:mapState.page,query:mapState.query,status:mapState.status,sort:mapState.sort,
    changePage:value=>{mapState.page=value;render()},changeQuery:value=>{mapState.query=value;mapState.page=0;render()},
    changeStatus:value=>{mapState.status=value;mapState.page=0;render()},changeSort:key=>{mapState.sort=[key,-mapState.sort[1]];render()}}).content}
  function render(){let layout;if(tab==="datamap")layout=dataMapPanel();else if(tab==="info")layout=panelLayout([informationPanel()],"blank-layout",{layoutKey:"blank-info",defaultSizes:[100]});else if(tab==="graphs")layout=panelLayout([graphsPanel()],"blank-layout",{layoutKey:"blank-graphs",defaultSizes:[100]});else if(tab==="one")layout=panelLayout([galleryPanel()],"blank-layout",{layoutKey:"blank-one",defaultSizes:[100]});else if(tab==="three")layout=panelLayout([tablePanel(),recordPanel(),inspectorPanel()],"blank-layout blank-three-layout",{layoutKey:"blank-three",defaultSizes:[38,34,28],minSizes:[300,320,260],stackAt:980});else if(tab==="subtabs")layout=panelLayout([subtabPanel()],"blank-layout",{layoutKey:"blank-subtabs",defaultSizes:[100]});else if(tab==="tweaks")layout=panelLayout([tweaksPanel()],"blank-layout",{layoutKey:"blank-tweaks",defaultSizes:[100]});else layout=pagedTwoPanel();document.querySelector("#main").replaceChildren(layout);refreshShell()}
  function navigate(value){tab=value;render()}
  const editHistory=new EditHistory({capture:()=>({rows,demo}),restore:snapshot=>{rows=clone(snapshot.rows);demo=clone(snapshot.demo)},render:async()=>render(),enabled:()=>activeSource==="mine",changed:()=>refreshShell()});
  // Saved samples belong to the user data store, not the service's changing port.
  let projectName="My Mod";
  const projectStore="lexeditor:blank:projects";
  let projects={}, browserOnly=false, projectsReady=false;
  const storedProjects=()=>projects;
  const projectSnapshot=()=>({canCreate:true,projects:[{name:projectName,path:"Saved Blank samples",valid:true,current:true}]});
  const persistProjects=async(all,current)=>{
    if(!projectsReady)throw new Error("Saved samples could not be loaded. Reopen Blank before saving.");
    if(browserOnly)localStorage.setItem(projectStore,JSON.stringify(all));
    else{
      const response=await fetch("/api/projects",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({current,projects:all})});
      const result=await response.json();if(!response.ok)throw new Error(result.error||"Could not save Blank samples");
    }
    projects=all;
  };
  const saveSample=async()=>{const all={...storedProjects(),[projectName]:{rows:clone(rows),demo:clone(demo)}};await persistProjects(all,projectName)};
  const createSample=async name=>{
    if(Object.hasOwn(storedProjects(),name))throw new Error("A sample with this name already exists.");
    const sample={rows:clone(vanillaRows),demo:clone(saved.demo)};
    await persistProjects({...projects,[name]:sample},name);
    projectName=name;rows=clone(sample.rows);demo=clone(sample.demo);saved=clone(sample);activeSource="mine";selected=0;page=0;editHistory.clear();render();return projectSnapshot();
  };
  const browseSamples=()=>new Promise(resolve=>{
    const all=storedProjects(), names=Object.keys(all);
    const dialog=el("dialog",{class:"lex-project-dialog"});
    const close=result=>{dialog.close();dialog.remove();resolve(result)};
    dialog.addEventListener("cancel",event=>{event.preventDefault();close({cancelled:true})});
    dialog.append(el("h2",{},"Find a Mod"),el("p",{},"Blank sample projects saved on this computer."));
    if(!names.length)dialog.append(el("p",{},"No saved samples. Use Add a Mod to create one."));
    for(const name of names)dialog.append(el("button",{type:"button",onclick:async()=>{
      try{await persistProjects(all,name)}catch(error){LexeditorUI.showAlert({title:"Could not open sample",message:error.message});return}
      projectName=name;rows=clone(all[name].rows);demo=clone(all[name].demo);saved=clone(all[name]);activeSource="mine";selected=0;page=0;editHistory.clear();render();close(projectSnapshot());
    }},name));
    dialog.append(el("button",{type:"button",onclick:()=>close({cancelled:true})},"Cancel"));
    document.body.append(dialog);dialog.showModal();
  });
  void loadReshade().then(()=>render());
  const shell=LexeditorUI.mountShell({host:"#lexeditor-shell",brand:"LEXEDITOR",plugin:{id:"blank",name:"Blank Game",themeName:"blank",theme:{accent:"#72ff1e","accent-text":"#102008"}},tabs:[{id:"one",label:"1 Panel"},{id:"two",label:"2 Panels"},{id:"three",label:"3 Panels"},{id:"subtabs",label:"Tabbed Panel"},{id:"tweaks",label:"Tweaks"},{id:"graphs",label:"Graphs"}],activeTab:()=>tab,navigate,help:()=>navigate("datamap"),helpActive:()=>tab==="datamap",helpTitle:"Open Blank Data Map",dirtyCount,readonly:()=>activeSource!=="mine",history:editHistory,save:async()=>{await saveSample();saved={rows:clone(rows),demo:clone(demo)};editHistory.clear()},discard:async()=>{rows=clone(saved.rows);demo=clone(saved.demo);editHistory.clear();render()},projectSnapshot,projectCreatePrompt:{createLabel:"Create Sample",description:"Save a Blank sample project on this computer."},createProject:createSample,browseProject:browseSamples,projectSources:()=>[{key:"vanilla",label:"Vanilla",path:"Packaged unchanged sample data"}],projectActiveSource:()=>activeSource,selectProjectSource:async value=>{activeSource=String(value||"mine");selected=0;page=0;render()},info:()=>navigate("info"),infoActive:()=>tab==="info",infoTitle:"Open Blank setup and runtime information"});
  async function restoreSample(){
    try{
      const response=await fetch("/api/projects");
      if(response.status===404){browserOnly=true;projects=JSON.parse(localStorage.getItem(projectStore)||"{}");}
      else{
        const result=await response.json();if(!response.ok)throw new Error(result.error||"Could not load Blank samples");
        projects=result.projects;
        if(result.current){projectName=result.current;rows=clone(projects[projectName].rows);demo=clone(projects[projectName].demo);saved={rows:clone(rows),demo:clone(demo)};}
      }
      projectsReady=true;
    }catch(error){LexeditorUI.showAlert({title:"Could not load Blank samples",message:error.message});}
    editHistory.observe(document);render();LexeditorUI.finishPluginLoading();
  }
  restoreSample();
  </script>
</body>
