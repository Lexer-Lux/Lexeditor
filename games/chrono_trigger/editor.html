<head>

  <title>Lexeditor - Chrono Trigger</title>
  <script>(()=>{const p=new URLSearchParams(location.search),k=p.get("lexTransition");if(!["load","resume"].includes(k))return;const r=document.documentElement;r.classList.add("lex-transition-entry");if(k==="load"){r.dataset.lexQuote=p.get("lexQuote")||"Loading editor…";r.classList.add("lex-transition-loading")}})()</script>
  <link rel="stylesheet" href="/shared/framework.css">
  <style>

    .ct-scroll{flex:1;min-height:0;overflow:auto;border:1px solid var(--lex-border);background:var(--lex-panel)}table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}thead{position:sticky;top:0;z-index:1;background:var(--lex-panel)}th,td{padding:7px 9px;border-bottom:1px solid var(--lex-border);text-align:left;vertical-align:middle}th{font-size:.8em;letter-spacing:.04em;text-transform:uppercase}
    .ct-path,.ct-mono{font-family:var(--lex-mono,monospace)}.ct-path{font-size:.92em;overflow-wrap:anywhere}.ct-number{text-align:right;white-space:nowrap}.ct-source{display:inline-block;padding:2px 6px;border:1px solid var(--lex-border);font-size:.78em;text-transform:uppercase}.ct-source.project{color:var(--lex-accent)}
    .ct-footer{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:7px 10px;border:1px solid var(--lex-border);background:var(--lex-panel)}.ct-footer button{padding:5px 12px}

    .ct-split{display:grid;grid-template-columns:minmax(290px,34%) minmax(430px,1fr);gap:10px;flex:1;min-height:0}.ct-list,.ct-detail{min-height:0;overflow:auto;border:1px solid var(--lex-border);background:var(--lex-panel)}.ct-list-row{display:grid;width:100%;grid-template-columns:76px 1fr auto;gap:8px;padding:8px 10px;border:0;border-bottom:1px solid var(--lex-border);background:transparent;color:inherit;text-align:left;cursor:pointer}.ct-list-row:hover,.ct-list-row.active{background:var(--lex-highlight)}.ct-list-id{font-variant-numeric:tabular-nums;color:var(--lex-muted)}.ct-detail h2{margin:0;padding:12px 14px;border-bottom:1px solid var(--lex-border);font:600 18px/1.2 var(--lex-heading-font)}
    .ct-form{display:grid;grid-template-columns:minmax(150px,230px) minmax(160px,1fr);padding:6px 14px 18px}.ct-form label,.ct-form .ct-control{padding:7px 4px;border-bottom:1px solid var(--lex-border)}.ct-form label{color:var(--lex-muted)}.ct-form input,.ct-record-table input{width:100%;padding:5px 7px;border:1px solid var(--lex-border);background:var(--lex-input-bg,#fff);color:var(--lex-text)}.ct-form input{max-width:240px}.ct-record-table input{min-width:70px}
    .ct-message-table input{width:100%;min-width:260px;padding:5px 7px;border:1px solid var(--lex-border);background:var(--lex-input-bg,#fff);color:var(--lex-text)}.ct-message-key{width:180px;color:var(--lex-muted);font-family:var(--lex-mono,monospace)}.ct-file-select{max-width:520px;min-width:260px;padding:6px 8px;border:1px solid var(--lex-border);background:var(--lex-input-bg,#fff);color:var(--lex-text)}
    .ct-map-status,.ct-change-status{font-weight:700;text-transform:uppercase;font-size:.78em}.ct-map-status.integrated,.ct-change-status.modified{color:#7fd089}.ct-map-status.partial,.ct-change-status.redundant{color:#e4bd62}.ct-change-status.added{color:#8fc6e8}.ct-event-meta,.ct-table-note{padding:9px 12px;color:var(--lex-muted);border-bottom:1px solid var(--lex-border)}.ct-object{margin:10px 12px;border:1px solid var(--lex-border);background:var(--lex-bg)}.ct-object summary{padding:8px 10px;cursor:pointer;font-weight:600}.ct-object table{background:var(--lex-panel)}.ct-hex{max-width:420px;font:12px/1.4 var(--lex-mono,monospace);overflow-wrap:anywhere;color:var(--lex-muted)}.ct-subheading{margin:14px 12px 6px;font-size:13px;text-transform:uppercase;letter-spacing:.04em;color:var(--lex-muted)}
    .ct-deploy-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px}.ct-deploy-card{padding:14px;border:1px solid var(--lex-border);background:var(--lex-panel)}.ct-deploy-card h3{margin:0 0 8px;font-size:14px;text-transform:uppercase;letter-spacing:.04em;color:var(--lex-muted)}.ct-deploy-card strong{display:block;margin-bottom:5px;font-size:18px}.ct-deploy-actions{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.ct-deploy-actions button{padding:8px 14px}.ct-audit-list{margin:0;padding:0;list-style:none;border:1px solid var(--lex-border);background:var(--lex-panel);overflow:auto}.ct-audit-list li{display:grid;grid-template-columns:70px 180px 1fr;gap:10px;padding:8px 10px;border-bottom:1px solid var(--lex-border)}.ct-audit-list li:last-child{border-bottom:0}.ct-level{font-weight:700;text-transform:uppercase;font-size:.78em}.ct-level.error{color:#ff9e9e}.ct-level.warning{color:#e4bd62}.ct-level.info{color:#8fc6e8}.ct-good{color:#7fd089}.ct-bad{color:#ff9e9e}
    .ct-resource-layout{display:grid;grid-template-columns:minmax(480px,56%) minmax(340px,44%);gap:10px;flex:1;min-height:0}.ct-resource-table tr{cursor:pointer}.ct-resource-table tr.active{background:var(--lex-highlight)}.ct-resource-detail{min-height:0;overflow:auto;border:1px solid var(--lex-border);background:var(--lex-panel)}.ct-resource-detail h2{margin:0;padding:12px;border-bottom:1px solid var(--lex-border);font-size:16px}.ct-resource-meta{display:grid;grid-template-columns:110px 1fr;padding:8px 12px;gap:5px 10px}.ct-resource-meta dt{color:var(--lex-muted)}.ct-resource-meta dd{margin:0;overflow-wrap:anywhere}.ct-preview-text{margin:0;padding:12px;white-space:pre-wrap;overflow:auto;font:12px/1.45 var(--lex-mono,monospace);border-top:1px solid var(--lex-border)}.ct-preview-image{display:block;max-width:100%;max-height:60vh;margin:12px auto;image-rendering:pixelated}.ct-download{display:inline-block;margin:12px;padding:7px 11px;border:1px solid var(--lex-border);color:inherit;text-decoration:none}
    .ct-map-panel{padding:12px}.ct-map-controls{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:10px}.ct-map-controls select{padding:5px 8px}.ct-map-canvas-wrap{overflow:auto;max-height:58vh;border:1px solid var(--lex-border);background:var(--lex-bg)}.ct-map-canvas{display:block;image-rendering:pixelated}.ct-collision-summary{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}.ct-collision-chip{padding:3px 6px;border:1px solid var(--lex-border);font-size:.82em}
    .ct-command-table{font-size:.9em}.ct-command-table td{padding:5px 7px}.ct-function-problem{margin:6px 10px 10px;padding:7px 9px;border:1px solid #9a7a3d;color:#f3ddb0;background:#40351e}.ct-function-summary{font-size:.85em;color:var(--lex-muted)}
    .ct-changes-actions{display:flex;gap:8px;align-items:center}.ct-changes-actions button{padding:5px 9px}.ct-export-result{padding:10px 12px;border:1px solid var(--lex-border);background:var(--lex-panel);overflow-wrap:anywhere}
    @media(max-width:1050px){.ct-resource-layout{grid-template-columns:1fr}.ct-resource-detail{max-height:45vh}}@media(max-width:900px){.ct-split{grid-template-columns:1fr}.ct-list{max-height:35vh}.ct-audit-list li{grid-template-columns:60px 1fr}.ct-audit-list li span:last-child{grid-column:1/-1}}

<body><header id="lexeditor-shell"></header><main id="main"></main><script src="/shared/framework.js"></script><script>
  "use strict";
  const {el,clone}=LexeditorUI;
  const state={tab:"scenes",source:"mine",dashboard:null,dataMap:null,deployment:null,changes:null,exportResult:null,error:"",busy:false,
    archive:{query:"",offset:0,limit:250,data:null,selected:"",info:null},
    scenes:{query:"",offset:0,limit:100,data:null,original:null,selected:null,section:"header",exits:null,exitsOriginal:null,treasure:null,treasureOriginal:null,map:null,mapMode:"collision"},
    worlds:{data:null,original:null,selected:0,section:"header",table:null,tableOriginal:null,script:null},
    events:{query:"",offset:0,limit:100,data:null,selected:null,detail:null},messages:{catalog:[],path:"",data:null,original:null}};
  let searchTimer=0;const tabs=[{id:"scenes",label:"Scenes"},{id:"worlds",label:"Worlds"},{id:"text",label:"Text"},{id:"events",label:"Events"},{id:"resources",label:"Resources"},{id:"changes",label:"Changes"},{id:"deployment",label:"Deployment"},{id:"datamap",label:"Data Map"}];
  const formatBytes=value=>{const n=Number(value)||0;if(n<1024)return `${n} B`;const units=["KiB","MiB","GiB"];let size=n/1024,index=0;while(size>=1024&&index<units.length-1){size/=1024;index++}return `${size.toFixed(size>=100?0:size>=10?1:2)} ${units[index]}`};
  async function api(path,body){const response=await fetch(path,body===undefined?undefined:{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body)});const payload=await response.json();if(!response.ok)throw new Error(payload.error||`HTTP ${response.status}`);return payload}const refreshShell=()=>shell?.refresh?.();
  const changedRows=(data,original,key="rows")=>{const rows=data?.[key]||[],old=Object.fromEntries((original?.[key]||[]).map(row=>[String(row.id),row]));return rows.filter(row=>JSON.stringify(row.values)!==JSON.stringify(old[String(row.id)]?.values))};
  const sceneHeaderChanges=()=>changedRows(state.scenes.data,state.scenes.original),exitChanges=()=>changedRows(state.scenes.exits,state.scenes.exitsOriginal),treasureChanges=()=>changedRows(state.scenes.treasure,state.scenes.treasureOriginal),worldChanges=()=>changedRows(state.worlds.data,state.worlds.original),worldExitChanges=()=>changedRows(state.worlds.table,state.worlds.tableOriginal,"exits"),worldTriggerChanges=()=>changedRows(state.worlds.table,state.worlds.tableOriginal,"triggers"),worldAddressChanges=()=>changedRows(state.worlds.table,state.worlds.tableOriginal,"scriptAddresses");
  function messageChanges(){const current=state.messages.data?.rows||[],old=Object.fromEntries((state.messages.original?.rows||[]).map(row=>[String(row.id),row]));return current.filter(row=>row.text!==old[String(row.id)]?.text).map(row=>({id:row.id,text:row.text}))}const sceneTableDirty=()=>exitChanges().length+treasureChanges().length;const worldTableDirty=()=>worldExitChanges().length+worldTriggerChanges().length+worldAddressChanges().length;function dirtyCount(){return state.source==="mine"?sceneHeaderChanges().length+sceneTableDirty()+worldChanges().length+worldTableDirty()+messageChanges().length:0}
  async function loadDashboard(){state.dashboard=await api("/api/dashboard")}async function loadDataMap(){state.dataMap=await api("/api/datamap")}async function loadDeployment(){state.deployment=await api("/api/deployment")}async function loadChanges(){state.changes=await api("/api/changes")}
  async function loadArchive(){const p=new URLSearchParams({q:state.archive.query,offset:String(state.archive.offset),limit:String(state.archive.limit)});state.archive.data=await api(`/api/archive?${p}`);if(!state.archive.data.entries.some(row=>row.path===state.archive.selected))state.archive.selected=state.archive.data.entries[0]?.path||"";await loadResourceInfo()}
  async function loadResourceInfo(){if(!state.archive.selected){state.archive.info=null;return}state.archive.info=await api(`/api/resource?${new URLSearchParams({path:state.archive.selected,source:state.source})}`)}
  async function selectResource(path){state.archive.selected=path;state.archive.info=null;render();try{await loadResourceInfo()}catch(error){state.error=String(error?.message||error)}render()}
  async function loadScenes(){const p=new URLSearchParams({source:state.source,q:state.scenes.query,offset:String(state.scenes.offset),limit:String(state.scenes.limit)});const data=await api(`/api/scenes?${p}`);state.scenes.data=data;state.scenes.original=clone(data);if(!data.rows.some(row=>row.id===state.scenes.selected))state.scenes.selected=data.rows[0]?.id??null;await loadSceneSection()}
  async function loadSceneSection(){const id=state.scenes.selected;if(id===null||id===undefined)return;if(state.scenes.section==="exits"){const data=await api(`/api/exits?${new URLSearchParams({scene:String(id),source:state.source})}`);state.scenes.exits=data;state.scenes.exitsOriginal=clone(data)}else if(state.scenes.section==="treasure"){const data=await api(`/api/treasure?${new URLSearchParams({scene:String(id),source:state.source})}`);state.scenes.treasure=data;state.scenes.treasureOriginal=clone(data)}else if(state.scenes.section==="map")state.scenes.map=await api(`/api/scene-map?${new URLSearchParams({scene:String(id),source:state.source})}`)}
  async function selectScene(id){if(id===state.scenes.selected)return;if(sceneTableDirty()&&!confirm("Discard unsaved exit/treasure edits for this scene?"))return;state.scenes.selected=id;state.scenes.exits=state.scenes.exitsOriginal=state.scenes.treasure=state.scenes.treasureOriginal=state.scenes.map=null;state.error="";render();try{await loadSceneSection()}catch(error){state.error=String(error?.message||error)}render();refreshShell()}
  async function selectSceneSection(section){if(section===state.scenes.section)return;if(sceneTableDirty()&&!confirm("Discard unsaved exit/treasure edits?"))return;state.scenes.section=section;state.scenes.exits=state.scenes.exitsOriginal=state.scenes.treasure=state.scenes.treasureOriginal=state.scenes.map=null;state.error="";render();try{await loadSceneSection()}catch(error){state.error=String(error?.message||error)}render();refreshShell()}
  async function loadWorlds(){const data=await api(`/api/worlds?${new URLSearchParams({source:state.source})}`);state.worlds.data=data;state.worlds.original=clone(data);if(!data.rows.some(row=>row.id===state.worlds.selected))state.worlds.selected=data.rows[0]?.id??0;await loadWorldSection()}async function loadWorldSection(){if(state.worlds.selected===null)return;if(state.worlds.section==="navigation"){const data=await api(`/api/world-table?${new URLSearchParams({world:String(state.worlds.selected),source:state.source})}`);state.worlds.table=data;state.worlds.tableOriginal=clone(data)}else if(state.worlds.section==="script"){state.worlds.script=await api(`/api/world-script?${new URLSearchParams({world:String(state.worlds.selected),source:state.source})}`)}}
  async function selectWorld(id){if(id===state.worlds.selected)return;if(worldTableDirty()&&!confirm("Discard unsaved overworld navigation edits?"))return;state.worlds.selected=id;state.worlds.table=state.worlds.tableOriginal=state.worlds.script=null;state.error="";render();try{await loadWorldSection()}catch(error){state.error=String(error?.message||error)}render();refreshShell()}async function selectWorldSection(section){if(section===state.worlds.section)return;if(worldTableDirty()&&!confirm("Discard unsaved overworld navigation edits?"))return;state.worlds.section=section;state.worlds.table=state.worlds.tableOriginal=state.worlds.script=null;state.error="";render();try{await loadWorldSection()}catch(error){state.error=String(error?.message||error)}render();refreshShell()}
  async function loadEventDetail(id){if(id===null||id===undefined){state.events.detail=null;return}state.events.detail=await api(`/api/events?${new URLSearchParams({id:String(id),source:state.source})}`)}async function loadEvents(){const p=new URLSearchParams({source:state.source,q:state.events.query,offset:String(state.events.offset),limit:String(state.events.limit)});const data=await api(`/api/events?${p}`);state.events.data=data;if(!data.rows.some(row=>row.id===state.events.selected))state.events.selected=data.rows[0]?.id??null;await loadEventDetail(state.events.selected)}async function selectEvent(id){state.events.selected=id;state.events.detail=null;render();try{await loadEventDetail(id)}catch(error){state.error=String(error?.message||error)}render()}
  async function loadMessageCatalog(){const payload=await api("/api/messages/catalog");state.messages.catalog=payload.files;if(!payload.files.some(row=>row.path===state.messages.path))state.messages.path=payload.files[0]?.path||""}async function loadMessage(){if(!state.messages.path){state.messages.data=state.messages.original=null;return}const data=await api(`/api/messages?${new URLSearchParams({path:state.messages.path,source:state.source})}`);state.messages.data=data;state.messages.original=clone(data)}
  async function loadActive(){state.busy=true;state.error="";try{if(!state.dashboard)await loadDashboard();if(state.tab==="resources")await loadArchive();else if(state.tab==="scenes")await loadScenes();else if(state.tab==="worlds")await loadWorlds();else if(state.tab==="events")await loadEvents();else if(state.tab==="text"){if(!state.messages.catalog.length)await loadMessageCatalog();await loadMessage()}else if(state.tab==="changes")await loadChanges();else if(state.tab==="deployment")await loadDeployment();else if(state.tab==="datamap")await loadDataMap()}catch(error){state.error=String(error?.message||error)}finally{state.busy=false;render();refreshShell()}}
  function abandonAllowed(){return !dirtyCount()||confirm("Discard unsaved Chrono Trigger edits?")}async function navigate(value){if(value===state.tab)return;if(!abandonAllowed())return;state.tab=value;await loadActive()}
  async function selectSource(value){value=String(value||"mine");if(value===state.source)return;if(!abandonAllowed())return;state.source=value;state.scenes.data=state.scenes.original=state.scenes.exits=state.scenes.exitsOriginal=state.scenes.treasure=state.scenes.treasureOriginal=state.scenes.map=null;state.worlds.data=state.worlds.original=state.worlds.table=state.worlds.tableOriginal=state.worlds.script=null;state.events.data=state.events.detail=null;state.messages.data=state.messages.original=null;state.archive.info=null;state.deployment=state.changes=null;await loadActive()}
  function diffValues(row,original){const values={};for(const [key,value] of Object.entries(row.values||{}))if(value!==original?.values?.[key])values[key]=value;return values}
  async function saveSceneHeaders(){for(const row of sceneHeaderChanges()){const original=state.scenes.original.rows.find(value=>value.id===row.id);const saved=await api("/api/save/scene",{id:row.id,sha256:original.sha256,values:diffValues(row,original)});Object.assign(row,saved);Object.assign(original,clone(saved))}}async function saveExits(){const changes=exitChanges().map(row=>({row,original:state.scenes.exitsOriginal.rows.find(value=>value.id===row.id)}));if(!changes.length)return;let offsetSha=state.scenes.exitsOriginal.offsetSha256,dataSha=state.scenes.exitsOriginal.dataSha256,saved=null;for(const change of changes){saved=await api("/api/save/exit",{sceneId:state.scenes.selected,index:change.row.id,offsetSha256:offsetSha,dataSha256:dataSha,values:diffValues(change.row,change.original)});offsetSha=saved.offsetSha256;dataSha=saved.dataSha256}state.scenes.exits=saved;state.scenes.exitsOriginal=clone(saved)}async function saveTreasure(){const changes=treasureChanges().map(row=>({row,original:state.scenes.treasureOriginal.rows.find(value=>value.id===row.id)}));if(!changes.length)return;let offsetSha=state.scenes.treasureOriginal.offsetSha256,dataSha=state.scenes.treasureOriginal.dataSha256,saved=null;for(const change of changes){saved=await api("/api/save/treasure",{sceneId:state.scenes.selected,index:change.row.id,offsetSha256:offsetSha,dataSha256:dataSha,values:diffValues(change.row,change.original)});offsetSha=saved.offsetSha256;dataSha=saved.dataSha256}state.scenes.treasure=saved;state.scenes.treasureOriginal=clone(saved)}
  async function saveWorlds(){const changes=worldChanges().map(row=>({row,original:state.worlds.original.rows.find(value=>value.id===row.id)}));if(!changes.length)return;let hash=state.worlds.original.sha256,saved=null;for(const change of changes){saved=await api("/api/save/world",{id:change.row.id,sha256:hash,values:diffValues(change.row,change.original)});hash=saved.sha256}state.worlds.data=saved;state.worlds.original=clone(saved)}async function saveWorldTable(){if(!state.worlds.tableOriginal)return;const jobs=[];for(const row of worldExitChanges())jobs.push(["/api/save/world-exit",row,state.worlds.tableOriginal.exits.find(value=>value.id===row.id)]);for(const row of worldTriggerChanges())jobs.push(["/api/save/world-trigger",row,state.worlds.tableOriginal.triggers.find(value=>value.id===row.id)]);for(const row of worldAddressChanges())jobs.push(["/api/save/world-script-address",row,state.worlds.tableOriginal.scriptAddresses.find(value=>value.id===row.id)]);if(!jobs.length)return;let hash=state.worlds.tableOriginal.sha256,saved=null;for(const [path,row,original] of jobs){saved=await api(path,{worldId:state.worlds.selected,index:row.id,sha256:hash,values:diffValues(row,original)});hash=saved.sha256}state.worlds.table=saved;state.worlds.tableOriginal=clone(saved)}
  async function save(){if(state.source!=="mine"||state.busy)return;state.busy=true;state.error="";try{if(state.tab==="scenes"){await saveSceneHeaders();await saveExits();await saveTreasure()}else if(state.tab==="worlds"){await saveWorlds();await saveWorldTable()}else if(state.tab==="text"){const changes=messageChanges();if(changes.length){const saved=await api("/api/save/message",{path:state.messages.data.path,sha256:state.messages.original.sha256,changes});state.messages.data=saved;state.messages.original=clone(saved)}}await loadDashboard()}catch(error){state.error=String(error?.message||error)}finally{state.busy=false;render();refreshShell()}}async function discard(){if(state.tab==="scenes")await loadScenes();else if(state.tab==="worlds")await loadWorlds();else if(state.tab==="text")await loadMessage();render();refreshShell()}
  async function deployProject(){if(state.source!=="mine"||state.busy||!state.deployment?.canDeploy)return;if(!confirm("Deploy this project to CTExt and activate it in ctext.json load order?"))return;state.busy=true;state.error="";try{await api("/api/deployment/deploy",{});await Promise.all([loadDeployment(),loadDashboard()])}catch(error){state.error=String(error?.message||error)}finally{state.busy=false;render();refreshShell()}}
