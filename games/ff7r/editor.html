<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Lexeditor - FINAL FANTASY VII REMAKE INTERGRADE</title>
  <script>(()=>{const p=new URLSearchParams(location.search),k=p.get("lexTransition");if(!["load","resume"].includes(k))return;const r=document.documentElement;r.classList.add("lex-transition-entry");if(k==="load"){r.dataset.lexQuote=p.get("lexQuote")||"Loading editor…";r.classList.add("lex-transition-loading")}})()</script>
  <link rel="stylesheet" href="/shared/framework.css">
  <style>
    *{box-sizing:border-box}
    body{display:flex;flex-direction:column;height:100vh;margin:0;overflow:hidden;color:var(--lex-text);background:var(--lex-bg);font:15px/1.35 var(--lex-font)}
    main{flex:1;min-height:0;padding:var(--lex-panel-gap);overflow:hidden}
    .ff7r-view{display:flex;flex-direction:column;height:100%;min-height:0;gap:var(--lex-panel-gap)}.ff7r-tweaks-view>.ff7r-tweaks{flex:1 1 auto;min-height:0}
    .ff7r-toolbar{display:flex;gap:8px;align-items:center;min-height:38px;flex-wrap:wrap}
    .ff7r-toolbar label{font-weight:700}.ff7r-toolbar select{min-width:180px;max-width:min(720px,70vw)}
    .ff7r-toolbar input[type=search]{min-width:220px;flex:1}
    .ff7r-layout{height:100%;min-height:0}.ff7r-table,.ff7r-detail{height:100%;min-height:0}
    .ff7r-array{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:6px;width:100%}
    .ff7r-array label{display:flex;gap:5px;align-items:center;min-width:0}.ff7r-array label>span{min-width:2.5em;color:var(--lex-muted);font-size:.86em}
    .ff7r-array input,.ff7r-array select{min-width:0;width:100%}
    .ff7r-loot-slot{display:grid;grid-template-columns:minmax(180px,2fr) minmax(90px,1fr);gap:8px;width:100%;align-items:end}
    .ff7r-loot-slot label{display:flex;flex-direction:column;gap:3px;min-width:0}.ff7r-loot-slot label>span{font-size:.8em;color:var(--lex-muted);font-weight:700}
    .ff7r-loot-slot select,.ff7r-loot-slot input{width:100%;min-width:0}
    .ff7r-textarea{display:block;width:100%;min-height:110px;resize:vertical;font:inherit;line-height:1.35}
    .ff7r-subtext{min-height:72px}
    .ff7r-resolved{display:flex;flex-direction:column;gap:2px;min-width:0}
    .ff7r-resolved small{color:var(--lex-muted);overflow-wrap:anywhere}
    .ff7r-actions{display:flex;flex-wrap:wrap;gap:8px}.ff7r-actions button{padding:7px 12px}.ff7r-description{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:8px;min-width:0}.ff7r-description-text{min-width:0;overflow-wrap:anywhere}.ff7r-description-edit{padding:4px 10px;white-space:nowrap}.ff7r-description-input{display:block;width:100%;min-width:0;resize:vertical;font:inherit;line-height:1.35}
    .ff7r-message{white-space:pre-wrap;overflow-wrap:anywhere}.ff7r-error{color:var(--lex-danger,#b42318)}
    @media(max-width:700px){.ff7r-loot-slot{grid-template-columns:1fr}}
  </style>
</head>
<body>
  <header id="lexeditor-shell"></header>
  <main id="main"></main>
  <script src="/shared/framework.js"></script>
  <script>
  "use strict";
  const {el,columnList,columnPreferences,detailPanel,detailSection,detailField,readonlyField,recordId,infoHelp,infoIcon,panelLayout,clone,EditHistory}=LexeditorUI;
  const $=selector=>document.querySelector(selector);
  async function api(path,body){const response=await fetch(path,body===undefined?undefined:{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body)});let payload={};try{payload=await response.json()}catch(_error){}if(!response.ok)throw new Error(payload.error||response.statusText);return payload}

  const state={modOnly:false,textPacks:null,textResource:"",textBusy:false,reshade:null,curatedQuery:"",curatedSort:{key:"id",dir:1},
    tab:"data",catalog:null,info:null,dataMap:null,activeSource:"mine",busy:false,error:"",projectMessage:"",
    asset:"",data:null,dataBaseline:null,selected:0,query:"",sort:{key:"tag",dir:1},
    economy:null,economyKey:"",economyError:"",economyTable:"",economyQuery:"",economySort:{key:"name",dir:1},
    loot:null,lootKey:"",lootError:"",lootQuery:"",lootSort:{key:"tag",dir:1},
    textLanguage:"US",textAsset:"",textData:null,textBaseline:null,textSelected:0,textQuery:"",textSort:{key:"key",dir:1},
    mapQuery:"",mapStatus:"",mapPage:0,mapSort:["filename",1]
  };
  // An ID is four or five digits wide, so it takes four or five digits of the
  // table. Left to share the grid it took a fifth of the width and pushed the
  // record name into a column too narrow to read.
  const dataColumns=[{key:"id",label:"ID",numeric:true,numberedId:true,sortable:true,width:"74px"},{key:"tag",label:"Record",sortable:true,width:"minmax(12em,1fr)"}];
  const economyColumns=[{key:"tag",label:"ID",sortable:true,width:"minmax(10em,.8fr)"},{key:"name",label:"Item",sortable:true,width:"minmax(14em,1.2fr)"},{key:"buy",label:"Buy",numeric:true,sortable:true},{key:"sale",label:"Sell",numeric:true,sortable:true},{key:"maxCount",label:"Carry Cap",numeric:true,sortable:true}];
  // Four columns at fourteen ems each did not fit the list panel, so the Steal
  // column was cut in half by the panel edge. The minimums are sized so all
  // four fit the default split; the cells ellipsise if a value is longer.
  const lootColumns=[{key:"tag",label:"Enemy / Battle ID",sortable:true,width:"minmax(9em,.9fr)"},{key:"normal",label:"Normal",sortable:true,width:"minmax(8em,1fr)"},{key:"rare",label:"Rare",sortable:true,width:"minmax(8em,1fr)"},{key:"steal",label:"Steal",sortable:true,width:"minmax(8em,1fr)"}];
  const textColumns=[{key:"number",label:"ID",numeric:true,numberedId:true,sortable:true,width:"minmax(4em,max-content)"},{key:"resource",label:"Resource",sortable:true,width:"minmax(10em,.7fr)"},{key:"key",label:"Text ID",sortable:true,width:"minmax(12em,.8fr)"},{key:"text",label:"Text",sortable:true,width:"minmax(16em,1.2fr)"}];
  const dataPrefs=columnPreferences("ff7r-records",dataColumns,()=>render());
  const economyPrefs=columnPreferences("ff7r-economy",economyColumns,()=>render());
  const lootPrefs=columnPreferences("ff7r-loot",lootColumns,()=>render());
  const textPrefs=columnPreferences("ff7r-text-records",textColumns,()=>render());
  const assets=()=>state.catalog?.assets||[];
  if(!state.pages)state.pages={};
  const isTweak=item=>String(item.group||"").startsWith("Lexeditor ");
  const tweakAssets=()=>assets().filter(isTweak);
  const gameAssets=()=>assets().filter(item=>!isTweak(item));
  const textAssets=()=>state.catalog?.textAssets||[];
  const currentAsset=()=>assets().find(row=>row.asset===state.asset)||assets()[0]||null;
  const currentTextAsset=()=>textAssets().find(row=>row.asset===state.textAsset)||null;
  const records=()=>state.data?.records||[];
  // Every resource for the chosen language is loaded together, so the Text tab
  // is one list of all the game's text with the resource as an ordinary column.
  // Picking a resource before being allowed to look at anything was the old
  // shape, and it meant a search could only ever find what was already open.
  const textPacks=()=>Object.values(state.textPacks||{});
  const textRecords=()=>textPacks().flatMap(pack=>pack.data.records.map(row=>({
    row, asset:pack.item.asset, resource:pack.item.name,
    id:`${pack.item.asset}#${row.id}`,
    number:row.id, key:row.key, text:row.text, subentries:row.subentries})));
  const selectedRecord=()=>records().find(row=>row.id===state.selected)||records()[0]||null;
  const selectedTextRecord=()=>textRecords().find(row=>row.id===state.textSelected)||textRecords()[0]||null;
  const textPackOf=view=>state.textPacks?.[view?.asset]||null;
  const comparable=value=>JSON.stringify(value);
  const refreshShell=()=>shell?.refresh?.();
  const sourceSuffix=()=>state.activeSource==="vanilla"?"&source=vanilla":"";
  const semanticKey=()=>`${state.activeSource}:${state.textLanguage||"US"}`;
  const property=name=>state.data?.properties?.find(prop=>prop.name===name)||null;

  function dataEdits(){return diffRecords(state.data,state.dataBaseline)}
  // Both the Misc tab and every tweak group on the Tweaks page compare a loaded
  // DataObject against the copy it was loaded as. One routine, so a tweak edit
  // is written back exactly the way a Misc edit is.
  function diffRecords(current,baseline){
    if(state.activeSource!=="mine"||!current||!baseline)return[];
    const out=[];
    for(let i=0;i<current.records.length;i++){
      const row=current.records[i],base=baseline.records[i];if(!base)continue;
      for(const prop of current.properties){
        if(!prop.editable)continue;
        const value=row.values[prop.name],old=base.values[prop.name];
        if(prop.array){const count=Math.min(value.length,old.length);for(let j=0;j<count;j++)if(comparable(value[j])!==comparable(old[j]))out.push({entry:i,property:prop.name,index:j,value:value[j]})}
        else if(comparable(value)!==comparable(old))out.push({entry:i,property:prop.name,value});
      }
    }
    return out;
  }
  function textEdits(){return textEditGroups().flatMap(group=>group.edits)}
  // Every resource is loaded, so a save writes each one that changed rather
  // than the single resource that happened to be open.
  function textEditGroups(){
    if(state.activeSource!=="mine")return[];
    return textPacks()
      .map(pack=>({pack,edits:textDiff(pack.data,pack.baseline)}))
      .filter(group=>group.edits.length);
  }
  function textDiff(data,baseline){
    if(!data||!baseline)return[];
    const out=[];
    for(let i=0;i<data.records.length;i++){
      const row=data.records[i],base=baseline.records[i];if(!base)continue;
      if(row.text!==base.text)out.push({entry:i,text:row.text});
      const baseSubs=new Map((base.subentries||[]).map(sub=>[sub.id,sub.text]));
      for(const sub of row.subentries||[])if(baseSubs.has(sub.id)&&sub.text!==baseSubs.get(sub.id))out.push({entry:i,subId:sub.id,text:sub.text});
    }
    return out;
  }
  const dirtyCount=()=>dataEdits().length+textEdits().length+tweakEditGroups().reduce((total,group)=>total+group.edits.length,0);

  function flattenStrings(value,out=[]){if(typeof value==="string")out.push(value);else if(Array.isArray(value))for(const child of value)flattenStrings(child,out);else if(value&&typeof value==="object")for(const child of Object.values(value))flattenStrings(child,out);return out}
  function resolvedText(value){return typeof value==="string"?state.data?.textLookup?.[value]||"":""}
  function compareValues(a,b){if(a===b)return 0;if(a===undefined||a===null||a==="—")return 1;if(b===undefined||b===null||b==="—")return-1;if(typeof a==="number"&&typeof b==="number")return a-b;return String(a).localeCompare(String(b),undefined,{numeric:true,sensitivity:"base"})}
  function sortedRows(){
    const q=state.query.toLocaleLowerCase();
    return [...records()].filter(row=>{
      if(!q)return true;
      const values=flattenStrings(row.values);
      const resolved=values.map(value=>state.data?.textLookup?.[value]||"");
      return `${row.id} ${row.tag} ${values.join(" ")} ${resolved.join(" ")}`.toLocaleLowerCase().includes(q);
    }).sort((a,b)=>compareValues(a[state.sort.key],b[state.sort.key])*state.sort.dir);
  }
  function sortedTextRows(){
    const q=state.textQuery.toLocaleLowerCase();
    return textRecords()
      .filter(row=>!state.textResource||row.asset===state.textResource)
      .filter(row=>!q||`${row.number} ${row.resource} ${row.key} ${row.text} ${(row.subentries||[]).map(sub=>`${sub.id} ${sub.text}`).join(" ")}`.toLocaleLowerCase().includes(q))
      .sort((a,b)=>compareValues(a[state.textSort.key],b[state.textSort.key])*state.textSort.dir);
  }

  async function confirmReplace(kind){
    const count=kind==="text"?textEdits().length:dataEdits().length;
    if(!count)return true;
    return LexeditorUI.confirmAction({
      title:"Discard unsaved changes?",
      message:`${count} unsaved ${kind==="text"?"text":"game-data"} change${count===1?"":"s"} would be lost by opening another resource.`,
      confirmLabel:"Discard and open",cancelLabel:"Keep editing"});
  }
  async function loadAsset(asset=state.asset){
    if(!asset)return;
    state.busy=true;state.error="";render();
    try{state.data=await api(`/api/data?asset=${encodeURIComponent(asset)}${sourceSuffix()}&language=${encodeURIComponent(state.textLanguage||"US")}`);state.dataBaseline=clone(state.data);state.selected=state.data.records[0]?.id??0;state.asset=asset;state.query=""}
    catch(error){state.data=null;state.dataBaseline=null;state.error=error.message}
    finally{state.busy=false;render();refreshShell()}
  }
  async function selectAsset(asset){if(asset===state.asset)return true;if(!await confirmReplace("data"))return false;state.asset=asset;await loadAsset(asset);return !!state.data}

  async function loadEconomy(){
    const key=semanticKey();
    if(state.economyKey!==key){
      state.busy=true;state.economyError="";render();
      try{state.economy=await api(`/api/economy?language=${encodeURIComponent(state.textLanguage||"US")}${sourceSuffix()}`);state.economyKey=key}
      catch(error){state.economy=null;state.economyError=error.message}
      finally{state.busy=false;render()}
    }
    const tables=(state.economy?.tables||[]).filter(table=>table.available);
    if(!tables.length)return true;
    if(!tables.some(table=>table.asset===state.economyTable))state.economyTable=tables[0].asset;
    if(state.data?.asset!==state.economyTable){if(!await selectAsset(state.economyTable))return false}
    return true;
  }
  async function selectEconomyTable(asset){if(asset===state.economyTable)return;const previous=state.economyTable;state.economyTable=asset;if(!await selectAsset(asset))state.economyTable=previous;render()}
  async function loadLoot(){
    const key=semanticKey();
    if(state.lootKey!==key){
      state.busy=true;state.lootError="";render();
      try{state.loot=await api(`/api/loot?language=${encodeURIComponent(state.textLanguage||"US")}${sourceSuffix()}`);state.lootKey=key}
      catch(error){state.loot=null;state.lootError=error.message}
      finally{state.busy=false;render()}
    }
    if(!state.loot?.available||!state.loot.asset)return true;
    if(state.data?.asset!==state.loot.asset){if(!await selectAsset(state.loot.asset))return false}
    return true;
  }

  // Thirty-seven resources per language, read together. Requesting them in
  // parallel is what makes one list of all the game's text practical; asking
  // for them one after another took long enough that the tab had to make you
  // choose first, which is the shape this replaces.
  async function loadAllText(language=state.textLanguage){
    const list=textAssets().filter(row=>row.language===language);
    if(!list.length){state.textPacks={};return}
    state.textBusy=true;state.error="";render();
    try{
      const packs={};
      await Promise.all(list.map(async item=>{
        try{
          const data=await api(`/api/text?asset=${encodeURIComponent(item.asset)}${sourceSuffix()}`);
          packs[item.asset]={item,data,baseline:clone(data)};
        }catch(error){state.error=error.message}
      }));
      state.textPacks=packs;
      const resident=residentTextAsset();
      if(resident&&packs[resident.asset]){
        state.textAsset=resident.asset;
        state.textData=packs[resident.asset].data;
        state.textBaseline=packs[resident.asset].baseline;
      }
      const first=textRecords()[0];
      if(!textRecords().some(row=>row.id===state.textSelected))state.textSelected=first?.id??null;
    }catch(error){state.error=error.message}
    finally{state.textBusy=false;render();refreshShell()}
  }
  // One resource at a time, kept only for the callers that still name one.
  async function loadTextAsset(asset=state.textAsset){
    if(!asset)return;
    state.busy=true;state.error="";render();
    try{const data=await api(`/api/text?asset=${encodeURIComponent(asset)}${sourceSuffix()}`);
      const item=textAssets().find(row=>row.asset===asset)||{asset,name:asset};
      state.textPacks={...(state.textPacks||{}),[asset]:{item,data,baseline:clone(data)}};
      state.textData=data;state.textBaseline=clone(data);
      state.textSelected=`${asset}#${data.records[0]?.id??0}`;state.textAsset=asset;state.textQuery="";
      if(data.language)state.textLanguage=data.language}
    catch(error){state.textData=null;state.textBaseline=null;state.error=error.message}
    finally{state.busy=false;render();refreshShell()}
  }
  async function selectTextAsset(asset){if(asset===state.textAsset)return;if(!await confirmReplace("text"))return;state.textAsset=asset;await loadTextAsset(asset)}
  async function selectTextLanguage(language){
    if(language===state.textLanguage)return;
    if(!await confirmReplace("text"))return;
    state.textLanguage=language;state.economyKey="";state.lootKey="";
    state.textAsset="";state.textData=null;state.textBaseline=null;state.textPacks=null;
    if(state.data)await loadAsset(state.asset);
    if(state.tab==="text")await loadAllText(language);else render();
    if(state.tab==="economy")await loadEconomy();if(state.tab==="loot")await loadLoot();
  }

  function setScalar(row,prop,value){row.values[prop.name]=value;refreshShell()}
  function setArrayValue(row,prop,index,value){if(!Array.isArray(row.values[prop.name]))return;row.values[prop.name][index]=value;refreshShell()}
  function numericInput(row,prop,index=null){const current=index===null?row.values[prop.name]:row.values[prop.name][index];const attrs={type:"number",value:current,disabled:state.activeSource!=="mine"||!prop.editable,oninput:event=>{if(event.target.value==="")return;const value=prop.type==="FLOAT"?Number(event.target.value):Number.parseInt(event.target.value,10);if(index===null)setScalar(row,prop,value);else setArrayValue(row,prop,index,value)}};const low=semanticMin(prop),high=semanticMax(prop);if(low!==null&&low!==undefined)attrs.min=low;if(high!==null&&high!==undefined)attrs.max=high;attrs.step=prop.type==="FLOAT"?"any":1;return el("input",attrs)}
  function percentInput(row,prop,index){const current=row.values[prop.name]?.[index]??0;return el("input",{type:"number",min:0,max:100,step:1,value:current,disabled:state.activeSource!=="mine"||!prop.editable,oninput:event=>{if(event.target.value==="")return;const value=Number.parseInt(event.target.value,10);if(Number.isFinite(value)&&value>=0&&value<=100)setArrayValue(row,prop,index,value)},onchange:event=>{let value=Number.parseInt(event.target.value,10);if(!Number.isFinite(value))value=current;value=Math.max(0,Math.min(100,value));event.target.value=String(value);setArrayValue(row,prop,index,value)}})}
  function boolInput(row,prop,index=null){const current=index===null?row.values[prop.name]:row.values[prop.name][index];return el("input",{type:"checkbox",checked:!!current,disabled:state.activeSource!=="mine"||!prop.editable,onchange:event=>{if(index===null)setScalar(row,prop,event.target.checked);else setArrayValue(row,prop,index,event.target.checked)}})}
  function nameInput(row,prop,index=null,source=null){const current=index===null?row.values[prop.name]:row.values[prop.name][index];const select=el("select",{disabled:state.activeSource!=="mine"||!prop.editable,onchange:event=>{if(index===null)setScalar(row,prop,event.target.value);else setArrayValue(row,prop,index,event.target.value)}});for(const name of (source||state.data).names){const option=el("option",{value:name},name);option.selected=name===current;select.append(option)}return select}
  function semanticItemInput(row,prop,index){const current=row.values[prop.name]?.[index]??"";const choices=[...(state.loot?.itemChoices||[])];if(current&&!choices.some(choice=>choice.id===current))choices.unshift({id:current,name:current});const select=el("select",{disabled:state.activeSource!=="mine"||!prop.editable,onchange:event=>setArrayValue(row,prop,index,event.target.value)});for(const choice of choices){const option=el("option",{value:choice.id},choice.name&&choice.name!==choice.id?`${choice.name} (${choice.id})`:choice.id);option.selected=choice.id===current;select.append(option)}return select}
  function readonlyResolved(value){const resolved=resolvedText(value);return resolved?el("div",{class:"ff7r-resolved"},readonlyField(resolved),el("small",{},value)):readonlyField(String(value??""))}
  // A value's storage type is not always the type a person should edit. CanSale
  // is stored as a byte but only ever means yes or no, so it is presented as a
  // switch and written back as 0 or 1. Add a field here when the schema type is
  // wider than the meaning.
  // The generic Misc tab can open any DataObject, but "open the table called
  // PlayerParameter" is not an answer to "where do I edit character stats".
  // These are the tables worth their own tab, with the columns that make the
  // list readable at a glance; everything else stays one click away in Misc.
  // Property names are the installed game's own, including Square's spelling
  // of Spilit for Spirit.
  const CURATED_TABLES=[
    {id:"characters",label:"Characters",basename:"playerparameter",
     noun:"stat rows",columns:["HPMax","MPMax","Strength","Magic","Vitality","Spilit"]},
    {id:"enemies",label:"Enemies",basename:"enemyparameter",
     noun:"enemies",columns:["HPMax","BPMax","Strength","Magic","Vitality","Spilit"]},
    {id:"abilities",label:"Abilities",basename:"battleability",
     noun:"abilities",columns:["ATB"]},
  ];
  const curatedSpec=tab=>CURATED_TABLES.find(entry=>entry.id===tab)||null;
  const curatedAsset=spec=>assets().find(item=>
    String(item.asset||"").split("/").pop().toLowerCase().replace(/\.uasset$/,"")===spec.basename)||null;
  const SEMANTIC_TYPES={CanSale:"BOOL"};
  // The storage type is a signed 32-bit integer, so the schema's honest range is
  // plus or minus two billion. A price is not, and a slider handed that range
  // put -24832854 into a Buy Price on a drag to the middle. These are the
  // meanings, not the storage limits, and they only ever narrow.
  const SEMANTIC_BOUNDS={BuyValue:{min:0,max:99999999},SaleValue:{min:0,max:99999999},
    MaxCount:{min:0,max:99}};
  function semanticMin(prop){
    const bound=SEMANTIC_BOUNDS[prop.name];
    if(!bound)return prop.min;
    return prop.min===null||prop.min===undefined?bound.min:Math.max(Number(prop.min),bound.min);
  }
  function semanticMax(prop){
    const bound=SEMANTIC_BOUNDS[prop.name];
    if(!bound)return prop.max;
    return prop.max===null||prop.max===undefined?bound.max:Math.min(Number(prop.max),bound.max);
  }
  function semanticType(prop){
    const wanted=SEMANTIC_TYPES[prop.name];
    if(!wanted)return prop.type;
    if(wanted==="BOOL"&&["BYTE","INT16","UINT16","INT32"].includes(prop.type))return "BOOL";
    return prop.type;
  }
  function byteBoolInput(row,prop,index=null){
    const current=index===null?row.values[prop.name]:row.values[prop.name][index];
    return el("input",{type:"checkbox",checked:Number(current)!==0,
      disabled:state.activeSource!=="mine"||!prop.editable,
      "aria-label":prop.label||prop.name,
      onchange:event=>{const value=event.target.checked?1:0;
        if(index===null)setScalar(row,prop,value);else setArrayValue(row,prop,index,value)}});
  }

  function lootPanel(){if(state.busy&&state.tab==="loot")return loadingPanel("Loading enemy loot","Discovering BattleItemPossession and validated drop arrays…");if(state.lootError)return errorPanel(state.lootError);if(state.loot&&!state.loot.available)return loadingPanel("Enemy loot unavailable",state.loot.reason||"BattleItemPossession was not found or did not contain recognized drop/steal arrays.");if(!state.loot)return loadingPanel("Enemy loot","Open this tab to discover the installed FF7R loot table.");if(state.data?.asset!==state.loot.asset)return loadingPanel("Loading enemy loot","Reading BattleItemPossession…");return el("div",{class:"ff7r-view"},pagedTable({id:"loot",noun:"enemies",

  function languages(){return [...new Set(textAssets().map(row=>row.language).filter(Boolean))].sort()}
  function textAssetsForLanguage(){return textAssets().filter(row=>row.language===state.textLanguage)}
  // Country flags for the shipped language codes; an unlisted code keeps its
  // own letters rather than showing a wrong flag.
  const LANGUAGE_FLAGS={US:"🇺🇸",UK:"🇬🇧",GB:"🇬🇧",FR:"🇫🇷",DE:"🇩🇪",IT:"🇮🇹",ES:"🇪🇸",JP:"🇯🇵",KR:"🇰🇷",CN:"🇨🇳",TW:"🇹🇼",BR:"🇧🇷",RU:"🇷🇺",PL:"🇵🇱"};
  function languageLabel(code){
    const flag=LANGUAGE_FLAGS[String(code||"").toUpperCase()];
    return flag?`${flag} ${code}`:String(code||"");
  }
  function textLanguageBar(){
    return LexeditorUI.subtabBar({

  }
  // Every resource is already loaded, so this narrows the one list rather than

      label:"Resource","aria-label":"FF7 Remake text resource",
      title:"Narrow the list to one text resource",
      disabled:state.textBusy,
      value:state.textResource,
      options:[{id:"",label:"All resources"},...textAssetsForLanguage().map(item=>({id:item.asset,
        label:item.group&&item.group!=="Text"?`${item.group} / ${item.name}`:item.name}))],
      change:value=>{state.textResource=String(value||"");state.pages.text=0;render()},
    });
  }
  function textArea(value,oninput,sub=false){const area=el("textarea",{class:`ff7r-textarea${sub?" ff7r-subtext":""}`,value:value??"",disabled:state.activeSource!=="mine",oninput:event=>oninput(event.target.value)});area.value=value??"";return area}

      detailField({label:"TEXT ID",dataType:"STRING",control:readonlyField(row.key)}),
      detailField({label:"RESOURCE",dataType:"STRING",control:readonlyField(view.resource||view.asset),

  }
  function textTablePanel(){const rows=sortedTextRows();return columnList({rows,key:row=>row.id,selected:state.textSelected,select:row=>{state.textSelected=row.id;render()},sortState:state.textSort,sort:key=>{state.textSort=state.textSort.key===key?{key,dir:-state.textSort.dir}:{key,dir:1};render()},columnPreferences:textPrefs,columns:textColumns,class:"ff7r-table","aria-label":"FF7 Remake localized text entries"})}
  function textPanel(){if(!textAssets().length)return loadingPanel("No text resources","No paired GameContents/Text .uasset/.uexp resources were found in the indexed FF7R PAKs.");if(state.textBusy||!state.textPacks)return loadingPanel("Loading text","Reading every localized text resource for this language…");if(state.error&&!textRecords().length)return errorPanel(state.error);return el("div",{class:"ff7r-view"},textLanguageBar(),pagedTable({id:"text",noun:"entries",

  function openMapRow(row){const asset=row.target||row.view;if(!asset)return;if(textAssets().some(entry=>entry.asset===asset)){state.textResource=asset;return navigate("text")}if(assets().some(entry=>entry.asset===asset)){state.asset=asset;state.data=null;state.dataBaseline=null;return navigate("data")}return navigate(asset)}
  function dataMapPanel(){const rows=state.dataMap?.rows||[];return LexeditorUI.dataMap({rows,open:openMapRow,page:state.mapPage,query:state.mapQuery,status:state.mapStatus,sort:state.mapSort,changePage:value=>{state.mapPage=value;render()},changeQuery:value=>{state.mapQuery=value;state.mapPage=0;render()},changeStatus:value=>{state.mapStatus=value;state.mapPage=0;render()},changeSort:key=>{state.mapSort=state.mapSort[0]===key?[key,-state.mapSort[1]]:[key,1];render()}}).content}
  async function projectAction(kind){if(dirtyCount()){state.projectMessage="Save or discard all current gameplay/text changes before building or deploying.";render();return}state.busy=true;state.projectMessage=`${kind==="deploy"?"Building and deploying":"Building"}…`;render();try{const result=await api(`/api/${kind}`,{});state.projectMessage=`${kind==="deploy"?"Deployed":"Built"}: ${result.path}`;state.info=await api("/api/info")}catch(error){state.projectMessage=`Error: ${error.message}`}finally{state.busy=false;render()}}
  function projectPanel(){const info=state.info||{};return detailPanel({className:"ff7r-detail",title:"Mod Project",meta:"Gameplay and text edits share one project; installed base PAKs are never overwritten",body:[detailSection({title:"PROJECT",body:[detailField({label:"ROOT",control:readonlyField(info.projectRoot||"—")}),detailField({label:"BUILD",control:readonlyField(info.buildPath||"—")}),detailField({label:"DEPLOY",control:readonlyField(info.deployPath||"—")}),detailField({label:"MOUNT",control:readonlyField(info.pakMountPoint||"../../../")})]}),detailSection({title:"ACTIONS",body:[detailField({label:"MOD PAK",control:el("div",{class:"ff7r-actions"},el("button",{type:"button",disabled:state.busy,onclick:()=>projectAction("build")},"Build Mod PAK"),el("button",{type:"button",disabled:state.busy,onclick:()=>projectAction("deploy")},"Build & Deploy to ~mods"))}),detailField({label:"STATUS",control:el("div",{class:"ff7r-message"},state.projectMessage||"Save edits, then build a separate _P.pak or explicitly deploy it to FF7R's ~mods folder.")})]})]})}
  function infoPanel(){const info=state.info||{};return detailPanel({className:"ff7r-detail",title:"Information",icon:infoIcon(),meta:"FINAL FANTASY VII REMAKE INTERGRADE",body:[detailSection({title:"GAME",body:[detailField({label:"ROOT",control:readonlyField(info.gameRoot||"—")}),detailField({label:"DATAOBJECTS",control:readonlyField(String(info.dataObjects??"—"))}),detailField({label:"TEXT RESOURCES",control:readonlyField(String(info.textResources??"—"))}),detailField({label:"LANGUAGES",control:readonlyField((info.textLanguages||[]).join(", ")||"—")}),detailField({label:"PAK VERSION",control:readonlyField(info.pakVersion||"Detected when archives are indexed")})]}),detailSection({title:"SEMANTIC EDITORS",body:[detailField({label:"ITEMS",control:readonlyField("Validated BuyValue / SaleValue / CanSale / MaxCount fields from installed Item, Equipment, and Materia DataObjects")}),detailField({label:"ENEMY LOOT",control:readonlyField("BattleItemPossession normal/rare drop item arrays, raw percent chances, and steal item/quantity arrays")})]}),detailSection({title:"HELPER",body:[detailField({label:"REPAK",control:readonlyField(info.helper?.installed?`${info.helper.version} installed`:"Not installed")}),detailField({label:"MOUNT POINT",control:readonlyField(info.pakMountPoint||"../../../")})]}),detailSection({title:"EDITOR COVERAGE",body:[detailField({label:"GAMEPLAY",control:readonlyField("DataObject booleans, bytes, 16/32-bit numbers, floats, existing FNames and fixed array elements")}),detailField({label:"TEXT",control:readonlyField("Variable-length localized text and existing text sub-entry contents")}),detailField({label:"READ ONLY",control:readonlyField("DataObject structural row/property changes, array resizing, text IDs and text entry structure")})]}),
      detailSection({title:"PROJECT",body:[detailField({label:"ROOT",control:readonlyField(info.projectRoot||"—")}),detailField({label:"BUILD",control:readonlyField(info.buildPath||"—")}),detailField({label:"DEPLOY",control:readonlyField(info.deployPath||"—")}),detailField({label:"MOD PAK",control:el("div",{class:"ff7r-actions"},el("button",{type:"button",disabled:state.busy,onclick:()=>projectAction("build")},"Build Mod PAK"),el("button",{type:"button",disabled:state.busy,onclick:()=>projectAction("deploy")},"Build & Deploy to ~mods"))}),detailField({label:"STATUS",control:el("div",{class:"ff7r-message"},state.projectMessage||"Save edits, then build a separate _P.pak or explicitly deploy it to FF7R's ~mods folder.")})]}),
      LexeditorUI.modLoaderSection({
        loader:"Unreal reads loose PAK archives from End/Content/Paks/~mods. No external loader or script hook is required.",
        output:"Lexeditor packs your project's content folder into Lexeditor-FF7R_P.pak and, on an explicit Deploy, copies that one file into ~mods.",

        removal:"Delete Lexeditor-FF7R_P.pak from ~mods. The game returns to stock immediately; your project keeps the edits.",

  function render(){let content;const curated=curatedSpec(state.tab);if(curated)content=curatedPanel(curated);else if(state.tab==="datamap")content=dataMapPanel();else if(state.tab==="tweaks")content=tweaksPanel();else if(state.tab==="info")content=infoPanel();else if(state.tab==="text")content=textPanel();else if(state.tab==="economy")content=economyPanel();else if(state.tab==="loot")content=lootPanel();else content=dataPanel();$("#main").replaceChildren(content);refreshShell()}
  async function navigate(tab){const previous=state.tab;state.tab=tab;render();if(tab==="text"){if(!state.textPacks)await loadAllText();else render()}else if(tab==="economy"){if(!await loadEconomy()){state.tab=previous;render()}else{await ensureResidentText();render()}}else if(tab==="loot"){if(!await loadLoot()){state.tab=previous;render()}}
    else if(curatedSpec(tab)){
      const spec=curatedSpec(tab);
      const item=curatedAsset(spec);
      if(item&&(state.asset!==item.asset||!state.data)){
        state.asset=item.asset;await loadAsset(item.asset);
      }
      state.pages[tab]=0;render();
    }
    else if(tab==="tweaks"){
      if(!state.reshade)await loadReshade();
      if(!state.tweaks)await loadAllTweaks();else render();
    }
    else if(tab==="data"){
      // Opening this tab loaded nothing, so the table sat empty behind the
      // picker until the user changed the dropdown by hand.
      const list=gameAssets();
      const wanted=list.some(item=>item.asset===state.asset)?state.asset:(list[0]?.asset||"");
      if(wanted&&(state.asset!==wanted||!state.data)){state.asset=wanted;await loadAsset(wanted);render()}
    }}

  async function save(){
    if(state.activeSource!=="mine")return;
    const gameplay=dataEdits(),text=textEdits(),tweaks=tweakEditGroups();
    if(!gameplay.length&&!text.length&&!tweaks.length)return;
    state.busy=true;state.error="";render();
    try{
      if(gameplay.length){const result=await api("/api/save",{asset:state.data.asset,sourceSha256:state.data.sourceSha256,activeSha256:state.data.activeSha256,edits:gameplay});state.data.activeSha256=result.activeSha256;state.data.usingProject=true;state.dataBaseline=clone(state.data);state.projectMessage=`Saved ${result.saved} gameplay value${result.saved===1?"":"s"}.`}
      for(const group of tweakEditGroups()){
        const data=group.entry.data;
        const result=await api("/api/save",{asset:data.asset,sourceSha256:data.sourceSha256,activeSha256:data.activeSha256,edits:group.edits});
        data.activeSha256=result.activeSha256;data.usingProject=true;group.entry.baseline=clone(data);
        state.projectMessage=`${state.projectMessage?state.projectMessage+" ":""}Saved ${result.saved} value${result.saved===1?"":"s"} in ${group.entry.item.name||data.asset}.`;
      }
      for(const group of textEditGroups()){
        const data=group.pack.data;
        const result=await api("/api/text/save",{asset:data.asset,sourceUassetSha256:data.sourceUassetSha256,sourceUexpSha256:data.sourceUexpSha256,activeUassetSha256:data.activeUassetSha256,activeUexpSha256:data.activeUexpSha256,edits:group.edits});
        data.activeUassetSha256=result.activeUassetSha256;data.activeUexpSha256=result.activeUexpSha256;data.usingProject=true;
        group.pack.baseline=clone(data);
        if(state.textData===data)state.textBaseline=clone(data);
        state.projectMessage=`${state.projectMessage?state.projectMessage+" ":""}Saved ${result.saved} text value${result.saved===1?"":"s"} in ${group.pack.item.name||data.asset}.`;
      }
      editHistory.clear();
    }catch(error){state.error=error.message;throw error}
    finally{state.busy=false;render();refreshShell()}
  }
  async function discard(){if(state.data&&state.dataBaseline)state.data=clone(state.dataBaseline);for(const pack of textPacks())pack.data.records=clone(pack.baseline.records);for(const entry of Object.values(state.tweaks||{}))entry.data=clone(entry.baseline);if(state.textData&&state.textBaseline)state.textData=clone(state.textBaseline);editHistory.clear();render();refreshShell()}
  const editHistory=new EditHistory({capture:()=>({data:state.data?clone(state.data.records):null,text:Object.fromEntries(textPacks().map(pack=>[pack.item.asset,clone(pack.data.records)]))}),restore:snapshot=>{if(state.data&&snapshot?.data)state.data.records=clone(snapshot.data);for(const [asset,records] of Object.entries(snapshot?.text||{})){const pack=state.textPacks?.[asset];if(pack)pack.data.records=clone(records)}},render:async()=>render(),enabled:()=>state.activeSource==="mine"&&["data","economy","loot","text"].includes(state.tab),changed:()=>refreshShell()});

  async function selectProjectSource(value){if(dirtyCount()&&!await LexeditorUI.confirmAction({title:"Discard unsaved changes?",message:"Switching source reloads everything from the other source. All unsaved FF7R changes would be lost.",confirmLabel:"Discard and switch",cancelLabel:"Keep editing"}))return;state.activeSource=String(value||"mine");state.economyKey="";state.lootKey="";if(state.data)await loadAsset(state.asset);if(state.tweaks){state.tweaks=null;if(state.tab==="tweaks")await loadAllTweaks()}if(state.textPacks){state.textPacks=null;state.textData=null;state.textBaseline=null;if(state.tab==="text")await loadAllText();else await ensureResidentText()}if(state.tab==="economy")await loadEconomy();if(state.tab==="loot")await loadLoot()}
  const shell=LexeditorUI.mountShell({host:"#lexeditor-shell",brand:"LEXEDITOR",plugin:{id:"ff7r",name:"FINAL FANTASY VII REMAKE INTERGRADE",themeName:"ff7r",theme:{accent:"#1d6fb8"}},tabs:[{id:"economy",label:"Items"},{id:"characters",label:"Characters"},{id:"abilities",label:"Abilities"},{id:"enemies",label:"Enemies"},{id:"loot",label:"Enemy Loot"},{id:"data",label:"Misc"},{id:"tweaks",label:"Tweaks"},{id:"text",label:"Text"}],activeTab:()=>state.tab,navigate,help:()=>navigate("datamap"),helpActive:()=>state.tab==="datamap",helpTitle:"Open FF7 Remake Data Map",dirtyCount,readonly:()=>state.activeSource!=="mine",history:editHistory,save,discard,projectSnapshot:()=>({canCreate:false,projects:[{name:"FF7R Mod",path:state.info?.projectRoot||"Project",valid:true,current:true}]}),projectSources:()=>[{key:"vanilla",label:"Vanilla",path:"Installed FF7R PAK resources"}],projectActiveSource:()=>state.activeSource,selectProjectSource,info:()=>navigate("info"),infoActive:()=>state.tab==="info",infoTitle:"Open FF7 Remake setup and runtime information"});

  (async()=>{try{
