  <script>(()=>{const p=new URLSearchParams(location.search),k=p.get("lexTransition");if(!["load","resume"].includes(k))return;const r=document.documentElement;r.classList.add("lex-transition-entry");if(k==="load"){r.dataset.lexQuote=p.get("lexQuote")||"Loading editor…";r.classList.add("lex-transition-loading")}})()</script>
  <link rel="stylesheet" href="/shared/framework.css">

    .warband-record-list{--lex-fitted-row-height:36px}.lex-column-list-header{background:#d1b879}.lex-column-list-row{height:var(--lex-fitted-row-height,auto);padding:0}.lex-column-list-cell{padding:7px 10px;border-bottom:1px solid #c8ae78}.warband-record-list .lex-column-list-cell{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.lex-column-list-row:hover{background:#f0dba8}

    .cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:14px}.card{padding:16px;border:1px solid var(--lex-border);border-radius:5px;background:#f5e9c9}.card h2{margin:0 0 12px;color:#651919;font:700 20px var(--lex-heading-font)}.path-row{display:grid;grid-template-columns:150px 1fr;gap:10px;padding:6px 0;border-bottom:1px solid #d9c69b}.path-row code{overflow:hidden;text-overflow:ellipsis}.ok{color:#45631e}.error{color:#9d2424}
    .build-log{max-height:42vh;overflow:auto;padding:12px;color:#d8dee9;border:1px solid #444;background:#101216;font:13px/1.4 "Cascadia Mono",Consolas,monospace;white-space:pre-wrap}
    .warband-bitmap-text{display:inline-flex;align-items:flex-start;vertical-align:middle;white-space:nowrap}.warband-glyph-slot{position:relative;display:inline-block;flex:none;height:var(--wb-line-height)}.warband-glyph{position:absolute;display:block;background-color:currentColor;-webkit-mask-image:url('/api/warband-font/atlas');mask-image:url('/api/warband-font/atlas');-webkit-mask-repeat:no-repeat;mask-repeat:no-repeat}
    .warband-item-detail{--lex-detail-icon-size:96px;display:flex;flex-direction:column;min-width:0;min-height:0;padding:14px;border:1px solid var(--lex-border);background:#f7edcf}.warband-item-detail>.lex-detail-panel-heading{padding:10px 10px 12px;border-bottom:1px solid #c8ae78}.warband-item-detail .lex-detail-panel-title{color:#651919;font:700 24px/1.1 var(--lex-heading-font)}.warband-item-detail .lex-detail-panel-id{margin-top:4px;color:var(--lex-muted);font:11px Consolas,monospace}.warband-item-detail .lex-detail-panel-icon{width:auto;height:100%;max-height:100%;aspect-ratio:1;border:1px solid #8b6b39;background:radial-gradient(circle at 50% 42%,#605039,#251d13 67%,#120e09)}.warband-item-thumbnail{position:relative;width:100%;height:100%;overflow:hidden}.warband-item-thumbnail canvas{display:block;width:100%;height:100%;pointer-events:none}.warband-item-thumbnail .warband-preview-message{padding:8px}.warband-mesh-list{padding:9px 2px;color:var(--lex-muted)}.warband-mesh-list b{color:#651919}.warband-item-detail .lex-detail-panel-body{overflow:auto}.warband-item-expression{min-height:72px!important;resize:vertical!important;font:12px/1.35 "Cascadia Mono",Consolas,monospace!important}.warband-preview-stage{position:relative;flex:1 1 auto;min-height:320px;overflow:hidden;border:1px solid #8b6b39;background:radial-gradient(circle at 50% 42%,#605039,#251d13 67%,#120e09)}.warband-preview-stage canvas{display:block;width:100%;height:100%;cursor:grab;touch-action:none}.warband-preview-stage canvas.dragging{cursor:grabbing}.warband-preview-message{position:absolute;inset:0;display:grid;place-items:center;padding:28px;color:#ead8ac;text-align:center}.warband-preview-facts{display:flex;gap:16px;padding:8px 2px 0;color:var(--lex-muted);font:11px Consolas,monospace}.warband-preview-spin{width:22px;height:22px;border:3px solid #d5b46955;border-top-color:#d5b469;border-radius:50%;animation:warband-spin .7s linear infinite}@keyframes warband-spin{to{transform:rotate(360deg)}}
    .warband-cell-text{min-width:0;max-width:100%;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    [hidden]{display:none!important}.warband-item-thumbnail img{width:100%;height:100%;object-fit:contain;display:block}.warband-icon-message{padding:8px;color:var(--lex-text);background:var(--lex-panel);font-size:11px}
    .warband-trees{align-items:stretch;grid-template-rows:minmax(0,1fr)}.warband-trees>.lex-panel-layout-pane{align-self:stretch;height:100%;min-height:0}
    .warband-tree-scroll{overflow:auto;min-width:0;min-height:0;background:var(--lex-panel)}
    .warband-tree-scroll>p{padding:0 12px}.warband-tree-stage{position:relative;margin:auto;min-width:100%}
    .warband-tree-stage svg{position:absolute;inset:0;pointer-events:none}.warband-tree-stage path{fill:none;stroke:var(--lex-accent);stroke-width:2}
    .warband-tree-node{position:absolute;width:170px;height:56px;display:flex;flex-direction:column;justify-content:center;border:1px solid var(--lex-border);border-radius:4px;background:var(--lex-panel);color:var(--lex-text);cursor:pointer}
    .warband-tree-node strong,.warband-tree-node small{display:block;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    .warband-tree-node[aria-pressed=true]{background:var(--lex-accent);color:var(--lex-accent-text)}.warband-tree-node:focus-visible{outline:3px solid var(--lex-highlight);outline-offset:2px}
    .warband-tree-node.missing{border-style:dashed}.warband-tree-detail{overflow:auto;min-width:0}.warband-tree-detail>.lex-detail-panel{height:100%}.warband-tree-detail .lex-detail-panel-heading{padding:4px 10px}.warband-tree-detail .lex-detail-panel-id{font:12px/1.3 Consolas,monospace;color:var(--lex-muted)}.warband-tree-detail .lex-detail-panel-title{margin:0}.warband-tree-detail .detail-grid{grid-template-columns:80px minmax(0,1fr);overflow-wrap:anywhere}
  </style>

<body>
  <div id="lexeditor-shell"></div>
  <div id="toolbar"></div>
  <main id="main"><div>Loading Warband data…</div></main>
  <script src="/shared/framework.js"></script>
  <script src="/warband/troop_trees.js"></script>
  <script>
  "use strict";
  const {el,columnList,list,masterDetail,pagedListDetail,pager,clone,showAlert,hoverable,detailPanel,detailField,detailGroup}=LexeditorUI;
  const $=selector=>document.querySelector(selector);
  const state={
    booting:true,tab:"items",dashboard:null,settings:null,troops:null,items:null,upgrades:null,modules:null,datamap:null,activeSource:"mine",
    manual:null,font:null,selectedModule:"",selectedSetting:"",selectedItem:"",selectedTroop:"",selectedUpgrade:"",selectedFile:"",catalogFile:null,catalogDraft:"",
    settingEdits:{},itemEdits:{},filters:{items:"",troops:"",cut:false,upgrades:"",settings:"",datamap:"",mapStatus:""},
    pages:{items:0,troops:0,upgrades:0,datamap:0},pageSizes:{items:20,troops:20,upgrades:20},sorts:{items:["name",1],troops:["name",1],upgrades:["from",1],datamap:["filename",1]},
    build:{cursor:0,lines:[],running:false,returnCode:null},status:"Ready"
  };

  async function api(path,options){const response=await fetch(path,options);const value=await response.json();if(value.error)throw new Error(value.error);return value;}
  function itemDirtyCount(){return Object.values(state.itemEdits).reduce((total,row)=>total+Object.keys(row.fields||{}).length,0);}
  function dirtyCount(){return state.activeSource==="mine"?Object.keys(state.settingEdits).length+itemDirtyCount()+(state.catalogFile?.editable&&state.catalogDraft!==state.catalogFile.text?1:0):0;}
  function historyCapture(){return {settingEdits:clone(state.settingEdits),itemEdits:clone(state.itemEdits),catalogDraft:state.catalogDraft,selectedFile:state.selectedFile,catalogFile:clone(state.catalogFile)};}
  async function historyRestore(snapshot){state.settingEdits=clone(snapshot.settingEdits);state.itemEdits=clone(snapshot.itemEdits||{});state.catalogDraft=snapshot.catalogDraft;state.selectedFile=snapshot.selectedFile;state.catalogFile=clone(snapshot.catalogFile);}
  function effectiveSetting(row){return state.settingEdits[row.line]??row.value;}
  function setStatus(text){state.status=text;const target=$("#plugin-status");if(target)target.textContent=text;}
  function bitmapText(text,pixels){
    if(!state.font?.available)return document.createTextNode(text);
    const scale=pixels/state.font.fontSize,root=el("span",{class:"warband-bitmap-text","aria-label":text,style:`--wb-line-height:${state.font.lineSpacing*scale}px`});
    for(const character of text){const metrics=state.font.characters[String(character.codePointAt(0))];if(!metrics){root.append(el("span",{class:"warband-glyph-slot",style:`width:${pixels*.52}px`},character));continue;}
      const slot=el("span",{class:"warband-glyph-slot",style:`width:${Math.max(1,metrics.postshift*scale)}px`});
      if(metrics.w>metrics.u&&metrics.h>metrics.v)slot.append(el("i",{class:"warband-glyph","aria-hidden":"true",style:`left:${metrics.preshift*scale}px;top:${(state.font.fontSize-metrics.yadjust)*scale}px;width:${(metrics.w-metrics.u)*scale}px;height:${(metrics.h-metrics.v)*scale}px;-webkit-mask-size:${state.font.width*scale}px ${state.font.height*scale}px;mask-size:${state.font.width*scale}px ${state.font.height*scale}px;-webkit-mask-position:${-metrics.u*scale}px ${-metrics.v*scale}px;mask-position:${-metrics.u*scale}px ${-metrics.v*scale}px`}));
      root.append(slot);
    }
    return root;
  }
  function applyInstalledWarbandFont(){
    const brand=document.querySelector(".lex-brand-button");if(brand&&!brand.dataset.bitmapFont){brand.dataset.bitmapFont="1";brand.replaceChildren(bitmapText("LEXEDITOR",24));}
    document.querySelectorAll("nav button").forEach(button=>{if(button.dataset.bitmapFont)return;const target=button.querySelector(".lex-tab-label-text");if(!target)return;const label=target.textContent;button.dataset.bitmapFont="1";button.setAttribute("aria-label",label);target.replaceChildren(bitmapText(label,18));});
  }
  function search(rows,query,fields){const needle=query.trim().toLowerCase();return needle?rows.filter(row=>fields.some(field=>String(row[field]??"").toLowerCase().includes(needle))):rows;}
  function sorted(rows,view){const [key,direction]=state.sorts[view];return [...rows].sort((a,b)=>direction*String(a[key]??"").localeCompare(String(b[key]??""),undefined,{numeric:true}));}
  function sort(view,key){const [active,direction]=state.sorts[view];state.sorts[view]=[key,active===key?-direction:1];render();}
  function renderTableView(view,rows,columns,options={}){
    const query=state.filters[view]||"",filtered=sorted(search(rows,query,columns.map(column=>column.key)),view);
    const keyOf=options.key||((row)=>columns.map(column=>String(row[column.key]??"")).join("|"));
    const selected=options.selected?.()||"",setSelected=options.setSelected||(()=>{});
    const detail=row=>row?el("div",{class:"lex-detail detail"},el("h2",{},row.name||(row.from&&row.to?`${row.from} → ${row.to}`:String(keyOf(row)))),
      el("div",{class:"detail-grid"},...columns.flatMap(column=>[el("div",{class:"label"},typeof column.label==="string"?column.label:column.key),el("div",{},String(row[column.key]??"—"))]))):el("div",{class:"lex-detail detail"},"No matching records.");
    $("#toolbar").replaceChildren();
    $("#main").replaceChildren(pagedListDetail({rows:filtered,key:keyOf,slots:false,fit:{minRowHeight:36},page:state.pages[view],pageSize:state.pageSizes[view],selected,noun:view,splitKey:`warband-${view}`,className:"warband-paged-table",defaultSplit:58,
      search:{key:`warband-${view}`,value:query,placeholder:`Search ${view}…`,change:value=>{state.filters[view]=value;state.pages[view]=0;render();}},filters:options.filters||[],
      master:({rows,selected,select})=>columnList({rows,key:keyOf,columns:columns.map(column=>({...column,sortable:true})),sortState:{key:state.sorts[view][0],dir:state.sorts[view][1]},sort:key=>sort(view,key),selected,selectedClass:"selected",select,class:"warband-record-list", "aria-label":`${view} records`}),
      detail,sync:next=>{state.pages[view]=next.page;state.pageSizes[view]=next.pageSize;setSelected(next.selected||"");},change:next=>{state.pages[view]=next.page;state.pageSizes[view]=next.pageSize;setSelected(next.selected||"");render();}}));
  }

  function openTroop(troopId){
    const troop=state.troops.rows.find(row=>row.id===troopId);if(!troop)return;
    state.filters.troops="";state.filters.cut=false;state.selectedTroop=troop.id;
    state.pages.troops=0;navigate("troops");
  }
  function troopLink(troopId,label){
    if(!state.troops.rows.some(row=>row.id===troopId))return label;
    return hoverable({targetType:"warband-troop",targetId:troopId,targetLabel:label,label,activate:()=>openTroop(troopId)});
  }

  function itemColumns(){return [{key:"name",label:"Name",render:row=>el("span",{class:"warband-cell-text",title:row.name},row.name)},{key:"id",label:"ID"},{key:"type",label:"Type"},{key:"inventoryMesh",label:"Inventory mesh"}];}
  function renderItems(){
    const view="items",columns=itemColumns(),query=state.filters.items||"";
    const filtered=sorted(search(state.items.rows,query,["name","id","type","inventoryMesh"]),view);
    $("#toolbar").replaceChildren();
    $("#main").replaceChildren(pagedListDetail({rows:filtered,key:row=>row.id,slots:false,fit:{minRowHeight:36},page:state.pages.items,pageSize:state.pageSizes.items,selected:state.selectedItem,noun:"items",splitKey:"warband-items",className:"warband-paged-table warband-items",defaultSplit:43,
      search:{key:"warband-items",value:query,placeholder:"Search items…",change:value=>{state.filters.items=value;state.pages.items=0;renderItems();}},
      master:({rows,selected,select})=>columnList({rows,key:row=>row.id,columns:columns.map(column=>({...column,sortable:true})),sortState:{key:state.sorts.items[0],dir:state.sorts.items[1]},sort:key=>sort("items",key),selected,selectedClass:"selected",select,class:"warband-record-list","aria-label":"Warband items"}),
      detail:()=>warbandItemDetail(state.items.rows.find(row=>row.id===state.selectedItem)),sync:next=>{state.pages.items=next.page;state.pageSizes.items=next.pageSize;state.selectedItem=next.selected||"";},change:next=>{state.pages.items=next.page;state.pageSizes.items=next.pageSize;state.selectedItem=next.selected||"";renderItems();}}));
  }

  function warbandEyeIcon(){
    const ns="http://www.w3.org/2000/svg",svg=document.createElementNS(ns,"svg");svg.setAttribute("viewBox","0 0 24 24");svg.setAttribute("width","22");svg.setAttribute("height","22");
    const path=document.createElementNS(ns,"path");path.setAttribute("fill","none");path.setAttribute("stroke","currentColor");path.setAttribute("stroke-width","1.8");path.setAttribute("d","M2.5 12s3.4-6 9.5-6 9.5 6 9.5 6-3.4 6-9.5 6-9.5-6-9.5-6Z M12 9a3 3 0 1 1 0 6 3 3 0 0 1 0-6Z");svg.append(path);return svg;
  }

  function disposeWarbandPreview(){
    if(window.__warbandPreview){window.__warbandPreview.forEach(controller=>controller.dispose());delete window.__warbandPreview;}
  }
  function itemEditKey(item){return String(item.recordIndex??item.line??item.id);}
  function effectiveItemField(item,key){return state.itemEdits[itemEditKey(item)]?.fields?.[key]??item.fields?.[key]??"";}
  function setItemField(item,key,value){
    const recordKey=itemEditKey(item),base=String(item.fields?.[key]??""),next=String(value);
    if(next===base){const existing=state.itemEdits[recordKey];if(existing?.fields)delete existing.fields[key];if(existing&&!Object.keys(existing.fields).length)delete state.itemEdits[recordKey];}
    else{const existing=state.itemEdits[recordKey]||(state.itemEdits[recordKey]={recordIndex:item.recordIndex,originalId:item.id,fields:{}});existing.fields[key]=next;}
    shell.refresh();
  }
  function itemTypeFromFlags(flags){return (String(flags).match(/itp_type_([a-z0-9_]+)/i)||[])[1]||"";}
  function setItemType(item,value){
    const clean=String(value).trim().replace(/^itp_type_/i,""),flags=String(effectiveItemField(item,"flags"));if(!clean)return;
    const token=`itp_type_${clean}`,next=/itp_type_[a-z0-9_]+/i.test(flags)?flags.replace(/itp_type_[a-z0-9_]+/i,token):(flags.trim()?`${token}|${flags}`:token);
    setItemField(item,"flags",next);const control=document.querySelector('[data-lex-property="flags"] textarea');if(control)control.value=next;
  }
  function itemWeightFromStats(stats){return (String(stats).match(/weight\(([^)]+)\)/)||[])[1]?.trim()||"";}
  function setItemWeight(item,value){
    const clean=String(value).trim();if(!clean)return;const stats=String(effectiveItemField(item,"stats"));
    const next=/weight\([^)]+\)/.test(stats)?stats.replace(/weight\([^)]+\)/,`weight(${clean})`):(stats.trim()?`weight(${clean})|${stats}`:`weight(${clean})`);
    setItemField(item,"stats",next);const control=document.querySelector('[data-lex-property="stats"] textarea');if(control)control.value=next;
  }
  const ITEM_HELP={
    id:"Module System identifier referenced by troops, shops, scripts, and other records. Renaming it here does not rewrite those references.",
    name:"Player-facing item name compiled into the module's item data.",
    type:"The itp_type_* flag defines the item's fundamental equipment/use class and changes how Warband interprets its other stats.",
    value:"Base item price before merchant, trade-skill, abundance, and other economy adjustments.",
    weight:"Inventory/equipment weight from the weight(...) stat macro; Warband uses it for encumbrance and other weight-sensitive behavior.",
    meshes:"Meshes used to render the item. The first mesh is also the source for Lexeditor's generated inventory icon.",
    flags:"Item behavior flags control equipment class, merchandise/civilian availability, handedness, and other engine behavior.",
    capabilities:"Weapon capability expression controlling supported attacks and animations; non-weapons commonly leave this at zero.",
    stats:"Gameplay stat macros for weight, abundance, armor, speed, reach, damage, ammunition, and related item values.",
    modifierBits:"Controls which generated item modifiers such as rusty, balanced, masterwork, or lordly may apply.",
    factions:"Optional faction list restricting where merchandise for this item may appear."
  };
  function itemExpressionControl(item,key){return el("textarea",{class:"warband-item-expression",value:effectiveItemField(item,key),oninput:event=>setItemField(item,key,event.target.value)});}
  function itemFieldLabel(key){return ({meshes:"Meshes",flags:"Flags",capabilities:"Capabilities",value:"Value",stats:"Stats",modifierBits:"Modifier bits",factions:"Factions"})[key]||key.replace(/^extra/,"Extra field ");}
  function warbandItemDetail(item){
    disposeWarbandPreview();
    if(!item)return detailPanel({className:"warband-item-detail",title:"Select an item"});
    const thumbnailMessage=el("div",{class:"warband-icon-message"},item.inventoryMesh?"Preparing icon…":"No mesh"),thumbnail=el("div",{class:"warband-item-thumbnail"},thumbnailMessage);
    const readOnly=state.activeSource!=="mine";
    const core=detailGroup({title:"Item",body:[
      detailField({label:"ID",property:"id",dataType:"STRING",description:ITEM_HELP.id,control:el("input",{value:effectiveItemField(item,"id"),disabled:readOnly,oninput:event=>setItemField(item,"id",event.target.value)})}),
      detailField({label:"Name",property:"name",dataType:"STRING",description:ITEM_HELP.name,control:el("input",{value:effectiveItemField(item,"name"),disabled:readOnly,oninput:event=>setItemField(item,"name",event.target.value)})}),
      detailField({label:"Type",property:"type",dataType:"STRING",description:ITEM_HELP.type,control:el("input",{value:itemTypeFromFlags(effectiveItemField(item,"flags")),disabled:readOnly,onchange:event=>setItemType(item,event.target.value)})}),
      detailField({label:"Value",property:"value",dataType:"EXPR",description:ITEM_HELP.value,control:el("input",{value:effectiveItemField(item,"value"),disabled:readOnly,oninput:event=>setItemField(item,"value",event.target.value)})}),
      detailField({label:"Weight",property:"weight",dataType:"FLOAT",description:ITEM_HELP.weight,control:el("input",{type:"number",step:"any",value:itemWeightFromStats(effectiveItemField(item,"stats")),disabled:readOnly,onchange:event=>setItemWeight(item,event.target.value)})})
    ]});
    const sourceFields=(item.fieldOrder||[]).filter(key=>!["id","name","value"].includes(key));

    tabs:[["items","Items"],["upgrades","Troop Trees"],["troops","Troops"],["tweaks","Tweaks"]].map(([id,label])=>({id,label})),
    activeTab:()=>state.tab,navigate,help:()=>navigate("datamap"),helpActive:()=>state.tab==="datamap",helpTitle:"Open the Warband Data Map",info:()=>navigate("dashboard"),infoActive:()=>state.tab==="dashboard",infoTitle:"Open Warband information and log",projectSources:()=>[{key:"vanilla",label:"Vanilla",path:`${state.dashboard?.paths?.Game||"Installed Warband"}/Modules/Native`}],projectActiveSource:()=>state.activeSource,selectProjectSource:switchProjectSource,dirtyCount,readonly:()=>state.activeSource!=="mine",save:saveAll,
    history:{capture:historyCapture,restore:historyRestore,render,enabled:()=>!state.booting&&state.activeSource==="mine",limit:50}
  });

  async function boot(){
    try{
      [state.dashboard,state.settings,state.troops,state.items,state.upgrades,state.modules,state.datamap,state.font]=await Promise.all([api("/api/dashboard"),api("/api/settings"),api("/api/troops"),api("/api/items"),api("/api/upgrades"),api("/api/modules"),api("/api/datamap"),api("/api/warband-font")]);
      state.booting=false;applyInstalledWarbandFont();render();LexeditorUI.finishPluginLoading();
    }catch(error){state.booting=false;LexeditorUI.finishPluginLoading();$("#main").textContent=`Failed to load Warband plugin: ${error.message}`;setStatus("Load failed");}
  }
  window.addEventListener("beforeunload",event=>{if(!window.__lexeditorNavigating&&dirtyCount())event.preventDefault();});
  boot();
  </script>
