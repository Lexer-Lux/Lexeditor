  .effect-column-list.lex-fitted-page .effect-column-row,.behavior-column-list.lex-fitted-page .behavior-column-row { height:var(--lex-fitted-row-height); min-height:0; overflow:hidden; }

  .effect-column-list .lex-column-cell-content,.behavior-column-list .lex-column-cell-content,
  .effect-column-primary .record-name,.effect-column-primary .key,.effect-column-behavior > *,

  .effect-column-primary,.effect-column-behavior { line-height:1.2; gap:3px; }
  .effect-column-list .technical-id,.effect-column-list .key,.behavior-column-list .technical-id { color:var(--dim); }
  .effect-detail .detail-field { display:grid; grid-template-columns:180px minmax(0,1fr); gap:12px;
    align-items:start; padding:9px 4px; border-bottom:1px solid #2a2419; }
  .effect-detail .detail-field.effect-identity { grid-template-columns:minmax(0,1fr); }
  .effect-detail .detail-label { color:var(--accent2); font-size:13px; text-transform:uppercase;
    letter-spacing:.4px; padding-top:5px; display:flex; align-items:center; gap:4px; }
  .effect-detail .detail-control { min-width:0; max-width:100%; overflow-wrap:anywhere; }
  .effect-detail .detail-control select,.effect-detail .detail-control input { min-width:0; max-width:100%; box-sizing:border-box; }
  .effect-detail .detail-control > input,.effect-detail .detail-control > select { width:100%; }
  .effect-detail .ref-field { display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
  .effect-detail-head { display:flex; align-items:center; gap:10px; padding-bottom:10px; border-bottom:1px solid var(--border); }
  .effect-detail-head .human-name { min-width:0; flex:1; font:400 24px/1.1 var(--rdr-font-display); }
  .effect-detail-id { color:var(--dim); font:11px Consolas,monospace; overflow-wrap:anywhere; }
  .effect-usage-list { display:grid; gap:5px; max-height:260px; overflow:auto; }
  .effect-usage-list button { text-align:left; }
  .dialog-actions { display:flex; justify-content:flex-end; gap:8px; margin-top:6px; }
  /* #17/#201/Lexeditor #4: independent vertical columns remove the empty space
     that synchronized CSS grid rows left below short category cards. JavaScript
     keeps the alphabetical cards assigned left to right across these columns. */
  .settings-layout { --settings-lane-count:3; display:grid;
                     grid-template-columns:repeat(var(--settings-lane-count),minmax(0,1fr));
                     gap:18px; align-items:start; }
  .settings-column { display:flex; flex-direction:column; gap:18px; min-width:0; }
  .settings-section { width:100%;
                      margin:0; min-width:0; border:1px solid var(--border); background:var(--panel); }
  .settings-section h2 { margin:0; padding:10px 14px; border-bottom:2px solid var(--accent); background:#18140f;
                         font:400 20px/1 var(--rdr-font-display); color:var(--accent2); letter-spacing:.04em; }
  .settings-subs { display:grid; grid-template-columns:repeat(auto-fit,minmax(232px,1fr)); }

                     font:600 11px Consolas,monospace; letter-spacing:.09em; text-transform:uppercase; color:var(--accent2);
                     display:flex; align-items:center; gap:4px; }
  /* One subcategory is one column. Do not create a second nested column grid
     inside it (that made Recon Tagging look like two columns within a column). */

  /* One compact horizontal row: name/help/source stay left; value/unit stay

  .honor-card th:nth-child(3) { width:36%; }
  @media (max-width:520px) {
    main { padding-left:10px; padding-right:10px; }
    .honor-card th,.honor-card td { padding-left:6px; padding-right:6px; }
    .honor-card .setting-source { font-size:8px; }
    .bounty-trigger .setting-row { grid-template-columns:1fr; gap:5px; }
    .bounty-trigger .setting-row > .ref-field { justify-self:stretch; }
    .bounty-trigger input[type=number] { width:100%; }
  }

  .picker-option { display:block; width:100%; text-align:left; padding:7px 9px; color:var(--text); background:transparent; border:0; border-bottom:1px solid #30281e; cursor:pointer; }
  .picker-option:hover { background:var(--panel2); color:var(--accent2); }
</style>

<body>

<datalist id="dl-tables"></datalist>
<datalist id="dl-items"></datalist>

<script src="/shared/framework.js"></script>
<script>
"use strict";
const $ = s => document.querySelector(s);
const el = window.LexeditorUI.el;
const newButton=window.LexeditorUI.newButton;
const standardCloseButton=window.LexeditorUI.closeButton;
function showSaveFailure(error){const message=error?.message||String(error);toast("Save failed",true);LexeditorUI.showAlert({title:"Save failed",items:[{item:"Save",issue:message}],closeLabel:"Confirm and Close"});return error instanceof Error?error:new Error(message)}

const state = {
  booting: true,
  loadError: null,
  tab: "items",
  ds: "mine",           // current dataset (mine | kiddos | vanilla)
  store: {},            // ds -> {catalog, quickSelect, effectByKey, loot, matrix}
  catalog: null,        // {items, effects} — pointer into store[ds]
  quickSelect: null,    // active quickselectitems.ymt item-to-slot mappings
  effectByKey: {},
  loot: {},             // file -> {tables} — pointer into store[ds]
  lootFile: null,
  matrix: null,
  shops: null,
  config: null,
  // dirty edit stores
  priceEdits: {},       // "itemKey|section|costKey|partItem" -> qty(cents)
  buyabilityEdits: {},  // itemKey -> {buyable, cents}
  sellabilityEdits: {}, // itemKey -> {sellable, cents}
  yieldEdits: {},       // "itemKey|section|costKey" -> quantity received
  carryEdits: {},       // "itemKey|slot" -> qty
  bundleEdits: {},      // "loot file|table|item" -> opened-item quantity
  craftEdits: {},       // itemKey -> [{key, yield, parts:[{item,qty}]}] (full craft replace)
  customCrafting: {available:false,customFile:null,vanillaFile:null,vanilla:[],custom:[],errors:[]},
  customCraftingDraft: [],
  customCraftingDirty: false,
  crimeEdits: {},       // "crimeKey|field" -> value
  dispatchEdits: {},    // "group|field" -> value

  bountyHunterEdits: {}, // concrete bountyhunters.meta / cooldown field id -> value
  honorActions: null,
  honorActionEdits: {},
  effectEdits: {},      // "effKey|field" -> value
  itemEffectEdits: {},  // itemKey -> [effect keys]
  itemTagEdits: {},     // itemKey -> [{key, type}]
  quickSelectEdits: {}, // itemKey -> {group, slots:[{id, sortOrder}]}
  alcohol: {available:false,file:null,entries:{}},
  alcoholEdits: {},     // itemKey -> numeric drunkenness added per use
  descriptionKeyEdits: {}, // itemKey -> newly-created localization key
  settings: null,
  settingEdits: {},       // "section|key" -> value

  lootCollapsed: new Set(), // "tableKey|entryIndex" of nested tables collapsed by hand
  matrixDirty: new Set(),

  challengeRewardEdits: {},
  challengeUiEdits: {},
  challengeModeEdits: {},

  mobEdits: {},          // "file|indexPath" -> {file, path, kind, value}
  mobModels: null,

  weaponData: {},
  weaponReference: null,

  labels: {},
  modelPreviewAvailability: {},
  modelPreviewLoads: {},
  helpOpen: {},
  dataMapSort: ["filename",1],
  expandedRecipes: new Set(),
  sorts: {
    items:{key:"name",dir:1}, "crafting-vanilla":{key:"name",dir:1}, "crafting-custom":{key:"name",dir:1}, effects:{key:"name",dir:1}, behaviors:{key:"name",dir:1},
    loot:{key:"table",dir:1},
    "shops-buy":{key:"name",dir:1}, "shops-sell":{key:"name",dir:1},
    crime:{key:"name",dir:1}, ai:{key:"context",dir:1}, weapons:{key:"field",dir:1},
    dispatch:{key:"setting",dir:1}, mobs:{key:"name",dir:1}, "mob-models":{key:"model",dir:1}
  },
  filters: { q: "", category: "", group: "", itemSection: "all", itemSource: "all", itemPage: 0, itemPageSize: 20, onlyEffects: false, onlyNamed: true, effectSection:"effects", behaviorQ:"", behaviorPage:0, behaviorPageSize:20, behaviorSel:"", effectPage:0, effectPageSize:20, effectSel:"",
             craftMode:"vanilla", craftQ:"", craftSelVanilla:"", craftSelCustom:"", craftOutput:"", craftIngredient:"", craftPage:0, craftPageSize:20,
              lootQ: "", lootPage:0, lootPageSize:20, animal: "", shopBuyQ: "", shopSellQ: "", shopSellCategory: "", shopSellSubcategory: "", shopExact: "", shopType: "ST_GENERAL", shopMode: "workspace",
             mobView: "archetypes", mobGroup: "humans", mobLayer: "combat", mobQ: "",
             mobModelGroup: "gang", mobModelQ: "", mapQ:"", mapStatus:"", mapPage:0 },
};

function toast(msg, err) {
  const t = $("#toast");
  t.textContent = msg; t.className = err ? "err" : ""; t.style.display = "block";
  setTimeout(() => t.style.display = "none", 2600);
}

const TAB_CONTEXT = {
  items:{files:()=>`${state.catalog?.activeFile||"catalog_sp.ymt"} + ${state.quickSelect?.activeFile||"quickselectitems.ymt"} + strings.gxt2`,help:"Items are catalog records. The first field is the actual in-game English name from Rockstar's localization key; editing it writes a strings.gxt2 override loaded by LML. Category is the precise inventory/catalog classification; group is the broader gameplay family. Quick-select slots are the actual radial assignments from quickselectitems.ymt; each item can have zero, one, or several, and every slot uses a controlled selector. Effects and Tags use + buttons that open full in-editor selectors; there are no free-entry effect or tag fields. Unresolved hashes already on an item are removable-only. Drink class is an exclusive tag that categorizes a drink (it is NOT the numeric alcohol/inebriation value, which lives outside this catalog). A steel-blue globe marks content imported from Red Dead Online. A brass pen nib marks content created locally in LEXEDITOR. Both icons are display-only and are never saved into a record."},
  crafting:{files:()=>state.filters.craftMode==="custom"?(state.customCrafting.customFile||"custom_crafting_recipes.tsv"):(state.customCrafting.vanillaFile||"vanilla_crafting_recipes.tsv"),help:"Vanilla recipes are a read-only snapshot of Rockstar's shipped COST_TYPE_CRAFT records. Custom recipes live in a separate runtime file and never rewrite catalog_sp.ymt. The custom schema permits unlimited recipe rows and unlimited ingredient rows. Recipe IDs must be unique; outputs and ingredients must be real catalog item IDs; all quantities are positive whole numbers. Linked outputs use a steel-blue globe for Red Dead Online content and a brass pen nib for locally created content."},
  effects:{files:()=>`${state.catalog?.activeFile||"catalog_sp.ymt"} + plugin labels.json`,help:"An effect record combines an item-facing catalog key with an engine Behavior ID. You may create new effect records with different magnitudes, durations, and labels, but they must reuse a Behavior ID the engine already implements; inventing a new Behavior ID does not create new game code. Catalog-reference and Behavior labels are editor-only organization stored in this plugin's labels.json. Changing a shared effect changes every item that references it. Timed effects use Time + Time Units: 0 seconds, 1 minutes, 2 in-game hours, 3 in-game days. A steel-blue globe marks a Red Dead Online effect. A brass pen nib marks an effect created locally in LEXEDITOR."},
  loot:{files:()=>state.lootFile==="__matrix"?"loot_items_matrix.meta":state.lootFile,help:"Loot table files define probabilistic drops and references to other pools. On Item Groups (and other loot files) you can create empty tables and delete unreferenced ones; point other tables at a new group with entry type Table. Skinning is a deterministic quality matrix in loot_items_matrix.meta."},
  shops:{files:()=>`${state.catalog?.activeFile||"catalog_sp.ymt"} + parseddata/0x0BA63B3D.ymt + merchant_buy_overrides.csv`,help:"The selected shop is in the middle. BUYS controls the global SELL_SHOP_DEFAULT payout plus explicit per-merchant Accept or Reject overrides. An item absent from sparse buyer PDATA remains engine-default unknown, not proven rejected. SELLS controls this shop's stock membership, listing-specific availability groups, and global COST_SHOP_DEFAULT price. A steel-blue globe marks Red Dead Online content. A brass pen nib marks locally created content."},
  settings:{files:()=>state.settings?.file||"GameplayTweaks.ini",help:"GameplayTweaks.asi re-reads this INI approximately every two seconds, so most settings can be tuned while Story Mode is running. This optional tab is unavailable when LEXEDITOR is used without GameplayTweaks; the rest of the editor remains fully functional."},
  challenges:{files:"goals_sp.meta + challenges_sp.meta + strings.gxt2",help:"goals_sp.meta defines nested requirements and target values; rows are labeled as goal counters, exclusion guards, or required conditions/triggers. challenges_sp.meta defines strand order and rewards. Visible names and descriptions are actual in-game English localization and save through strings.gxt2. Vanilla XP rewards are fixed bundles: First 25, Second 50, Third 100, Fourth 150 XP. Attribute levels 1–8 unlock at cumulative 0 / 50 / 100 / 200 / 350 / 550 / 800 / 1100 XP; levels 9–10 use bonus-rank progression."},
  weapons:{files:"active install.xml weapon layers + strings.gxt2",help:"Ammo Types combines shared CAmmoInfo behavior with every weapon-specific DamageInfos variant keyed to that ammo. Damage and penetration vary by weapon; High Velocity range comes from the linked DamageFallOffInfo curve. The radial stat bars summarize these underlying values rather than storing a separate authoritative set of stats. LEXEDITOR resolves four OpenIV-exported record-type hashes to Rockstar's named weapon schema before saving; this preserves rumble, degradation, falloff, and vehicle-weapon records. A steel-blue globe marks a weapon or ammunition record from an RDO-only weapon layer; edits save back to that record's exact active layer."},
  ai:{files:()=>state.filters.aiFile||"combat styles/programs (Data Map)",help:"AI is layered across profile, global tuning, and decision-graph files. UCO values are reference-only."},
  mobs:{files:()=>state.filters.mobView==="models"?"MobProbe/mob_stats.csv":(state.filters.mobLayer==="health"?"pedhealth.meta":"ai/combatbehaviour.meta"),help:"Archetypes edits the real combatbehaviour.meta and pedhealth.meta records. Combat profiles own fields such as WeaponAccuracy. Health archetypes own HP, armour, and injury or knockout thresholds. Observed Models is read-only MobProbe evidence. No shipped data file directly binds every ped model to one archetype, so LEXEDITOR does not invent or save that relationship."},
  crime:{files:()=>state.filters.crimeSection==="honor"?(state.honorActions?.file||"honor_actions.csv"):state.filters.crimeSection==="bounty"?"dispatchresponses/wilderness/bountyhunters.meta + dispatch.meta":state.filters.crimeSection==="dispatch"?"dispatch.meta":"crimeinformation.meta",help:"Crime Rules controls reporting and response. Honor Actions exposes 21 exact independent event toggles and 19 shared magnitude tiers; amounts are tiers reused by many actions, never invented per-action values."},
  datamap:{files:"DATA_MAP.md",help:"The Data Map documents the effective extracted game-data set; it does not edit game files."}
};

function fieldHelp(text){return LexeditorUI.infoHelp(text,{class:"field-help"});}
function rdrSearchField({id,placeholder,label=placeholder,value="",oninput,className=""}){
  return el("label",{class:`rdr-search ${className}`.trim()},
    el("span",{class:"rdr-search-icon","aria-hidden":"true"}),
    el("input",{id,type:"text",placeholder,"aria-label":label,value,oninput}));
}
function tabContext(){const c=TAB_CONTEXT[state.tab]||{};return typeof c.files==="function"?c.files():c.files||"";}
function installTabContext(){const tb=$("#toolbar");if(!tb||tb.querySelector(".help-toggle"))return;
  if(state.tab==="datamap"||state.tab==="settings")return;
  const target=tb.querySelector(".toolbar-context-slot")||tb.querySelector(".record-toolbar")||tb,anchor=target.querySelector(".savebar");
  const help=LexeditorUI.infoHelp("About this tab",{class:"help-toggle",onclick:()=>{state.helpOpen[state.tab]=!state.helpOpen[state.tab];render();}});
  target.insertBefore(help,anchor);
  const m=$("#main"),existing=m?.querySelector(":scope > .hint");
  if(existing){existing.classList.add("tab-help");existing.hidden=!state.helpOpen[state.tab];}
  else if(state.helpOpen[state.tab]&&m)m.prepend(el("div",{class:"hint tab-help"},TAB_CONTEXT[state.tab]?.help||""));}

function filterRerender(ev,rerender){
  const source=ev.currentTarget||ev.target,placeholder=source.placeholder,type=source.type;
  const id=source.id,scope=source.closest("#toolbar")?"#toolbar":source.closest("#main")?"#main":"body";
  const start=source.selectionStart,end=source.selectionEnd,direction=source.selectionDirection;
  const restore=()=>{
    const next=(id&&document.getElementById(id))||[...document.querySelectorAll(`${scope} input`)]
      .find(input=>input.placeholder===placeholder&&input.type===type);
    if(!next)return;
    next.focus({preventScroll:true});
    if(start!==null)next.setSelectionRange(start,end,direction||"none");
  };
  const pending=rerender();
  if(pending&&typeof pending.then==="function")pending.then(restore);
  else restore();
}

function sortHead(tab,key,label,rerender,help){const cur=state.sorts[tab];const active=cur?.key===key;
  const heading=el("span",{class:"header-label"},label,help?fieldHelp(help):"",active?el("span",{class:"lex-ui-symbol"},cur.dir>0?" ▼":" ▲"):"");
  return el("th",{class:`sortable${active?" sorted":""}`,onclick:()=>{state.sorts[tab]={key,dir:active?-cur.dir:1};rerender();}},heading);}
function sortedRows(tab,rows,getters){const s=state.sorts[tab];if(!s||!getters[s.key])return rows;return [...rows].sort((a,b)=>{const av=getters[s.key](a),bv=getters[s.key](b);return s.dir*(typeof av==="number"&&typeof bv==="number"?av-bv:String(av??"").localeCompare(String(bv??"")));});}
function purchaseYieldValue(it){
  const cost=it?.buy?.find(c=>c.costtype==="COST_TYPE_PRICE"&&c.parts.some(p=>p.item==="CURRENCY_CASH"));
  if(!cost)return null;
  return +(state.yieldEdits[`${it.key}|buy|${cost.key}`]??cost.yield??1);
}
function purchaseYieldOf(it){return purchaseYieldValue(it)??Infinity;}
const PURCHASE_CONTAINERS={
  UPGRADE_FSH_BAIT_WORM_CAN:{table:"BAIT_WORMS",target:"UPGRADE_FSH_BAIT_WORM",container:"can"},
  UPGRADE_FSH_BAIT_CRICKET_TIN:{table:"BAIT_CRICKETS",target:"UPGRADE_FSH_BAIT_CRICKET",container:"tin"}
};
function purchaseBundleOf(it){
  const spec=PURCHASE_CONTAINERS[it?.key];if(!spec)return null;
  const target=state.catalog?.items.find(candidate=>candidate.key===spec.target);
  const source=target?.lootSources?.find(row=>row.file==="loot_table_itemgroups.meta"&&row.table===spec.table);
  if(!source)return null;
  const editKey=`${source.file}|${spec.table}|${spec.target}`;
  const edited=state.bundleEdits[editKey];
  return {...spec,targetItem:target,min:edited??(source.min||source.max||"1"),max:edited??(source.max||source.min||"1"),file:source.file,editKey,source};
}
function purchaseContainersFor(it){
  return Object.keys(PURCHASE_CONTAINERS).map(key=>state.catalog?.items.find(candidate=>candidate.key===key))
    .filter(Boolean).map(purchaseBundleOf).filter(bundle=>bundle?.target===it?.key);
}
function effectivePurchaseYieldOf(it){const bundle=purchaseBundleOf(it);return bundle?+(bundle.min||1):purchaseYieldOf(it);}

async function api(path, opts, dsOverride) {

const REF_DS = ["vanilla", "kiddos", "prices1899"];
let refsLoading = false;

function refStore(ds) {
  if (!state.store[ds]) state.store[ds] = { catalog: null, quickSelect:null, effectByKey: {}, loot: {}, matrix: null, shops:null };
  return state.store[ds];
}

function hasScope(ds, scope, file) {
  const info = state.config.datasets[ds];
  return info && (info.scopes.includes("all") || info.scopes.includes(scope) || (file && info.scopes.includes(file)));
}

async function ensureRefCatalogs(rerender) {
  if (state.ds !== "mine" || refsLoading) return;
  const missing = REF_DS.filter(ds => state.config.datasets[ds].catalog && !refStore(ds).catalog);
  if (!missing.length) return;
  refsLoading = true;
  try {
    for (const ds of missing) {
      const st = refStore(ds);
      st.catalog = await api("/api/catalog", undefined, ds);
      for (const e of st.catalog.effects) st.effectByKey[e.key] = e;
    }
  } catch (e) { /* refs are best-effort */ }
  refsLoading = false;
  if(state.catalog)rebuildTagMaps(state.catalog);
  if (rerender) rerender();
}

async function ensureRefLoot(file, rerender) {
  if (state.ds !== "mine") return;
  const missing = REF_DS.filter(ds => hasScope(ds, "loot", file) &&
    state.config.datasets[ds].lootFiles.includes(file) && !refStore(ds).loot[file]);
  if (!missing.length) return;
  for (const ds of missing) {
    try { refStore(ds).loot[file] = await api("/api/loot/" + file, undefined, ds); }
    catch (e) { refStore(ds).loot[file] = { tables: [] }; }
  }
  if (rerender) rerender();
}

async function ensureRefMatrix(rerender) {
  if (state.ds !== "mine") return;
  for (const ds of ["vanilla", "kiddos"]) {
    if (hasScope(ds, "matrix") && state.config.datasets[ds].matrix && !refStore(ds).matrix)

function cashOf(it, section) {
  if (!it) return null;
  const availability=(section==="buy"?state.buyabilityEdits:state.sellabilityEdits)[it.key];
  if(availability&&!availability[section+"able"])return null;
  for (const c of it[section])
    for (const p of c.parts)
      if (p.item === "CURRENCY_CASH" && (section === "sell" || c.costtype === "COST_TYPE_PRICE")){
        const editKey=`${it.key}|${section}|${c.key}|${p.item}`;
        return state.priceEdits[editKey]??p.qty;
      }
  if(availability?.[section+"able"])return availability.cents??100;
  return null;
}

function cashCost(it,section) {
  if(!it)return null;
  return it[section].find(c=>c.parts.some(p=>p.item==="CURRENCY_CASH")&&(section==="sell"||c.costtype==="COST_TYPE_PRICE"))||null;
}

function cashParts(costs,section){
  const found=[];
  for(const cost of costs||[]){
    if(section!=="sell"&&cost.costtype!=="COST_TYPE_PRICE")continue;
    for(const part of cost.parts||[])if(part.item==="CURRENCY_CASH")found.push([cost,part]);
  }
  return found;
}

function currentShopTypesForItem(itemKey){
  const loaded=refStore(state.ds).shops?.shops;
  if(loaded)return loaded.filter(shop=>shop.items.some(row=>row.item===itemKey)).map(shop=>shop.type);
  const it=state.catalog?.items.find(candidate=>candidate.key===itemKey);
  return (it?.shopListings||[]).map(listing=>listing.shop);
}

function refItem(ds, key) {
  const st = state.store[ds];
  if (!st || !st.catalog) return null;
  if (!st._byKey) {
    st._byKey = {};
    for (const it of st.catalog.items) st._byKey[it.key] = it;
  }
  return st._byKey[key] || null;
}

const SLOT_LABELS = {
  "SLOTID_ANY":"default / any", "SLOTID_SATCHEL":"satchel",
  "0x04718245":"LotE satchel", "0xBE85CADE":"consumables satchel upgrade",
  "0x0D7CB5AE":"provisions satchel upgrade", "0xE655E53D":"ammo upgrade A",
  "0xD4774180":"ammo upgrade B", "0x550898DE":"unresolved engine slot A",
  "0xAEEE1782":"unresolved engine slot B"
};
const slotLabel = slot => SLOT_LABELS[slot] || (slot.startsWith("0x") ? `unresolved slot ${slot}` : slot.replace("SLOTID_","").toLowerCase());
function carrySlotOptions(it) {
  const slots = new Set(Object.keys(SLOT_LABELS));
  const collect = candidate => {
    if (!candidate) return;
    for (const rule of candidate.carry || []) slots.add(rule.slot);
  };
  collect(it);
  collect(refItem("vanilla", it.key));
  collect(refItem("kiddos", it.key));
  // Ammo upgrades apply across several ammo categories, so use the whole AMMO
  // group. Other items stay category-scoped to avoid irrelevant component slots.
  for (const candidate of state.catalog.items)
    if (candidate.category === it.category || (it.group === "AMMO" && candidate.group === "AMMO")) collect(candidate);
  return [...slots].filter(slot => !(it.carry || []).some(rule => rule.slot === slot))
    .sort((a,b)=>slotLabel(a).localeCompare(slotLabel(b))).map(value=>({value,label:`${slotLabel(value)} — ${value}`}));
}

// small "V … · K …" line; clicking a value applies it to the input in the same cell
function refLine(pairs, fmt, apply) {
  if (state.ds !== "mine") return "";
  const div = el("div", { class: "ref" });
  let any = false;
  for (const [tag, cls, val] of pairs) {
    const s = el("span", { title: "click to apply" }, ...(any ? ["· "] : []), el("b", { class: cls }, tag + " "),
      val === null || val === undefined ? "—" : fmt(val));
    if (val !== null && val !== undefined && apply)
      s.addEventListener("click", ev => apply(val, ev));
    div.append(s);
    any = true;
  }
  return any ? div : "";
}

// Compact reference values sit beside the input. Matching values carry no
// information and are omitted. If every available reference matches, the
// shared component returns nothing.
function refStack(pairs, current, apply, fmt) {
  fmt = fmt || String;
  if (state.ds !== "mine") return "";
  const norm = v => {
    if (v === null || v === undefined || v === "") return null;
    const s = String(v).trim();
    if (/^-?(?:\d+(?:\.\d*)?|\.\d+)$/.test(s)) return String(Number(s));
    return s.replace(/^0+(?=\d)/,"");
  };
  return LexeditorUI.referenceDisplay({
    className:"ref refstack",
    current:current===undefined?undefined:norm(current),
    sources:pairs.filter(([, , value])=>norm(value)!==null).map(([tag,cls,value])=>({
      name:tag==="V"?"Vanilla":tag,
      shortName:tag,
      className:cls,
      value,
    })),
    same:(left,right)=>norm(left)===norm(right),
    format:fmt,
    apply:(value,event)=>apply?.(value,event),
  })||"";
}

// refLine is now an alias: any caller that has not yet been given a `current`
// value still gets the unified compact display (it simply will not grey, since
// without current there is nothing to compare against). Signature preserved:
// refLine(pairs, fmt, apply) -> refStack(pairs, undefined, apply, fmt).
function refLine(pairs, fmt, apply) { return refStack(pairs, undefined, apply, fmt); }

/** Control + refStack on one row. The only supported way to attach V/K/etc.
 *  references to an editable field. Pass the control node and the same pairs
 *  you would give refStack; empty/no-ref collapses to just the control.
 *  opts.bool: compact centered checkbox layout (crime Off column). */
function refField(control, pairs, current, apply, fmt, opts={}) {
  const wrap = el("div", { class: opts.bool ? "ref-field ref-field-bool" : "ref-field" }, control);
  if (pairs) {
    const ref = refStack(pairs, current, apply, fmt);
    if (ref) wrap.append(ref);
  }
  return wrap;
}

function multiValueReferenceStack(references,key,currentEntry,{keyOf,entryValue,formatValue=String},ghost=false){
  if(state.ds!=="mine"||!references.length)return "";
  const stack=el("span",{class:"multi-ref-stack"});
  const comparable=value=>value===undefined||value===null?null:String(value);
  const currentValue=entryValue&&currentEntry?comparable(entryValue(currentEntry)):null;
  for(const [tag,cls,entries] of references){
    const referenceEntry=(entries||[]).find(entry=>keyOf(entry)===key);
    if(!referenceEntry){
      stack.append(el("span",{class:"multi-ref-state missing",title:`${tag}: this entry is not present`},
        el("b",{class:cls},tag),el("span",{class:"lex-ui-symbol"},"×")));
      continue;
    }
    const referenceValue=entryValue?comparable(entryValue(referenceEntry)):null;
    const matches=!ghost&&(!entryValue||referenceValue===currentValue);
    if(matches||!entryValue||referenceValue===null){
      stack.append(el("span",{class:"multi-ref-state matching",title:`${tag}: this entry is present${ghost?"":" and matches"}`},
        el("b",{class:cls},tag),el("span",{class:"lex-ui-symbol"},"✓")));
      continue;
    }
    const shown=formatValue(referenceValue,referenceEntry);
    stack.append(el("span",{class:"multi-ref-state value",title:`${tag}: ${shown}`},el("b",{class:cls},tag),shown));
  }
  return stack;
}

function multiValueReferences({kind,current,references,keyOf,entryValue,formatValue,sortKey,renderCurrent,renderGhost,addControl,emptyText="none"}){
  const wrap=el("div",{class:"multi-ref-field","data-multi-ref-kind":kind});
  const live=el("div",{class:"multi-ref-current"});
  const currentKeys=new Set();
  for(const entry of current){
    const key=keyOf(entry);currentKeys.add(key);
    const row=el("div",{class:"multi-ref-entry","data-multi-ref-key":key},renderCurrent(entry));
    const stack=multiValueReferenceStack(references,key,entry,{keyOf,entryValue,formatValue},false);
    if(stack)row.append(stack);
    live.append(row);
  }
  if(addControl)live.append(el("span",{class:"multi-ref-add"},addControl));
  if(!current.length&&!addControl&&emptyText)live.append(el("span",{class:"cat"},emptyText));
  wrap.append(live);
  if(state.ds==="mine"){
    const ghosts=new Map();
    for(const [, ,entries] of references)for(const entry of entries||[]){
      const key=keyOf(entry);if(!currentKeys.has(key)&&!ghosts.has(key))ghosts.set(key,entry);
    }
    const rows=[...ghosts.entries()].sort((a,b)=>String(sortKey?sortKey(a[1]):a[0]).localeCompare(String(sortKey?sortKey(b[1]):b[0]),undefined,{sensitivity:"base"}));
    if(rows.length){
      const ghostList=el("div",{class:"multi-ref-ghosts"});
      for(const [key,entry] of rows){
        const row=el("div",{class:"multi-ref-entry multi-ref-ghost","data-multi-ref-key":key},(renderGhost||renderCurrent)(entry));
        const stack=multiValueReferenceStack(references,key,entry,{keyOf,entryValue,formatValue},true);
        if(stack)row.append(stack);ghostList.append(row);
      }
      wrap.append(ghostList);
    }
  }
  return wrap;
}

// Carry rules are already one row per context. Keep each reference on its own
// compact line beside the value rather than adding another row below it.
function carryRefLine(pairs, fmt) {
  if (state.ds !== "mine") return "";
  const div=el("div",{class:"ref carry-ref"});
  for(const [tag,cls,val] of pairs)
    div.append(el("span",{},el("b",{class:cls},tag+" "),val===null||val===undefined?"—":fmt(val)));
  return div;
}

async function switchDataset(ds) {
  state.ds = ds;
  if($("#datasetname")) $("#datasetname").textContent = (dsInfo().readonly ? "🔒 " : "✏️ ") + dsInfo().label;
  if($("#modpath")) $("#modpath").textContent = dsInfo().dir;
  document.body.classList.toggle("readonly", isRO());
  if (!state.store[ds]) state.store[ds] = { catalog: null, quickSelect:null, effectByKey: {}, loot: {}, matrix: null, shops:null };
  const st = state.store[ds];
  if (!st.catalog && dsInfo().catalog) {
    $("#main").innerHTML = "";
    $("#main").append(el("div", { class: "loading" }, "Loading dataset…"));
    st.catalog = await api("/api/catalog");
    for (const e of st.catalog.effects) st.effectByKey[e.key] = e;
  }
  if (!st.quickSelect) {
    st.quickSelect = await api("/api/quick-select").catch(error=>({available:false,items:{},slotsByGroup:{},reason:error.message,activeFile:"quickselectitems.ymt"}));
  }
  state.catalog = st.catalog;
  state.quickSelect = st.quickSelect;
  state.effectByKey = st.effectByKey;
  state.loot = st.loot;
  state.matrix = st.matrix;
  state.lootFile = [...dsInfo().lootFiles].sort((a,b)=>(LOOT_TAB_LABELS[a]||a).localeCompare(LOOT_TAB_LABELS[b]||b))[0] || null;
  const dlI = $("#dl-items"); dlI.innerHTML = "";
  if (st.catalog) {
    rebuildTagMaps(st.catalog);
    for (const it of [...st.catalog.items].sort((a, b) => a.key.localeCompare(b.key)))
      dlI.append(el("option", { value: it.key }));
  }
  render();
  LexeditorUI.finishPluginLoading();
}

async function boot() {
  try {
    state.config = await api("/api/config");
    state.labels = await api("/api/labels");
    state.localization = await api("/api/localization");
    state.alcohol = await api("/api/alcohol-strengths").catch(()=>({available:false,file:null,entries:{}}));
    state.customCrafting = await api("/api/custom-crafting").catch(()=>({available:false,customFile:null,vanillaFile:null,vanilla:[],custom:[],errors:["Custom crafting API unavailable"]}));
    state.customCraftingDraft = JSON.parse(JSON.stringify(state.customCrafting.custom||[]));
    const sel = $("#dsselect");
    if(sel) for (const [key, info] of Object.entries(state.config.datasets)) {
      const o = el("option", { value: key }, (info.readonly ? "🔒 " : "✏️ ") + info.label);
      if (key === state.ds) o.selected = true;
      sel.append(o);
    }
    if(sel) sel.addEventListener("change", () => switchDataset(sel.value));
    await switchDataset("mine");
  } catch (ex) {
    state.loadError = ex;
    throw ex;
  } finally {
    state.booting = false;
  }
  render();
}

async function loadLoot(file) {
  if (!state.loot[file]) {
    state.loot[file] = await api("/api/loot/" + file);
    state.loot[file].tables.forEach(t => { t.open = false; });
  }
  const dl = $("#dl-tables"); dl.innerHTML = "";
  for (const t of state.loot[file].tables) dl.append(el("option", { value: t.key }));
}

async function ensureAllLoot() {
  for (const file of dsInfo().lootFiles) await loadLoot(file);
  const dl = $("#dl-tables"); dl.innerHTML = "";
  for (const file of dsInfo().lootFiles)
    for (const t of state.loot[file].tables) dl.append(el("option", { value: t.key, label: file }));
}

function findLootTable(key) {
  for (const file of dsInfo().lootFiles) {
    const table = state.loot[file]?.tables.find(t => t.key === key);
    if (table) return { file, table };
  }
  return null;
}

function refreshGlobalSave() {
  const b=$("#global-save"), n=dirtyCount();
  b.disabled=isRO() || !n;
  b.title=n?`Save all ${n} unsaved change${n===1?"":"s"} to mod files`:"No unsaved mod-file changes";

async function saveAllChanges() {
  if(isRO()||!dirtyCount())return;
  const originalLootFile=state.lootFile;
  try {
    if(Object.keys(state.settingEdits).length)await saveSettings();
    if(state.customCraftingDirty)await saveCustomCrafting();
    if(state.shopDirty.size)await saveShops();
    if(Object.keys(state.shopBuyerDirty).length)await saveShopBuyerOverrides();
    const catalogStores=["priceEdits","buyabilityEdits","sellabilityEdits","yieldEdits","bundleEdits",
      "itemEffectEdits","itemTagEdits","quickSelectEdits","descriptionKeyEdits","carryEdits","craftEdits","effectEdits","localizationEdits"];
    if(catalogStores.some(key=>Object.keys(state[key]).length))await saveCatalog();
    await saveLoot();   // saves every dirty loot file itself
    state.lootFile=originalLootFile;
    if(state.matrixDirty.size)await saveMatrix();
    if(Object.keys(state.challengeEdits).length||Object.keys(state.challengeSourceEdits).length||Object.keys(state.challengeConditionEdits).length||
       Object.keys(state.challengeRewardEdits).length||Object.keys(state.challengeUiEdits).length||Object.keys(state.challengeModeEdits).length)await saveChallenges();
    for(const [key,map] of Object.entries(state.weaponEdits))if(Object.keys(map).length){
      const cut=key.indexOf("|"),section=key.slice(0,cut),name=key.slice(cut+1);
      const record=state.weaponData.mine?.[section]?.find(row=>row.name===name);
      await api("/api/weapons/save",{method:"POST",headers:{"Content-Type":"application/json"},
        body:JSON.stringify({section,name,sourceFile:record?.sourceFile,edits:Object.values(map)})});
      delete state.weaponEdits[key];
    }
    if(state.weaponShellVfxEdit!==null)await saveWeaponShellVfx();
    if(!Object.keys(state.weaponEdits).length)delete state.weaponData.mine;
    for(const [file,map] of Object.entries(state.aiEdits))if(Object.keys(map).length){
      await api("/api/ai/"+file+"/save",{method:"POST",headers:{"Content-Type":"application/json"},
        body:JSON.stringify({edits:Object.values(map)})});
      state.aiEdits[file]={};delete state.aiData[file];
    }
    if(Object.keys(state.mobEdits).length){
      await api("/api/mobs/save",{method:"POST",headers:{"Content-Type":"application/json"},
        body:JSON.stringify({edits:Object.values(state.mobEdits)})});
      state.mobEdits={};state.mobs=null;
    }
    if(Object.keys(state.crimeEdits).length||Object.keys(state.dispatchEdits).length)await saveCrime();
    if(Object.keys(state.bountyHunterEdits).length)await saveBountyHunters();
    if(Object.keys(state.honorActionEdits).length)await saveHonorActions();
    rdr2Shell.history?.clear();render();toast("All changes saved to mod files");
  } catch(ex) {
    state.lootFile=originalLootFile;refreshGlobalSave();showSaveFailure(ex);
  }
}

// ----- Items & Prices -----
function isPlantItem(it){
  return it.key.startsWith("CONSUMABLE_HERB_") ||
    (it.lootSources||[]).some(s=>s.file==="loot_table_herb.meta");
}

// A "unique" is a one-of-a-kind item: trinkets, talismans, legendary animal parts,
// gang keepsakes, discovery collectibles and quest valuables. The catalog has no single
// flag for this, so it is derived from three signals. Carry caps are read from VANILLA so
// the tab stays stable while the user retunes caps in this dataset.
function vanillaCarry(it, slot){
  const src = refItem("vanilla", it.key) || it;
  const rule = (src.carry || []).find(c => c.slot === slot);
  return rule ? Number(rule.qty) : null;
}

function isUniqueItem(it){
  if (itemHasTag(it, "CI_TAG_ITEM_TRINKET")) return true;   // 20 crafted trinkets
  if (it.key.startsWith("PROVISION_TALISMAN_")) return true;          // talismans sit in CLOTHING with cap on SLOTID_ANY
  // Consumables and upgrades reach cap 1 for balance reasons, not because they are unique.
  if (it.group === "CONSUMABLE" || it.group === "UPGRADE") return false;
  return vanillaCarry(it, "SLOTID_SATCHEL") === 1;
}

const INGREDIENT_ITEM_KEYS = new Set(["LEX_BRASS","LEX_GUNPOWDER","LEX_LEAD","LEX_STEEL"]);
function isIngredientItem(it){return INGREDIENT_ITEM_KEYS.has(it.key)||it.key.startsWith("LEX_CASING_");}

const ITEM_SECTIONS = [
  {id:"all", label:"All"},
  {id:"advert", label:"Advert", match:it=>it.group==="ADVERT"},
  {id:"ammo", label:"Ammo", match:it=>it.group==="AMMO"},
  {id:"clothing", label:"Clothing", match:it=>it.group==="CLOTHING"},
  {id:"consumables", label:"Consumables", match:it=>it.group==="CONSUMABLE"},
  {id:"documents", label:"Document", match:it=>it.group==="DOCUMENT"},
  {id:"herbs", label:"Herbs", match:isPlantItem},
  {id:"horses", label:"Horses", match:it=>it.group==="HORSE"||it.group==="HORSE_EQUIPMENT"},
  {id:"ingredients", label:"Ingredients", match:isIngredientItem},
  {id:"provisions", label:"Provisions", match:it=>it.group==="PROVISION"},
  {id:"uniques", label:"Uniques", match:isUniqueItem},
  {id:"upgrades", label:"Upgrades", match:it=>it.group==="UPGRADE"},
  {id:"valuables", label:"Valuables", match:it=>it.group==="MONEY"||it.group==="CURRENCY"||it.category==="CI_CATEGORY_VALUABLE"},
  {id:"weapons", label:"Weapons", match:it=>it.group==="WEAPON"||it.group==="WEAPON_MOD"||it.group==="WEAPON_DECORATION"||it.group==="COMPONENT"},
  {id:"misc", label:"Misc"}
];

function itemSectionOf(it){
  // Precedence keeps broad catalog groups from swallowing more useful views.
  if(isPlantItem(it))return "herbs";
  if(isIngredientItem(it))return "ingredients";
  // Uniques outrank valuables/provisions/clothing, which would otherwise swallow
  // the skull statue, the trinkets and the talismans respectively.
  if(isUniqueItem(it))return "uniques";
  if(it.group==="MONEY"||it.group==="CURRENCY"||it.category==="CI_CATEGORY_VALUABLE")return "valuables";
  const section=ITEM_SECTIONS.find(s=>s.id!=="all"&&s.id!=="herbs"&&s.id!=="misc"&&s.match?.(it));
  return section?.id||"misc";
}

function itemSectionMatches(it,section){
  return !section||section==="all"||itemSectionOf(it)===section;
}

}

async function createNewItem(){
  const key=(prompt("New internal item ID (for example LEX_SULFUR):","")||"").trim().toUpperCase();
  if(!key)return;
  const name=(prompt("In-game name:",key.replace(/^LEX_/,"").replaceAll("_"," "))||"").trim();
  if(!name)return;

  const inp = el("input", { type: "number", step: "0.01", min: "0", value: fmtMoney(cur),
    class: editKey in state.priceEdits ? "edited" : "",

const isCraftCost = c => c.costtype === "COST_TYPE_CRAFT" || (c.key || "").includes("CRAFT");
const CRAFT_COST_KEYS = {
  COST_CRAFTING:"General / portable recipe",
  COST_CRAFTING_2:"Alternate ingredients #2",
  COST_CRAFTING_3:"Alternate ingredients #3",
  COST_CRAFTING_4:"Alternate ingredients #4",
  COST_CRAFTING_FIRE:"Campfire: tonics, remedies & coffee",
  COST_CRAFTING_GRILL:"Campfire grill: seasoned meat",
  COST_CRAFTING_KNIFE:"Plain-meat cooking recipe",
  COST_CRAFTING_TRAPPER:"Trapper crafting",
  COST_CRAFTING_FENCE:"Fence crafting",
  COST_CRAFTING_PEARSON:"Pearson camp crafting"
};

function craftKeySelect(entry,onchange,usedKeys=[]) {
  return el("select", {class:"key",title:"Recipe context or alternate-recipe slot. The COST_CRAFTING_2–4 keys are alternate ingredient formulas for the same output, not different crafting stations.",onchange},
    ...Object.entries(CRAFT_COST_KEYS).map(([value,label])=>{const attrs={value,title:value};if(usedKeys.includes(value)&&entry.key!==value)attrs.disabled="disabled";const option=el("option",attrs,`${label} — ${value}`);if(entry.key===value)option.selected=true;return option;}));
}
function nextCraftKey(entries){return Object.keys(CRAFT_COST_KEYS).find(key=>!entries.some(e=>e.key===key))||"";}

function recipeUnlockKeys(){
  if(!state.catalog._recipeUnlockKeys){const base=new Set(["ALWAYS KNOWN"]);for(const it of state.catalog.items)for(const cost of it.buy.filter(isCraftCost))for(const key of cost.unlocks||[])if(key)base.add(key);state.catalog._recipeUnlockKeys=[...base].sort();}
  const keys=new Set(state.catalog._recipeUnlockKeys);
  for(const entries of Object.values(state.craftEdits))for(const recipe of entries)for(const key of recipe.unlocks||[])if(key)keys.add(key);
  return [...keys].sort();
}

function catalogItemKeys(){return state.catalog._itemKeys||(state.catalog._itemKeys=state.catalog.items.map(x=>x.key).sort());}

function catalogItemOptions(){
  return state.catalog._itemOptions||(state.catalog._itemOptions=state.catalog.items
    .map(it=>({value:it.key,label:`${localizedValue(it.nameKey)||"No localized name"} - ${it.key}`}))

function craftView(it) {
  // edited copy if present, else the underlying data (not yet dirty)
  return state.craftEdits[it.key] ??
    it.buy.filter(isCraftCost).map(c => ({ key: c.key, yield: c.yield || 1,
      parts: c.parts.map(p => ({ item: p.item, qty: p.qty })), unlocks: [...(c.unlocks || [])] }));
}

function costToRecipe(cost){
  return { key: cost.key, yield: cost.yield || 1,
    parts: cost.parts.map(p => ({ item: p.item, qty: p.qty })),
    unlocks: [...(cost.unlocks || [])] };
}

function refRecipes(it, ds){
  const ref=refItem(ds,it.key);
  return ref?ref.buy.filter(isCraftCost).map(costToRecipe):[];
}

function recipeSummary(recipe){
  if(!recipe)return "not present";
  const station=CRAFT_COST_KEYS[recipe.key]||recipe.key;
  const unlock=(recipe.unlocks||[])[0]||"ALWAYS KNOWN";
  const parts=(recipe.parts||[]).map(p=>`${p.item} ×${p.qty}`).join(", ")||"no ingredients";
  return `${station}; makes ${recipe.yield||1}; ${unlock}; ${parts}`;
}

function applyRecipeReference(it,index,recipe){
  const recipes=ensureCraft(it);
  recipes[index]=JSON.parse(JSON.stringify(recipe));
  renderItems();
}

  if(isRO())return "";
  const refs=[["V","vtag",refRecipes(it,"vanilla")[index]],["K","ktag",refRecipes(it,"kiddos")[index]]]
    .filter(([, , recipe])=>recipe);

    el("span",{class:"cat"},"Reference recipe"),

      onclick:()=>applyRecipeReference(it,index,recipe)},el("b",{class:cls},tag+" "),recipeSummary(recipe))));
}

function ensureCraft(it) {
  if (!state.craftEdits[it.key])
    state.craftEdits[it.key] = JSON.parse(JSON.stringify(craftView(it)));
  return state.craftEdits[it.key];
}

function portableCraftEntries(entries){
  return entries.map(entry=>{
    if(!["COST_CRAFTING_TRAPPER","COST_CRAFTING_FENCE"].includes(entry.key))return entry;
    return {...entry,key:"COST_CRAFTING",parts:entry.parts.filter(part=>part.item!=="CURRENCY_CASH")};
  });

  if(recipeVariant)controls.append(el("button",{class:"icon-link",title:`Recipe is stored on ${recipeVariant.key}`,onclick:()=>goToRecipeOutput(recipeVariant.key)},"⌕"));
  if(entries.length)controls.append(el("button",{class:"icon-link",title:"Open this item's recipes in Crafting",onclick:()=>goToRecipeOutput(it.key)},"⌕"));
  if(!entries.length&&isRO())controls.append(el("span",{class:"cat"},"none"));
  else if(recipeVariant)controls.append(el("button",{class:"table-link",title:`The game stores this formula on the separate ${recipeVariant.key} record.`,onclick:()=>goToRecipeOutput(recipeVariant.key)},"Recipe on crafted variant"));
  else {
    const toggleRecipe=()=>{

      if(state.expandedRecipes.has(it.key))state.expandedRecipes.delete(it.key);else state.expandedRecipes.add(it.key);

      ["V","vtag",vrecipes.length?vrecipes.length:null],["K","ktag",krecipes.length?krecipes.length:null]],v=>`${v} recipe${v===1?"":"s"}`));

function itemEffectsCell(it){
  const cell=el("td");
  const draw=()=>{
    const current=isRO()?it.effects:[...(state.itemEffectEdits[it.key]??it.effects)];
    const vanilla=refItem("vanilla",it.key),kiddos=refItem("kiddos",it.key);
    const references=[["V","vtag",vanilla?.effects||[]],["K","ktag",kiddos?.effects||[]]]
      .filter(([, ,entries],index)=>index===0?!!vanilla:!!kiddos);
    const effectChip=(key,removable)=>{
      const known=state.effectByKey[key];
      const chip=el("span",{class:"chip",title:(known?effectSummary(known):"unknown effect")+"\nkey: "+key},effectLink(key));
      if(!isRO()&&removable){
        const remove=el("span",{class:"x",title:"Remove effect"},"×");
        remove.addEventListener("pointerdown",event=>{
          event.stopPropagation();event.preventDefault();
          const next=[...(state.itemEffectEdits[it.key]??it.effects)];
          next.splice(next.indexOf(key),1);setItemEffects(it,next);draw();renderToolbarOnly();
        });
        remove.addEventListener("click",event=>event.stopPropagation());chip.append(remove);
      }
      return chip;
    };
    let controls="";
    if(!isRO()){
      const add=newButton({title:"Add effect",onclick:()=>{
        const present=new Set(state.itemEffectEdits[it.key]??it.effects);
        const options=state.catalog.effects.filter(effect=>!present.has(effect.key)).map(effect=>{
          const name=effectDisplayName(effect.key);return {value:effect.key,label:name===effect.key?effect.key:`${name} (${effect.key})`};
        }).sort((a,b)=>a.label.localeCompare(b.label,undefined,{sensitivity:"base"}));
        pickIdentifier("Add effect",options,"",key=>{
          const next=[...(state.itemEffectEdits[it.key]??it.effects)];
          if(!next.includes(key)){next.push(key);setItemEffects(it,next);draw();renderToolbarOnly();}
        });
      }});
      const buttons=[add];
      const changed=vanilla&&JSON.stringify([...current].sort())!==JSON.stringify([...(vanilla.effects||[])].sort());
      if(changed)buttons.push(el("button",{class:"icon-link",title:"Restore the complete Vanilla effect set",onclick:()=>{
        setItemEffects(it,[...(vanilla.effects||[])]);draw();renderToolbarOnly();
      }},"↺"));
      controls=el("span",{},...buttons);
    }
    cell.replaceChildren(multiValueReferences({
      kind:"item-effects",current,references,keyOf:key=>key,
      sortKey:key=>effectDisplayName(key),renderCurrent:key=>effectChip(key,true),renderGhost:key=>effectChip(key,false),
      addControl:controls,emptyText:"no effects",
    }));
  };
  draw();return cell;
}

const inventoryIconLoads=new Map();

function inventoryIconCandidates(texture){
  if(!texture?.id)return [];
  const dict=(texture.dict||"").toUpperCase();
  const id=encodeURIComponent(texture.id.toLowerCase());
  if(dict==="INVENTORY_ITEMS")return [
    `/assets/inventory_icons/inventory_items/${id}.png`,
    `https://femga.com:8080/images/samples/ui_textures_no_bg/inventory_items/${id}.png`,
  ];
  // Femga stores the RDO dictionary below its ui_textures_mp family. The old
  // generic dictionary path omitted that family and returned an HTML 404.
  if(dict==="INVENTORY_ITEMS_MP")return [
    `https://femga.com:8080/images/samples/ui_textures_no_bg/ui_textures_mp/inventory_items_mp/${id}.png`,
  ];
  if(dict==="LEX_INVENTORY_ITEMS")return [`/assets/item-icons/${id}.png`];
  if(dict==="ITEM_TEXTURES"||dict==="UI_ITEMVIEWER")return [`/assets/dictionary_icons/${dict.toLowerCase()}/${id}.png`];
  if(dict)return [`https://femga.com:8080/images/samples/ui_textures_no_bg/${dict.toLowerCase()}/${id}.png`];
  return [];
}

function inventoryIconKey(texture){return `${(texture?.dict||"").toUpperCase()}|${(texture?.id||"").toUpperCase()}`;}

function loadInventoryIcon(texture){
  const key=inventoryIconKey(texture),known=inventoryIconLoads.get(key);
  if(known)return known;
  const candidates=inventoryIconCandidates(texture);
  const load=new Promise(resolve=>{
    const tryAt=index=>{
      if(index>=candidates.length){resolve("");return;}
      const image=new Image();
      image.onload=()=>resolve(image.naturalWidth&&image.naturalHeight?candidates[index]:"");
      image.onerror=()=>tryAt(index+1);
      image.src=candidates[index];
    };
    tryAt(0);
  });
  inventoryIconLoads.set(key,load);return load;
}

function modelPreviewKey(it){return `${state.ds}|${it.key}|${it.model||""}`;}

function modelEyeThrobber(){return el("span",{class:"model-eye-throbber","aria-hidden":"true"});}

function markModelPreviewButtonLoading(button,it){
  button.classList.add("loading");button.replaceChildren(modelEyeThrobber());button.disabled=true;
  button.title=`Preparing the real ${it.model} model in the background…`;
  button.setAttribute("aria-label",`Preparing ${it.model} model`);button.onclick=null;

function applyModelPreviewButton(button,it,status){
  const load=state.modelPreviewLoads[modelPreviewKey(it)];
  const available=!!it.model&&status?.available===true;
  const checking=!!it.model&&status?.checking===true;
  const loading=checking||load?.status==="loading";
  button.classList.toggle("loading",loading);
  button.replaceChildren(loading?modelEyeThrobber():eyeIcon());
  button.disabled=!available||loading;
  button.title=!it.model?"This catalog item does not name a model asset":
    checking?`Checking the installed ${it.model} asset…`:
    load?.status==="loading"?`Preparing the real ${it.model} model in the background…`:
    available?`View the real ${it.model} model`:
    status?.reason||"This installed model is not previewable";
  button.setAttribute("aria-label",loading?`Preparing ${it.model} model`:available?`View ${it.model} model`:button.title);
  button.onclick=available&&!loading?()=>requestModelPreview(it,button):null;
}

function modelPreviewButton(it){
  const key=modelPreviewKey(it);
  const button=el("button",{class:"icon-link model-eye"},eyeIcon());
  if(!it.model){applyModelPreviewButton(button,it,{available:false});return button;}
  let status=state.modelPreviewAvailability[key];
  if(!status){
    const promise=api(`/api/model-preview/availability?item=${encodeURIComponent(it.key)}`)
      .then(result=>{state.modelPreviewAvailability[key]=result;return result;})
      .catch(error=>{const result={available:false,reason:`Model check failed: ${error.message}`};state.modelPreviewAvailability[key]=result;return result;});
    status={checking:true,promise};state.modelPreviewAvailability[key]=status;
  }
  applyModelPreviewButton(button,it,status);
  if(status.promise)status.promise.then(result=>{if(button.isConnected)applyModelPreviewButton(button,it,result);});
  const load=state.modelPreviewLoads[key];
  if(load?.status==="loading")load.promise.then(
    ()=>{if(button.isConnected)applyModelPreviewButton(button,it,state.modelPreviewAvailability[key]);},
    ()=>{if(button.isConnected)applyModelPreviewButton(button,it,state.modelPreviewAvailability[key]);});
  return button;
}

function prepareModelPreview(it){
  const key=modelPreviewKey(it),existing=state.modelPreviewLoads[key];
  if(existing)return existing;
  const task={key,status:"loading",preview:null,geometry:null,error:null,promise:null};
  task.promise=(async()=>{
    const preview=await api("/api/model-preview",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({item:it.key,model:it.model})});
    const response=await fetch(preview.geometryUrl);if(!response.ok)throw new Error("The cached model geometry could not be read.");
    task.preview=preview;task.geometry=await response.json();task.status="ready";return task;
  })().catch(error=>{task.status="error";task.error=error;throw error;});
  state.modelPreviewLoads[key]=task;return task;
}

function modelPreviewContextCurrent(button,it,context){
  return button.isConnected&&state.tab==="items"&&state.ds===context.ds&&state.filters.itemSel===it.key&&$("#picker").classList.contains("hidden");
}

async function requestModelPreview(it,button){
  const key=modelPreviewKey(it),context={ds:state.ds};
  let task=prepareModelPreview(it);
  markModelPreviewButtonLoading(button,it);
  try{
    task=await task.promise;
    if(!modelPreviewContextCurrent(button,it,context))return;
    await openPreparedModelPreview(it,task,button,context);
  }catch(error){
    delete state.modelPreviewLoads[key];
    if(modelPreviewContextCurrent(button,it,context))toast(error.message,true);
  }finally{
    if(button.isConnected)applyModelPreviewButton(button,it,state.modelPreviewAvailability[key]);
  }
}

function formatFileSize(value){
  const bytes=Math.max(0,Number(value)||0);if(bytes<1024)return `${bytes} B`;
  const units=["KB","MB","GB"],power=Math.min(units.length,Math.floor(Math.log(bytes)/Math.log(1024)));
  return `${(bytes/1024**power).toFixed(power>1?2:1)} ${units[power-1]}`;
}

function itemDescriptionCell(it){
  if(isRO()&&!it.descriptionKey){const area=el("textarea",{readonly:"readonly",title:"This catalog record has no description field."});area.value="N/A";return el("td",{},area);}
  const shared=it.descriptionKey&&state.catalog.items.filter(x=>x.descriptionKey===it.descriptionKey).length>1;
  const generatedDescriptionKey=/^0x[0-9a-f]{8}$/i.test(it.key)
    ? `LEX_DESC_${it.key.slice(2).toUpperCase()}`
    : `${it.key}_DESC`;
  const key=state.descriptionKeyEdits[it.key]||(shared?generatedDescriptionKey:it.descriptionKey)||generatedDescriptionKey;
  let editor;
  if(shared&&!state.descriptionKeyEdits[it.key]){
    const attrs={class:"localized-description",placeholder:"No localized description",title:`This text currently shares ${it.descriptionKey}; editing creates the independent key ${key}.`,onchange:ev=>{const value=sanitizeItemDescription(ev.target.value);ev.target.value=value;state.descriptionKeyEdits[it.key]=key;state.localizationEdits[key]=value;ev.target.classList.add("edited");renderToolbarOnly();}};
    if(isRO())attrs.readonly="readonly";editor=el("textarea",attrs);editor.value=localizedValue(it.descriptionKey);
  }else {
    editor=localizationTextarea(key,it.descriptionKey?"No localized description":"Add an in-game description…",value=>{if(!it.descriptionKey||shared){if(value.trim())state.descriptionKeyEdits[it.key]=key;else delete state.descriptionKeyEdits[it.key];}});
    const originalChange=editor.onchange;
    editor.onchange=ev=>{ev.target.value=sanitizeItemDescription(ev.target.value);originalChange(ev);};
  }
  const vanilla=state.localization?.vanilla?.[it.descriptionKey||key];
  return el("td", {class:"desc-cell"}, refField(editor, [["V","vtag",vanilla]], localizedValue(key), v=>applyToControl(editor,v), String));
}

function shopBuyState(shopType,it){
  if(!state.shopBuyers?.available||!state.shopBuyers.shops?.includes(shopType))
    return {active:false,kind:"unavailable",mode:"default",title:"No captured buyer data exists for this shop type."};
  const mode=merchantOverride(shopType,it.key);
  if(mode==="accept")return {active:true,kind:"accept",mode,title:"Explicit Accept override. Click to Reject; right-click to return to Vanilla."};
  if(mode==="reject")return {active:false,kind:"reject",mode,title:"Explicit Reject override. Click to Accept; right-click to return to Vanilla."};
  const listed=!!state.shopBuyers.vanillaBuyers?.[shopType]?.includes(it.key);
  return listed
    ?{active:true,kind:"listed",mode,title:"Rockstar's sparse buyer PDATA explicitly lists this item. Click to Reject; right-click to restore Vanilla."}
    :{active:false,kind:"unknown",mode,title:"Not explicitly listed. Rockstar's compiled category rule remains unknown. Click to force Accept; right-click keeps Vanilla."};
}

function stageMerchantOverride(shop,item,mode){

function shopRequirementText(requirement){
  return `${requirement.type||"Unresolved type"}: ${requirement.key||"Unresolved key"}${requirement.state?` = ${requirement.state}`:""}${requirement.lock?` · lock ${requirement.lock}`:""}`;
}

function shopRequirementGroups(row){
  if(Array.isArray(row?.requirementGroups))return row.requirementGroups;
  return row?.requirements?.length?[{count:"1",requirements:row.requirements}]:[];
}

function shopRequirementCount(row){
  return shopRequirementGroups(row).reduce((total,group)=>total+(group.requirements||[]).length,0);
}

function shopRequirementOptions(){
  const types=new Set(),keys=new Set();
  for(const shop of state.shops?.shops||[])for(const row of shop.items||[])for(const group of shopRequirementGroups(row))
    for(const requirement of group.requirements||[]){if(requirement.type)types.add(requirement.type);if(requirement.key)keys.add(requirement.key);}
  return {types:[...types].sort(),keys:[...keys].sort()};
}

function normalizeShopRequirementDraft(groups){
  return groups.map(group=>({count:String(group.count??"1").trim(),requirements:(group.requirements||[]).map(requirement=>({
    type:String(requirement.type||"").trim(),key:String(requirement.key||"").trim(),state:String(requirement.state??"1").trim(),
    lock:String(requirement.lock??"false").trim().toLowerCase()}))}));
}

function validateShopRequirementDraft(groups){
  for(let groupIndex=0;groupIndex<groups.length;groupIndex++){
    const group=groups[groupIndex];
    if(!/^-?\d+$/.test(String(group.count??"")))return `Group ${groupIndex+1}: count must be a whole number.`;
    for(let requirementIndex=0;requirementIndex<(group.requirements||[]).length;requirementIndex++){
      const requirement=group.requirements[requirementIndex],prefix=`Group ${groupIndex+1}, condition ${requirementIndex+1}`;
      if(!requirement.type||!requirement.key)return `${prefix}: type and key are required.`;
      if(!/^-?\d+$/.test(String(requirement.state??"")))return `${prefix}: state must be a whole number.`;
      if(!["true","false"].includes(String(requirement.lock)))return `${prefix}: lock must be true or false.`;
    }
  }
  return "";
}

function shopCatalogueMenuLabel(key){
  const resolved=humanName("catalogueMenus",key)||key||"Unresolved";
  if(/^0x[0-9a-f]{8}$/i.test(resolved))return resolved.toUpperCase();
  const cleaned=resolved.replace(/^(?:GENERAL_MENU_|TAILOR_MENU_|MENU_)/i,"")
    .replace(/_(?:STYLE_SELECTOR|SELECTOR|MENU)$/i,"").replaceAll("_"," ").trim();
  return (cleaned||resolved).toLowerCase().replace(/\b\w/g,letter=>letter.toUpperCase());
}

function shopCatalogueMenuId(key){return shopCatalogueMenuLabel(key).toUpperCase();}

function shopCatalogueFilterModel(shop){
  const rawPaths=(shop?.catalogueCategories||[]).map(category=>category.path||[]).filter(path=>path.length);
  if(!rawPaths.length)return {prefix:0,top:[],second:[],topSelected:"",secondSelected:""};
  const minDepth=Math.min(...rawPaths.map(path=>path.length));
  let prefix=0;
  while(prefix<minDepth-1&&rawPaths.every(path=>String(path[prefix]).toUpperCase()===String(rawPaths[0][prefix]).toUpperCase()))prefix++;
  const paths=rawPaths.map(path=>path.slice(prefix)),topById=new Map();
  paths.forEach(path=>{const id=shopCatalogueMenuId(path[0]);if(!topById.has(id))topById.set(id,{id,label:shopCatalogueMenuLabel(path[0])});});
  const top=[...topById.values()].sort((a,b)=>a.label.localeCompare(b.label));
  if(!topById.has(state.filters.shopSellCategory))state.filters.shopSellCategory="";
  const topSelected=state.filters.shopSellCategory,secondById=new Map();
  if(topSelected)paths.filter(path=>shopCatalogueMenuId(path[0])===topSelected&&path.length>1).forEach(path=>{
    const id=shopCatalogueMenuId(path[1]);if(!secondById.has(id))secondById.set(id,{id,label:shopCatalogueMenuLabel(path[1])});
  });
  const second=[...secondById.values()].sort((a,b)=>a.label.localeCompare(b.label));
  if(!secondById.has(state.filters.shopSellSubcategory))state.filters.shopSellSubcategory="";
  return {prefix,top,second,topSelected,secondSelected:state.filters.shopSellSubcategory};
}

        state.filters.shopSellSubcategory="";renderShops();}},category.label)));

function shopListingMatchesCatalogueFilter(listing,model){
  if(!model.topSelected)return true;
  return (listing?.cataloguePages||[]).some(page=>{
    const path=(page.categoryPath||[]).slice(model.prefix);
    return shopCatalogueMenuId(path[0])===model.topSelected&&
      (!model.secondSelected||shopCatalogueMenuId(path[1])===model.secondSelected);
  });
}

/** Build/refresh tag catalog from server payload + every loaded item (mine + refs). */
function rebuildTagMaps(catalog){
  if(!catalog)return {tags:[],types:[],alcoholStrength:FALLBACK_ALCOHOL_STRENGTH};
  // Re-entrancy guard: tagTypeLabel/tagCatalog must never re-enter rebuild.
  if(catalog._tagMapsBuilding)return catalog.tagCatalog||{tags:[],types:[],alcoholStrength:FALLBACK_ALCOHOL_STRENGTH};
  catalog._tagMapsBuilding=true;
  try{
    const prevCatalog=catalog.tagCatalog;
    const alcohol=prevCatalog?.alcoholStrength?.length?prevCatalog.alcoholStrength:FALLBACK_ALCOHOL_STRENGTH;
    const seen=new Map();
    const ingest=(tag,count=1)=>{
      const t=normalizeTag(tag);if(!t)return;
      const id=t.key;
      const prev=seen.get(id);
      const resolved=!/^0x/i.test(t.key)||alcohol.some(a=>normalizeTagToken(a.key)===t.key);
      const typ=t.type||prev?.type||"";
      const row={
        key:t.key,type:typ,
        label:alcohol.find(a=>normalizeTagToken(a.key)===t.key)?.label||prettyTagKey(t.key),
        typeLabel:tagTypeLabel(typ),
        group:tagPurposeGroup(t.key),
        resolved,
        pickable:resolved||t.key.startsWith("CI_TAG_"),
        count:(prev?.count||0)+count,
      };
      if(prev&&prev.type&&!t.type)row.type=prev.type;
      if(prev&&t.type&&!prev.type)row.type=t.type;
      seen.set(id,row);
    };
    // Seed from prior server/client catalog without re-walking if already dense.
    for(const row of prevCatalog?.tags||[])ingest(row,row.count||1);
    for(const it of catalog.items||[])for(const tag of it.tags||[])ingest(tag,1);
    for(const ds of ["vanilla","kiddos"]){
      const items=refStore(ds).catalog?.items||[];
      for(const it of items)for(const tag of it.tags||[])ingest(tag,1);
    }
    for(const a of alcohol)ingest(a,0);
    const tags=[...seen.values()].sort((a,b)=>(a.group||"").localeCompare(b.group||"")||(a.label||"").localeCompare(b.label||"")||a.key.localeCompare(b.key));
    catalog.tagCatalog={
      tags,
      types:Object.entries(TAG_TYPE_LABELS_UI).map(([type,label])=>({type,label})),
      alcoholStrength:alcohol,
    };
    return catalog.tagCatalog;
  }finally{
    delete catalog._tagMapsBuilding;
  }
}

}

    || rows.find(r=>r.key===t.key)

        group:tagPurposeGroup(t.key),resolved:!/^0x/i.test(t.key),pickable:t.key.startsWith("CI_TAG_")};

function effectSummary(e) {
  let s = e.id;
  if (+e.percent) s += ` ${e.percent}%`;
  if (+e.time) s += ` for ${formatEffectDuration(e.time, e.timeunits)}`;
  return s;
}

function formatEffectDuration(time, units) {
  const n = Number(time);
  const u = String(units);
  const labels = {
    "0": ["second", "seconds"],
    "1": ["minute", "minutes"],
    "2": ["in-game hour", "in-game hours"],
    "3": ["in-game day", "in-game days"],
  };
  const pair = labels[u];
  if (!pair) return `${time} (units ${units})`;
  return `${time} ${Math.abs(n) === 1 ? pair[0] : pair[1]}`;
}

async function saveCatalog() {
  if (isRO()) return;
  const prices = Object.entries(state.priceEdits).map(([k, qty]) => {
    const [item, section, costKey, partItem] = k.split("|");
    return { item, section, costKey, partItem, qty };
  });
  const buyability=Object.entries(state.buyabilityEdits).map(([item,value])=>({item,...value}));
  const sellability=Object.entries(state.sellabilityEdits).map(([item,value])=>({item,...value}));
  const yields = Object.entries(state.yieldEdits).map(([k, qty]) => {
    const [item, section, costKey] = k.split("|"); return {item,section,costKey,qty};
  });
  const carry = Object.entries(state.carryEdits).map(([k, qty]) => {
    const [item, slot] = k.split("|");
    return { item, slot, qty };
  });
  const craft = Object.entries(state.craftEdits).map(([item, entries]) => ({
    item, entries: portableCraftEntries(entries).map(e => ({ ...e, parts: e.parts.filter(p => p.item) })) }));
  const effects = Object.entries(state.effectEdits).map(([k, value]) => {
    const [key, field] = k.split("|");
    return { key, field, value };
  });
  const itemEffects = Object.entries(state.itemEffectEdits).map(([item, effs]) => ({ item, effects: effs }));
  const itemTags = Object.entries(state.itemTagEdits).map(([item, tags]) => ({ item, tags }));
  const quickSelect=Object.entries(state.quickSelectEdits).map(([item,value])=>({item,slots:value.slots}));
  const descriptions=Object.entries(state.descriptionKeyEdits).map(([item,key])=>({item,key}));
  try {
    if(Object.keys(state.alcoholEdits).length){
      // Send a complete effective table reconstructed from authoritative
      // vanilla values and sparse overrides.  This also repairs a browser
      // session that booted against the old flattened-all-ones response.
      const entries={...(state.alcohol.vanilla||{}),...(state.alcohol.overrides||{}),...state.alcoholEdits};
      await api("/api/alcohol-strengths/save",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({entries})});
      state.alcohol.entries=entries;
      state.alcohol.overrides=Object.fromEntries(Object.entries(entries).filter(([key,value])=>
        state.alcohol.vanilla?.[key]!==undefined&&Math.abs(+value-+state.alcohol.vanilla[key])>1e-9));
      state.alcoholEdits={};
    }
    const localizedSaved=await saveLocalization();
    const r = await api("/api/catalog/save", { method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ prices, buyability, sellability, yields, bundles:Object.entries(state.bundleEdits).map(([key,qty])=>({key,qty})), effects, itemEffects, itemTags, quickSelect: quickSelect, descriptions, carry, craft }) });
    // fold edits into local model so UI stays consistent
    for (const e of prices) {
      const it = state.catalog.items.find(i => i.key === e.item);
      const list = e.section === "buy" ? it.buy : it.sell;
      for (const c of list) if (c.key === e.costKey)
        for (const p of c.parts) if (p.item === e.partItem) p.qty = e.qty;
    }
    for(const e of yields){const it=state.catalog.items.find(i=>i.key===e.item);const cost=it&&it[e.section].find(c=>c.key===e.costKey);if(cost)cost.yield=e.qty;}
    for(const e of buyability){const it=state.catalog.items.find(i=>i.key===e.item);if(it){const other=it.buy.filter(c=>c.costtype!=="COST_TYPE_PRICE"||!c.parts.some(p=>p.item==="CURRENCY_CASH"));it.buy=e.buyable?other.concat([{key:"COST_SHOP_DEFAULT",costtype:"COST_TYPE_PRICE",yield:1,parts:[{item:"CURRENCY_CASH",qty:e.cents??100}],unlocks:[]}]):other;}}
    for(const e of sellability){const it=state.catalog.items.find(i=>i.key===e.item);if(it)it.sell=e.sellable?[{key:"SELL_SHOP_DEFAULT",costtype:"COST_TYPE_PRICE",yield:1,parts:[{item:"CURRENCY_CASH",qty:e.cents??100}],unlocks:[]}]:[];}
    for (const e of effects) {
      const eff = state.effectByKey[e.key];
      if (eff) eff[e.field] = String(e.value);
    }
    for (const e of itemEffects) {
      const it = state.catalog.items.find(i => i.key === e.item);
      if (it) it.effects = e.effects;
    }
    for (const e of itemTags) {
      const it = state.catalog.items.find(i => i.key === e.item);
      if (it) it.tags = e.tags;
    }
    if(quickSelect.length){
      state.quickSelect=await api("/api/quick-select");
      refStore("mine").quickSelect=state.quickSelect;
    }
    for(const e of descriptions){const it=state.catalog.items.find(i=>i.key===e.item);if(it)it.descriptionKey=e.key;}
    for (const e of carry) {
      const it = state.catalog.items.find(i => i.key === e.item);
      const s = it && (it.carry || []).find(x => x.slot === e.slot);
      if (s) s.qty = e.qty;
    }
    for (const e of craft) {
      const it = state.catalog.items.find(i => i.key === e.item);
      if (it) it.buy = it.buy.filter(c => !isCraftCost(c)).concat(
        e.entries.map(en => ({ key: en.key, costtype: "COST_TYPE_CRAFT", yield: en.yield,
          parts: en.parts, unlocks: en.unlocks || [] })));
    }
    state.priceEdits = {}; state.buyabilityEdits={}; state.sellabilityEdits={}; state.yieldEdits = {}; state.bundleEdits={}; state.effectEdits = {}; state.itemEffectEdits = {}; state.itemTagEdits = {}; state.quickSelectEdits={}; state.descriptionKeyEdits={}; state.carryEdits = {}; state.craftEdits = {}; state.shopAcceptance=null;
    toast(`Saved ${r.saved} catalog + ${localizedSaved} in-game text change(s)`);
    render();
  } catch (ex) { throw showSaveFailure(ex); }
}

// ----- GameplayTweaks settings -----
// The presentation schema lives in this plugin's settings_schema.json and arrives on
// /api/settings. GameplayTweaks.ini remains the source of truth for which
// settings exist; the schema only says how they are arranged and described.
// Anything the schema does not mention still renders as its own category, so a
// newly added INI section can never be lost.
function settingsSchema(){return (state.settings&&state.settings.schema)||{};}
function schemaMap(name){const value=settingsSchema()[name];return value&&typeof value==="object"?value:{};}
function schemaSet(name){const value=settingsSchema()[name];return new Set(Array.isArray(value)?value:[]);}

function humanSettingName(name){
  return String(name).replace(/[_-]/g," ").replace(/([a-z0-9])([A-Z])/g,"$1 $2").replace(/([A-Z]+)([A-Z][a-z])/g,"$1 $2")
    .replace(/([A-Za-z])(\d)/g,"$1 $2").replace(/(\d)([A-Za-z])/g,"$1 $2").replace(/([A-Za-z])([+-]\d)/g,"$1 $2")
    .replace(/\bMs\b/g,"MS").replace(/\bXp\b/g,"XP").replace(/\bIni\b/g,"INI").replace(/\bAi\b/g,"AI");
}
function settingLabel(section,key){
  const authored=schemaMap("labels")[`${section}|${key}`];
  if(authored)return authored;
  return key==="Enabled"?humanSettingName(section):humanSettingName(key);
}
function settingIsDeveloper(section,key){return schemaSet("dev").has(`${section}|${key}`);}
function settingConstBoundary(section,key){
  const value=schemaMap("const")[`${section}|${key}`];
  return typeof value==="string"?value:"";
}
function settingChoices(section,key){
  const entry=schemaMap("choices")[`${section}|${key}`];
  return entry&&Array.isArray(entry.options)?entry.options:null;
}
function settingRange(section,key){
  const entry=schemaMap("ranges")[`${section}|${key}`];
  return entry&&typeof entry==="object"?entry:null;
}
function settingIsBoolean(section,key){
  // The boolean list is extracted from the reading code (readB / GetPrivateProfileIntA
  // ... != 0). Fall back to the old name heuristics only for keys the runtime does
  // not read yet, so a new INI key still gets a sensible control.
  if(schemaSet("booleans").has(`${section}|${key}`))return true;
  return key==="Enabled"; // every [Section] Enabled the runtime reads goes through readB().
}

// Help resolution order: the INI's own comment for that key, then the schema's
// supplemental text, then a pattern for the repeated numeric families. Section
// introductions belong on category headings; reusing one for a field can put a
// large, unrelated block behind that field's "?".
function settingPatternHelp(section,key){
  let m;
  if(key==="Enabled")return `Enable or disable ${humanSettingName(section)}. This switch does not delete its saved settings.`;
  if(section==="WalletCap"&&(m=/^Rank(\d+)Dollars$/.exec(key)))
    return `Wallet capacity in dollars at Gambler challenge rank ${m[1]}.`;
  if(section==="HonorPrices"&&(m=/^Rank([+-]\d+)Multiplier$/.exec(key)))
    return `Shop purchase-price multiplier at honor rank ${m[1]}. 1.00 is the undiscounted catalog price; above 1 is a surcharge, below 1 a discount.`;
  if(section==="Camera"&&(m=/^(.*)ShoulderOffset$/.exec(key)))
    return `Horizontal offset for the ${humanSettingName(m[1]).toLowerCase()} camera. The engine can limit visible movement even when the stored value changes.`;
  if(section==="Camera"&&(m=/^(.*)Distance$/.exec(key)))
    return `Orbit distance for the ${humanSettingName(m[1]).toLowerCase()} camera. The engine can limit the visible distance in some camera states.`;
  if(section==="Camera"&&(m=/^(.*)LowCamera$/.exec(key)))
    return `Choose LOW instead of NORMAL framing for the ${humanSettingName(m[1]).toLowerCase()} camera. This is a two-state setting, not continuous height; some camera states ignore it.`;
  if((m=/^(SpentBar|SpentCore|Live|Zero)([RGBA])$/.exec(key))){
    const channel={R:"Red",G:"Green",B:"Blue",A:"Alpha"}[m[2]];
    return `${channel} channel, 0-255, of the ${humanSettingName(m[1]).toLowerCase()} colour.`;
  }
  return "";
}
function settingHelp(section,setting){
  const compound=`${section.name}|${setting.key}`;
  const ordinary=(setting.help||"").trim()||schemaMap("help")[compound]||
    settingPatternHelp(section.name,setting.key)||
    `Edits ${setting.key} in the [${section.name}] section of this mod's INI. This installed setting has no field-specific behavior description.`;
  const boundary=settingConstBoundary(section.name,setting.key);
  const range=settingRange(section.name,setting.key);
  const facts=[];
  if(range&&range.min!==undefined&&range.max!==undefined)facts.push(`Editor range: ${range.min} to ${range.max}.`);
  const authoredUnit=schemaMap("units")[compound];
  if(typeof authoredUnit==="string"&&authoredUnit.trim())facts.push(`Unit: ${authoredUnit}.`);
  if(boundary)facts.push(`Apply requirement: ${boundary}`);
  return [ordinary,...facts].join(" ");
}

function settingUnit(section,key){
  const compound=`${section}|${key}`;
  const authored=schemaMap("units")[compound];
  if(typeof authored==="string")return authored;
  if(compound==="Campsites|Key")return "VK code";
  if(/Ms$/.test(key))return "ms";
  if(/Hours$/.test(key))return "hours";
  if(/Seconds$/.test(key))return "seconds";
  if(/MetersPerSecond$/.test(key))return "m/s";
  if(/PerSecond$/.test(key)||/Rate$/.test(key))return "points/s";
  if(/Meters$/.test(key)||/Range$/.test(key)||key==="ClearRadius")return "m";
  if(/Degrees/.test(key)||/AngleDeg$/.test(key))return "degrees";
  if(/Percent$/.test(key))return "%";
  if(/Dollars$/.test(key))return "dollars";
  if(/Cents$/.test(key))return "cents";
  if(/Multiplier$/.test(key)||/Scale$/.test(key))return "x";
  if(/Chance$/.test(key)||/(Alpha|Deadzone|Extent|ScreenRadius|Yellowness)$/.test(key))return "fraction";
  if(/Hour$/.test(key))return "clock hour";
  if(key==="MinimumSpeed")return "m/s";
  if(/Speed$/.test(key))return "/s";
  if(/(MaximumWorldCasings|MaxTags)$/.test(key))return "items";
  if(/HealthPerLayer$/.test(key))return "HP";
  if(/(Cap|Pistol|Revolver|Repeater|Rifle|Shotgun|Arrow|Varmint|Herbs|Food)$/.test(key))return "items";
  if(/(Mode|Style)$/.test(key))return "mode";
  if(/Sign$/.test(key))return "sign";

  if(key==="ZoomLevel")return "zoom units";

}
function decimalSettingValue(value){
  return String(value).trim()!==""&&/^[-+]?(?:\d+(?:\.\d*)?|\.\d+)(?:e[-+]?\d+)?$/i.test(String(value).trim());
}

function renderSettingField(section,setting){
  const compound=`${section.name}|${setting.key}`,current=state.settingEdits[compound]??setting.value;
  const label=settingLabel(section.name,setting.key),dev=settingIsDeveloper(section.name,setting.key);
  const constBoundary=settingConstBoundary(section.name,setting.key);
  const changeValue=value=>{if(value===setting.value)delete state.settingEdits[compound];else state.settingEdits[compound]=value;refreshGlobalSave();};
  const choices=settingChoices(section.name,setting.key);
  let control;
  if(settingIsBoolean(section.name,setting.key)){
    // Matches the runtime's own test: GetPrivateProfileIntA(...) != 0.
    const on=Number.parseInt(String(current).trim(),10)!==0&&String(current).trim()!=="";
    control=el("input",{type:"checkbox","aria-label":label,...(on?{checked:true}:{}),
      onchange:ev=>changeValue(ev.target.checked?"1":"0")});
  }else if(choices){
    // Never silently rewrite a value the schema does not list: an unrecognised
    // current value is offered back as its own option.
    const options=choices.some(([value])=>value===String(current))?choices:[[String(current),`${current} (current value)`],...choices];
    const select=el("select",{"aria-label":label,onchange:ev=>{changeValue(ev.target.value);ev.target.classList.toggle("edited",compound in state.settingEdits);}},
      ...options.map(([value,text])=>el("option",{value,...(value===String(current)?{selected:true}:{})},text)));
    control=el("span",{class:"setting-value"},select);
  }else{
    const numeric=decimalSettingValue(current);
    const range=settingRange(section.name,setting.key);
    const commit=ev=>{
      let value=ev.target.value;
      if(range&&decimalSettingValue(value)){
        let number=Number(value);
        if(Number.isFinite(Number(range.min)))number=Math.max(Number(range.min),number);
        if(Number.isFinite(Number(range.max)))number=Math.min(Number(range.max),number);
        value=String(number);ev.target.value=value;
      }
      changeValue(value);ev.target.classList.toggle("edited",compound in state.settingEdits);
    };
    const input=el("input",{type:numeric?"number":"text",...(numeric?{step:range?.step??"any"}:{}),
      ...(range&&range.min!==undefined?{min:range.min}:{}),...(range&&range.max!==undefined?{max:range.max}:{}),
      value:current,"aria-label":label,
      ...(compound==="Campsites|Key"?{inputmode:"text"}:{}),
      onchange:commit});
    const unit=numeric||compound==="Campsites|Key"?settingUnit(section.name,setting.key):"";
    control=el("span",{class:"setting-value"},input,...(unit?[el("span",{class:"setting-unit"},unit)]:[]));
  }
  const help=settingHelp(section,setting);
  return el("div",{class:["settings-field",dev?"dev":"",constBoundary?"const":""].filter(Boolean).join(" ")},
    el("div",{class:"settings-field-label"},
      el("span",{class:"settings-field-name"},label,
        dev?el("span",{class:"setting-dev-chip",title:"Developer setting: the runtime gates it behind developer mode, or the INI documents it as a probe/trace."},"DEV"):"",
        constBoundary?el("span",{class:"setting-const-chip",title:`Constant setting. ${constBoundary}`},"CONST"):"",
        help?fieldHelp(help):""),
      el("span",{class:"setting-source"},`${section.name} / ${setting.key}`)),
    el("div",{class:"settings-field-control"},control));
}

function arrangeSettingsCategories(layout,categories){

    if(columnCount===renderedColumnCount)return;
