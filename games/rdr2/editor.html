<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Lexeditor - RDR2</title>
<script>(()=>{const p=new URLSearchParams(location.search),k=p.get("lexTransition");if(!["load","resume"].includes(k))return;const r=document.documentElement;r.classList.add("lex-transition-entry");if(k==="load"){r.dataset.lexQuote=p.get("lexQuote")||"Loading editor…";r.classList.add("lex-transition-loading")}})()</script>
<link rel="stylesheet" href="/shared/framework.css">
<link rel="stylesheet" href="editor.css">
</head>
<body>
<div id="lexeditor-shell"></div>
<div class="lex-toolbar" id="toolbar"></div>
<main id="main"><div class="loading">Loading catalog (16&nbsp;MB of cowboy data)…</div></main>
<div id="toast"></div>

<datalist id="dl-tables"></datalist>
<datalist id="dl-items"></datalist>

<script src="/shared/framework.js"></script>
<script src="core.js"></script>
  <script src="items.js"></script>
  <script src="shops.js"></script>
  <script src="crafting.js"></script>
  <script src="tweaks.js"></script>
  <script src="effects.js"></script>
  <script src="loot.js"></script>
  <script src="challenges.js"></script>
  <script src="weapons.js"></script>
  <script src="ai.js"></script>
  <script src="mobs.js"></script>
  <script src="datamap.js"></script>
  <script src="crime.js"></script>
  <script src="boot.js"></script>
</body>
</html>
