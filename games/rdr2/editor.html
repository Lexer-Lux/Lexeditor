// Resolve the schema against the INI that actually loaded. Sections and keys the
// schema names but the INI does not have are skipped silently; keys the INI has
// but the schema does not name fall through to their own category.
function buildSettingsCategories(){
  const schema=settingsSchema(),hidden=schemaMap("hidden"),used=new Set(Object.keys(hidden));
  const byName=new Map(state.settings.sections.map(section=>[section.name.toLowerCase(),section]));
  const take=(sectionName,key)=>{
    const section=byName.get(String(sectionName).toLowerCase());
    if(!section)return [];
    const wanted=key==="*"
      ?section.settings.filter(setting=>!used.has(`${section.name}|${setting.key}`))
      :section.settings.filter(setting=>setting.key.toLowerCase()===String(key).toLowerCase()&&!used.has(`${section.name}|${setting.key}`));
    for(const setting of wanted)used.add(`${section.name}|${setting.key}`);
    return wanted.map(setting=>({section,setting}));
  };
  const categories=[];
  for(const category of (Array.isArray(schema.categories)?schema.categories:[])){
    const subs=[];
    for(const sub of (category.subs||[])){
      const entries=[];
      for(const [sectionName,key] of (sub.entries||[]))entries.push(...take(sectionName,key));
      if(entries.length)subs.push({title:sub.title||"",help:sub.help||"",entries});
    }
    if(subs.length)categories.push({title:category.title,help:category.help||"",subs});
  }
  // Everything the schema did not claim keeps its own INI section, in INI order.
  for(const section of state.settings.sections){
    const entries=section.settings.filter(setting=>!used.has(`${section.name}|${setting.key}`))
      .map(setting=>({section,setting}));
    if(!entries.length)continue;
    for(const setting of entries)used.add(`${section.name}|${setting.key}`);
    categories.push({title:humanSettingName(section.name),help:section.help||"",
      subs:[{title:"",help:"",entries}]});
  }
  return categories.sort((a,b)=>a.title.localeCompare(b.title,undefined,{sensitivity:"base"}));
}

async function saveSettings(){
  const edits=Object.entries(state.settingEdits).map(([compound,value])=>{const cut=compound.indexOf("|");return {section:compound.slice(0,cut),key:compound.slice(cut+1),value};});
  if(!edits.length)return;
  const result=await api("/api/settings/save",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({edits})});
  for(const edit of edits){const section=state.settings.sections.find(s=>s.name===edit.section),setting=section?.settings.find(s=>s.key===edit.key);if(setting)setting.value=edit.value;}
  state.settingEdits={};toast(`Saved ${result.saved} GameplayTweaks setting${result.saved===1?"":"s"}`);renderSettings();
}

async function renderSettings(){
  const tb=$("#toolbar");tb.innerHTML="";

function lootConditions(){const values=new Set();for(const file of Object.values(state.loot))for(const t of file.tables)for(const e of t.entries)if(e.rewardcondition)values.add(e.rewardcondition);return [...values].sort();}
// Only "Table" entries name another loot table; every other type names a catalog item.
// Treating Collectible/Money/Ammo as table references made save validation reject them.
function validLootNames(type){if(type!=="Table")return state.catalog.items.map(x=>x.key).sort();const out=[];for(const file of Object.values(state.loot))for(const t of file.tables)out.push(t.key);return [...new Set(out)].sort();}
// ----- Loot table usage ("where is this actually used?") -----
// Two independent answers, because loot tables are reached two different ways:
//   * data  - another loot table names this one; resolved live from the loaded files.
//   * script- the engine/script invokes it by name; baked by tools/build_loot_usage.py
//             because it requires scanning ~2,200 decompiled scripts.
function lootUsageOf(key){return state.lootUsage?.tables?.[key]||null;}

function lootDataRefs(key){
  const out=[];
  for(const [file,data] of Object.entries(state.loot||{})){
    if(!data?.tables)continue;
    for(const t of data.tables)
      if(t.entries.some(e=>e.type==="Table"&&e.name===key))out.push({file,key:t.key});
  }
  return out;
}

// Ordered most-specific first: a concrete world pickup beats a script name beats a guess.
function lootSourceCell(t){
  const cell=el("div",{class:"sources"});
  const u=lootUsageOf(t.key), refs=lootDataRefs(t.key);
  const chip=(cls,text,title)=>el("span",{class:`srcchip ${cls}`,title:title||""},text);
  if(u?.pickups?.length)
    cell.append(chip("src-pickup","looted from "+u.pickups.join(", "),
      "The world prop you interact with. Script maps this model straight to this table."));
  if(u?.scripts?.length){
    const list=u.scripts;
    cell.append(chip("src-script",list.slice(0,3).join(", ")+(list.length>3?` +${list.length-3} more`:""),
      "Story-mode scripts that invoke this table by name:\n"+list.join("\n")));
  }
  if(u?.mpScripts?.length&&!u?.scripts?.length&&!u?.pickups?.length)
    cell.append(chip("src-mp","multiplayer only","Only referenced by online scripts; inert in story mode."));
  for(const r of refs.slice(0,4))
    cell.append(el("span",{class:"srcchip src-data",title:`Entry in ${r.file}`,
      onclick:ev=>{ev.stopPropagation();state.lootFile=r.file;state.filters.lootQ=r.key;renderLoot();}},"◂ "+r.key));
  if(refs.length>4)cell.append(chip("src-data",`+${refs.length-4} more tables`));
  if(!cell.childNodes.length)
    cell.append(chip("src-engine","engine-bound",
      "No loot table names it and no script invokes it by name. The engine selects it from the ped model, container archetype or plant it is attached to."));
  return cell;
}

function lootTabButtons(){const files=[...dsInfo().lootFiles].sort((a,b)=>(LOOT_TAB_LABELS[a]||a).localeCompare(LOOT_TAB_LABELS[b]||b));return el("div",{class:"subtabs"},
  el("button",{class:state.lootFile==="__all"?"active":"",onclick:async()=>{state.lootFile="__all";state.filters.lootQ="";state.filters.lootPage=0;await ensureAllLoot();renderLoot();}},"All tables"),
  ...files.map(file=>el("button",{class:file===state.lootFile?"active":"",onclick:async()=>{state.lootFile=file;state.filters.lootQ="";state.filters.lootPage=0;await loadLoot(file);renderLoot();}},LOOT_TAB_LABELS[file]||file)),

    el("b", {}, "ContinuousLinearDrop"), " lays the rates end to end on a number line and rolls once, so the entries are mutually exclusive: rates summing to 1.0 always yield exactly one entry, and summing to less leaves the remainder as \"nothing\". ",

    el("div", { style: "margin-top:6px" }, el("b", {}, "Not this tab: "),

  let rows = [];

    table:x=>x.t.key, name:x=>lootTableName(x.t), file:x=>x.file,

  // The shared paged list-detail preset keeps Loot Tables in the same fitted,

    search:{key:"rdr2-loot-tables",value:f.lootQ,placeholder:"Search tables… (e.g. VALENTINE, GANG)",change:value=>{f.lootQ=value;f.lootPage=0;renderLoot();}},filters:lootFilters,

          el("div",{class:"li-key",title:`${t.key}${lootTableName(t)?" — "+lootTableName(t):""}\n${LOOT_TAB_LABELS[file]||file}`},
            el("span",{class:"k"},t.key),
            lootTableName(t)&&lootTableName(t)!==t.key?el("span",{class:"li-name"},lootTableName(t)):"")},

        {key:"type",label:"Drop type",sortable:true,render:({t})=>(t.type||"").replace("Drop","")}]
    }),
    detail:row=>lootDetail(row.t,row.file),
    emptyDetail:()=>el("div",{class:"loot-detail-pane lex-detail"},el("div",{class:"loading"},"No tables match that search.")),
    sync:next=>{f.lootPage=next.page;f.lootPageSize=next.pageSize;f.lootSel=next.selected||"";},
    change:next=>{f.lootPage=next.page;f.lootPageSize=next.pageSize;f.lootSel=next.selected||"";renderLoot();}
  });
  m.append(view);
}

function markLootDirty(tableKey, file = state.lootFile) {
  (state.lootDirty[file] = state.lootDirty[file] || new Set()).add(tableKey);
  renderToolbarOnly();
}

// Which .meta a table key lives in, so nested edits mark the right file dirty.
function lootFileOf(key){
  for (const [file,data] of Object.entries(state.loot||{}))
    if (data?.tables?.some(t=>t.key===key)) return file;
  return state.lootFile;
}

function lootDetail(t, file) {
  const pane = el("div",{class:"loot-detail-pane lex-detail"});
  const u = lootUsageOf(t.key);
  const typeSel = el("select",{class:"droptype",title:
      "AggregateDrop: every entry rolled independently, several can hit at once.\n"+
      "ContinuousLinearDrop: one roll across the combined rates, entries are mutually exclusive.",
    onchange:ev=>{t.type=ev.target.value;markLootDirty(t.key,file);renderLoot();}},
    ...["AggregateDrop","ContinuousLinearDrop"].map(v=>{const o=el("option",{value:v},v);if(t.type===v)o.selected=true;return o;}));
  const deleteBtn=!isRO()?el("button",{class:"icon-link",style:"color:#d77b70;width:auto;padding:0 8px",
    title:"Delete this table from the loot file. Refused if any other table still references it as a Table entry.",
    onclick:()=>deleteLootTableDialog(t,file)},"Delete"):el("span");
  pane.append(el("div",{class:"detail-head"},
    el("div",{},el("span",{class:"k big"},t.key),
      lootTableName(t)?el("span",{class:"n"},lootTableName(t)):""),
    el("div",{class:"detail-meta"},typeSel,
      refStack([["V","vtag",state.store.vanilla?.loot?.[file]?.tables.find(x=>x.key===t.key)?.type??null],
                ["K","ktag",state.store.kiddos?.loot?.[file]?.tables.find(x=>x.key===t.key)?.type??null]],
        t.type,v=>{t.type=v;markLootDirty(t.key,file);renderLoot();}),
      lootRollSummary(t),deleteBtn)));
  pane.append(el("div",{class:"detail-sources"},el("span",{class:"cat"},"Sources"),lootSourceCell(t)));
  pane.append(lootEntryGrid(t, file, 0, new Set([t.key])));
  return pane;
}

async function createLootTableDialog(){
  if(isRO()||!state.lootFile||state.lootFile==="__all"||state.lootFile==="__matrix")return;
  const file=state.lootFile;
  const isGroups=file==="loot_table_itemgroups.meta";
  const raw=prompt(isGroups
    ?"New item-group key (e.g. LEX_MY_TONICS). Letters, numbers, underscores."
    :"New loot table key (e.g. LEX_CUSTOM_DROP). Letters, numbers, underscores.",
    isGroups?"LEX_":"LEX_");
  if(raw===null)return;
  const key=raw.trim().toUpperCase().replace(/[^A-Z0-9_]+/g,"_").replace(/_+/g,"_").replace(/^_|_$/g,"");
  if(!key){toast("Key is empty",true);return;}
  const dropType=confirm("OK = AggregateDrop (each entry rolls independently).\nCancel = ContinuousLinearDrop (mutually exclusive rates).")
    ?"AggregateDrop":"ContinuousLinearDrop";
  try{
    const r=await api(`/api/loot/${file}/create`,{method:"POST",headers:{"Content-Type":"application/json"},
      body:JSON.stringify({key,type:dropType,name:key.replace(/_/g," ")})});
    if(!state.loot[file])state.loot[file]={tables:[]};
    state.loot[file].tables.push({...r.table,open:false});
    // Bust server cache is automatic on mtime; refresh local list order
    state.loot[file].tables.sort((a,b)=>a.key.localeCompare(b.key));
    state.filters.lootSel=r.table.key;
    state.filters.lootQ="";
    toast(`Created ${r.table.key}`);
    renderLoot();
  }catch(ex){toast("Create failed: "+ex.message,true);}
}

async function deleteLootTableDialog(t,file){
  if(isRO()||!t||!file)return;
  if(!confirm(`Delete loot table ${t.key} from ${file}?\n\nThis is permanent on Save... actually it writes immediately. Refused if other tables still reference it.`))
    return;
  try{
    // Flush pending entry edits for this table first so we don't re-save a deleted key.
    if(state.lootDirty[file])state.lootDirty[file].delete(t.key);
    await api(`/api/loot/${file}/delete`,{method:"POST",headers:{"Content-Type":"application/json"},
      body:JSON.stringify({key:t.key})});
    state.loot[file].tables=state.loot[file].tables.filter(x=>x.key!==t.key);
    if(state.filters.lootSel===t.key)state.filters.lootSel="";
    toast(`Deleted ${t.key}`);
    renderLoot();
  }catch(ex){toast("Delete failed: "+ex.message,true);}
}

// Plain-language read of what one roll of this table yields, derived from the
// drop type and the rate total. Cheap to compute and it is the number that
// actually matters when you retune rates.
function lootRollSummary(t){
  const rates=t.entries.map(e=>parseFloat(e.rate)).filter(n=>!isNaN(n));
  if(!rates.length) return el("span",{class:"rollsum"},"");
  const sum=+rates.reduce((a,b)=>a+b,0).toFixed(3);
  if(t.type==="ContinuousLinearDrop"){
    if(sum<=1.001) return el("span",{class:"rollsum ok"},
      `one entry at most · ${Math.round(sum*100)}% something, ${Math.round((1-sum)*100)}% nothing`);
    return el("span",{class:"rollsum warn"},`rates total ${sum} — beyond 1.0 this yields multiple picks`);
  }
  const n=t.entries.length;
  return el("span",{class:"rollsum"},
    `${n} independent roll${n===1?"":"s"} · ${sum} item${sum===1?"":"s"} expected per open`);
}

// One editable grid of entries. Nested Table entries expand in place at depth+1 and
// edit the real child table, marking that child's own file dirty.
function lootEntryGrid(t, file, depth, seen) {
  const grid = el("div",{class:"entrygrid",style:depth?`margin-left:${depth*18}px`:""});
  if(!depth) grid.append(el("div",{class:"entry headrow"},
    el("span",{}),el("span",{},"Name"),el("span",{},"Rate"),
    el("span",{},"Min"),el("span",{},"Max"),el("span",{},"Condition"),el("span",{})));
  // Match the reference entry by name, falling back to position. The fallback is what
  // makes a reference on the NAME field possible at all: when the name is the thing that
  // changed, a name-keyed lookup can never find its own counterpart.
  const refEntry=(entryName,i,ds)=>{
    const rt=state.store[ds]?.loot?.[file]?.tables.find(x=>x.key===t.key);
    if(!rt)return null;
    return rt.entries.find(x=>x.name===entryName) || rt.entries[i] || null;
  };
  const lootRefValue=(field,entryName,i,ds)=>{
    const en=refEntry(entryName,i,ds);
    return en?(en[field]??null):null;
  };
  const refPairs=(field,entryName,i)=>[["V","vtag",lootRefValue(field,entryName,i,"vanilla")],
    ["K","ktag",lootRefValue(field,entryName,i,"kiddos")],
    ...(hasScope("prices1899","loot",file)?[["1899","p1899tag",lootRefValue(field,entryName,i,"prices1899")]]:[])];
  t.entries.forEach((e,i)=>{
    const inp=(field,attrs={})=>el("input",{value:e[field]??"",...attrs,
      onchange:ev=>{e[field]=ev.target.value;ev.target.classList.add("edited");markLootDirty(t.key,file);
        if(field==="rate")renderLoot();}});
    const target=e.type==="Table"?findLootTable(e.name):null;
    const cyclic=target&&seen.has(target.table.key);
    // Nested tables are open by default; the toggle collapses them. Depth is capped so a
    // deep chain cannot render the whole file at once.
    const openKey=`${t.key}|${i}`;
    const isOpen=!state.lootCollapsed.has(openKey)&&depth<3;
    const expander=target&&!cyclic
      ? el("span",{class:"expander",title:isOpen?"Collapse this table":"Expand this table",
          onclick:()=>{isOpen?state.lootCollapsed.add(openKey):state.lootCollapsed.delete(openKey);renderLoot();}},isOpen?"▾":"▸")
      : el("span",{});
    // Name and type are one decision, not two: picking a loot table makes the entry a
    // Table, picking a catalog item makes it an item kind. The type rides inside the name
    // control as a label so it cannot be set to something the name contradicts. The label
    // is still clickable, because Item/Collectible/Money/Ammo all name catalog items and
    // nothing in the name distinguishes them.
    const isTable=e.type==="Table";
    const setKind=kind=>{
      pickIdentifier(kind==="Table"?"Loot table":"Catalog item",validLootNames(kind),e.name,v=>{
        e.name=v;
        if(kind==="Table")e.type="Table";
        else if(e.type==="Table")e.type="Item";   // leaving Table: default to plain Item
        markLootDirty(t.key,file);renderLoot();});
    };
    const typeTag=el("span",{class:"typetag",title:isTable
        ? "This entry rolls another loot table. Click the name to point it somewhere else."
        : `Item kind: ${e.type}. Click to change between Item / Collectible / Money / Ammo / Weapon / Horse — these all name a catalog item, so the name alone cannot tell them apart.`,
      onclick:ev=>{ev.stopPropagation();
        if(isTable)return;
        pickIdentifier("Entry type",LOOT_ENTRY_TYPES.filter(x=>x!=="Table"),e.type,
          v=>{e.type=v;markLootDirty(t.key,file);renderLoot();});}},e.type||"?");
    const nameBtn=el("button",{class:"icon-link",title:isTable?"Choose a different loot table":"Choose a different catalog item",
      onclick:()=>setKind(isTable?"Table":"Item")},"✎");
    const mention=isTable
      ? target?lootTableLink(target.file,target.table.key,el("span",{class:"nametext"},e.name)):el("span",{class:"badref",title:"No loot table with this name"},e.name||"!")
      : catalogItem(e.name)?itemLink(e.name,true,el("span",{class:"nametext"},e.name)):
        el("span",{class:"badref",title:"No catalog item with this name"},e.name||"(choose…)");
    const conditions=lootConditions();
    const conditionSel=el("select",{title:"Optional engine-defined reward condition",
      onchange:ev=>{e.rewardcondition=ev.target.value;markLootDirty(t.key,file);}},
      el("option",{value:""},"Always / no condition"),
      ...conditions.map(v=>{const o=el("option",{value:v},v);if(e.rewardcondition===v)o.selected=true;return o;}));
    grid.append(el("div",{class:"entry"},
      expander,
      // The name deserves a reference more than anything else here: it is what tells you
      // this entry used to drop something different.
      el("div",{class:"namecell"},mention,typeTag,nameBtn,
        refStack(refPairs("name",e.name,i),e.name,v=>{e.name=v;markLootDirty(t.key,file);renderLoot();})),
      el("div",{class:"ratecell"},inp("rate",{type:"number",step:"0.05",min:"0"}),
        refStack(refPairs("rate",e.name,i),e.rate,(v,ev)=>applyToInput(ev,v))),
      el("div",{class:"rangecell"},inp("min",{type:"number",step:"1",placeholder:"default",title:"Blank = do not override quantity."}),
        refStack(refPairs("min",e.name,i),e.min,(v,ev)=>applyToInput(ev,v))),
      el("div",{class:"rangecell"},inp("max",{type:"number",step:"1",placeholder:"default",title:"Blank = do not override quantity."}),
        refStack(refPairs("max",e.name,i),e.max,(v,ev)=>applyToInput(ev,v))),
      el("div",{class:"rangecell"},conditionSel,
        refStack(refPairs("rewardcondition",e.name,i),e.rewardcondition,(v,ev)=>{e.rewardcondition=v;markLootDirty(t.key,file);renderLoot();})),
      el("span",{class:"del",title:"remove entry",onclick:()=>{t.entries.splice(i,1);markLootDirty(t.key,file);renderLoot();}},"×")));
    if(cyclic) grid.append(el("div",{class:"entryref cyc"},`↻ ${e.name} already appears higher in this chain`));
    if(target&&isOpen){
      const childFile=lootFileOf(target.table.key);
      grid.append(el("div",{class:"nested"},
        el("div",{class:"nested-head"},
          el("span",{class:"k"},target.table.key),
          el("span",{class:"nested-meta"},`${target.table.type} · ${LOOT_TAB_LABELS[childFile]||childFile}`)),
        lootEntryGrid(target.table, childFile, depth+1, new Set([...seen,target.table.key]))));
    }
  });
  // ContinuousLinearDrop is one roll across the combined rates, so whatever the rates do
  // not cover is a real outcome: nothing. Show it as a row rather than hiding the number
  // in a corner readout.
  if(t.type==="ContinuousLinearDrop"){
    const sum=+t.entries.map(e=>parseFloat(e.rate)||0).reduce((a,b)=>a+b,0).toFixed(3);
    const left=+(1-sum).toFixed(3);
    grid.append(el("div",{class:"entry nothing-row"},
      el("span",{}),
      el("div",{class:"namecell"},
        el("button",{class:"namebtn",disabled:"",tabindex:"-1"},"(nothing)"),
        fieldHelp(left>=0
          ? "Not a real entry. This table rolls once across the combined rates, so the "+
            (left>0?"portion they leave uncovered":"remainder")+" is the chance you get no item at all. "+
            "It moves automatically as you edit the rates above; make them sum to 1.0 to always get exactly one entry."
          : "Not a real entry. The rates above already sum past 1.0, so there is no leftover "+
            "\"nothing\" chance — and beyond 1.0 this table is expected to yield more than one entry per roll.")),
      el("div",{class:"ratecell"},el("input",{value:left>=0?left.toFixed(2):"0.00",disabled:"",
        title:"Automatic: 1.0 minus the rates above"})),
      el("span",{}),el("span",{}),el("span",{}),el("span",{})));
  }
  grid.append(el("div",{class:"addrow"},
    newButton({title:"Add a catalog item directly to this table",
      onclick:()=>pickIdentifier("Catalog item",validLootNames("Item"),"",name=>{t.entries.push({name,rate:"1.0",type:"Item"});markLootDirty(t.key,file);renderLoot();})}),
    newButton({title:"Add a reference that rolls another loot table or reusable Item Group",
      onclick:()=>pickIdentifier("Loot table",validLootNames("Table").filter(name=>name!==t.key),"",name=>{t.entries.push({name,rate:"1.0",type:"Table"});markLootDirty(t.key,file);renderLoot();})})));
  return grid;
}

// Saves every dirty loot file. Expanding a nested table edits whatever file that child
// lives in, so one session can dirty several files at once and state.lootFile is now a
// view selector ("__all") rather than the edit target.
async function saveLoot() {
  if (isRO()) return;
  const conditions = new Set(lootConditions());
  const pending = Object.entries(state.lootDirty).filter(([, d]) => d && d.size);
  if (!pending.length) return;
  const batches = [];
  for (const [file, dirty] of pending) {
    const edits = [...dirty].map(key => {
      const t = state.loot[file].tables.find(x => x.key === key);
      return { tableKey: key, entries: t.entries.filter(e => e.name) };
    });
    for (const edit of edits) for (const e of edit.entries) {
      if (!validLootNames(e.type).includes(e.name)) {
        throw showSaveFailure(new Error(`${e.name || "Blank name"} is not an existing ${e.type}.`)); }
      if (e.rewardcondition && !conditions.has(e.rewardcondition)) {
        throw showSaveFailure(new Error(`Unknown condition ${e.rewardcondition}.`)); }
    }
    batches.push({ file, edits });
  }
  try {
    let saved = 0;
    for (const { file, edits } of batches) {
      const r = await api(`/api/loot/${file}/save`, { method: "POST",
        headers: { "Content-Type": "application/json" }, body: JSON.stringify({ edits }) });
      state.lootDirty[file] = new Set();
      saved += r.saved;
    }
    toast(`Saved ${saved} table(s) across ${batches.length} file(s)`);
    renderLoot();
  } catch (ex) { throw showSaveFailure(ex); }
}

function weaponFieldHelp(field){
  const path=String(field||"");
  // Linked ammo rows read "WEAPON_BOW / Performance / Damage", so trim.
  const leaf=path.split("/").pop().trim();
  if(WEAPON_FIELD_HELP[leaf])return WEAPON_FIELD_HELP[leaf];
  if(/\/Explosion\//.test(path)){
    const target={Default:"the normal impact",HitCar:"cars",HitTruck:"trucks",HitBike:"bikes",HitBoat:"boats",HitPlane:"aircraft"}[leaf];
    if(target)return `Explosion-effect tag used when this damage mode hits ${target}. It selects the reaction/effect class, not blast damage.`;
  }
  if(/\/Components\//.test(path)&&leaf==="Name")return "Component identifier fitted at this attachment point.";
  if(/\/Components\//.test(path)&&leaf==="Default")return "Whether this component is fitted to the base weapon by default.";
  if(/DamageModes\//.test(path)&&leaf==="Name")return "Damage-mode identifier. Each mode joins the weapon to one ammunition type and its damage settings.";
  if(/^Vfx.*HashName$/.test(leaf))return "Visual-effect preset used for this specific muzzle, tracer, smoke, blood or impact effect. It changes presentation, not damage.";
  if(/^WindDisturbance.*HashName$/.test(leaf))return "Wind-disturbance effect preset produced by the muzzle blast or passing projectile.";
  // Opaque UNK_MEMBER fields and bare unnamed list items get no help icon.
  return "";
}

function weaponFieldDomain(data,section,row,current){
  const path=row.path.join(".");
  const values=[];
  for(const source of [data,state.weaponData.vanilla])for(const record of source?.[section]||[]){
    const match=record.fields.find(field=>field.path.join(".")===path&&
      (field.targetType||"")===(row.targetType||"")&&(field.targetName||"")===(row.targetName||""));
    if(match?.value!==undefined&&!values.includes(String(match.value)))values.push(String(match.value));
  }
  if(!values.includes(String(current)))values.push(String(current));
  return values.sort((a,b)=>a.localeCompare(b,undefined,{numeric:true}));
}

function weaponValueControl(data,section,row,current,edited,onChange){
  const values=weaponFieldDomain(data,section,row,current);
  const numeric=values.every(value=>/^-?(?:\d+\.?\d*|\.\d+)(?:e[+-]?\d+)?$/i.test(value));
  // No title on any of these: a hover that only restates the widget you are
  // already looking at is noise. Field meaning lives on the "?" instead.
  const attrs={class:`weapon-value${edited?" edited":""}`};
  if(numeric){
    Object.assign(attrs,{type:"number",step:"any",value:current,onchange:ev=>onChange(ev.target.value)});
    if(isRO())attrs.readonly="readonly";
    return el("input",attrs);
  }
  if(values.length<=100){
    attrs.onchange=ev=>onChange(ev.target.value);
    if(isRO())attrs.disabled="disabled";
    return el("select",attrs,...values.map(value=>{const option=el("option",{value},value);if(value===String(current))option.selected=true;return option;}));
  }
  Object.assign(attrs,{type:"text",value:current,onchange:ev=>onChange(ev.target.value)});
  if(isRO())attrs.readonly="readonly";
  return el("input",attrs);
}

// The six stats the game shows in-game. Only Damage and Fire Rate exist as
// clean single numbers; the rest are curves, sub-records, or in another file,
// so they are shown honestly (a value where there is one, a note where there
// is not) rather than faked. Clicking a tile filters the field list to it.
function weaponBig6(record, fv){
  const strip=el("div",{class:"weapon-big6"});
  const num=v=>{const n=+v;return Number.isFinite(n)?(n%1?n.toFixed(2).replace(/0+$/,"").replace(/\.$/,""):String(n)):null;};
  const tile=(label,value,note,filterField)=>{
    const t=el("div",{class:"big6-tile"+(value==null?" big6-missing":""),
      title:note||"",onclick:filterField?()=>{state.filters.weaponFieldQ=filterField;renderWeapons();}:null});
    t.append(el("div",{class:"big6-label"},label),el("div",{class:"big6-value"},value==null?"—":value));
    if(note)t.append(el("div",{class:"big6-note"},note));
    return t;
  };
  // Damage modes are named per ammo type (DM_ARROW, DM_AMMO_EXPRESS, ...), so
  // the strip shows the FIRST one — Rockstar's default load for that weapon.
  const firstMode=suffix=>{const hit=Object.keys(fv).find(k=>k.startsWith("DamageModes/")&&k.endsWith("/"+suffix));return hit?fv[hit]:undefined;};
  const damage=num(firstMode("Damage"));
  const fireRate=num(fv["WeaponTimeBetweenShots/TimeBetweenShotsMin"]);
  const reload=num(fv["WeaponReload/AnimReloadRate"]);
  const falloff=fv["DamageFallOffInfo"]||firstMode("DamageFallOffInfo");
  strip.append(
    tile("Damage",damage,"Damage of this weapon's FIRST damage mode (its default ammo). Each ammo type has its own mode — click to see them all.","Damage"),
    tile("Fire rate",fireRate,"Seconds between shots (lower = faster). WeaponTimeBetweenShots/TimeBetweenShotsMin","TimeBetweenShots"),
    tile("Reload",reload,"Reload anim rate multiplier (higher = faster). WeaponReload/AnimReloadRate","Reload"),
    tile("Range",falloff?String(falloff).replace(/^DAMAGE_FALLOFF_/,""):null,"Range is a named falloff CURVE, not a number — edit the referenced CWeaponDamageFallOffInfo record's distances.","Falloff"),
    tile("Accuracy",null,"Driven by CWeaponAccuracyInfo (a sub-record) + spread — no single displayed number is stored.","Accuracy"),
    tile("Mag size",null,"Magazine capacity is defined in weaponcomponents.meta (the clip/cylinder component), not in weapons.ymt.",null));
  return strip;
}

function weaponFieldCategory(row){
  const parts=String(row.field||"").split("/").map(part=>part.trim());
  const marker=parts.findIndex(part=>part==="Performance"||part==="Range curve"||part==="Accuracy curve");
  let path=parts.join("/");
  if(marker>=0){
    const prefix=parts[marker]==="Range curve"?"DamageFallOffInfo":parts[marker]==="Accuracy curve"?"AccuracyInfo":"DamageModes";
    path=[prefix,...parts.slice(marker+1)].join("/");
  }
  const leaf=parts[parts.length-1]||"";
  if(/^UNK_MEMBER_/i.test(leaf)||/^Item \d+$/i.test(leaf))
    return {key:"unidentified",label:"Unidentified fields",description:"The extracted schema has no reliable name for these values. They remain editable, but Lexeditor does not guess what they do."};
  return WEAPON_FIELD_CATEGORIES.find(group=>group.match(path))||
    {key:"identity",label:"Identity, inventory & flags",description:"Record identity, inventory placement, unlock links, stats, weapon class and behavior flags."};
}

async function ensureCrime(ds) {

  if (!st.crime && state.config.datasets[ds].crime) {
    try { st.crime = await api("/api/crime", undefined, ds); } catch (e) { st.crime = { crimes: [] }; }

  ParoleDuration: "Rockstar's dispatch field for the short parole phase after the active incident ends. This is the candidate for the dark-red-lawman reacquisition window. The shipped value is 9000 raw engine units; the schema does not declare the unit, so calibrate it in game before making a very large change.",
  TimeEvadingForEscape: "CBountyIncident.Evasion.TimeEvadingForEscape in tune/incidentstuning.meta. This is the real Story Mode pursuit/search escape timer; Rockstar ships 75 seconds. dispatch.meta's HiddenEvasionTimes rows are all zero and are not substituted for this control.",
};

function dispatchLabel(g) {
  if (DISPATCH_LABELS[g] !== undefined) return DISPATCH_LABELS[g];
  const m = /^(\w+)\/\w+\[([^\]]+)\]$/.exec(g);
  if (m) return (m[1] === "RegionInfo" ? "Region: " : "Mayhem cooldown: ")
              + m[2].replace(/^LAW_REGION_|^MAYHEM_MODIFIER_/, "").replace(/_/g, " ");
  return g;
}

function dispatchSection() {
  const st = refStore(state.ds);
  if (!st.dispatch || !st.dispatch.rows.length) return el("div");
  const vd = state.store.vanilla?.dispatch;
  const wrap = el("div");
  if(state.helpOpen.crime)wrap.append(el("div", { class: "hint", style: "margin-top:18px" },
    el("b", {}, "Dispatch / wanted response (dispatch.meta): "),
    "thresholds are the bounty $ that trigger each wanted level; radius/evasion/lawmen ",
    "are per level. CAUTION: the Crime Tweaks author deliberately shipped vanilla ",
    "dispatch.meta citing a camp-respawn-after-escape bug with modified ones — ours is ",
    "vanilla-identical until you edit, and we should test carefully after changes."));
  const table = el("table", {}, el("thead", {}, el("tr", {},
    sortHead("dispatch","setting","Setting",renderCrime),sortHead("dispatch","field","Field",renderCrime),sortHead("dispatch","value","Value",renderCrime))));
  const tbody = el("tbody");
  const dispatchRows=sortedRows("dispatch",st.dispatch.rows,{setting:r=>dispatchLabel(r.group),field:r=>r.field,value:r=>+r.value});
  for (const r of dispatchRows) {
    const ek = r.group + "|" + r.field;
    const cur = isRO() ? r.value : (state.dispatchEdits[ek] ?? r.value);
    const vRow = vd && vd.rows.find(x => x.group === r.group && x.field === r.field);
    const inp = el("input", { type: "number", step: "any", value: cur, style: "width:100px",
      class: ek in state.dispatchEdits ? "edited" : "",
      onchange: ev => {
        const v = ev.target.value;
        if (v === r.value) delete state.dispatchEdits[ek];
        else state.dispatchEdits[ek] = v;
        ev.target.classList.toggle("edited", ek in state.dispatchEdits);
        renderToolbarOnly();
      } });
    tbody.append(el("tr", {},
      el("td", { class: "cat" }, dispatchLabel(r.group)),
      el("td", { class: "key" }, DISPATCH_FIELD_LABELS[r.field] || r.field.replace("WantedLevel", "WL "),
        DISPATCH_FIELD_HELP[r.field] ? fieldHelp(DISPATCH_FIELD_HELP[r.field]) : ""),
      el("td", {}, refField(inp, vRow?[["V","vtag",vRow.value]]:null, cur, (v,ev)=>applyToInput(ev,v), String))));
  }
  table.append(tbody);
  wrap.append(table);
  return wrap;
}

async function switchCrimeSection(value) {
  state.filters.crimeSection=value;
  await renderCrime();
  await new Promise(done=>requestAnimationFrame(()=>requestAnimationFrame(done)));
  if(document.scrollingElement)document.scrollingElement.scrollTop=0;
  window.scrollTo(0,0);
}

async function renderCrime() {
  const f = state.filters;
  if(!f.crimeSection)f.crimeSection="crimes";
  if (!state.config.datasets[state.ds].crime)
    return noData(`This dataset has no crimeinformation.meta (${dsInfo().dir}).`);
  const data = await ensureCrime(state.ds);
  if (state.ds === "mine") { await ensureCrime("vanilla"); await ensureCrime("crimeTweaks"); }
  const tb = $("#toolbar"); tb.innerHTML = "";
  const sectionTabs=el("div",{class:"subtabs"},
    ...[["bounty","Bounty hunters"],["crimes","Crime rules"],["dispatch","Dispatch & wanted"],["honor","Honor actions"]].map(([value,label])=>el("button",{class:f.crimeSection===value?"active":"",onclick:()=>switchCrimeSection(value)},label)));
  tb.append(sectionTabs);
  if(f.crimeSection==="dispatch"){
    tb.append(el("span",{class:"count"},`${refStore(state.ds).dispatch?.rows.length||0} settings`),savebar(saveCrime));
    const m=$("#main");m.innerHTML="";m.append(dispatchSection());refreshGlobalSave();installTabContext();return;
  }
  if(f.crimeSection==="bounty"){
    tb.append(el("span",{class:"count"},"5 escalation phases"),savebar(saveBountyHunters));
    await renderBountyHunters();refreshGlobalSave();installTabContext();return;
  }
  if(f.crimeSection==="honor"){
    const d=await ensureHonorActions();tb.append(el("span",{class:"count"},`${d.events?.length||0} events · ${d.tiers?.length||0} shared tiers`),savebar(saveHonorActions));
    await renderHonorActions();refreshGlobalSave();installTabContext();return;
  }
  tb.append(el("input", { type: "text", placeholder: "Search crimes… (e.g. MURDER, ROBBERY)", value: f.crimeQ || "",
      oninput: ev => { f.crimeQ = ev.target.value; filterRerender(ev,renderCrime); } }),
    el("span", { class: "count", id: "crimecount" }),savebar(saveCrime));
  const q = (f.crimeQ || "").trim().toUpperCase();
  let rows = data.crimes.filter(c => !q || c.key.toUpperCase().includes(q)||humanName("crimes",c.key).toUpperCase().includes(q));
  const crimeGetters={name:c=>humanName("crimes",c.key)||c.key,severity:c=>c.severity};CRIME_COLS.forEach(([field])=>crimeGetters[field]=c=>field==="Disabled"?String(c[field]):+c[field]);
  rows=sortedRows("crime",rows,crimeGetters);
  $("#crimecount").textContent = `${rows.length} crimes (SP variation)`;
  const m = $("#main"); m.innerHTML = "";
  if(state.helpOpen.crime)m.append(el("div", { class: "hint" },
    el("b", {}, "Law's reaction rulebook: "), "per crime — ", el("b", {}, "Bounty $"),
    " added when reported, detection range, how long a witness takes to notify the law ",
    "(your window to stop them), witnesses spawned, minimum/forced wanted level, and ",
    el("b", {}, "Off"), " to disable the crime entirely. NOTE: your Crime Tweaks mod ",
    "replaces this same file — when MyOverhaul is installed, load order decides."));
  const table = el("table", {}, el("thead", {}, el("tr", {},
    sortHead("crime","name","Name / crime",renderCrime,"The editable name is an editor-only identification label, stored in this RDR2 plugin's labels.json; it does not rename game UI text."),
    ...CRIME_COLS.map(c => sortHead("crime",c[0],c[1],renderCrime,c[3])),sortHead("crime","severity","Severity",renderCrime,"Qualitative severity class used by crime escalation and law-response rules."))));
  const tbody = el("tbody");
  const vc = state.store.vanilla?.crime;
  const cc = state.store.crimeTweaks?.crime;
  for (const c of rows) {
    const vRow = vc && vc.crimes.find(x => x.key === c.key);
    const ctRow = cc && cc.crimes.find(x => x.key === c.key);
    const cells = CRIME_COLS.map(([field, label, kind]) => {
      const ek = c.key + "|" + field;
      const raw = isRO() ? c[field] : (state.crimeEdits[ek] ?? c[field]);
      if (raw === null || raw === undefined) return el("td", { class: "cat" }, "—");
      if (kind === "bool") {
        const cb = el("input", { type: "checkbox",
          onchange: ev => {
            const v = ev.target.checked ? "true" : "false";
            if (v === c[field]) delete state.crimeEdits[ek]; else state.crimeEdits[ek] = v;
            renderToolbarOnly();
          } });
        cb.checked = String(raw) === "true";
        return el("td", { class: "bool-cell" }, refField(cb,
          [["V","vtag",vRow?.[field]],["CT","cttag",ctRow?.[field]]], raw,
          (v)=>{cb.checked=String(v)==="true";cb.dispatchEvent(new Event("change"));}, v=>String(v),
          { bool: true }));
      }
      const isMoney = kind === "money";
      const inp = el("input", { type: "number", step: isMoney ? "0.01" : "any",
        value: isMoney ? fmtMoney(+raw) : (+raw % 1 ? (+raw).toFixed(2) : String(+raw)),
        style: "width:70px", class: ek in state.crimeEdits ? "edited" : "",
        onchange: ev => {
          const v = isMoney ? String(Math.round(parseFloat(ev.target.value || "0") * 100))
                            : String(+ev.target.value || 0);
          if (v === String(+c[field])) delete state.crimeEdits[ek];
          else state.crimeEdits[ek] = v;
          ev.target.classList.toggle("edited", ek in state.crimeEdits);
          renderToolbarOnly();
        } });
      return el("td", {}, refField(inp, [["V","vtag",vRow?.[field]],["CT","cttag",ctRow?.[field]]], raw,
        (v,ev)=>applyToInput(ev,isMoney?fmtMoney(+v):String(+v)), v=>isMoney?"$"+fmtMoney(+v):String(+v)));
    });
    const sevEk = c.key + "|severity";
    const severityValue=isRO()?c.severity:(state.crimeEdits[sevEk]??c.severity);
    const sev = el("select", { class: "key", style: "width:90px",disabled:isRO(),
      onchange: ev => {
        if (ev.target.value === c.severity) delete state.crimeEdits[sevEk];
        else state.crimeEdits[sevEk] = ev.target.value;
        ev.target.classList.toggle("edited", sevEk in state.crimeEdits);
        renderToolbarOnly();
      } },...["None","Low","Medium","High"].map(value=>{const option=el("option",{value},value);if(value===severityValue)option.selected=true;return option;}));
    tbody.append(el("tr", {},el("td", { class: "key" },humanNameInput("crimes",c.key),c.key.replace("CRIME_", "")), ...cells,
      el("td", {}, refField(sev, [["V","vtag",vRow?.severity],["CT","cttag",ctRow?.severity]], severityValue,
        (v,ev)=>applyToInput(ev,v), v=>String(v)))));
  }
  table.append(tbody);
  m.append(table);
  installTabContext();
}

async function saveCrime() {
  if (isRO()) return;
  const edits = Object.entries(state.crimeEdits).map(([k, value]) => {
    const [key, field] = k.split("|");
    return { key, field, value };
  });
  const dEdits = Object.entries(state.dispatchEdits).map(([k, value]) => {
    const [group, field] = k.split("|");
    return { group, field, value };
  });
  if (!edits.length && !dEdits.length) return;
  try {
    let saved = 0;
    if (edits.length) {
      const r = await api("/api/crime/save", { method: "POST",
        headers: { "Content-Type": "application/json" }, body: JSON.stringify({ edits }) });
      saved += r.saved;
      const st = refStore("mine");
      for (const e of edits) {
        const c = st.crime && st.crime.crimes.find(x => x.key === e.key);
        if (c) c[e.field] = e.value;
      }
      state.crimeEdits = {};
    }
    if (dEdits.length) {
      const r2 = await api("/api/dispatch/save", { method: "POST",
        headers: { "Content-Type": "application/json" }, body: JSON.stringify({ edits: dEdits }) });
      saved += r2.saved;
      const st = refStore("mine");
      for (const e of dEdits) {
        const row = st.dispatch && st.dispatch.rows.find(x => x.group === e.group && x.field === e.field);
        if (row) row.value = e.value;
      }
      state.dispatchEdits = {};
    }
    toast(`Saved ${saved} change(s) to crime/dispatch`);
    renderCrime();
  } catch (ex) { throw showSaveFailure(ex); }
}
