<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Lexeditor - Stardew Valley</title>
  <script>(()=>{const p=new URLSearchParams(location.search),k=p.get("lexTransition");if(!["load","resume"].includes(k))return;const r=document.documentElement;r.classList.add("lex-transition-entry");if(k==="load"){r.dataset.lexQuote=p.get("lexQuote")||"Loading editor…";r.classList.add("lex-transition-loading")}})()</script>
  <link rel="stylesheet" href="/shared/framework.css">
  <style>
    *{box-sizing:border-box}
    body{display:flex;flex-direction:column;height:100vh;margin:0;overflow:hidden;color:var(--lex-text);background:var(--lex-bg);font:15px/1.35 var(--lex-font)}
    main{flex:1;min-height:0;padding:var(--lex-panel-gap);overflow:hidden}
    .sv-layout,.lex-paged-list-detail{height:100%}.sv-table,.sv-detail{height:100%;min-height:0}
    .sv-detail .lex-detail-panel-body{padding:10px;gap:10px}
    .sv-override{display:grid;grid-template-columns:auto minmax(0,1fr);gap:8px;align-items:center;width:100%}
    .sv-override>label{display:flex;gap:5px;align-items:center;white-space:nowrap;color:var(--lex-muted)}
    .sv-actions{display:flex;flex-wrap:wrap;gap:8px}.sv-actions button{padding:7px 12px}
    .sv-warning{padding:8px 10px;border:1px solid var(--lex-border);background:var(--lex-panel);color:var(--lex-muted)}
    .sv-error{color:#ffb0a8;white-space:pre-wrap}
  </style>
</head>
<body>
  <header id="lexeditor-shell"></header>
  <main id="main"></main>
  <script src="/shared/framework.js"></script>
  <script>
  "use strict";
  const {el,columnList,columnPreferences,detailPanel,detailSection,detailField,readonlyField,recordId,infoHelp,infoIcon,pagedListDetail,clone}=LexeditorUI;
  const $=selector=>document.querySelector(selector);
  const FIELD_KEYS=["Price","Edibility","IsDrink"];
  const state={tab:"objects",dashboard:null,dataMap:null,objects:null,rows:[],savedRows:[],selected:null,page:0,pageSize:30,query:"",sort:{key:"id",dir:1},mapPage:0,mapQuery:"",mapStatus:"",mapSort:["filename",1],busy:false,error:""};
  const prefs=columnPreferences("stardew-objects",[
    {key:"id",label:"Object ID",sortable:true,width:"9em"},
    {key:"name",label:"Name",sortable:true,width:"minmax(10em,1.4fr)"},
    {key:"Price",label:"Price",sortable:true,numeric:true,width:"7em"},
    {key:"Edibility",label:"Edibility",sortable:true,numeric:true,width:"7em"},
    {key:"IsDrink",label:"Drink",sortable:true,width:"6em"},
  ],()=>render());
  async function api(path,body){const response=await fetch(path,body===undefined?undefined:{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body)});const payload=await response.json();if(!response.ok)throw new Error(payload.error||response.statusText);return payload}
  const has=(row,key)=>Object.prototype.hasOwnProperty.call(row.fields||{},key);
  const hasBase=(row,key)=>Object.prototype.hasOwnProperty.call(row.baseFields||{},key);
  const baseValue=(row,key)=>hasBase(row,key)?row.baseFields[key]:null;
  const effective=(row,key)=>has(row,key)?row.fields[key]:baseValue(row,key);
  function rowSignature(rows){return JSON.stringify([...rows].filter(row=>row.sourcePresent||row.unsupportedFieldCount||Object.keys(row.fields||{}).length).sort((a,b)=>a.id.localeCompare(b.id)).map(row=>({id:row.id,fields:row.fields||{}})))}
  function dirtyCount(){return state.objects&&rowSignature(state.rows)!==rowSignature(state.savedRows)?1:0}
  function sortedRows(){const q=state.query.trim().toLocaleLowerCase();return [...state.rows].filter(row=>!q||[row.id,row.name,row.internalName].some(value=>String(value||"").toLocaleLowerCase().includes(q))).sort((a,b)=>{let left=state.sort.key==="id"?a.id:state.sort.key==="name"?a.name:effective(a,state.sort.key),right=state.sort.key==="id"?b.id:state.sort.key==="name"?b.name:effective(b,state.sort.key);if(left===null||left===undefined)left="";if(right===null||right===undefined)right="";const result=typeof left==="string"?left.localeCompare(String(right),undefined,{numeric:true}):Number(left)-Number(right);return result*state.sort.dir})}
  function installObjects(payload){state.objects=payload;state.rows=clone(payload.rows);state.savedRows=clone(payload.rows);if(!state.rows.some(row=>row.id===state.selected))state.selected=state.rows[0]?.id??null;return payload}
  function diffEdits(){const old=Object.fromEntries(state.savedRows.map(row=>[row.id,row])),current=Object.fromEntries(state.rows.map(row=>[row.id,row])),ids=new Set([...Object.keys(old),...Object.keys(current)]),edits=[];for(const id of ids){const before=old[id]?.fields||{},after=current[id]?.fields||{},fields={};for(const key of FIELD_KEYS){const beforeHas=Object.prototype.hasOwnProperty.call(before,key),afterHas=Object.prototype.hasOwnProperty.call(after,key);if(beforeHas!==afterHas||(afterHas&&JSON.stringify(before[key])!==JSON.stringify(after[key])))fields[key]=afterHas?after[key]:null}if(Object.keys(fields).length)edits.push({id,fields})}return edits}
  function fieldControl(row,key,kind,min,max,help){const enabled=has(row,key),fallback=kind==="boolean"?false:kind==="price"?0:-300,inherited=baseValue(row,key),shown=enabled?row.fields[key]:(inherited??fallback);const input=el("input",kind==="boolean"?{type:"checkbox",checked:!!shown,disabled:!enabled||state.busy,onchange:event=>{row.fields[key]=event.target.checked;shell.refresh()}}:{type:"number",min,max,step:1,value:shown,disabled:!enabled||state.busy,oninput:event=>{if(event.target.value!=="")row.fields[key]=Number(event.target.value);shell.refresh()}});const override=el("input",{type:"checkbox",checked:enabled,disabled:state.busy,onchange:event=>{if(event.target.checked)row.fields[key]=inherited??fallback;else delete row.fields[key];render();shell.refresh()}});const inheritance=hasBase(row,key)?` Vanilla value: ${kind==="boolean"?(inherited?"true":"false"):inherited}.`:" No vanilla value is available for this record.";return detailField({label:key.toUpperCase(),help:infoHelp(help+inheritance),control:el("div",{class:"sv-override"},el("label",{},override,"Override"),input),dataType:kind==="boolean"?"BOOL":"INT",min,max})}
  function tablePanel(rows=sortedRows(),picked=state.selected,select=row=>{state.selected=row.id;render()}){const columns=[
    {key:"id",label:"Object ID",sortable:true,width:"9em"},
    {key:"name",label:"Name",sortable:true,width:"minmax(10em,1.4fr)",render:row=>row.name||row.id},
    {key:"Price",label:"Price",sortable:true,numeric:true,width:"7em",sortValue:row=>effective(row,"Price")??-1,render:row=>effective(row,"Price")===null?"—":String(effective(row,"Price"))},
    {key:"Edibility",label:"Edibility",sortable:true,numeric:true,width:"7em",sortValue:row=>effective(row,"Edibility")??-301,render:row=>effective(row,"Edibility")===null?"—":String(effective(row,"Edibility"))},
    {key:"IsDrink",label:"Drink",sortable:true,width:"6em",sortValue:row=>effective(row,"IsDrink")===null?-1:Number(effective(row,"IsDrink")),render:row=>effective(row,"IsDrink")===null?"—":effective(row,"IsDrink")?"Yes":"No"},
  ];return columnList({rows,key:row=>row.id,selected:picked,select,sortState:state.sort,sort:key=>{state.sort=state.sort.key===key?{key,dir:-state.sort.dir}:{key,dir:1};state.page=0;render()},columnPreferences:prefs,columns,class:"sv-table","aria-label":"Stardew objects"})}
  function clearOverrides(row){for(const key of FIELD_KEYS)delete row.fields[key];if(!row.sourcePresent&&!row.unsupportedFieldCount){state.rows=state.rows.filter(candidate=>candidate.id!==row.id);state.selected=state.rows[0]?.id??null}render();shell.refresh()}
  function renameDraft(row,value){const clean=String(value||"").trim();if(!clean||clean.length>160||/[\r\n]/.test(clean)){state.error="Object ID must be 1–160 characters with no line breaks.";render();return}if(state.rows.some(candidate=>candidate!==row&&candidate.id===clean)){state.error=`Object ID ${clean} already exists.`;render();return}row.id=clean;row.name=clean;row.internalName=clean;state.selected=clean;state.error="";render();shell.refresh()}
  function detail(row){if(!row){const source=state.objects?.baseSource;const message=source?.available?"No compatible Data/Objects records were found.":"No object records are available yet. StardewXnbHack can create the read-only vanilla JSON source; existing project overrides will still appear without it.";return detailPanel({className:"sv-detail",title:"Data/Objects",meta:"No records",body:[el("p",{class:"sv-warning"},message)]})}const remove=el("button",{type:"button",disabled:state.busy||!FIELD_KEYS.some(key=>has(row,key)),onclick:()=>clearOverrides(row)},"Clear supported overrides");const sourceMeta=row.sourcePresent?"vanilla source + project patch":"project/external record only";const idControl=row.draft?el("input",{type:"text",value:row.id,disabled:state.busy,onchange:event=>renameDraft(row,event.target.value)}):readonlyField(row.internalName||row.id,{format:false});return detailPanel({className:"sv-detail",title:row.name||"Object",identity:recordId(row.id),meta:`Data/Objects · ${sourceMeta}`,body:[
    detailSection({title:"SOURCE",body:[detailField({label:row.draft?"OBJECT ID":"INTERNAL NAME",control:idControl,help:row.draft?infoHelp("Set the Data/Objects key before enabling an override. Blank draft rows are not saved."):null}),detailField({label:"DESCRIPTION",control:readonlyField(row.description||"—",{format:false})})]}),
    detailSection({title:"ECONOMY & CONSUMPTION",body:[
      fieldControl(row,"Price","price",0,2147483647,"Base sell price override. Disable Override to inherit vanilla or a lower-priority content pack."),
      fieldControl(row,"Edibility","integer",-300,2147483647,"Edibility override. -300 is Stardew's inedible sentinel; Lexeditor does not accept values below it."),
      fieldControl(row,"IsDrink","boolean",null,null,"Whether the object is treated as a drink. Disable Override to inherit the underlying value."),
    ]}),detailSection({title:"PATCH",body:[detailField({label:"ACTIONS",control:el("div",{class:"sv-actions"},remove)}),...(row.unsupportedFieldCount?[detailField({label:"PRESERVATION",control:readonlyField(`${row.unsupportedFieldCount} unsupported field(s) remain untouched in content.json`)})]:[])]}),
  ]})}
  function addRecord(){let index=1,id="new-object";while(state.rows.some(row=>row.id===id))id=`new-object-${++index}`;state.rows.push({id,name:id,internalName:id,description:"",baseFields:{},sourcePresent:false,fields:{},present:[],unsupportedFieldCount:0,draft:true});state.selected=id;state.page=0;state.error="";render();shell.refresh()}
  function objectsPanel(){const records=sortedRows();return pagedListDetail({rows:records,key:row=>row.id,slots:false,add:addRecord,addTitle:"Add Data/Objects patch",addDisabled:state.busy,selected:state.selected,page:state.page,pageSize:state.pageSize,noun:"objects",className:"sv-layout",splitKey:"stardew-objects",rowsKey:"stardew-objects",defaultSplit:48,minLeft:360,minRight:400,search:{key:"stardew-objects-search",value:state.query,label:"Search object IDs or names",change:value=>{state.query=value;state.page=0;render()}},sync:next=>{state.page=next.page;state.pageSize=next.pageSize;if(next.selected!==null)state.selected=next.selected},change:next=>{state.page=next.page;state.pageSize=next.pageSize;if(next.selected!==null)state.selected=next.selected;render()},master:view=>tablePanel(view.rows,view.selected,view.select),detail})}
  function dataMapPanel(){const view=LexeditorUI.dataMap({rows:state.dataMap.rows,query:state.mapQuery,status:state.mapStatus,page:state.mapPage,sort:state.mapSort,pageSize:100,open:row=>{if(row.target==="objects")navigate("objects")},changeQuery:value=>{state.mapQuery=value;state.mapPage=0;render()},changeStatus:value=>{state.mapStatus=value;state.mapPage=0;render()},changePage:page=>{state.mapPage=page;render()},changeSort:key=>{const [active,direction]=state.mapSort;state.mapSort=[key,active===key?-direction:1];render()}});state.mapPage=view.page;return view.content}
  function stardewModLoaderSection(){return LexeditorUI.modLoaderSection({
    loader:"SMAPI with Content Patcher 2.9.0 or newer.",
    output:"A normal Content Patcher content pack deployed under <Stardew Valley>/Mods/[CP] Lexeditor <project>.",
    order:"Content Patcher applies the pack through SMAPI; Lexeditor writes field-level EditData overrides so unrelated fields remain composable.",
    safety:"Installed Content/*.xnb files stay read-only, and managed deployment refuses externally changed copies.",
    removal:"Revert Lexeditor Mod removes only the Lexeditor-managed deployed copy; the source project is preserved."
  })}
  function infoPanel(){const d=state.dashboard,loader=d.loader,deployment=d.deployment,source=d.source||{},acceptance=d.acceptance||{};const read=value=>readonlyField(String(value??"—"),{format:false});const contentPatcherState=!loader.contentPatcher?"Not found":loader.contentPatcherCompatible?`Installed · ${loader.contentPatcherVersion||"version unknown"}`:`Update required · ${loader.contentPatcherVersion||"unknown"} (need ${loader.requiredContentPatcherVersion||"2.9.0"}+)`;const actions=el("div",{class:"sv-actions"},el("button",{type:"button",disabled:state.busy||dirtyCount()>0||!loader.ready,onclick:()=>deploymentAction("deploy")},deployment.deployed?"Redeploy Project":"Deploy Project"),el("button",{type:"button",disabled:state.busy||!deployment.managed||deployment.externallyChanged,onclick:()=>deploymentAction("revert")},"Revert Lexeditor Mod"));const acceptanceActions=el("div",{class:"sv-actions"},el("button",{type:"button",disabled:state.busy||dirtyCount()>0||!loader.ready||!deployment.managed||deployment.externallyChanged,onclick:acceptanceBegin},acceptance.started?"Reset Acceptance Baseline":"Begin Acceptance"),el("button",{type:"button",disabled:state.busy||!acceptance.started,onclick:acceptanceVerify},"Verify Acceptance Evidence"));const acceptanceState=acceptance.accepted?"Accepted":acceptance.state==="waiting-for-run"?"Waiting for new SMAPI run":acceptance.state==="failed"?"Verification failed":"Not started";const runtime=acceptance.smapiVersion?`SMAPI ${acceptance.smapiVersion} · Stardew ${acceptance.gameVersion||"?"}${acceptance.gameBuild?` build ${acceptance.gameBuild}`:""}`:"No post-baseline runtime detected";return detailPanel({className:"lex-information-panel sv-detail",icon:infoIcon(),title:"Information",meta:"Stardew Valley installation, source data, loader, project deployment, and installed acceptance",body:[
    detailSection({title:"GAME",body:[detailField({label:"STATE",control:read(d.game.ready?"Ready":"Incomplete")}),detailField({label:"FOLDER",control:read(d.game.root)})]}),
    detailSection({title:"VANILLA DATA",body:[detailField({label:"OBJECTS",control:read(source.available?`Ready — ${source.recordCount} records`:source.error?"Invalid unpacked source":"Unpacked source not found")}),detailField({label:"SOURCE",control:read(source.path)}),detailField({label:"STARDEWXNBHACK",control:read(source.helperInstalled?"Installed in game folder":"Not detected")}),detailField({label:"NOTE",control:read(source.error||"Lexeditor reads this JSON only; it never rewrites the unpacked file or Content/Data/Objects.xnb."),help:infoHelp("Run StardewXnbHack once to create Content (unpacked) if you want vanilla IDs and values in the Objects editor. Project overrides remain editable without it.")})]}),
    stardewModLoaderSection(),
    detailSection({title:"LOADER STATUS",body:[detailField({label:"SMAPI",control:read(loader.smapi?"Installed":"Not found")}),detailField({label:"CONTENT PATCHER",control:read(contentPatcherState)})]}),
    detailSection({title:"PROJECT",body:[detailField({label:"FOLDER",control:read(d.project.root)}),detailField({label:"DEPLOYMENT",control:read(deployment.externallyChanged?"Externally changed — blocked":deployment.managed?"Lexeditor-managed":deployment.deployed?"Unmanaged collision":"Not deployed")}),detailField({label:"TARGET",control:read(deployment.target)}),detailField({label:"ACTIONS",control:actions})]}),
    detailSection({title:"INSTALLED ACCEPTANCE",body:[detailField({label:"STATE",control:read(acceptanceState),help:infoHelp("Begin acceptance after deploying a representative edit. Then launch Stardew through SMAPI, reach the title screen, run patch export \"Data/Objects\" in the SMAPI console, return to Lexeditor, and verify the new runtime evidence.")}),detailField({label:"TARGET",control:read(`Stardew ${acceptance.targetGameVersion||"1.6.15"}`)}),detailField({label:"RUNTIME",control:read(runtime)}),detailField({label:"CONTENT PATCHER",control:read(acceptance.contentPatcherSeen?(acceptance.contentPatcherVersionFromLog?`Seen · ${acceptance.contentPatcherVersionFromLog}`:"Seen in SMAPI log"):"Not yet seen in a new log")}),detailField({label:"LEXEDITOR PACK",control:read(acceptance.projectMentioned?"Seen in new SMAPI log":"Not yet seen in a new log")}),detailField({label:"OBJECTS.XNB",control:read(acceptance.started?(acceptance.objectsXnbUnchanged?"Byte-identical to baseline":"Changed or missing"):"Baseline not captured")}),detailField({label:"SMAPI LOG",control:read(acceptance.smapiLogPath)}),...(acceptance.blockers?.length?[detailField({label:"BLOCKERS",control:read(acceptance.blockers.join(" · "))})]:[]),detailField({label:"ACTIONS",control:acceptanceActions})]}),
    ...(state.error?[detailSection({title:"ERROR",body:[el("p",{class:"sv-error",role:"alert"},state.error)]})]:[]),
  ]})}
  async function deploymentAction(action){if(state.busy||dirtyCount())return;if(action==="revert"&&!(await LexeditorUI.confirmAction({title:"Revert Stardew deployment?",message:"Remove only this Lexeditor-managed Content Patcher deployment? The source project is preserved.",confirmLabel:"Revert deployment"})))return;state.busy=true;state.error="";shell.refresh();try{state.dashboard.deployment=await api(`/api/deployment/${action}`,{});state.dashboard.loader=state.dashboard.deployment.loader;state.dashboard.acceptance=await api("/api/acceptance")}catch(error){state.error=error.message}finally{state.busy=false;render()}}
  async function acceptanceBegin(){if(state.busy||dirtyCount())return;const current=state.dashboard.acceptance||{};if(current.started&&!(await LexeditorUI.confirmAction({title:"Reset acceptance baseline?",message:"Replace the existing acceptance baseline? You will need to launch Stardew through SMAPI again.",confirmLabel:"Reset baseline"})))return;state.busy=true;state.error="";shell.refresh();try{state.dashboard.acceptance=await api("/api/acceptance/begin",{})}catch(error){state.error=error.message}finally{state.busy=false;render()}}
  async function acceptanceVerify(){if(state.busy)return;state.busy=true;state.error="";shell.refresh();try{state.dashboard.acceptance=await api("/api/acceptance")}catch(error){state.error=error.message}finally{state.busy=false;render()}}
  async function save(){if(state.busy||!state.objects)return;const edits=diffEdits();if(!edits.length)return;state.busy=true;shell.refresh();try{installObjects(await api("/api/objects/save",{sha256:state.objects.sha256,edits}));state.error=""}catch(error){state.error=error.message;throw error}finally{state.busy=false;render()}}
  async function discard(){installObjects(await api("/api/objects"));state.error="";render()}
  async function refresh(){const [dashboard,map,objects]=await Promise.all([api("/api/dashboard"),api("/api/datamap"),api("/api/objects")]);state.dashboard=dashboard;state.dataMap=map;installObjects(objects)}
  async function render(){if(!state.dashboard)return;let content;if(state.tab==="datamap")content=dataMapPanel();else if(state.tab==="info")content=infoPanel();else content=objectsPanel();$("#main").replaceChildren(content);shell.refresh()}
  function navigate(tab){state.tab=tab;render()}
  const shell=LexeditorUI.mountShell({host:"#lexeditor-shell",brand:"LEXEDITOR",plugin:{id:"stardew-valley",name:"Stardew Valley",themeName:"stardew-valley",theme:{accent:"#6cae43"}},tabs:[{id:"objects",label:"Objects"}],activeTab:()=>state.tab,navigate,help:()=>navigate("datamap"),helpActive:()=>state.tab==="datamap",helpTitle:"Open the Stardew Valley Data Map",info:()=>navigate("info"),infoActive:()=>state.tab==="info",infoTitle:"Open Stardew Valley plugin information",dirtyCount,readonly:()=>state.busy,save,discard});

  refresh().then(()=>render()).then(()=>LexeditorUI.finishPluginLoading()).catch(error=>{$("#main").textContent=`Failed to load Stardew Valley project: ${error.message}`;LexeditorUI.finishPluginLoading()});
  </script>
