<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Lexeditor - Terraria</title>
  <link rel="stylesheet" href="/shared/framework.css">
  <style>
    *{box-sizing:border-box}
    body{display:flex;flex-direction:column;height:100vh;margin:0;overflow:hidden;color:var(--lex-text);background:var(--lex-bg);font:15px/1.35 var(--lex-font)}
    :root{--lex-accent:#77b255;--lex-highlight:#36502c}
    main{flex:1;min-height:0;padding:var(--lex-panel-gap);overflow:auto}
    .terraria-page{max-width:1100px;margin:0 auto;display:grid;gap:var(--lex-panel-gap)}
    .terraria-note{padding:10px 12px;border:1px solid var(--lex-border);background:var(--lex-panel)}
    .terraria-error{border-color:#a84d4d}
    .terraria-success{border-color:var(--lex-success)}
    .terraria-list{width:100%;min-width:320px;min-height:88px;resize:vertical}
    .terraria-map{width:100%;border-collapse:collapse;background:var(--lex-panel)}
    .terraria-map th,.terraria-map td{padding:8px 10px;border:1px solid var(--lex-border);text-align:left;vertical-align:top}
    .terraria-map th{background:var(--lex-panel-muted,#eceff1)}
    .terraria-status{font-weight:700;text-transform:uppercase;font-size:.8em;letter-spacing:.04em}
    .terraria-build-card{display:grid;gap:9px}
    .terraria-build-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
    .terraria-build-button{padding:8px 14px;border:1px solid var(--lex-border);border-radius:var(--lex-radius);color:var(--lex-text);background:var(--lex-panel-2);font:700 13px/1 var(--lex-font);cursor:pointer}
    .terraria-build-button:hover:not(:disabled){color:var(--lex-accent-text);border-color:var(--lex-accent);background:var(--lex-accent)}
    .terraria-build-button:disabled{opacity:.45;cursor:default}
    .terraria-build-path{overflow-wrap:anywhere;color:var(--lex-muted);font-size:.9em}
    .terraria-build-log{max-height:260px;margin:0;padding:10px;overflow:auto;white-space:pre-wrap;background:var(--lex-bg);border:1px solid var(--lex-border);font:12px/1.45 ui-monospace,SFMono-Regular,Consolas,monospace}
  </style>
</head>
<body>
  <header id="lexeditor-shell"></header>
  <main id="main"></main>
  <script src="/shared/framework.js"></script>
  <script>
  "use strict";
  const {el,detailPanel,detailSection,detailField,readonlyField}=LexeditorUI;
  let tab="metadata",saved=null,current=null,mapRows=[],buildInfo=null,buildResult=null,building=false,error="";

  const clone=value=>JSON.parse(JSON.stringify(value));
  async function request(path,options={}){
    const response=await fetch(path,{headers:{"Content-Type":"application/json"},...options});
    const payload=await response.json();
    if(!response.ok)throw new Error(payload.error||`Request failed (${response.status})`);
    return payload;
  }
  function dirtyKeys(){
    if(!saved||!current)return [];
    return Object.keys(current.values).filter(key=>JSON.stringify(current.values[key])!==JSON.stringify(saved.values[key]));
  }
  const dirtyCount=()=>dirtyKeys().length;
  function setValue(key,value){current.values[key]=value;render();shell?.refresh?.()}
  function textControl(key,{placeholder=""}={}){
    return el("input",{type:"text",value:current.values[key]??"",placeholder,
      disabled:!current.editable,oninput:event=>{current.values[key]=event.target.value;shell?.refresh?.()}});
  }
  function listControl(key,{placeholder=""}={}){
    const values=Array.isArray(current.values[key])?current.values[key]:[];
    return el("textarea",{class:"terraria-list",value:values.join("\n"),placeholder,disabled:!current.editable,
      oninput:event=>{
        current.values[key]=event.target.value.split(/\r?\n/).map(value=>value.trim()).filter(Boolean);
        shell?.refresh?.();
      }});
  }
  function boolControl(key){
    if(!(key in current.values))return readonlyField("Not declared in build.txt");
    return el("input",{type:"checkbox",checked:!!current.values[key],disabled:!current.editable,
      onchange:event=>setValue(key,event.target.checked)});
  }
  function sideControl(){
    const select=el("select",{disabled:!current.editable,onchange:event=>setValue("side",event.target.value)});
    for(const value of ["Both","Client","Server","NoSync"]){
      const option=el("option",{value},value);option.selected=current.values.side===value;select.append(option);
    }
    return select;
  }
  function warnings(){
    if(!current)return [];
    const items=[];
    if(current.duplicates.length)items.push(el("div",{class:"terraria-note terraria-error"},`Structured saving is disabled because build.txt repeats: ${current.duplicates.join(", ")}. Remove the ambiguity in source first.`));
    if(error)items.push(el("div",{class:"terraria-note terraria-error"},error));
    return items;
  }
  function metadataPanel(){
    if(!current)return el("div",{class:"terraria-note"},"Loading build.txt…");
    const panel=detailPanel({title:"build.txt",identity:"TMOD",meta:"tModLoader package metadata",body:[
      detailSection({title:"IDENTITY",body:[
        detailField({label:"DISPLAY NAME",control:textControl("displayName"),dataType:"STRING"}),
        detailField({label:"AUTHOR",control:textControl("author"),dataType:"STRING"}),
        detailField({label:"VERSION",control:textControl("version",{placeholder:"1.0"}),dataType:"VERSION"}),
        detailField({label:"HOMEPAGE",control:textControl("homepage",{placeholder:"Not declared"}),dataType:"STRING"}),
      ]}),
      detailSection({title:"RUNTIME",body:[
        detailField({label:"SIDE",control:sideControl(),dataType:"ENUM"}),
      ]}),
      detailSection({title:"PACKAGE",body:[
        detailField({label:"HIDE CODE",control:boolControl("hideCode"),dataType:"BOOL"}),
        detailField({label:"HIDE RESOURCES",control:boolControl("hideResources"),dataType:"BOOL"}),
        detailField({label:"INCLUDE SOURCE",control:boolControl("includeSource"),dataType:"BOOL"}),
      ]}),
    ]});
    return el("div",{class:"terraria-page"},...warnings(),panel,
      el("div",{class:"terraria-note"},"Lexeditor rewrites only modeled properties. Comments, unknown/future keys, localized display-name lines, and unrelated formatting remain untouched."));
  }
  function buildCard(){
    if(!buildInfo)return el("div",{class:"terraria-note"},"Checking native tModLoader build handoff…");
    const blockedByDirty=dirtyCount()>0;
    const reason=blockedByDirty
      ?"Save or discard metadata edits before building."
      :(buildInfo.reason||"Ready to invoke tModLoader's native -build path.");
    const packageLabel=buildInfo.artifactExists?"Package built":"Package missing";
    const enabledLabel=!buildInfo.enabledStateValid
      ?"Enabled state unknown"
      :(buildInfo.enabled?"Enabled":"Disabled");
    const card=el("div",{class:"terraria-note terraria-build-card"},
      el("div",{class:"terraria-build-row"},
        el("button",{class:"terraria-build-button",disabled:building||blockedByDirty||!buildInfo.available,onclick:buildMod},
          building?"BUILDING…":"BUILD MOD"),
        el("strong",{},buildInfo.available&&!blockedByDirty?"Native build ready":"Native build unavailable")),
      el("div",{},reason),
      el("div",{class:"terraria-build-row"},
        el("span",{class:"terraria-status"},packageLabel),
        el("span",{class:"terraria-status"},enabledLabel)),
      el("div",{class:"terraria-build-path"},`Expected package: ${buildInfo.expectedArtifact}`),
      el("div",{class:"terraria-build-path"},`tModLoader state: ${buildInfo.enabledStatePath}`));
    if(!buildInfo.enabledStateValid&&buildInfo.enabledStateError){
      card.append(el("div",{class:"terraria-error"},buildInfo.enabledStateError));
    }
    if(buildResult){
      const success=buildResult.ok;
      card.classList.add(success?"terraria-success":"terraria-error");
      const summary=success
        ?`Build succeeded${buildResult.artifactExists?" and produced the expected .tmod":""}${buildResult.enabled?"; tModLoader reports it enabled.":"."}`
        :(buildResult.error||`Build failed with exit code ${buildResult.exitCode??"unknown"}.`);
      card.append(el("strong",{},summary));
      if(success&&buildResult.enabledStateValid&&!buildResult.enabled){
        card.append(el("div",{},"The package was built, but enabled.json does not currently list this mod as enabled."));
      }
      const log=[
        buildResult.stdout&&`STDOUT\n${buildResult.stdout}`,
        buildResult.stderr&&`STDERR\n${buildResult.stderr}`,
        buildResult.nativeLog&&`TMODLOADER NATIVES LOG\n${buildResult.nativeLog}`,
      ].filter(Boolean).join("\n\n");
      if(log)card.append(el("pre",{class:"terraria-build-log"},log));
    }
    return card;
  }
  function dependenciesPanel(){
    if(!current)return el("div",{class:"terraria-note"},"Loading build.txt…");
    const panel=detailPanel({title:"References & Build",identity:"TMOD",meta:"One entry per line; Lexeditor serializes tModLoader's comma-delimited build.txt lists.",body:[
      detailSection({title:"DEPENDENCIES",body:[
        detailField({label:"MOD REFERENCES",control:listControl("modReferences",{placeholder:"ExampleMod\nExampleLibrary@1.2"}),dataType:"LIST"}),
        detailField({label:"WEAK REFERENCES",control:listControl("weakReferences",{placeholder:"OptionalMod"}),dataType:"LIST"}),
        detailField({label:"DLL REFERENCES",control:listControl("dllReferences",{placeholder:"LibraryName"}),dataType:"LIST"}),
      ]}),
      detailSection({title:"LOAD ORDER",body:[
        detailField({label:"SORT AFTER",control:listControl("sortAfter",{placeholder:"ModName"}),dataType:"LIST"}),
        detailField({label:"SORT BEFORE",control:listControl("sortBefore",{placeholder:"ModName"}),dataType:"LIST"}),
      ]}),
      detailSection({title:"BUILD FILTER",body:[
        detailField({label:"BUILD IGNORE",control:listControl("buildIgnore",{placeholder:"Folder/*\nFile.ext"}),dataType:"LIST"}),
      ]}),
    ]});
    return el("div",{class:"terraria-page"},...warnings(),panel,buildCard(),
      el("div",{class:"terraria-note"},"Strong and weak references must not repeat the same mod name. A strong mod reference also cannot duplicate a DLL reference. Version-qualified mod references use ModName@1.2 style syntax. Lexeditor reads tModLoader's local enabled state but does not rewrite enabled.json."));
  }
  function dataMapPanel(){
    const table=el("table",{class:"terraria-map"},
      el("thead",{},el("tr",{},...["PATH","FAMILY","COVERAGE"].map(label=>el("th",{},label)))),
      el("tbody",{},...mapRows.map(row=>el("tr",{},
        el("td",{},row.path),el("td",{},row.family),el("td",{class:"terraria-status"},row.status)))));
    return el("div",{class:"terraria-page"},
      el("div",{class:"terraria-note"},"Structured means Lexeditor has a format-aware editor. Recognized means the file family is known but remains outside the current structured editing surface."),table);
  }
  function render(){
    const content=tab==="datamap"?dataMapPanel():tab==="dependencies"?dependenciesPanel():metadataPanel();
    document.querySelector("#main").replaceChildren(content);
    shell?.refresh?.();
  }
  async function load(){
    try{
      const [metadata,map,build]=await Promise.all([
        request("/api/build-metadata"),request("/api/data-map"),request("/api/build"),
      ]);
      saved=clone(metadata);current=clone(metadata);mapRows=map.rows;buildInfo=build;error="";
    }catch(exc){error=String(exc.message||exc)}
    render();
  }
  async function save(){
    if(!saved||!current||!dirtyCount())return;
    const updates={};
    for(const key of dirtyKeys()){
      const value=current.values[key];
      if(value===""&&!(key in saved.values))continue;
      if(Array.isArray(value)&&!value.length&&!(key in saved.values))continue;
      updates[key]=value;
    }
    if(!Object.keys(updates).length){saved=clone(current);shell?.refresh?.();return}
    try{
      const result=await request("/api/build-metadata",{method:"POST",body:JSON.stringify({updates,expectedSha256:saved.sha256})});
      saved=clone(result);current=clone(result);error="";
    }catch(exc){error=String(exc.message||exc)}
    render();
  }
  async function buildMod(){
    if(building||dirtyCount()||!buildInfo?.available)return;
    building=true;buildResult=null;error="";render();
    try{
      buildResult=await request("/api/build",{method:"POST",body:"{}"});
      buildInfo=await request("/api/build");
    }catch(exc){
      error=String(exc.message||exc);
      try{buildInfo=await request("/api/build")}catch(_ignored){}
    }finally{
      building=false;render();
    }
  }
  async function discard(){current=clone(saved);error="";render()}
  function navigate(value){tab=value;render()}
  const shell=LexeditorUI.mountShell({
    host:"#lexeditor-shell",brand:"LEXEDITOR",
    plugin:{id:"terraria",name:"Terraria",themeName:"terraria",theme:{accent:"#77b255"}},
    tabs:[{id:"metadata",label:"Mod Metadata"},{id:"dependencies",label:"Dependencies & Build"}],activeTab:()=>tab,navigate,
    help:()=>navigate("datamap"),helpActive:()=>tab==="datamap",helpTitle:"Open Terraria Data Map",
    dirtyCount,readonly:()=>!current?.editable,save,discard,
  });
  load().finally(()=>LexeditorUI.finishPluginLoading());
  </script>
</body>
</html>
