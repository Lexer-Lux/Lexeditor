<!doctype html>
<html lang="en">
<head>

  <title>Lexeditor - Terraria</title>
  <link rel="stylesheet" href="/shared/framework.css">
  <style>

    .terraria-build-button:hover:not(:disabled){color:var(--lex-accent-text);border-color:var(--lex-accent);background:var(--lex-accent)}
    .terraria-build-button:disabled{opacity:.45;cursor:default}

    .terraria-build-log{max-height:260px;margin:0;padding:10px;overflow:auto;white-space:pre-wrap;background:var(--lex-bg);border:1px solid var(--lex-border);font:12px/1.45 ui-monospace,SFMono-Regular,Consolas,monospace}

    .terraria-localization-toolbar input{min-width:220px}
    .terraria-localization-create input,.terraria-source-create input{min-width:220px;flex:1}

    .terraria-localization-table input{width:100%;min-width:260px}
    .terraria-localization-key{max-width:430px;overflow-wrap:anywhere;font:12px/1.45 ui-monospace,SFMono-Regular,Consolas,monospace}
    .terraria-readonly-value{max-width:470px;max-height:110px;overflow:auto;white-space:pre-wrap;color:var(--lex-muted)}
    .terraria-source-editor{width:100%;min-height:62vh;resize:vertical;padding:12px;border:1px solid var(--lex-border);background:var(--lex-bg);color:var(--lex-text);tab-size:4;font:13px/1.5 ui-monospace,SFMono-Regular,Consolas,monospace;white-space:pre}
  </style>
</head>
