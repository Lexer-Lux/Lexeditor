<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Lexeditor - Project Zomboid</title>
  <link rel="stylesheet" href="/shared/framework.css">
  <style>
    *{box-sizing:border-box}:root{--lex-accent:#708057;--lex-highlight:#4f5e3f}
    body{height:100vh;margin:0;display:flex;flex-direction:column;overflow:hidden;background:var(--lex-bg);color:var(--lex-text);font:15px/1.35 var(--lex-font)}
    #lexeditor-shell{display:flex;align-items:center;gap:18px;min-height:54px;padding:8px 14px;border-bottom:1px solid var(--lex-border);background:var(--lex-panel)}
    #lexeditor-shell strong{font-size:1.05rem}.tabs{display:flex;gap:6px;flex-wrap:wrap}.tabs button{padding:7px 12px;border:1px solid var(--lex-border);background:var(--lex-bg);color:inherit;cursor:pointer}.tabs button.active{background:var(--lex-accent);color:#fff;border-color:var(--lex-accent)}
    #status{margin-left:auto;max-width:42vw;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--lex-muted)}
    main{flex:1;min-height:0;padding:12px;overflow:auto}.panel{max-width:1200px;margin:0 auto;border:1px solid var(--lex-border);background:var(--lex-panel)}
    .panel>h2{margin:0;padding:12px 14px;border-bottom:1px solid var(--lex-border);font-size:1rem}.content{padding:14px}.grid{display:grid;grid-template-columns:repeat(2,minmax(260px,1fr));gap:12px 18px}.field{display:grid;gap:5px}.field label{font-size:.78rem;font-weight:700;letter-spacing:.04em;color:var(--lex-muted)}input,select,textarea{width:100%;padding:8px;border:1px solid var(--lex-border);background:var(--lex-bg);color:inherit;font:inherit}textarea{min-height:90px;resize:vertical}.actions{display:flex;gap:8px;align-items:center;margin-top:14px}.actions button{padding:8px 13px;border:0;background:var(--lex-accent);color:white;cursor:pointer}.actions button.secondary{background:var(--lex-bg);color:inherit;border:1px solid var(--lex-border)}button:disabled{opacity:.45;cursor:default}
    .split{display:grid;grid-template-columns:minmax(300px,40%) 1fr;min-height:520px}.list{border-right:1px solid var(--lex-border);overflow:auto}.list button{display:block;width:100%;padding:9px 11px;text-align:left;border:0;border-bottom:1px solid var(--lex-border);background:transparent;color:inherit;cursor:pointer}.list button.active{background:color-mix(in srgb,var(--lex-accent) 18%,var(--lex-panel))}.list small{display:block;color:var(--lex-muted)}.detail{padding:14px;overflow:auto}.empty{padding:30px;color:var(--lex-muted);text-align:center}.notice{margin-bottom:12px;padding:10px;border:1px solid var(--lex-border);background:var(--lex-bg);color:var(--lex-muted)}table{width:100%;border-collapse:collapse}th,td{padding:8px 10px;border-bottom:1px solid var(--lex-border);text-align:left;vertical-align:top}th{position:sticky;top:0;background:var(--lex-panel)}code{font-family:ui-monospace,SFMono-Regular,Consolas,monospace}.pill{display:inline-block;padding:2px 7px;border:1px solid var(--lex-border);border-radius:999px;font-size:.75rem}.danger{color:#b04444}@media(max-width:760px){.grid,.split{grid-template-columns:1fr}.list{border-right:0;border-bottom:1px solid var(--lex-border)}#status{display:none}}
  </style>
</head>
<body>
<header id="lexeditor-shell">
  <strong>Project Zomboid · Build 42</strong>
  <nav class="tabs" aria-label="Editor sections">
    <button data-tab="metadata" class="active">Mod Metadata</button>
    <button data-tab="items">Items</button>
    <button data-tab="evolved">Evolved Recipes</button>
    <button data-tab="crafts">Craft Recipes</button>
    <button data-tab="fixing">Fixing</button>
    <button data-tab="fluids">Fluids</button>
    <button data-tab="vehicles">Vehicles</button>
    <button data-tab="sounds">Sounds</button>
    <button data-tab="models">Models</button>
    <button data-tab="mannequins">Mannequins</button>
    <button data-tab="timedactions">Timed Actions</button>
    <button data-tab="scripts">Scripts</button>
    <button data-tab="datamap">Data Map</button>
    <button data-tab="deployment">Deployment</button>
  </nav>
  <span id="status">Loading…</span>
</header>
<main id="main"></main>
<script src="/shared/framework.js"></script>
<script>
"use strict";
const main=document.getElementById("main"),status=document.getElementById("status");
let tab="metadata",metadata=null,items={rows:[],errors:[]},evolved={rows:[],errors:[]},crafts={rows:[],errors:[]},fixings={rows:[],errors:[]},fluids={rows:[],errors:[]},vehicles={rows:[],errors:[]},sounds={rows:[],errors:[]},models={rows:[],errors:[]},mannequins={rows:[],errors:[]},timedActions={rows:[],errors:[]},scripts={rows:[],counts:{},errors:[]},selectedItem=null,selectedEvolved=null,selectedCraft=null,selectedFixing=null,selectedFluid=null,selectedVehicle=null,selectedSound=null,selectedModel=null,selectedMannequin=null,selectedTimedAction=null,datamap={rows:[]},deployment=null;
const esc=value=>String(value??"").replace(/[&<>\"']/g,ch=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[ch]));
async function api(path,options={}){const response=await fetch(path,{...options,headers:{"Content-Type":"application/json",...(options.headers||{})}});let payload={};try{payload=await response.json()}catch{}if(!response.ok)throw new Error(payload.error||`Request failed (${response.status})`);return payload}
function setStatus(message,error=false){status.textContent=message;status.classList.toggle("danger",error)}
async function reload(){try{[metadata,items,evolved,crafts,fixings,fluids,vehicles,sounds,models,mannequins,timedActions,scripts,datamap,deployment]=await Promise.all([api("/api/mod-info"),api("/api/items"),api("/api/evolvedrecipes"),api("/api/craftrecipes"),api("/api/fixings"),api("/api/fluids"),api("/api/vehicles"),api("/api/sounds"),api("/api/models"),api("/api/mannequins"),api("/api/timedactions"),api("/api/zedscript"),api("/api/datamap"),api("/api/deployment")]);if(selectedItem)selectedItem=items.rows.find(row=>row.key===selectedItem.key)||null;if(selectedEvolved)selectedEvolved=evolved.rows.find(row=>row.key===selectedEvolved.key)||null;if(selectedCraft)selectedCraft=crafts.rows.find(row=>row.key===selectedCraft.key)||null;if(selectedFixing)selectedFixing=fixings.rows.find(row=>row.key===selectedFixing.key)||null;if(selectedFluid)selectedFluid=fluids.rows.find(row=>row.key===selectedFluid.key)||null;if(selectedVehicle)selectedVehicle=vehicles.rows.find(row=>row.key===selectedVehicle.key)||null;if(selectedSound)selectedSound=sounds.rows.find(row=>row.key===selectedSound.key)||null;if(selectedModel)selectedModel=models.rows.find(row=>row.key===selectedModel.key)||null;if(selectedMannequin)selectedMannequin=mannequins.rows.find(row=>row.key===selectedMannequin.key)||null;if(selectedTimedAction)selectedTimedAction=timedActions.rows.find(row=>row.key===selectedTimedAction.key)||null;setStatus(`${items.rows.length} items · ${evolved.rows.length} evolved · ${crafts.rows.length} craft recipes · ${fixings.rows.length} fixings · ${fluids.rows.length} fluids · ${vehicles.rows.length} vehicles · ${sounds.rows.length} sounds · ${models.rows.length} models · ${mannequins.rows.length} mannequins · ${timedActions.rows.length} timed actions · ${scripts.rows.length} script records`);render()}catch(error){setStatus(error.message,true);main.innerHTML=`<div class="panel"><div class="empty">${esc(error.message)}</div></div>`}}
function field(label,name,value,type="text",extra=""){return `<div class="field"><label for="${esc(name)}">${esc(label)}</label><input id="${esc(name)}" name="${esc(name)}" type="${esc(type)}" value="${esc(value)}" ${extra}></div>`}
function selectField(label,name,value,options,disabled=false){return `<div class="field"><label for="${esc(name)}">${esc(label)}</label><select id="${esc(name)}" name="${esc(name)}" ${disabled?"disabled":""}>${options.map(option=>`<option value="${esc(option)}" ${option===value?"selected":""}>${esc(option)}</option>`).join("")}</select></div>`}
function renderMetadata(){const f=metadata.fields;main.innerHTML=`<section class="panel"><h2>${esc(metadata.path)}</h2><form id="metadata-form" class="content"><div class="notice">Only documented scalar keys are rewritten. Unknown keys/lines are left intact; an external change forces a reload.</div><div class="grid">${field("Name","name",f.name)}${field("ID","id",f.id)}${field("Author","author",f.author)}${field("Mod Version","modversion",f.modversion)}${field("Minimum Game Version","versionMin",f.versionMin)}${field("Maximum Game Version","versionMax",f.versionMax)}${field("Icon","icon",f.icon)}${field("URL","url",f.url)}${field("Required Mods","require",f.require)}${field("Incompatible Mods","incompatible",f.incompatible)}${field("Load After","loadModAfter",f.loadModAfter)}${field("Load Before","loadModBefore",f.loadModBefore)}${field("Category","category",f.category)}</div><div class="field" style="margin-top:12px"><label for="description">Description</label><textarea id="description" name="description">${esc(f.description)}</textarea></div><div class="actions"><button type="submit">Save Metadata</button><span>${metadata.duplicateKeys.length?`Duplicate keys: ${esc(metadata.duplicateKeys.join(", "))}`:`${metadata.unmodeledLines} unmodeled line(s) preserved`}</span></div></form></section>`;document.getElementById("metadata-form").onsubmit=saveMetadata}
async function saveMetadata(event){event.preventDefault();const form=new FormData(event.currentTarget),edits={};for(const [key,value] of form.entries())edits[key]=value;try{metadata=await api("/api/mod-info/save",{method:"POST",body:JSON.stringify({sha256:metadata.sha256,edits})});setStatus("Metadata saved");await reload()}catch(error){setStatus(error.message,true)}}
function itemButton(row){return `<button data-key="${esc(row.key)}" class="${selectedItem?.key===row.key?"active":""}"><strong>${esc(row.fullType)}</strong><small>${esc(row.path)}</small></button>`}
function renderItems(){if(!selectedItem&&items.rows.length)selectedItem=items.rows[0];main.innerHTML=`<section class="panel"><h2>Build 42 Items</h2><div class="split"><div class="list">${items.rows.length?items.rows.map(itemButton).join(""):`<div class="empty">No item blocks found.</div>`}</div><div id="item-detail" class="detail"></div></div></section>`;main.querySelectorAll("[data-key]").forEach(button=>button.onclick=()=>{selectedItem=items.rows.find(row=>row.key===button.dataset.key);renderItems()});renderItemDetail()}
function renderItemDetail(){const box=document.getElementById("item-detail");if(!box)return;if(!selectedItem){box.innerHTML=`<div class="empty">Select an item.</div>`;return}const f=selectedItem.fields,editable=key=>f[key]!=="";const options=selectedItem.itemTypeOptions.map(value=>`<option value="${esc(value)}" ${value===f.ItemType?"selected":""}>${esc(value)}</option>`).join("");box.innerHTML=`<h3>${esc(selectedItem.fullType)}</h3><p><code>${esc(selectedItem.path)}</code></p><div class="notice">Existing documented scalar properties are patched surgically. Missing, nested and unknown properties remain untouched.</div><form id="item-form"><div class="grid"><div class="field"><label>Item Type</label><select name="ItemType" ${editable("ItemType")?"":"disabled"}>${options}</select></div>${field("Weight","Weight",f.Weight,"number",editable("Weight")?'min="0" step="any"':'disabled')}${field("Icon","Icon",f.Icon,"text",editable("Icon")?"":"disabled")}${field("Display Category","DisplayCategory",f.DisplayCategory,"text",editable("DisplayCategory")?"":"disabled")}</div><div class="actions"><button type="submit">Save Item</button><span>${selectedItem.duplicateKeys.length?`Ambiguous: ${esc(selectedItem.duplicateKeys.join(", "))}`:"Unknown item data is preserved"}</span></div></form>`;document.getElementById("item-form").onsubmit=saveItem}
async function saveItem(event){event.preventDefault();const form=new FormData(event.currentTarget),edits={};for(const key of ["ItemType","Weight","Icon","DisplayCategory"]){if(form.has(key))edits[key]=form.get(key)}try{selectedItem=await api("/api/items/save",{method:"POST",body:JSON.stringify({path:selectedItem.path,module:selectedItem.module,id:selectedItem.id,sha256:selectedItem.sha256,edits})});setStatus(`${selectedItem.fullType} saved`);await reload()}catch(error){setStatus(error.message,true)}}
function evolvedButton(row){return `<button data-evolved-key="${esc(row.key)}" class="${selectedEvolved?.key===row.key?"active":""}"><strong>${esc(row.fullType)}</strong><small>${esc(row.path)}</small></button>`}
function renderEvolved(){if(!selectedEvolved&&evolved.rows.length)selectedEvolved=evolved.rows[0];main.innerHTML=`<section class="panel"><h2>Build 42 Evolved Recipes</h2><div class="split"><div class="list">${evolved.rows.length?evolved.rows.map(evolvedButton).join(""):`<div class="empty">No evolvedrecipe blocks found.</div>`}</div><div id="evolved-detail" class="detail"></div></div></section>`;main.querySelectorAll("[data-evolved-key]").forEach(button=>button.onclick=()=>{selectedEvolved=evolved.rows.find(row=>row.key===button.dataset.evolvedKey);renderEvolved()});renderEvolvedDetail()}
function renderEvolvedDetail(){const box=document.getElementById("evolved-detail");if(!box)return;if(!selectedEvolved){box.innerHTML=`<div class="empty">Select an evolved recipe.</div>`;return}const f=selectedEvolved.fields,editable=key=>f[key]!=="";box.innerHTML=`<h3>${esc(selectedEvolved.fullType)}</h3><p><code>${esc(selectedEvolved.path)}</code></p><div class="notice">Current Build 42 evolvedrecipe schema. Existing properties are patched only. Cookable is presence-only and therefore may only remain true when present.</div><form id="evolved-form"><div class="grid">${selectField("Add Ingredient If Cooked","AddIngredientIfCooked",f.AddIngredientIfCooked,["true","false"],!editable("AddIngredientIfCooked"))}${field("Add Ingredient Sound","AddIngredientSound",f.AddIngredientSound,"text",editable("AddIngredientSound")?"":"disabled")}${field("Base Item","BaseItem",f.BaseItem,"text",editable("BaseItem")?"":"disabled")}${selectField("Can Add Spices Empty","CanAddSpicesEmpty",f.CanAddSpicesEmpty,["true","false"],!editable("CanAddSpicesEmpty"))}${selectField("Cookable","Cookable",f.Cookable,["true"],!editable("Cookable"))}${field("Max Items","MaxItems",f.MaxItems,"number",editable("MaxItems")?'min="1" step="1"':'disabled')}${field("Minimum Water","MinimumWater",f.MinimumWater,"number",editable("MinimumWater")?'step="any"':'disabled')}${field("Name Key","Name",f.Name,"text",editable("Name")?"":"disabled")}${field("Result Item","ResultItem",f.ResultItem,"text",editable("ResultItem")?"":"disabled")}${field("Template","Template",f.Template,"text",editable("Template")?"":"disabled")}</div><div class="actions"><button type="submit">Save Evolved Recipe</button><span>${selectedEvolved.duplicateKeys.length?`Ambiguous: ${esc(selectedEvolved.duplicateKeys.join(", "))}`:"Unknown recipe data is preserved"}</span></div></form>`;document.getElementById("evolved-form").onsubmit=saveEvolved}
async function saveEvolved(event){event.preventDefault();const form=new FormData(event.currentTarget),edits={};for(const [key,value] of form.entries())edits[key]=value;try{selectedEvolved=await api("/api/evolvedrecipes/save",{method:"POST",body:JSON.stringify({path:selectedEvolved.path,module:selectedEvolved.module,id:selectedEvolved.id,sha256:selectedEvolved.sha256,edits})});setStatus(`${selectedEvolved.fullType} saved`);await reload()}catch(error){setStatus(error.message,true)}}
function craftButton(row){return `<button data-craft-key="${esc(row.key)}" class="${selectedCraft?.key===row.key?"active":""}"><strong>${esc(row.fullType)}</strong><small>${esc(row.path)}</small></button>`}
function renderCrafts(){if(!selectedCraft&&crafts.rows.length)selectedCraft=crafts.rows[0];main.innerHTML=`<section class="panel"><h2>Build 42 Craft Recipes</h2><div class="split"><div class="list">${crafts.rows.length?crafts.rows.map(craftButton).join(""):`<div class="empty">No craftRecipe blocks found.</div>`}</div><div id="craft-detail" class="detail"></div></div></section>`;main.querySelectorAll("[data-craft-key]").forEach(button=>button.onclick=()=>{selectedCraft=crafts.rows.find(row=>row.key===button.dataset.craftKey);renderCrafts()});renderCraftDetail()}
function renderCraftDetail(){const box=document.getElementById("craft-detail");if(!box)return;if(!selectedCraft){box.innerHTML=`<div class="empty">Select a craft recipe.</div>`;return}const f=selectedCraft.fields,editable=key=>f[key]!=="";box.innerHTML=`<h3>${esc(selectedCraft.fullType)}</h3><p><code>${esc(selectedCraft.path)}</code></p><div class="notice">Build 42 craftRecipe scalar editor. Inputs/outputs, callbacks, SkillRequired and AutoLearn structures remain read-only and are preserved exactly. Inputs: ${selectedCraft.hasInputs?"present":"not detected"}; outputs: ${selectedCraft.hasOutputs?"present":"not detected"}.</div><form id="craft-form"><div class="grid">${selectField("Allow Batch Craft","AllowBatchCraft",f.AllowBatchCraft,["true","false"],!editable("AllowBatchCraft"))}${selectField("Can Walk","CanWalk",f.CanWalk,["true","false"],!editable("CanWalk"))}${field("Category","category",f.category,"text",editable("category")?"":"disabled")}${field("Icon","Icon",f.Icon,"text",editable("Icon")?"":"disabled")}${field("Research Skill Level","ResearchSkillLevel",f.ResearchSkillLevel,"number",editable("ResearchSkillLevel")?'step="1"':'disabled')}${field("Tags","tags",f.tags,"text",editable("tags")?"":"disabled")}${field("Time","time",f.time,"number",editable("time")?'step="1"':'disabled')}${field("Timed Action","timedAction",f.timedAction,"text",editable("timedAction")?"":"disabled")}</div><div class="actions"><button type="submit">Save Craft Recipe</button><span>${selectedCraft.duplicateKeys.length?`Ambiguous: ${esc(selectedCraft.duplicateKeys.join(", "))}`:"Nested crafting grammar is preserved"}</span></div></form>`;document.getElementById("craft-form").onsubmit=saveCraft}
async function saveCraft(event){event.preventDefault();const form=new FormData(event.currentTarget),edits={};for(const [key,value] of form.entries())edits[key]=value;try{selectedCraft=await api("/api/craftrecipes/save",{method:"POST",body:JSON.stringify({path:selectedCraft.path,module:selectedCraft.module,id:selectedCraft.id,sha256:selectedCraft.sha256,edits})});setStatus(`${selectedCraft.fullType} saved`);await reload()}catch(error){setStatus(error.message,true)}}
function fixingButton(row){return `<button data-fixing-key="${esc(row.key)}" class="${selectedFixing?.key===row.key?"active":""}"><strong>${esc(row.fullType)}</strong><small>${esc(row.path)}</small></button>`}
function renderFixings(){if(!selectedFixing&&fixings.rows.length)selectedFixing=fixings.rows[0];main.innerHTML=`<section class="panel"><h2>Build 42 Fixing</h2><div class="split"><div class="list">${fixings.rows.length?fixings.rows.map(fixingButton).join(""):`<div class="empty">No fixing blocks found.</div>`}</div><div id="fixing-detail" class="detail"></div></div></section>`;main.querySelectorAll("[data-fixing-key]").forEach(button=>button.onclick=()=>{selectedFixing=fixings.rows.find(row=>row.key===button.dataset.fixingKey);renderFixings()});renderFixingDetail()}
function renderFixingDetail(){const box=document.getElementById("fixing-detail");if(!box)return;if(!selectedFixing){box.innerHTML=`<div class="empty">Select a fixing record.</div>`;return}const f=selectedFixing.fields,editable=f.ConditionModifier!=="";box.innerHTML=`<h3>${esc(selectedFixing.fullType)}</h3><p><code>${esc(selectedFixing.path)}</code></p><div class="notice">Only the documented floating-point ConditionModifier is editable. Require, duplicate Fixer entries, GlobalItem and all other repair grammar remain read-only and are preserved exactly.</div><form id="fixing-form"><div class="grid">${field("Condition Modifier","ConditionModifier",f.ConditionModifier,"number",editable?'step="any"':'disabled')}</div><div class="actions"><button type="submit">Save Fixing</button><span>${selectedFixing.duplicateKeys.length?`Ambiguous: ${esc(selectedFixing.duplicateKeys.join(", "))}`:"Repair grammar is preserved"}</span></div></form>`;document.getElementById("fixing-form").onsubmit=saveFixing}
async function saveFixing(event){event.preventDefault();const form=new FormData(event.currentTarget),edits={};for(const [key,value] of form.entries())edits[key]=value;try{selectedFixing=await api("/api/fixings/save",{method:"POST",body:JSON.stringify({path:selectedFixing.path,module:selectedFixing.module,id:selectedFixing.id,sha256:selectedFixing.sha256,edits})});setStatus(`${selectedFixing.fullType} saved`);await reload()}catch(error){setStatus(error.message,true)}}
function fluidButton(row){return `<button data-fluid-key="${esc(row.key)}" class="${selectedFluid?.key===row.key?"active":""}"><strong>${esc(row.fullType)}</strong><small>${esc(row.path)}</small></button>`}
function renderFluids(){if(!selectedFluid&&fluids.rows.length)selectedFluid=fluids.rows[0];main.innerHTML=`<section class="panel"><h2>Build 42 Fluids</h2><div class="split"><div class="list">${fluids.rows.length?fluids.rows.map(fluidButton).join(""):`<div class="empty">No fluid blocks found.</div>`}</div><div id="fluid-detail" class="detail"></div></div></section>`;main.querySelectorAll("[data-fluid-key]").forEach(button=>button.onclick=()=>{selectedFluid=fluids.rows.find(row=>row.key===button.dataset.fluidKey);renderFluids()});renderFluidDetail()}
function renderFluidDetail(){const box=document.getElementById("fluid-detail");if(!box)return;if(!selectedFluid){box.innerHTML=`<div class="empty">Select a fluid.</div>`;return}const f=selectedFluid.fields,editable=key=>f[key]!=="";box.innerHTML=`<h3>${esc(selectedFluid.fullType)}</h3><p><code>${esc(selectedFluid.path)}</code></p><div class="notice">Only the current Build 42 top-level scalar fields are editable. Properties, Categories, BlendWhiteList, BlendBlackList and Poison child blocks remain read-only and are preserved exactly.</div><form id="fluid-form"><div class="grid">${field("Color Reference","ColorReference",f.ColorReference,"text",editable("ColorReference")?"":"disabled")}${field("Display Name Key","DisplayName",f.DisplayName,"text",editable("DisplayName")?"":"disabled")}</div><div class="actions"><button type="submit">Save Fluid</button><span>${selectedFluid.duplicateKeys.length?`Ambiguous: ${esc(selectedFluid.duplicateKeys.join(", "))}`:"Nested fluid data is preserved"}</span></div></form>`;document.getElementById("fluid-form").onsubmit=saveFluid}
async function saveFluid(event){event.preventDefault();const form=new FormData(event.currentTarget),edits={};for(const [key,value] of form.entries())edits[key]=value;try{selectedFluid=await api("/api/fluids/save",{method:"POST",body:JSON.stringify({path:selectedFluid.path,module:selectedFluid.module,id:selectedFluid.id,sha256:selectedFluid.sha256,edits})});setStatus(`${selectedFluid.fullType} saved`);await reload()}catch(error){setStatus(error.message,true)}}
function vehicleButton(row){return `<button data-vehicle-key="${esc(row.key)}" class="${selectedVehicle?.key===row.key?"active":""}"><strong>${esc(row.fullType)}</strong><small>${esc(row.path)}</small></button>`}
function renderVehicles(){if(!selectedVehicle&&vehicles.rows.length)selectedVehicle=vehicles.rows[0];main.innerHTML=`<section class="panel"><h2>Build 42 Vehicles</h2><div class="split"><div class="list">${vehicles.rows.length?vehicles.rows.map(vehicleButton).join(""):`<div class="empty">No vehicle blocks found.</div>`}</div><div id="vehicle-detail" class="detail"></div></div></section>`;main.querySelectorAll("[data-vehicle-key]").forEach(button=>button.onclick=()=>{selectedVehicle=vehicles.rows.find(row=>row.key===button.dataset.vehicleKey);renderVehicles()});renderVehicleDetail()}
function renderVehicleDetail(){const box=document.getElementById("vehicle-detail");if(!box)return;if(!selectedVehicle){box.innerHTML=`<div class="empty">Select a vehicle.</div>`;return}const f=selectedVehicle.fields,editable=key=>f[key]!=="";box.innerHTML=`<h3>${esc(selectedVehicle.fullType)}</h3><p><code>${esc(selectedVehicle.path)}</code></p><div class="notice">Only a conservative current-schema top-level scalar subset is editable. Parts, areas, passengers, wheels, models, physics geometry, arrays and unknown vehicle data remain read-only and are preserved exactly.</div><form id="vehicle-form"><div class="grid">${field("Animal Trailer Size","animalTrailerSize",f.animalTrailerSize,"number",editable("animalTrailerSize")?'min="0" step="any"':'disabled')}${field("Car Mechanics Overlay","carMechanicsOverlay",f.carMechanicsOverlay,"text",editable("carMechanicsOverlay")?"":"disabled")}${field("Car Model Name","carModelName",f.carModelName,"text",editable("carModelName")?"":"disabled")}${field("Engine Force","engineForce",f.engineForce,"number",editable("engineForce")?'min="0" step="any"':'disabled')}${field("Engine Idle Speed","engineIdleSpeed",f.engineIdleSpeed,"number",editable("engineIdleSpeed")?'min="0" step="any"':'disabled')}${field("Engine Loudness","engineLoudness",f.engineLoudness,"number",editable("engineLoudness")?'min="0" step="1"':'disabled')}${field("Engine Quality","engineQuality",f.engineQuality,"number",editable("engineQuality")?'min="0" step="1"':'disabled')}${field("Engine Repair Level","engineRepairLevel",f.engineRepairLevel,"number",editable("engineRepairLevel")?'min="0" step="1"':'disabled')}${field("Engine RPM Type","engineRPMType",f.engineRPMType,"text",editable("engineRPMType")?"":"disabled")}${field("Gear Ratio Count","gearRatioCount",f.gearRatioCount,"number",editable("gearRatioCount")?'min="1" max="9" step="1"':'disabled')}${selectField("Has Lighter","hasLighter",f.hasLighter,["true","false"],!editable("hasLighter"))}${selectField("Small Vehicle","isSmallVehicle",f.isSmallVehicle,["true","false"],!editable("isSmallVehicle"))}</div><div class="actions"><button type="submit">Save Vehicle</button><span>${selectedVehicle.duplicateKeys.length?`Ambiguous: ${esc(selectedVehicle.duplicateKeys.join(", "))}`:"Nested vehicle data is preserved"}</span></div></form>`;document.getElementById("vehicle-form").onsubmit=saveVehicle}
async function saveVehicle(event){event.preventDefault();const form=new FormData(event.currentTarget),edits={};for(const [key,value] of form.entries())edits[key]=value;try{selectedVehicle=await api("/api/vehicles/save",{method:"POST",body:JSON.stringify({path:selectedVehicle.path,module:selectedVehicle.module,id:selectedVehicle.id,sha256:selectedVehicle.sha256,edits})});setStatus(`${selectedVehicle.fullType} saved`);await reload()}catch(error){setStatus(error.message,true)}}
function soundButton(row){return `<button data-sound-key="${esc(row.key)}" class="${selectedSound?.key===row.key?"active":""}"><strong>${esc(row.fullType)}</strong><small>${esc(row.path)}</small></button>`}
function renderSounds(){if(!selectedSound&&sounds.rows.length)selectedSound=sounds.rows[0];main.innerHTML=`<section class="panel"><h2>Build 42 Sounds</h2><div class="split"><div class="list">${sounds.rows.length?sounds.rows.map(soundButton).join(""):`<div class="empty">No module-level sound blocks found.</div>`}</div><div id="sound-detail" class="detail"></div></div></section>`;main.querySelectorAll("[data-sound-key]").forEach(button=>button.onclick=()=>{selectedSound=sounds.rows.find(row=>row.key===button.dataset.soundKey);renderSounds()});renderSoundDetail()}
function renderSoundDetail(){const box=document.getElementById("sound-detail");if(!box)return;if(!selectedSound){box.innerHTML=`<div class="empty">Select a sound.</div>`;return}const f=selectedSound.fields,editable=key=>f[key]!=="";box.innerHTML=`<h3>${esc(selectedSound.fullType)}</h3><p><code>${esc(selectedSound.path)}</code></p><div class="notice">Only documented typed top-level sound properties are editable. Audio clip child blocks—including file, distance, reverb and volume data—remain read-only and are preserved exactly. Clips: ${selectedSound.hasClips?"present":"not detected"}.</div><form id="sound-form"><div class="grid">${field("Category","category",f.category,"text",editable("category")?"":"disabled")}${selectField("3D Sound","is3D",f.is3D,["true","false"],!editable("is3D"))}${selectField("Loop","loop",f.loop,["true","false"],!editable("loop"))}${selectField("Master","master",f.master,selectedSound.masterOptions||["Primary","Ambient","Music","VehicleEngine"],!editable("master"))}${field("Max Instances Per Emitter","maxInstancesPerEmitter",f.maxInstancesPerEmitter,"number",editable("maxInstancesPerEmitter")?'step="1"':'disabled')}</div><div class="actions"><button type="submit">Save Sound</button><span>${selectedSound.duplicateKeys.length?`Ambiguous: ${esc(selectedSound.duplicateKeys.join(", "))}`:"Nested clip data is preserved"}</span></div></form>`;document.getElementById("sound-form").onsubmit=saveSound}
async function saveSound(event){event.preventDefault();const form=new FormData(event.currentTarget),edits={};for(const [key,value] of form.entries())edits[key]=value;try{selectedSound=await api("/api/sounds/save",{method:"POST",body:JSON.stringify({path:selectedSound.path,module:selectedSound.module,id:selectedSound.id,sha256:selectedSound.sha256,edits})});setStatus(`${selectedSound.fullType} saved`);await reload()}catch(error){setStatus(error.message,true)}}
function modelButton(row){return `<button data-model-key="${esc(row.key)}" class="${selectedModel?.key===row.key?"active":""}"><strong>${esc(row.fullType)}</strong><small>${esc(row.path)}</small></button>`}
function renderModels(){if(!selectedModel&&models.rows.length)selectedModel=models.rows[0];main.innerHTML=`<section class="panel"><h2>Build 42 Models</h2><div class="split"><div class="list">${models.rows.length?models.rows.map(modelButton).join(""):`<div class="empty">No module-level model blocks found.</div>`}</div><div id="model-detail" class="detail"></div></div></section>`;main.querySelectorAll("[data-model-key]").forEach(button=>button.onclick=()=>{selectedModel=models.rows.find(row=>row.key===button.dataset.modelKey);renderModels()});renderModelDetail()}
function renderModelDetail(){const box=document.getElementById("model-detail");if(!box)return;if(!selectedModel){box.innerHTML=`<div class="empty">Select a model.</div>`;return}const f=selectedModel.fields,editable=key=>f[key]!=="";box.innerHTML=`<h3>${esc(selectedModel.fullType)}</h3><p><code>${esc(selectedModel.path)}</code></p><div class="notice">Only explicitly typed module-level model scalars are editable. Mesh/texture paths, block references, color/transform data, bone weights and nested attachments remain read-only and are preserved exactly. Attachments: ${selectedModel.hasAttachments?"present":"not detected"}.</div><form id="model-form"><div class="grid">${selectField("Cull Face","cullFace",f.cullFace,selectedModel.cullFaceOptions||["Back","Front","None"],!editable("cullFace"))}${selectField("Invert X","invertX",f.invertX,["true","false"],!editable("invertX"))}${field("Post Process","postProcess",f.postProcess,"text",editable("postProcess")?"":"disabled")}${field("Scale","scale",f.scale,"number",editable("scale")?'step="any"':'disabled')}${field("Shader","shader",f.shader,"text",editable("shader")?"":"disabled")}${selectField("Static","static",f.static,["true","false"],!editable("static"))}${selectField("Undo Core Scale","undoCoreScale",f.undoCoreScale,["true","false"],!editable("undoCoreScale"))}</div><div class="actions"><button type="submit">Save Model</button><span>${selectedModel.duplicateKeys.length?`Ambiguous: ${esc(selectedModel.duplicateKeys.join(", "))}`:"Nested model data is preserved"}</span></div></form>`;document.getElementById("model-form").onsubmit=saveModel}
async function saveModel(event){event.preventDefault();const form=new FormData(event.currentTarget),edits={};for(const [key,value] of form.entries())edits[key]=value;try{selectedModel=await api("/api/models/save",{method:"POST",body:JSON.stringify({path:selectedModel.path,module:selectedModel.module,id:selectedModel.id,sha256:selectedModel.sha256,edits})});setStatus(`${selectedModel.fullType} saved`);await reload()}catch(error){setStatus(error.message,true)}}
function mannequinButton(row){return `<button data-mannequin-key="${esc(row.key)}" class="${selectedMannequin?.key===row.key?"active":""}"><strong>${esc(row.fullType)}</strong><small>${esc(row.path)}</small></button>`}
function renderMannequins(){if(!selectedMannequin&&mannequins.rows.length)selectedMannequin=mannequins.rows[0];main.innerHTML=`<section class="panel"><h2>Build 42 Mannequins</h2><div class="split"><div class="list">${mannequins.rows.length?mannequins.rows.map(mannequinButton).join(""):`<div class="empty">No module-level mannequin blocks found.</div>`}</div><div id="mannequin-detail" class="detail"></div></div></section>`;main.querySelectorAll("[data-mannequin-key]").forEach(button=>button.onclick=()=>{selectedMannequin=mannequins.rows.find(row=>row.key===button.dataset.mannequinKey);renderMannequins()});renderMannequinDetail()}
function renderMannequinDetail(){const box=document.getElementById("mannequin-detail");if(!box)return;if(!selectedMannequin){box.innerHTML=`<div class="empty">Select a mannequin.</div>`;return}const f=selectedMannequin.fields,editable=key=>f[key]!=="";box.innerHTML=`<h3>${esc(selectedMannequin.fullType)}</h3><p><code>${esc(selectedMannequin.path)}</code></p><div class="notice">The current Build 42 mannequin scalar fields are editable, except the referenced model block. Unknown data is preserved. Model reference: <code>${esc(selectedMannequin.modelReference||"not present")}</code>.</div><form id="mannequin-form"><div class="grid">${field("Animation Set","animSet",f.animSet,"text",editable("animSet")?"":"disabled")}${field("Animation State","animState",f.animState,"text",editable("animState")?"":"disabled")}${selectField("Female","female",f.female,["true","false"],!editable("female"))}${field("Outfit","outfit",f.outfit,"text",editable("outfit")?"":"disabled")}${field("Pose","pose",f.pose,"text",editable("pose")?"":"disabled")}${field("Texture","texture",f.texture,"text",editable("texture")?"":"disabled")}</div><div class="actions"><button type="submit">Save Mannequin</button><span>${selectedMannequin.duplicateKeys.length?`Ambiguous: ${esc(selectedMannequin.duplicateKeys.join(", "))}`:"Model reference and unknown data are preserved"}</span></div></form>`;document.getElementById("mannequin-form").onsubmit=saveMannequin}
async function saveMannequin(event){event.preventDefault();const form=new FormData(event.currentTarget),edits={};for(const [key,value] of form.entries())edits[key]=value;try{selectedMannequin=await api("/api/mannequins/save",{method:"POST",body:JSON.stringify({path:selectedMannequin.path,module:selectedMannequin.module,id:selectedMannequin.id,sha256:selectedMannequin.sha256,edits})});setStatus(`${selectedMannequin.fullType} saved`);await reload()}catch(error){setStatus(error.message,true)}}
function timedActionButton(row){return `<button data-timed-action-key="${esc(row.key)}" class="${selectedTimedAction?.key===row.key?"active":""}"><strong>${esc(row.fullType)}</strong><small>${esc(row.path)}</small></button>`}
function renderTimedActions(){if(!selectedTimedAction&&timedActions.rows.length)selectedTimedAction=timedActions.rows[0];main.innerHTML=`<section class="panel"><h2>Build 42 Timed Actions</h2><div class="split"><div class="list">${timedActions.rows.length?timedActions.rows.map(timedActionButton).join(""):`<div class="empty">No module-level timedAction blocks found.</div>`}</div><div id="timed-action-detail" class="detail"></div></div></section>`;main.querySelectorAll("[data-timed-action-key]").forEach(button=>button.onclick=()=>{selectedTimedAction=timedActions.rows.find(row=>row.key===button.dataset.timedActionKey);renderTimedActions()});renderTimedActionDetail()}
function renderTimedActionDetail(){const box=document.getElementById("timed-action-detail");if(!box)return;if(!selectedTimedAction){box.innerHTML=`<div class="empty">Select a timed action.</div>`;return}const f=selectedTimedAction.fields,editable=f.actionAnim!=="";box.innerHTML=`<h3>${esc(selectedTimedAction.fullType)}</h3><p><code>${esc(selectedTimedAction.path)}</code></p><div class="notice">Only the independently typed actionAnim string is editable. Sound/model references, animation variables, muscle-strain data and other timed-action grammar remain read-only and are preserved exactly.</div><form id="timed-action-form"><div class="grid">${field("Action Animation","actionAnim",f.actionAnim,"text",editable?"":"disabled")}</div><div class="actions"><button type="submit">Save Timed Action</button><span>${selectedTimedAction.duplicateKeys.length?`Ambiguous: ${esc(selectedTimedAction.duplicateKeys.join(", "))}`:"Unmodeled timed-action data is preserved"}</span></div></form>`;document.getElementById("timed-action-form").onsubmit=saveTimedAction}
async function saveTimedAction(event){event.preventDefault();const form=new FormData(event.currentTarget),edits={};for(const [key,value] of form.entries())edits[key]=value;try{selectedTimedAction=await api("/api/timedactions/save",{method:"POST",body:JSON.stringify({path:selectedTimedAction.path,module:selectedTimedAction.module,id:selectedTimedAction.id,sha256:selectedTimedAction.sha256,edits})});setStatus(`${selectedTimedAction.fullType} saved`);await reload()}catch(error){setStatus(error.message,true)}}
function renderScripts(){const countRows=Object.entries(scripts.counts||{}).filter(([,count])=>count).map(([kind,count])=>`<span class="pill">${esc(kind)}: ${esc(count)}</span>`).join(" ");main.innerHTML=`<section class="panel"><h2>Build 42 Script Inventory</h2><div class="content"><div class="notice">Current Build 42 ZedScript families are inventoried without inventing semantics. Items, evolved recipes, conservative craftRecipe scalars, fixing ConditionModifier, fluid scalars, vehicle scalars, sound scalars, model scalars, mannequin scalars and timedAction actionAnim are structured; only insufficiently typed families remain read-only.</div><div style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px">${countRows||'<span class="pill">No recognized records</span>'}</div>${scripts.errors.length?`<div class="notice danger">${esc(scripts.errors.map(error=>`${error.path}: ${error.error}`).join(" · "))}</div>`:""}</div><div class="content" style="padding-top:0"><table><thead><tr><th>Kind</th><th>Record</th><th>Module</th><th>File</th><th>Integration</th></tr></thead><tbody>${scripts.rows.map(row=>`<tr><td><span class="pill">${esc(row.kind)}</span></td><td><code>${esc(row.name)}</code></td><td>${esc(row.module)}</td><td><code>${esc(row.path)}</code></td><td>${row.editable?"Structured editor":"Recognized · read-only"}</td></tr>`).join("")||`<tr><td colspan="5" class="empty">No recognized top-level script records.</td></tr>`}</tbody></table></div></section>`}
function renderDatamap(){main.innerHTML=`<section class="panel"><h2>Data Map</h2><div class="content" style="padding:0"><table><thead><tr><th>Resource</th><th>Status</th><th>Editor</th><th>Notes</th></tr></thead><tbody>${datamap.rows.map(row=>`<tr><td><code>${esc(row.filename)}</code></td><td><span class="pill">${esc(row.status)}</span></td><td>${esc(row.editor)}</td><td>${esc(row.notes)}</td></tr>`).join("")}</tbody></table></div></section>`}
function renderDeployment(){const target=deployment.target||"<Zomboid user folder>/mods/<project>";main.innerHTML=`<section class="panel"><h2>Local Test Deployment</h2><div class="content"><div id="mod-loader-slot"></div><div class="notice">The installed Steam game tree is read-only. Deploy copies this project into the native local-mod folder. Lexeditor removes or replaces only a deployment whose recorded file hashes still match.</div><div class="grid">${field("Target","deploy-target",target,"text","readonly")}${field("Files","deploy-count",deployment.fileCount,"text","readonly")}<div class="field"><label>State</label><input readonly value="${deployment.deployed?(deployment.owned?"Deployed · owned":"Deployed · external change detected"):"Not deployed"}"></div></div><div class="actions"><button id="deploy">${deployment.deployed?"Redeploy":"Deploy Local Mod"}</button><button id="undeploy" class="secondary" ${deployment.owned?"":"disabled"}>Remove Owned Deployment</button></div></div></section>`;document.getElementById("mod-loader-slot").replaceWith(LexeditorUI.modLoaderSection({loader:"Project Zomboid native Build 42 mod system.",output:"A full local development mod copy under <user>/Zomboid/mods/<project>.",order:"Project Zomboid owns activation and ordering; mod.info can declare require/incompatible/loadModBefore/loadModAfter relationships.",safety:"The installed Steam game tree is never modified; only the owned local deployment is replaced or removed.",removal:"Remove the owned local deployment; the authoring project is preserved."}));document.getElementById("deploy").onclick=()=>changeDeployment("/api/deploy");document.getElementById("undeploy").onclick=()=>changeDeployment("/api/undeploy")}
async function changeDeployment(path){try{deployment=await api(path,{method:"POST",body:"{}"});setStatus(path.endsWith("undeploy")?"Owned deployment removed":"Local mod deployed");await reload()}catch(error){setStatus(error.message,true)}}
function render(){document.querySelectorAll("[data-tab]").forEach(button=>button.classList.toggle("active",button.dataset.tab===tab));if(tab==="metadata")renderMetadata();else if(tab==="items")renderItems();else if(tab==="evolved")renderEvolved();else if(tab==="crafts")renderCrafts();else if(tab==="fixing")renderFixings();else if(tab==="fluids")renderFluids();else if(tab==="vehicles")renderVehicles();else if(tab==="sounds")renderSounds();else if(tab==="models")renderModels();else if(tab==="mannequins")renderMannequins();else if(tab==="timedactions")renderTimedActions();else if(tab==="scripts")renderScripts();else if(tab==="datamap")renderDatamap();else renderDeployment()}
document.querySelectorAll("[data-tab]").forEach(button=>button.onclick=()=>{tab=button.dataset.tab;render()});
reload();
</script>
</body>
