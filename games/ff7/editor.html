<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Lexeditor - Final Fantasy 7 (Original)</title>
  <script>(()=>{const p=new URLSearchParams(location.search),k=p.get("lexTransition");if(!["load","resume"].includes(k))return;const r=document.documentElement;r.classList.add("lex-transition-entry");if(k==="load"){r.dataset.lexQuote=p.get("lexQuote")||"Loading editor…";r.classList.add("lex-transition-loading")}})()</script>
  <link rel="stylesheet" href="/shared/framework.css">
  <style>
    :root{--lex-radius:5px}
    *{box-sizing:border-box}body{display:flex;flex-direction:column;height:100vh;margin:0;overflow:hidden;color:var(--lex-text);background:var(--lex-bg);font:15px/1.35 var(--lex-font)}
    main{flex:1;min-height:0;padding:var(--lex-panel-gap);overflow:hidden}
    .ff7-layout,.lex-paged-list-detail{height:100%}.ff7-table,.ff7-detail{height:100%;min-height:0}
    .ff7-detail .lex-detail-panel-heading,.ff7-table,.ff7-table .lex-column-list-header,.ff7-message{background:var(--lex-panel);box-shadow:none}
    .ff7-detail .lex-detail-panel-body{padding:10px;gap:9px}.ff7-detail .lex-detail-section{flex:1 1 auto}
    .ff7-field input[type=number]{width:100%;min-width:0}.ff7-description{white-space:pre-wrap}
    .ff7-message{height:100%;overflow:auto;padding:24px;border:2px solid var(--lex-border)}
    .ff7-message h2{margin:0 0 14px;font:30px/1.15 var(--lex-heading-font)}.ff7-message p{max-width:850px}
    .ff7-status{display:inline-block;padding:5px 9px;border:1px solid var(--lex-border);font-weight:700}
    .ff7-info-grid{display:grid;grid-template-columns:max-content minmax(0,1fr);gap:8px 16px}.ff7-info-grid code{overflow-wrap:anywhere}
    .ff7-map,.ff7-tweaks{display:flex;flex-direction:column;height:100%;min-height:0}.ff7-map-controls{display:flex;gap:8px;padding:0 0 var(--lex-panel-gap)}.ff7-map .lex-data-map-view{flex:1;min-height:0}
    .ff7-config-body{flex:1;min-height:0;overflow:auto}.ff7-config-error{padding:8px;border:1px solid var(--lex-border)}
  </style>
</head>
<body>
  <header id="lexeditor-shell"></header>
  <main id="main"></main>
  <script src="/shared/framework.js"></script>
  <script>
  "use strict";
  const {el,columnList,columnPreferences,detailPanel,detailSection,detailField,recordId,infoHelp,pagedListDetail,provenanceControl,platformConfigView,clone,EditHistory}=LexeditorUI;
  const identity=window.__lexeditorPlugin||{id:"ff7",name:"Final Fantasy 7 (Original)",edition:"Steam"};
  const integrated=["accessories","armor","characters","items","materia","weapons"];
  const unresolved=["enemies","encounters","shops","tweaks"];
  const labels={accessories:"Accessories",armor:"Armor",characters:"Characters",items:"Items",materia:"Materia",weapons:"Weapons",enemies:"Enemies",encounters:"Encounters",shops:"Shops",tweaks:"Tweaks"};
  const tabs=[...integrated,...unresolved].map(id=>({id,label:labels[id]}));
  const api=async(path,options={})=>{const response=await fetch(path,options),body=await response.json();if(!response.ok)throw new Error(body.error||response.statusText);return body};
  const state={loaded:false,tab:"items",dashboard:null,dataMap:null,data:null,records:{},saved:{},invalid:{},platformConfig:null,savedPlatformConfig:null,platformQuery:"",platformError:"",platformRevision:0,platformLoading:false,activeSource:"mine",selected:{},page:{},pageSize:{},query:{},sort:{},mapQuery:"",mapStatus:"",mapPage:0,mapSort:["filename",1],saving:false};
  const main=document.querySelector("#main");
  const category=()=>state.data.categories.find(value=>value.id===state.tab);
  const rowById=(group,id,source=state.records)=>(source?.[group]||[]).find(row=>row.id===id);
  const platformFields=config=>Object.fromEntries((config?.sections||[]).flatMap(section=>section.fields).map(field=>[field.id,field.value]));
  const platformChanges=()=>{const current=platformFields(state.platformConfig),saved=platformFields(state.savedPlatformConfig),changes={};for(const [id,value] of Object.entries(current))if(JSON.stringify(value)!==JSON.stringify(saved[id]))changes[id]=value;return changes};
  const kernelDirty=()=>JSON.stringify(state.records)!==JSON.stringify(state.saved);
  const dirtyCount=()=>state.activeSource!=="mine"?0:Number(kernelDirty()||Object.keys(state.invalid).length>0)+Object.keys(platformChanges()).length;
  const readonly=()=>state.saving||state.activeSource!=="mine";
  const shellRefresh=()=>shell?.refresh?.();

  function numberControl(row,field){
    const key=`${state.tab}/${row.id}/${field.key}`;
    const input=el("input",{type:"number",min:field.minimum,max:field.maximum,step:field.step,
      value:state.invalid[key]??row.values[field.key],disabled:readonly(),
      "aria-label":`${field.label} for ${row.name}`,oninput:event=>{
        if(readonly())return;
        const raw=event.target.value,value=Number(raw);
        if(raw===""||!Number.isInteger(value)||!event.target.checkValidity())state.invalid[key]=raw;
        else{delete state.invalid[key];row.values[field.key]=value}
        shellRefresh();
      }});
    const vanilla=rowById(state.tab,row.id,state.data.vanilla).values[field.key];
    return provenanceControl({control:input,current:()=>row.values[field.key],vanilla,internal:true,
      apply:value=>{if(readonly())return;delete state.invalid[key];row.values[field.key]=Number(value);input.value=String(value);shellRefresh()}});
  }
  function recordDetail(row){
    const metadata=category(),groups=[...new Set(metadata.fields.map(field=>field.group||"Kernel data"))];
    return detailPanel({className:"ff7-detail",title:row.name,identity:recordId(row.id),meta:identity.edition,body:[
      detailSection({title:"DESCRIPTION",body:detailField({label:"HELP TEXT",control:el("div",{class:"ff7-description"},row.description||"No description stored.")})}),
      ...groups.map(group=>detailSection({title:group.toUpperCase(),body:metadata.fields.filter(field=>(field.group||"Kernel data")===group).map(field=>detailField({className:"ff7-field",label:field.label,help:infoHelp(`Stored as a bounded ${field.dataType}. Storage range: ${field.minimum} to ${field.maximum}${field.step>1?`; step ${field.step}`:""}.`),control:numberControl(row,field),dataType:"INT",min:field.minimum,max:field.maximum}))})),
    ]});
  }
  function listTable(rows,selected,select){
    const columns=[{key:"id",label:"ID",numberedId:true,sortable:true},{key:"name",label:"Name",sortable:true},{key:"description",label:"Description",sortable:true}];
    const prefs=columnPreferences(`ff7-${state.tab}`,columns,()=>render());
    const sort=state.sort[state.tab]||{key:"name",dir:1};
    return columnList({rows,key:row=>row.id,selected,select,sortState:sort,sort:key=>{state.sort[state.tab]=sort.key===key?{key,dir:-sort.dir}:{key,dir:1};render()},columnPreferences:prefs,columns,class:"ff7-table","aria-label":`${labels[state.tab]} records`});
  }
  function unavailableView(){
    const error=state.data.errors?.[state.tab];
    return el("section",{class:"ff7-message"},el("h2",{},labels[state.tab]),
      el("p",{},error||"No readable records are available for this dataset."),
      el("p",{},`Source: ${state.data.sourceRelativePath||"English KERNEL.BIN in the selected installation"}`),
      el("p",{},"Repair the reported source or project data, then reopen the editor. Other readable tabs and Tweaks remain available. No replacement records are generated."),
      el("span",{class:"ff7-status"},"DATA UNAVAILABLE"),
      el("p",{},el("button",{type:"button",onclick:()=>navigate("datamap")},"Open Data Map")));
  }
  function integratedView(){
    const group=state.tab,query=state.query[group]||"",sort=state.sort[group]||{key:"name",dir:1};
    if(!state.records[group]?.length)return unavailableView();
    const rows=[...state.records[group]].filter(row=>!query||`${row.id} ${row.name} ${row.description}`.toLocaleLowerCase().includes(query.toLocaleLowerCase())).sort((a,b)=>{const left=a[sort.key],right=b[sort.key];return(typeof left==="string"?left.localeCompare(right):Number(left)-Number(right))*sort.dir});
    if(!rows.some(row=>row.id===state.selected[group]))state.selected[group]=rows[0]?.id??null;
    return pagedListDetail({rows,key:row=>row.id,slots:true,selected:state.selected[group],page:state.page[group]||0,pageSize:state.pageSize[group]||16,noun:labels[group],className:"ff7-layout",splitKey:`ff7-${group}`,rowsKey:`ff7-${group}`,defaultSplit:42,minLeft:340,minRight:440,search:{key:`ff7-${group}`,value:query,label:`Search ${labels[group]}`,change:value=>{state.query[group]=value;state.page[group]=0;render()}},sync:next=>{state.page[group]=next.page;state.pageSize[group]=next.pageSize;if(next.selected!==null)state.selected[group]=next.selected},change:next=>{state.page[group]=next.page;state.pageSize[group]=next.pageSize;if(next.selected!==null)state.selected[group]=next.selected;render()},master:view=>listTable(view.rows,view.selected,view.select),detail:row=>recordDetail(row)});
  }
  function unresolvedView(){
    const area=state.data.unresolved?.[state.tab];
    return el("section",{class:"ff7-message"},el("h2",{},labels[state.tab]),
      el("p",{},area?.source||"Dataset source information could not be loaded."),
      el("p",{},area?.reason||"This tab has no connected editor. See Info for loading errors."),
      el("h3",{},"What is still needed"),el("p",{},area?.unlock||"Reload the dataset availability report."),
      el("span",{class:"ff7-status"},"NOT INTEGRATED"),
      el("p",{},el("button",{type:"button",onclick:()=>navigate("datamap")},"Open Data Map")));
  }
  function syncConfigMap(config){
    const row=state.dataMap?.rows.find(item=>item.category==="tweaks");
    if(row)Object.assign(row,{status:config.available?"integrated":"partial",openable:config.available,sourcePath:config.path,notes:config.message});
  }
  async function refreshPlatformConfig(force=false){
    if(state.platformLoading||state.saving||state.activeSource!=="mine")return;
    if(Object.keys(platformChanges()).length){
      if(!force||!window.confirm("Discard unsaved FFNx settings and reload the installed file?"))return;
    }
    const revision=state.platformRevision;
    state.platformLoading=true;
    try{
      const config=await api("/api/platform-config");
      if(revision!==state.platformRevision||state.saving)return;
      state.platformConfig=config;state.savedPlatformConfig=clone(config);state.platformError="";syncConfigMap(config);
      if(state.tab==="tweaks")render();
    }catch(error){state.platformError=error.message;if(state.tab==="tweaks")render()}
    finally{state.platformLoading=false;shellRefresh()}
  }
  function tweakView(){
    const controls=el("div",{class:"ff7-map-controls"},el("button",{type:"button",disabled:readonly(),onclick:()=>refreshPlatformConfig(true)},"Reload settings"));
    const view=platformConfigView({config:state.platformConfig,query:state.platformQuery,disabled:readonly(),search:value=>{state.platformQuery=value},change:(id,value)=>{
      if(readonly())return;
      const field=(state.platformConfig?.sections||[]).flatMap(section=>section.fields).find(candidate=>candidate.id===id);
      if(field){field.value=value;state.platformRevision++;shellRefresh()}
    }});
    return el("section",{class:"ff7-tweaks"},controls,
      state.platformError?el("div",{class:"ff7-config-error",role:"alert"},state.platformError):null,
      el("div",{class:"ff7-config-body"},view));
  }
  function infoView(){
    const baseline=state.dashboard.baseline,sounds=LexeditorUI.sharedSettings()?.developerMode?LexeditorUI.soundCoverageTable(state.dashboard.themeSounds?.rows||[]):null;
    return el("section",{class:"ff7-message"},el("h2",{},identity.name),el("div",{class:"ff7-info-grid"},el("b",{},"Edition"),el("span",{},identity.edition),el("b",{},"Game root"),el("code",{},state.dashboard.game.root||"Unavailable"),el("b",{},"Source"),el("code",{},baseline.source||"Unavailable"),el("b",{},"Project output"),el("code",{},baseline.projectPath||"Unavailable"),el("b",{},"Vanilla SHA-256"),el("code",{},baseline.sha256||"Unavailable")),el("p",{},baseline.message),...(state.dashboard.problems||[]).map(problem=>el("p",{},problem)),sounds);
  }
  function mapView(){const view=LexeditorUI.dataMap({rows:state.dataMap.rows,query:state.mapQuery,status:state.mapStatus,page:state.mapPage,sort:state.mapSort,pageSize:100,changeQuery:value=>{state.mapQuery=value;state.mapPage=0;render()},changeStatus:value=>{state.mapStatus=value;state.mapPage=0;render()},changePage:value=>{state.mapPage=value;render()},changeSort:key=>{const[active,direction]=state.mapSort;state.mapSort=[key,active===key?-direction:1];render()}});state.mapPage=view.page;return el("section",{class:"ff7-map"},el("div",{class:"ff7-map-controls"},...view.controls),view.content)}
  function render(){if(!state.loaded)return;let content;if(state.tab==="info")content=infoView();else if(state.tab==="datamap")content=mapView();else if(state.tab==="tweaks")content=tweakView();else if(integrated.includes(state.tab))content=integratedView();else content=unresolvedView();main.replaceChildren(content);shellRefresh()}
  function navigate(tab){state.tab=tab;render();if(tab==="tweaks")void refreshPlatformConfig()}
  async function save(){
    if(readonly())return;
    if(Object.keys(state.invalid).length)throw new Error("Correct the empty or out-of-range numeric fields before saving.");
    state.saving=true;state.platformRevision++;render();
    try{
      if(kernelDirty()){
        const result=await api("/api/save",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({records:state.records,sourceSha256:state.data.sourceSha256,activeSha256:state.data.activeSha256})});
        state.saved=clone(state.records);state.data.activeSha256=result.sha256;state.data.usingProject=true;state.dashboard.baseline.projectPath=result.path;
      }
      const changes=platformChanges();
      if(Object.keys(changes).length){state.platformConfig=await api("/api/platform-config/save",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({sha256:state.savedPlatformConfig.sha256,changes})});state.savedPlatformConfig=clone(state.platformConfig);state.platformError="";syncConfigMap(state.platformConfig)}
      editHistory.clear();
    }finally{state.saving=false;render()}
  }
  async function discard(){state.records=clone(state.saved);state.invalid={};state.platformConfig=clone(state.savedPlatformConfig);state.platformRevision++;editHistory.clear();render()}
  async function switchProjectSource(value){state.activeSource=String(value||"mine")==="vanilla"?"vanilla":"mine";state.records=clone(state.activeSource==="vanilla"?state.data.vanilla:state.saved);state.invalid={};state.platformRevision++;editHistory.clear();render()}
  const editHistory=new EditHistory({capture:()=>state.records,restore:snapshot=>{state.records=clone(snapshot);state.invalid={}},render:async()=>render(),enabled:()=>state.loaded&&!readonly(),changed:shellRefresh});
  const shell=LexeditorUI.mountShell({host:"#lexeditor-shell",brand:"LEXEDITOR",plugin:{id:identity.id,name:identity.name,themeName:identity.id,theme:{}},tabs,activeTab:()=>state.tab,navigate,help:()=>navigate("datamap"),helpActive:()=>state.tab==="datamap",helpTitle:"Open the FF7 Data Map",info:()=>navigate("info"),infoActive:()=>state.tab==="info",infoTitle:"Open FF7 plugin information",projectSources:()=>[{key:"vanilla",label:"Vanilla",path:state.dashboard?.baseline?.source||"Installed unchanged KERNEL.BIN"}],projectActiveSource:()=>state.activeSource,selectProjectSource:switchProjectSource,dirtyCount,readonly,save,discard,history:editHistory});
  editHistory.observe(document);
  Promise.allSettled([api("/api/dashboard"),api("/api/datamap"),api("/api/data"),api("/api/platform-config")]).then(results=>{
    const [dashboard,map,data,config]=results;
    state.dashboard=dashboard.status==="fulfilled"?dashboard.value:{baseline:{message:dashboard.reason.message},game:{},problems:[]};
    state.dataMap=map.status==="fulfilled"?map.value:{rows:[{filename:"Data Map",controls:"Availability report",notes:map.reason.message,status:"blocked",openable:false}]};
    state.data=data.status==="fulfilled"?data.value:{categories:[],records:{},vanilla:{},errors:Object.fromEntries(integrated.map(key=>[key,data.reason.message]))};
    state.platformConfig=config.status==="fulfilled"?config.value:{available:false,runtime:"FFNx",format:"toml",path:"FFNx.toml in the selected game directory",sections:[],message:config.reason.message};
    state.platformError=config.status==="rejected"?config.reason.message:"";
    for(const result of [map,data,config])if(result.status==="rejected")state.dashboard.problems.push(result.reason.message);
    state.records=clone(state.data.records);state.saved=clone(state.records);state.savedPlatformConfig=clone(state.platformConfig);
    for(const group of integrated)state.selected[group]=state.records[group]?.[0]?.id??null;
    state.loaded=true;
    if(state.dashboard.themeSounds)LexeditorUI.configureThemeSounds(state.dashboard.themeSounds);
    render();LexeditorUI.finishPluginLoading();
  }).catch(error=>{main.replaceChildren(el("section",{class:"ff7-message"},el("h2",{},"FF7 interface error"),el("p",{},error.message)));LexeditorUI.finishPluginLoading()});
  window.addEventListener("focus",()=>{if(state.loaded&&state.tab==="tweaks")void refreshPlatformConfig()});
  setInterval(()=>{if(state.loaded&&state.tab==="tweaks"&&!state.platformConfig?.available&&document.visibilityState==="visible")void refreshPlatformConfig()},3000);
  window.addEventListener("lexeditor-settings-ready",()=>{if(state.loaded&&state.tab==="info")render()});
  </script>
</body>
</html>
