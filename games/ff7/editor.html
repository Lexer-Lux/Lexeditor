<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Lexeditor - Final Fantasy 7 (Original)</title>
  <script>(()=>{const p=new URLSearchParams(location.search),k=p.get("lexTransition");if(!["load","resume"].includes(k))return;const r=document.documentElement;r.classList.add("lex-transition-entry");if(k==="load"){r.dataset.lexQuote=p.get("lexQuote")||"Loading editor…";r.classList.add("lex-transition-loading")}})()</script>
  <link rel="stylesheet" href="/shared/framework.css">
  <link rel="stylesheet" href="/shared/neutral.css">
  <style>
    .lex-semantic-reference-control{display:grid;grid-template-columns:2rem minmax(8rem,.8fr) minmax(11rem,1.2fr);align-items:center;gap:6px;width:100%;min-width:0}
    .lex-semantic-reference-control:not(.searchable){grid-template-columns:2rem minmax(0,1fr)}
    .lex-semantic-reference-control input,.lex-semantic-reference-control select{width:100%;min-width:0}
    .lex-semantic-reference-open{display:grid;width:2rem;height:2rem;min-width:2rem;padding:0;place-items:center;font:inherit;line-height:1}
    @media(max-width:860px){.lex-semantic-reference-control.searchable{grid-template-columns:2rem minmax(0,1fr)}.lex-semantic-reference-control.searchable .lex-semantic-reference-search{grid-column:1/-1;grid-row:1}.lex-semantic-reference-control.searchable .lex-semantic-reference-open{grid-row:2}.lex-semantic-reference-control.searchable select{grid-row:2}}
  </style>
</head>
<body class="lex-neutral-ui">
  <header id="lexeditor-shell"></header>
  <main id="main"></main>
  <script src="/shared/framework.js"></script>
  <script>
  "use strict";
  const {el,columnList,columnPreferences,detailPanel,detailSection,detailField,recordId,infoHelp,pagedListDetail,provenanceControl,platformConfigView,clone,EditHistory,subtabBar,tabbedPanel,readonlyField,infoIcon,integrationStatus,toggleRow}=LexeditorUI;
  const identity=window.__lexeditorPlugin||{id:"ff7",name:"Final Fantasy 7 (Original)",edition:"Steam"};
  const integrated=["accessories","armor","characters","items","materia","weapons","enemies","encounters","enemyAttacks","shops","prices","texts","characterNames","growthCurves","growthBonuses","characterAI","enemyAI","formationAI","recruits","defaultNames","fieldEncounters","worldEncounters","yuffieEncounters","chocoboRatings"];
  const unresolved=["tweaks"];
  const labels={accessories:"Accessories",armor:"Armor",characters:"Characters",items:"Items",materia:"Materia",weapons:"Weapons",enemies:"Enemies",encounters:"Encounters",shops:"Shops",prices:"Prices",texts:"Text",enemyAttacks:"Enemy attacks",tweaks:"Tweaks",characterNames:"Initial names",growthCurves:"Growth curves",growthBonuses:"Growth bonuses",characterAI:"Character AI",enemyAI:"Enemy AI",formationAI:"Formation AI",recruits:"Recruits",defaultNames:"Default names",fieldEncounters:"Field encounters",worldEncounters:"World encounters",yuffieEncounters:"Yuffie encounters",chocoboRatings:"Chocobo ratings"};
  const groups={characters:["characters","characterNames","growthCurves","growthBonuses","characterAI","recruits","defaultNames"],enemies:["enemies","enemyAttacks","enemyAI"],encounters:["encounters","formationAI","fieldEncounters","worldEncounters","yuffieEncounters","chocoboRatings"],shops:["shops","prices"]};
  const parentTab=id=>Object.keys(groups).find(key=>groups[key].includes(id))||id;
  const tabs=[...new Set([...integrated,...unresolved].map(parentTab))].map(id=>({id,label:labels[id]}));
  const api=async(path,options={})=>{const response=await fetch(path,options),body=await response.json();if(!response.ok)throw new Error(body.error||response.statusText);return body};
  const state={loaded:false,tab:"items",dashboard:null,dataMap:null,data:null,records:{},saved:{},invalid:{},platformConfig:null,savedPlatformConfig:null,platformQuery:"",platformError:"",platformRevision:0,platformLoading:false,activeSource:"mine",selected:{},page:{},pageSize:{},query:{},sort:{},mapQuery:"",mapStatus:"",mapPage:0,mapSort:["filename",1],saving:false};
  const main=document.querySelector("#main");
  const category=()=>state.data.categories.find(value=>value.id===state.tab);
  const rowById=(group,id,source=state.records)=>(source?.[group]||[]).find(row=>row.id===id);
  const platformFields=config=>Object.fromEntries((config?.sections||[]).flatMap(section=>section.fields).map(field=>[field.id,field.value]));
  const platformChanges=()=>{const current=platformFields(state.platformConfig),saved=platformFields(state.savedPlatformConfig),changes={};for(const [id,value] of Object.entries(current))if(JSON.stringify(value)!==JSON.stringify(saved[id]))changes[id]=value;return changes};
  const kernelDirty=()=>JSON.stringify(state.records)!==JSON.stringify(state.saved);
  const dirtyCount=()=>state.activeSource!=="mine"?0:Number(kernelDirty()||Object.keys(state.invalid).length>0)+Object.keys(platformChanges()).length;
  const readonly=()=>state.saving||state.activeSource!=="mine";
  const shellRefresh=()=>shell?.refresh?.();

  function numberControl(row,field){
    const key=`${state.tab}/${row.id}/${field.key}`;
    const input=el("input",{type:"number",min:field.minimum,max:field.maximum,step:field.step,
      value:state.invalid[key]??row.values[field.key],disabled:readonly(),
      "aria-label":`${field.label} for ${row.name}`,oninput:event=>{
        if(readonly())return;
        const raw=event.target.value,value=Number(raw);
        if(raw===""||!Number.isInteger(value)||!event.target.checkValidity())state.invalid[key]=raw;
        else{delete state.invalid[key];row.values[field.key]=value}
        shellRefresh();
      }});
    const vanilla=rowById(state.tab,row.id,state.data.vanilla).values[field.key];
    return provenanceControl({control:input,current:()=>row.values[field.key],vanilla,internal:true,
      apply:value=>{if(readonly())return;delete state.invalid[key];row.values[field.key]=Number(value);input.value=String(value);shellRefresh()}});
  }
  function textControl(row,field){
    const input=el("textarea",{rows:field.language?12:3,spellcheck:"false",value:row.values[field.key],disabled:readonly(),
      "aria-label":`${field.label} for ${row.name}`,oninput:event=>{
        if(readonly())return;
        row.values[field.key]=event.target.value;shellRefresh();
      }});
    input.value=String(row.values[field.key]);
    const vanilla=rowById(state.tab,row.id,state.data.vanilla).values[field.key];
    return provenanceControl({control:input,current:()=>row.values[field.key],vanilla,internal:true,
      apply:value=>{if(readonly())return;row.values[field.key]=String(value);input.value=String(value);shellRefresh()}});
  }
  function enumSummary(field,value){
    const choice=(field.choices||[]).find(candidate=>Number(candidate.value)===Number(value));
    if(choice)return choice.label;
    const number=Number(value),hex=Number.isInteger(number)?`0x${number.toString(16).toUpperCase().padStart(2,"0")}`:String(value);
    return `Unknown / modded (${hex})`;
  }
  function enumControl(row,field){
    const vanilla=Number(rowById(state.tab,row.id,state.data.vanilla).values[field.key]);
    const current=Number(row.values[field.key]),choices=[...(field.choices||[])];
    for(const value of [current,vanilla]){
      if(!choices.some(choice=>Number(choice.value)===value))choices.push({value,label:enumSummary(field,value)});
    }
    const select=el("select",{disabled:readonly(),"aria-label":`${field.label} for ${row.name}`,onchange:event=>{
      if(readonly())return;row.values[field.key]=Number(event.target.value);shellRefresh();
    }},...choices.map(choice=>el("option",{value:choice.value},choice.label)));
    select.value=String(current);
    return provenanceControl({control:select,current:()=>row.values[field.key],vanilla,internal:true,format:value=>enumSummary(field,value),
      apply:value=>{if(readonly())return;row.values[field.key]=Number(value);select.value=String(value);shellRefresh()}});
  }
  function flagMask(field){return field.bitWidth?2**Number(field.bitWidth)-1:0xFFFFFFFF}
  function logicalFlags(field,value){const raw=Number(value)>>>0;return field.invertBits?((~raw)>>>0)&flagMask(field):raw}
  function flagsSummary(field,value){
    const number=logicalFlags(field,value),labels=(field.flags||[]).filter(flag=>(number&Number(flag.value))!==0).map(flag=>flag.label);
    const known=(field.flags||[]).reduce((mask,flag)=>mask|Number(flag.value),0)>>>0,unknown=(number&~known)>>>0;
    if(unknown)labels.push(`Unknown bits 0x${unknown.toString(16).toUpperCase()}`);
    return labels.length?labels.join(", "):"None";
  }
  function flagsControl(row,field){
    const vanilla=Number(rowById(state.tab,row.id,state.data.vanilla).values[field.key]);
    const raw=()=>Number(row.values[field.key])>>>0;
    const logical=()=>logicalFlags(field,raw());
    const group=toggleRow({label:`${field.label} for ${row.name}`,columns:3,toggles:(field.flags||[]).map(flag=>({
      label:flag.label,checked:(logical()&Number(flag.value))!==0,disabled:readonly(),help:flag.help,change:checked=>{
        if(readonly())return;
        const bit=Number(flag.value),value=raw();
        row.values[field.key]=field.invertBits?(checked?(value&~bit):(value|bit)):(checked?(value|bit):(value&~bit));
        shellRefresh();
      }
    }))});
    return provenanceControl({control:group,current:raw,vanilla,internal:true,format:value=>flagsSummary(field,value),
      apply:value=>{if(readonly())return;row.values[field.key]=Number(value);render()}});
  }
  function referenceRows(field,row){
    let rows=[...(state.records[field.referenceCategory]||[])];
    if(field.referenceScope==="scene")rows=rows.filter(candidate=>candidate.scene===row.scene);
    return rows;
  }
  function candidateValue(field,candidate){return Number(candidate[field.referenceValueKey||"id"])}
  function candidateLabel(candidate){return String(candidate.values?.name||candidate.name||`Record ${candidate.id}`)}
  function referenceChoices(field,row){return referenceRows(field,row).map(candidate=>({value:candidateValue(field,candidate),label:candidateLabel(candidate),category:field.referenceCategory,recordId:Number(candidate.id)}))}
  function inventoryChoices(includeMateria=true){
    const specs=[["items",0],["weapons",128],["armor",256],["accessories",288],...(includeMateria?[["materia",320]]:[])];
    return specs.flatMap(([category,offset])=>(state.records[category]||[]).map(record=>({value:offset+Number(record.id),label:`${candidateLabel(record)} — ${labels[category]||category}`,category,recordId:Number(record.id)})));
  }
  function semanticChoiceSummary(choices,value,emptyValue){
    if(emptyValue!==undefined&&Number(value)===Number(emptyValue))return "None";
    const choice=choices.find(candidate=>Number(candidate.value)===Number(value));
    return choice?.label||enumSummary({choices},value);
  }
  function referenceSearchText(choice){
    const value=Number(choice.value),hex=Number.isInteger(value)?`0x${value.toString(16).toUpperCase()}`:"";
    return `${choice.label||""} ${choice.value} #${choice.value} ${hex}`.toLocaleLowerCase();
  }
  function selectControl(row,field,choiceFactory){
    const vanilla=Number(rowById(state.tab,row.id,state.data.vanilla).values[field.key]);
    const current=Number(row.values[field.key]);
    const choices=choiceFactory();
    if(field.emptyValue!==undefined&&!choices.some(c=>Number(c.value)===Number(field.emptyValue)))choices.unshift({value:Number(field.emptyValue),label:"None"});
    for(const value of [current,vanilla])if(!choices.some(c=>Number(c.value)===value))choices.push({value,label:semanticChoiceSummary(choices,value,field.emptyValue)});
    const select=el("select",{disabled:readonly(),"aria-label":`${field.label} for ${row.name}`,onchange:event=>{
      if(readonly())return;row.values[field.key]=Number(event.target.value);field.rerenderOnChange?render():shellRefresh();
    }});
    const selectedChoice=()=>choices.find(choice=>Number(choice.value)===Number(row.values[field.key]));
    const openButton=el("button",{type:"button",class:"lex-semantic-reference-open",title:`Open selected ${field.label.toLowerCase()}`,"aria-label":`Open ${field.label} for ${row.name}`,disabled:true,onclick:event=>{
      event.preventDefault();event.stopPropagation();const choice=selectedChoice();if(!choice?.category||choice.recordId===undefined)return;state.selected[choice.category]=Number(choice.recordId);navigate(choice.category);
    }},"↗");
    const rebuild=(query="")=>{
      const needle=String(query).trim().toLocaleLowerCase(),selected=Number(row.values[field.key]);
      let visible=needle?choices.filter(choice=>referenceSearchText(choice).includes(needle)):choices.slice();
      const currentChoice=choices.find(choice=>Number(choice.value)===selected);
      if(currentChoice&&!visible.some(choice=>Number(choice.value)===selected))visible.unshift(currentChoice);
      select.replaceChildren(...visible.map(choice=>el("option",{value:choice.value},choice.label)));
      select.value=String(selected);
      const choice=selectedChoice();openButton.disabled=!(choice?.category&&choice.recordId!==undefined);
    };
    const searchable=choices.length>=12;
    const search=searchable?el("input",{type:"search",class:"lex-semantic-reference-search",placeholder:`Search ${field.label.toLowerCase()}…`,disabled:readonly(),"aria-label":`Search ${field.label} for ${row.name}`,oninput:event=>rebuild(event.target.value)}):null;
    rebuild();
    const root=el("div",{class:`lex-semantic-reference-control${searchable?" searchable":""}`},...(search?[openButton,search,select]:[openButton,select]));
    return provenanceControl({control:root,current:()=>row.values[field.key],vanilla,internal:true,format:value=>semanticChoiceSummary(choices,value,field.emptyValue),apply:value=>{if(readonly())return;row.values[field.key]=Number(value);render()}});
  }
  function referenceControl(row,field){return selectControl(row,field,()=>referenceChoices(field,row))}
  function inventoryReferenceControl(row,field){return selectControl(row,field,()=>inventoryChoices(true))}
  function shopReferenceControl(row,field){return selectControl(row,field,()=>Number(row.values[field.kindField])===1?(state.records.materia||[]).map(record=>({value:Number(record.id),label:candidateLabel(record),category:"materia",recordId:Number(record.id)})):inventoryChoices(false))}
  function booleanControl(row,field){
    const vanilla=Number(rowById(state.tab,row.id,state.data.vanilla).values[field.key]);
    const input=el("input",{type:"checkbox",checked:!!Number(row.values[field.key]),disabled:readonly(),"aria-label":`${field.label} for ${row.name}`,onchange:event=>{if(readonly())return;row.values[field.key]=event.target.checked?1:0;shellRefresh()}});
    input.checked=!!Number(row.values[field.key]);
    return provenanceControl({control:input,current:()=>Number(row.values[field.key]),vanilla,internal:true,format:value=>Number(value)?"Enabled":"Disabled",apply:value=>{if(readonly())return;row.values[field.key]=Number(value)?1:0;render()}});
  }
  function scaledControl(row,field){
    const scale=Number(field.displayScale)||1,key=`${state.tab}/${row.id}/${field.key}`,raw=Number(row.values[field.key]);
    const input=el("input",{type:"number",min:Number(field.minimum)*scale,max:Number(field.maximum)*scale,step:scale,value:raw*scale,disabled:readonly(),"aria-label":`${field.label} for ${row.name}`,oninput:event=>{
      if(readonly())return;const shown=Number(event.target.value),value=shown/scale;
      if(event.target.value===""||!Number.isInteger(value)||!event.target.checkValidity())state.invalid[key]=event.target.value;
      else{delete state.invalid[key];row.values[field.key]=value}shellRefresh();
    }});
    const vanilla=Number(rowById(state.tab,row.id,state.data.vanilla).values[field.key]);
    return provenanceControl({control:input,current:()=>Number(row.values[field.key]),vanilla,internal:true,format:value=>String(Number(value)*scale),apply:value=>{if(readonly())return;row.values[field.key]=Number(value);render()}});
  }
  function statusChangeDecoded(value){
    const raw=Number(value);if(raw===0xFF)return{mode:"none",amount:0};if(raw<0x40)return{mode:"inflict",amount:raw};if(raw<0x80)return{mode:"cure",amount:raw-0x40};if(raw<0xC0)return{mode:"swap",amount:raw-0x80};return{mode:"unknown",amount:raw};
  }
  function statusChangeSummary(value){const data=statusChangeDecoded(value);if(data.mode==="none")return"None";if(data.mode==="unknown")return`Unknown / modded (0x${Number(value).toString(16).toUpperCase()})`;return`${data.mode[0].toUpperCase()+data.mode.slice(1)} — ${data.amount}/63`}
  function statusChangeControl(row,field){
    const vanilla=Number(rowById(state.tab,row.id,state.data.vanilla).values[field.key]),initial=statusChangeDecoded(row.values[field.key]);
    const modes=[{value:"none",label:"None"},{value:"inflict",label:"Inflict"},{value:"cure",label:"Cure"},{value:"swap",label:"Swap"}];
    if(initial.mode==="unknown")modes.push({value:"unknown",label:statusChangeSummary(row.values[field.key])});
    const mode=el("select",{"aria-label":`${field.label} mode for ${row.name}`,disabled:readonly()},...modes.map(value=>el("option",{value:value.value},value.label)));
    const amount=el("input",{type:"number",min:0,max:63,step:1,"aria-label":`${field.label} chance or amount for ${row.name}`,disabled:readonly()});
    mode.value=initial.mode;amount.value=String(initial.mode==="unknown"?0:initial.amount);amount.disabled=readonly()||["none","unknown"].includes(initial.mode);
    const root=el("div",{class:"lex-semantic-compound"},mode,amount);
    const update=()=>{if(readonly())return;const selected=mode.value;if(selected==="unknown")return;const n=Math.max(0,Math.min(63,Number(amount.value)||0));row.values[field.key]=selected==="none"?0xFF:selected==="inflict"?n:selected==="cure"?0x40+n:0x80+n;amount.disabled=readonly()||selected==="none";root.dispatchEvent(new Event("change",{bubbles:true}));shellRefresh()};
    mode.addEventListener("change",update);amount.addEventListener("input",update);
    return provenanceControl({control:root,current:()=>Number(row.values[field.key]),vanilla,internal:true,format:statusChangeSummary,apply:value=>{if(readonly())return;row.values[field.key]=Number(value);render()}});
  }
  function semanticControl(row,field){
    if(field.dataType==="text")return textControl(row,field);
    if(field.dataType==="enum")return enumControl(row,field);
    if(field.dataType==="flags")return flagsControl(row,field);
    if(field.dataType==="reference")return referenceControl(row,field);
    if(field.dataType==="inventoryReference")return inventoryReferenceControl(row,field);
    if(field.dataType==="shopReference")return shopReferenceControl(row,field);
    if(field.dataType==="boolean")return booleanControl(row,field);
    if(field.dataType==="scaled")return scaledControl(row,field);
    if(field.dataType==="statusChange")return statusChangeControl(row,field);
    return numberControl(row,field);
  }
  function semanticHelp(field){
    if(field.help)return field.help;
    if(field.dataType==="text")return "This is game-visible text. Byte escapes preserve FF7 control codes; unsupported characters or text that cannot fit are refused on save rather than corrupting the kernel.";
    return "";
  }
  function semanticType(field){
    return {text:"TEXT",enum:"SELECT",flags:"FLAGS",reference:"REF",inventoryReference:"REF",shopReference:"REF",boolean:"BOOL",scaled:"VALUE",statusChange:"STATUS"}[field.dataType]||"INT";
  }

  function descriptionControl(row){
    const input=el("textarea",{rows:3,spellcheck:"false",value:row.description||"",disabled:readonly(),
      "aria-label":`Description for ${row.name}`,oninput:event=>{
        if(readonly())return;
        row.description=event.target.value;shellRefresh();
      }});
    input.value=String(row.description||"");
    const vanilla=rowById(state.tab,row.id,state.data.vanilla)?.description||"";
    return provenanceControl({control:input,current:()=>row.description,vanilla,internal:true,
      apply:value=>{if(readonly())return;row.description=String(value);input.value=row.description;shellRefresh()}});
  }
  function recordDetail(row){
    const metadata=category(),groups=[...new Set(metadata.fields.map(field=>field.group||"Kernel data"))];
    const body=[];
    if(metadata.descriptionEditable)body.push(detailSection({title:"TEXT",body:detailField({label:"DESCRIPTION",help:infoHelp("The in-game description stored in this FF7 KERNEL.BIN. Byte escapes are preserved for game control codes."),control:descriptionControl(row),dataType:"TEXT"})}));
    body.push(...groups.map(group=>detailSection({title:group.toUpperCase(),body:metadata.fields.filter(field=>(field.group||"Kernel data")===group).map(field=>{const help=semanticHelp(field);return detailField({className:"ff7-field",label:field.label,help:help?infoHelp(help):null,control:semanticControl(row,field),dataType:semanticType(field),min:field.minimum,max:field.maximum})})})));
    return detailPanel({className:"ff7-detail",title:row.values.name||row.name,identity:recordId(row.id),meta:null,body});
  }
  function listTable(rows,selected,select){
    const columns=[
      {key:"id",label:"ID",numberedId:true,sortable:true},
      {key:"name",label:"Name",sortable:true,grow:2,render:row=>el("span",{title:row.values.name||row.name},row.values.name||row.name)},
      ...(category()?.descriptionEditable?[{key:"description",label:"Description",sortable:true,grow:3,pinned:false,render:row=>el("span",{title:row.description},row.description)}]:[]),
    ];
    const prefs=columnPreferences(`ff7-${state.tab}`,columns,()=>render());
    const sort=state.sort[state.tab]||{key:"name",dir:1};
    return columnList({rows,key:row=>row.id,selected,select:row=>{const id=typeof row==="object"?row.id:row;if(id!==state.selected[state.tab])LexeditorUI.playThemeSound?.("move");select(row)},sortState:sort,sort:key=>{state.sort[state.tab]=sort.key===key?{key,dir:-sort.dir}:{key,dir:1};render()},columnPreferences:prefs,columns,class:"ff7-table","aria-label":`${labels[state.tab]} records`});
  }
  function unavailableView(){
    const error=state.data.errors?.[state.tab];
    const source=state.data.families?.[category()?.family]?.sourceRelativePath||category()?.family||state.data.sourceRelativePath||"English KERNEL.BIN in the selected installation";
    return detailPanel({className:"ff7-detail",title:labels[state.tab],identity:null,meta:"Data unavailable",body:[
      detailSection({title:"STATUS",body:[
        detailField({label:"STATE",control:integrationStatus("not-integrated")}),
        detailField({label:"SOURCE",control:readonlyField(source)}),
        detailField({label:"PROBLEM",control:readonlyField(error||"No readable records are available for this dataset.")}),
        detailField({label:"NEXT",control:el("button",{type:"button",onclick:()=>navigate("datamap")},"Open Data Map")}),
      ]}),
    ]});
  }
  function integratedView(){
    const group=state.tab,query=state.query[group]||"",sort=state.sort[group]||{key:"name",dir:1};
    if(!state.records[group]?.length)return unavailableView();
    const searchableDescription=category()?.descriptionEditable;
    const rows=[...state.records[group]].filter(row=>!query||`${row.id} ${row.values.name||row.name} ${searchableDescription?row.description||"":""} ${row.values.text||""}`.toLocaleLowerCase().includes(query.toLocaleLowerCase())).sort((a,b)=>{const left=a[sort.key],right=b[sort.key];return(typeof left==="string"?left.localeCompare(right):Number(left)-Number(right))*sort.dir});
    if(!rows.some(row=>row.id===state.selected[group]))state.selected[group]=rows[0]?.id??null;
    return pagedListDetail({rows,key:row=>row.id,slots:false,selected:state.selected[group],page:state.page[group]||0,pageSize:state.pageSize[group]||12,noun:labels[group],className:"ff7-layout",splitKey:`ff7-${group}`,rowsKey:`ff7-${group}`,defaultSplit:50,minLeft:320,minRight:360,search:{key:`ff7-${group}`,value:query,label:`Search ${labels[group]}`,change:value=>{state.query[group]=value;state.page[group]=0;render()}},sync:next=>{state.page[group]=next.page;state.pageSize[group]=next.pageSize;if(next.selected!==null)state.selected[group]=next.selected},change:next=>{state.page[group]=next.page;state.pageSize[group]=next.pageSize;if(next.selected!==null)state.selected[group]=next.selected;render()},master:view=>listTable(view.rows,view.selected,view.select),detail:row=>recordDetail(row)});
  }
  function unresolvedView(){
    const area=state.data.unresolved?.[state.tab];
    return detailPanel({className:"ff7-detail",title:labels[state.tab],identity:null,meta:"Not integrated",body:[
      detailSection({title:"STATUS",body:[
        detailField({label:"STATE",control:integrationStatus("not-integrated")}),
        detailField({label:"SOURCE",control:readonlyField(area?.source||"Dataset source information could not be loaded.")}),
        detailField({label:"REASON",control:readonlyField(area?.reason||"This tab has no connected editor. See Info for loading errors.")}),
        detailField({label:"NEXT",control:readonlyField(area?.unlock||"Reload the dataset availability report.")}),
      ]}),
    ]});
  }
  function syncConfigMap(config){
    const row=state.dataMap?.rows.find(item=>item.category==="tweaks");
    if(row)Object.assign(row,{status:config.available?"integrated":"partial",coverage:config.available?"structured":"unavailable",openable:config.available,sourcePath:config.path,notes:config.message});
  }
  async function refreshPlatformConfig(force=false){
    if(state.platformLoading||state.saving||state.activeSource!=="mine")return;
    if(Object.keys(platformChanges()).length){
      if(!force||!window.confirm("Discard unsaved FFNx settings and reload the installed file?"))return;
    }
    const revision=state.platformRevision;
    state.platformLoading=true;
    try{
      const config=await api("/api/platform-config");
      if(revision!==state.platformRevision||state.saving)return;
      state.platformConfig=config;state.savedPlatformConfig=clone(config);state.platformError="";syncConfigMap(config);
      if(state.tab==="tweaks")render();
    }catch(error){state.platformError=error.message;if(state.tab==="tweaks")render()}
    finally{state.platformLoading=false;shellRefresh()}
  }
  function tweakView(){
    const reload=el("button",{type:"button",disabled:readonly(),onclick:()=>refreshPlatformConfig(true)},"Reload settings");
    const view=platformConfigView({config:state.platformConfig,query:state.platformQuery,disabled:readonly(),search:value=>{state.platformQuery=value},change:(id,value)=>{
      if(readonly())return;
      const field=(state.platformConfig?.sections||[]).flatMap(section=>section.fields).find(candidate=>candidate.id===id);
      if(field){field.value=value;state.platformRevision++;shellRefresh()}
    }});
    const panel=detailPanel({className:"ff7-detail",title:"FFNx",identity:null,meta:"Runtime settings",body:[
      detailSection({title:"ACTIONS",body:[detailField({label:"CONFIGURATION",control:reload})]}),
      ...(state.platformError?[detailSection({title:"ERROR",body:[detailField({label:"MESSAGE",control:readonlyField(state.platformError)})]})]:[]),
      detailSection({title:"SETTINGS",body:[view]}),
    ]});
    return tabbedPanel({tabs:[{id:"ffnx",label:"FFNx"}],active:"ffnx",label:"Tweaks sections",change:()=>{},content:panel});
  }
  function infoView(){
    const baseline=state.dashboard.baseline,sounds=LexeditorUI.sharedSettings()?.developerMode?LexeditorUI.soundCoverageTable(state.dashboard.themeSounds?.rows||[]):null;
    return detailPanel({className:"lex-information-panel ff7-detail",icon:infoIcon(),title:identity.name,identity:null,meta:identity.edition,body:[
      detailSection({title:"GAME",body:[
        detailField({label:"Game root",control:readonlyField(state.dashboard.game.root||"Unavailable")}),
        detailField({label:"Source",control:readonlyField(baseline.source||"Unavailable")}),
      ]}),
      detailSection({title:"PROJECT",body:[
        detailField({label:"Project output",control:readonlyField(baseline.projectPath||"Unavailable")}),
        detailField({label:"Vanilla SHA-256",control:readonlyField(baseline.sha256||"Unavailable")}),
        detailField({label:"Status",control:readonlyField(baseline.message||"Unavailable")}),
      ]}),
      ...((state.dashboard.problems||[]).length?[detailSection({title:"PROBLEMS",body:(state.dashboard.problems||[]).map((problem,index)=>detailField({label:`Problem ${index+1}`,control:readonlyField(problem)}))})]:[]),
      ...(sounds?[detailSection({title:"THEME SOUNDS",body:[sounds]})]:[]),
    ]});
  }
  function mapView(){const view=LexeditorUI.dataMap({rows:state.dataMap.rows,open:row=>{const target=row.target||row.category;if(target)navigate(target)},query:state.mapQuery,status:state.mapStatus,page:state.mapPage,sort:state.mapSort,pageSize:100,changeQuery:value=>{state.mapQuery=value;state.mapPage=0;render()},changeStatus:value=>{state.mapStatus=value;state.mapPage=0;render()},changePage:value=>{state.mapPage=value;render()},changeSort:key=>{const[active,direction]=state.mapSort;state.mapSort=[key,active===key?-direction:1];render()}});state.mapPage=view.page;return view.content}
  function dataWorkspace(){
    const sub=groups[parentTab(state.tab)];
    if(!sub)return integratedView();
    const nav=subtabBar({tabs:sub.map(id=>({id,label:labels[id]})),active:state.tab,label:labels[parentTab(state.tab)]+" datasets",change:id=>{if(id!==state.tab)LexeditorUI.playThemeSound?.("confirm");navigate(id)}});
    return el("section",{class:"ff7-workspace lex-tabbed-panel"},nav,el("div",{class:"lex-tabbed-panel-content"},integratedView()));
  }
  function render(){if(!state.loaded)return;let content;if(state.tab==="info")content=infoView();else if(state.tab==="datamap")content=mapView();else if(state.tab==="tweaks")content=tweakView();else if(integrated.includes(state.tab))content=dataWorkspace();else content=unresolvedView();main.replaceChildren(content);shellRefresh()}
  function navigate(tab){state.tab=tab;render();if(tab==="tweaks")void refreshPlatformConfig()}
  async function save(){
    if(readonly())return;
    if(Object.keys(state.invalid).length)throw new Error("Correct the empty or out-of-range numeric fields before saving.");
    state.saving=true;state.platformRevision++;render();
    try{
      const kernelKeys=state.data.kernelCategories||["items","weapons","armor","accessories","materia","characters"];
      const subset=(keys,source)=>Object.fromEntries(keys.filter(key=>Object.hasOwn(source,key)).map(key=>[key,source[key]]));
      const kernelRecords=subset(kernelKeys,state.records);
      if(JSON.stringify(kernelRecords)!==JSON.stringify(subset(kernelKeys,state.saved))){
        const result=await api("/api/save",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({records:kernelRecords,sourceSha256:state.data.sourceSha256,activeSha256:state.data.activeSha256,usingProject:state.data.usingProject})});
        Object.assign(state.records,result.records||kernelRecords);Object.assign(state.saved,clone(result.records||kernelRecords));state.data.activeSha256=result.sha256;state.data.usingProject=true;state.dashboard.baseline.projectPath=result.path;
        editHistory.clear();
      }
      // Each source has its own verified atomic replacement and saved snapshot.
      // A later failure must not pretend an earlier file was rolled back.
      for(const [family,report] of Object.entries(state.data.families||{})){
        const records=subset(report.categories,state.records);
        if(JSON.stringify(records)===JSON.stringify(subset(report.categories,state.saved)))continue;
        const result=await api("/api/extended/save",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({family,records,sourceSha256:report.sourceSha256,activeSha256:report.activeSha256,usingProject:report.usingProject})});
        Object.assign(state.records,result.records||records);Object.assign(state.saved,clone(result.records||records));const {records:canonical,...snapshot}=result;Object.assign(report,snapshot);editHistory.clear();
      }
      const changes=platformChanges();
      if(Object.keys(changes).length){state.platformConfig=await api("/api/platform-config/save",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({sha256:state.savedPlatformConfig.sha256,changes})});state.savedPlatformConfig=clone(state.platformConfig);state.platformError="";syncConfigMap(state.platformConfig)}
      editHistory.clear();
    }finally{state.saving=false;render()}
  }
  async function discard(){state.records=clone(state.saved);state.invalid={};state.platformConfig=clone(state.savedPlatformConfig);state.platformRevision++;editHistory.clear();render()}
  async function switchProjectSource(value){state.activeSource=String(value||"mine")==="vanilla"?"vanilla":"mine";state.records=clone(state.activeSource==="vanilla"?state.data.vanilla:state.saved);state.invalid={};state.platformRevision++;editHistory.clear();render()}
  const editHistory=new EditHistory({capture:()=>state.records,restore:snapshot=>{state.records=clone(snapshot);state.invalid={}},render:async()=>render(),enabled:()=>state.loaded&&!readonly(),changed:shellRefresh});
  const shell=LexeditorUI.mountShell({host:"#lexeditor-shell",brand:"LEXEDITOR",plugin:{id:identity.id,name:identity.name,themeName:identity.id,theme:{}},tabs,activeTab:()=>parentTab(state.tab),navigate,help:()=>navigate("datamap"),helpActive:()=>state.tab==="datamap",helpTitle:"Open the FF7 Data Map",info:()=>navigate("info"),infoActive:()=>state.tab==="info",infoTitle:"Open FF7 plugin information",projectSources:()=>[{key:"vanilla",label:"Vanilla",path:state.dashboard?.baseline?.source||"Installed unchanged KERNEL.BIN"}],projectActiveSource:()=>state.activeSource,selectProjectSource:switchProjectSource,dirtyCount,readonly,save,discard,history:editHistory});
  editHistory.observe(document);
  Promise.allSettled([api("/api/dashboard"),api("/api/datamap"),api("/api/data"),api("/api/platform-config")]).then(results=>{
    const [dashboard,map,data,config]=results;
    state.dashboard=dashboard.status==="fulfilled"?dashboard.value:{baseline:{message:dashboard.reason.message},game:{},problems:[]};
    state.dataMap=map.status==="fulfilled"?map.value:{rows:[{filename:"Data Map",controls:"Availability report",notes:map.reason.message,status:"blocked",openable:false}]};
    state.data=data.status==="fulfilled"?data.value:{categories:[],records:{},vanilla:{},errors:Object.fromEntries(integrated.map(key=>[key,data.reason.message]))};
    state.platformConfig=config.status==="fulfilled"?config.value:{available:false,runtime:"FFNx",format:"toml",path:"FFNx.toml in the selected game directory",sections:[],message:config.reason.message};
    state.platformError=config.status==="rejected"?config.reason.message:"";
    for(const result of [map,data,config])if(result.status==="rejected")state.dashboard.problems.push(result.reason.message);
    state.records=clone(state.data.records);state.saved=clone(state.records);state.savedPlatformConfig=clone(state.platformConfig);
    for(const group of integrated)state.selected[group]=state.records[group]?.[0]?.id??null;
    state.loaded=true;
    if(state.dashboard.themeSounds)LexeditorUI.configureThemeSounds(state.dashboard.themeSounds);
    render();LexeditorUI.finishPluginLoading();
  }).catch(error=>{main.replaceChildren(detailPanel({className:"ff7-detail",title:"FF7 interface error",identity:null,meta:"Load failed",body:[detailSection({title:"ERROR",body:[detailField({label:"MESSAGE",control:readonlyField(error.message)})]})]}));LexeditorUI.finishPluginLoading()});
  window.addEventListener("focus",()=>{if(state.loaded&&state.tab==="tweaks")void refreshPlatformConfig()});
  setInterval(()=>{if(state.loaded&&state.tab==="tweaks"&&!state.platformConfig?.available&&document.visibilityState==="visible")void refreshPlatformConfig()},3000);
  window.addEventListener("lexeditor-settings-ready",()=>{if(state.loaded&&state.tab==="info")render()});
  </script>
</body>
