# FF8's ReShade defaults: gentle sharpening only, at the shader's own values.
# A 1999 game on a modern display benefits from a little CAS sharpness;
# everything else (bloom, depth of field, ambient occlusion, vignette,
# colour grading) stays off until Lexer asks for it.
Techniques=Sharpen@Sharpen.fx
TechniqueSorting=Compare@Compare.fx,AmbientOcclusion@AmbientOcclusion.fx,DepthOfField@DepthOfField.fx,Bloom@Bloom.fx,Colors@Colors.fx,Sharpen@Sharpen.fx,Vignette@Vignette.fx,CompareShow@Compare.fx

[Sharpen.fx]
Strength=0.500000
Limit=1.000000
