name: FF8 backlog source snapshot
on:
  push:
    branches: [fix/ff8-backlog-runtime]
    paths: [.github/workflows/ff8-backlog-source.yml]
permissions:
  contents: read
  issues: read
jobs:
  source:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Fetch exact revision without unrelated submodule hooks
        run: |
          git config --global core.autocrlf false
          git init editor
          git -C editor remote add origin https://github.com/Lexer-Lux/Lexeditor.git
          git -C editor fetch --depth=1 origin "$GITHUB_SHA"
          git -C editor checkout --detach FETCH_HEAD
      - name: Archive source, packaged driver and live issue evidence
        working-directory: editor
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          from pathlib import Path
          import json, os, subprocess, urllib.request, zipfile
          names = subprocess.check_output(['git','ls-files','-z']).decode().split('\0')
          keep = {'.py','.cpp','.h','.hpp','.html','.js','.json','.md','.patch','.yml','.yaml','.txt','.css','.toml','.ini','.ps1','.bat','.csv','.glsl','.def'}
          with zipfile.ZipFile('../ff8-backlog-source.zip','w',zipfile.ZIP_DEFLATED) as archive:
              archive.writestr('SNAPSHOT_REVISION.txt', os.environ['GITHUB_SHA'])
              for name in names:
                  path=Path(name)
                  if path.is_file() and (path.suffix.lower() in keep or name == '.gitattributes' or name == 'games/ff8/ffnx_issue_51/package/AF3DN.P'):
                      archive.write(path,name)
              endpoint='https://api.github.com/repos/Lexer-Lux/Lexeditor/issues'
              headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json'}
              issues=[]
              for page in range(1,20):
                  request=urllib.request.Request(endpoint+'?state=open&labels=ff8&per_page=100&page='+str(page),headers=headers)
                  with urllib.request.urlopen(request) as response: rows=json.load(response)
                  issues.extend(row for row in rows if 'pull_request' not in row)
                  if len(rows)<100: break
              archive.writestr('issue-evidence/open-ff8.json',json.dumps(issues,ensure_ascii=False,indent=2))
              for issue in issues:
                  comments=[]
                  for page in range(1,20):
                      request=urllib.request.Request(issue['comments_url']+'?per_page=100&page='+str(page),headers=headers)
                      with urllib.request.urlopen(request) as response: rows=json.load(response)
                      comments.extend(rows)
                      if len(rows)<100: break
                  archive.writestr('issue-evidence/'+str(issue['number'])+'-comments.json',json.dumps(comments,ensure_ascii=False,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: ff8-backlog-source
          path: ff8-backlog-source.zip
          retention-days: 2
          if-no-files-found: error
