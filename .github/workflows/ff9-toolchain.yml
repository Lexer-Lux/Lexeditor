name: FF9 development toolchain
on:
  push:
    branches: [codex/ff9-issues-20260906]
    paths: ['.github/workflows/ff9-toolchain.yml']
permissions:
  contents: read
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Collect public compiler, framework references and IL tools
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ff9-toolchain/dotnet ff9-toolchain/packages ff9-toolchain/wheels
          for spec in microsoft.netframework.referenceassemblies.net35:1.0.3 microsoft.netframework.referenceassemblies.net472:1.0.3 mono.cecil:0.11.6 unityengine5:5.5.0; do
            name=${spec%:*}; version=${spec#*:}
            curl --fail --location --retry 2 "https://api.nuget.org/v3-flatcontainer/$name/$version/$name.$version.nupkg" -o "ff9-toolchain/packages/$name.$version.nupkg"
            unzip -q "ff9-toolchain/packages/$name.$version.nupkg" -d "ff9-toolchain/packages/$name"
          done
          python -m pip download --dest ff9-toolchain/wheels UnityPy==1.23.0 dnfile==0.17.0
          root=$(dirname "$(readlink -f "$(command -v dotnet)")")
          cp "$root/dotnet" ff9-toolchain/dotnet/
          cp -r "$root/host" ff9-toolchain/dotnet/
          runtime=$(dotnet --list-runtimes | grep '^Microsoft.NETCore.App 8\.' | tail -1 | awk '{print $2}')
          mkdir -p ff9-toolchain/dotnet/shared/Microsoft.NETCore.App
          cp -r "$root/shared/Microsoft.NETCore.App/$runtime" ff9-toolchain/dotnet/shared/Microsoft.NETCore.App/
          sdk=$(dotnet --list-sdks | grep '^8\.' | tail -1 | awk '{print $1}')
          cp -r "$root/sdk/$sdk/Roslyn/bincore" ff9-toolchain/compiler
          cp -r "$root/packs/Microsoft.NETCore.App.Ref" ff9-toolchain/netcore-ref
          printf '%s\n' "$runtime" > ff9-toolchain/runtime-version.txt
          printf '%s\n' "$sdk" > ff9-toolchain/sdk-version.txt
          find ff9-toolchain -type f \( -iname '*.ttf' -o -iname '*.otf' -o -iname '*.woff*' \) -delete
          find ff9-toolchain/packages -name '*.nupkg' -exec sha256sum {} \; > ff9-toolchain/package-sha256.txt
          tar -czf ff9-toolchain.tar.gz ff9-toolchain
      - uses: actions/upload-artifact@v4
        with:
          name: ff9-development-toolchain
          path: ff9-toolchain.tar.gz
          retention-days: 1
