name: RDR1 candidate
on:
  pull_request:
    paths:
      - 'plugins/rdr/**'
      - 'tools/*rdr*.py'
      - 'tests/test_rdr_*.py'
      - '.github/workflows/rdr1-candidate.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Check out exact candidate source without optional gitlinks
        shell: bash
        run: |
          git init .
          git -c protocol.version=2 fetch --depth=1 "https://github.com/${GITHUB_REPOSITORY}.git" "${SOURCE_SHA}"
          git checkout --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "${SOURCE_SHA}"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build license-safe isolated candidate
        shell: bash
        run: |
          mkdir -p artifacts
          short="${SOURCE_SHA:0:12}"
          python tools/package_rdr1_candidate.py             --output "artifacts/Lexeditor-RDR1-${short}.zip"             --commit "${SOURCE_SHA}" | tee artifacts/rdr1-candidate.json
      - name: Test the extracted candidate
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import zipfile
          archive = next(Path("artifacts").glob("Lexeditor-RDR1-*.zip"))
          target = Path("candidate-root")
          with zipfile.ZipFile(archive) as source:
              source.extractall(target)
          assert not (target / "tools/magic-rdr/app").exists()
          assert not (target / "tools/magic-rdr/cli").exists()
          assert (target / "tools/magic-rdr/README.md").is_file()
          other_games = [
              path for path in (target / "plugins").iterdir()
              if path.is_dir() and path.name != "rdr"
          ]
          assert not other_games, other_games
          assert not [
              path for path in target.rglob("*")
              if path.suffix.lower() in {".ttf", ".otf", ".woff", ".woff2"}
          ]
          PY
          cd candidate-root
          python - <<'PY'
          from plugin_metadata import static_plugin_ids, validate_repository_metadata
          assert static_plugin_ids() == {"rdr"}
          validate_repository_metadata()
          print("candidate plugin metadata narrowed to RDR1")
          PY
          python -m compileall -q *.py plugins/rdr
          python -m unittest discover -s tests -p 'test_rdr_string_tables.py'
          python -m unittest discover -s tests -p 'test_rdr_rbf.py'
          python tools/verify_rdr_editing.py
          python tools/verify_rdr_cache_reuse_71.py
          python tools/verify_rdr_items_split_issue_19.py
          python tools/verify_rdr_data_map_audit.py
          python tools/verify_rdr_mod_compatibility.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rdr1-plugin-candidate
          path: |
            artifacts/Lexeditor-RDR1-*.zip
            artifacts/rdr1-candidate.json
          retention-days: 7
