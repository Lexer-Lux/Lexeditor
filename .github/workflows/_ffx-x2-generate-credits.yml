name: Generate FFX-X2 credits (temporary)

on:
  push:
    branches: [feature/ffx-x2-plugin]
    paths:
      - 'ui/credits-sources.json'
      - 'games/ffx_x2/THIRD_PARTY.md'
      - '.github/workflows/_ffx-x2-generate-credits.yml'

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/ffx-x2-plugin
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python tools/generate_credits.py
      - name: Commit generated credits
        shell: bash
        run: |
          if git diff --quiet -- ui/credits.json; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ui/credits.json
          git commit -m "Generate FFX-X2 credits"
          git push origin HEAD:feature/ffx-x2-plugin
