name: Audit sensitive PR refs
on:
  push:
    branches: [master]
    paths: [.github/workflows/audit-sensitive-pr-refs.yml]
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: master
          fetch-depth: 1
          submodules: false
      - name: Count pull-request refs that still expose removed issue archives
        run: |
          set -euo pipefail
          git fetch origin '+refs/pull/*/head:refs/pull/*/head' '+refs/pull/*/merge:refs/pull/*/merge' || true
          forbidden='^(worklog/attachments/|worklog/issues/github-[^/]+/(sources/|conversation[.]md$)|worklog/migrations/comment-archive/|worklog/migrations/knowledge-consolidation-2026-09-06/|tools/knowledge_store[.]py$|[.]github/workflows/(knowledge-store|knowledge-final-verification|knowledge-handoff-finalize|human-issue-audit)[.]yml$|[.]github/knowledge-store-request[.]json$|maintenance/human-issue-audit[.]json$)'
          affected=''
          while IFS= read -r ref; do
            if git ls-tree -r --name-only "$ref" | grep -Eq "$forbidden"; then
              n="${ref#refs/pull/}"; n="${n%%/*}"
              affected="$affected $n"
            fi
          done < <(git for-each-ref --format='%(refname)' refs/pull/)
          unique=$(printf '%s\n' $affected | sed '/^$/d' | sort -n -u | tr '\n' ' ')
          count=$(printf '%s\n' $affected | sed '/^$/d' | sort -n -u | wc -l)
          echo "AFFECTED_PR_COUNT=$count"
          echo "AFFECTED_PRS=$unique"
          echo "FIRST_CHANGED_COMMIT=aec078a732c93812860a9395f3efb4227bffb140"
