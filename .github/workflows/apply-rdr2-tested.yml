name: Apply tested RDR2 editor changes
on:
  push:
    branches: [fix/rdr2-issue-batch]
    paths: [.github/workflows/apply-rdr2-tested.yml]
permissions:
  contents: write
jobs:
  apply:
    if: github.repository == 'Lexer-Lux/Lexeditor' && github.ref == 'refs/heads/fix/rdr2-issue-batch'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out the public revision without initializing optional gitlinks
        run: |
          git init .
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git -c protocol.version=2 fetch --depth=1 origin "$GITHUB_SHA"
          git checkout --detach FETCH_HEAD
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify and apply reviewed source patch
        run: |
          python - <<'PY'
          import gzip,hashlib,pathlib,subprocess
          data=gzip.decompress(pathlib.Path('.github/rdr2-tested.patch.gz').read_bytes())
          assert hashlib.sha256(data).hexdigest() == 'd94f57b4f0d8e2958e5a048f5678681a25ee78fe707823977da3b47c341df14c'
          subprocess.run(['git','apply','--check','--index','-'],input=data,check=True)
          subprocess.run(['git','apply','--index','-'],input=data,check=True)
          PY
          git diff --cached --check
      - name: Run synthetic editor regressions
        run: |
          python tests/test_rdr2_issue_repairs.py
          node tests/test_rdr2_boot.js
          python -m compileall -q games/rdr2
      - name: Commit only the staged patch to this isolated branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Fix RDR2 startup caching, complete shell restoration, and alcohol save isolation'
          gh auth setup-git
          git push origin HEAD:refs/heads/fix/rdr2-issue-batch
          git rev-parse HEAD
