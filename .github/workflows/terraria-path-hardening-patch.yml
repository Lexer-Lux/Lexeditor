name: Harden Terraria editor paths

on:
  push:
    branches: [feature/terraria-plugin]
    paths:
      - '.github/workflows/terraria-path-hardening-patch.yml'

permissions:
  contents: write

jobs:
  harden:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply guarded path hardening
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              target = Path(path)
              text = target.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected one anchor, found {count}: {old[:100]!r}')
              target.write_text(text.replace(old, new, 1), encoding='utf-8')

          replace_once(
              'games/terraria/source_text.py',
              '    if (\n        target == project\n        or project not in target.parents\n        or target.suffix.casefold() != ".cs"\n    ):\n        raise ValueError("Invalid C# source path")\n    return target\n',
              '    if (\n        target == project\n        or project not in target.parents\n        or target.suffix.casefold() != ".cs"\n    ):\n        raise ValueError("Invalid C# source path")\n'
              '    parts = target.relative_to(project).parts\n'
              '    if IGNORED_PARTS.intersection(parts) or any(part.startswith(".") for part in parts):\n'
              '        raise ValueError("C# source path is inside an ignored/generated folder")\n'
              '    return target\n',
          )
          replace_once(
              'games/terraria/source_text.py',
              '            path for path in project.rglob("*.cs")\n            if path.is_file() and not IGNORED_PARTS.intersection(path.relative_to(project).parts)\n',
              '            path for path in project.rglob("*.cs")\n'
              '            if path.is_file()\n'
              '            and not IGNORED_PARTS.intersection(path.relative_to(project).parts)\n'
              '            and not any(part.startswith(".") for part in path.relative_to(project).parts)\n',
          )

          replace_once(
              'games/terraria/server.py',
              '    if target == root or root not in target.parents or target.suffix.casefold() != ".hjson":\n        raise ValueError("Invalid localization path")\n    return target\n',
              '    if target == root or root not in target.parents or target.suffix.casefold() != ".hjson":\n'
              '        raise ValueError("Invalid localization path")\n'
              '    parts = target.relative_to(root).parts\n'
              '    ignored = {".git", ".pytest_cache", "__pycache__", "out", "obj", "bin", ".vs"}\n'
              '    if ignored.intersection(parts) or any(part.startswith(".") for part in parts):\n'
              '        raise ValueError("Localization path is inside an ignored/generated folder")\n'
              '    return target\n',
          )
          replace_once(
              'games/terraria/server.py',
              '    ignored = {".git", ".pytest_cache", "__pycache__", "out", "obj", "bin"}\n',
              '    ignored = {".git", ".pytest_cache", "__pycache__", "out", "obj", "bin", ".vs"}\n',
          )
          replace_once(
              'games/terraria/server.py',
              '            if path.is_file() and not ignored.intersection(path.relative_to(root).parts)\n',
              '            if path.is_file()\n'
              '            and not ignored.intersection(path.relative_to(root).parts)\n'
              '            and not any(part.startswith(".") for part in path.relative_to(root).parts)\n',
          )
          PY
          git diff --check
          python -m compileall -q games/terraria plugin_api.py project_manager.py
          python -m unittest discover -s tests -p 'test_terraria_*.py'
          python - <<'PY'
          from pathlib import Path
          html = Path('games/terraria/editor.html').read_text(encoding='utf-8')
          Path('/tmp/terraria-editor.js').write_text(html.split('<script>')[-1].split('</script>',1)[0], encoding='utf-8')
          PY
          node --check /tmp/terraria-editor.js
      - name: Commit hardened paths
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/terraria-path-hardening-patch.yml
          git add games/terraria/source_text.py games/terraria/server.py
          git commit -m 'Harden Terraria editor path boundaries'
          git push origin HEAD:feature/terraria-plugin
