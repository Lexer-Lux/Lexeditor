name: Integrate Terraria logic scaffolds

on:
  push:
    branches: [feature/terraria-plugin]
    paths:
      - '.github/workflows/terraria-logic-scaffolds-patch.yml'

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Add ModSystem and ModPlayer scaffolds
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              target=Path(path); text=target.read_text(encoding='utf-8'); count=text.count(old)
              if count != 1: raise SystemExit(f'{path}: expected one anchor, found {count}: {old[:100]!r}')
              target.write_text(text.replace(old,new,1),encoding='utf-8')

          logic_code = '''\n\ndef render_mod_system_source(mod_name: str, class_name: str) -> str:\n    return (\n        "using Terraria.ModLoader;\\n\\n"\n        f"namespace {mod_name}.Common.Systems;\\n\\n"\n        f"public sealed class {class_name} : ModSystem\\n"\n        "{\\n"\n        "}\\n"\n    )\n\n\ndef render_mod_player_source(mod_name: str, class_name: str) -> str:\n    return (\n        "using Terraria.ModLoader;\\n\\n"\n        f"namespace {mod_name}.Common.Players;\\n\\n"\n        f"public sealed class {class_name} : ModPlayer\\n"\n        "{\\n"\n        "}\\n"\n    )\n\n\ndef _create_logic_type(root: Path, name: object, *, kind: str, folder: str, renderer) -> dict:\n    project = Path(root).resolve()\n    if not project.is_dir():\n        raise ValueError("Terraria source project does not exist")\n    mod_name = validate_content_name(project.name)\n    class_name = validate_content_name(name)\n    relative = f"Common/{folder}/{class_name}.cs"\n    source = create_source(project, relative, renderer(mod_name, class_name))\n    return {"kind": kind, "name": class_name, "source": source}\n\n\ndef create_mod_system(root: Path, name: object) -> dict:\n    return _create_logic_type(root, name, kind="system", folder="Systems", renderer=render_mod_system_source)\n\n\ndef create_mod_player(root: Path, name: object) -> dict:\n    return _create_logic_type(root, name, kind="player", folder="Players", renderer=render_mod_player_source)\n'''
          replace_once(
              'games/terraria/content_wizard.py',
              '\ndef _png_chunk(kind: bytes, payload: bytes) -> bytes:\n',
              logic_code + '\n\ndef _png_chunk(kind: bytes, payload: bytes) -> bytes:\n',
          )

          replace_once(
              'games/terraria/server.py',
              'from .content_wizard import create_mod_item\n',
              'from .content_wizard import create_mod_item, create_mod_player, create_mod_system\n',
          )
          replace_once(
              'games/terraria/server.py',
              'def _installation_root() -> Path:\n',
              'def create_content_system(name: object) -> dict:\n'
              '    return create_mod_system(project_root(), name)\n\n\n'
              'def create_content_player(name: object) -> dict:\n'
              '    return create_mod_player(project_root(), name)\n\n\n'
              'def _installation_root() -> Path:\n',
          )
          replace_once(
              'games/terraria/server.py',
              '            if path == "/api/content/item":\n',
              '            if path == "/api/content/system":\n'
              '                payload = self.read_json()\n'
              '                if not isinstance(payload, dict) or set(payload) != {"name"}:\n'
              '                    raise ValueError("Expected name only")\n'
              '                self.send_json(create_content_system(payload["name"]))\n'
              '                return\n'
              '            if path == "/api/content/player":\n'
              '                payload = self.read_json()\n'
              '                if not isinstance(payload, dict) or set(payload) != {"name"}:\n'
              '                    raise ValueError("Expected name only")\n'
              '                self.send_json(create_content_player(payload["name"]))\n'
              '                return\n'
              '            if path == "/api/content/item":\n',
          )

          replace_once(
              'games/terraria/editor.html',
              '  let contentCreating=false,contentName="",contentDisplay="",contentTooltip="",contentResult=null,error="";\n',
              '  let contentCreating=false,contentKind="item",contentName="",contentDisplay="",contentTooltip="",contentResult=null,error="";\n',
          )
          old_create = '''  async function createContentItem(){\n    if(contentCreating||dirtyCount())return;\n    const name=contentName.trim();if(!name){error="Enter an internal item name.";render();return}\n    contentCreating=true;contentResult=null;error="";render();\n    try{\n      const result=await request("/api/content/item",{method:"POST",body:JSON.stringify({name,displayName:contentDisplay,tooltip:contentTooltip})});\n      const [source,localization,assets,map,locState]=await Promise.all([\n        request("/api/source"),request("/api/localization"),request("/api/assets"),request("/api/data-map"),\n        request(`/api/localization/file?path=${encodeURIComponent(result.localizationPath)}`),\n      ]);\n      sourceFiles=source.files;localizationFiles=localization.files;assetFiles=assets.files;mapRows=map.rows;\n      sourceSaved=clone(result.source);sourceCurrent=clone(result.source);locSaved=clone(locState);locCurrent=clone(locState);assetCurrent=result.texture;\n      contentResult=result;contentName="";contentDisplay="";contentTooltip="";\n    }catch(exc){error=String(exc.message||exc)}\n    contentCreating=false;render();\n  }\n'''
          new_create = '''  async function createContentScaffold(){\n    if(contentCreating||dirtyCount())return;\n    const name=contentName.trim();if(!name){error="Enter an internal content name.";render();return}\n    contentCreating=true;contentResult=null;error="";render();\n    try{\n      const endpoint=contentKind==="system"?"/api/content/system":contentKind==="player"?"/api/content/player":"/api/content/item";\n      const body=contentKind==="item"?{name,displayName:contentDisplay,tooltip:contentTooltip}:{name};\n      const result=await request(endpoint,{method:"POST",body:JSON.stringify(body)});\n      const [source,localization,assets,map]=await Promise.all([request("/api/source"),request("/api/localization"),request("/api/assets"),request("/api/data-map")]);\n      sourceFiles=source.files;localizationFiles=localization.files;assetFiles=assets.files;mapRows=map.rows;\n      sourceSaved=clone(result.source);sourceCurrent=clone(result.source);\n      if(result.localizationPath){const locState=await request(`/api/localization/file?path=${encodeURIComponent(result.localizationPath)}`);locSaved=clone(locState);locCurrent=clone(locState)}\n      if(result.texture)assetCurrent=result.texture;\n      contentResult=result;contentName="";contentDisplay="";contentTooltip="";\n    }catch(exc){error=String(exc.message||exc)}\n    contentCreating=false;render();\n  }\n'''
          replace_once('games/terraria/editor.html', old_create, new_create)

          start='  function contentPanel(){\n'
          end='  function addLocalizationEntry(){\n'
          editor=Path('games/terraria/editor.html'); text=editor.read_text(encoding='utf-8')
          a=text.find(start); b=text.find(end,a)
          if a<0 or b<0: raise SystemExit('contentPanel anchors not found')
          new_panel = r'''  function contentPanel(){
    const locked=contentCreating||dirtyCount()>0;
    const typeSelect=el("select",{disabled:locked,onchange:event=>{contentKind=event.target.value;contentResult=null;render()}},
      ...[["item","ModItem"],["system","ModSystem"],["player","ModPlayer"]].map(([value,label])=>{const option=el("option",{value},label);option.selected=contentKind===value;return option}));
    const itemOnly=contentKind==="item";
    const form=el("div",{class:"terraria-note terraria-content-form"},
      el("strong",{},"New scaffold"),typeSelect,
      el("input",{type:"text",value:contentName,placeholder:itemOnly?"Internal name (ExampleSword)":contentKind==="system"?"Class name (WorldTracker)":"Class name (ExamplePlayer)",disabled:locked,oninput:event=>{contentName=event.target.value}}),
      el("input",{type:"text",value:contentDisplay,placeholder:"Display name (optional)",disabled:locked||!itemOnly,oninput:event=>{contentDisplay=event.target.value}}),
      el("input",{type:"text",value:contentTooltip,placeholder:"Tooltip (optional, one line)",disabled:locked||!itemOnly,oninput:event=>{contentTooltip=event.target.value}}),
      el("button",{class:"terraria-build-button",type:"button",disabled:locked,onclick:createContentScaffold},contentCreating?"CREATING…":"CREATE"));
    const explanation=itemOnly
      ?"ModItem creates minimal C#, standard en-US DisplayName/optional Tooltip localization, and a conspicuous 16×16 placeholder PNG. It intentionally does not invent damage, recipes, rarity, use style, or balance values."
      :contentKind==="system"
        ?"ModSystem creates an empty Common/Systems class against the current stable ModSystem API. Add hooks explicitly in Source."
        :"ModPlayer creates an empty Common/Players class against the current stable ModPlayer API. Add player hooks explicitly in Source.";
    const notes=[el("div",{class:"terraria-note"},explanation)];
    if(contentResult){
      const details=[el("strong",{},`${contentResult.name} created.`),el("div",{class:"terraria-build-path"},`Source: ${contentResult.source.path}`)];
      if(contentResult.texture)details.push(el("div",{class:"terraria-build-path"},`Texture: ${contentResult.texture.path}`));
      if(contentResult.localizationPath)details.push(el("div",{class:"terraria-build-path"},`Localization: ${contentResult.localizationPath}`));
      notes.unshift(el("div",{class:"terraria-note terraria-success"},...details));
    }
    return el("div",{class:"terraria-page"},...warnings(),form,...notes);
  }
'''
          editor.write_text(text[:a]+new_panel+text[b:],encoding='utf-8')

          replace_once(
              'codex/terraria/README.md',
              'This is scaffolding, not a structured `ModItem` property editor. Other content families such as ModNPC/ModProjectile/ModTile are not generated yet.\n',
              'The same Content tab also creates empty `ModSystem` and `ModPlayer` scaffolds under `Common/Systems` and `Common/Players`. These two logic-oriented types need no guessed assets, localization, stats, AI or hook implementations; hooks are added explicitly in Source. Current stable tModLoader/ExampleMod was checked for both base classes before exposing them.\n\nThis is scaffolding, not a structured property editor. Gameplay-heavy families such as ModNPC/ModProjectile/ModTile are not generated yet.\n',
          )
          PY
          git diff --check
          python -m compileall -q games/terraria plugin_api.py project_manager.py
          python -m unittest discover -s tests -p 'test_terraria_*.py'
          python - <<'PY'
          from pathlib import Path
          html=Path('games/terraria/editor.html').read_text(encoding='utf-8')
          Path('/tmp/terraria-editor.js').write_text(html.split('<script>')[-1].split('</script>',1)[0],encoding='utf-8')
          PY
          node --check /tmp/terraria-editor.js
      - name: Commit integrated logic scaffolds
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/terraria-logic-scaffolds-patch.yml
          git add games/terraria/content_wizard.py games/terraria/server.py games/terraria/editor.html codex/terraria/README.md
          git commit -m 'Add Terraria ModSystem and ModPlayer scaffolds'
          git push origin HEAD:feature/terraria-plugin
