name: Shared UI contract

on:
  push:
    branches: [master]
    paths:
      - 'ui/**'
      - 'plugins/**/plugin.py'
      - 'plugins/**/credits.md'
      - 'plugins/**/editor.html'
      - 'app.py'
      - 'desktop_host.py'
      - 'github_integration.py'
      - 'plugin_api.py'
      - 'plugin_metadata.py'
      - 'settings_manager.py'
      - 'docs/ADDING_A_GAME.md'
      - 'ui/component-catalog.js'
      - 'tests/test_global_developer_mode.py'
      - 'tests/test_home_restart.py'
      - 'tests/test_app_update.py'
      - 'tests/test_absent_game.py'
      - 'app_update.py'
      - 'game_installation.py'
      - 'tests/test_global_followup.py'
      - 'tests/test_global_issues.py'
      - 'tools/generate_credits.py'
      - 'tools/verify_shared_ui_contract.py'
      - '.github/workflows/shared-ui-contract.yml'
  pull_request:
    paths:
      - 'ui/**'
      - 'plugins/**/plugin.py'
      - 'plugins/**/credits.md'
      - 'plugins/**/editor.html'
      - 'app.py'
      - 'desktop_host.py'
      - 'github_integration.py'
      - 'plugin_api.py'
      - 'plugin_metadata.py'
      - 'settings_manager.py'
      - 'docs/ADDING_A_GAME.md'
      - 'ui/component-catalog.js'
      - 'tests/test_global_developer_mode.py'
      - 'tests/test_home_restart.py'
      - 'tests/test_app_update.py'
      - 'tests/test_absent_game.py'
      - 'app_update.py'
      - 'game_installation.py'
      - 'tests/test_global_followup.py'
      - 'tests/test_global_issues.py'
      - 'tools/generate_credits.py'
      - 'tools/verify_shared_ui_contract.py'
      - '.github/workflows/shared-ui-contract.yml'

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Shared UI contract
        run: python tools/verify_shared_ui_contract.py
      - name: Install global regression dependency
        run: python -m pip install pillow
      - name: Global unit regressions
        run: python -m unittest tests.test_global_issues tests.test_global_followup tests.test_global_developer_mode tests.test_home_restart tests.test_app_update tests.test_absent_game -v
      - name: Plugin documentation metadata
        run: |
          python plugin_metadata.py
          python tools/generate_credits.py --check
      - name: JavaScript syntax
        run: node --check ui/framework.js
      - name: Python syntax
        run: python -m py_compile app.py desktop_host.py github_integration.py plugin_api.py plugin_metadata.py settings_manager.py tests/test_global_developer_mode.py tests/test_global_followup.py tests/test_global_issues.py tools/generate_credits.py
