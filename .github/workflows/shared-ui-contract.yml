name: Shared UI contract

on:
  push:
    branches: [master]
    paths:
      - 'ui/**'
      - 'games/**/plugin.py'
      - 'games/**/credits.json'
      - 'games/**/editor.html'
      - 'app.py'
      - 'desktop_host.py'
      - 'github_integration.py'
      - 'plugin_api.py'
      - 'plugin_metadata.py'
      - 'settings_manager.py'
      - 'docs/ADDING_A_GAME.md'
      - 'docs/UI-MANUAL.md'
      - 'worklog/acceptance/warband/**'
      - 'tools/generate_credits.py'
      - 'tools/verify_shared_ui_contract.py'
      - '.github/workflows/shared-ui-contract.yml'
  pull_request:
    paths:
      - 'ui/**'
      - 'games/**/plugin.py'
      - 'games/**/credits.json'
      - 'games/**/editor.html'
      - 'app.py'
      - 'desktop_host.py'
      - 'github_integration.py'
      - 'plugin_api.py'
      - 'plugin_metadata.py'
      - 'settings_manager.py'
      - 'docs/ADDING_A_GAME.md'
      - 'docs/UI-MANUAL.md'
      - 'worklog/acceptance/warband/**'
      - 'tools/generate_credits.py'
      - 'tools/verify_shared_ui_contract.py'
      - '.github/workflows/shared-ui-contract.yml'

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Shared UI contract
        run: python tools/verify_shared_ui_contract.py
      - name: Plugin documentation metadata
        run: |
          python plugin_metadata.py
          python tools/generate_credits.py --check
      - name: JavaScript syntax
        run: node --check ui/framework.js
      - name: Python syntax
        run: python -m py_compile app.py desktop_host.py github_integration.py plugin_api.py plugin_metadata.py settings_manager.py tools/generate_credits.py
