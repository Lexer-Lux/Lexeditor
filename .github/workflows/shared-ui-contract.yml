name: Shared UI contract

on:
  push:
    branches: [master]
    paths:
      - 'ui/**'
      - 'games/blank/**'
      - 'games/warband/editor.html'
      - 'desktop_host.py'
      - 'github_integration.py'
      - 'plugin_api.py'
      - 'settings_manager.py'
      - 'docs/UI-MANUAL.md'
      - 'worklog/acceptance/warband/**'
      - 'tools/verify_shared_ui_contract.py'
      - '.github/workflows/shared-ui-contract.yml'
  pull_request:
    paths:
      - 'ui/**'
      - 'games/blank/**'
      - 'games/warband/editor.html'
      - 'desktop_host.py'
      - 'github_integration.py'
      - 'plugin_api.py'
      - 'settings_manager.py'
      - 'docs/UI-MANUAL.md'
      - 'worklog/acceptance/warband/**'
      - 'tools/verify_shared_ui_contract.py'
      - '.github/workflows/shared-ui-contract.yml'

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Shared UI contract
        run: python tools/verify_shared_ui_contract.py
      - name: JavaScript syntax
        run: node --check ui/framework.js
      - name: Python syntax
        run: python -m py_compile desktop_host.py github_integration.py plugin_api.py settings_manager.py
