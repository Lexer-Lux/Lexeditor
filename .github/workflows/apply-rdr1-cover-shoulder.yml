name: Apply RDR1 cover shoulder-swap fix
on:
  push:
    branches: [fix/rdr1-cover-shoulder-swap]
    paths: ['.github/workflows/apply-rdr1-cover-shoulder.yml']
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Apply exact integration
        run: python .github/rdr1-cover-shoulder-edit.py
      - name: Verify before commit
        run: |
          python -m compileall -q games/rdr
          python tools/verify_rdr_cover_shoulder.py
          python tools/verify_rdr_editing.py
          git diff --check
      - name: Commit source and remove one-shot staging
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add games/rdr/server.py games/rdr/camera_features.py tools/verify_rdr_cover_shoulder.py .github/workflows/rdr1-checks.yml
          git rm .github/rdr1-cover-shoulder-edit.py .github/workflows/apply-rdr1-cover-shoulder.yml
          git commit -m "feat(rdr1): enable shoulder swapping in cover through camera data"
          git push origin HEAD:fix/rdr1-cover-shoulder-swap
