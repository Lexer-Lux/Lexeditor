name: FF7 searchable references one-shot

on:
  push:
    branches: [fix/ff7-full-semantic-editor]
    paths:
      - '.github/workflows/ff7-searchable-references-one-shot.yml'

permissions:
  contents: write

jobs:
  commit-tested-production:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/ff7-full-semantic-editor
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Reproduce the already-green production delta
        run: |
          python tools/_ff7_searchable_reference_patch.py
          python tools/_ff7_searchable_reference_test_fix.py
          python tools/verify_ff7_semantic_surface.py
      - name: Commit production and regression files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add games/ff7/editor.html games/ff7/semantics.py games/ff7/kernel.py tools/verify_ff7_rendered_neutral.py tools/verify_ff7_semantic_surface.py
          git diff --cached --check
          git commit -m 'Make FF7 semantic references searchable and navigable'
          git push origin HEAD:fix/ff7-full-semantic-editor
