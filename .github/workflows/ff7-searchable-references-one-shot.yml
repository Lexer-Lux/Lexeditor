name: FF7 semantic editor clean transplant

on:
  push:
    branches: [fix/ff7-full-semantic-editor]
    paths:
      - '.github/workflows/ff7-searchable-references-one-shot.yml'

permissions:
  contents: write

jobs:
  transplant-tested-semantic-editor:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/ff7-semantic-editor-final
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Copy only tested FF7 semantic production and regression files
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin fix/ff7-full-semantic-editor
          git checkout origin/fix/ff7-full-semantic-editor -- \
            games/ff7/battle.py \
            games/ff7/datasets.py \
            games/ff7/editor.html \
            games/ff7/extended.py \
            games/ff7/kernel.py \
            games/ff7/semantics.py \
            tools/verify_ff7_accessories.py \
            tools/verify_ff7_semantic_surface.py \
            tools/verify_ff7_rendered.py \
            tools/verify_ff7_rendered_neutral.py \
            tools/verify_ff7_ui.py \
            tools/verify_ff7_ui_neutral.py
          rm -f games/ff7/.semantic-pass-marker
      - name: Keep semantic reference presentation in the shared neutral layer
        shell: python
        run: |
          from pathlib import Path
          editor_path = Path('games/ff7/editor.html')
          editor = editor_path.read_text(encoding='utf-8')
          start = editor.find('  <style>\n    .lex-semantic-reference-control')
          if start >= 0:
              end = editor.find('  </style>\n', start)
              if end < 0:
                  raise SystemExit('semantic reference style block is unterminated')
              editor = editor[:start] + editor[end + len('  </style>\n'):]
          if '<style>' in editor or 'style=' in editor:
              raise SystemExit('FF7 editor still contains local CSS')
          editor_path.write_text(editor, encoding='utf-8')

          css_path = Path('ui/neutral.css')
          css = css_path.read_text(encoding='utf-8').rstrip() + '\n'
          marker = '.lex-neutral-ui .lex-semantic-reference-control'
          if marker not in css:
              css += '''\n/* Shared semantic reference picker: search, entity selection and record navigation. */\n.lex-neutral-ui .lex-semantic-reference-control{display:grid;grid-template-columns:2rem minmax(8rem,.8fr) minmax(11rem,1.2fr);align-items:center;gap:6px;width:100%;min-width:0}\n.lex-neutral-ui .lex-semantic-reference-control:not(.searchable){grid-template-columns:2rem minmax(0,1fr)}\n.lex-neutral-ui .lex-semantic-reference-control input,.lex-neutral-ui .lex-semantic-reference-control select{width:100%;min-width:0}\n.lex-neutral-ui .lex-semantic-reference-open{display:grid;width:2rem;height:2rem;min-width:2rem;padding:0;place-items:center;font:inherit;line-height:1}\n@media(max-width:860px){.lex-neutral-ui .lex-semantic-reference-control.searchable{grid-template-columns:2rem minmax(0,1fr)}.lex-neutral-ui .lex-semantic-reference-control.searchable .lex-semantic-reference-search{grid-column:1/-1;grid-row:1}.lex-neutral-ui .lex-semantic-reference-control.searchable .lex-semantic-reference-open{grid-row:2}.lex-neutral-ui .lex-semantic-reference-control.searchable select{grid-row:2}}\n'''
          css_path.write_text(css, encoding='utf-8')
      - name: Verify semantic and Blank UI contracts before commit
        run: |
          python tools/verify_ff7_semantic_surface.py
          python tools/verify_ff7_blank_ui.py
      - name: Commit clean production and regression delta
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add games/ff7/battle.py games/ff7/datasets.py games/ff7/editor.html games/ff7/extended.py games/ff7/kernel.py games/ff7/semantics.py ui/neutral.css tools/verify_ff7_accessories.py tools/verify_ff7_semantic_surface.py tools/verify_ff7_rendered.py tools/verify_ff7_rendered_neutral.py tools/verify_ff7_ui.py tools/verify_ff7_ui_neutral.py
          git add -u games/ff7/.semantic-pass-marker || true
          git diff --cached --check
          git commit -m 'Humanize the full FF7 editor surface'
          git push origin HEAD:fix/ff7-semantic-editor-final
