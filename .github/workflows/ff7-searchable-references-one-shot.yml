name: FF7 searchable references one-shot

on:
  push:
    branches: [fix/ff7-full-semantic-editor]
    paths:
      - '.github/workflows/ff7-searchable-references-one-shot.yml'

permissions:
  contents: write

jobs:
  patch-test-and-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/ff7-full-semantic-editor
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Apply searchable reference UX patch
        run: python tools/_ff7_searchable_reference_patch.py
      - name: Verify semantic metadata and binary preservation
        run: python tools/verify_ff7_semantic_surface.py
      - name: Install Chromium test dependency
        run: |
          python -m pip install playwright==1.57.0
          python -m playwright install --with-deps chromium
      - name: Run real shared FF7 UI acceptance
        run: python tools/verify_ff7_rendered_neutral.py
      - name: Run component browser regressions
        run: python tools/verify_ff7_ui_neutral.py
      - name: Commit searchable reference UX
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add games/ff7/editor.html games/ff7/semantics.py games/ff7/kernel.py tools/verify_ff7_rendered_neutral.py tools/verify_ff7_semantic_surface.py .github/workflows/ff7-data-regressions.yml
          git diff --cached --check
          git commit -m 'Make FF7 semantic references searchable and navigable'
          git push origin HEAD:fix/ff7-full-semantic-editor
