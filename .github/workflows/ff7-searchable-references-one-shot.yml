name: FF7 formation semantics transplant

on:
  push:
    branches: [fix/ff7-full-semantic-editor]
    paths:
      - '.github/workflows/ff7-searchable-references-one-shot.yml'

permissions:
  contents: write

jobs:
  humanize-formations:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/ff7-formation-semantics
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Fetch staging patch only
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin fix/ff7-full-semantic-editor
          git show origin/fix/ff7-full-semantic-editor:tools/_ff7_formation_semantics_patch.py > /tmp/ff7_formation_patch.py
      - name: Promote documented formation storage to game-facing controls
        run: python /tmp/ff7_formation_patch.py
      - name: Verify focused semantic and binary contracts
        run: |
          python tools/verify_ff7_semantic_surface.py
          python tools/verify_ff7_blank_ui.py
      - name: Commit tested formation semantics
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add games/ff7/semantics.py tools/verify_ff7_semantic_surface.py
          git commit -m 'Humanize FF7 formation and battle setup controls'
          git push origin HEAD:fix/ff7-formation-semantics
