name: Shared UI visual acceptance

on:
  push:
    branches:
      - master
    paths:
      - 'ui/**'
      - 'plugins/*/editor.css'
      - 'tools/text_clipping_probe.js'
      - 'tools/verify_text_clipping.py'
      - 'tests/test_text_clipping.py'
      - 'tests/test_shared_ui_feedback.py'
      - 'tests/test_rdr2_item_name.py'
      - 'tests/test_tweak_overflow_access.py'
      - 'tests/test_pager_row_size.py'
      - 'tests/test_navigation_density.py'
      - 'tests/rdr2_browser_check.py'
      - 'plugins/rdr2/*.js'
      - 'plugins/blank/**'
      - 'plugins/warband/editor.html'
      - 'plugins/rdr/editor.html'
      - 'plugins/ff8/cards_ui.js'
      - 'plugins/ff8/party.js'
      - 'tests/test_ff8_gf_attack_tab.py'
      - 'tests/test_ff8_gf_slot_sort.py'
      - 'tests/test_ff8_spellbook_lock.py'
      - 'desktop_host.py'
      - 'github_integration.py'
      - 'plugin_api.py'
      - 'settings_manager.py'
      - 'ui/component-catalog.js'
      - '.github/scripts/ui_visual_acceptance.py'
      - 'tests/global_browser_check.py'
      - 'tests/global_controls_check.py'
      - 'tests/home_restart_browser_check.py'
      - 'tests/dev_quotes_browser_check.py'
      - 'tests/app_update_browser_check.py'
      - 'tests/rdr_browser_check.py'
      - 'tests/ff8_graph_design_a_browser_check.py'
      - 'tests/ff8_spellbook_tabs_browser_check.py'
      - '.github/workflows/ui-visual-acceptance.yml'
  pull_request:
    paths:
      - 'ui/**'
      - 'plugins/*/editor.css'
      - 'tools/text_clipping_probe.js'
      - 'tools/verify_text_clipping.py'
      - 'tests/test_text_clipping.py'
      - 'tests/test_shared_ui_feedback.py'
      - 'tests/test_rdr2_item_name.py'
      - 'tests/test_tweak_overflow_access.py'
      - 'tests/test_pager_row_size.py'
      - 'tests/test_navigation_density.py'
      - 'tests/rdr2_browser_check.py'
      - 'plugins/rdr2/*.js'
      - 'plugins/blank/**'
      - 'plugins/warband/editor.html'
      - 'plugins/rdr/editor.html'
      - 'plugins/ff8/cards_ui.js'
      - 'plugins/ff8/party.js'
      - 'tests/test_ff8_gf_attack_tab.py'
      - 'tests/test_ff8_gf_slot_sort.py'
      - 'tests/test_ff8_spellbook_lock.py'
      - 'desktop_host.py'
      - 'github_integration.py'
      - 'plugin_api.py'
      - 'settings_manager.py'
      - 'ui/component-catalog.js'
      - '.github/scripts/ui_visual_acceptance.py'
      - 'tests/global_browser_check.py'
      - 'tests/global_controls_check.py'
      - 'tests/home_restart_browser_check.py'
      - 'tests/dev_quotes_browser_check.py'
      - 'tests/app_update_browser_check.py'
      - 'tests/rdr_browser_check.py'
      - 'tests/ff8_graph_design_a_browser_check.py'
      - 'tests/ff8_spellbook_tabs_browser_check.py'
      - '.github/workflows/ui-visual-acceptance.yml'

permissions:
  contents: read

jobs:
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install browser tools
        run: |
          python -m pip install playwright Pillow pytest
          python -m playwright install --with-deps chromium
      - name: Shared Blank acceptance
        run: python .github/scripts/ui_visual_acceptance.py out/ui-visual-acceptance
      - name: Text clipping regression gate
        env:
          LEXEDITOR_TEST_OUTPUT: out/text-clipping
        run: python tools/verify_text_clipping.py
      - name: Item name display and editing
        run: python -m pytest -q tests/test_rdr2_item_name.py
      - name: Tweak overflow controls remain reachable
        run: python -m pytest -q tests/test_tweak_overflow_access.py
      - name: Rows control text size
        run: python -m pytest -q tests/test_pager_row_size.py
      - name: Selection pointer clears label icons
        run: python -m pytest -q tests/test_navigation_density.py -k row_pointer
      - name: Global rendered browser regression
        env:
          LEXEDITOR_TEST_OUTPUT: out/global-browser
        run: python tests/global_browser_check.py
      - name: Global shared-control browser regression
        run: python tests/global_controls_check.py
      - name: Home restart browser regression
        run: python tests/home_restart_browser_check.py
      - name: Developer quotes browser regression
        run: python tests/dev_quotes_browser_check.py
      - name: App update browser regression
        run: python tests/app_update_browser_check.py out/app-update-browser
      - name: Data Map browser regression
        run: python tests/data_map_browser_check.py out/data-map-browser
      - name: RDR1 shared Detail acceptance
        run: python tests/rdr_browser_check.py --screenshots out/rdr-browser
      - name: FF8 graph design A acceptance
        run: python tests/ff8_graph_design_a_browser_check.py out/ff8-graph-design-a
      - name: GF ability icons and spellbook tabs
        run: python tests/ff8_spellbook_tabs_browser_check.py
      - name: GF attack tab routing
        run: python -m pytest -q tests/test_ff8_gf_attack_tab.py tests/test_ff8_spellbook_lock.py tests/test_ff8_gf_slot_sort.py
      - name: Developer helper browser regression
        run: python tests/wse2_helper_browser_check.py out/wse2-helper-browser
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ui-visual-acceptance
          path: |
            out/ui-visual-acceptance
            out/text-clipping
            out/app-update-browser
            out/global-browser
            out/global-controls
            out/data-map-browser
            out/rdr-browser
            out/ff8-graph-design-a
            out/wse2-helper-browser
          if-no-files-found: warn
