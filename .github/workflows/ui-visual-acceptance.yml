name: Shared UI visual acceptance

on:
  push:
    branches:
      - master
    paths:
      - 'ui/**'
      - 'games/blank/**'
      - 'games/warband/editor.html'
      - 'games/rdr/editor.html'
      - 'games/ff8/cards_ui.js'
      - 'desktop_host.py'
      - 'github_integration.py'
      - 'plugin_api.py'
      - 'settings_manager.py'
      - 'docs/UI-MANUAL.md'
      - '.github/scripts/ui_visual_acceptance.py'
      - 'tests/global_browser_check.py'
      - 'tests/global_controls_check.py'
      - 'tests/rdr_browser_check.py'
      - 'tests/ff8_graph_design_a_browser_check.py'
      - '.github/workflows/ui-visual-acceptance.yml'
  pull_request:
    paths:
      - 'ui/**'
      - 'games/blank/**'
      - 'games/warband/editor.html'
      - 'games/rdr/editor.html'
      - 'games/ff8/cards_ui.js'
      - 'desktop_host.py'
      - 'github_integration.py'
      - 'plugin_api.py'
      - 'settings_manager.py'
      - 'docs/UI-MANUAL.md'
      - '.github/scripts/ui_visual_acceptance.py'
      - 'tests/global_browser_check.py'
      - 'tests/global_controls_check.py'
      - 'tests/rdr_browser_check.py'
      - 'tests/ff8_graph_design_a_browser_check.py'
      - '.github/workflows/ui-visual-acceptance.yml'

permissions:
  contents: read

jobs:
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install browser tools
        run: |
          python -m pip install playwright Pillow
          python -m playwright install --with-deps chromium
      - name: Shared Blank acceptance
        run: python .github/scripts/ui_visual_acceptance.py out/ui-visual-acceptance
      - name: Global rendered browser regression
        env:
          LEXEDITOR_TEST_OUTPUT: out/global-browser
        run: python tests/global_browser_check.py
      - name: Global shared-control browser regression
        run: python tests/global_controls_check.py
      - name: Data Map browser regression
        run: python tests/data_map_browser_check.py out/data-map-browser
      - name: RDR1 shared Detail acceptance
        run: python tests/rdr_browser_check.py --screenshots out/rdr-browser
      - name: FF8 graph design A acceptance
        run: python tests/ff8_graph_design_a_browser_check.py out/ff8-graph-design-a
      - name: Developer helper browser regression
        run: python tests/wse2_helper_browser_check.py out/wse2-helper-browser
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ui-visual-acceptance
          path: |
            out/ui-visual-acceptance
            out/global-browser
            out/global-controls
            out/data-map-browser
            out/rdr-browser
            out/ff8-graph-design-a
            out/wse2-helper-browser
          if-no-files-found: warn
