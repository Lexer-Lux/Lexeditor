name: Bannerlord credits regenerate

on:
  push:
    branches: [feature/bannerlord-plugin]
    paths:
      - 'ui/credits-sources.json'
      - '.github/workflows/bannerlord-credits-regenerate.yml'

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/bannerlord-plugin
      - name: Regenerate credits
        run: python tools/generate_credits.py
      - name: Commit generated credits
        run: |
          if git diff --quiet -- ui/credits.json; then
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add ui/credits.json
          git commit -m "Regenerate credits metadata"
          git push origin HEAD:feature/bannerlord-plugin
