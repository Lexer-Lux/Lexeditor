name: Temporary Bannerlord dependency precedence fix

on:
  push:
    branches: [feature/bannerlord-plugin]
    paths:
      - '.github/workflows/temp-bannerlord-dependency-precedence.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/bannerlord-plugin
      - name: Apply ModuleManager distinct-precedence resolver
        shell: python
        run: |
          from pathlib import Path

          def replace_once(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected one match, found {count}")
              return text.replace(old, new, 1)

          path = Path("games/bannerlord/game_launch.py")
          text = path.read_text(encoding="utf-8")

          old = '''    def community(module_id: str) -> list[dict]:
        if module_id not in community_cache:
            folder = modules.get(module_id)
            if folder is None:
                raise RuntimeError(f"Required Bannerlord dependency is not installed: {module_id}")
            community_cache[module_id] = read_community_dependencies(folder / "SubModule.xml")
        return community_cache[module_id]

    included: set[str] = set()
'''
          new = '''    def community(module_id: str) -> list[dict]:
        if module_id not in community_cache:
            folder = modules.get(module_id)
            if folder is None:
                raise RuntimeError(f"Required Bannerlord dependency is not installed: {module_id}")
            community_cache[module_id] = read_community_dependencies(folder / "SubModule.xml")
        return community_cache[module_id]

    def dependencies_to_load(module_id: str) -> list[dict]:
        """Mirror ModuleManager DependenciesToLoadDistinct first-ID-wins precedence."""
        result: list[dict] = []
        seen: set[str] = set()

        for row in community(module_id):
            dependency_id = str(row.get("id") or "").strip()
            if not dependency_id or row.get("incompatible") or dependency_id in seen:
                continue
            seen.add(dependency_id)
            result.append(row)

        for row in metadata(module_id).get("dependencies", []):
            dependency_id = str(row.get("id") or "").strip()
            if not dependency_id or dependency_id in seen:
                continue
            seen.add(dependency_id)
            result.append(
                {
                    "id": dependency_id,
                    "order": "LoadBeforeThis",
                    "optional": bool(row.get("optional")),
                    "incompatible": False,
                    "source": "native",
                }
            )

        for row in metadata(module_id).get("modulesToLoadAfterThis", []):
            dependency_id = str(row.get("id") or "").strip()
            if not dependency_id or dependency_id in seen:
                continue
            seen.add(dependency_id)
            result.append(
                {
                    "id": dependency_id,
                    "order": "LoadAfterThis",
                    # ModuleInfoExtended parses ModulesToLoadAfterThis as optional:
                    # it constrains an already-enabled target without enabling it.
                    "optional": True,
                    "incompatible": False,
                    "source": "native-load-after",
                }
            )
        return result

    def incompatible_relations(module_id: str) -> list[str]:
        """Mirror DependenciesIncompatiblesDistinct first-ID-wins precedence."""
        result: list[str] = []
        seen: set[str] = set()
        for row in community(module_id):
            dependency_id = str(row.get("id") or "").strip()
            if not dependency_id or not row.get("incompatible") or dependency_id in seen:
                continue
            seen.add(dependency_id)
            result.append(dependency_id)
        for row in metadata(module_id).get("incompatibleModules", []):
            dependency_id = str(row.get("id") or "").strip()
            if not dependency_id or dependency_id in seen:
                continue
            seen.add(dependency_id)
            result.append(dependency_id)
        return result

    included: set[str] = set()
'''
          text = replace_once(text, old, new, "resolver helper insertion")

          old = '''        visiting.add(module_id)
        community_rows = community(module_id)
        # Bannerlord.ModuleManager's DependenciesToLoadDistinct yields community
        # non-incompatible metadata before native dependency rows. Match that
        # precedence when deciding whether a duplicated dependency is required.
        community_dependency_ids = {
            str(row.get("id") or "").strip()
            for row in community_rows
            if not row.get("incompatible") and str(row.get("id") or "").strip()
        }
        for dependency in metadata(module_id).get("dependencies", []):
            dependency_id = str(dependency.get("id") or "").strip()
            if (
                not dependency_id
                or dependency_id in community_dependency_ids
                or dependency.get("optional")
            ):
                continue
            include_required(dependency_id)
        for dependency in community_rows:
            dependency_id = str(dependency.get("id") or "").strip()
            if not dependency_id or dependency.get("optional") or dependency.get("incompatible"):
                continue
            include_required(dependency_id)
        visiting.remove(module_id)
'''
          new = '''        visiting.add(module_id)
        for dependency in dependencies_to_load(module_id):
            dependency_id = str(dependency.get("id") or "").strip()
            if not dependency_id or dependency.get("optional"):
                continue
            include_required(dependency_id)
        visiting.remove(module_id)
'''
          text = replace_once(text, old, new, "required closure")

          old = '''    conflicts = []
    for module_id in list(included):
        model = metadata(module_id)
        for dependency in model.get("dependencies", []):
            dependency_id = str(dependency.get("id") or "").strip()
            if dependency_id in included:
                add_edge(dependency_id, module_id)
            elif dependency_id and not dependency.get("optional"):
                # A community row with the same ID can override native requiredness.
                overridden = any(
                    str(row.get("id") or "").strip() == dependency_id
                    and not row.get("incompatible")
                    for row in community(module_id)
                )
                if not overridden:
                    raise RuntimeError(f"Required Bannerlord dependency is not enabled: {dependency_id}")

        for relation in model.get("modulesToLoadAfterThis", []):
            after_id = str(relation.get("id") or "").strip()
            if after_id in included:
                add_edge(module_id, after_id)
        for relation in model.get("incompatibleModules", []):
            incompatible_id = str(relation.get("id") or "").strip()
            if incompatible_id in included:
                conflicts.append((module_id, incompatible_id))

        for relation in community(module_id):
            related_id = str(relation.get("id") or "").strip()
            if not related_id:
                continue
            if relation.get("incompatible"):
                if related_id in included:
                    conflicts.append((module_id, related_id))
                continue
            if related_id not in included:
                if not relation.get("optional"):
                    raise RuntimeError(f"Required Bannerlord dependency is not enabled: {related_id}")
                continue
            order = relation.get("order")
            if order == "LoadBeforeThis":
                add_edge(related_id, module_id)
            elif order == "LoadAfterThis":
                add_edge(module_id, related_id)
'''
          new = '''    conflicts = []
    for module_id in list(included):
        for relation in dependencies_to_load(module_id):
            related_id = str(relation.get("id") or "").strip()
            if not related_id:
                continue
            if related_id not in included:
                if not relation.get("optional"):
                    raise RuntimeError(f"Required Bannerlord dependency is not enabled: {related_id}")
                continue
            order = relation.get("order")
            if order == "LoadBeforeThis":
                add_edge(related_id, module_id)
            elif order == "LoadAfterThis":
                add_edge(module_id, related_id)

        for incompatible_id in incompatible_relations(module_id):
            if incompatible_id in included:
                conflicts.append((module_id, incompatible_id))
'''
          text = replace_once(text, old, new, "distinct relation graph")
          path.write_text(text, encoding="utf-8")

          test = Path("tests/test_bannerlord_dependency_precedence.py")
          test.write_text('''from pathlib import Path
import tempfile
import unittest

from games.bannerlord.game_launch import module_load_order


def write_module(game: Path, module_id: str, *, native=(), native_after=(), community=()) -> Path:
    folder = game / "Modules" / module_id
    folder.mkdir(parents=True, exist_ok=True)
    native_xml = "\\n".join(f'    <DependedModule Id="{value}" />' for value in native)
    after_xml = "\\n".join(f'    <Module Id="{value}" />' for value in native_after)
    community_xml = "\\n".join(
        "    <DependedModuleMetadata " + " ".join(part for part in (
            f'id="{row["id"]}"',
            f'order="{row.get("order", "")}"' if row.get("order") else "",
            'optional="true"' if row.get("optional") else "",
        ) if part) + " />"
        for row in community
    )
    (folder / "SubModule.xml").write_text(f'''<Module>
  <Id value="{module_id}" />
  <Name value="{module_id}" />
  <Version value="v1.0.0" />
  <SingleplayerModule value="true" />
  <DependedModules>
{native_xml}
  </DependedModules>
  <ModulesToLoadAfterThis>
{after_xml}
  </ModulesToLoadAfterThis>
  <DependedModuleMetadatas>
{community_xml}
  </DependedModuleMetadatas>
</Module>
''', encoding="utf-8")
    return folder


def workspace(root: Path) -> Path:
    value = root / "workspace"
    value.mkdir()
    (value / "SubModule.xml").write_text('<Module><Id value="Selected" /></Module>', encoding="utf-8")
    return value


class BannerlordDependencyPrecedenceTests(unittest.TestCase):
    def test_community_load_after_overrides_duplicate_native_dependency_edge(self):
        with tempfile.TemporaryDirectory() as name:
            root = Path(name); game = root / "game"
            write_module(game, "Library")
            write_module(game, "Selected", native=("Library",), community=[{"id":"Library","order":"LoadAfterThis"}])
            self.assertEqual(module_load_order(game, workspace(root)), ["Selected", "Library"])

    def test_first_community_duplicate_optional_row_wins_requiredness(self):
        with tempfile.TemporaryDirectory() as name:
            root = Path(name); game = root / "game"
            write_module(game, "Library")
            write_module(game, "Selected", community=[
                {"id":"Library","order":"LoadBeforeThis","optional":True},
                {"id":"Library","order":"LoadAfterThis"},
            ])
            self.assertEqual(module_load_order(game, workspace(root)), ["Selected"])

    def test_first_community_duplicate_order_wins_without_creating_cycle(self):
        with tempfile.TemporaryDirectory() as name:
            root = Path(name); game = root / "game"
            write_module(game, "Library")
            write_module(game, "Selected", community=[
                {"id":"Library","order":"LoadBeforeThis"},
                {"id":"Library","order":"LoadAfterThis"},
            ])
            self.assertEqual(module_load_order(game, workspace(root)), ["Library", "Selected"])

    def test_native_dependency_precedes_duplicate_native_load_after_relation(self):
        with tempfile.TemporaryDirectory() as name:
            root = Path(name); game = root / "game"
            write_module(game, "Library")
            write_module(game, "Selected", native=("Library",), native_after=("Library",))
            self.assertEqual(module_load_order(game, workspace(root)), ["Library", "Selected"])


if __name__ == "__main__":
    unittest.main()
''', encoding="utf-8")
      - name: Validate precedence fix
        run: |
          python -m compileall -q games/bannerlord
          python -m unittest tests.test_bannerlord_dependency_precedence tests.test_bannerlord_community_metadata tests.test_bannerlord_launch -v
      - name: Commit precedence fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add games/bannerlord/game_launch.py tests/test_bannerlord_dependency_precedence.py
          git commit -m "Match BUTR dependency distinct precedence"
          git push origin HEAD:feature/bannerlord-plugin
