name: FF7 semantic browser one-shot

on:
  push:
    branches: [fix/ff7-full-semantic-editor]
    paths:
      - '.github/workflows/ff7-semantic-browser-one-shot.yml'

permissions:
  contents: write

jobs:
  patch-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/ff7-full-semantic-editor
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Apply browser acceptance patch
        run: python tools/_ff7_semantic_browser_patch.py
      - name: Install Chromium test dependency
        run: |
          python -m pip install playwright==1.57.0
          python -m playwright install --with-deps chromium
      - name: Run real shared FF7 UI acceptance
        run: python tools/verify_ff7_rendered_neutral.py
      - name: Run component browser regressions
        run: python tools/verify_ff7_ui_neutral.py
      - name: Commit browser acceptance updates
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tools/verify_ff7_rendered.py tools/verify_ff7_rendered_neutral.py tools/verify_ff7_ui_neutral.py
          git diff --cached --check
          git commit -m 'Test the FF7 semantic editor in Chromium'
          git push origin HEAD:fix/ff7-full-semantic-editor
