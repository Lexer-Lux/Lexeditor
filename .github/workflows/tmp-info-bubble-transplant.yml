name: Temporary authored info bubble finish
on:
  push:
    branches: [codex/global-semantic-info-bubbles-349-v2]
    paths: ['.github/workflows/tmp-info-bubble-transplant.yml']
permissions:
  contents: write
jobs:
  finish:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/global-semantic-info-bubbles-349-v2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install test dependencies
        run: |
          python -m pip install pytest playwright Pillow 'fonttools>=4.59,<5'
          python -m playwright install --with-deps chromium
      - name: Finish authored semantic help pass
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def repl(path, old, new):
              p=Path(path); s=p.read_text('utf-8')
              if old not in s: raise SystemExit(f'{path}: missing anchor {old[:120]!r}')
              p.write_text(s.replace(old,new,1),'utf-8')

          repl('docs/UI-MANUAL.md',
               "Never put the property's data type, numeric range, step size, displayed unit,",
               "Never put the property's data type, allowed/storage numeric range, step size, displayed unit,")

          repl('games/ff8/editor.html',
               'help:infoHelp("Both curves come from the routines the game uses: getGFhpForLvl and GetGFLevelFromExperience in FF8_EN.exe."),',
               'help:infoHelp("The HP curve controls this GF\'s maximum HP as it levels; the XP curve controls the cumulative experience thresholds for GF levels. Both use FF8\'s verified game routines."),')
          repl('games/ff8/editor.html',
               'help:infoHelp("Each graph uses FF8\'s verified four-byte enemy stat equation across levels 1–100."),',
               'help:infoHelp("Each graph previews how this enemy stat changes as enemy level changes, using FF8\'s verified four-byte stat equation."),')
          repl('games/ff8/editor.html',
               'detailField({label:"STOP 1",help:infoHelp("The first stop keypoint used by this train track."),control:stop("trainStop1","Train stop 1")}),detailField({label:"STOP 2",help:infoHelp("The second stop keypoint used by this train track."),control:stop("trainStop2","Train stop 2")})',
               'detailField({label:"STOP 1",help:infoHelp("Together with Stop 2, this keypoint defines one endpoint of the rail route used by this train track."),control:stop("trainStop1","Train stop 1")}),detailField({label:"STOP 2",help:infoHelp("Together with Stop 1, this keypoint defines the other endpoint of the rail route used by this train track."),control:stop("trainStop2","Train stop 2")})')
          repl('games/ff8/editor.html',
               'help:infoHelp(game.ready?"Final Fantasy 8 is installed and its files are readable.":"The configured installation needs attention before this plugin can edit it.")}),',
               'help:infoHelp(game.ready?"Ready means Lexeditor found the configured FF8 installation and can read the game files this editor depends on.":"Not ready means one or more required FF8 paths or files are missing or unreadable; the reported installation problems identify the concrete cause.")}),')

          repl('games/ff9/editor.html',
               'help:infoHelp(game.ready?"The installed game layout is confirmed.":"The installed game layout is incomplete.")}),',
               'help:infoHelp(game.ready?"Ready means Lexeditor found the FF9 installation layout and the launcher/player files this editor depends on.":"Incomplete means one or more FF9 installation paths required by Lexeditor are missing or unreadable; the installation problems identify the concrete cause.")}),')

          repl('games/rdr2/editor.html',
               'fieldHelp("Probability from 0 to 1. For example, 0.2 means a 20% chance when this group is evaluated.")',
               'fieldHelp("A normalized probability used when this group is evaluated; for example, 0.2 means a 20% chance.")')

          p=Path('tests/test_info_bubble_semantics.py'); s=p.read_text('utf-8')
          old='''        "A bounded whole-number property. Focus it to reveal its type and valid range.",\n    ):\n'''
          new='''        "A bounded whole-number property. Focus it to reveal its type and valid range.",\n        "Both curves come from the routines the game uses",\n        "across levels 1–100",\n        "The first stop keypoint used by this train track.",\n        "The second stop keypoint used by this train track.",\n        "Probability from 0 to 1.",\n    ):\n'''
          if old not in s: raise SystemExit('semantic regression list anchor missing')
          s=s.replace(old,new,1)
          s=s.replace('assert "Never put the property\'s data type, numeric range, step size, displayed unit" in manual',
                      'assert "Never put the property\'s data type, allowed/storage numeric range, step size, displayed unit" in manual',1)
          p.write_text(s,'utf-8')
          PY
      - name: Verify semantic help and affected games
        run: |
          python -m compileall -q games ui tests
          python -m pytest -q tests/test_info_bubble_semantics.py tests/test_global_issues.py tests/test_ff9*.py
          node --test tests/ff9_editor.test.cjs
          LEXEDITOR_BROWSER_OFFLINE=1 python tests/global_controls_check.py
          git diff --check
      - name: Commit verified follow-up
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/UI-MANUAL.md games/ff8/editor.html games/ff9/editor.html games/rdr2/editor.html tests/test_info_bubble_semantics.py
          git commit -m 'Finish semantic info bubble copy audit'
          git push origin HEAD:codex/global-semantic-info-bubbles-349-v2
