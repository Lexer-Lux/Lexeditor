name: Temporary authored info bubble audit
on:
  push:
    branches: [codex/global-semantic-info-bubbles-349-v2]
    paths: ['.github/workflows/tmp-info-bubble-transplant.yml']
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/global-semantic-info-bubbles-349-v2
      - name: Print authored semantic help candidates
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          files=[p for p in Path('games').rglob('*') if p.suffix.lower() in {'.html','.js'}]
          print('--- ALL INFO BUBBLE SOURCES ---')
          for p in files:
              for i,line in enumerate(p.read_text('utf-8',errors='replace').splitlines(),1):
                  if 'infoHelp(' in line or 'fieldHelp(' in line:
                      print(f'{p}:{i}: {line.strip()[:1400]}')
          print('--- SUSPICIOUS LITERALS ---')
          words=('range','minimum','maximum','step','unit','stored parameter','exact stored','whole-number','0 through','1 to 100','0-255')
          for p in files:
              for i,line in enumerate(p.read_text('utf-8',errors='replace').splitlines(),1):
                  low=line.lower()
                  if ('infoHelp(' in line or 'fieldHelp(' in line) and any(w in low for w in words):
                      print(f'{p}:{i}: {line.strip()[:1400]}')
          PY
