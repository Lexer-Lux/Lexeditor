name: Temporary Bannerlord SubModule ordering hardening

on:
  push:
    branches: [feature/bannerlord-plugin]
    paths:
      - '.github/workflows/temp-bannerlord-submodule-ordering.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/bannerlord-plugin
      - name: Harden structural insertion order
        shell: python
        run: |
          from pathlib import Path

          path = Path('games/bannerlord/module_data.py')
          text = path.read_text(encoding='utf-8')

          marker = 'def _child_or_create(parent: ET.Element, tag: str) -> ET.Element:\n'
          end = '\n\ndef _remove_tagged_children(parent: ET.Element, tag: str) -> None:\n'
          if text.count(marker) != 1 or text[text.index(marker):].count(end) != 1:
              raise SystemExit('child helper markers changed')
          start = text.index(marker)
          stop = text.index(end, start)
          replacement = '''_MODULE_SECTION_ORDER = (
    "DependedModules",
    "ModulesToLoadAfterThis",
    "IncompatibleModules",
    "DependedModuleMetadatas",
    "SubModules",
    "Xmls",
)
_SUBMODULE_CHILD_ORDER = ("Name", "DLLName", "SubModuleClassType", "Assemblies", "Tags")


def _insert_ordered_child(parent: ET.Element, element: ET.Element, order: tuple[str, ...]) -> ET.Element:
    """Insert a newly-created known child before the next known schema sibling.

    Existing elements are never moved. Unknown/comment nodes keep their relative
    positions; this only prevents Lexeditor-created nodes from being appended
    after later structural sections.
    """
    try:
        target_rank = order.index(element.tag)
    except ValueError:
        parent.append(element)
        return element
    for index, child in enumerate(list(parent)):
        try:
            child_rank = order.index(child.tag)
        except ValueError:
            continue
        if child_rank > target_rank:
            parent.insert(index, element)
            return element
    parent.append(element)
    return element


def _child_or_create(parent: ET.Element, tag: str) -> ET.Element:
    child = parent.find(tag)
    if child is None:
        child = _insert_ordered_child(parent, ET.Element(tag), _MODULE_SECTION_ORDER)
    return child


def _submodule_child_or_create(parent: ET.Element, tag: str) -> ET.Element:
    child = parent.find(tag)
    if child is None:
        child = _insert_ordered_child(parent, ET.Element(tag), _SUBMODULE_CHILD_ORDER)
    return child
'''
          text = text[:start] + replacement + text[stop:]

          # Make _set_value optionally use an ordered creator; top-level metadata
          # keeps its existing dedicated insertion helper, while SubModule fields
          # need Name/DLL/Class inserted before Assemblies/Tags.
          old = '''def _set_value(parent: ET.Element, tag: str, value: str) -> bool:
    element = parent.find(tag)
    if element is None:
        element = ET.SubElement(parent, tag)
        element.set("value", value)
        return True
'''
          new = '''def _set_value(parent: ET.Element, tag: str, value: str, *, submodule_order: bool = False) -> bool:
    element = parent.find(tag)
    if element is None:
        element = _submodule_child_or_create(parent, tag) if submodule_order else ET.SubElement(parent, tag)
        element.set("value", value)
        return True
'''
          if text.count(old) != 1:
              raise SystemExit(f'_set_value match count {text.count(old)}')
          text = text.replace(old, new, 1)

          # Section creators that bypass _child_or_create.
          replacements = {
              'parent = parent if parent is not None else ET.SubElement(root, "DependedModuleMetadatas")':
                  'parent = parent if parent is not None else _insert_ordered_child(root, ET.Element("DependedModuleMetadatas"), _MODULE_SECTION_ORDER)',
              'parent = parent if parent is not None else ET.SubElement(root, parent_tag)':
                  'parent = parent if parent is not None else _insert_ordered_child(root, ET.Element(parent_tag), _MODULE_SECTION_ORDER)',
              'parent = parent if parent is not None else ET.SubElement(root, "Xmls")':
                  'parent = parent if parent is not None else _insert_ordered_child(root, ET.Element("Xmls"), _MODULE_SECTION_ORDER)',
          }
          for old_value, new_value in replacements.items():
              if text.count(old_value) != 1:
                  raise SystemExit(f'section creator match count for {old_value}: {text.count(old_value)}')
              text = text.replace(old_value, new_value, 1)

          old = '''        changes += int(_set_value(element, "Name", name))
        changes += int(_set_value(element, "DLLName", dll_name))
        changes += int(_set_value(element, "SubModuleClassType", class_type))
'''
          new = '''        changes += int(_set_value(element, "Name", name, submodule_order=True))
        changes += int(_set_value(element, "DLLName", dll_name, submodule_order=True))
        changes += int(_set_value(element, "SubModuleClassType", class_type, submodule_order=True))
'''
          if text.count(old) != 1:
              raise SystemExit(f'submodule fields match count {text.count(old)}')
          text = text.replace(old, new, 1)

          # Assemblies must be created before Tags; Tags can append after Assemblies.
          old = 'assemblies_root = assemblies_root if assemblies_root is not None else ET.SubElement(parent, "Assemblies")'
          new = 'assemblies_root = assemblies_root if assemblies_root is not None else _submodule_child_or_create(parent, "Assemblies")'
          if text.count(old) != 1:
              raise SystemExit(f'assemblies creator match count {text.count(old)}')
          text = text.replace(old, new, 1)
          old = 'tags_root = tags_root if tags_root is not None else ET.SubElement(parent, "Tags")'
          new = 'tags_root = tags_root if tags_root is not None else _submodule_child_or_create(parent, "Tags")'
          if text.count(old) != 1:
              raise SystemExit(f'tags creator match count {text.count(old)}')
          text = text.replace(old, new, 1)

          path.write_text(text, encoding='utf-8')
      - name: Add ordering regressions
        run: |
          cat > tests/test_bannerlord_submodule_ordering.py <<'PY'
          from pathlib import Path
          import tempfile
          import unittest
          import xml.etree.ElementTree as ET

          from games.bannerlord.module_data import save_module


          class BannerlordSubModuleOrderingTests(unittest.TestCase):
              def test_new_structural_sections_insert_before_later_existing_sections(self):
                  with tempfile.TemporaryDirectory() as name:
                      path = Path(name) / "SubModule.xml"
                      path.write_text('''<Module>
            <Name value="Example"/><Id value="Example"/><Version value="v1.0.0"/>
            <SubModules><SubModule><Name value="Example"/><DLLName value="Example.dll"/><SubModuleClassType value="Example.SubModule"/><Tags/></SubModule></SubModules>
            <Xmls><XmlNode><XmlName id="Items" path="items"/><IncludedGameTypes><GameType value="Campaign"/></IncludedGameTypes></XmlNode></Xmls>
          </Module>''', encoding="utf-8")
                      save_module(path, {
                          "dependencies": [{"index": None, "id": "Native", "dependentVersion": "", "optional": False, "attributes": {}}],
                          "modulesToLoadAfterThis": [{"index": None, "id": "After.Mod", "attributes": {}}],
                          "incompatibleModules": [{"index": None, "id": "Bad.Mod", "elementTag": "Module", "attributes": {}}],
                          "communityDependencies": [{"index": None, "id": "Harmony", "order": "LoadBeforeThis", "optional": True, "incompatible": False, "version": "", "attributes": {}}],
                      })
                      root = ET.parse(path).getroot()
                      tags = [child.tag for child in root]
                      expected = ["DependedModules", "ModulesToLoadAfterThis", "IncompatibleModules", "DependedModuleMetadatas", "SubModules", "Xmls"]
                      positions = [tags.index(tag) for tag in expected]
                      self.assertEqual(positions, sorted(positions))

              def test_missing_submodule_fields_insert_before_existing_assemblies_and_tags(self):
                  with tempfile.TemporaryDirectory() as name:
                      path = Path(name) / "SubModule.xml"
                      path.write_text('''<Module><Name value="Example"/><Id value="Example"/><Version value="v1.0.0"/><SubModules><SubModule><Tags><Tag key="DedicatedServerType" value="none"/></Tags><Unknown value="keep"/></SubModule></SubModules></Module>''', encoding="utf-8")
                      save_module(path, {"submodules": [{
                          "index": 0,
                          "name": "Example",
                          "dllName": "Example.dll",
                          "classType": "Example.SubModule",
                          "assemblies": [{"index": None, "value": "Helper.dll", "attributes": {}}],
                          "tags": [{"index": 0, "key": "DedicatedServerType", "value": "none", "attributes": {}}],
                      }]})
                      sub = ET.parse(path).getroot().find("./SubModules/SubModule")
                      tags = [child.tag for child in sub]
                      self.assertLess(tags.index("Name"), tags.index("DLLName"))
                      self.assertLess(tags.index("DLLName"), tags.index("SubModuleClassType"))
                      self.assertLess(tags.index("SubModuleClassType"), tags.index("Assemblies"))
                      self.assertLess(tags.index("Assemblies"), tags.index("Tags"))
                      self.assertIsNotNone(sub.find("Unknown"))

              def test_existing_known_nodes_are_not_reordered(self):
                  with tempfile.TemporaryDirectory() as name:
                      path = Path(name) / "SubModule.xml"
                      path.write_text('''<Module><Name value="Example"/><Id value="Example"/><Version value="v1.0.0"/><SubModules/><DependedModules/></Module>''', encoding="utf-8")
                      save_module(path, {"dependencies": []})
                      tags = [child.tag for child in ET.parse(path).getroot()]
                      self.assertEqual(tags[-2:], ["SubModules", "DependedModules"])


          if __name__ == "__main__":
              unittest.main()
          PY
      - name: Validate ordering hardening
        run: |
          python -m compileall -q games/bannerlord
          python -m unittest tests.test_bannerlord_submodule_ordering tests.test_bannerlord_plugin tests.test_bannerlord_community_editor tests.test_bannerlord_module_metadata -v
      - name: Commit ordering hardening
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add games/bannerlord/module_data.py tests/test_bannerlord_submodule_ordering.py
          git commit -m "Preserve Bannerlord SubModule schema ordering"
          git push origin HEAD:feature/bannerlord-plugin
