name: Temporary Bannerlord PR description refresh

on:
  push:
    branches: [feature/bannerlord-plugin]
    paths:
      - '.github/workflows/temp-bannerlord-pr-description.yml'

permissions:
  contents: read
  pull-requests: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Refresh PR 453 body
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          python - <<'PY'
          import json
          import os
          import urllib.request

          url = f"https://api.github.com/repos/{os.environ['REPOSITORY']}/pulls/453"
          headers = {
              "Authorization": f"Bearer {os.environ['GH_TOKEN']}",
              "Accept": "application/vnd.github+json",
              "X-GitHub-Api-Version": "2022-11-28",
              "User-Agent": "Lexeditor-Bannerlord-PR-refresh",
          }
          request = urllib.request.Request(url, headers=headers)
          with urllib.request.urlopen(request) as response:
              body = json.load(response).get("body") or ""

          replacements = [
              (
                  "- compatibility-only legacy tags are read/normalized for Play + diagnostics without being rewritten by the BLSE editor",
                  "- existing compatibility-only legacy dependency rows are structured-editable by ID/removal while preserving their original XML element shape and unknown attributes; Lexeditor does not invent new legacy rows",
              ),
              (
                  "- compatibility-only legacy dependency tags are currently read/normalized but not exposed as separate structured write surfaces",
                  "- creating new compatibility-only legacy dependency rows remains source-only; several historical launcher XML shapes exist, so Lexeditor edits/removes existing rows rather than inventing one",
              ),
          ]
          for old, new in replacements:
              if old not in body:
                  raise SystemExit(f"Expected PR text not found: {old}")
              body = body.replace(old, new, 1)

          payload = json.dumps({"body": body}).encode()
          patch = urllib.request.Request(url, data=payload, headers={**headers, "Content-Type": "application/json"}, method="PATCH")
          with urllib.request.urlopen(patch) as response:
              updated = json.load(response)
          print(updated["html_url"])
          PY
