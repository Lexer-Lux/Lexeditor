name: Global issue verification
on:
  push:
    branches: [fix/global-issues-20260906]
  workflow_dispatch:
permissions:
  contents: read
  issues: read
concurrency:
  group: global-issue-verification-${{ github.ref }}
  cancel-in-progress: true
jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          submodules: false
          persist-credentials: true
      - name: Remove checkout authentication without traversing unrelated submodules
        run: git config --local --unset-all http.https://github.com/.extraheader
      - name: Capture tracked source and current issue evidence without changing either
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p verification
          python3 - <<'PY'
          import pathlib,subprocess,zipfile,json,hashlib
          text={'.py','.js','.mjs','.cjs','.css','.html','.json','.jsonl','.txt','.md','.yml','.yaml','.toml','.ini','.spec','.ps1','.cmd','.bat','.sh','.xml','.svg','.csv','.h','.hpp','.cpp','.c','.cs','.csproj','.gitignore','.gitattributes','.b64','.patch'}
          images={'.png','.jpg','.jpeg','.ico','.icns','.webp'}
          manifest=[]
          with zipfile.ZipFile('verification/source.zip','w',zipfile.ZIP_DEFLATED) as z:
              for name in subprocess.check_output(['git','ls-files','-z']).decode().split('\0'):
                  p=pathlib.Path(name)
                  if not name or not p.is_file() or p.is_symlink():continue
                  data=p.read_bytes()
                  allowed=(p.suffix.lower() in text or p.name in {'LICENSE','NOTICE','.gitignore','.gitattributes'} or p.suffix.lower() in images) and len(data)<2000000
                  if name.startswith(('tools/magic-rdr/','tools/ffnx/','tools/ffmpeg/')):allowed=False
                  manifest.append({'path':name,'bytes':len(data),'sha256':hashlib.sha256(data).hexdigest(),'included':allowed})
                  if allowed:z.writestr(name,data)
          pathlib.Path('verification/source-manifest.json').write_text(json.dumps(manifest))
          PY
          gh api --paginate --slurp 'repos/Lexer-Lux/Lexeditor/issues?state=all&per_page=100' > verification/issues-pages.json
          gh api --paginate --slurp 'repos/Lexer-Lux/Lexeditor/issues/comments?per_page=100' > verification/comments-pages.json
          gh api 'repos/Lexer-Lux/Lexeditor/pulls?state=open&per_page=100' > verification/pulls.json
          git rev-parse HEAD > verification/commit.txt
      - name: Verify global regressions when present
        run: |
          if [ -f tests/test_global_issues.py ]; then
            python3 -m pip install -r requirements.txt
            python3 -m unittest discover -s tests -p 'test_global_issues.py' -v
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: global-verification-${{ github.run_id }}
          path: verification/
          retention-days: 14
