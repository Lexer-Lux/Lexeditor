name: FF9 verification
on:
  push:
    branches: [codex/ff9-complete-20260906]
    paths:
      - 'games/ff9/**'
      - 'tests/*ff9*'
      - 'tools/ff9/**'
      - '.github/workflows/ff9-verification.yml'
  pull_request:
    paths:
      - 'games/ff9/**'
      - 'tests/*ff9*'
      - 'tools/ff9/**'
      - '.github/workflows/ff9-verification.yml'
permissions:
  contents: write
concurrency:
  group: ff9-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'push' && 'codex/ff9-complete-20260906' || github.ref }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Install test dependencies
        run: python -m pip install pytest
      - name: Apply deterministic FF9 feature UI integration
        run: python tools/ff9/patch_features_ui.py
      - name: Build exact Memoria Scripts runtime against pinned publisher assemblies
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=. python tools/ff9/extract_memoria_refs.py out/ff9-refs
          mkdir -p out/packages
          for spec in microsoft.netframework.referenceassemblies.net35:1.0.3 unityengine5:5.5.0; do
            name=${spec%:*}; version=${spec#*:}
            curl --fail --location --retry 2 "https://api.nuget.org/v3-flatcontainer/$name/$version/$name.$version.nupkg" -o "out/$name.nupkg"
            unzip -q "out/$name.nupkg" -d "out/packages/$name"
          done
          root=$(dirname "$(readlink -f "$(command -v dotnet)")")
          sdk=$(dotnet --list-sdks | grep '^8\.' | tail -1 | awk '{print $1}')
          csc="$root/sdk/$sdk/Roslyn/bincore/csc.dll"
          ref=out/packages/microsoft.netframework.referenceassemblies.net35/build/.NETFramework/v3.5
          unity=out/packages/unityengine5/lib/net35/UnityEngine.dll
          dotnet "$csc" -nologo -target:library -langversion:7.3 -nostdlib+ -deterministic+ \
            -out:games/ff9/runtime/Memoria.Scripts.Lexeditor.dll \
            -r:"$ref/mscorlib.dll" -r:"$ref/System.dll" -r:"$ref/System.Core.dll" \
            -r:out/ff9-refs/Assembly-CSharp.dll -r:out/ff9-refs/Memoria.Prime.dll -r:"$unity" \
            games/ff9/runtime/Bootstrap.cs games/ff9/runtime/Runtime.cs games/ff9/runtime/BetterEatScript.cs
          test -s games/ff9/runtime/Memoria.Scripts.Lexeditor.dll
          strings games/ff9/runtime/Memoria.Scripts.Lexeditor.dll | grep -q BetterEatScript
          strings games/ff9/runtime/Memoria.Scripts.Lexeditor.dll | grep -q LexeditorBootstrap
          sha256sum games/ff9/runtime/Memoria.Scripts.Lexeditor.dll
      - name: Test FF9 Python and controller code
        run: |
          python -m compileall -q games/ff9
          python -m pytest -q tests/test_ff9*.py
          node --test tests/ff9_editor.test.cjs
      - name: Upload verified FF9 runtime
        uses: actions/upload-artifact@v4
        with:
          name: ff9-compiled-runtime
          path: games/ff9/runtime/Memoria.Scripts.Lexeditor.dll
          retention-days: 1
      - name: Commit verified runtime and feature UI
        if: github.event_name == 'push'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Lexeditor FF9 Runtime Build'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add games/ff9/runtime/Memoria.Scripts.Lexeditor.dll games/ff9/editor.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Build verified FF9 runtime and feature controls'
          git push origin HEAD:codex/ff9-complete-20260906
      - name: Collect exact public sources for offline integration checks
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ff9-evidence/lexeditor
          git archive HEAD AGENTS.md '*.py' games/ff9 ui tests codex worklog/issues tools .github | tar -x -C ff9-evidence/lexeditor
          git clone --depth 1 --filter=blob:none --sparse --branch v2025.07.04 https://github.com/Albeoris/Memoria.git ff9-evidence/memoria
          git -C ff9-evidence/memoria sparse-checkout set Assembly-CSharp Memoria.Prime Memoria.Scripts Memoria.Patcher Memoria.Compiler Memoria.Launcher/Presets
          git -C ff9-evidence/memoria rev-parse HEAD > ff9-evidence/memoria-source-commit.txt
          rm -rf ff9-evidence/memoria/.git
      - name: Upload test source bundle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ff9-verification-sources
          path: ff9-evidence
          retention-days: 1
          include-hidden-files: false
