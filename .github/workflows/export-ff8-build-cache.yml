name: Export FF8 dependency cache
on:
  push:
    branches: [fix/ff8-native-battle-batch]
    paths: [.github/workflows/export-ff8-build-cache.yml]
permissions:
  contents: read
jobs:
  cache:
    runs-on: windows-2025-vs2026
    timeout-minutes: 10
    steps:
      - uses: actions/cache/restore@v4
        with:
          path: D:\vcpkg-cache
          key: ffnx-c056db-x86-v145-release-only-v1-export
          restore-keys: ffnx-c056db-x86-v145-release-only-v1-
          fail-on-cache-miss: true
      - uses: actions/upload-artifact@v4
        with:
          name: ff8-x86-release-dependencies
          path: D:\vcpkg-cache\
          compression-level: 0
          retention-days: 2
          if-no-files-found: error
