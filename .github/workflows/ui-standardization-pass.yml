name: UI standardization pass

on:
  push:
    branches: [fix/ui-standardization-20260906]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/ui-standardization-20260906
          fetch-depth: 0
      - name: Apply shared UI fixes
        run: python .github/scripts/ui_standardization.py
      - name: Move internal docs and remove design review
        run: |
          mkdir -p worklog/acceptance/warband
          git mv docs/warband-acceptance.md worklog/acceptance/warband/pr-361.md
          git mv docs/warband-managed-wse2.md worklog/acceptance/warband/managed-wse2.md
          git rm -f ui/design-review.css ui/design-review.js docs/SHARED_UI_DESIGN.md
      - name: Validate
        run: |
          python -m py_compile plugin_api.py github_integration.py desktop_host.py settings_manager.py
          node --check ui/framework.js
          grep -q 'issue_label=plugin_id' desktop_host.py
          grep -q 'modelPreview' ui/framework.js
          grep -q 'There is no separate Lexer Mode' docs/UI-MANUAL.md
          test ! -e ui/design-review.js
          test ! -e ui/design-review.css
          test ! -e docs/SHARED_UI_DESIGN.md
      - name: Commit
        run: |
          git rm -f .github/workflows/ui-standardization-pass.yml .github/scripts/ui_standardization.py
          git config user.name 'Lexeditor UI maintenance'
          git config user.email '89482099+Lexer-Lux@users.noreply.github.com'
          git add -A
          git commit -m 'Standardize shared UI behavior and game issue routing'
          git push origin HEAD:fix/ui-standardization-20260906
