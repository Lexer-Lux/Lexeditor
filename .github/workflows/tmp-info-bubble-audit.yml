name: Temporary semantic info bubble repair
on:
  push:
    branches: [codex/global-semantic-info-bubbles-349]
    paths: ['.github/workflows/tmp-info-bubble-audit.yml']
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/global-semantic-info-bubbles-349
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install test dependencies
        run: |
          python -m pip install pytest playwright Pillow 'fonttools>=4.59,<5'
          python -m playwright install --with-deps chromium
      - name: Apply semantic info bubble repair
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          source=Path('tools/_tmp_fix_info_bubbles_349.py').read_text('utf-8')
          marker='# ---------------------------------------------------------------------------\n# Browser regression:'
          if marker not in source:
              raise SystemExit('temporary driver split marker missing')
          prefix=source.split(marker,1)[0]
          exec(compile(prefix,'tools/_tmp_fix_info_bubbles_349.py','exec'),{'__file__':str(Path('tools/_tmp_fix_info_bubbles_349.py').resolve())})
          PY
          python tools/_tmp_finish_info_bubbles_349.py
      - name: Verify static and game regressions
        run: |
          python -m compileall -q games ui tests tools/_tmp_finish_info_bubbles_349.py
          python -m pytest -q tests/test_info_bubble_semantics.py tests/test_global_issues.py tests/test_ff9*.py
          node --test tests/ff9_editor.test.cjs
          LEXEDITOR_BROWSER_OFFLINE=1 python tests/global_controls_check.py
          git diff --check
      - name: Commit verified candidate
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ui/framework.js docs/UI-MANUAL.md \
            games/blank/editor.html games/ff7/editor.html games/ff8/editor.html \
            games/ff9/editor.html games/rdr2/editor.html \
            tests/global_controls_check.py tests/test_info_bubble_semantics.py
          if git diff --cached --quiet; then
            echo 'No candidate changes to commit.'
            exit 0
          fi
          git commit -m 'Make info bubbles semantic instead of metadata echoes'
          git push origin HEAD:codex/global-semantic-info-bubbles-349
