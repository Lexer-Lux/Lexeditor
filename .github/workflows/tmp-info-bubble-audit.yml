name: Temporary info bubble audit
on:
  push:
    branches: [codex/global-semantic-info-bubbles-349]
    paths: ['.github/workflows/tmp-info-bubble-audit.yml']
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Audit authored help and FF9 schemas
        shell: bash
        env:
          LEXEDITOR_FF9_DATA_ROOT: ${{ runner.temp }}/ff9-data
        run: |
          python - <<'PY'
          from pathlib import Path
          roots=[Path('games'),Path('ui'),Path('desktop_host.py'),Path('plugin_api.py')]
          files=[]
          for root in roots:
              if root.is_file(): files.append(root)
              elif root.exists(): files += [p for p in root.rglob('*') if p.suffix.lower() in {'.html','.js','.py','.md'}]
          hits=[]
          for p in files:
              text=p.read_text('utf-8',errors='replace')
              for i,line in enumerate(text.splitlines(),1):
                  if 'infoHelp' in line or 'aria-description' in line or 'help:' in line or 'help =' in line or 'help=' in line:
                      hits.append((str(p),i,line.strip()))
          print(f'AUTHORED_HELP_HITS {len(hits)}')
          for p,i,line in hits:
              print(f'{p}:{i}: {line[:900]}')
          print('--- INFOHELP CALL FILES ---')
          for p in sorted({p for p,_,line in hits if 'infoHelp' in line}): print(p)

          print('--- FF9 SCHEMAS ---')
          from games.ff9 import memoria_catalog
          memoria_catalog.install()
          from games.ff9.memoria_csv import MemoriaDataStore, DATASETS
          store=MemoriaDataStore()
          for dataset in DATASETS:
              try:
                  loaded=store.load(dataset.key)
              except Exception as exc:
                  print(f'{dataset.key}: ERROR {exc}')
                  continue
              fields=', '.join(f"{f['key']}:{f['declaredType']}" for f in loaded['fields'])
              print(f'{dataset.key} | {dataset.relative_path} | {fields}')
          PY
