# Generated by `python tools/check_plugin.py --write-workflows`; do not edit.
name: ds1 checks
on:
  push:
    branches: [master]
    paths:
      - 'plugins/ds1/**'
      - 'tests/ds1/**'
      - 'tests/plugin_checks.json'
      - 'tools/check_plugin.py'
      - 'tests/shared/verify_all.py'
      - 'requirements-test.txt'
      - '.github/workflows/ds1-checks.yml'
  pull_request:
    paths:
      - 'plugins/ds1/**'
      - 'tests/ds1/**'
      - 'tests/plugin_checks.json'
      - 'tools/check_plugin.py'
      - 'tests/shared/verify_all.py'
      - 'requirements-test.txt'
      - '.github/workflows/ds1-checks.yml'
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true
jobs:
  checks:
    runs-on: windows-latest
    timeout-minutes: 90
    env:
      LEXEDITOR_CHECK_ARTIFACTS: ${{ runner.temp }}/lexeditor-dev/ds1-evidence
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -r requirements-test.txt
      - run: python -m playwright install chromium
      - run: python tools/check_plugin.py ds1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ds1-evidence-${{ github.sha }}
          path: ${{ env.LEXEDITOR_CHECK_ARTIFACTS }}
          if-no-files-found: warn
          retention-days: 7
