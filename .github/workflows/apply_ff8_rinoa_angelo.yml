name: Apply FF8 Rinoa Angelo integration
on:
  push:
    branches: [master]
    paths:
      - 'tools/apply_ff8_rinoa_angelo.py'
      - '.github/workflows/apply_ff8_rinoa_angelo.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 1
      - name: Apply guarded Rinoa Angelo migration
        run: python tools/apply_ff8_rinoa_angelo.py
      - name: Validate fixed command contracts
        run: |
          python -m unittest tests.test_ff8_rinoa_angelo -v
          python -m compileall -q games/ff8
          git diff --check
      - name: Commit integrated source
        run: |
          if git diff --quiet -- games/ff8/fixed_command_menu.py; then
            echo 'No integration changes were needed.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add games/ff8/fixed_command_menu.py
          git commit -m 'Integrate Rinoa Angelo fixed command'
          git push origin HEAD:master
