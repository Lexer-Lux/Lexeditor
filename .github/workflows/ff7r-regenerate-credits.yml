name: FF7R Regenerate Credits

on:
  push:
    branches: [feature/ff7-remake-plugin]

permissions:
  contents: write

jobs:
  generate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Generate credits bundle
        run: python tools/generate_credits.py
      - name: Commit generated bundle
        shell: bash
        run: |
          if git diff --quiet -- ui/credits.json; then
            echo "Credits bundle already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ui/credits.json
          git commit -m "Generate FF7R credits bundle"
          git push
