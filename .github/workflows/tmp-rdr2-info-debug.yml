name: Temporary RDR2 fixture repair
on:
  push:
    branches: [codex/global-semantic-info-bubbles-349-v2]
    paths: ['.github/workflows/tmp-rdr2-info-debug.yml']
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/global-semantic-info-bubbles-349-v2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install browser
        run: |
          python -m pip install playwright==1.57.0
          python -m playwright install --with-deps chromium
      - name: Repair and verify RDR2 offline fixture
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p=Path('tests/rdr2_browser_check.py')
          s=p.read_text('utf-8')
          old="""    html=(ROOT/'games/rdr2/editor.html').read_text(encoding='utf-8')
    html=html.replace('<link rel=\"stylesheet\" href=\"/shared/framework.css\">',
"""
          new="""    html=(ROOT/'games/rdr2/editor.html').read_text(encoding='utf-8')
    # set_content() otherwise runs under about:blank. Give the offline document a
    # valid synthetic base so shared framework URL resolution behaves like the
    # real loopback editor; network requests are still aborted by the test.
    html=html.replace('<head>', '<head><base href=\"http://rdr2.test/\">', 1)
    html=html.replace('<link rel=\"stylesheet\" href=\"/shared/framework.css\">',
"""
          if old not in s:
              raise SystemExit('RDR2 fixture base insertion anchor missing')
          p.write_text(s.replace(old,new,1),'utf-8')
          PY
          python tests/rdr2_browser_check.py --screenshots artifacts/rdr2-browser
          git diff --check
      - name: Commit verified fixture repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tests/rdr2_browser_check.py
          git commit -m 'Fix RDR2 offline browser fixture base URL'
          git push origin HEAD:codex/global-semantic-info-bubbles-349-v2
