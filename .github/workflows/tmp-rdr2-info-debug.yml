name: Temporary RDR2 info-bubble debug
on:
  push:
    branches: [codex/global-semantic-info-bubbles-349-v2]
    paths: ['.github/workflows/tmp-rdr2-info-debug.yml']
permissions:
  contents: read
jobs:
  debug:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/global-semantic-info-bubbles-349-v2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install browser
        run: |
          python -m pip install playwright==1.57.0
          python -m playwright install --with-deps chromium
      - name: Instrument RDR2 fixture
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('tests/rdr2_browser_check.py');s=p.read_text('utf-8')
          old="""                control=page.locator('.alcohol-strength input')\n                expect(control).to_have_count(1)\n"""
          new="""                page.wait_for_timeout(300)\n                print('CASE',case,'ERRORS',errors)\n                print('BODY',page.locator('body').inner_text()[:6000])\n                print('INPUTS',page.locator('input').count(),'DETAILS',page.locator('.alcohol-strength').count())\n                control=page.locator('.alcohol-strength input')\n                expect(control).to_have_count(1)\n"""
          if old not in s: raise SystemExit('debug anchor missing')
          p.write_text(s.replace(old,new,1),'utf-8')
          PY
          python tests/rdr2_browser_check.py --screenshots artifacts/rdr2-browser
