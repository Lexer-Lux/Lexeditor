name: Finish global integration
on:
  push:
    branches: [fix/global-resume-20260906]
    paths: [.github/workflows/global-finish.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  prepare:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    outputs:
      sha: ${{ steps.sha.outputs.sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: fix/global-resume-20260906
          fetch-depth: 0
          submodules: false
      - name: Apply final regression fixes
        run: |
          set -euo pipefail
          git config user.name 'Lexeditor Global Finish'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin master
          git merge --no-edit origin/master
          python3 - <<'PY'
          from pathlib import Path
          p=Path('desktop_host.py')
          s=p.read_text()
          if '\nimport math\n' not in s:
              s=s.replace('\nimport json\n','\nimport json\nimport math\n',1)
          s=s.replace('No upstream release check is registered.','No upstream release provider is registered.')
          p.write_text(s)
          PY
          python -m py_compile desktop_host.py
          git add desktop_host.py
          if ! git diff --cached --quiet; then git commit -m 'Fix final global quote and helper-version regressions'; fi
          git push origin HEAD:fix/global-resume-20260906
      - id: sha
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
  browser:
    needs: prepare
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          submodules: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt playwright
      - run: python -m unittest discover -s tests -p 'test_global*.py' -v
      - run: python tools/generate_credits.py --check
      - run: node --check ui/framework.js && node --check ui/design-review.js
      - run: python -m playwright install --with-deps chromium
      - run: python tests/global_browser_check.py
      - run: python tests/global_design_review_check.py
      - run: python tests/global_controls_check.py
  native:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022, macos-14]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          submodules: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt pyinstaller
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libopengl0 libxcb-cursor0 libxkbcommon-x11-0 libnss3 libasound2t64 && python -m pip install PySide6
      - if: runner.os == 'Windows'
        run: choco install innosetup --yes --no-progress
      - run: python -m unittest discover -s tests -p 'test_global*.py' -v
      - run: python tools/build_distribution.py
  merge:
    needs: [prepare, browser, native]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: master
          fetch-depth: 0
          submodules: false
      - name: Fast-forward verified branch into master
        run: |
          set -euo pipefail
          git config user.name 'Lexeditor Global Finish'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin fix/global-resume-20260906 master
          test "$(git rev-parse origin/fix/global-resume-20260906)" = "${{ needs.prepare.outputs.sha }}"
          git merge --ff-only origin/fix/global-resume-20260906
          git push origin HEAD:master
