name: Factorio checks

on:
  push:
    branches: [codex/factorio-plugin]
    paths:
      - 'plugins/factorio/**'
      - 'tests/test_factorio.py'
      - 'tests/factorio_browser_check.py'
      - 'tests/fixtures/factorio/**'
      - 'runtime_bootstrap.py'
      - 'ui/credits.json'
      - 'ui/credits-sources.json'
      - 'ui/mod-loading.json'
      - '.github/workflows/factorio-checks.yml'
  pull_request:
    paths:
      - 'plugins/factorio/**'
      - 'tests/test_factorio.py'
      - 'tests/factorio_browser_check.py'
      - 'tests/fixtures/factorio/**'
      - 'runtime_bootstrap.py'
      - 'ui/credits.json'
      - 'ui/credits-sources.json'
      - 'ui/mod-loading.json'
      - '.github/workflows/factorio-checks.yml'

permissions:
  contents: read

concurrency:
  group: factorio-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source:
    name: Source / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install runtime dependencies
        run: python -m pip install -r requirements.txt
      - name: Python syntax
        run: python -m compileall -q plugins/factorio tests/test_factorio.py tests/factorio_browser_check.py
      - name: Editor JavaScript syntax
        run: node --check plugins/factorio/editor.js
      - name: Structured model tests
        run: python -m unittest -v tests.test_factorio
      - name: Plugin descriptor
        run: >-
          python -c "from plugins.factorio.plugin import PLUGIN; from plugin_api import validate_plugin;
          from runtime_bootstrap import SERVICE_MODULES; validate_plugin(PLUGIN);
          assert 'plugins.factorio.server' in SERVICE_MODULES; print(PLUGIN.name)"
      - name: Repository metadata
        run: |
          python plugin_metadata.py
          python tools/generate_credits.py
          git diff --exit-code -- ui/credits.json
      - name: Factorio discovery and health
        run: |
          python app.py --list
          python app.py --game factorio --check
      - name: Managed service smoke
        run: >-
          python -c "from plugins.factorio.plugin import smoke;
          [print('PASS:', line) for line in smoke()]"

  shared-baseline:
    name: Shared UI baseline
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Shared UI source contracts
        run: |
          python tools/verify_shared_ui_contract.py
          python tools/verify_shared_ui_budget.py

  rendered:
    name: Rendered edit / export evidence
    runs-on: ubuntu-latest
    timeout-minutes: 12
    needs: source
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Playwright
        run: python -m pip install playwright
      - name: Install Chromium
        run: python -m playwright install --with-deps chromium
      - name: Verify Factorio page modules
        run: >-
          python -c "from tests.plugin_module_routes_check import check;
          problems=check('factorio'); print(*problems, sep='\n'); raise SystemExit(bool(problems))"
      - name: Exercise real Factorio service and UI
        run: python tests/factorio_browser_check.py out/factorio-browser
      - name: Keep screenshots, interaction results, and isolated candidate
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: factorio-rendered-candidate
          path: out/factorio-browser
          retention-days: 7
          if-no-files-found: error
