name: Apply FF8 formulae contract
on:
  push:
    branches: [master]
    paths:
      - 'tools/apply_ff8_formulae_contract.py'
      - '.github/workflows/apply_ff8_formulae_contract.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 1
      - name: Apply guarded formula inventory integration
        run: python tools/apply_ff8_formulae_contract.py
      - name: Validate contract, Python and embedded JavaScript
        run: |
          python -m unittest tests.test_ff8_formulae_rework -v
          python -m compileall -q games/ff8
          python - <<'PY'
          import pathlib, re, subprocess
          text = pathlib.Path('games/ff8/editor.html').read_text(encoding='utf-8')
          for script in re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>', text, re.S | re.I):
              subprocess.run(['node', '--check'], input=script, text=True, check=True)
          PY
          git diff --check
      - name: Commit integrated source
        run: |
          if git diff --quiet -- games/ff8/gameplay_settings.py games/ff8/editor.html; then
            echo 'No integration changes were needed.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add games/ff8/gameplay_settings.py games/ff8/editor.html
          git commit -m 'Integrate FF8 Formulae Rework contract'
          git push origin HEAD:master
