name: Temporary Bannerlord runtime revisions v3

on:
  push:
    branches: [feature/bannerlord-plugin]
    paths:
      - '.github/workflows/temp-bannerlord-runtime-revisions-v3.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/bannerlord-plugin
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply runtime revision patch
        run: |
          git show b779d8cb6e18e081f1271e5dbbb93acdaa258c8b:tools/temp_bannerlord_runtime_revisions.py > /tmp/bannerlord_runtime_revisions.py
          python /tmp/bannerlord_runtime_revisions.py
          python -c "from pathlib import Path; p=Path('games/bannerlord/source_revision.py'); p.write_text(p.read_text(encoding='utf-8').rstrip()+'\n', encoding='utf-8')"
      - name: Focused validation
        run: |
          python -m py_compile games/bannerlord/source_revision.py games/bannerlord/runtime_overrides.py tests/test_bannerlord_runtime_overrides.py
          python -m unittest tests.test_bannerlord_runtime_overrides tests.test_bannerlord_ui_contract -v
          python -c "from games.bannerlord.plugin import smoke; print(smoke())"
          python tools/verify_shared_ui_contract.py
          python -c "import glob, subprocess; [subprocess.run(['node','--check',path], check=True) for path in glob.glob('games/bannerlord/editor*.js')]"
          git diff --check
      - name: Commit runtime revisions
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add games/bannerlord/source_revision.py games/bannerlord/runtime_overrides.py games/bannerlord/editor_boot.js tests/test_bannerlord_runtime_overrides.py
          git commit -m "Protect Bannerlord runtime override saves"
          git push origin HEAD:feature/bannerlord-plugin

  regression:
    needs: patch
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/bannerlord-plugin
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install Pillow 'fonttools>=4.59,<5'
      - run: python -m compileall -q games/bannerlord desktop_host.py service_session.py plugin_api.py project_manager.py runtime_bootstrap.py
      - run: python -m unittest discover -s tests -p 'test_bannerlord*.py' -v
      - run: python -m unittest discover -s tests -p 'test_project*.py' -v
      - run: python -m unittest discover -s tests -p test_data_map_coverage.py -v
      - run: python -c "import glob, subprocess; [subprocess.run(['node','--check',path], check=True) for path in glob.glob('games/bannerlord/editor*.js')]"

  shared-contract:
    needs: patch
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/bannerlord-plugin
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python tools/verify_shared_ui_contract.py
      - run: python -m unittest tests.test_bannerlord_ui_contract -v

  browser:
    needs: patch
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/bannerlord-plugin
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install playwright
      - run: python -m playwright install --with-deps chromium
      - run: python tests/bannerlord_browser_check.py out/bannerlord-runtime-revisions

  cleanup:
    if: always()
    needs: [patch, regression, shared-contract, browser]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/bannerlord-plugin
      - name: Remove temporary runtime revision workflow
        run: |
          rm -f .github/workflows/temp-bannerlord-runtime-revisions-v3.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "Remove temporary Bannerlord runtime revision workflow"
            git push origin HEAD:feature/bannerlord-plugin
          fi
