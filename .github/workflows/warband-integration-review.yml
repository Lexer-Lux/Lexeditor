name: Warband integration review
on:
  push:
    branches: [fix/warband-issue-batch]
    paths: ['.github/workflows/warband-integration-review.yml']
permissions:
  contents: read
jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Export text sources and merge diagnostics
        run: |
          python - <<'PY'
          import json, pathlib, subprocess, zipfile
          def git(*args):
              return subprocess.check_output(['git', *args])
          refs = {'candidate': git('rev-parse', 'HEAD').decode().strip(), 'master': git('rev-parse', 'origin/master').decode().strip()}
          refs['ancestor'] = git('merge-base', refs['candidate'], refs['master']).decode().strip()
          extensions = {'.py', '.js', '.cjs', '.html', '.css', '.md', '.json', '.ini', '.txt', '.toml', '.yaml', '.yml', '.cmd', '.ps1', '.bat'}
          with zipfile.ZipFile('warband-integration-review.zip', 'w', zipfile.ZIP_DEFLATED) as out:
              out.writestr('refs.json', json.dumps(refs, indent=2))
              for label, ref in refs.items():
                  for record in git('ls-tree', '-r', '-z', ref).split(b'\0'):
                      if not record: continue
                      metadata, raw = record.split(b'\t', 1)
                      mode, kind, oid = metadata.split()
                      path = raw.decode()
                      if kind == b'blob' and (pathlib.Path(path).suffix.lower() in extensions or path in {'AGENTS.md', '.gitignore'}):
                          data = git('cat-file', 'blob', oid.decode())
                          out.writestr(label + '/' + path, data)
              merge = subprocess.run(['git', 'merge-tree', '--write-tree', refs['candidate'], refs['master']], capture_output=True)
              out.writestr('merge-diagnostics.txt', merge.stdout + merge.stderr)
              if merge.returncode not in (0, 1): raise RuntimeError(merge.stderr.decode())
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: warband-integration-review
          path: warband-integration-review.zip
          retention-days: 1
