name: Issue status audit
on:
  push:
    paths:
      - .github/workflows/issue-status-audit.yml
permissions:
  contents: read
  issues: read
jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Snapshot issues and comments without changing them
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          test "$REPOSITORY" = "Lexer-Lux/Lexeditor"
          mkdir -p audit
          gh api --paginate "repos/$REPOSITORY/issues?state=all&per_page=100&sort=created&direction=asc" --jq '.[] | select(has("pull_request") | not) | {number,title,body,state,state_reason,labels:[.labels[].name],comments,created_at,updated_at,closed_at,html_url}' > audit/issues.jsonl
          gh api --paginate "repos/$REPOSITORY/issues/comments?per_page=100&sort=created&direction=asc" --jq '.[] | {id,issue_url,body,created_at,updated_at,html_url}' > audit/comments.jsonl
          gh api "repos/$REPOSITORY/git/trees/${{ github.sha }}?recursive=1" > audit/tree.json
          printf 'Issue records: '; wc -l < audit/issues.jsonl
          printf 'Comment records: '; wc -l < audit/comments.jsonl
      - name: Preserve the audit snapshot
        uses: actions/upload-artifact@v4
        with:
          name: human-issue-audit
          path: audit/
          retention-days: 7
