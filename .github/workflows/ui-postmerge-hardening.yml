name: Shared UI post-merge hardening

on:
  push:
    branches: [fix/ui-postmerge-hardening-20260906]

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/ui-postmerge-hardening-20260906
          fetch-depth: 0
      - name: Apply post-merge cleanups
        run: python .github/scripts/ui_postmerge_fix.py
      - name: Shared UI contract
        run: python tools/verify_shared_ui_contract.py
      - name: JavaScript syntax
        run: node --check ui/framework.js
      - name: Python syntax
        run: python -m py_compile desktop_host.py github_integration.py plugin_api.py settings_manager.py
      - name: Commit cleanup
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name 'Lexeditor UI maintenance'
          git config user.email '89482099+Lexer-Lux@users.noreply.github.com'
          git add games/warband/editor.html
          git commit -m 'Remove obsolete Warband preview action styles'
          git push origin HEAD:fix/ui-postmerge-hardening-20260906
