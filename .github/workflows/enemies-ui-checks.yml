name: Validate compact Enemies UI
on:
  push:
    branches: [ui/ff8-enemies-compact]
    paths: [.github/workflows/enemies-ui-checks.yml]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    permissions:
      contents: write
    steps:
      - name: Read exact editor and base revisions
        env:
          REVISION: ${{ github.sha }}
        run: |
          git init editor
          git -C editor remote add origin https://github.com/Lexer-Lux/Lexeditor.git
          git -C editor fetch --depth=1 origin "$REVISION"
          git -C editor checkout --detach FETCH_HEAD
          git -C editor fetch --depth=1 origin 60eda056e233148debf6ef660bf19611ecf76518
      - name: Apply reviewed source and verify exact file hashes
        working-directory: editor
        run: python .github/apply-enemies-ui.py
      - name: Browser and image test dependencies
        run: |
          python -m pip install Pillow fonttools playwright
          python -m playwright install --with-deps chromium
      - name: Test production UI, saved DAT edits and card decoder
        working-directory: editor
        run: |
          python tools/verify_ff8_enemy_compact_ui.py --browser ''
          python tools/verify_ff8_card_art.py
          python tools/verify_ff8_ui_battle_regressions.py --browser ''
          python -m compileall -q games/ff8 tools/verify_ff8_enemy_compact_ui.py tools/verify_ff8_card_art.py tools/verify_ff8_enemies_editor_visual_39.py
          python - <<'PY'
          from pathlib import Path
          import re, subprocess
          for script in re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>', Path('games/ff8/editor.html').read_text(), re.S):
              subprocess.run(['node', '--check'], input=script, text=True, check=True)
          PY
          git diff --check
      - name: Commit verified source and remove temporary publishing files
        working-directory: editor
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          from pathlib import Path
          import json, subprocess
          paths=list(json.loads(Path('.github/enemies-expected.json').read_text()))
          assert len(paths)==8
          subprocess.run(['git','add','--',*paths],check=True)
          PY
          git rm -- .github/enemy-ui.0 .github/enemies-functions.json .github/enemies-style.css .github/enemies-expected.json .github/apply-enemies-ui.py .github/workflows/enemies-ui-checks.yml
          git config user.name 'Lexeditor UI repair'
          git config user.email '89482099+Lexer-Lux@users.noreply.github.com'
          git commit -m 'Compact FF8 enemy properties, tier tables, cards and defence controls'
          AUTH=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $AUTH" push origin HEAD:refs/heads/ui/ff8-enemies-compact
          unset AUTH
