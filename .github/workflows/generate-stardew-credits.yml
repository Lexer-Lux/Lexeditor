name: Generate Stardew credits

on:
  push:
    branches: [stardew-valley-plugin]
    paths:
      - 'ui/credits-sources.json'
      - '.github/workflows/generate-stardew-credits.yml'

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: stardew-valley-plugin
      - name: Generate offline credits
        run: python tools/generate_credits.py
      - name: Commit generated credits
        run: |
          if git diff --quiet -- ui/credits.json; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ui/credits.json
          git commit -m "Regenerate offline credits"
          git push origin HEAD:stardew-valley-plugin
