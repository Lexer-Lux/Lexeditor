name: FF7R checks

on:
  push:
    branches: [master, feature/ff7-remake-plugin]
    paths:
      - 'games/ff7r/**'
      - 'tools/ff7r_assess_save_diff.py'
      - 'tests/test_ff7r_dataobject.py'
      - 'tests/test_ff7r_dataobject_structural.py'
      - 'tests/test_ff7r_textresource.py'
      - 'tests/test_ff7r_textresource_structural.py'
      - 'tests/test_ff7r_semantics.py'
      - 'tests/test_ff7r_editor_semantics.py'
      - 'tests/test_ff7r_runtime_config.py'
      - 'tests/test_ff7r_runtime_state.py'
      - 'tests/test_ff7r_runtime_heartbeat.py'
      - 'tests/test_ff7r_minimap_semantics.py'
      - 'tests/test_ff7r_minimap_runtime_probe.py'
      - 'tests/test_ff7r_cutscene_runtime_probe.py'
      - 'tests/test_ff7r_native_probe.py'
      - 'tests/test_ff7r_research_dataobject.py'
      - 'tests/test_ff7r_cheat_probe.py'
      - 'tests/test_ff7r_cheat_probe_safety.py'
      - 'tests/test_ff7r_no_more_cheats_tweaks.py'
      - 'tests/test_ff7r_raw_asset_probe.py'
      - 'tests/test_ff7r_package_probe.py'
      - 'tests/test_ff7r_lockon_probe.py'
      - 'tests/test_ff7r_lockon_text_probe.py'
      - 'tests/test_ff7r_unscanned_name_probe.py'
      - 'tests/test_ff7r_save_diff_probe.py'
      - 'tests/test_ff7r_save_diff_cli.py'
      - 'tests/test_ff7r_dog_whistle_probe.py'
      - 'tests/test_ff7r_dog_whistle_safety.py'
      - 'tests/test_ff7r_atb_runtime_probe.py'
      - 'tests/test_ff7r_atb_tweaks.py'
      - 'tests/test_ff7r_graphics_tweaks.py'
      - 'tests/test_ff7r_encounter_tweaks.py'
      - 'tests/test_ff7r_better_sprint_runtime.py'
      - 'tests/test_ff7r_hp_rebalance_runtime.py'
      - 'tests/test_ff7r_hp_rebalance_probe.py'
      - 'tests/test_ff7r_bench_probe.py'
      - 'runtime_bootstrap.py'
      - 'plugin_api.py'
      - 'service_session.py'
      - '.github/workflows/ff7r-checks.yml'
  pull_request:
    paths:
      - 'games/ff7r/**'
      - 'tools/ff7r_assess_save_diff.py'
      - 'tests/test_ff7r_dataobject.py'
      - 'tests/test_ff7r_dataobject_structural.py'
      - 'tests/test_ff7r_textresource.py'
      - 'tests/test_ff7r_textresource_structural.py'
      - 'tests/test_ff7r_semantics.py'
      - 'tests/test_ff7r_editor_semantics.py'
      - 'tests/test_ff7r_runtime_config.py'
      - 'tests/test_ff7r_runtime_state.py'
      - 'tests/test_ff7r_runtime_heartbeat.py'
      - 'tests/test_ff7r_minimap_semantics.py'
      - 'tests/test_ff7r_minimap_runtime_probe.py'
      - 'tests/test_ff7r_cutscene_runtime_probe.py'
      - 'tests/test_ff7r_native_probe.py'
      - 'tests/test_ff7r_research_dataobject.py'
      - 'tests/test_ff7r_cheat_probe.py'
      - 'tests/test_ff7r_cheat_probe_safety.py'
      - 'tests/test_ff7r_no_more_cheats_tweaks.py'
      - 'tests/test_ff7r_raw_asset_probe.py'
      - 'tests/test_ff7r_package_probe.py'
      - 'tests/test_ff7r_lockon_probe.py'
      - 'tests/test_ff7r_lockon_text_probe.py'
      - 'tests/test_ff7r_unscanned_name_probe.py'
      - 'tests/test_ff7r_save_diff_probe.py'
      - 'tests/test_ff7r_save_diff_cli.py'
      - 'tests/test_ff7r_dog_whistle_probe.py'
      - 'tests/test_ff7r_dog_whistle_safety.py'
      - 'tests/test_ff7r_atb_runtime_probe.py'
      - 'tests/test_ff7r_atb_tweaks.py'
      - 'tests/test_ff7r_graphics_tweaks.py'
      - 'tests/test_ff7r_encounter_tweaks.py'
      - 'tests/test_ff7r_better_sprint_runtime.py'
      - 'tests/test_ff7r_hp_rebalance_runtime.py'
      - 'tests/test_ff7r_hp_rebalance_probe.py'
      - 'tests/test_ff7r_bench_probe.py'
      - 'runtime_bootstrap.py'
      - 'plugin_api.py'
      - 'service_session.py'
      - '.github/workflows/ff7r-checks.yml'

permissions:
  contents: read

concurrency:
  group: ff7r-${{ github.ref }}
  cancel-in-progress: true

jobs:
  regression:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install pytest
      - name: Python syntax
        run: python -m compileall -q games/ff7r tools/ff7r_assess_save_diff.py
      - name: Editor JavaScript syntax
        run: >-
          python -c "from pathlib import Path; import re; s=Path('games/ff7r/editor.html').read_text(encoding='utf-8'); Path('ff7r-inline.js').write_text('\n'.join(re.findall(r'<script(?![^>]*src=)[^>]*>(.*?)</script>', s, re.S)), encoding='utf-8')"
          && node --check ff7r-inline.js
      - name: Plugin descriptor
        run: python -c "from games.ff7r.plugin import PLUGIN; from plugin_api import validate_plugin; from runtime_bootstrap import SERVICE_MODULES; validate_plugin(PLUGIN); assert 'games.ff7r.server' in SERVICE_MODULES; print(PLUGIN.name)"
      - name: Gameplay, text, semantic and runtime regressions
        run: python -m pytest -q tests/test_ff7r_dataobject.py tests/test_ff7r_dataobject_structural.py tests/test_ff7r_textresource.py tests/test_ff7r_textresource_structural.py tests/test_ff7r_semantics.py tests/test_ff7r_editor_semantics.py tests/test_ff7r_runtime_config.py tests/test_ff7r_runtime_state.py tests/test_ff7r_runtime_heartbeat.py tests/test_ff7r_minimap_semantics.py tests/test_ff7r_minimap_runtime_probe.py tests/test_ff7r_cutscene_runtime_probe.py tests/test_ff7r_native_probe.py tests/test_ff7r_research_dataobject.py tests/test_ff7r_cheat_probe.py tests/test_ff7r_cheat_probe_safety.py tests/test_ff7r_no_more_cheats_tweaks.py tests/test_ff7r_raw_asset_probe.py tests/test_ff7r_package_probe.py tests/test_ff7r_lockon_probe.py tests/test_ff7r_lockon_text_probe.py tests/test_ff7r_unscanned_name_probe.py tests/test_ff7r_save_diff_probe.py tests/test_ff7r_save_diff_cli.py tests/test_ff7r_dog_whistle_probe.py tests/test_ff7r_dog_whistle_safety.py tests/test_ff7r_atb_runtime_probe.py tests/test_ff7r_atb_tweaks.py tests/test_ff7r_graphics_tweaks.py tests/test_ff7r_encounter_tweaks.py tests/test_ff7r_better_sprint_runtime.py tests/test_ff7r_hp_rebalance_runtime.py tests/test_ff7r_hp_rebalance_probe.py tests/test_ff7r_bench_probe.py
      - name: Managed service smoke
        run: python -c "from games.ff7r.plugin import smoke; [print('PASS:', line) for line in smoke()]"
