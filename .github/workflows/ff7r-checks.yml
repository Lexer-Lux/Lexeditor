name: FF7R checks

on:
  push:
    branches: [master, feature/ff7-remake-plugin, 'work/ff7r-*']
    paths:
      - 'plugins/ff7r/**'
      - 'tools/ff7r_*.py'
      - 'tools/ff7r/**'
      - 'tools/build_distribution.py'
      - 'tests/test_ff7r_*.py'
      - 'tests/ff7r_browser_check.py'
      - 'runtime_bootstrap.py'
      - 'plugin_api.py'
      - 'service_session.py'
      - 'requirements.txt'
      - '.github/workflows/ff7r-checks.yml'
  pull_request:
    paths:
      - 'plugins/ff7r/**'
      - 'tools/ff7r_*.py'
      - 'tools/ff7r/**'
      - 'tools/build_distribution.py'
      - 'tests/test_ff7r_*.py'
      - 'tests/ff7r_browser_check.py'
      - 'runtime_bootstrap.py'
      - 'plugin_api.py'
      - 'service_session.py'
      - 'requirements.txt'
      - '.github/workflows/ff7r-checks.yml'

permissions:
  contents: read

concurrency:
  group: ff7r-${{ github.ref }}
  cancel-in-progress: true

jobs:
  regression:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test and theme decoder dependencies
        run: python -m pip install pytest Pillow==12.3.0 texfury==1.6.2 'cryptography>=42'
      - name: Python syntax
        run: python -m compileall -q plugins/ff7r tools
      - name: Editor JavaScript syntax
        run: >-
          python -c "from pathlib import Path; import re; s=Path('plugins/ff7r/editor.html').read_text(encoding='utf-8'); Path('ff7r-inline.js').write_text('\n'.join(re.findall(r'<script(?![^>]*src=)[^>]*>(.*?)</script>', s, re.S)), encoding='utf-8')"
          && node --check ff7r-inline.js
      - name: Editor module JavaScript syntax
        run: node --check plugins/ff7r/editor.js
      - name: Theme JavaScript syntax
        run: node --check plugins/ff7r/game-appearance.js
      - name: Plugin descriptor
        run: python -c "from plugins.ff7r.plugin import PLUGIN; from plugin_api import validate_plugin; from runtime_bootstrap import SERVICE_MODULES; validate_plugin(PLUGIN); assert 'plugins.ff7r.server' in SERVICE_MODULES; assert 'plugins.ff7r.themed_server' in SERVICE_MODULES; print(PLUGIN.name)"
      - name: Gameplay, text, semantic and runtime regressions
        run: >-
          python -c "from pathlib import Path; import pytest; files=[str(path) for path in sorted(Path('tests').glob('test_ff7r_*.py'))]; print(f'Running {len(files)} FF7R test files'); raise SystemExit(pytest.main(['-q', *files]))"
      - name: Managed service smoke
        run: python -c "from plugins.ff7r.plugin import smoke; [print('PASS:', line) for line in smoke()]"

  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install rendered-acceptance dependency
        run: |
          python -m pip install playwright==1.57.0
          python -m playwright install --with-deps chromium
      - name: Exercise rendered FF7R editor and capture evidence
        run: python tests/ff7r_browser_check.py --screenshots out/ff7r-browser
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: ff7r-browser-${{ github.event.pull_request.head.sha || github.sha }}
          path: out/ff7r-browser/
          retention-days: 7

  windows-candidate:
    needs: regression
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install candidate dependencies
        run: python -m pip install -r requirements.txt pyinstaller==6.16.0
      - name: Build and inspect isolated FF7R candidate
        env:
          LEXEDITOR_CANDIDATE_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: python tools/ff7r/build_windows_candidate.py
      - name: Verify candidate payload
        shell: pwsh
        run: |
          $root = 'out/ff7r-windows-candidate'
          $manifest = Get-Content "$root/candidate-manifest.json" | ConvertFrom-Json
          if (-not (Test-Path "$root/Lexeditor/Lexeditor.exe")) { throw 'Candidate app is missing' }
          if (-not (Test-Path "$root/Launch-FF7R-Candidate.cmd")) { throw 'Candidate launcher is missing' }
          if (-not (Test-Path "$root/FF7R-ACCEPTANCE.txt")) { throw 'Candidate acceptance guide is missing' }
          if (-not (Test-Path "$root/Lexeditor/_internal/plugins/ff7r/runtime/repak/v0.2.3/repak_cli-x86_64-pc-windows-msvc.zip")) { throw 'Bundled repak archive is missing' }
          if (-not (Test-Path "$root/Lexeditor/_internal/plugins/ff7r/credits.md")) { throw 'FF7R plugin credits are missing' }
          if ($manifest.headSha -ne '${{ github.event.pull_request.head.sha || github.sha }}') { throw 'Candidate manifest head SHA mismatch' }
          $manifest | ConvertTo-Json -Depth 6
      - name: Upload isolated FF7R acceptance candidate
        uses: actions/upload-artifact@v4
        with:
          name: ff7r-windows-candidate
          path: out/ff7r-windows-candidate
          retention-days: 14
          if-no-files-found: error
