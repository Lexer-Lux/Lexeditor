name: FF7R checks

on:
  push:
    branches: [master, feature/ff7-remake-plugin, 'work/ff7r-*']
    paths:
      - 'games/ff7r/**'
      - 'tools/ff7r_*.py'
      - 'tests/test_ff7r_*.py'
      - 'tests/ff7r_browser_check.py'
      - 'runtime_bootstrap.py'
      - 'plugin_api.py'
      - 'service_session.py'
      - '.github/workflows/ff7r-checks.yml'
  pull_request:
    paths:
      - 'games/ff7r/**'
      - 'tools/ff7r_*.py'
      - 'tests/test_ff7r_*.py'
      - 'tests/ff7r_browser_check.py'
      - 'runtime_bootstrap.py'
      - 'plugin_api.py'
      - 'service_session.py'
      - '.github/workflows/ff7r-checks.yml'

permissions:
  contents: write

concurrency:
  group: ff7r-${{ github.ref }}
  cancel-in-progress: true

jobs:
  regression:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test and theme decoder dependencies
        run: python -m pip install pytest Pillow==12.3.0 texfury==1.6.2 'cryptography>=42'
      - name: Python syntax
        run: python -m compileall -q games/ff7r tools
      - name: Editor JavaScript syntax
        run: >-
          python -c "from pathlib import Path; import re; s=Path('games/ff7r/editor.html').read_text(encoding='utf-8'); Path('ff7r-inline.js').write_text('\n'.join(re.findall(r'<script(?![^>]*src=)[^>]*>(.*?)</script>', s, re.S)), encoding='utf-8')"
          && node --check ff7r-inline.js
      - name: Editor module JavaScript syntax
        run: node --check games/ff7r/editor.js
      - name: Theme JavaScript syntax
        run: node --check games/ff7r/game-appearance.js
      - name: Plugin descriptor
        run: python -c "from games.ff7r.plugin import PLUGIN; from plugin_api import validate_plugin; from runtime_bootstrap import SERVICE_MODULES; validate_plugin(PLUGIN); assert 'games.ff7r.server' in SERVICE_MODULES; assert 'games.ff7r.themed_server' in SERVICE_MODULES; print(PLUGIN.name)"
      - name: Gameplay, text, semantic and runtime regressions
        run: >-
          python -c "from pathlib import Path; import pytest; files=[str(path) for path in sorted(Path('tests').glob('test_ff7r_*.py'))]; print(f'Running {len(files)} FF7R test files'); raise SystemExit(pytest.main(['-q', *files]))"
      - name: Managed service smoke
        run: python -c "from games.ff7r.plugin import smoke; [print('PASS:', line) for line in smoke()]"
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install rendered-acceptance dependency
        run: |
          python -m pip install playwright==1.57.0
          python -m playwright install --with-deps chromium
      - name: Exercise rendered FF7R editor and capture evidence
        run: python tests/ff7r_browser_check.py --screenshots out/ff7r-browser
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: ff7r-browser-${{ github.sha }}
          path: out/ff7r-browser/
          retention-days: 7



  repak-vendor-candidate:
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'codex/ff7r-1-plugin-completion'
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/ff7r-1-plugin-completion
      - name: Vendor exact repak v0.2.3 release archives
        shell: bash
        run: |
          set -euo pipefail
          target=games/ff7r/runtime/repak/v0.2.3
          mkdir -p "$target"
          curl -L --fail --retry 3 -o "$target/repak_cli-x86_64-pc-windows-msvc.zip" \
            https://github.com/trumank/repak/releases/download/v0.2.3/repak_cli-x86_64-pc-windows-msvc.zip
          echo "6720d602144d75df477a99d5bedb6ea780997546afc335901d4937cafeaa73fa  $target/repak_cli-x86_64-pc-windows-msvc.zip" | sha256sum -c -
          curl -L --fail --retry 3 -o "$target/repak_cli-x86_64-unknown-linux-gnu.tar.xz" \
            https://github.com/trumank/repak/releases/download/v0.2.3/repak_cli-x86_64-unknown-linux-gnu.tar.xz
          echo "933bdb8e26f34e8fd70ea50201efca39df041de58aa83b1cd6eb83da124a2046  $target/repak_cli-x86_64-unknown-linux-gnu.tar.xz" | sha256sum -c -
          curl -L --fail --retry 3 -o "$target/LICENSE-MIT" \
            https://raw.githubusercontent.com/trumank/repak/e215472c51db69328b1ce77be2db24d24c1d646b/LICENSE-MIT
          curl -L --fail --retry 3 -o "$target/LICENSE-APACHE" \
            https://raw.githubusercontent.com/trumank/repak/e215472c51db69328b1ce77be2db24d24c1d646b/LICENSE-APACHE
          python - <<'PY'
          import hashlib, json, tarfile, tempfile, zipfile
          from pathlib import Path
          root=Path("games/ff7r/runtime/repak/v0.2.3")
          win=root/"repak_cli-x86_64-pc-windows-msvc.zip"
          linux=root/"repak_cli-x86_64-unknown-linux-gnu.tar.xz"
          with zipfile.ZipFile(win) as package:
              executable=package.read("repak.exe")
          with tarfile.open(linux,"r:xz") as package:
              member=next(m for m in package.getmembers() if m.isfile() and Path(m.name).name=="repak")
              source=package.extractfile(member)
              assert source is not None
              linux_executable=source.read()
          manifest={
              "source":"https://github.com/trumank/repak/releases/tag/v0.2.3",
              "tag":"v0.2.3",
              "commit":"e215472c51db69328b1ce77be2db24d24c1d646b",
              "platforms":{
                  "win32":{
                      "archive":win.name,
                      "archiveSha256":hashlib.sha256(win.read_bytes()).hexdigest(),
                      "kind":"zip","member":"repak.exe",
                      "executableSha256":hashlib.sha256(executable).hexdigest(),
                  },
                  "linux":{
                      "archive":linux.name,
                      "archiveSha256":hashlib.sha256(linux.read_bytes()).hexdigest(),
                      "kind":"tar.xz","member":"repak",
                      "executableSha256":hashlib.sha256(linux_executable).hexdigest(),
                  },
              },
              "licenses":["LICENSE-MIT","LICENSE-APACHE"],
          }
          expected={
              "win32":("6720d602144d75df477a99d5bedb6ea780997546afc335901d4937cafeaa73fa",
                       "fcd538e5994b9bb833622d425ae346f4e0692f02d4b0025114a559f9b6286022"),
              "linux":("933bdb8e26f34e8fd70ea50201efca39df041de58aa83b1cd6eb83da124a2046",
                       "fce30661c951ce56fd2507a44a1e03637e3ea06a1b7cc8035bd62c0b37dd9457"),
          }
          for key,(archive_sha,exe_sha) in expected.items():
              row=manifest["platforms"][key]
              assert row["archiveSha256"]==archive_sha,(key,row["archiveSha256"])
              assert row["executableSha256"]==exe_sha,(key,row["executableSha256"])
          (root/"manifest.json").write_text(json.dumps(manifest,indent=2)+"\n",encoding="utf-8")
          PY
          git add "$target"
          if git diff --cached --quiet; then
            echo "repak v0.2.3 is already vendored exactly"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Bundle pinned repak v0.2.3 for FF7R"
          git push origin HEAD:codex/ff7r-1-plugin-completion
