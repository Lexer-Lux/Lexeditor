name: Integrate 1.1 game work
on:
  push:
    branches: [integration/1.1]
    paths: [.github/workflows/integrate-1.1.yml]
permissions:
  contents: write
jobs:
  integrate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: integration/1.1
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Merge completed FF8 and FF9 branches
        run: |
          set -euo pipefail
          git config user.name 'Lexeditor 1.1 Integration'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin master fix/ff8-backlog-runtime codex/ff9-issues-20260906
          if ! git merge-base --is-ancestor origin/fix/ff8-backlog-runtime HEAD; then git merge --no-edit -X theirs origin/fix/ff8-backlog-runtime; fi
          if ! git merge-base --is-ancestor origin/codex/ff9-issues-20260906 HEAD; then git merge --no-edit -X theirs origin/codex/ff9-issues-20260906; fi
          git push origin HEAD:integration/1.1
      - name: Install test dependencies
        run: python -m pip install -r requirements.txt pytest pefile unicorn
      - name: Run global and FF9 Python tests
        run: |
          python -m unittest discover -s tests -p 'test_global*.py' -v
          PYTHONPATH=. pytest -q tests/test_ff9_csv.py tests/test_ff9_http.py tests/test_ff9_runtime.py
      - name: Run FF9 JavaScript checks
        run: |
          node --check ui/framework.js
          node tests/ff9_editor.test.cjs
      - name: Run portable FF8 integration verifiers
        run: |
          python tools/verify_ff8_shared_party.py
          python tools/verify_ff8_no_magic_consumption.py
          python tools/verify_ff8_mug_drops.py
          python tools/verify_ff8_stock_tweak_settings.py
          python tools/verify_ff8_gameplay_quarantine_issue_21.py
          echo 'Max Spell native execution verifier intentionally omitted here: it requires the private supported FF8 executable by SHA-256; its branch-side evidence remains preserved in the FF8 worklog.'
# final 1.1 portable verification
