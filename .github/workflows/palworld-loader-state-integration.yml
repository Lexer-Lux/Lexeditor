name: Palworld loader-state integration patch

on:
  push:
    branches:
      - feature/palworld-plugin
    paths:
      - '.github/workflows/palworld-loader-state-integration.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/palworld-plugin
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Integrate read-only loader state
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def patch(path, old, new):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              if old not in text:
                  raise SystemExit(f'anchor not found in {path}: {old[:100]!r}')
              p.write_text(text.replace(old, new, 1), encoding='utf-8')

          patch(
              'runtime_bootstrap.py',
              "'games.ff8.server', 'games.ff9.server', 'games.palworld.build_server', 'games.rdr.server'",
              "'games.ff8.server', 'games.ff9.server', 'games.palworld.full_server', 'games.rdr.server'",
          )

          patch(
              'games/palworld/plugin.py',
              'module="games.palworld.build_server",',
              'module="games.palworld.full_server",',
          )
          patch(
              'games/palworld/plugin.py',
              '                "official-local-workshop-deploy",\n            }',
              '                "official-local-workshop-deploy",\n                "official-loader-state-readonly",\n            }',
          )
          patch(
              'games/palworld/plugin.py',
              '        workshop.mkdir(parents=True)\n\n        # Synthetic stand-in',
              '        workshop.mkdir(parents=True)\n        loader_settings = game / "Mods" / "PalModSettings.ini"\n        loader_settings.parent.mkdir(parents=True, exist_ok=True)\n        loader_settings.write_text(\n            "[PalModSettings]\\n"\n            "bGlobalEnableMod=True\\n"\n            f"WorkshopRootDir={workshop}\\n"\n            "ActiveModList=LexeditorSmoke\\n",\n            encoding="utf-8",\n        )\n\n        # Synthetic stand-in',
          )
          patch(
              'games/palworld/plugin.py',
              '            if not required.issubset(capabilities):\n                raise RuntimeError("Palworld service did not advertise the complete authoring/test path")\n\n            info = request_json',
              '            if not required.issubset(capabilities):\n                raise RuntimeError("Palworld service did not advertise the complete authoring/test path")\n            loader = request_json(session.url + "api/loader-state")\n            if (\n                loader.get("readOnly") is not True\n                or loader.get("available") is not True\n                or loader.get("active") is not True\n                or loader.get("listed") is not True\n                or loader.get("packageName") != "LexeditorSmoke"\n            ):\n                raise RuntimeError("Palworld service did not expose the active loader configuration read-only")\n\n            info = request_json',
          )
          patch(
              'games/palworld/plugin.py',
              '        "managed Palworld service identified the selected official package project",\n',
              '        "managed Palworld service identified the selected official package project",\n        "read-only PalModSettings state identified the active package without changing activation",\n',
          )

          patch(
              'games/palworld/build-ui.js',
              'let palBuildState=null,palWorkshopState=null,palBuildLoading=false,palBuildError="";',
              'let palBuildState=null,palWorkshopState=null,palLoaderState=null,palBuildLoading=false,palBuildError="";',
          )
          patch(
              'games/palworld/build-ui.js',
              'const results=await Promise.all([api("/api/build"),api("/api/workshop")]);\n    palBuildState=results[0];palWorkshopState=results[1];',
              'const results=await Promise.all([api("/api/build"),api("/api/workshop"),api("/api/loader-state")]);\n    palBuildState=results[0];palWorkshopState=results[1];palLoaderState=results[2];',
          )
          patch(
              'games/palworld/build-ui.js',
              'function palBuildPanel(){',
              '''function palLoaderStatusText(){
  const state=palLoaderState;
  if(!state)return "Not checked";
  if(state.error)return state.error;
  if(!state.available)return state.reason||"PalModSettings.ini not available";
  if(state.active)return "Active";
  if(state.listed)return "Listed, but mods are globally disabled";
  return "Not active — enable through Palworld Mod Management";
}
function palBuildPanel(){''',
          )
          patch(
              'games/palworld/build-ui.js',
              '      detailField({label:"TARGET",control:readonlyField(workshop.targetPath||"Not deployed")}),\n      detailField({label:"ACTIONS",control:el("div",{class:"pal-actions"},',
              '      detailField({label:"TARGET",control:readonlyField(workshop.targetPath||"Not deployed")}),\n      detailField({label:"LOADER GLOBAL",control:readonlyField(palLoaderState?.globalEnabled===true?"Enabled":palLoaderState?.globalEnabled===false?"Disabled":"Unknown")}),\n      detailField({label:"PACKAGE ACTIVE",control:readonlyField(palLoaderStatusText()),help:infoHelp("Read-only view of Mods/PalModSettings.ini. Lexeditor never changes ActiveModList or the global enable flag for the Windows client.")}),\n      detailField({label:"LOADER WORKSHOP ROOT",control:readonlyField(palLoaderState?.workshopRootDir||"Not available")}),\n      detailField({label:"ACTIONS",control:el("div",{class:"pal-actions"},',
          )

          patch(
              'tests/palworld_browser_check.py',
              '    workshop.mkdir(parents=True)\n\n    schema_root = game',
              '    workshop.mkdir(parents=True)\n    loader_settings = game / "Mods" / "PalModSettings.ini"\n    loader_settings.parent.mkdir(parents=True, exist_ok=True)\n    loader_settings.write_text(\n        "[PalModSettings]\\n"\n        "bGlobalEnableMod=True\\n"\n        f"WorkshopRootDir={workshop}\\n"\n        "ActiveModList=BrowserFixture\\n",\n        encoding="utf-8",\n    )\n\n    schema_root = game',
          )
          patch(
              'tests/palworld_browser_check.py',
              '                    page.wait_for_function("palBuildState?.ready === true && palWorkshopState?.ready === true && !palBuildLoading")\n',
              '                    page.wait_for_function("palBuildState?.ready === true && palWorkshopState?.ready === true && palLoaderState?.readOnly === true && !palBuildLoading")\n                    loader = page.evaluate("palLoaderState")\n                    assert loader["active"] is True\n                    assert loader["listed"] is True\n                    assert loader["packageName"] == "BrowserFixture"\n',
          )

          patch(
              'games/palworld/DATA_MAP.md',
              '| Loader activation config | `<Palworld>/Mods/PalModSettings.ini` | **Known runtime config, not edited** | Windows client activation stays owned by Palworld\'s Options → Mod Management UI. Lexeditor does not modify `ActiveModList` or global enable state. |',
              '| Loader activation config | `<Palworld>/Mods/PalModSettings.ini` | **Read-only loader state** | Lexeditor reads global enable, WorkshopRootDir and repeated ActiveModList entries so Build can report whether the current PackageName is active. Activation stays owned by Palworld\'s Options → Mod Management UI; Lexeditor never writes this file. |',
          )

          # This one-shot integration workflow removes itself in the resulting commit.
          Path('.github/workflows/palworld-loader-state-integration.yml').unlink()
          PY
      - name: Verify syntax and loader-state tests
        run: |
          python -m compileall -q games/palworld runtime_bootstrap.py
          python -m unittest tests.test_palworld_loader_state -v
          node --check games/palworld/build-ui.js
      - name: Commit loader-state integration
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Integrate read-only Palworld loader state'
          git push origin HEAD:feature/palworld-plugin
