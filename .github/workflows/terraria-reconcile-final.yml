name: Reconcile Terraria plugin implementation

on:
  push:
    branches: [feature/terraria-plugin]
    paths:
      - '.github/workflows/terraria-reconcile-final.yml'

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Reconcile implementation
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              target = Path(path)
              text = target.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected one anchor, found {count}: {old[:100]!r}')
              target.write_text(text.replace(old, new, 1), encoding='utf-8')

          # ---- Content wizard: ModItem ----
          replace_once('games/terraria/server.py',
              'from .build_metadata import BOOLEAN_KEYS, parse_build_text, update_build_text\n',
              'from .build_metadata import BOOLEAN_KEYS, parse_build_text, update_build_text\nfrom .content_wizard import create_mod_item\n')
          replace_once('games/terraria/server.py',
              'def _installation_root() -> Path:\n',
              'def create_content_item(name: object, display_name: object = "", tooltip: object = "") -> dict:\n    return create_mod_item(project_root(), name, display_name, tooltip)\n\n\ndef _installation_root() -> Path:\n')
          replace_once('games/terraria/server.py',
              '"build-metadata", "localization", "source-text", "assets", "native-build",\n',
              '"build-metadata", "localization", "source-text", "assets", "content-wizard", "native-build",\n')
          replace_once('games/terraria/server.py',
              '            if path == "/api/localization/file":\n',
              '            if path == "/api/content/item":\n                payload = self.read_json()\n                if not isinstance(payload, dict) or set(payload) != {"name", "displayName", "tooltip"}:\n                    raise ValueError("Expected name, displayName and tooltip only")\n                self.send_json(create_content_item(payload["name"], payload["displayName"], payload["tooltip"]))\n                return\n            if path == "/api/localization/file":\n')

          replace_once('games/terraria/editor.html',
              '.terraria-build-row,.terraria-localization-toolbar,.terraria-localization-create,.terraria-source-toolbar,.terraria-source-create,.terraria-asset-toolbar,.terraria-asset-action{',
              '.terraria-build-row,.terraria-localization-toolbar,.terraria-localization-create,.terraria-source-toolbar,.terraria-source-create,.terraria-asset-toolbar,.terraria-asset-action,.terraria-content-form{')
          replace_once('games/terraria/editor.html',
              '.terraria-localization-create input,.terraria-source-create input,.terraria-asset-action input[type="text"]{',
              '.terraria-localization-create input,.terraria-source-create input,.terraria-asset-action input[type="text"],.terraria-content-form input{')
          replace_once('games/terraria/editor.html',
              '  let assetFiles=[],assetCurrent=null,assetLoading=false,assetNewPath="",assetImportFile=null,assetReplaceFile=null,error="";\n',
              '  let assetFiles=[],assetCurrent=null,assetLoading=false,assetNewPath="",assetImportFile=null,assetReplaceFile=null;\n  let contentCreating=false,contentName="",contentDisplay="",contentTooltip="",contentResult=null,error="";\n')
