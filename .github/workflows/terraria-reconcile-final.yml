    const name=contentName.trim();if(!name){error="Enter an internal item name.";render();return}
    contentCreating=true;contentResult=null;error="";render();
    try{
      const result=await request("/api/content/item",{method:"POST",body:JSON.stringify({name,displayName:contentDisplay,tooltip:contentTooltip})});
      const [source,localization,assets,map,locState]=await Promise.all([request("/api/source"),request("/api/localization"),request("/api/assets"),request("/api/data-map"),request(`/api/localization/file?path=${encodeURIComponent(result.localizationPath)}`)]);
      sourceFiles=source.files;localizationFiles=localization.files;assetFiles=assets.files;mapRows=map.rows;
      sourceSaved=clone(result.source);sourceCurrent=clone(result.source);locSaved=clone(locState);locCurrent=clone(locState);assetCurrent=result.texture;
      contentResult=result;contentName="";contentDisplay="";contentTooltip="";
    }catch(exc){error=String(exc.message||exc)}
    contentCreating=false;render();
  }
  function contentPanel(){
    const locked=contentCreating||dirtyCount()>0;
    const form=el("div",{class:"terraria-note terraria-content-form"},el("strong",{},"New ModItem"),el("input",{type:"text",value:contentName,placeholder:"Internal name (ExampleSword)",disabled:locked,oninput:event=>{contentName=event.target.value}}),el("input",{type:"text",value:contentDisplay,placeholder:"Display name (optional)",disabled:locked,oninput:event=>{contentDisplay=event.target.value}}),el("input",{type:"text",value:contentTooltip,placeholder:"Tooltip (optional, one line)",disabled:locked,oninput:event=>{contentTooltip=event.target.value}}),el("button",{class:"terraria-build-button",type:"button",disabled:locked,onclick:createContentItem},contentCreating?"CREATING…":"CREATE ITEM"));
    const notes=[el("div",{class:"terraria-note"},"Creates a minimal ModItem with only width/height defaults, standard en-US localization, and a visible replaceable placeholder PNG. Gameplay/balance values are never guessed.")];
    if(contentResult)notes.unshift(el("div",{class:"terraria-note terraria-success"},el("strong",{},`${contentResult.name} created.`),el("div",{class:"terraria-build-path"},`Source: ${contentResult.source.path}`),el("div",{class:"terraria-build-path"},`Texture: ${contentResult.texture.path}`),el("div",{class:"terraria-build-path"},`Localization: ${contentResult.localizationPath}`)));
    return el("div",{class:"terraria-page"},...warnings(),form,...notes);
  }
'''
          replace_once('games/terraria/editor.html','  function addLocalizationEntry(){\n',content_functions+'  function addLocalizationEntry(){\n')
          replace_once('games/terraria/editor.html',
              '    const content=tab==="datamap"?dataMapPanel():tab==="assets"?assetsPanel():tab==="source"?sourcePanel():tab==="localization"?localizationPanel():tab==="dependencies"?dependenciesPanel():metadataPanel();\n',
              '    const content=tab==="datamap"?dataMapPanel():tab==="assets"?assetsPanel():tab==="source"?sourcePanel():tab==="localization"?localizationPanel():tab==="content"?contentPanel():tab==="dependencies"?dependenciesPanel():metadataPanel();\n')
          replace_once('games/terraria/editor.html',
