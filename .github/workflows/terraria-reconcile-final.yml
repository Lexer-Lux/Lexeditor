          replace_once('games/terraria/server.py','            if path == "/api/content/item":\n','            if path == "/api/content/system":\n                payload = self.read_json()\n                if not isinstance(payload, dict) or set(payload) != {"name"}:\n                    raise ValueError("Expected name only")\n                self.send_json(create_content_system(payload["name"]))\n                return\n            if path == "/api/content/player":\n                payload = self.read_json()\n                if not isinstance(payload, dict) or set(payload) != {"name"}:\n                    raise ValueError("Expected name only")\n                self.send_json(create_content_player(payload["name"]))\n                return\n            if path == "/api/content/item":\n')
          replace_once('games/terraria/editor.html','  let contentCreating=false,contentName="",contentDisplay="",contentTooltip="",contentResult=null,error="";\n','  let contentCreating=false,contentKind="item",contentName="",contentDisplay="",contentTooltip="",contentResult=null,error="";\n')
          old_create = '''  async function createContentItem(){\n    if(contentCreating||dirtyCount())return;\n    const name=contentName.trim();if(!name){error="Enter an internal item name.";render();return}\n    contentCreating=true;contentResult=null;error="";render();\n    try{\n      const result=await request("/api/content/item",{method:"POST",body:JSON.stringify({name,displayName:contentDisplay,tooltip:contentTooltip})});\n      const [source,localization,assets,map,locState]=await Promise.all([request("/api/source"),request("/api/localization"),request("/api/assets"),request("/api/data-map"),request(`/api/localization/file?path=${encodeURIComponent(result.localizationPath)}`)]);\n      sourceFiles=source.files;localizationFiles=localization.files;assetFiles=assets.files;mapRows=map.rows;\n      sourceSaved=clone(result.source);sourceCurrent=clone(result.source);locSaved=clone(locState);locCurrent=clone(locState);assetCurrent=result.texture;\n      contentResult=result;contentName="";contentDisplay="";contentTooltip="";\n    }catch(exc){error=String(exc.message||exc)}\n    contentCreating=false;render();\n  }\n'''
          new_create = '''  async function createContentScaffold(){\n    if(contentCreating||dirtyCount())return;\n    const name=contentName.trim();if(!name){error="Enter an internal content name.";render();return}\n    contentCreating=true;contentResult=null;error="";render();\n    try{\n      const endpoint=contentKind==="system"?"/api/content/system":contentKind==="player"?"/api/content/player":"/api/content/item";\n      const body=contentKind==="item"?{name,displayName:contentDisplay,tooltip:contentTooltip}:{name};\n      const result=await request(endpoint,{method:"POST",body:JSON.stringify(body)});\n      const [source,localization,assets,map]=await Promise.all([request("/api/source"),request("/api/localization"),request("/api/assets"),request("/api/data-map")]);\n      sourceFiles=source.files;localizationFiles=localization.files;assetFiles=assets.files;mapRows=map.rows;sourceSaved=clone(result.source);sourceCurrent=clone(result.source);\n      if(result.localizationPath){const locState=await request(`/api/localization/file?path=${encodeURIComponent(result.localizationPath)}`);locSaved=clone(locState);locCurrent=clone(locState)}\n      if(result.texture)assetCurrent=result.texture;contentResult=result;contentName="";contentDisplay="";contentTooltip="";\n    }catch(exc){error=String(exc.message||exc)}\n    contentCreating=false;render();\n  }\n'''
