    const form=el("div",{class:"terraria-note terraria-content-form"},el("strong",{},"New scaffold"),typeSelect,el("input",{type:"text",value:contentName,placeholder:itemOnly?"Internal name (ExampleSword)":contentKind==="system"?"Class name (WorldTracker)":"Class name (ExamplePlayer)",disabled:locked,oninput:event=>{contentName=event.target.value}}),el("input",{type:"text",value:contentDisplay,placeholder:"Display name (optional)",disabled:locked||!itemOnly,oninput:event=>{contentDisplay=event.target.value}}),el("input",{type:"text",value:contentTooltip,placeholder:"Tooltip (optional, one line)",disabled:locked||!itemOnly,oninput:event=>{contentTooltip=event.target.value}}),el("button",{class:"terraria-build-button",type:"button",disabled:locked,onclick:createContentScaffold},contentCreating?"CREATING…":"CREATE"));
    const explanation=itemOnly?"ModItem creates minimal C#, standard en-US localization and a replaceable placeholder PNG. Gameplay values are explicit follow-up edits.":contentKind==="system"?"ModSystem creates an empty Common/Systems class against the stable ModSystem API.":"ModPlayer creates an empty Common/Players class against the stable ModPlayer API.";
    const notes=[el("div",{class:"terraria-note"},explanation)];
    if(contentResult){const details=[el("strong",{},`${contentResult.name} created.`),el("div",{class:"terraria-build-path"},`Source: ${contentResult.source.path}`)];if(contentResult.texture)details.push(el("div",{class:"terraria-build-path"},`Texture: ${contentResult.texture.path}`));if(contentResult.localizationPath)details.push(el("div",{class:"terraria-build-path"},`Localization: ${contentResult.localizationPath}`));notes.unshift(el("div",{class:"terraria-note terraria-success"},...details))}
    return el("div",{class:"terraria-page"},...warnings(),form,...notes);
  }
'''
