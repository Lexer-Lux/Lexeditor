name: FFX-X2 post-sync CI compatibility

on:
  push:
    branches: [feature/ffx-x2-plugin]
    paths:
      - '.github/workflows/ffx-x2-ci-compat.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply compatibility fix
        run: python .github/scripts/ffx_x2_ci_compat_patch.py
      - name: Validate and push
        run: |
          python -m py_compile .github/scripts/ui_visual_acceptance.py
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/scripts/ffx_x2_ci_compat_patch.py
          git add .github/scripts/ui_visual_acceptance.py
          git commit -m "Align visual acceptance with current graph layout"
          git push origin HEAD:feature/ffx-x2-plugin
