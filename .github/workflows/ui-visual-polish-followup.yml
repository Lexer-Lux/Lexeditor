name: Shared UI visual polish follow-up

on:
  push:
    branches:
      - fix/ui-standardization-20260906

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/ui-standardization-20260906
          fetch-depth: 0
      - name: Apply visual polish
        run: python .github/scripts/ui_visual_polish_followup.py
      - name: Validate shared assets
        run: |
          node --check ui/framework.js
          grep -q -- '--lex-detail-label-width:10%' ui/framework.css
          grep -q 'LEXEDITOR_UI_VISUAL_POLISH_20260906' ui/framework.css
          grep -q 'lex-toggle-name' ui/framework.js
      - name: Commit and remove patch machinery
        run: |
          git rm -f .github/workflows/ui-visual-polish-followup.yml .github/scripts/ui_visual_polish_followup.py
          git config user.name 'Lexeditor UI maintenance'
          git config user.email '89482099+Lexer-Lux@users.noreply.github.com'
          git add ui/framework.css ui/framework.js
          git commit -m 'Fix shared label, ref rail, reset, and barrel geometry'
          git push origin HEAD:fix/ui-standardization-20260906
