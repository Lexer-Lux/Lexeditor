name: Stardew credits export

on:
  push:
    branches: [stardew-valley-plugin]

permissions:
  contents: write

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Finalize acceptance UI and canonical credits
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('games/stardew_valley/editor.html')
          text = path.read_text(encoding='utf-8')
          replacements = {
              '"Verify New SMAPI Run"': '"Verify Acceptance Evidence"',
              'Begin acceptance after deploying a representative edit. Then launch Stardew through SMAPI, reach the title screen, return to Lexeditor, and verify the new runtime log.': 'Begin acceptance after deploying a representative edit. Then launch Stardew through SMAPI, reach the title screen, run patch export \\"Data/Objects\\" in the SMAPI console, return to Lexeditor, and verify the new runtime evidence.',
          }
          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit(f'missing expected editor text: {old}')
              text = text.replace(old, new, 1)
          path.write_text(text, encoding='utf-8')
          PY
          python tools/generate_credits.py
          git rm .github/workflows/stardew-credits-export.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add games/stardew_valley/editor.html ui/credits.json
          git commit -m "Finalize Stardew acceptance and credits"
          git push origin HEAD:stardew-valley-plugin
