name: Stardew credits export

on:
  push:
    branches: [stardew-valley-plugin]

permissions:
  contents: write

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Generate and commit canonical credits
        run: |
          python tools/generate_credits.py
          git rm .github/workflows/stardew-credits-export.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ui/credits.json
          git commit -m "Regenerate credits after Stardew merge"
          git push origin HEAD:stardew-valley-plugin
