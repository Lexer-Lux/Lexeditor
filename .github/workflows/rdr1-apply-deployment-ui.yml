name: Apply RDR1 deployment UI
on:
  push:
    branches: [fix/rdr1-runtime-repo-link]
    paths: ['.github/workflows/rdr1-apply-deployment-ui.yml']
permissions:
  contents: write
jobs:
  apply:
    if: github.actor == 'Lexer-Lux'
    runs-on: windows-2022
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Apply exact deployment integration and verify Python contracts
        shell: pwsh
        run: |
          python .github/rdr1-deployment-ui-edit.py
          python -m py_compile games/rdr/server.py games/rdr/archive_deployment.py
          python tools/verify_rdr_archive_deployment.py
          python tools/verify_rdr_editing.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Commit source changes, rebase any concurrent branch updates, and push
        shell: pwsh
        run: |
          Remove-Item .github/rdr1-deployment-ui-edit.py
          git rm .github/workflows/rdr1-apply-deployment-ui.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add games/rdr/server.py games/rdr/editor.html tools/verify_rdr_editing_browser.py
          git commit -m "feat(rdr1): deploy project archive copies through the update folder"
          git pull --rebase origin fix/rdr1-runtime-repo-link
          git push origin HEAD:fix/rdr1-runtime-repo-link
