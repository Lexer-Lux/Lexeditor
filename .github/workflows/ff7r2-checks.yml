name: FF7R2 checks

on:
  push:
    branches: [master, codex/ff7r-2-plugin-completion]
    paths:
      - 'plugins/ff7r2/**'
      - 'tests/ff7r2_fixture.py'
      - 'tests/test_ff7r2_*.py'
      - 'tests/ff7r2_browser_check.py'
      - 'runtime_bootstrap.py'
      - 'plugin_api.py'
      - 'service_session.py'
      - '.github/workflows/ff7r2-checks.yml'
  pull_request:
    paths:
      - 'plugins/ff7r2/**'
      - 'tests/ff7r2_fixture.py'
      - 'tests/test_ff7r2_*.py'
      - 'tests/ff7r2_browser_check.py'
      - 'runtime_bootstrap.py'
      - 'plugin_api.py'
      - 'service_session.py'
      - '.github/workflows/ff7r2-checks.yml'

permissions:
  contents: read

concurrency:
  group: ff7r2-${{ github.ref }}
  cancel-in-progress: true

jobs:
  regression:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test dependency
        run: python -m pip install pytest
      - name: Python syntax
        run: python -m compileall -q plugins/ff7r2
      - name: Editor JavaScript syntax
        run: node --check plugins/ff7r2/editor.js
      - name: Plugin descriptor
        run: python -c "from plugins.ff7r2.plugin import PLUGIN; from plugin_api import validate_plugin; validate_plugin(PLUGIN); assert PLUGIN.projects is not None; print(PLUGIN.name)"
      - name: Rebirth DataObject and service regressions
        run: python -m pytest -q tests/test_ff7r2_dataobject.py tests/test_ff7r2_server.py tests/test_ff7r2_packaging.py
      - name: Managed service smoke
        run: python -c "from plugins.ff7r2.plugin import smoke; [print('PASS:', line) for line in smoke()]"

  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install browser tools
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium
      - name: Rendered Rebirth interactions
        run: python tests/ff7r2_browser_check.py out/ff7r2-browser
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ff7r2-rendered
          path: out/ff7r2-browser
          if-no-files-found: warn
