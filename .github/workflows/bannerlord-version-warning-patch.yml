name: Bannerlord dependency version warning patch

on:
  push:
    branches: [feature/bannerlord-plugin]
    paths:
      - '.github/workflows/bannerlord-version-warning-patch.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/bannerlord-plugin
      - name: Patch dependency version diagnostics
        shell: python
        run: |
          from pathlib import Path
          path = Path("games/bannerlord/runtime_data.py")
          text = path.read_text(encoding="utf-8")
          old = '''    dependency_rows = []
    missing_required = []
    for dependency in module.get("dependencies", []):
        dep_id = str(dependency.get("id") or "")
        found = installed.get(dep_id.casefold())
        optional = bool(dependency.get("optional"))
        if not found and not optional:
            missing_required.append(dep_id)
        dependency_rows.append(
            {
                "id": dep_id,
                "requiredVersion": dependency.get("dependentVersion") or "",
                "optional": optional,
                "installed": bool(found),
                "installedVersion": found.get("version", "") if found else "",
                "path": found.get("path", "") if found else "",
            }
        )
    if missing_required:
        issues.append("Missing required dependencies: " + ", ".join(missing_required))
'''
          new = '''    dependency_rows = []
    missing_required = []
    version_mismatches = []
    for dependency in module.get("dependencies", []):
        dep_id = str(dependency.get("id") or "")
        found = installed.get(dep_id.casefold())
        optional = bool(dependency.get("optional"))
        required_version = str(dependency.get("dependentVersion") or "").strip()
        installed_version = str(found.get("version", "") or "").strip() if found else ""
        version_match = None
        if not found and not optional:
            missing_required.append(dep_id)
        if found and required_version:
            version_match = required_version.casefold() == installed_version.casefold()
            if not version_match:
                version_mismatches.append(
                    f"{dep_id} requires {required_version}, installed {installed_version or '(no version declared)'}"
                )
        dependency_rows.append(
            {
                "id": dep_id,
                "requiredVersion": required_version,
                "optional": optional,
                "installed": bool(found),
                "installedVersion": installed_version,
                "versionMatch": version_match,
                "path": found.get("path", "") if found else "",
            }
        )
    if missing_required:
        issues.append("Missing required dependencies: " + ", ".join(missing_required))
    if version_mismatches:
        issues.append(
            "Dependency version warning (Bannerlord launcher would warn before start): "
            + "; ".join(version_mismatches)
        )
'''
          if old not in text:
              raise SystemExit("runtime_data dependency block changed; refusing blind patch")
          path.write_text(text.replace(old, new, 1), encoding="utf-8")
      - name: Commit patch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add games/bannerlord/runtime_data.py
          git commit -m "Surface Bannerlord dependency version warnings"
          git push origin HEAD:feature/bannerlord-plugin
