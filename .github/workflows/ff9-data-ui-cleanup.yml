name: FF9 data UI cleanup
on:
  push:
    branches:
      - codex/ff9-data-ui-cleanup-20260906
    paths:
      - '.github/workflows/ff9-data-ui-cleanup.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/ff9-data-ui-cleanup-20260906
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install pytest
      - name: Apply FF9 data-model and UI fixes
        run: |
          python tools/ff9/_tmp_data_ui_cleanup.py
          python tools/ff9/_tmp_data_ui_cleanup_followup.py
          python tools/ff9/_tmp_data_ui_cleanup_followup2.py
      - name: Verify feature patcher idempotence
        run: |
          cp games/ff9/editor.html /tmp/editor-before
          python tools/ff9/patch_features_ui.py
          cmp /tmp/editor-before games/ff9/editor.html
      - name: Run FF9 tests
        run: |
          python -m compileall -q games/ff9 tools/ff9
          python -m pytest -q tests/test_ff9*.py
          node --test tests/ff9_editor.test.cjs
          git diff --check
      - name: Commit verified candidate
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add games/ff9/memoria_baseline.py games/ff9/memoria_csv.py games/ff9/server.py games/ff9/editor.html docs/UI-MANUAL.md tests/test_ff9_csv.py tests/test_ff9_http.py tests/ff9_editor.test.cjs
          git diff --cached --stat
          git commit -m 'Fix FF9 data editor structure and availability'
          git push origin HEAD:codex/ff9-data-ui-cleanup-20260906
