name: Temporary Bannerlord legacy relation editor

on:
  push:
    branches: [feature/bannerlord-plugin]
    paths:
      - '.github/workflows/temp-bannerlord-legacy-relation-editor.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/bannerlord-plugin
      - name: Normalize temporary test quoting
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path("tools/temp_bannerlord_legacy_relation_editor.py")
          text = path.read_text(encoding="utf-8")
          text = text.replace(
              'Path("tests/test_bannerlord_legacy_relation_editor.py").write_text(r\'\'\'',
              'Path("tests/test_bannerlord_legacy_relation_editor.py").write_text(r"""',
              1,
          )
          marker = "\n''', encoding=\"utf-8\")\n"
          position = text.rfind(marker)
          if position < 0:
              raise SystemExit("temporary test-string terminator not found")
          text = text[:position] + '\n""", encoding="utf-8")\n' + text[position + len(marker):]
          path.write_text(text, encoding="utf-8")
          PY
      - name: Apply legacy dependency editor patch
        run: python tools/temp_bannerlord_legacy_relation_editor.py
      - name: Focused validation
        run: |
          python -m compileall -q games/bannerlord
          python -m unittest tests.test_bannerlord_legacy_relation_editor tests.test_bannerlord_community_metadata tests.test_bannerlord_community_editor tests.test_bannerlord_relation_save_preflight -v
          node --check games/bannerlord/editor_core.js
      - name: Commit legacy dependency editor
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add games/bannerlord/community_metadata.py games/bannerlord/module_data.py games/bannerlord/editor_core.js codex/bannerlord/project-memory.md tests/test_bannerlord_legacy_relation_editor.py
          git commit -m "Expose legacy Bannerlord dependency relations"
          git push origin HEAD:feature/bannerlord-plugin

  regression:
    needs: patch
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/bannerlord-plugin
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install Pillow 'fonttools>=4.59,<5'
      - run: python -m compileall -q games/bannerlord desktop_host.py service_session.py plugin_api.py project_manager.py
      - run: python -m unittest discover -s tests -p 'test_bannerlord*.py' -v
      - run: python -m unittest tests.test_project_create_rollback -v
      - run: python -m unittest discover -s tests -p test_data_map_coverage.py -v
      - run: python -c "import glob, subprocess; [subprocess.run(['node','--check',path], check=True) for path in glob.glob('games/bannerlord/*.js')]"

  browser:
    needs: patch
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/bannerlord-plugin
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install playwright
      - run: python -m playwright install --with-deps chromium
      - run: python tests/bannerlord_browser_check.py out/bannerlord-browser

  cleanup:
    needs: [regression, browser]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/bannerlord-plugin
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/temp-bannerlord-legacy-relation-editor.yml tools/temp_bannerlord_legacy_relation_editor.py
          git commit -m "Remove temporary Bannerlord legacy editor workflow"
          git push origin HEAD:feature/bannerlord-plugin
