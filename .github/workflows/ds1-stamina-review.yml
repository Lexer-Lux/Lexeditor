name: ds1 stamina review capture
on:
  pull_request:
    paths:
      - '.github/workflows/ds1-stamina-review.yml'
permissions:
  contents: write
concurrency:
  group: ds1-stamina-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  capture:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'codex/ds1-stamina-editor'
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -r requirements-test.txt
      - run: python -m playwright install chromium
      - name: Regenerate offline credits
        run: python tools/generate_credits.py
      - name: Standard DS1 checks
        id: checks
        continue-on-error: true
        run: python tools/check_plugin.py ds1
      - name: Capture focused rendered evidence
        id: browser
        continue-on-error: true
        run: python tests/ds1/ds1_stamina_browser_check.py artifacts/ds1-stamina/screenshots
      - name: Keep generated credits and remove this one-shot workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ui/credits.json
          git rm .github/workflows/ds1-stamina-review.yml
          git commit -m "Sync DS1 stamina credits and remove one-shot review workflow"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git push origin HEAD:refs/heads/codex/ds1-stamina-editor
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Package review snapshot without fonts or executables
        if: always()
        env:
          CHECKS_OUTCOME: ${{ steps.checks.outcome }}
          BROWSER_OUTCOME: ${{ steps.browser.outcome }}
        run: |
          python -c "import pathlib,subprocess,zipfile,json,os; out=pathlib.Path('artifacts/ds1-stamina'); out.mkdir(parents=True,exist_ok=True); files=subprocess.check_output(['git','ls-files','-z']).decode().split(chr(0)); skip={'.ttf','.otf','.woff','.woff2','.exe','.dll','.pdb'}; z=zipfile.ZipFile(out/'source.zip','w',zipfile.ZIP_DEFLATED); [z.write(p) for f in files if f and (p:=pathlib.Path(f)).is_file() and p.suffix.lower() not in skip]; z.close(); (out/'evidence.json').write_text(json.dumps({'commit':subprocess.check_output(['git','rev-parse','HEAD']).decode().strip(),'checks':os.environ.get('CHECKS_OUTCOME'),'browser':os.environ.get('BROWSER_OUTCOME')},indent=2))"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ds1-stamina-review-${{ github.run_id }}
          path: artifacts/ds1-stamina
          retention-days: 7
      - name: Require passing checks
        if: steps.checks.outcome != 'success' || steps.browser.outcome != 'success'
        run: exit 1
