name: Final global integration verification
on:
  push:
    branches: [fix/global-resume-20260906]
    paths: [.github/workflows/global-finalize.yml]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: global-finalize
  cancel-in-progress: false
jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    outputs:
      sha: ${{ steps.out.outputs.sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          submodules: false
      - name: Reconcile latest master and restore hardened quote selection
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Lexeditor Global Finalize'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin master
          if ! git merge --no-edit origin/master; then
            conflicts="$(git diff --name-only --diff-filter=U)"
            unexpected="$(printf '%s\n' "$conflicts" | grep -v -E '^(desktop_host.py|ui/chooser.html)$' || true)"
            if [ -n "$unexpected" ]; then
              echo 'Unexpected conflicts:'; printf '%s\n' "$unexpected"; exit 1
            fi
            python - <<'PY'
          from pathlib import Path
          import re
          for name in ('desktop_host.py','ui/chooser.html'):
              path=Path(name)
              text=path.read_text('utf-8')
              # Preserve Git's automatic non-conflicting merge and take current
              # master only inside the known overlapping helper-version hunks.
              pattern=re.compile(r'<<<<<<< HEAD\n.*?=======\n(.*?)>>>>>>> origin/master\n',re.S)
              text,n=pattern.subn(lambda m:m.group(1),text)
              if '<<<<<<< ' in text or '>>>>>>> ' in text or '=======' in text:
                  raise SystemExit(f'unresolved markers remain in {name}')
              if not n:
                  raise SystemExit(f'expected a conflict hunk in {name}')
              path.write_text(text,'utf-8')
          PY
            git add desktop_host.py ui/chooser.html
            git commit -m 'Merge latest master while retaining nonconflicting global work'
          fi
          python - <<'PY'
          from pathlib import Path
          import subprocess
          source=subprocess.check_output(['git','show','003bfc1f1f0e31af8dcaf775a842a341f2c8eb65:desktop_host.py'],text=True)
          start=source.index('def choose_loading_quote(')
          end=source.index('\n\nclass HostApi:',start)
          hardened=source[start:end]
          path=Path('desktop_host.py'); current=path.read_text('utf-8')
          a=current.index('def choose_loading_quote('); b=current.index('\n\nclass HostApi:',a)
          path.write_text(current[:a]+hardened+current[b:],'utf-8')

          tests=Path('tests/test_global_issues.py'); text=tests.read_text('utf-8')
          old="h=object.__new__(HostApi);h._plugins={'a':a,'b':b,'c':c};h._lock=threading.RLock();h._helper_versions=None\n        h._settings=Mock();h._settings.snapshot.return_value={'lexerMode':True}\n"
          new="h=object.__new__(HostApi);h._plugins={'a':a,'b':b,'c':c};h._lock=threading.RLock();h._helper_versions=None\n        h._settings=Mock();h._settings.snapshot.return_value={'lexerMode':True}\n        h._installations=Mock()\n        h._installations.snapshot.side_effect=lambda plugin_id:{'root':'/game','helper':{'installed':True,'version':'1.1','integrity':'ok'}}\n"
          if old not in text and new not in text: raise SystemExit('helper fixture changed')
          text=text.replace(old,new,1)
          tests.write_text(text,'utf-8')

          browser=Path('tests/global_browser_check.py'); text=browser.read_text('utf-8')
          old="assert all(t in text for t in ['Pinned: 1.0','Installed: 1.1','Latest: 1.2','Not installed','2026-09-01','Offline']),text\n            assert page.locator('#lexer-panel a').first.get_attribute('rel')=='noopener noreferrer'"
          new="assert all(t in text for t in ['Pinned: 1.0','Installed: 1.1','Latest upstream: 1.2','Installed: Not detected','2026-09-01','Offline']),text\n            release=page.locator('#lexer-panel .lexer-helper-source').first\n            assert release.count()==1 and release.evaluate(\"e=>e.tagName==='BUTTON'&&!e.hasAttribute('href')\")"
          if old not in text and new not in text: raise SystemExit('helper browser expectation changed')
          text=text.replace(old,new,1)
          browser.write_text(text,'utf-8')
          PY
          python -m py_compile desktop_host.py tests/test_global_issues.py tests/global_browser_check.py
          git add desktop_host.py tests/test_global_issues.py tests/global_browser_check.py
          git rm .github/workflows/global-finalize.yml
          git commit -m 'Finalize hardened loading messages and current helper-version verification'
          git push origin HEAD:fix/global-resume-20260906
      - name: Emit tested SHA
        id: out
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
  browser:
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {ref: '${{ needs.prepare.outputs.sha }}', submodules: false, persist-credentials: false}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.12'}
      - run: python -m pip install -r requirements.txt playwright
      - run: python -m unittest discover -s tests -p 'test_global*.py' -v
      - run: python tools/generate_credits.py --check
      - run: node --check ui/framework.js && node --check ui/design-review.js
      - run: python -m playwright install --with-deps chromium
      - run: python tests/global_browser_check.py
      - run: python tests/global_design_review_check.py
      - run: python tests/global_controls_check.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: global-final-browser-${{ github.run_id }}
          path: out/global-*/
          if-no-files-found: warn
          retention-days: 14
  native:
    needs: prepare
    strategy:
      fail-fast: false
      matrix: {os: [ubuntu-24.04, windows-2022, macos-14]}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {ref: '${{ needs.prepare.outputs.sha }}', submodules: false, persist-credentials: false}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.12'}
      - run: python -m pip install -r requirements.txt pyinstaller
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libopengl0 libxcb-cursor0 libxkbcommon-x11-0 libnss3 libasound2t64 && python -m pip install PySide6
      - if: runner.os == 'Windows'
        run: choco install innosetup --yes --no-progress
      - run: python -m unittest discover -s tests -p 'test_global*.py' -v
      - run: python tools/build_distribution.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: Lexeditor-final-${{ runner.os }}-${{ github.run_id }}
          path: |
            dist/installers/
            build/distribution/smoke.json
            build/Lexeditor/warn-Lexeditor.txt
          if-no-files-found: error
          retention-days: 14
