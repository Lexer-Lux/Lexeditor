name: Warband checks
on:
  push:
    branches: [master, fix/warband-issue-batch]
    paths:
      - 'games/**'
      - 'ui/framework.*'
      - 'tests/*warband*'
      - 'tests/*data_map*'
      - 'tests/fixtures/warband_launcher_window.py'
      - 'tools/Warband-checks.cmd'
      - 'desktop_host.py'
      - 'plugin_api.py'
      - '.github/workflows/warband-checks.yml'
  pull_request:
    paths:
      - 'games/**'
      - 'ui/framework.*'
      - 'tests/*warband*'
      - 'tests/*data_map*'
      - 'tests/fixtures/warband_launcher_window.py'
      - 'tools/Warband-checks.cmd'
      - 'desktop_host.py'
      - 'plugin_api.py'
      - '.github/workflows/warband-checks.yml'
permissions:
  contents: read
concurrency:
  group: warband-${{ github.ref }}
  cancel-in-progress: true
jobs:
  regression:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install Pillow 'fonttools>=4.59,<5'
      - run: python -m compileall -q games/warband games/ff7 games/ff8 games/ff9 games/rdr games/rdr2 desktop_host.py plugin_api.py
      - run: python -m unittest discover -s tests -p 'test_warband*.py' -v
      - run: python -m unittest discover -s tests -p test_data_map_coverage.py -v
      - run: node --check ui/framework.js
      - run: node tests/test_warband_trees.js
      - name: Check the one-click Windows diagnostic launcher
        if: runner.os == 'Windows'
        run: |
          $env:LEXEDITOR_CHECK_PYTHON = (Get-Command python).Source
          cmd /d /c tools\Warband-checks.cmd --checks-only
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install Pillow playwright
      - run: python -m playwright install --with-deps chromium
      - run: python tests/warband_browser_check.py out/warband-browser
        env:
          WARBAND_REQUIRE_WEBGL: '1'
      - run: python tests/data_map_browser_check.py out/data-map-browser
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: warband-and-data-map-fixtures
          path: out/
          retention-days: 7
