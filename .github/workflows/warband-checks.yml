name: Warband checks
on:
  push:
    branches: [fix/warband-issue-batch]
  pull_request:
    paths:
      - 'games/warband/**'
      - 'tests/*warband*'
      - 'tools/*warband*'
      - 'desktop_host.py'
      - 'plugin_api.py'
      - '.github/workflows/warband-checks.yml'
permissions:
  contents: read
concurrency:
  group: warband-${{ github.ref }}
  cancel-in-progress: true
jobs:
  regression:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install Pillow 'fonttools>=4.59,<5'
      - run: python -m compileall -q games/warband desktop_host.py plugin_api.py
      - run: python -m unittest discover -s tests -p test_warband_batch.py -v
      - run: node tests/test_warband_trees.js
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install Pillow playwright
      - run: python -m playwright install --with-deps chromium
      - run: python tests/warband_browser_check.py out/warband-browser
        env:
          WARBAND_REQUIRE_WEBGL: '1'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: warband-browser-fixtures
          path: out/warband-browser
          retention-days: 7
