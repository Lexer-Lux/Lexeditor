name: Warband checks
on:
  push:
    branches: [master, fix/warband-issue-batch]
    paths:
      - 'plugins/**'
      - 'ui/framework.*'
      - 'tests/*warband*'
      - 'tests/*data_map*'
      - 'tests/fixtures/warband_launcher_window.py'
      - 'tools/verify_warband_*.py'
      - 'tools/Warband-checks.cmd'
      - 'desktop_host.py'
      - 'plugin_api.py'
      - '.github/workflows/warband-checks.yml'
  pull_request:
    paths:
      - 'plugins/**'
      - 'ui/framework.*'
      - 'tests/*warband*'
      - 'tests/*data_map*'
      - 'tests/fixtures/warband_launcher_window.py'
      - 'tools/verify_warband_*.py'
      - 'tools/Warband-checks.cmd'
      - 'desktop_host.py'
      - 'plugin_api.py'
      - '.github/workflows/warband-checks.yml'
permissions:
  contents: read
concurrency:
  group: warband-${{ github.ref }}
  cancel-in-progress: true
jobs:
  regression:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install Pillow 'fonttools>=4.59,<5'
      - run: python -m compileall -q plugins/warband plugins/ff7 plugins/ff8 plugins/ff9 plugins/rdr plugins/rdr2 desktop_host.py plugin_api.py
      - run: python -m unittest discover -s tests -p 'test_warband*.py' -v
        env:
          LEXEDITOR_NATIVE_WINDOW_TESTS: '1'
      - run: python -m unittest discover -s tests -p test_data_map_coverage.py -v
      - name: JavaScript syntax
        run: |
          node --check ui/framework.js
          node --check plugins/warband/editor.js
          node --check plugins/warband/module_records.js
          node --check plugins/warband/troop_editor.js
          node --check plugins/warband/troop_trees.js
          node --check plugins/warband/boot.js
      - run: node tests/test_warband_trees.js
      - name: Check the one-click Windows diagnostic launcher
        if: runner.os == 'Windows'
        run: |
          $env:LEXEDITOR_CHECK_PYTHON = (Get-Command python).Source
          cmd /d /c tools\Warband-checks.cmd --checks-only
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install Pillow playwright
      - run: python -m playwright install --with-deps chromium
      - run: python tests/warband_browser_check.py out/warband-browser
        env:
          WARBAND_REQUIRE_WEBGL: '1'
      - run: python tests/data_map_browser_check.py out/data-map-browser
        env:
          DATAMAP_GAMES: warband
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: warband-and-data-map-fixtures
          path: out/
          retention-days: 7

  candidate:
    if: github.event_name == 'pull_request'
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Stage and validate isolated Windows candidate
        shell: pwsh
        run: |
          $candidate = Join-Path $env:RUNNER_TEMP "warband-pr-candidate"
          Remove-Item -LiteralPath $candidate -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Path $candidate | Out-Null
          Get-ChildItem -Force | Where-Object { $_.Name -notin @('.git','.venv','_scratch','out') } | ForEach-Object {
            Copy-Item -LiteralPath $_.FullName -Destination $candidate -Recurse -Force
          }
          @'
          @echo off
          setlocal
          cd /d "%~dp0"
          if not exist ".venv\Scripts\python.exe" (
            py -3 -m venv .venv 2>nul
            if errorlevel 1 python -m venv .venv
            if errorlevel 1 exit /b 1
            ".venv\Scripts\python.exe" -m pip install --disable-pip-version-check -r requirements.txt
            if errorlevel 1 exit /b 1
          )
          if /i "%~1"=="--checks-only" goto checks_only
          start "" ".venv\Scripts\pythonw.exe" app.py --game warband
          exit /b 0
          :checks_only
          set "LEXEDITOR_CHECK_PYTHON=%CD%\.venv\Scripts\python.exe"
          call tools\Warband-checks.cmd --checks-only
          exit /b %ERRORLEVEL%
          '@ | Set-Content -LiteralPath (Join-Path $candidate 'Run-Warband-Candidate.cmd') -Encoding ascii
          @"
          Lexeditor Warband candidate
          Commit: ${{ github.event.pull_request.head.sha }}
          PR: #${{ github.event.pull_request.number }}

          Extract this ZIP to an isolated folder, not C:\Lexeditor.
          Run Run-Warband-Candidate.cmd. Its private .venv is created in place.
          Source/rendered/candidate checks do not establish installed-game acceptance.
          "@ | Set-Content -LiteralPath (Join-Path $candidate 'CANDIDATE.txt') -Encoding utf8

          Push-Location $candidate
          cmd /d /c Run-Warband-Candidate.cmd --checks-only
          if ($LASTEXITCODE -ne 0) { throw "Isolated candidate checks failed with exit code $LASTEXITCODE" }
          Pop-Location

          Remove-Item -LiteralPath (Join-Path $candidate '.venv') -Recurse -Force
          Get-ChildItem -LiteralPath $candidate -Directory -Recurse -Filter __pycache__ | Remove-Item -Recurse -Force
          New-Item -ItemType Directory -Path out -Force | Out-Null
          $zip = Join-Path (Resolve-Path out) "warband-candidate-${{ github.event.pull_request.head.sha }}.zip"
          Compress-Archive -Path (Join-Path $candidate '*') -DestinationPath $zip -CompressionLevel Optimal
      - uses: actions/upload-artifact@v4
        with:
          name: warband-candidate-${{ github.event.pull_request.head.sha }}
          path: out/warband-candidate-${{ github.event.pull_request.head.sha }}.zip
          retention-days: 14
