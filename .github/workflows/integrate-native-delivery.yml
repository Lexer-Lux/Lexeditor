name: Integrate tested FF8 delivery
on:
  push:
    branches: [fix/ff8-native-battle-batch]
    paths: [.github/workflows/integrate-native-delivery.yml]
permissions:
  contents: read
jobs:
  integrate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Fetch exact repair and current master with shared history
        env:
          REVISION: ${{ github.sha }}
        run: |
          git config --global core.autocrlf false
          git init editor
          git -C editor remote add origin https://github.com/Lexer-Lux/Lexeditor.git
          git -C editor fetch --depth=100 origin "$REVISION" master
          git -C editor checkout --detach "$REVISION"
          git -C editor config user.name 'Lexeditor runtime integration'
          git -C editor config user.email '89482099+Lexer-Lux@users.noreply.github.com'
          git -C editor merge --no-edit origin/master
      - name: Install regression dependencies
        run: |
          python -m pip install Pillow fonttools pefile==2024.8.26 playwright
          python -m playwright install --with-deps chromium
      - name: Verify native delivery and all requested editor UI changes together
        working-directory: editor
        run: |
          python tools/verify_ff8_native_package.py
          python tools/verify_ff8_native_compiled.py
          python tools/verify_ff8_gf_bar_settings.py
          python tools/verify_ff8_ui_battle_regressions.py --browser ''
          python tools/verify_ff8_enemy_compact_ui.py --browser ''
          python tools/verify_ff8_card_art.py
          python tools/verify_ff8_shared_magic_issue_51.py
          python tools/verify_ff8_shared_magic_runtime_config_51.py
          python tools/verify_ffnx_settings_issue_23.py
          python -m compileall -q games/ff8
          python - <<'PY'
          from pathlib import Path
          import re, subprocess
          for script in re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>', Path('games/ff8/editor.html').read_text(encoding='utf-8'), re.S):
              subprocess.run(['node','--check'],input=script,text=True,check=True)
          PY
      - name: Publish validated integration without overwriting concurrent work
        working-directory: editor
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          AUTH=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $AUTH" push origin HEAD:refs/heads/fix/ff8-native-battle-batch
          unset AUTH
          git show --no-patch --format=fuller HEAD
          git archive --format=zip --output=../integrated-native-source.zip HEAD
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: integrated-native-source
          path: integrated-native-source.zip
          retention-days: 2
          if-no-files-found: error
      - name: Capture exact merge diagnostics on failure
        if: failure()
        working-directory: editor
        run: |
          git status --short > ../integration-diagnostics.txt
          git diff >> ../integration-diagnostics.txt
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: integration-diagnostics
          path: integration-diagnostics.txt
          retention-days: 2
