name: Bannerlord modern metadata patch

on:
  push:
    branches: [feature/bannerlord-plugin]
    paths:
      - '.github/workflows/bannerlord-modern-metadata-patch.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/bannerlord-plugin
      - name: Patch modern Bannerlord metadata support
        shell: python
        run: |
          from pathlib import Path

          def replace(path, old, new):
              source = Path(path)
              text = source.read_text(encoding="utf-8")
              if old not in text:
                  raise SystemExit(f"expected patch context missing in {path}: {old!r}")
              source.write_text(text.replace(old, new, 1), encoding="utf-8")

          replace(
              "games/bannerlord/module_data.py",
              '        "version": _value(root, "Version"),\n        "defaultModule": _truth(_value(root, "DefaultModule")),',
              '        "version": _value(root, "Version"),\n        "moduleCategory": _value(root, "ModuleCategory"),\n        "moduleType": _value(root, "ModuleType"),\n        "defaultModule": _truth(_value(root, "DefaultModule")),',
          )
          replace(
              "games/bannerlord/module_data.py",
              '        "xmls": xmls,\n    }\n\n\n_EDITABLE_METADATA = {',
              '        "xmls": xmls,\n    }\n\n\ndef is_singleplayer_module(module: dict) -> bool:\n    """Accept both legacy SingleplayerModule and modern ModuleCategory metadata."""\n    return bool(module.get("singleplayer")) or str(module.get("moduleCategory") or "").strip().casefold() == "singleplayer"\n\n\n_EDITABLE_METADATA = {',
          )
          replace(
              "games/bannerlord/module_data.py",
              '    "version": "Version",\n    "defaultModule": "DefaultModule",',
              '    "version": "Version",\n    "moduleCategory": "ModuleCategory",\n    "moduleType": "ModuleType",\n    "defaultModule": "DefaultModule",',
          )
          replace(
              "games/bannerlord/module_data.py",
              '_BOOLEAN_METADATA = {"defaultModule", "singleplayer", "multiplayer"}\n',
              '_BOOLEAN_METADATA = {"defaultModule", "singleplayer", "multiplayer"}\n_ENUM_METADATA = {\n    "moduleCategory": {"Singleplayer", "Multiplayer", "MultiplayerOptional", "Server"},\n    "moduleType": {"Community", "Official", "OfficialOptional"},\n}\n_OPTIONAL_METADATA = set(_ENUM_METADATA)\n',
          )
          replace(
              "games/bannerlord/module_data.py",
              '    element.set("value", value)\n    return True\n\n\ndef _normalize_metadata(edits: dict) -> dict:',
              '    element.set("value", value)\n    return True\n\n\ndef _set_optional_value(parent: ET.Element, tag: str, value: str) -> bool:\n    if value:\n        return _set_value(parent, tag, value)\n    element = parent.find(tag)\n    if element is None:\n        return False\n    parent.remove(element)\n    return True\n\n\ndef _normalize_metadata(edits: dict) -> dict:',
          )
          replace(
              "games/bannerlord/module_data.py",
              '        if field in _BOOLEAN_METADATA:\n            normalized[field] = "true" if bool(raw) else "false"\n        else:\n            value = str(raw).strip()\n            if not value:\n                raise ValueError(f"{field} cannot be empty")\n            normalized[field] = value',
              '        if field in _BOOLEAN_METADATA:\n            normalized[field] = "true" if bool(raw) else "false"\n        elif field in _ENUM_METADATA:\n            value = str(raw).strip()\n            if value and value not in _ENUM_METADATA[field]:\n                raise ValueError(f"{field} must be one of: {\', \'.join(sorted(_ENUM_METADATA[field]))}")\n            normalized[field] = value\n        else:\n            value = str(raw).strip()\n            if not value:\n                raise ValueError(f"{field} cannot be empty")\n            normalized[field] = value',
          )
          replace(
              "games/bannerlord/module_data.py",
              '    for field, value in metadata.items():\n        changes += int(_set_value(root, _EDITABLE_METADATA[field], value))',
              '    for field, value in metadata.items():\n        setter = _set_optional_value if field in _OPTIONAL_METADATA else _set_value\n        changes += int(setter(root, _EDITABLE_METADATA[field], value))',
          )

          replace(
              "games/bannerlord/editor_core.js",
              'const metadata=m=>({name:m.name,id:m.id,version:m.version,defaultModule:!!m.defaultModule,singleplayer:!!m.singleplayer,multiplayer:!!m.multiplayer});',
              'const metadata=m=>({name:m.name,id:m.id,version:m.version,moduleCategory:m.moduleCategory||"",moduleType:m.moduleType||"",defaultModule:!!m.defaultModule,singleplayer:!!m.singleplayer,multiplayer:!!m.multiplayer});',
          )
          replace(
              "games/bannerlord/editor_core.js",
              '        ...fieldRow("Version",textInput(m.version,value=>setModuleField("version",value))),\n        ...fieldRow("Default module",checkbox(m.defaultModule,value=>setModuleField("defaultModule",value))),',
              '        ...fieldRow("Version",textInput(m.version,value=>setModuleField("version",value))),\n        ...fieldRow("Module category",select(m.moduleCategory||"",[["","Legacy / not set"],["Singleplayer","Singleplayer"],["Multiplayer","Multiplayer"],["MultiplayerOptional","Multiplayer optional"],["Server","Server"]],value=>setModuleField("moduleCategory",value))),\n        ...fieldRow("Module type",select(m.moduleType||"",[["","Default / not set"],["Community","Community"],["Official","Official"],["OfficialOptional","Official optional"]],value=>setModuleField("moduleType",value))),\n        ...fieldRow("Default module",checkbox(m.defaultModule,value=>setModuleField("defaultModule",value))),',
          )

          replace(
              "games/bannerlord/game_launch.py",
              'from .module_data import read_submodule',
              'from .module_data import is_singleplayer_module, read_submodule',
          )
          replace(
              "games/bannerlord/game_launch.py",
              '    "StoryMode",\n)',
              '    "StoryMode",\n    "NavalDLC",\n)',
          )
          replace(
              "games/bannerlord/game_launch.py",
              '    if not selected_metadata.get("singleplayer"):',
              '    if not is_singleplayer_module(selected_metadata):',
          )

          replace(
              "games/bannerlord/runtime_data.py",
              'from .module_data import read_submodule',
              'from .module_data import is_singleplayer_module, read_submodule',
          )
          replace(
              "games/bannerlord/runtime_data.py",
              '    direct_play_compatible = bool(deployed_module and deployed_module.get("singleplayer"))',
              '    direct_play_compatible = bool(deployed_module and is_singleplayer_module(deployed_module))',
          )
      - name: Commit patch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add games/bannerlord/module_data.py games/bannerlord/editor_core.js games/bannerlord/game_launch.py games/bannerlord/runtime_data.py
          git commit -m "Support modern Bannerlord module metadata"
          git push origin HEAD:feature/bannerlord-plugin
