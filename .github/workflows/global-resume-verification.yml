name: Global recovery verification
on:
  push:
    branches: [fix/global-resume-20260906]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: global-resume-verification
  cancel-in-progress: false
jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    outputs:
      sha: ${{ steps.source.outputs.sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          submodules: false
      - name: Merge current master without migrating deferred issue stores
        run: |
          git config user.name 'Lexeditor Global Recovery'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin master
          set +e
          git merge --no-edit origin/master
          status=$?
          set -e
          if [ "$status" -ne 0 ]; then
            echo '--- desktop_host.py conflict ---'
            git diff --cc -- desktop_host.py || true
            echo '--- ui/chooser.html conflict ---'
            git diff --cc -- ui/chooser.html || true
            exit "$status"
          fi
      - name: Apply final shared-control help coverage if still staged
        run: |
          if [ -f maintenance/global-resume/apply_followup.py ]; then
            python maintenance/global-resume/apply_followup.py
            node --check ui/framework.js
            python -m py_compile tests/global_controls_check.py
            git add ui/framework.js tests/global_controls_check.py
            git rm maintenance/global-resume/apply_followup.py
            git commit -m 'Explain unlabeled shared controls without inventing gameplay semantics'
          fi
      - name: Regenerate reviewed offline credits
        run: |
          python tools/generate_credits.py
          git add ui/credits.json
          if ! git diff --cached --quiet; then
            git commit -m 'Regenerate offline credits from reviewed attribution sources'
          fi
      - name: Remove recovery and deferred-cleanup machinery from product branch
        run: |
          for path in \
            .github/workflows/apply-global-fixes.yml \
            .github/workflows/finish-comment-cleanup.yml \
            .github/workflows/finish-human-issues.yml \
            .github/workflows/global-issue-verification.yml \
            .github/workflows/global-review-verification.yml \
            .github/workflows/global-resume-verification.yml \
            maintenance/finish-human-issues.patch \
            maintenance/global-fixes/part0.b64 \
            maintenance/global-fixes/part1.b64 \
            maintenance/global-fixes/part2.b64 \
            maintenance/global-fixes/part3.b64 \
            tools/finish_issue_comments.py; do
            if git ls-files --error-unmatch "$path" >/dev/null 2>&1; then git rm "$path"; fi
          done
          if ! git diff --cached --quiet; then
            git commit -m 'Remove temporary global recovery and deferred cleanup machinery'
          fi
          git push origin HEAD:fix/global-resume-20260906
      - name: Export auditable source snapshot
        id: source
        shell: python
        run: |
          import hashlib, json, pathlib, subprocess, zipfile
          root = pathlib.Path.cwd()
          out = root / 'out/recovery-source'
          out.mkdir(parents=True, exist_ok=True)
          sha = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()
          suffixes = {'.py','.js','.css','.html','.json','.txt','.md','.toml','.yaml','.yml','.spec','.iss','.sh','.ps1','.bat','.ini','.xml','.cfg','.csv','.ts','.lock','.in'}
          names = subprocess.check_output(['git','ls-files','-z']).decode('utf-8').split('\0')
          manifest = {'commit': sha, 'files': {}}
          with zipfile.ZipFile(out / 'source.zip', 'w', zipfile.ZIP_DEFLATED) as archive:
              for name in names:
                  path = root / name
                  if not name or not path.is_file() or path.is_symlink():
                      continue
                  if path.suffix.lower() not in suffixes and not path.name.startswith(('LICENSE','NOTICE','COPYING')) and path.name not in ('.gitignore','.gitmodules'):
                      continue
                  data = path.read_bytes()
                  archive.writestr(name, data)
                  manifest['files'][name] = hashlib.sha256(data).hexdigest()
              archive.writestr('RECOVERY-SOURCE.json', json.dumps(manifest, indent=2))
          import os
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as stream:
              stream.write(f'sha={sha}\n')
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: global-final-source-${{ github.run_id }}
          path: out/recovery-source/source.zip
          retention-days: 14
  browser:
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          submodules: false
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt playwright
      - run: python -m unittest discover -s tests -p 'test_global*.py' -v
      - run: python tools/generate_credits.py --check
      - run: node --check ui/framework.js
      - run: node --check ui/design-review.js
      - run: python -m playwright install --with-deps chromium
      - run: python tests/global_browser_check.py
      - run: python tests/global_design_review_check.py
      - run: python tests/global_controls_check.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: global-final-browser-${{ github.run_id }}
          path: |
            out/global-browser/
            out/global-review/
            out/global-controls/
          retention-days: 14
  native:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022, macos-14]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          submodules: false
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt pyinstaller
      - name: Install Linux webview backend
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libopengl0 libxcb-cursor0 libxkbcommon-x11-0 libnss3 libasound2t64
          python -m pip install PySide6
      - name: Install Windows installer compiler
        if: runner.os == 'Windows'
        run: choco install innosetup --yes --no-progress
      - run: python -m unittest discover -s tests -p 'test_global*.py' -v
      - run: python tools/build_distribution.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: Lexeditor-final-${{ runner.os }}-${{ github.run_id }}
          path: |
            dist/installers/
            build/distribution/smoke.json
            build/Lexeditor/warn-Lexeditor.txt
          if-no-files-found: error
          retention-days: 14
