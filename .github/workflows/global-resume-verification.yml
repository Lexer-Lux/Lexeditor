name: Global recovery verification
on:
  push:
    branches: [fix/global-resume-20260906]
    paths: [.github/workflows/global-resume-verification.yml]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: global-resume-verification
  cancel-in-progress: false
jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    outputs:
      sha: ${{ steps.source.outputs.sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          submodules: false
      - name: Preserve master decisions without migrating issue stores
        run: |
          git config user.name 'Lexeditor Global Recovery'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git merge --no-edit 292500459a0b47784925d7c781408f75ff9c0e5f
          git push origin HEAD:fix/global-resume-20260906
      - name: Export auditable source snapshot for offline development
        id: source
        shell: python
        run: |
          import hashlib, json, pathlib, subprocess, zipfile
          root = pathlib.Path.cwd()
          out = root / 'out/recovery-source'
          out.mkdir(parents=True, exist_ok=True)
          sha = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()
          suffixes = {'.py','.js','.css','.html','.json','.txt','.md','.toml','.yaml','.yml','.spec','.iss','.sh','.ps1','.bat','.ini','.xml','.cfg','.csv','.ts','.lock','.in'}
          names = subprocess.check_output(['git','ls-files','-z']).decode('utf-8').split('\0')
          manifest = {'commit': sha, 'files': {}}
          with zipfile.ZipFile(out / 'source.zip', 'w', zipfile.ZIP_DEFLATED) as archive:
              for name in names:
                  path = root / name
                  if not name or not path.is_file() or path.is_symlink():
                      continue
                  if path.suffix.lower() not in suffixes and not path.name.startswith(('LICENSE','NOTICE','COPYING')) and path.name not in ('.gitignore','.gitmodules'):
                      continue
                  data = path.read_bytes()
                  archive.writestr(name, data)
                  manifest['files'][name] = hashlib.sha256(data).hexdigest()
              archive.writestr('RECOVERY-SOURCE.json', json.dumps(manifest, indent=2))
          import os
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as stream:
              stream.write(f'sha={sha}\n')
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: global-recovery-source-${{ github.run_id }}
          path: out/recovery-source/source.zip
          retention-days: 7
  browser:
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          submodules: false
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt playwright
      - run: python -m unittest discover -s tests -p 'test_global*.py' -v
      - run: python tools/generate_credits.py --check
      - run: node --check ui/framework.js
      - run: python -m playwright install --with-deps chromium
      - run: python tests/global_browser_check.py
      - run: python tests/global_design_review_check.py
      - run: python tests/global_controls_check.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: global-recovery-browser-${{ github.run_id }}
          path: |
            out/global-browser/
            out/global-review/
            out/global-controls/
          retention-days: 14
  native:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022, macos-14]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          submodules: false
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt pyinstaller
      - name: Install Linux webview backend
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libopengl0 libxcb-cursor0 libxkbcommon-x11-0 libnss3 libasound2t64
          python -m pip install PySide6
      - name: Install Windows installer compiler
        if: runner.os == 'Windows'
        run: choco install innosetup --yes --no-progress
      - run: python -m unittest discover -s tests -p 'test_global*.py' -v
      - run: python tools/build_distribution.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: Lexeditor-recovery-${{ runner.os }}-${{ github.run_id }}
          path: |
            dist/installers/
            build/distribution/smoke.json
            build/Lexeditor/warn-Lexeditor.txt
          if-no-files-found: warn
          retention-days: 14
