name: Finalize Lexeditor 1.1
on:
  push:
    branches: [master]
permissions:
  contents: write
jobs:
  finalize:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: master
          fetch-depth: 0
      - name: Remove release helper and tag exact clean master
        run: |
          set -euo pipefail
          git config user.name 'Lexeditor 1.1 Release'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if git ls-remote --exit-code --tags origin refs/tags/1.1 >/dev/null 2>&1; then
            echo 'Tag 1.1 already exists; refusing to move it.' >&2
            exit 1
          fi
          git rm .github/workflows/finalize-1.1.yml
          git commit -m 'Release Lexeditor 1.1'
          git tag -a 1.1 -m 'Lexeditor 1.1'
          git push origin HEAD:master refs/tags/1.1
