name: Run shared UI batch
on:
  push:
    branches:
      - fix/shared-ui-batch-20260906
    paths:
      - .github/workflows/run-shared-ui-batch.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply fixes
        shell: bash
        run: |
          set +e
          python - <<'PY' > /tmp/ui-batch.log 2>&1
          from pathlib import Path
          import re
          source = Path('.github/workflows/apply-shared-ui-batch.yml').read_text(encoding='utf-8')
          start = "          python - <<'PY'\n"
          end = "\n          PY\n"
          body = source.split(start, 1)[1].split(end, 1)[0]
          body = '\n'.join(line[10:] if line.startswith('          ') else line for line in body.splitlines())
          body, removed = re.subn(
              r'''\nreplace_once\(\n\s+"desktop_host\.py",\n\s+''' + "'''" + r'''        if not self\._settings\.snapshot\(\)\.get\("lexerMode"\):.*?marker='Developer Mode requires the authorized GitHub account',\n\)\n''',
              '\n', body, count=1, flags=re.S,
          )
          if removed != 1:
              raise SystemExit(f"Could not remove repeated-gate preflight: {removed}")
          exec(compile(body, 'apply-shared-ui-batch', 'exec'))
          PY
          code=$?
          cat /tmp/ui-batch.log
          if [ "$code" -ne 0 ]; then
            cp /tmp/ui-batch.log .github/ui-batch-error.txt
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add .github/ui-batch-error.txt
            git commit -m "Record shared UI batch failure"
            git push origin HEAD:fix/shared-ui-batch-20260906
            exit "$code"
          fi
      - name: Static and syntax checks
        shell: bash
        run: |
          set +e
          {
            set -x
            node --check ui/framework.js
            python -m compileall -q desktop_host.py github_integration.py settings_manager.py
            ! git grep -n -E 'LexeditorDesignReview|design-review\.(js|css)|Design Review' -- ':!worklog/**'
            ! git grep -n -E 'Lexer Mode|I am Lexer|lexerMode|lexerAuthorized|lexerLogin' -- '*.py' '*.js' '*.md'
            test ! -e ui/design-review.js
            test ! -e ui/design-review.css
            test ! -e tests/global_design_review_check.py
            test ! -e docs/warband-acceptance.md
            test -e worklog/reference/warband-acceptance.md
            grep -q 'lex-model-preview-drawer' ui/framework.js
            grep -q 'label=self._github_issue_label(plugin_id)' desktop_host.py
            grep -q 'lex-trailing-list-detail' ui/framework.js
            grep -q 'shortName === "LL"' ui/framework.js
            grep -q 'Shared interaction standards' docs/UI-MANUAL.md
            git diff --check
          } > /tmp/ui-batch-check.log 2>&1
          code=$?
          cat /tmp/ui-batch-check.log
          if [ "$code" -ne 0 ]; then
            cp /tmp/ui-batch-check.log .github/ui-batch-error.txt
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git checkout HEAD -- .github/workflows
            git add -A
            git add -f worklog/reference 2>/dev/null || true
            git commit -m "Record shared UI batch check failure"
            git push origin HEAD:fix/shared-ui-batch-20260906
            exit "$code"
          fi
      - name: Commit fixes
        shell: bash
        run: |
          set +e
          {
            set -x
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            rm -f .github/ui-batch-error.txt
            # The path-rewrite sweep sees the temporary runner source too. Do
            # not let those scaffolding edits enter the product commit (or make
            # GITHUB_TOKEN attempt a workflow-file write).
            git checkout HEAD -- .github/workflows
            git add -A
            git add -f worklog/reference
            git status --short
            git commit -m "Fix shared editor UI behaviors"
            git push origin HEAD:fix/shared-ui-batch-20260906
          } > /tmp/ui-batch-commit.log 2>&1
          code=$?
          cat /tmp/ui-batch-commit.log
          if [ "$code" -ne 0 ]; then
            git reset --hard origin/fix/shared-ui-batch-20260906
            cp /tmp/ui-batch-commit.log .github/ui-batch-error.txt
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add .github/ui-batch-error.txt
            git commit -m "Record shared UI batch commit failure"
            git push origin HEAD:fix/shared-ui-batch-20260906
            exit "$code"
          fi
