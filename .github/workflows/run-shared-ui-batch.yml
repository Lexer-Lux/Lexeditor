name: Run shared UI follow-up
on:
  push:
    branches:
      - fix/shared-ui-batch-20260906
    paths:
      - .github/workflows/run-shared-ui-batch.yml
permissions:
  contents: write
jobs:
  patch-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply follow-up
        shell: bash
        run: |
          set +e
          python .github/ui-followup.py > /tmp/ui-followup.log 2>&1
          code=$?
          cat /tmp/ui-followup.log
          if [ "$code" -ne 0 ]; then
            git reset --hard HEAD
            cp /tmp/ui-followup.log .github/ui-followup-error.txt
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add .github/ui-followup-error.txt
            git commit -m "Record shared UI follow-up failure"
            git push origin HEAD:fix/shared-ui-batch-20260906
            exit "$code"
          fi
      - name: Static and unit tests
        shell: bash
        run: |
          set +e
          {
            set -x
            node --check ui/framework.js
            python -m compileall -q desktop_host.py github_integration.py settings_manager.py
            python -m unittest discover -s tests -p 'test_*.py'
            ! git grep -n -E 'Lexer Mode|I am Lexer|lexerMode|lexerAuthorized|lexerLogin' -- ':!worklog/**' ':!.github/workflows/**' ':!.github/ui-followup.py'
            ! git grep -n 'lex-tab-ordinal' -- ui/framework.js
            git diff --check
          } > /tmp/ui-followup-tests.log 2>&1
          code=$?
          cat /tmp/ui-followup-tests.log
          if [ "$code" -ne 0 ]; then
            git reset --hard HEAD
            cp /tmp/ui-followup-tests.log .github/ui-followup-error.txt
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add .github/ui-followup-error.txt
            git commit -m "Record shared UI follow-up test failure"
            git push origin HEAD:fix/shared-ui-batch-20260906
            exit "$code"
          fi
      - name: Shared browser regressions
        shell: bash
        run: |
          set +e
          {
            set -x
            python -m pip install -q playwright
            python -m playwright install --with-deps chromium >/dev/null
            LEXEDITOR_BROWSER_OFFLINE=1 python tests/global_controls_check.py
          } > /tmp/ui-followup-browser.log 2>&1
          code=$?
          cat /tmp/ui-followup-browser.log
          if [ "$code" -ne 0 ]; then
            git reset --hard HEAD
            cp /tmp/ui-followup-browser.log .github/ui-followup-error.txt
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add .github/ui-followup-error.txt
            git commit -m "Record shared UI browser failure"
            git push origin HEAD:fix/shared-ui-batch-20260906
            exit "$code"
          fi
      - name: Commit follow-up
        shell: bash
        run: |
          set -euxo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/ui-followup-error.txt .github/ui-batch-error.txt
          git rm .github/ui-followup.py
          git checkout HEAD -- .github/workflows
          git add -A
          git add -f worklog/reference 2>/dev/null || true
          git commit -m "Finish shared UI regressions"
          git push origin HEAD:fix/shared-ui-batch-20260906
