name: Bannerlord checks
on:
  push:
    branches: [master]
    paths:
      - 'games/bannerlord/**'
      - 'ui/framework.*'
      - 'tests/test_bannerlord*.py'
      - 'tests/bannerlord_browser_check.py'
      - 'tests/test_data_map_coverage.py'
      - 'desktop_host.py'
      - 'service_session.py'
      - 'plugin_api.py'
      - '.github/workflows/bannerlord-checks.yml'
  pull_request:
    paths:
      - 'games/bannerlord/**'
      - 'ui/framework.*'
      - 'tests/test_bannerlord*.py'
      - 'tests/bannerlord_browser_check.py'
      - 'tests/test_data_map_coverage.py'
      - 'desktop_host.py'
      - 'service_session.py'
      - 'plugin_api.py'
      - '.github/workflows/bannerlord-checks.yml'
permissions:
  contents: read
concurrency:
  group: bannerlord-${{ github.ref }}
  cancel-in-progress: true
jobs:
  regression:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install Pillow 'fonttools>=4.59,<5'
      - run: python -m compileall -q games/bannerlord desktop_host.py service_session.py plugin_api.py
      - run: python -m unittest discover -s tests -p 'test_bannerlord*.py' -v
      - run: python -m unittest discover -s tests -p test_data_map_coverage.py -v
      - run: python -c "import glob, subprocess; [subprocess.run(['node','--check',path], check=True) for path in glob.glob('games/bannerlord/*.js')]"
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install playwright
      - run: python -m playwright install --with-deps chromium
      - run: python tests/bannerlord_browser_check.py out/bannerlord-browser
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bannerlord-browser-fixture
          path: out/bannerlord-browser
          retention-days: 7
