name: Bannerlord checks
on:
  push:
    branches: [master, feature/bannerlord-plugin]
    paths:
      - 'plugins/bannerlord/**'
      - 'ui/framework.*'
      - 'tests/test_bannerlord*.py'
      - 'tests/test_project_create_rollback.py'
      - 'tests/bannerlord_browser_check.py'
      - 'tests/bannerlord_ui_audit_check.py'
      - 'tests/data_map_browser_check.py'
      - 'tests/test_data_map_coverage.py'
      - 'desktop_host.py'
      - 'service_session.py'
      - 'plugin_api.py'
      - 'project_manager.py'
      - 'tools/shot.py'
      - '.github/workflows/bannerlord-checks.yml'
  pull_request:
    paths:
      - 'plugins/bannerlord/**'
      - 'ui/framework.*'
      - 'tests/test_bannerlord*.py'
      - 'tests/test_project_create_rollback.py'
      - 'tests/bannerlord_browser_check.py'
      - 'tests/bannerlord_ui_audit_check.py'
      - 'tests/data_map_browser_check.py'
      - 'tests/test_data_map_coverage.py'
      - 'desktop_host.py'
      - 'service_session.py'
      - 'plugin_api.py'
      - 'project_manager.py'
      - 'tools/shot.py'
      - '.github/workflows/bannerlord-checks.yml'
permissions:
  contents: read
concurrency:
  group: bannerlord-${{ github.ref }}
  cancel-in-progress: true
jobs:
  regression:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install Pillow 'fonttools>=4.59,<5'
      - run: python -m compileall -q plugins/bannerlord desktop_host.py service_session.py plugin_api.py project_manager.py tools/shot.py tests/data_map_browser_check.py tests/bannerlord_browser_check.py tests/bannerlord_ui_audit_check.py
      - run: python -m unittest discover -s tests -p 'test_bannerlord*.py' -v
      - run: python -m unittest tests.test_project_create_rollback -v
      - run: python -m unittest discover -s tests -p test_data_map_coverage.py -v
      - run: python -c "import glob, subprocess; [subprocess.run(['node','--check',path], check=True) for path in glob.glob('plugins/bannerlord/*.js')]"
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install playwright
      - run: python -m playwright install --with-deps chromium
      - run: python tests/bannerlord_browser_check.py out/bannerlord-browser
      - name: Branch-native rendered UI audit
        run: python tests/bannerlord_ui_audit_check.py out/bannerlord-ui-audit-branch
      - name: Branch-native scoped Data Map audit
        if: always()
        run: python tests/data_map_browser_check.py out/bannerlord-data-map-browser-branch
        env:
          DATAMAP_GAMES: bannerlord
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bannerlord-browser-fixture
          path: |
            out/bannerlord-browser
            out/bannerlord-ui-audit-branch
            out/bannerlord-data-map-browser-branch
          retention-days: 7

  master-ui-compatibility:
    name: current-master UI compatibility
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install playwright
      - run: python -m playwright install --with-deps chromium
      - name: Materialize current master shared UI
        shell: bash
        run: |
          git fetch --no-tags --depth=1 origin master:refs/remotes/origin/master
          mkdir -p out/current-master-ui/ui
          git show origin/master:ui/framework.js > out/current-master-ui/ui/framework.js
          git show origin/master:ui/framework.css > out/current-master-ui/ui/framework.css
          git rev-parse origin/master > out/current-master-ui/MASTER_SHA
      - name: Current-master rendered UI audit
        shell: bash
        run: |
          LEXEDITOR_SHARED_UI_ROOT="$PWD/out/current-master-ui" \
          LEXEDITOR_SHARED_UI_SHA="$(cat out/current-master-ui/MASTER_SHA)" \
          python tests/bannerlord_ui_audit_check.py out/bannerlord-ui-audit-master
      - name: Current-master scoped Data Map audit
        if: always()
        shell: bash
        env:
          DATAMAP_GAMES: bannerlord
        run: |
          LEXEDITOR_SHARED_UI_ROOT="$PWD/out/current-master-ui" \
          python tests/data_map_browser_check.py out/bannerlord-data-map-browser-master
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bannerlord-current-master-ui-compatibility
          path: |
            out/bannerlord-ui-audit-master
            out/bannerlord-data-map-browser-master
            out/current-master-ui/MASTER_SHA
          retention-days: 7

  package-candidate:
    needs: [regression, browser]
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --disable-pip-version-check -r requirements.txt "pyinstaller>=6,<7"
      - name: Ensure Inno Setup
        shell: pwsh
        run: |
          if (-not (Test-Path 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe')) {
            choco install innosetup -y --no-progress
          }
      - name: Build and smoke packaged Lexeditor
        run: python tools/build_distribution.py
      - name: Prepare isolated Bannerlord test candidate
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force out\bannerlord-candidate | Out-Null
          Copy-Item -Recurse dist\Lexeditor out\bannerlord-candidate\Lexeditor
          @"
          Lexeditor Bannerlord PR #453 isolated test candidate
          Commit: $env:GITHUB_SHA
          Branch: feature/bannerlord-plugin

          IMPORTANT:
          - This is a portable candidate. Do NOT run the installer produced by the distribution smoke.
          - Extract/copy this artifact to a NEW disposable folder and run Lexeditor\Lexeditor.exe there.
          - Do not replace C:\Lexeditor or any existing installed Lexeditor copy.

          Setup:
          1. Start Lexeditor\Lexeditor.exe from this isolated artifact folder.
          2. In Lexeditor, select the real Mount & Blade II: Bannerlord installation.
          3. Select the intended Bannerlord project (for the existing mod, C:\Bannermod if unchanged).

          Acceptance:
          1. Open Module, Data Map, Build, Info (including Deployment Status), and Runtime; they must populate without preflight errors.
          2. Run Build + Deploy. The module must deploy under Modules/<SubModule ID>; overwritten module-owned assets must receive backups; runtime override JSON must not be overwritten by ordinary asset sync.
          3. Use Play. Bannerlord must start with the resolved module loadout and reach the game without module-loading/startup errors.
          4. Load the existing mod/save, make one reversible Runtime Override change, confirm it in the running game, then revert it.
          5. On failure, report the exact step plus Lexeditor/Bannerlord error text or relevant log excerpt.

          Branch-candidate evidence for this artifact includes Linux + Windows Bannerlord regression suites, branch-native Chromium behavior/visual checks, branch-native scoped Data Map coverage, and frozen packaged-app smoke.
          Current-master shared-UI compatibility is a separate CI job and is not acceptance evidence for this unchanged branch candidate.
          "@ | Set-Content -Encoding UTF8 out\bannerlord-candidate\TEST-INSTRUCTIONS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: bannerlord-test-candidate-windows-${{ github.sha }}
          path: out/bannerlord-candidate
          retention-days: 14
