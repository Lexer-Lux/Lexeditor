name: Apply RDR2 145 installed itemviewer fallback
on:
  push:
    branches: [fix/rdr2-145-installed-itemviewer]
    paths: ['.github/workflows/rdr2-145-installed-itemviewer.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/rdr2-145-installed-itemviewer
          submodules: false
      - name: Wire private installed-game artwork fallback
        shell: python
        run: |
          from pathlib import Path

          server = Path('games/rdr2/server.py')
          text = server.read_text(encoding='utf-8')

          import_anchor = '\n\nROOT = PLUGIN_ROOT\n'
          import_patch = '''\n\ntry:\n    from .inventory_icons import resolve_inventory_icon as _resolve_inventory_icon\nexcept ImportError:\n    from inventory_icons import resolve_inventory_icon as _resolve_inventory_icon\n\nROOT = PLUGIN_ROOT\n'''
          if '_resolve_inventory_icon' not in text:
              if text.count(import_anchor) != 1:
                  raise SystemExit('server import anchor changed')
              text = text.replace(import_anchor, import_patch, 1)

          old = '''                elif path.startswith("/assets/"):\n                    relative = Path(path.removeprefix("/assets/").replace("/", os.sep))\n                    asset = (ROOT / "assets" / relative).resolve()\n                    assets_root = (ROOT / "assets").resolve()\n                    if assets_root not in asset.parents or not asset.is_file():\n                        self._json({"error": "asset not found"}, 404)\n                    else:\n                        data = asset.read_bytes()\n                        self.send_response(200)\n                        self.send_header("Content-Type", mimetypes.guess_type(asset.name)[0] or "application/octet-stream")\n                        self.send_header("Cache-Control", "public, max-age=3600")\n                        self.send_header("Content-Length", str(len(data)))\n                        self.end_headers()\n                        self.wfile.write(data)\n'''
          new = '''                elif path.startswith("/assets/"):\n                    relative = Path(path.removeprefix("/assets/").replace("/", os.sep))\n                    asset = (ROOT / "assets" / relative).resolve()\n                    assets_root = (ROOT / "assets").resolve()\n                    if assets_root not in asset.parents:\n                        self._json({"error": "asset not found"}, 404)\n                    else:\n                        # #145: seven Story catalog refs live in the DLC UI_ITEMVIEWER\n                        # dictionary, not the base dictionary we imported. Resolve only\n                        # those proven IDs from the installed game into the private cache.\n                        if (not asset.is_file() and len(relative.parts) == 3\n                                and relative.parts[:2] == ("dictionary_icons", "ui_itemviewer")\n                                and relative.suffix.lower() == ".png"):\n                            generated = _resolve_inventory_icon(relative.stem)\n                            if generated is not None:\n                                asset = generated\n                        if not asset.is_file():\n                            self._json({"error": "asset not found"}, 404)\n                        else:\n                            data = asset.read_bytes()\n                            self.send_response(200)\n                            self.send_header("Content-Type", mimetypes.guess_type(asset.name)[0] or "application/octet-stream")\n                            self.send_header("Cache-Control", "public, max-age=3600")\n                            self.send_header("Content-Length", str(len(data)))\n                            self.end_headers()\n                            self.wfile.write(data)\n'''
          if '_resolve_inventory_icon(relative.stem)' not in text:
              if text.count(old) != 1:
                  raise SystemExit('server asset anchor changed')
              text = text.replace(old, new, 1)
          server.write_text(text, encoding='utf-8')

          test = Path('tests/test_rdr2_inventory_icons.py')
          source = test.read_text(encoding='utf-8')
          marker = '''    def test_decoded_rsc8_rejects_truncated_payload(self):\n'''
          addition = '''    def test_server_falls_back_only_after_a_local_ui_itemviewer_miss(self):\n        source = (Path(__file__).resolve().parents[1] / "games/rdr2/server.py").read_text(encoding="utf-8")\n        self.assertIn("_resolve_inventory_icon(relative.stem)", source)\n        self.assertIn('relative.parts[:2] == ("dictionary_icons", "ui_itemviewer")', source)\n        self.assertIn("if not asset.is_file():", source)\n\n'''
          if 'test_server_falls_back_only_after_a_local_ui_itemviewer_miss' not in source:
              if source.count(marker) != 1:
                  raise SystemExit('test anchor changed')
              source = source.replace(marker, addition + marker, 1)
              test.write_text(source, encoding='utf-8')

          worklog = Path('worklog/issues/github-145.md')
          log = worklog.read_text(encoding='utf-8')
          note = '''\n- Branch `fix/rdr2-145-installed-itemviewer` resolves the 7 C5/C6 treasure-map references on demand from the installed `x64/dlcpacks/dlc_content_extra/dlc.rpf` → `x64/textures/ui/ui_itemviewer.ytd`. Generated PNGs stay under Lexeditor's private cache; no new Rockstar textures are committed.\n- `RpfCli` returns decoded resources with an internal uncompressed RSC8 header. The fallback losslessly rewraps that decoded virtual+physical payload as standard raw-deflate RSC8 before `texfury` decodes the YTD.\n- Once this branch lands, the unresolved set drops from 48 to 41 dynamic/document references; those still require proven source/alias resolution rather than guessed substitutes.\n'''
          if 'the unresolved set drops from 48 to 41' not in log:
              worklog.write_text(log.rstrip() + '\n' + note, encoding='utf-8')
      - name: Verify RDR2 icon fallback
        run: |
          python tests/test_rdr2_inventory_icons.py
          python -m py_compile games/rdr2/inventory_icons.py games/rdr2/server.py
          python tests/test_rdr2_issue_repairs.py
      - name: Commit verified patch and remove one-shot workflow
        run: |
          git rm .github/workflows/rdr2-145-installed-itemviewer.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add games/rdr2/server.py tests/test_rdr2_inventory_icons.py
          git add -f worklog/issues/github-145.md
          git commit -m "Resolve RDR2 DLC itemviewer artwork on demand (#145)"
          git push origin HEAD:fix/rdr2-145-installed-itemviewer
