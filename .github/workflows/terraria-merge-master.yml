name: Merge current master into Terraria

on:
  push:
    branches: [feature/terraria-plugin]
    paths:
      - '.github/workflows/terraria-merge-master.yml'

permissions:
  contents: write

jobs:
  merge-master:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Merge master and resolve Terraria-owned overlaps
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin master

          set +e
          git merge --no-commit --no-ff origin/master
          merge_status=$?
          set -e

          mapfile -t conflicts < <(git diff --name-only --diff-filter=U)
          for path in "${conflicts[@]}"; do
            case "$path" in
              runtime_bootstrap.py|ui/credits-sources.json|ui/credits.json|ui/mod-loading.json)
                git checkout --theirs -- "$path"
                ;;
              *)
                echo "Unexpected merge conflict: $path" >&2
                exit 1
                ;;
            esac
          done

          python - <<'PY'
          import json
          from pathlib import Path

          runtime = Path('runtime_bootstrap.py')
          text = runtime.read_text(encoding='utf-8')
          if "'games.terraria.server'" not in text:
              needle = "    'games.ff8.server', 'games.ff9.server', 'games.palworld.full_server', 'games.rdr.server', 'games.rdr2.server',\n    'games.warband.server',"
              replacement = "    'games.ff8.server', 'games.ff9.server', 'games.palworld.full_server', 'games.rdr.server', 'games.rdr2.server',\n    'games.terraria.server', 'games.warband.server',"
              if needle not in text:
                  raise SystemExit('Could not locate current SERVICE_MODULES layout')
              runtime.write_text(text.replace(needle, replacement, 1), encoding='utf-8')

          credits_path = Path('ui/credits-sources.json')
          credits = json.loads(credits_path.read_text(encoding='utf-8'))
          credits['plugins']['terraria'] = {
              'contributions': [{
                  'name': 'tModLoader team / tModLoader',
                  'role': 'Terraria mod loader, source-project/build conventions, ExampleMod, build.txt semantics and API reference.',
                  'url': 'https://github.com/tModLoader/tModLoader',
              }],
              'thanks': [],
              'licenses': [],
          }
          credits_path.write_text(json.dumps(credits, indent=2, ensure_ascii=False) + '\n', encoding='utf-8')

          loading_path = Path('ui/mod-loading.json')
          loading = json.loads(loading_path.read_text(encoding='utf-8'))
          loading['plugins']['terraria'] = {
              'loader': "tModLoader 1.4.4 stable. Lexeditor targets tModLoader's native source-project, build, local-mod and Workshop ecosystem instead of patching vanilla Terraria or shipping another loader.",
              'structure': 'Editable source mods live under the tModLoader save root at ModSources/<ModName>/ with build.txt, a .csproj importing ..\\tModLoader.targets, C# source, localization and content assets. tModLoader owns compiled .tmod output and enabled-mod state.',
              'overriding': "tModLoader loads multiple mods through its API/dependency model rather than whole-file replacement order. Lexeditor does not invent cross-mod file priority or semantically merge unrelated source projects; runtime interactions and conflicts follow tModLoader and the participating mods.",
          }
          loading_path.write_text(json.dumps(loading, indent=2, ensure_ascii=False) + '\n', encoding='utf-8')
          PY

          python tools/generate_credits.py
          git add runtime_bootstrap.py ui/credits-sources.json ui/credits.json ui/mod-loading.json

          if git diff --name-only --diff-filter=U | grep -q .; then
            echo 'Unresolved merge conflicts remain.' >&2
            git diff --name-only --diff-filter=U >&2
            exit 1
          fi

          if [ "$merge_status" -ne 0 ]; then
            echo 'Expected overlap conflicts were resolved.'
          fi
          git commit -m 'Merge current master into Terraria plugin'
          git push origin HEAD:feature/terraria-plugin
