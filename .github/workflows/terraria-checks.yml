name: Terraria checks

on:
  push:
    branches: [master, feature/terraria-plugin]
    paths:
      - 'plugins/terraria/**'
      - 'codex/terraria/**'
      - 'plugin_api.py'
      - 'project_manager.py'
      - 'tests/test_terraria_*.py'
      - 'tests/terraria_browser_check.py'
      - '.github/workflows/terraria-checks.yml'
  pull_request:
    paths:
      - 'plugins/terraria/**'
      - 'codex/terraria/**'
      - 'plugin_api.py'
      - 'project_manager.py'
      - 'tests/test_terraria_*.py'
      - 'tests/terraria_browser_check.py'
      - '.github/workflows/terraria-checks.yml'

concurrency:
  group: terraria-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  terraria:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Python parser and service tests
        run: |
          python -m compileall -q plugins/terraria plugin_api.py project_manager.py
          python -m unittest discover -s tests -p 'test_terraria_*.py'
      - name: Editor JavaScript syntax
        run: node --check plugins/terraria/editor.js
      - name: Install browser acceptance
        run: |
          python -m pip install --disable-pip-version-check 'playwright>=1.50,<2'
          python -m playwright install --with-deps chromium
      - name: Render Terraria UI acceptance
        run: python tests/terraria_browser_check.py out/terraria-browser
      - name: Preserve Terraria rendered evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: terraria-browser-${{ github.sha }}
          path: out/terraria-browser
          retention-days: 7
          if-no-files-found: ignore

  acceptance-candidate:
    name: Windows acceptance candidate
    if: github.event_name == 'pull_request'
    needs: terraria
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          # A human-test candidate must be the exact PR head, not GitHub's synthetic merge ref.
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Prove Windows file-version metadata reader
        shell: pwsh
        run: python -c "from pathlib import Path; import sys; from plugins.terraria.runtime import windows_product_version; value=windows_product_version(Path(sys.executable)); print(value); assert value.strip()"
      - name: Build packaged acceptance runner
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          python -m pip install --disable-pip-version-check -r requirements.txt 'pyinstaller>=6,<7'
          python -m PyInstaller --noconfirm --clean --onefile --name TerrariaAcceptance `
            --paths . `
            --collect-submodules plugins.terraria `
            --hidden-import plugin_api `
            --hidden-import project_manager `
            --hidden-import runtime_bootstrap `
            --hidden-import service_session `
            --add-data "plugins/terraria/template;plugins/terraria/template" `
            tools/terraria_acceptance.py

          New-Item -ItemType Directory -Force candidate | Out-Null
          Copy-Item dist/TerrariaAcceptance.exe candidate/TerrariaAcceptance.exe

          @"
          Terraria / Lexeditor PR #464 acceptance candidate
          Branch: feature/terraria-plugin
          Head: ${{ github.event.pull_request.head.sha }}
          Target: Windows Steam tModLoader 1.4.4 stable v2026.07.3.0

          This executable is the packaged form of tools/terraria_acceptance.py from the exact PR head above.
          It creates the prepared 20-family acceptance mod and invokes the installed tModLoader native build.
          Lexer does not need Python, a repository checkout, or a compiler/toolchain for Lexeditor.

          Run in PowerShell:
            .\TerrariaAcceptance.exe

          Optional non-default paths:
            .\TerrariaAcceptance.exe --install-root "C:\path\to\tModLoader" --save-root "C:\path\to\Terraria\tModLoader"

          A PASS means the installed tModLoader produced the expected .tmod. It is not in-game acceptance.
          Then launch that same tModLoader installation, enable the generated LexeditorAcceptance_* mod if needed,
          enter a world, run /lexaccept, and craft the magenta checker Acceptance Item from one Dirt Block.
          Report any tModLoader content/asset error or mismatch in those two smoke checks.
          "@ | Set-Content -Encoding utf8 candidate/ACCEPTANCE.txt

          @"
          PR=464
          BRANCH=feature/terraria-plugin
          HEAD=${{ github.event.pull_request.head.sha }}
          "@ | Set-Content -Encoding ascii candidate/BUILD.txt
          Get-FileHash candidate/TerrariaAcceptance.exe -Algorithm SHA256 |
            ForEach-Object { "SHA256=$($_.Hash)" } | Add-Content -Encoding ascii candidate/BUILD.txt
      - name: Prove packaged runner carries the prepared fixture
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $saveRoot = Join-Path $env:RUNNER_TEMP 'terraria-acceptance-save'
          $json = & .\candidate\TerrariaAcceptance.exe `
            --generate-only `
            --save-root $saveRoot `
            --name LexeditorAcceptanceCandidateCheck `
            --json
          if ($LASTEXITCODE -ne 0) { throw "Packaged acceptance runner exited $LASTEXITCODE" }
          $result = $json | ConvertFrom-Json
          if (-not $result.ok -or -not $result.generated -or $result.managedFamilies -ne 20) {
            throw "Packaged acceptance runner did not generate the complete 20-family fixture"
          }
          $project = Join-Path $saveRoot 'ModSources\LexeditorAcceptanceCandidateCheck'
          $command = Join-Path $project 'Common\Commands\AcceptanceCommand.cs'
          $recipe = Join-Path $project 'Common\Recipes\AcceptanceRecipe.cs'
          if (-not (Test-Path $command) -or -not (Select-String -LiteralPath $command -SimpleMatch 'Command => "lexaccept";' -Quiet)) {
            throw 'Packaged fixture is missing the /lexaccept command'
          }
          if (-not (Test-Path $recipe) -or -not (Select-String -LiteralPath $recipe -SimpleMatch 'recipe.AddIngredient(2, 1);' -Quiet)) {
            throw 'Packaged fixture is missing the one-Dirt acceptance recipe'
          }
      - uses: actions/upload-artifact@v4
        with:
          name: terraria-acceptance-pr464-${{ github.event.pull_request.head.sha }}
          path: candidate/
          retention-days: 7
          if-no-files-found: error

  portable-acceptance-candidate:
    name: Portable Windows acceptance candidate
    if: github.event_name == 'pull_request'
    needs: terraria
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Assemble self-contained Windows runner
        shell: bash
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          mkdir -p candidate/runtime candidate/runner/tools candidate/runner/games
          cp tools/terraria_acceptance.py candidate/runner/tools/
          cp plugin_api.py service_session.py runtime_bootstrap.py candidate/runner/
          cp -R plugins/terraria candidate/runner/plugins/terraria
          test -f plugins/__init__.py && cp plugins/__init__.py candidate/runner/plugins/__init__.py || touch candidate/runner/plugins/__init__.py
          find candidate/runner -type d -name __pycache__ -prune -exec rm -rf {} +

          python_url='https://www.python.org/ftp/python/3.12.10/python-3.12.10-embed-amd64.zip'
          curl --fail --location --retry 3 "$python_url" -o python-embed.zip
          unzip -q python-embed.zip -d candidate/runtime
          unzip -tq python-embed.zip
          printf '\n..\\runner\n' >> candidate/runtime/python312._pth

          cat > candidate/Run-Terraria-Acceptance.cmd <<'CMD'
          @echo off
          setlocal
          cd /d "%~dp0"
          runtime\python.exe runner\tools\terraria_acceptance.py %*
          set EXITCODE=%ERRORLEVEL%
          if not "%EXITCODE%"=="0" (
            echo.
            echo Acceptance runner failed. Keep this window open and report the error text plus the latest tModLoader log.
            pause
          )
          exit /b %EXITCODE%
          CMD

          cat > candidate/ACCEPTANCE.txt <<EOF
          Terraria / Lexeditor PR #464 acceptance candidate
          Branch: feature/terraria-plugin
          Head: $HEAD_SHA
          Target: Windows Steam tModLoader 1.4.4 stable v2026.07.3.0

          This package contains the exact PR-head acceptance harness plus a private portable Python runtime.
          No repository checkout, Python installation, or Lexeditor compilation is required.

          1. Extract the artifact to a normal writable folder.
          2. Fully close tModLoader if it is running.
          3. Double-click Run-Terraria-Acceptance.cmd.
             The standard Steam tModLoader install/save paths are used automatically.
             For non-default paths, open Command Prompt in this folder and run:
               Run-Terraria-Acceptance.cmd --install-root "C:\path\to\tModLoader" --save-root "C:\path\to\Terraria\tModLoader"
          4. The runner creates a timestamped LexeditorAcceptance_* source mod and invokes tModLoader's real native build.
             PASS requires the expected .tmod to exist.
          5. Launch that same tModLoader installation, enable the generated acceptance mod if needed, and enter a world.
          6. Run /lexaccept. Expected reply: Lexeditor Terraria acceptance mod loaded.
          7. With one Dirt Block, craft the magenta checker Acceptance Item by hand.
          8. Report any content/asset load error, command mismatch, crafting mismatch, or runner error.
             On a runner/build failure, include its console text and the latest tModLoader log.

          The packaged-generation check in CI is preparation only; it does not claim in-game acceptance.
          EOF

          {
            echo 'PR=464'
            echo 'BRANCH=feature/terraria-plugin'
            echo "HEAD=$HEAD_SHA"
            echo "PYTHON_RUNTIME=$python_url"
            sha256sum python-embed.zip | sed 's/^/PYTHON_ZIP_SHA256=/'
          } > candidate/BUILD.txt
      - name: Verify packaged source tree and prepared smoke fixture
        shell: bash
        run: |
          set -euo pipefail
          python -m compileall -q candidate/runner
          save_root="$RUNNER_TEMP/terraria-portable-candidate"
          PYTHONPATH="$PWD/candidate/runner" python candidate/runner/tools/terraria_acceptance.py \
            --generate-only \
            --save-root "$save_root" \
            --name LexeditorAcceptancePortableCheck \
            --json > candidate/generate-only.json
          python - <<'PY'
          import json
          from pathlib import Path
          result=json.loads(Path("candidate/generate-only.json").read_text(encoding="utf-8"))
          if not result.get("ok") or not result.get("generated") or result.get("managedFamilies") != 20:
              raise SystemExit("portable candidate did not generate all 20 managed families")
          project=Path(result["project"])
          command=(project/"Common/Commands/AcceptanceCommand.cs").read_text(encoding="utf-8")
          recipe=(project/"Common/Recipes/AcceptanceRecipe.cs").read_text(encoding="utf-8")
          if 'Command => "lexaccept";' not in command:
              raise SystemExit("portable candidate is missing /lexaccept")
          if "recipe.AddIngredient(2, 1);" not in recipe:
              raise SystemExit("portable candidate is missing one-Dirt recipe")
          PY
          rm candidate/generate-only.json
      - uses: actions/upload-artifact@v4
        with:
          name: terraria-portable-acceptance-pr464-${{ github.event.pull_request.head.sha }}
          path: candidate/
          retention-days: 7
          if-no-files-found: error

