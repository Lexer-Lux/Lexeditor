name: RDR2 145 one-shot resolver repair

on:
  push:
    paths:
      - .github/workflows/rdr2-145-one-shot.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Repair multi-texture icon resolution and audit residuals
        shell: python
        run: |
          from pathlib import Path
          import re

          editor = Path('games/rdr2/editor.html')
          text = editor.read_text(encoding='utf-8')
          pattern = re.compile(
              r'function inventoryIconCandidates\(texture\)\{.*?\n\}\n\nfunction inventoryIconKey',
              re.S,
          )
          replacement = r'''function inventoryIconCandidates(texture){
            if(!texture?.id)return [];
            const dict=(texture.dict||"").toUpperCase();
            // Some catalog viewer references contain multiple texture names (for
            // example a two-page book) separated by whitespace. Treat those as
            // ordered fallbacks instead of URL-encoding the whole string into one
            // impossible filename.
            const ids=String(texture.id).trim().split(/\s+/).filter(Boolean)
              .map(value=>encodeURIComponent(value.toLowerCase()));
            if(!ids.length)return [];
            if(dict==="INVENTORY_ITEMS")return ids.flatMap(id=>[
              `/assets/inventory_icons/inventory_items/${id}.png`,
              `https://femga.com:8080/images/samples/ui_textures_no_bg/inventory_items/${id}.png`,
            ]);
            // Femga stores the RDO dictionary below its ui_textures_mp family. The old
            // generic dictionary path omitted that family and returned an HTML 404.
            if(dict==="INVENTORY_ITEMS_MP")return ids.map(id=>
              `https://femga.com:8080/images/samples/ui_textures_no_bg/ui_textures_mp/inventory_items_mp/${id}.png`);
            if(dict==="LEX_INVENTORY_ITEMS")return ids.map(id=>`/assets/item-icons/${id}.png`);
            if(dict==="ITEM_TEXTURES"||dict==="UI_ITEMVIEWER")return ids.map(id=>
              `/assets/dictionary_icons/${dict.toLowerCase()}/${id}.png`);
            if(dict)return ids.map(id=>
              `https://femga.com:8080/images/samples/ui_textures_no_bg/${dict.toLowerCase()}/${id}.png`);
            return [];
          }

          function inventoryIconKey'''
          changed, count = pattern.subn(lambda _match: replacement, text, count=1)
          if count != 1:
              raise SystemExit(f'expected one inventoryIconCandidates function, replaced {count}')
          if 'encodeURIComponent(texture.id.toLowerCase())' in changed:
              raise SystemExit('old whole-field texture encoding survived')
          if 'split(/\\s+/)' not in changed:
              raise SystemExit('multi-texture split missing from repaired resolver')
          editor.write_text(changed, encoding='utf-8')

          report = Path('games/rdr2/assets/MISSING_ICONS.txt').read_text(encoding='utf-8')
          section = report.split('[UI_ITEMVIEWER]  283 missing of 283', 1)[1].split('\n[', 1)[0]
          refs = [line.strip() for line in section.splitlines() if line.startswith('  ')]
          if len(refs) != 283:
              raise SystemExit(f'expected 283 UI_ITEMVIEWER source references, found {len(refs)}')
          icon_dir = Path('games/rdr2/assets/dictionary_icons/ui_itemviewer')
          present = {p.stem.upper() for p in icon_dir.glob('*.png')}
          if len(present) != 235:
              raise SystemExit(f'expected 235 current UI_ITEMVIEWER PNGs, found {len(present)}')
          missing = [ref for ref in refs if not any(token.upper() in present for token in ref.split())]
          if len(missing) != 48:
              raise SystemExit(f'expected 48 current residual UI_ITEMVIEWER references, found {len(missing)}')
          multi = [ref for ref in refs if len(ref.split()) > 1]

          worklog = Path('worklog/issues/github-145.md')
          worklog.parent.mkdir(parents=True, exist_ok=True)
          worklog.write_text(
              '# GitHub #145 — Resolve remaining missing editor item icons\n\n'
              '## Current evidence\n\n'
              '- Current `master` contains all 347 local `ITEM_TEXTURES` images and **235** local `UI_ITEMVIEWER` images. The issue body\'s older 197-viewer / 86-residual count is stale.\n'
              '- `MISSING_ICONS.txt` is a pre-import report; comparing its 283 `UI_ITEMVIEWER` reference values with the current checked-in viewer PNGs leaves exactly **48** unresolved reference values.\n'
              '- Two catalog values contain multiple whitespace-separated texture IDs. The editor previously URL-encoded each whole value as one filename; `inventoryIconCandidates` now treats the component IDs as ordered fallbacks.\n'
              f'- Multi-ID values: {", ".join(f"`{value}`" for value in multi)}.\n\n'
              '## Residual UI_ITEMVIEWER reference values (48)\n\n'
              + ''.join(f'- `{value}`\n' for value in missing)
              + '\n## Acceptance boundary\n\n'
              'This change repairs the resolver defect and records the exact current residual set. It does **not** claim the remaining 48 references are resolved or visually accepted. Continue by locating alternate dictionaries/aliases and repairing any decoder failures; do not request another OpenIV export.\n',
              encoding='utf-8',
          )
      - name: Static verification
        shell: bash
        run: |
          set -euo pipefail
          grep -F 'split(/\s+/)' games/rdr2/editor.html
          grep -F 'Residual UI_ITEMVIEWER reference values (48)' worklog/issues/github-145.md
          test "$(find games/rdr2/assets/dictionary_icons/ui_itemviewer -maxdepth 1 -type f -name '*.png' | wc -l)" -eq 235
      - name: Commit repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add games/rdr2/editor.html worklog/issues/github-145.md
          git diff --cached --check
          git commit -m 'RDR2 #145: split multi-texture icon references'
          git push origin HEAD:master
