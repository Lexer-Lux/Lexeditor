name: Integrate Terraria structured content UI

on:
  push:
    branches: [feature/terraria-plugin]
    paths:
      - '.github/workflows/terraria-structured-ui-patch.yml'

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply structured UI patch
        run: |
          python .github/scripts/terraria_structured_ui_repair.py
          python .github/scripts/terraria_structured_ui_patch.py
      - name: Verify Terraria
        run: |
          python -m compileall -q games/terraria plugin_api.py project_manager.py
          python -m unittest discover -s tests -p 'test_terraria_*.py'
          python -c "from pathlib import Path; h=Path('games/terraria/editor.html').read_text(encoding='utf-8'); Path('/tmp/terraria-editor.js').write_text(h.split('<script>')[-1].split('</script>',1)[0],encoding='utf-8')"
          node --check /tmp/terraria-editor.js
          git diff --check
      - name: Commit structured UI
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -f .github/workflows/terraria-structured-ui-patch.yml .github/scripts/terraria_structured_ui_patch.py .github/scripts/terraria_structured_ui_repair.py
          git add games/terraria/editor.html
          git commit -m 'Add Terraria structured content editor UI'
          git push origin HEAD:feature/terraria-plugin
