name: Temporary Bannerlord shared dependency model integration

on:
  push:
    branches: [feature/bannerlord-plugin]
    paths:
      - '.github/workflows/temp-bannerlord-shared-dependency-model.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/bannerlord-plugin
      - name: Refactor Play and deployment onto shared relation model
        shell: python
        run: |
          from pathlib import Path

          def replace_once(text, old, new, label):
              if text.count(old) != 1:
                  raise SystemExit(f'{label}: match count {text.count(old)}')
              return text.replace(old, new, 1)

          def replace_between(text, start, end, replacement, label):
              if text.count(start) != 1:
                  raise SystemExit(f'{label}: start count {text.count(start)}')
              start_at = text.index(start)
              if text[start_at:].count(end) != 1:
                  raise SystemExit(f'{label}: end count {text[start_at:].count(end)}')
              end_at = text.index(end, start_at)
              return text[:start_at] + replacement + text[end_at:]

          launch = Path('games/bannerlord/game_launch.py')
          text = launch.read_text(encoding='utf-8')
          text = replace_once(
              text,
              'from .community_metadata import read_community_dependencies\nfrom .module_data import is_singleplayer_module, read_submodule\n',
              'from .community_metadata import read_community_dependencies\nfrom .dependency_relations import effective_incompatible_relations, effective_load_relations\nfrom .module_data import is_singleplayer_module, read_submodule\n',
              'game launch imports',
          )
          shared_helpers = '\n'.join([
              '    def dependencies_to_load(module_id: str) -> list[dict]:',
              '        return effective_load_relations(metadata(module_id), community(module_id))',
              '',
              '    def incompatible_relations(module_id: str) -> list[str]:',
              '        return [',
              '            row["id"]',
              '            for row in effective_incompatible_relations(metadata(module_id), community(module_id))',
              '        ]',
              '',
              '',
          ])
          text = replace_between(
              text,
              '    def dependencies_to_load(module_id: str) -> list[dict]:\n',
              '    included: set[str] = set()\n',
              shared_helpers,
              'game launch shared helpers',
          )
          launch.write_text(text, encoding='utf-8')

          runtime = Path('games/bannerlord/runtime_data.py')
          text = runtime.read_text(encoding='utf-8')
          text = replace_once(
              text,
              'from .community_metadata import community_version_matches, read_community_dependencies\nfrom .game_launch import module_load_order\n',
              'from .community_metadata import community_version_matches, read_community_dependencies\nfrom .dependency_relations import incompatible_relation_rows, load_relation_rows\nfrom .game_launch import module_load_order\n',
              'runtime imports',
          )

          diagnostics = '\n'.join([
              '    dependency_rows = []',
              '    missing_required = []',
              '    version_mismatches = []',
              '    community_version_mismatches = []',
              '',
              '    for relation in load_relation_rows(module, community_dependencies):',
              '        dep_id = str(relation.get("id") or "")',
              '        found = installed.get(dep_id.casefold())',
              '        optional = bool(relation.get("optional"))',
              '        effective = bool(relation.get("effective"))',
              '        required_version = str(relation.get("version") or "").strip()',
              '        installed_version = str(found.get("version", "") or "").strip() if found else ""',
              '        version_match = None',
              '        if effective and not found and not optional:',
              '            missing_required.append(dep_id)',
              '        if effective and found and required_version and not optional:',
              '            if relation.get("origin") == "DependedModules":',
              '                version_match = _dependency_version_matches(required_version, installed_version)',
              '                if not version_match:',
              '                    version_mismatches.append(',
              '                        f"{dep_id} requires {required_version}, installed "',
              '                        f"{installed_version or \'(no version declared)\'}"',
              '                    )',
              '            else:',
              '                version_match = community_version_matches(required_version, installed_version)',
              '                if version_match is False:',
              '                    community_version_mismatches.append(',
              '                        f"{dep_id} requires {required_version}, installed "',
              '                        f"{installed_version or \'(no version declared)\'}"',
              '                    )',
              '        shadowed_by = str(relation.get("shadowedByOrigin") or "")',
              '        dependency_rows.append(',
              '            {',
              '                "id": dep_id,',
              '                "requiredVersion": required_version,',
              '                "optional": optional,',
              '                "installed": bool(found),',
              '                "installedVersion": installed_version,',
              '                "versionMatch": version_match,',
              '                "path": found.get("path", "") if found else "",',
              '                "source": relation.get("source") or "extended",',
              '                "origin": relation.get("origin") or "metadata",',
              '                "order": relation.get("order") or "",',
              '                "incompatible": False,',
              '                "effective": effective,',
              '                "shadowedByOrigin": shadowed_by,',
              '                "overriddenByCommunityMetadata": bool(',
              '                    not effective',
              '                    and relation.get("origin") == "DependedModules"',
              '                    and shadowed_by != "DependedModules"',
              '                ),',
              '            }',
              '        )',
              '',
              '    for relation in incompatible_relation_rows(module, community_dependencies):',
              '        dep_id = str(relation.get("id") or "")',
              '        found = installed.get(dep_id.casefold())',
              '        dependency_rows.append(',
              '            {',
              '                "id": dep_id,',
              '                "requiredVersion": str(relation.get("version") or "").strip(),',
              '                "optional": bool(relation.get("optional")),',
              '                "installed": bool(found),',
              '                "installedVersion": str(found.get("version", "") or "").strip() if found else "",',
              '                "versionMatch": None,',
              '                "path": found.get("path", "") if found else "",',
              '                "source": relation.get("source") or "extended",',
              '                "origin": relation.get("origin") or "metadata",',
              '                "order": relation.get("order") or "",',
              '                "incompatible": True,',
              '                "effective": bool(relation.get("effective")),',
              '                "shadowedByOrigin": str(relation.get("shadowedByOrigin") or ""),',
              '                "overriddenByCommunityMetadata": False,',
              '            }',
              '        )',
              '',
          ])
          text = replace_between(
              text,
              '    dependency_rows = []\n',
              '    missing_required = list(dict.fromkeys(value for value in missing_required if value))\n',
              diagnostics,
              'deployment dependency diagnostics',
          )
          runtime.write_text(text, encoding='utf-8')

          ui = Path('games/bannerlord/editor_balancing.js')
          text = ui.read_text(encoding='utf-8')
          old = '    if(row.overriddenByCommunityMetadata)details.push("native row overridden by extended metadata");\n'
          new = '    if(row.effective===false)details.push(`SHADOWED by ${row.shadowedByOrigin||"earlier relation"}`);\n    if(row.overriddenByCommunityMetadata)details.push("native row overridden by extended metadata");\n'
          text = replace_once(text, old, new, 'deployment shadowed label')
          old = '    return `${row.installed?"✓":"✗"} ${row.id} — ${details.join(" · ")}`;\n'
          new = '    const marker=row.effective===false?"↳":(row.installed?"✓":"✗");\n    return `${marker} ${row.id} — ${details.join(" · ")}`;\n'
          text = replace_once(text, old, new, 'deployment shadowed marker')
          ui.write_text(text, encoding='utf-8')
      - name: Add shadowed-row deployment regression
        shell: python
        run: |
          from pathlib import Path

          path = Path('tests/test_bannerlord_dependency_diagnostics.py')
          text = path.read_text(encoding='utf-8')
          marker = '\n\nif __name__ == "__main__":\n'
          if text.count(marker) != 1:
              raise SystemExit(f'test insertion marker count: {text.count(marker)}')
          test = '''
              def test_shadowed_native_required_row_does_not_block_optional_extended_relation(self):
                  with tempfile.TemporaryDirectory() as name:
                      root = Path(name)
                      game = root / "game"
                      executable = game / "bin" / "Win64_Shipping_Client" / "Bannerlord.exe"
                      executable.parent.mkdir(parents=True)
                      executable.write_bytes(b"")
                      deployed = write_module(
                          game,
                          "Selected",
                          '''<DependedModules>
                <DependedModule Id="Missing.Library" />
              </DependedModules>
              <DependedModuleMetadatas>
                <DependedModuleMetadata id="Missing.Library" order="LoadBeforeThis" optional="true" />
              </DependedModuleMetadatas>''',
                      )
                      workspace = root / "workspace"
                      workspace.mkdir()
                      (workspace / "SubModule.xml").write_text(
                          (deployed / "SubModule.xml").read_text(encoding="utf-8"),
                          encoding="utf-8",
                      )

                      status = deployment_status(workspace, game)
                      rows = [row for row in status["dependencies"] if row["id"] == "Missing.Library"]
                      self.assertEqual(len(rows), 2)
                      effective = next(row for row in rows if row["effective"])
                      shadowed = next(row for row in rows if not row["effective"])
                      self.assertEqual(effective["origin"], "DependedModuleMetadatas")
                      self.assertTrue(effective["optional"])
                      self.assertEqual(shadowed["origin"], "DependedModules")
                      self.assertEqual(shadowed["shadowedByOrigin"], "DependedModuleMetadatas")
                      self.assertTrue(shadowed["overriddenByCommunityMetadata"])
                      self.assertFalse(any("Missing required dependencies" in issue for issue in status["issues"]))
                      self.assertEqual(status["loadOrder"], ["Selected"])
                      self.assertTrue(status["runnable"])
          '''
          # Avoid nested triple-quote ambiguity in this tiny generated test.
          test = test.replace("'''<DependedModules>", '"""<DependedModules>').replace("</DependedModuleMetadatas>'''", '</DependedModuleMetadatas>"""')
          import textwrap
          test = textwrap.dedent(test)
          path.write_text(text.replace(marker, '\n' + test + marker, 1), encoding='utf-8')
      - name: Validate shared dependency model
        run: |
          python -m compileall -q games/bannerlord
          python -m unittest tests.test_bannerlord_dependency_relations tests.test_bannerlord_dependency_precedence tests.test_bannerlord_dependency_diagnostics tests.test_bannerlord_community_metadata tests.test_bannerlord_launch -v
          node --check games/bannerlord/editor_balancing.js
      - name: Commit shared model integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add games/bannerlord/game_launch.py games/bannerlord/runtime_data.py games/bannerlord/editor_balancing.js tests/test_bannerlord_dependency_diagnostics.py
          git commit -m "Share Bannerlord dependency precedence diagnostics"
          git push origin HEAD:feature/bannerlord-plugin
