name: FF7 installed acceptance hardening one-shot

on:
  push:
    branches:
      - work/ff7-complete-kernel-surface
    paths:
      - 'tools/_ff7_installed_acceptance_once.py'
      - '.github/workflows/ff7-installed-acceptance-once.yml'

permissions:
  contents: write

jobs:
  apply-test-land:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/ff7-complete-kernel-surface
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Apply installed acceptance hardening
        run: python tools/_ff7_installed_acceptance_once.py
      - name: Verify FF7 binary and acceptance contracts
        run: |
          python tools/verify_ff7_datasets.py
          python tools/verify_ff7_extended.py
          python tools/verify_ff7_completion.py
          python tools/verify_ff7_installed_contract.py
          python tools/verify_ff7_semantic_surface.py
      - name: Commit tested acceptance hardening and remove scaffold
        shell: bash
        run: |
          git rm tools/_ff7_installed_acceptance_once.py .github/workflows/ff7-installed-acceptance-once.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add games/ff7/kernel.py tools/verify_ff7_installed.py tools/verify_ff7_installed_contract.py tools/FF7-checks.cmd .github/workflows/ff7-data-regressions.yml
          git commit -m 'Harden FF7 installed-data acceptance proof'
          git push origin HEAD:work/ff7-complete-kernel-surface
