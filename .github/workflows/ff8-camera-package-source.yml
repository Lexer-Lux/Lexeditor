name: Export FF8 camera package source
on:
  push:
    branches: [fix/ff8-world-camera-pitch]
    paths: [.github/workflows/ff8-camera-package-source.yml]
permissions:
  contents: read
jobs:
  verifier-wheels:
    runs-on: ubuntu-24.04
    steps:
      - name: Download exact verifier dependencies
        run: |
          python -m pip download --only-binary=:all: --dest wheels \
            pefile==2024.8.26 capstone==5.0.6 unicorn==2.1.4
      - uses: actions/upload-artifact@v4
        with:
          name: ff8-verifier-wheels
          path: wheels
          retention-days: 2
          if-no-files-found: error
