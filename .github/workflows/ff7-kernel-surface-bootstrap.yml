name: FF7 kernel surface bootstrap

on:
  push:
    branches:
      - work/ff7-complete-kernel-surface

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/ff7-complete-kernel-surface
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Apply Commands and Player attacks integration
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          p=Path('games/ff7/kernel.py')
          s=p.read_text()
          old='''    category.key: category for category in (\n        Category("items", "Items", 5, 20, 12, 28, (\n'''
          new='''    category.key: category for category in (\n        Category("commands", "Commands", 1, 18, 10, 8, (\n            Field("initialCursorAction", "Command action", 0x00),\n            Field("targetData", "Target flags", 0x01),\n            Field("cameraMovementIdSingle", "Single-target camera ID", 0x04, "H", maximum=65535),\n            Field("cameraMovementIdMulti", "Multi-target camera ID", 0x06, "H", maximum=65535),\n        )),\n        Category("playerAttacks", "Player attacks", 2, 19, 11, 28, (\n            Field("accuracyRate", "Accuracy", 0x00),\n            Field("impactEffectId", "Impact effect ID", 0x01),\n            Field("targetHurtActionIndex", "Target hurt action ID", 0x02),\n            Field("mpCost", "MP cost", 0x04, "H", maximum=65535),\n            Field("impactSound", "Impact sound ID", 0x06, "H", maximum=65535),\n            Field("cameraMovementIdSingle", "Single-target camera ID", 0x08, "H", maximum=65535),\n            Field("cameraMovementIdMulti", "Multi-target camera ID", 0x0A, "H", maximum=65535),\n            Field("targetData", "Target flags", 0x0C),\n            Field("attackEffectId", "Attack effect ID", 0x0D),\n            Field("damageCalculationId", "Damage calculation ID", 0x0E),\n            Field("attackPower", "Attack power", 0x0F),\n            Field("conditionSubmenu", "Condition submenu", 0x10),\n            Field("statusChange", "Status change", 0x11),\n            Field("additionalEffects", "Additional effects", 0x12),\n            Field("additionalEffectsModifier", "Effect modifier", 0x13),\n            Field("statusFlags", "Status flags", 0x14, "I", maximum=0xFFFFFFFF),\n            Field("elementFlags", "Element flags", 0x18, "H", maximum=0xFFFF),\n            Field("specialAttackFlags", "Special attack flags", 0x1A, "H", maximum=0xFFFF),\n        )),\n        Category("items", "Items", 5, 20, 12, 28, (\n'''
          if old in s: s=s.replace(old,new,1)
          elif 'Category("commands", "Commands", 1, 18, 10, 8' not in s: raise SystemExit('kernel insertion point changed')
          p.write_text(s)

          p=Path('games/ff7/semantics.py')
          s=p.read_text()
          old='''CHOCOBO_RATINGS = ((1, "Wonderful"), (2, "Great"), (3, "Good"), (4, "Fair"), (5, "Average"), (6, "Poor"), (7, "Bad"), (8, "Terrible"))\n\nSPECIAL_ATTACK_FLAGS = (\n'''
          new='''CHOCOBO_RATINGS = ((1, "Wonderful"), (2, "Great"), (3, "Good"), (4, "Fair"), (5, "Average"), (6, "Poor"), (7, "Bad"), (8, "Terrible"))\nCOMMAND_ACTIONS = (\n    (0x00, "Perform command using target data"), (0x01, "Magic menu"),\n    (0x02, "Summon menu"), (0x03, "Item menu"), (0x04, "Enemy Skill menu"),\n    (0x05, "Throw menu"), (0x06, "Limit menu"),\n    (0x07, "Enable target selection via cursor"), (0x08, "W-Magic menu"),\n    (0x09, "W-Summon menu"), (0x0A, "W-Item menu"), (0x0B, "Coin menu"),\n    (0xFF, "No initial cursor action"),\n)\n\nSPECIAL_ATTACK_FLAGS = (\n'''
          if old in s: s=s.replace(old,new,1)
          elif 'COMMAND_ACTIONS = (' not in s: raise SystemExit('command choices insertion point changed')
          old='''CORE = {\n    "items": {\n'''
          new='''CORE = {\n    "commands": {\n        "initialCursorAction": _field(label="Command action", dataType="enum", choices=choices(*COMMAND_ACTIONS), group="Command behavior", help="What selecting this battle command does first: perform the command directly, open a submenu such as Magic/Item/Limit, or enter target selection."),\n        "targetData": _field(label="Targeting", dataType="flags", flags=flags(*TARGET_FLAGS), group="Targeting", help="Who a directly executed command can target and how the battle cursor behaves."),\n        "cameraMovementIdSingle": advanced("Single-target camera ID", "Raw battle-camera program ID for single-target use."),\n        "cameraMovementIdMulti": advanced("Multi-target camera ID", "Raw battle-camera program ID for multi-target use."),\n    },\n    "playerAttacks": {\n        "targetData": _field(label="Targeting", dataType="flags", flags=flags(*TARGET_FLAGS), group="Targeting", help="Who this player attack/spell can target and how its battle cursor behaves."),\n        "damageCalculationId": _field(label="Damage / healing formula", dataType="enum", choices=choices(*DAMAGE_FORMULAS), group="Damage", help="Formula, damage type, accuracy behavior and critical capability encoded in the calculation byte."),\n        "conditionSubmenu": _field(label="Condition submenu", dataType="enum", choices=choices(*ATTACK_CONDITIONS), group="Status / condition", help="Conditional submenu mode used by the attack."),\n        "statusChange": _field(label="Status change", dataType="statusChange", group="Status / condition", help="Inflict/cure/swap mode and chance encoded in one byte."),\n        "additionalEffects": _field(label="Additional behavior", dataType="enum", choices=choices(*ADDITIONAL_EFFECTS), group="Extra behavior", help="Hard-coded behavior beyond ordinary damage/status processing."),\n        "additionalEffectsModifier": _field(label="Additional-behavior modifier", group="Extra behavior", help="Parameter used by additional behaviors that require one."),\n        "statusFlags": _field(label="Statuses affected", dataType="flags", flags=flags(*STATUSES), group="Status / condition", help="Statuses affected according to Status change."),\n        "elementFlags": _field(label="Elements", dataType="flags", flags=flags(*ELEMENTS), group="Damage", help="Elemental tags carried by this attack."),\n        "specialAttackFlags": _field(label="Special attack properties", dataType="flags", flags=flags(*SPECIAL_ATTACK_FLAGS), invertBits=True, bitWidth=16, group="Extra behavior", help="Named special properties. KERNEL.BIN stores these bits inverted; the editor presents their logical meaning."),\n        "accuracyRate": _field(label="Accuracy", group="Damage", help="Base accuracy parameter used by formulas that perform an accuracy check."),\n        "mpCost": _field(label="MP cost", group="Cost", help="MP consumed when this attack is used normally."),\n        "attackPower": _field(label="Power", group="Damage", help="Base power consumed by the selected damage/healing formula."),\n        "impactEffectId": advanced("Impact effect ID", "Raw impact visual-effect ID."),\n        "targetHurtActionIndex": advanced("Target hurt action ID", "Raw target reaction/animation index."),\n        "impactSound": advanced("Impact sound ID", "Raw battle sound-effect ID."),\n        "cameraMovementIdSingle": advanced("Single-target camera ID", "Raw battle-camera program ID for single-target use."),\n        "cameraMovementIdMulti": advanced("Multi-target camera ID", "Raw battle-camera program ID for multi-target use."),\n        "attackEffectId": advanced("Attack visual effect ID", "Raw attack-effect program ID."),\n    },\n    "items": {\n'''
          if old in s: s=s.replace(old,new,1)
          elif '"playerAttacks": {' not in s: raise SystemExit('semantic core insertion point changed')
          old='''    "items": "Effect", "weapons": "Combat", "armor": "Defense", "accessories": "Equipment",\n'''
          new='''    "commands": "Command behavior", "playerAttacks": "Attack",\n    "items": "Effect", "weapons": "Combat", "armor": "Defense", "accessories": "Equipment",\n'''
          if old in s: s=s.replace(old,new,1)
          old='''for level in ("11","12","21","22","31","32","4"):\n    CHARACTERS[f"limitAttack{level}"] = advanced(f"Limit {level} attack ID", "Raw global Limit attack index. Kept under Advanced until the plugin exposes the corresponding named attack table.")\n'''
          new='''for level in ("11","12","21","22","31","32","4"):\n    CHARACTERS[f"limitAttack{level}"] = reference("playerAttacks", label=f"Limit {level} attack", help="Player-attack record used by this Limit Break slot.")\n'''
          if old in s: s=s.replace(old,new,1)
          elif 'reference("playerAttacks"' not in s: raise SystemExit('limit reference insertion point changed')
          p.write_text(s)

          p=Path('games/ff7/editor.html')
          s=p.read_text()
          s=s.replace('const integrated=["accessories","armor","characters","items","materia","weapons","enemies","encounters","enemyAttacks","shops","prices","texts","characterNames","growthCurves","growthBonuses","characterAI","enemyAI","formationAI","recruits","defaultNames","fieldEncounters","worldEncounters","yuffieEncounters","chocoboRatings"];','const integrated=["accessories","armor","characters","commands","playerAttacks","items","materia","weapons","enemies","encounters","enemyAttacks","shops","prices","texts","characterNames","growthCurves","growthBonuses","characterAI","enemyAI","formationAI","recruits","defaultNames","fieldEncounters","worldEncounters","yuffieEncounters","chocoboRatings"];',1)
          s=s.replace('const labels={accessories:"Accessories",armor:"Armor",characters:"Characters",items:"Items",materia:"Materia",weapons:"Weapons",enemies:"Enemies",encounters:"Encounters",shops:"Shops",prices:"Prices",texts:"Text",enemyAttacks:"Enemy attacks",tweaks:"Tweaks",','const labels={accessories:"Accessories",armor:"Armor",characters:"Characters",commands:"Commands",playerAttacks:"Player attacks",items:"Items",materia:"Materia",weapons:"Weapons",enemies:"Enemies",encounters:"Encounters",shops:"Shops",prices:"Prices",texts:"Text",enemyAttacks:"Enemy attacks",tweaks:"Tweaks",',1)
          s=s.replace('const groups={characters:["characters","characterNames","growthCurves","growthBonuses","characterAI","recruits","defaultNames"],enemies:["enemies","enemyAttacks","enemyAI"],','const groups={characters:["characters","characterNames","growthCurves","growthBonuses","characterAI","recruits","defaultNames"],commands:["commands","playerAttacks"],enemies:["enemies","enemyAttacks","enemyAI"],',1)
          p.write_text(s)

          p=Path('tools/verify_ff7_datasets.py')
          s=p.read_text()
          s=s.replace('COUNTS = {"items": 128, "weapons": 128, "armor": 32, "accessories": 32, "materia": 96}','COUNTS = {"commands": 32, "playerAttacks": 128, "items": 128, "weapons": 128, "armor": 32, "accessories": 32, "materia": 96}',1)
          s=s.replace('self.assertEqual(sum(map(len, data["records"].values())), 513)','self.assertEqual(sum(map(len, data["records"].values())), 673)',1)
          marker='''    def test_noop_preserves_all_decoded_bytes(self):\n'''
          addition='''    def test_every_core_kernel_field_preserves_all_other_bytes(self):\n        original = Kernel(self.source)\n        for category_key, category in base.CATEGORIES.items():\n            for field in category.fields:\n                with self.subTest(category=category_key, field=field.key):\n                    kernel = Kernel(self.source)\n                    rows = kernel.records(category_key)\n                    value = field.maximum - (field.maximum % field.scale)\n                    rows[0]["values"][field.key] = value\n                    kernel.apply(category_key, rows)\n                    expected = deepcopy(original.sections)\n                    record = expected[category.section - 1][:category.record_size]\n                    base._write_field(record, field, value)\n                    expected[category.section - 1][:category.record_size] = record\n                    self.assertEqual(kernel.sections, expected)\n\n    def test_noop_preserves_all_decoded_bytes(self):\n'''
          if marker in s and 'test_every_core_kernel_field_preserves_all_other_bytes' not in s: s=s.replace(marker,addition,1)
          p.write_text(s)

          p=Path('tools/verify_ff7_semantic_surface.py')
          s=p.read_text()
          old='''        expected={\n            "items":{"targetData":"flags","damageCalculationId":"enum","statusChange":"statusChange","statusFlags":"flags","elementFlags":"flags"},\n'''
          new='''        expected={\n            "commands":{"initialCursorAction":"enum","targetData":"flags"},\n            "playerAttacks":{"targetData":"flags","damageCalculationId":"enum","statusChange":"statusChange","statusFlags":"flags","elementFlags":"flags","specialAttackFlags":"flags"},\n            "items":{"targetData":"flags","damageCalculationId":"enum","statusChange":"statusChange","statusFlags":"flags","elementFlags":"flags"},\n'''
          if old in s: s=s.replace(old,new,1)
          marker='''        self.assertEqual(next(c for c in meta["characters"]["rowByte"]["choices"] if c["label"]=="Front row")["value"],0xFF)'''
          replacement=marker+'''\n        self.assertEqual(meta["characters"]["limitAttack11"]["referenceCategory"],"playerAttacks")\n        self.assertTrue(meta["playerAttacks"]["specialAttackFlags"]["invertBits"])'''
          if marker in s and 'limitAttack11' not in s: s=s.replace(marker,replacement,1)
          p.write_text(s)
          PY
      - name: Run FF7 binary and semantic regressions
        run: |
          python tools/verify_ff7_datasets.py
          python tools/verify_ff7_accessories.py
          python tools/verify_ff7_semantic_surface.py
          python tools/verify_ff7_extended.py
          python tools/verify_ff7_completion.py
          python tools/verify_ff7_materia_semantics.py
      - name: Commit implementation to the PR branch
        shell: bash
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add games/ff7/kernel.py games/ff7/semantics.py games/ff7/editor.html tools/verify_ff7_datasets.py tools/verify_ff7_semantic_surface.py
          git commit -m "Expose FF7 commands and player attacks"
          git push origin HEAD:work/ff7-complete-kernel-surface
