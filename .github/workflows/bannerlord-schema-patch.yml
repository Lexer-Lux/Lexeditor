name: Bannerlord schema hardening patch

on:
  push:
    branches: [feature/bannerlord-plugin]
    paths:
      - '.github/workflows/bannerlord-schema-patch.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/bannerlord-plugin
      - name: Apply schema/editor patch
        run: python tools/_bannerlord_schema_patch.py
      - name: Syntax checks
        run: |
          python -m py_compile games/bannerlord/module_data.py
          node --check games/bannerlord/editor_core.js
          node --check games/bannerlord/editor_build.js
      - name: Commit patch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add games/bannerlord/module_data.py games/bannerlord/editor_core.js games/bannerlord/editor_build.js
          git commit -m "Harden Bannerlord schema-backed editing"
          git push origin HEAD:feature/bannerlord-plugin
