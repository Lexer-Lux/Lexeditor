name: FFX-X2 master sync

on:
  push:
    branches: [feature/ffx-x2-plugin]
    paths:
      - '.github/workflows/ffx-x2-sync-master.yml'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Merge current master and resolve owned overlaps
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin master
          set +e
          git merge --no-commit --no-ff origin/master
          merge_status=$?
          set -e
          if [ "$merge_status" -ne 0 ]; then
            python - <<'PY'
          import json
          from pathlib import Path
          import subprocess

          def stage(number: int, path: str) -> str:
              return subprocess.check_output(
                  ["git", "show", f":{number}:{path}"], text=True, encoding="utf-8"
              )

          # Keep current master methodology, then reapply the FFX/X-2 theme guidance
          # introduced by this PR. Stage 2 is the PR side; stage 3 is master.
          docs_path = "docs/ADDING_A_GAME.md"
          ours_docs = stage(2, docs_path)
          master_docs = stage(3, docs_path)
          heading = "### Derive the plugin theme from the installed game when feasible"
          credits_marker = "Credits and Mod Loading are shared Info-page sections"
          if heading not in master_docs:
              start = ours_docs.index(heading)
              end = ours_docs.index(credits_marker, start)
              theme_section = ours_docs[start:end]
              master_docs = master_docs.replace(credits_marker, theme_section + credits_marker, 1)
          Path(docs_path).write_text(master_docs, encoding="utf-8")

          # Keep master runtime ownership/lifetime changes and register the FFX/X-2
          # child service alongside the newer Chrono Trigger and Palworld services.
          runtime_path = "runtime_bootstrap.py"
          runtime = stage(3, runtime_path)
          if "'games.ffx_x2.server'" not in runtime:
              needle = "'games.ff9.server',"
              if needle not in runtime:
                  raise RuntimeError("runtime_bootstrap service list changed unexpectedly")
              runtime = runtime.replace(needle, needle + " 'games.ffx_x2.server',", 1)
          Path(runtime_path).write_text(runtime, encoding="utf-8")

          # Master already contains the equivalent live-row RDR geometry guard, so
          # retain its newer browser acceptance implementation wholesale.
          rdr_path = "tests/rdr_browser_check.py"
          Path(rdr_path).write_text(stage(3, rdr_path), encoding="utf-8")

          # These registries are keyed by plugin id. Preserve every current master
          # plugin, then add exactly this PR's FFX/X-2 entry.
          for path in ("ui/credits-sources.json", "ui/mod-loading.json"):
              ours = json.loads(stage(2, path))
              merged = json.loads(stage(3, path))
              merged["plugins"]["ffx-x2"] = ours["plugins"]["ffx-x2"]
              Path(path).write_text(
                  json.dumps(merged, ensure_ascii=False, indent=2) + "\n", encoding="utf-8"
              )
          PY
            git add docs/ADDING_A_GAME.md runtime_bootstrap.py tests/rdr_browser_check.py \
              ui/credits-sources.json ui/mod-loading.json
            python tools/generate_credits.py
            git add ui/credits.json
          fi
          unresolved="$(git diff --name-only --diff-filter=U)"
          if [ -n "$unresolved" ]; then
            echo "Unresolved merge paths:"
            echo "$unresolved"
            exit 1
          fi
          git diff --check
          python tools/generate_credits.py --check
          python plugin_metadata.py
          git status --short
          git commit -m "Merge master into FFX-X2 plugin"
          git push origin HEAD:feature/ffx-x2-plugin
