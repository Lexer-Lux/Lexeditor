name: Temporary Bannerlord legacy save browser coverage

on:
  push:
    branches: [feature/bannerlord-plugin]
    paths:
      - '.github/workflows/temp-bannerlord-legacy-save-browser.yml'

permissions:
  contents: write

jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/bannerlord-plugin
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Add rendered baseline-save coverage and refresh memory
        run: python tools/temp_bannerlord_legacy_save_browser.py
      - run: python -m pip install playwright
      - run: python -m playwright install --with-deps chromium
      - run: python tests/bannerlord_browser_check.py out/bannerlord-legacy-save
      - name: Commit tested coverage and remove temporary files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/bannerlord_browser_check.py codex/bannerlord/project-memory.md
          git rm .github/workflows/temp-bannerlord-legacy-save-browser.yml tools/temp_bannerlord_legacy_save_browser.py
          git commit -m "Test Bannerlord legacy baseline save flow"
          git push origin HEAD:feature/bannerlord-plugin
