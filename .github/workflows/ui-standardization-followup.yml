name: UI standardization follow-up

on:
  push:
    branches: [fix/ui-standardization-20260906]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/ui-standardization-20260906
          fetch-depth: 0
      - name: Fix matcher and apply follow-up
        run: |
          python - <<'PY'
          from pathlib import Path
          path=Path('.github/scripts/ui_standardization_followup.py')
          text=path.read_text(encoding='utf-8')
          old='''    const field = label.parentElement;\\n    const input = field?.querySelector('.lex-detail-field-control input[type="checkbox"]');\\n'''
          new='''    const input = label.parentElement?.querySelector('.lex-detail-field-control input[type="checkbox"]');\\n'''
          if old not in text:
              raise SystemExit('follow-up matcher repair anchor missing')
          path.write_text(text.replace(old,new,1),encoding='utf-8')
          PY
          python .github/scripts/ui_standardization_followup.py
      - name: Validate
        run: |
          node --check ui/framework.js
          grep -q 'lex-reference-ll' ui/framework.js
          grep -q 'enabledColumn(null)' ui/framework.js
          grep -q 'Developer Mode requires' desktop_host.py
      - name: Commit
        run: |
          git rm -f .github/workflows/ui-standardization-followup.yml .github/scripts/ui_standardization_followup.py
          git config user.name 'Lexeditor UI maintenance'
          git config user.email '89482099+Lexer-Lux@users.noreply.github.com'
          git add -A
          git commit -m 'Finish shared UI interaction fixes'
          git push origin HEAD:fix/ui-standardization-20260906
