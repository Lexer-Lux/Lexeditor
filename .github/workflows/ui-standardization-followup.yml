name: UI standardization follow-up

on:
  push:
    branches: [fix/ui-standardization-20260906]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/ui-standardization-20260906
          fetch-depth: 0
      - name: Apply follow-up
        run: python .github/scripts/ui_standardization_followup.py
      - name: Validate
        run: |
          node --check ui/framework.js
          grep -q 'lex-reference-ll' ui/framework.js
          grep -q 'enabledColumn(null)' ui/framework.js
          grep -q 'Developer Mode requires' desktop_host.py
      - name: Commit
        run: |
          git rm -f .github/workflows/ui-standardization-followup.yml .github/scripts/ui_standardization_followup.py
          git config user.name 'Lexeditor UI maintenance'
          git config user.email '89482099+Lexer-Lux@users.noreply.github.com'
          git add -A
          git commit -m 'Finish shared UI interaction fixes'
          git push origin HEAD:fix/ui-standardization-20260906
