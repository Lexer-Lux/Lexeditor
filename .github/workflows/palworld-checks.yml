name: Palworld checks

on:
  pull_request:
    paths:
      - 'games/palworld/**'
      - 'codex/palworld/**'
      - 'tests/test_palworld_*.py'
      - 'runtime_bootstrap.py'
      - 'ui/mod-loading.json'
      - 'ui/credits-sources.json'
      - 'ui/credits.json'
      - '.github/workflows/palworld-checks.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package-tests:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile Palworld modules
        run: python -m compileall -q games/palworld
      - name: Run Palworld package regressions
        run: python -m unittest discover -s tests -p 'test_palworld_*.py' -v

  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Lexeditor runtime dependencies
        run: python -m pip install -r requirements.txt
      - name: Record PalSchema metadata sources
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          credits_path = Path('ui/credits-sources.json')
          credits = json.loads(credits_path.read_text(encoding='utf-8'))
          pal = credits['plugins']['palworld']
          contribution = {
              'name': 'Okaetsu / PalSchema',
              'role': 'Reference for PalSchema raw DataTable patch structure, JSONC parsing, wildcard/filter behavior and targeted field application.',
              'url': 'https://github.com/Okaetsu/PalSchema',
          }
          if not any(row.get('name') == contribution['name'] for row in pal.get('contributions', [])):
              pal.setdefault('contributions', []).append(contribution)
          notice = {
              'name': 'Palworld / PalSchema references — source and license notes',
              'sourcePath': 'games/palworld/THIRD_PARTY.md',
          }
          pal['licenses'] = [notice]
          credits_path.write_text(json.dumps(credits, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          loading_path = Path('ui/mod-loading.json')
          loading = json.loads(loading_path.read_text(encoding='utf-8'))
          loading['plugins']['palworld'] = {
              'loader': "Pocketpair's official Palworld v0.7+ mod loader and Steam Workshop package model. PalSchema raw-table projects run through the package's Type=PalSchema rule; Lexeditor authors compatible patches but does not install or replace PalSchema/UE4SS.",
              'structure': "One selected Lexeditor project is an official package rooted at Info.json. PalSchema targets contain per-mod raw/*.json[c] patches beneath the package target; installed Palworld game data remains read-only.",
              'overriding': "The official loader enables packages by PackageName. PalSchema raw patches apply named DataTable row/property values rather than whole assets, so non-overlapping fields can coexist; when multiple patches target the same field, Lexeditor does not claim or impose a separate conflict winner beyond PalSchema's runtime order.",
          }
          loading_path.write_text(json.dumps(loading, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY
      - name: Regenerate offline credits
        run: python tools/generate_credits.py
      - name: Verify plugin metadata and shared UI contracts
        run: |
          python plugin_metadata.py
          python tools/verify_shared_ui_contract.py
      - name: Verify discovery and managed service
        run: |
          python app.py --list
          python app.py --game palworld --check
          python app.py --game palworld --smoke
      - name: Check editor JavaScript syntax
        run: node --check games/palworld/editor.js
      - name: Commit reviewed metadata bundle
        shell: bash
        run: |
          if git diff --quiet -- ui/credits-sources.json ui/credits.json ui/mod-loading.json; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ui/credits-sources.json ui/credits.json ui/mod-loading.json
          git commit -m 'Document PalSchema plugin metadata'
          git push origin HEAD:feature/palworld-plugin
