name: Palworld checks

on:
  pull_request:
    paths:
      - 'games/palworld/**'
      - 'codex/palworld/**'
      - 'tests/test_palworld_*.py'
      - 'runtime_bootstrap.py'
      - 'ui/mod-loading.json'
      - 'ui/credits-sources.json'
      - 'ui/credits.json'
      - '.github/workflows/palworld-checks.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package-tests:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile Palworld modules
        run: python -m compileall -q games/palworld
      - name: Run Palworld package regressions
        run: python -m unittest discover -s tests -p 'test_palworld_*.py' -v

  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Lexeditor runtime dependencies
        run: python -m pip install -r requirements.txt
      - name: Regenerate offline credits for this head
        run: python tools/generate_credits.py
      - name: Verify plugin metadata and shared UI contracts
        run: |
          python plugin_metadata.py
          python tools/verify_shared_ui_contract.py
      - name: Verify discovery and managed service
        run: |
          python app.py --list
          python app.py --game palworld --check
          python app.py --game palworld --smoke
      - name: Check editor JavaScript syntax
        run: node --check games/palworld/editor.js
      - name: Commit generated offline credits
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        env:
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          if git diff --quiet -- ui/credits.json; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ui/credits.json
          git commit -m "Regenerate offline credits for Palworld"
          git push origin "HEAD:${HEAD_BRANCH}"
