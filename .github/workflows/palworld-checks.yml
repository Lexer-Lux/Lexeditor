name: Palworld checks

on:
  pull_request:
    paths:
      - 'games/palworld/**'
      - 'codex/palworld/**'
      - 'tests/test_palworld_*.py'
      - '.github/workflows/palworld-checks.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package-tests:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile Palworld modules
        run: python -m compileall -q games/palworld
      - name: Run Palworld package regressions
        run: python -m unittest discover -s tests -p 'test_palworld_*.py' -v
