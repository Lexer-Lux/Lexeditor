name: RDR2 checks
on:
  push:
    branches: [master]
    paths: ['games/rdr2/**', 'tests/test_rdr2*', '.github/workflows/rdr2-checks.yml']
  pull_request:
    paths: ['games/rdr2/**', 'tests/test_rdr2*', '.github/workflows/rdr2-checks.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  editor-regressions:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out the public revision without initializing optional gitlinks
        run: |
          git init .
          git -c protocol.version=2 fetch --depth=1 "https://github.com/${GITHUB_REPOSITORY}.git" "$GITHUB_SHA"
          git checkout --detach FETCH_HEAD
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify casing transactions, cache invalidation, and alcohol saves
        run: python tests/test_rdr2_issue_repairs.py
      - name: Execute production boot and dataset-switch regressions
        run: node tests/test_rdr2_boot.js
      - name: Check RDR2 Python syntax
        run: python -m compileall -q games/rdr2
