name: Integrate Terraria build diagnostics

on:
  push:
    branches: [feature/terraria-plugin]
    paths:
      - '.github/workflows/terraria-build-diagnostics-patch.yml'

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Wire structured build diagnostics
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              target = Path(path)
              text = target.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected one anchor, found {count}: {old[:100]!r}')
              target.write_text(text.replace(old, new, 1), encoding='utf-8')

          replace_once(
              'games/terraria/server.py',
              'from .build_metadata import BOOLEAN_KEYS, parse_build_text, update_build_text\n',
              'from .build_metadata import BOOLEAN_KEYS, parse_build_text, update_build_text\nfrom .build_diagnostics import parse_build_diagnostics\n',
          )
          replace_once(
              'games/terraria/server.py',
              '            state = _result_local_state(project)\n            ok = completed.returncode == 0 and state["artifactExists"]\n',
              '            state = _result_local_state(project)\n            diagnostics = parse_build_diagnostics(stdout + "\\n" + stderr, project)\n            ok = completed.returncode == 0 and state["artifactExists"]\n',
          )
          replace_once(
              'games/terraria/server.py',
              '                **state,\n                "stdout": stdout,\n',
              '                **state,\n                "diagnostics": diagnostics,\n                "stdout": stdout,\n',
          )
          replace_once(
              'games/terraria/server.py',
              '        except subprocess.TimeoutExpired as error:\n            return {\n',
              '        except subprocess.TimeoutExpired as error:\n            timeout_stdout = _trim_output(error.stdout)\n            timeout_stderr = _trim_output(error.stderr)\n            return {\n',
          )
          replace_once(
              'games/terraria/server.py',
              '                **_result_local_state(project),\n                "stdout": _trim_output(error.stdout),\n                "stderr": _trim_output(error.stderr),\n',
              '                **_result_local_state(project),\n                "diagnostics": parse_build_diagnostics(timeout_stdout + "\\n" + timeout_stderr, project),\n                "stdout": timeout_stdout,\n                "stderr": timeout_stderr,\n',
          )

          # UI state + diagnostics rendering/navigation.
          replace_once(
              'games/terraria/editor.html',
              '  let sourceFiles=[],sourceSaved=null,sourceCurrent=null,sourceLoading=false,sourceNewPath="";\n',
              '  let sourceFiles=[],sourceSaved=null,sourceCurrent=null,sourceLoading=false,sourceNewPath="",sourceGotoLine=0;\n',
          )
          diagnostic_fn = r'''  async function openBuildDiagnostic(diagnostic){
    if(!diagnostic?.projectFile)return;
    try{
      const state=await request(`/api/source/file?path=${encodeURIComponent(diagnostic.path)}`);
      sourceSaved=clone(state);sourceCurrent=clone(state);sourceGotoLine=Math.max(1,Number(diagnostic.line)||1);tab="source";error="";render();
    }catch(exc){error=String(exc.message||exc);render()}
  }
'''
          replace_once(
              'games/terraria/editor.html',
              '  function buildCard(){\n',
              diagnostic_fn + '  function buildCard(){\n',
          )
          diagnostic_block = r'''      const diagnostics=Array.isArray(buildResult.diagnostics)?buildResult.diagnostics:[];
      if(diagnostics.length){
        const diagnosticRows=diagnostics.map(row=>el("tr",{},
          el("td",{},el("span",{class:"terraria-status"},row.severity)),
          el("td",{},row.projectFile?el("button",{class:"terraria-build-button",type:"button",onclick:()=>openBuildDiagnostic(row)},`${row.path}:${row.line}:${row.column}`):`${row.path}:${row.line}:${row.column}`),
          el("td",{},row.code),el("td",{},row.message)));
        card.append(el("table",{class:"terraria-map"},el("thead",{},el("tr",{},...["SEVERITY","LOCATION","CODE","MESSAGE"].map(label=>el("th",{},label)))),el("tbody",{},...diagnosticRows)));
      }
'''
          replace_once(
              'games/terraria/editor.html',
              '      if(success&&buildResult.enabledStateValid&&!buildResult.enabled)card.append(el("div",{},"The package was built, but enabled.json does not currently list this mod as enabled."));\n      const log=[',
              '      if(success&&buildResult.enabledStateValid&&!buildResult.enabled)card.append(el("div",{},"The package was built, but enabled.json does not currently list this mod as enabled."));\n'
              + diagnostic_block + '      const log=[',
          )
          replace_once(
              'games/terraria/editor.html',
              '    const editor=el("textarea",{class:"terraria-source-editor",spellcheck:false,value:sourceCurrent.text,oninput:event=>{sourceCurrent.text=event.target.value;shell?.refresh?.()},onkeydown:event=>{if(event.key!=="Tab")return;event.preventDefault();const target=event.target,start=target.selectionStart,end=target.selectionEnd;target.setRangeText("\\t",start,end,"end");sourceCurrent.text=target.value;shell?.refresh?.()}});\n    return el("div",{class:"terraria-page"},',
              '    const editor=el("textarea",{class:"terraria-source-editor",spellcheck:false,value:sourceCurrent.text,oninput:event=>{sourceCurrent.text=event.target.value;shell?.refresh?.()},onkeydown:event=>{if(event.key!=="Tab")return;event.preventDefault();const target=event.target,start=target.selectionStart,end=target.selectionEnd;target.setRangeText("\\t",start,end,"end");sourceCurrent.text=target.value;shell?.refresh?.()}});\n'
              '    if(sourceGotoLine){const line=sourceGotoLine;sourceGotoLine=0;setTimeout(()=>{const lines=editor.value.split("\\n");let start=0;for(let i=1;i<line&&i<=lines.length;i++)start+=lines[i-1].length+1;const end=start+(lines[Math.min(line-1,lines.length-1)]||"").length;editor.focus();editor.setSelectionRange(start,end);editor.scrollTop=Math.max(0,(line-5)*20)},0)}\n'
              '    return el("div",{class:"terraria-page"},',
          )

          docs = '''### Build diagnostics\n\nLexeditor parses standard C#/MSBuild `file.cs(line,column): error|warning CODE: message` output returned by the native tModLoader build. Diagnostics inside the selected project are normalized to project-relative paths and surfaced separately from the raw log. The build panel can open a project diagnostic directly in the Source tab and select the reported line. Unknown/non-project diagnostics remain visible but non-navigable. Raw stdout/stderr are still retained because tModLoader can emit useful non-compiler diagnostics that do not follow MSBuild's compiler format.\n\n'''
          replace_once(
              'codex/terraria/README.md',
              '## Local package and enabled state\n',
              docs + '## Local package and enabled state\n',
          )
          PY
          git diff --check
          python -m compileall -q games/terraria plugin_api.py project_manager.py
          python -m unittest discover -s tests -p 'test_terraria_*.py'
          python - <<'PY'
          from pathlib import Path
          html = Path('games/terraria/editor.html').read_text(encoding='utf-8')
          Path('/tmp/terraria-editor.js').write_text(html.split('<script>')[-1].split('</script>',1)[0], encoding='utf-8')
          PY
          node --check /tmp/terraria-editor.js
      - name: Commit integrated diagnostics
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/terraria-build-diagnostics-patch.yml
          git add games/terraria/server.py games/terraria/editor.html codex/terraria/README.md
          git commit -m 'Wire Terraria build diagnostics'
          git push origin HEAD:feature/terraria-plugin
