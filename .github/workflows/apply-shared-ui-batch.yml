/* ---- 2026-09-06 shared UI follow-up ------------------------------ */
/* Detail labels are exactly one tenth of the pane. Their text wraps and is
   auto-fitted by framework.js; rows never grow just because a name is long. */
.lex-detail-panel { --lex-detail-label-width:10% !important; position:relative; overflow:hidden; }
.lex-detail-field { grid-template-columns:minmax(0,var(--lex-detail-label-width)) minmax(0,1fr) !important; }
.lex-detail-field-label { display:grid !important; grid-template-columns:minmax(18px,.34fr) minmax(0,.66fr); align-items:center; min-width:0; height:100%; overflow:hidden; padding:0 3px; }
.lex-detail-field-label > .lex-info-help { grid-column:1; grid-row:1; justify-self:center; align-self:center; }
.lex-detail-field-label-text { grid-column:2; grid-row:1; display:grid; width:100%; height:100%; min-width:0; place-items:center; overflow:hidden; white-space:normal; overflow-wrap:anywhere; text-align:center; line-height:1.02; }
.lex-field-boolean-arrow { grid-column:2; grid-row:1; justify-self:end; align-self:center; position:static !important; transform:none !important; }
.lex-detail-field[data-lex-sort] .lex-detail-field-label,
.lex-detail-field[data-lex-sort] .lex-detail-field-label-text,
.lex-detail-field[data-lex-sort] .lex-info-help { visibility:visible !important; opacity:1 !important; display:grid !important; }
.lex-detail-field[data-lex-sort] .lex-field-type-rail > :is(.lex-field-type-name,.lex-field-type-range) { opacity:0 !important; }

/* Info bubble: both the circle and ? glyph use true geometric centring. */
.lex-info-help { display:grid !important; place-items:center !important; padding:0 !important; line-height:1 !important; text-align:center !important; }
.lex-info-help > span { display:grid; width:100%; height:100%; place-items:center; line-height:1; transform:translateY(-.015em); }

/* Grouped booleans are ordinary horizontal tiles. The parent property is the
   FLAGS type; individual flags do not grow their own sideways type rails. */
.lex-toggle-rail,.lex-toggle-type { display:none !important; }
.lex-toggle-row { grid-auto-rows:minmax(30px,1fr); }
.lex-toggle { position:relative; min-height:30px; overflow:hidden; }
.lex-toggle-name { display:grid; align-items:center; min-width:0; height:100%; overflow:hidden; white-space:normal; overflow-wrap:anywhere; text-overflow:clip; line-height:1.02; }
.lex-toggle > .lex-info-help { margin-left:auto; }

/* A boolean's ref rail lives immediately beneath the checkbox but still has a
   little bottom breathing room. It does not hover six pixels away from it. */
.lex-boolean-field .lex-detail-field-control > .lex-source-control { grid-template-rows:minmax(18px,1fr) auto; align-items:center; height:100%; padding:2px 0 3px; }
.lex-boolean-field .lex-source-control > :not(.lex-reference-values):not(.lex-reference-placeholder) { grid-row:1; }
.lex-boolean-field .lex-source-control > .lex-reference-values,
.lex-boolean-field .lex-source-control > .lex-reference-placeholder { position:static !important; grid-row:2; top:auto !important; left:auto !important; right:auto !important; bottom:auto !important; translate:none !important; margin:1px 0 2px; padding:0; line-height:1; }
.lex-reference-value.lex-reference-ll,.lex-reference-value.lex-reference-ll .lex-reference-tag { color:#7CFC00 !important; }
.lex-reference-value.lex-reference-ll { border-color:color-mix(in srgb,#7CFC00 60%,var(--lex-border)); }

/* Property/column highlighting is bidirectional and still visible when there
   is no counterpart on the other pane. */
.lex-detail-field:hover,.lex-detail-field.lex-column-lit { background:color-mix(in srgb,var(--lex-highlight) 14%,transparent) !important; }
.lex-column-list-head-cell:hover,.lex-column-list-cell:hover,
.lex-column-list-head-cell.lex-column-lit,.lex-column-list-cell.lex-column-lit { background:color-mix(in srgb,var(--lex-highlight) 16%,transparent) !important; }

/* Inline edit preserves the table's exact geometry and typography. */
.lex-column-list-cell.lex-cell-editing { box-shadow:none !important; overflow:hidden; }
.lex-column-list-cell.lex-cell-editing .lex-column-cell-content { display:block; width:100%; height:100%; min-width:0; }
.lex-column-list-cell.lex-cell-editing .lex-column-cell-content > :is(input,select,textarea) { box-sizing:border-box; width:100% !important; height:100% !important; min-width:0 !important; margin:0 !important; padding:inherit !important; color:inherit !important; border:0 !important; border-radius:0 !important; outline:0 !important; background:transparent !important; box-shadow:none !important; font:inherit !important; line-height:inherit !important; text-align:inherit !important; }

/* Bounded-value fill is clipped to the actual input box, never the whole
   property control. */
.lex-value-box { position:relative; display:block; box-sizing:border-box; width:100%; min-width:0; height:100%; overflow:hidden; }
.lex-value-box > input { position:relative; z-index:1; box-sizing:border-box; width:100%; height:100%; background:transparent !important; }
.lex-value-box > .lex-value-fill { position:absolute; inset:0; overflow:hidden; border-radius:inherit; }
.lex-detail-field-control { overflow:visible; }
.lex-has-value-fill > .lex-detail-field-control { overflow:hidden; }

/* Reset feedback is an overlay. It fades to transparency, revealing whatever
   background is correct at that instant (hovered, highlighted, or normal). */
.lex-detail-field::after { content:""; position:absolute; inset:0; z-index:12; background:var(--lex-accent); opacity:0; pointer-events:none; }
.lex-detail-field.lex-reset-flash::after { animation:lex-reset-flash .55s ease-out; }
@keyframes lex-reset-flash { from { opacity:.9; } to { opacity:0; } }

/* Standard model-preview drawer. The header icon is the open control and the
   close X occupies exactly that same icon slot. */
.lex-detail-panel-icon.lex-model-preview-trigger { position:relative; cursor:pointer; user-select:none; }
.lex-detail-panel-icon.lex-model-preview-trigger:focus-visible { outline:2px solid var(--lex-highlight); outline-offset:-2px; }
.lex-detail-panel-icon-content { display:grid; width:100%; height:100%; place-items:center; }
.lex-model-preview-close { position:absolute; inset:0; display:grid; place-items:center; opacity:0; font:700 clamp(20px,2em,34px)/1 var(--lex-symbol-font); pointer-events:none; }
.lex-model-preview-open .lex-detail-panel-icon-content { opacity:0; }
.lex-model-preview-open .lex-model-preview-close { opacity:1; }
.lex-model-preview-drawer { position:absolute; z-index:20; top:10%; right:0; bottom:0; left:0; min-width:0; min-height:0; padding:var(--lex-panel-gap); overflow:auto; border-top:1px solid var(--lex-border); background:var(--lex-panel); transform:translateX(-102%); opacity:0; pointer-events:none; transition:transform .22s ease,opacity .18s ease; }
.lex-model-preview-open .lex-model-preview-drawer { transform:translateX(0); opacity:1; pointer-events:auto; }
.warband-model-preview { display:flex; flex-direction:column; width:100%; height:100%; min-height:0; }

/* Project states use an explicit mark and a desaturation veil. */
.lex-project-menu-item.disabled,.lex-project-reference.disabled { position:relative; filter:grayscale(1); opacity:.62; }
.lex-project-menu-item.disabled::after,.lex-project-reference.disabled::after { content:""; position:absolute; inset:0; z-index:5; background:color-mix(in srgb,var(--lex-panel) 40%,transparent); pointer-events:none; }
.lex-project-menu-item-select > .lex-project-source-mode,
.lex-project-menu-item-select > .lex-project-source-status { flex:0 0 auto; }

/* Graph standard: natural text, large title, real margins and a top drawer. */
.lex-curve-editor { position:relative; overflow:hidden; grid-template-areas:"heading" "plot" "formula" "status" !important; grid-template-rows:auto auto auto auto !important; }
.lex-curve-heading { min-height:42px; }
.lex-curve-heading-title { font-size:clamp(24px,2.1vw,36px) !important; line-height:1 !important; text-transform:uppercase !important; }
.lex-curve-path-formula { display:none !important; }
.lex-curve-formula { display:block !important; min-height:2.2em; padding:6px 8px; white-space:normal; overflow-wrap:anywhere; }
.lex-curve-variable-toggle { margin-left:auto; padding:4px 8px; color:var(--lex-text); border:1px solid var(--lex-border); border-radius:var(--lex-radius); background:var(--lex-panel-2); font:700 .72em/1 var(--lex-font); cursor:pointer; }
.lex-curve-variables { position:absolute !important; z-index:15; top:42px; right:0; left:0; width:auto !important; padding:9px 10px !important; border-block:1px solid var(--lex-border); background:var(--lex-panel-2) !important; box-shadow:0 5px 14px #0004; transform:translateY(calc(-100% - 44px)); opacity:0 !important; pointer-events:none !important; transition:transform .2s ease,opacity .16s ease; }
.lex-curve-editor.lex-curve-variables-open .lex-curve-variables { transform:translateY(0); opacity:1 !important; pointer-events:auto !important; }
.lex-curve-plot { --lex-curve-margin:42px; --lex-curve-margin-left:42px; --lex-curve-margin-right:54px; --lex-curve-margin-top:18px; --lex-curve-margin-bottom:40px; padding:0 !important; aspect-ratio:2/1 !important; }
.lex-curve-plot > .lex-curve-svg { top:var(--lex-curve-margin-top) !important; left:var(--lex-curve-margin-left) !important; width:calc(100% - var(--lex-curve-margin-left) - var(--lex-curve-margin-right)) !important; height:calc(100% - var(--lex-curve-margin-top) - var(--lex-curve-margin-bottom)) !important; }
.lex-curve-axis-start { bottom:10px !important; left:var(--lex-curve-margin-left) !important; transform:translateX(-50%) !important; }
.lex-curve-axis-end { bottom:10px !important; right:var(--lex-curve-margin-right) !important; left:auto !important; transform:translateX(50%) !important; }
.lex-curve-axis-name-x { bottom:7px !important; left:50% !important; transform:translateX(-50%) !important; }
.lex-curve-axis-name-y { top:50% !important; right:7px !important; left:auto !important; writing-mode:horizontal-tb !important; transform:translateY(-50%) rotate(-90deg) !important; transform-origin:center; }
.lex-curve-axis-top { top:var(--lex-curve-margin-top) !important; right:15px !important; left:auto !important; transform:translate(50%,-50%) rotate(-90deg) !important; transform-origin:center; }
.lex-curve-axis-bottom { bottom:var(--lex-curve-margin-bottom) !important; right:15px !important; left:auto !important; transform:translate(50%,50%) rotate(-90deg) !important; transform-origin:center; }
.lex-curve-plot::before,.lex-curve-plot::after { content:none !important; display:none !important; }

/* A growable paged view owns the pane height even on a short last page. */
.lex-paged-list-detail,.lex-barrelled-master,.lex-barrel-grid { min-height:0; height:100%; }
.lex-full-table-page > .lex-panel-layout-pane { min-height:0; }

/* There is one shortcut badge implementation. */
.lex-tab-ordinal { display:none !important; }
'''
              css_path.write_text(css, encoding="utf-8", newline="\n")

          # -----------------------------------------------------------------
          # Manual + source layout cleanup.
          # -----------------------------------------------------------------
          manual_path = Path("docs/UI-MANUAL.md")
          manual = manual_path.read_text(encoding="utf-8")
          manual = manual.replace("reference rail", "ref rail").replace("Reference rail", "Ref rail")
          manual = manual.replace("filled circular `?`", "filled circular **info bubble** (`?`)")
          # Broad human-readable representation rule replaces the narrower 0/1 rule.
          manual = re.sub(
              r'A value with only two valid states is a boolean control\..*?(?=\n\n)',
              'Every stored variable must be presented in the most human-friendly control available, not in its raw storage encoding. Booleans are normally checkboxes or compact checkless toggles, never numeric 0/1 fields. Bitfields and flag bytes are decomposed into one property made from named checkboxes, enums, and other meaningful controls; raw bytes or integers are only acceptable when no more legible representation exists.',
              manual, count=1, flags=re.S)
          # Replace the old Settings-scopes section wholesale when present.
          manual = re.sub(
              r'### Settings scopes\n.*?(?=\n### |\n## |\Z)',
              '''### Developer Mode and packaged defaults\n\nDeveloper Mode is not a preference or a separate Lexer Mode. It activates automatically when the authorized `Lexer-Lux` GitHub account is the active GitHub CLI login. Developer-only controls (GitHub issues, Restart, shipped-view/default authoring) appear only in that state. There is no `I am Lexer` toggle.\n\nPackaged defaults remain explicitly authored values. Developer Mode may copy a current setting or current view into those defaults, but ordinary users only edit their own local settings.\n''',
              manual, count=1, flags=re.S)
          additions = '''\n\n## Shared interaction standards\n\n### Human-friendly variable controls\n\nThe editor displays the *meaning* of a value rather than its serialization. Use checkboxes for ordinary booleans and **checkless toggles** when the surrounding control already supplies an unambiguous on/off state. Split bitflags into named checkbox/enum controls inside one property. Do not expose 0/1, bit masks, bytes, or packed integers when a safer semantic control can represent them.\n\n### Info bubbles and ref rails\n\nThe circular `?` is the **info bubble**. It is geometrically centered in its circle and occupies the shared label/ref area without displacing the property name. The **ref rail** is the stable comparison lane for Vanilla and reference mods. Vanilla is `V`; Lexer's mod is always `LL` and lime green. Ref rails reserve their space even when the current value matches, so editing cannot move the live control.\n\n### Model preview drawer\n\nA model-capable Detail uses the shared `modelPreview` slot. The header icon is the preview button. Clicking it slides the preview drawer out over the Detail body; while open, an `×` occupies exactly the same icon slot and closes the drawer. Plugins provide model data/rendering only. They do not create a second preview-panel interaction.\n\n### Table editing and property linking\n\nThere is one Table type. Any cell whose column declares an editor is editable by double-click in place; entering edit mode must not change the cell font, row height, column width, padding, or overall geometry. A separate “Editable Table” type is forbidden. Hovering a column highlights its matching Detail property and hovering the property highlights the column. A hovered column/property also highlights itself when no counterpart exists.\n\n### Detail labels\n\nThe Detail property-name region is 10% of the panel. Property names and labels inside grouped boolean boxes may wrap and automatically reduce type size to fit their existing box, but they must not increase the row height. Sorting indicators never replace or hide the property name or info bubble.\n\n### Graphs\n\nGraph titles are large and uppercase. There is one title only. Axis names and numeric range labels live in the graph margins; every right-axis text element, including range numbers, is rotated 90° counter-clockwise. Formula text uses natural glyph proportions and is never stretched or squashed to follow the curve. Variable controls live in a drawer that slides in from the top.\n'''
          if "## Shared interaction standards" not in manual:
              manual += additions
          # Remove legacy visible mode terminology even if an older paragraph survived.
          manual = manual.replace("Lexer Mode", "Developer Mode").replace("Lexer mode", "Developer Mode").replace("I am Lexer", "authorized GitHub identity")
          manual_path.write_text(manual, encoding="utf-8", newline="\n")

          adding = Path("docs/ADDING_A_GAME.md")
          adding_text = adding.read_text(encoding="utf-8")
          shared_rule = '''\n\n## Shared UI primitives are mandatory\n\nBlank is the reference gallery for shared behavior, not a separate implementation. New plugins must compose Tables, Detail panels/fields, ref rails, info bubbles, model-preview drawers, graph editors, paging/barrels, and project controls from `ui/framework.js`/`ui/framework.css`. Do not copy those components into a game editor. If a shared behavior is missing, extend the framework first so Blank, Warband, and every other plugin inherit the same fix.\n'''
          if "## Shared UI primitives are mandatory" not in adding_text:
              adding.write_text(adding_text + shared_rule, encoding="utf-8", newline="\n")

          Path("worklog/reference").mkdir(parents=True, exist_ok=True)
          for source in ["docs/FF8-MOD-LAYOUT.md", "docs/warband-acceptance.md", "docs/warband-managed-wse2.md"]:
              src = Path(source)
              if src.exists():
                  dst = Path("worklog/reference") / src.name
                  src.replace(dst)
          # Keep links valid after the moves.
          for path in Path(".").rglob("*"):
              if not path.is_file() or ".git" in path.parts or path.suffix.lower() not in {".md",".py",".js",".html",".yml",".yaml",".json"}:
                  continue
              try: value = path.read_text(encoding="utf-8")
              except UnicodeDecodeError: continue
              newer = value.replace("docs/FF8-MOD-LAYOUT.md", "worklog/reference/FF8-MOD-LAYOUT.md")\
                           .replace("docs/warband-acceptance.md", "worklog/reference/warband-acceptance.md")\
                           .replace("docs/warband-managed-wse2.md", "worklog/reference/warband-managed-wse2.md")
              if newer != value: path.write_text(newer, encoding="utf-8", newline="\n")

          # Delete the review experiment and its dedicated regression.
          for path in ["ui/design-review.css", "ui/design-review.js", "tests/global_design_review_check.py"]:
              Path(path).unlink(missing_ok=True)

          # Remove stale visible mode wording from moved game-specific docs.
          for path in Path("worklog/reference").glob("*.md"):
              value = path.read_text(encoding="utf-8")
              value = value.replace("Lexer Mode", "Developer Mode").replace("Lexer mode", "Developer Mode").replace("I am Lexer", "authorized GitHub identity")
              path.write_text(value, encoding="utf-8", newline="\n")
          PY
      - name: Static and syntax checks
        shell: bash
        run: |
          set -euxo pipefail
          node --check ui/framework.js
          python -m compileall -q desktop_host.py github_integration.py settings_manager.py
          ! git grep -n -E 'LexeditorDesignReview|design-review\.(js|css)|Design Review' -- ':!worklog/**'
          ! git grep -n -E 'Lexer Mode|I am Lexer|lexerMode|lexerAuthorized|lexerLogin' -- '*.py' '*.js' '*.md'
          test ! -e ui/design-review.js
          test ! -e ui/design-review.css
          test ! -e tests/global_design_review_check.py
          test ! -e docs/warband-acceptance.md
          test -e worklog/reference/warband-acceptance.md
          grep -q 'lex-model-preview-drawer' ui/framework.js
          grep -q 'label=self._github_issue_label(plugin_id)' desktop_host.py
          grep -q 'lex-trailing-list-detail' ui/framework.js
          grep -q 'shortName === "LL"' ui/framework.js
          grep -q 'Shared interaction standards' docs/UI-MANUAL.md
          git diff --check
      - name: Commit fixes
        shell: bash
        run: |
          set -euxo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fix shared editor UI behaviors"
          git push origin HEAD:fix/shared-ui-batch-20260906
