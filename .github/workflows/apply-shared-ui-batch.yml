name: Apply shared UI batch
on:
  push:
    branches: [fix/shared-ui-batch-20260906]
    paths: [.github/workflows/apply-shared-ui-batch.yml]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply requested shared UI fixes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          def text(path):
              return Path(path).read_text(encoding="utf-8")

          def write(path, value):
              Path(path).write_text(value, encoding="utf-8", newline="\n")

          def replace_once(path, old, new, marker=None):
              value = text(path)
              if marker and marker in value:
                  return
              count = value.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one replacement, got {count}: {old[:100]!r}")
              write(path, value.replace(old, new, 1))

          def regex_once(path, pattern, replacement, marker=None, flags=re.S):
              value = text(path)
              if marker and marker in value:
                  return
              updated, count = re.subn(pattern, replacement, value, count=1, flags=flags)
              if count != 1:
                  raise SystemExit(f"{path}: regex expected one replacement, got {count}: {pattern[:120]!r}")
              write(path, updated)

          # -----------------------------------------------------------------
          # GitHub workspace: every game uses the central Lexeditor issues,
          # filtered by the game's canonical label.
          # -----------------------------------------------------------------
          replace_once(
              "github_integration.py",
              '''    def list_issues(self, repository: GitHubRepository,\n                    state: str = "open", limit: int = 500) -> dict:\n        """List repository issues for the embedded workspace."""\n''',
              '''    def list_issues(self, repository: GitHubRepository,\n                    state: str = "open", limit: int = 500,\n                    label: str | None = None) -> dict:\n        """List repository issues for the embedded workspace, optionally by game label."""\n''',
              marker="optionally by game label",
          )
          replace_once(
              "github_integration.py",
              '''        payload = self._json([\n            "issue", "list", "--repo", repository.full_name,\n            "--state", normalized_state, "--limit", str(normalized_limit),\n            "--json", "number,title,state,labels,updatedAt,author",\n        ])\n''',
              '''        arguments = [\n            "issue", "list", "--repo", repository.full_name,\n            "--state", normalized_state, "--limit", str(normalized_limit),\n            "--json", "number,title,state,labels,updatedAt,author",\n        ]\n        clean_label = str(label or "").strip()\n        if clean_label:\n            arguments.extend(["--label", clean_label])\n        payload = self._json(arguments)\n''',
              marker='arguments.extend(["--label", clean_label])',
          )

          replace_once(
              "desktop_host.py",
              '''    def _github_repository(self, plugin_id: str):\n        """Resolve one configured repository before the owner check."""\n        plugin = self._plugins.get(plugin_id)\n        if plugin is None:\n            raise ValueError(f"Unknown Lexeditor plugin: {plugin_id}")\n        if plugin.github is None:\n            raise ValueError(f"{plugin.name} has no configured GitHub repository")\n        return plugin.github\n\n    def github_repository(self, plugin_id: str) -> dict | None:\n        """Show safe repository metadata only to an allowed active owner."""\n        plugin = self._plugins.get(plugin_id)\n        if plugin is None:\n            raise ValueError(f"Unknown Lexeditor plugin: {plugin_id}")\n        if plugin.github is None:\n            return None\n        repository = self._github_repository(plugin_id)\n        return self._github.visible_repository(repository)\n''',
              '''    @staticmethod\n    def _github_issue_label(plugin_id: str) -> str:\n        """Map editor plugin IDs to the labels used by the central issue tracker."""\n        return {"rdr": "rdr1", "ff7_2013": "ff7"}.get(plugin_id, plugin_id)\n\n    def _github_repository(self, plugin_id: str):\n        """Every game edits the one canonical Lexeditor issue tracker."""\n        if plugin_id not in self._plugins:\n            raise ValueError(f"Unknown Lexeditor plugin: {plugin_id}")\n        return LEXEDITOR_REPOSITORY\n\n    def github_repository(self, plugin_id: str) -> dict | None:\n        """Show the central issue repository and this game's issue-label filter."""\n        repository = self._github_repository(plugin_id)\n        visible = self._github.visible_repository(repository)\n        if not visible:\n            return None\n        return {**visible, "issueLabel": self._github_issue_label(plugin_id)}\n''',
              marker="_github_issue_label",
          )
          replace_once(
              "desktop_host.py",
              '''        if not self._settings.snapshot().get("lexerMode"):\n            raise PermissionError("Lexer Mode is not enabled")\n        if not self._github.visible_repository(LEXEDITOR_REPOSITORY, refresh=True):\n            raise PermissionError("Lexer's active GitHub account is required")\n''',
              '''        if not self._github.visible_repository(LEXEDITOR_REPOSITORY, refresh=True):\n            raise PermissionError("Developer Mode requires the authorized GitHub account")\n''',
              marker='Developer Mode requires the authorized GitHub account',
          )
          # The same old two-line gate occurs in helper_versions/open release notes.
          value = text("desktop_host.py")
          value = value.replace(
              '        if not self._settings.snapshot().get("lexerMode"):\n            raise PermissionError("Lexer Mode is not enabled")\n',
              '        if not self._github.visible_repository(LEXEDITOR_REPOSITORY, refresh=True):\n            raise PermissionError("Developer Mode requires the authorized GitHub account")\n',
          )
          write("desktop_host.py", value)
          replace_once(
              "desktop_host.py",
              '''    def github_issues(self, plugin_id: str, state: str = "open") -> dict:\n        """List issues for the active game's embedded owner workspace."""\n        return self._github.list_issues(self._github_repository(plugin_id), state)\n''',
              '''    def github_issues(self, plugin_id: str, state: str = "open") -> dict:\n        """List only this game's issues from the central Lexeditor tracker."""\n        return self._github.list_issues(\n            self._github_repository(plugin_id), state,\n            label=self._github_issue_label(plugin_id),\n        )\n''',
              marker="List only this game's issues",
          )
          replace_once(
              "desktop_host.py",
              '''        rows = []\n        lexer_mode = bool(self._settings.snapshot().get("lexerMode"))\n        for managed in self._installations.rows(bypass=not self._enforce_installations):\n            plugin = managed["plugin"]\n            if plugin.plugin_id == "blank" and not lexer_mode:\n                continue\n''',
              '''        rows = []\n        developer_mode = bool(self._github.visible_repository(LEXEDITOR_REPOSITORY))\n        for managed in self._installations.rows(bypass=not self._enforce_installations):\n            plugin = managed["plugin"]\n            if plugin.plugin_id == "blank" and not developer_mode:\n                continue\n''',
              marker="developer_mode = bool(self._github.visible_repository",
          )
          regex_once(
              "desktop_host.py",
              r'''    def lexeditor_settings\(self\) -> dict:\n.*?    def save_lexeditor_view_preference''',
              '''    def lexeditor_settings(self) -> dict:\n        """Return shared settings; Developer Mode follows the active GitHub identity."""\n        payload = self._settings.snapshot()\n        identity = self._github.visible_repository(LEXEDITOR_REPOSITORY)\n        payload["developerAuthorized"] = bool(identity)\n        payload["developerLogin"] = (identity or {}).get("login", "")\n        payload["developerMode"] = bool(identity)\n        return payload\n\n    def save_lexeditor_settings(self, values: dict | str, *legacy_values) -> dict:\n        """Save bounded user settings. Developer Mode is never a stored toggle."""\n        if isinstance(values, dict):\n            payload = values\n        else:\n            names = ("hoverableAltClick", "selectionHoldMs",\n                     "tableRowsPerPage", "panelGapPercent", "mainMenuHeightPercent",\n                     "soundEnabled", "soundVolumePercent")\n            payload = {"updateCheckFrequency": values, **dict(zip(names, legacy_values))}\n        self._settings.save(\n            str(payload.get("updateCheckFrequency", "daily")),\n            hoverable_alt_click=None if "hoverableAltClick" not in payload else bool(payload["hoverableAltClick"]),\n            selection_hold_ms=payload.get("selectionHoldMs"),\n            table_rows_per_page=payload.get("tableRowsPerPage"),\n            panel_gap_percent=payload.get("panelGapPercent"),\n            main_menu_height_percent=payload.get("mainMenuHeightPercent"),\n            sound_enabled=None if "soundEnabled" not in payload else bool(payload["soundEnabled"]),\n            sound_volume_percent=payload.get("soundVolumePercent"),\n        )\n        return self.lexeditor_settings()\n\n    def save_developer_setting_defaults(self, values: dict) -> dict:\n        """Save distributable defaults only for the authorized repository owner."""\n        if not self._github.visible_repository(LEXEDITOR_REPOSITORY, refresh=True):\n            raise PermissionError("Developer Mode requires the authorized GitHub account")\n        self._settings.save_developer_defaults(values)\n        return self.lexeditor_settings()\n\n    def save_lexeditor_view_preference''',
              marker="def save_developer_setting_defaults",
          )

          # -----------------------------------------------------------------
          # Settings persistence: Developer Mode is identity-derived; no Lexer Mode.
          # -----------------------------------------------------------------
          value = text("settings_manager.py")
          value = value.replace('    "lexerMode": False,\n', '')
          value = value.replace(
              'LEXER_DEFAULT_KEYS = tuple(key for key in DEFAULTS if key not in {"lexerMode", "viewPreferences"})',
              'PACKAGED_DEFAULT_KEYS = tuple(key for key in DEFAULTS if key not in {"developerMode", "viewPreferences"})')
          value = value.replace('for key in LEXER_DEFAULT_KEYS if key in payload', 'for key in PACKAGED_DEFAULT_KEYS if key in payload')
          value = value.replace('            "lexerMode": payload.get("lexerMode") is True,\n', '')
          value = value.replace(
              '            "developerMode": payload.get("developerMode", defaults["developerMode"]) is True,',
              '            "developerMode": False,')
          # Replace save signature + developer/lexer persistence while preserving every other bounded setting.
          value = value.replace(
              '''    def save(self, update_check_frequency: str, developer_mode: bool | None = None,\n             lexer_mode: bool | None = None,\n             hoverable_alt_click: bool | None = None,\n''',
              '''    def save(self, update_check_frequency: str,\n             hoverable_alt_click: bool | None = None,\n''')
          value = value.replace(
              '''        if developer_mode is None:\n            developer_mode = current["developerMode"]\n        if lexer_mode is None:\n            lexer_mode = current["lexerMode"]\n''', '')
          value = value.replace('                "version": 8,\n                "updateCheckFrequency": update_check_frequency,\n                "developerMode": bool(developer_mode),\n                "lexerMode": bool(lexer_mode),\n',
                                '                "version": 9,\n                "updateCheckFrequency": update_check_frequency,\n')
          value = value.replace('    def save_lexer_defaults(self, values: dict) -> dict:\n        """Save checked-in application defaults after host authorization."""',
                                '    def save_developer_defaults(self, values: dict) -> dict:\n        """Save checked-in application defaults after host authorization."""')
          value = value.replace('if key not in LEXER_DEFAULT_KEYS:', 'if key not in PACKAGED_DEFAULT_KEYS:')
          value = value.replace('{"version": 8, **current}', '{"version": 9, **current}')
          write("settings_manager.py", value)

          # -----------------------------------------------------------------
          # Shared Detail: generic model-preview drawer, human-scale labels,
          # bidirectional property/column hover, safe reset animation + sliders.
          # -----------------------------------------------------------------
          replace_once(
              "ui/framework.js",
              '''  // One shared Detail heading owns the optional icon or live-preview slot,\n  // record identity, metadata, and actions. Games supply themed content.\n  const detailPanel = (options = {}) => {\n    const title = options.title instanceof Node\n      ? options.title\n      : element("h2", {class: "lex-detail-panel-title"}, String(options.title ?? ""));\n    const identity = element("div", {class: "lex-detail-panel-identity"},\n      title,\n      options.identity ? element("div", {class: "lex-detail-panel-id"}, options.identity) : null,\n      options.meta ? element("div", {class: "lex-detail-panel-meta"}, options.meta) : null);\n    const heading = options.heading === false ? null : element("div", {\n      class: ["lex-detail-panel-heading", options.icon ? "" : "no-icon", options.actions ? "" : "no-actions"].filter(Boolean).join(" "),\n    },\n      options.icon ? element("div", {class: "lex-detail-panel-icon"}, options.icon) : null,\n      identity,\n      options.actions ? element("div", {class: "lex-detail-panel-actions"}, options.actions) : null);\n    return element("section", {\n      ...(options.attrs || {}),\n      class: ["lex-detail-panel", "lex-detail", heading ? "" : "no-heading", options.className || ""].filter(Boolean).join(" "),\n    }, heading, element("div", {class: "lex-detail-panel-body"}, options.body || []));\n  };\n''',
              '''  // One shared Detail heading owns the optional icon/live-preview slot,\n  // record identity, metadata, actions, and the standard slide-out model drawer.\n  const detailPanel = (options = {}) => {\n    const title = options.title instanceof Node\n      ? options.title\n      : element("h2", {class: "lex-detail-panel-title"}, String(options.title ?? ""));\n    const identity = element("div", {class: "lex-detail-panel-identity"},\n      title,\n      options.identity ? element("div", {class: "lex-detail-panel-id"}, options.identity) : null,\n      options.meta ? element("div", {class: "lex-detail-panel-meta"}, options.meta) : null);\n    const previewContent = typeof options.modelPreview === "function" ? options.modelPreview() : options.modelPreview;\n    const iconSlot = options.icon ? element("div", {\n      class: ["lex-detail-panel-icon", previewContent ? "lex-model-preview-trigger" : ""].filter(Boolean).join(" "),\n    }, element("span", {class: "lex-detail-panel-icon-content"}, options.icon)) : null;\n    const closeMark = previewContent ? element("span", {class: "lex-model-preview-close", "aria-hidden": "true"}, "×") : null;\n    if (iconSlot && closeMark) iconSlot.append(closeMark);\n    const heading = options.heading === false ? null : element("div", {\n      class: ["lex-detail-panel-heading", options.icon ? "" : "no-icon", options.actions ? "" : "no-actions"].filter(Boolean).join(" "),\n    },\n      iconSlot,\n      identity,\n      options.actions ? element("div", {class: "lex-detail-panel-actions"}, options.actions) : null);\n    const drawer = previewContent ? element("div", {\n      class: "lex-model-preview-drawer", "aria-hidden": "true",\n    }, previewContent) : null;\n    const root = element("section", {\n      ...(options.attrs || {}),\n      class: ["lex-detail-panel", "lex-detail", heading ? "" : "no-heading", previewContent ? "lex-has-model-preview" : "", options.className || ""].filter(Boolean).join(" "),\n    }, heading, drawer, element("div", {class: "lex-detail-panel-body"}, options.body || []));\n    if (iconSlot && drawer) {\n      iconSlot.tabIndex = 0;\n      iconSlot.setAttribute("role", "button");\n      const label = options.modelPreviewLabel || "Model preview";\n      const setOpen = open => {\n        const next = !!open;\n        if (root.classList.contains("lex-model-preview-open") === next) return;\n        root.classList.toggle("lex-model-preview-open", next);\n        drawer.setAttribute("aria-hidden", String(!next));\n        iconSlot.setAttribute("aria-expanded", String(next));\n        iconSlot.setAttribute("aria-label", next ? `Close ${label}` : `Open ${label}`);\n        iconSlot.title = next ? `Close ${label}` : `Open ${label}`;\n        root.dispatchEvent(new CustomEvent(next ? "lex-model-preview-open" : "lex-model-preview-close", {bubbles:false}));\n      };\n      iconSlot.setAttribute("aria-expanded", "false");\n      iconSlot.setAttribute("aria-label", `Open ${label}`);\n      iconSlot.title = `Open ${label}`;\n      iconSlot.addEventListener("click", event => { event.preventDefault(); setOpen(!root.classList.contains("lex-model-preview-open")); });\n      iconSlot.addEventListener("keydown", event => {\n        if (!["Enter", " "].includes(event.key)) return;\n        event.preventDefault();\n        setOpen(!root.classList.contains("lex-model-preview-open"));\n      });\n      root.lexModelPreviewOpen = () => setOpen(true);\n      root.lexModelPreviewClose = () => setOpen(false);\n    }\n    return root;\n  };\n''',
              marker="lexModelPreviewOpen",
          )

          # Add a fixed-box text fitter used by property labels and bool tiles.
          replace_once(
              "ui/framework.js",
              '''  // Every value box on a panel should end at the same edge, so the reference\n''',
              '''  // Labels stay inside their existing box: wrap first, then reduce the font\n  // only as far as needed. A long name never makes a Detail row taller.\n  const autoFitBoxText = (node, options = {}) => {\n    if (!(node instanceof Element)) return node;\n    if (node.__lexAutoFitBoxUpdate) { node.__lexAutoFitBoxUpdate(); return node; }\n    const minimum = Math.max(7, Number(options.minimum) || 8);\n    const update = () => {\n      if (!node.isConnected) return;\n      node.style.fontSize = "";\n      const maximum = parseFloat(getComputedStyle(node).fontSize) || 14;\n      let low = minimum, high = maximum, best = minimum;\n      for (let pass = 0; pass < 8; pass++) {\n        const size = (low + high) / 2;\n        node.style.fontSize = `${size}px`;\n        const fits = node.scrollWidth <= node.clientWidth + 1 && node.scrollHeight <= node.clientHeight + 1;\n        if (fits) { best = size; low = size; } else high = size;\n      }\n      node.style.fontSize = `${Math.min(maximum, best)}px`;\n    };\n    node.__lexAutoFitBoxUpdate = update;\n    if (typeof ResizeObserver === "function") {\n      node.__lexAutoFitBoxObserver = new ResizeObserver(update);\n      node.__lexAutoFitBoxObserver.observe(node);\n    }\n    document.fonts?.ready?.then(update);\n    requestAnimationFrame(update);\n    return node;\n  };\n\n  // Every value box on a panel should end at the same edge, so the reference\n''',
              marker="const autoFitBoxText",
          )
          replace_once(
              "ui/framework.js",
              '''    const typeRail = element("div", {class: "lex-field-type-rail"},\n      typeName, typeRange, helpMarker);\n''',
              '''    const typeRail = element("div", {class: "lex-field-type-rail"}, typeName, typeRange);\n''',
              marker='typeRail = element("div", {class: "lex-field-type-rail"}, typeName, typeRange)',
          )
          replace_once(
              "ui/framework.js",
              '''    const node = element("div", {\n      ...(options.attrs || {}),\n      class: ["lex-detail-field", "lex-pinnable-property", booleanField ? "lex-boolean-field" : "", options.className || ""].filter(Boolean).join(" "),\n      "data-lex-type": dataType,\n      "data-lex-property": options.property\n        || pin?.getAttribute?.("data-lex-pin-column") || null,\n      "data-lex-readonly": String(readOnly),\n    }, element("div", {class: "lex-detail-field-label"},\n      options.label, arrow),\n    element("div", {class: "lex-detail-field-control"}, control,\n      pin && pin.parentElement !== control ? pin : null), typeRail);\n''',
              '''    const labelTextNode = element("span", {class: "lex-detail-field-label-text"}, options.label);\n    const labelNode = element("div", {class: "lex-detail-field-label"}, helpMarker, labelTextNode, arrow);\n    const node = element("div", {\n      ...(options.attrs || {}),\n      class: ["lex-detail-field", "lex-pinnable-property", booleanField ? "lex-boolean-field" : "", options.className || ""].filter(Boolean).join(" "),\n      "data-lex-type": dataType,\n      "data-lex-property": options.property\n        || pin?.getAttribute?.("data-lex-pin-column") || null,\n      "data-lex-readonly": String(readOnly),\n    }, labelNode,\n    element("div", {class: "lex-detail-field-control"}, control,\n      pin && pin.parentElement !== control ? pin : null), typeRail);\n    autoFitBoxText(labelTextNode, {minimum:7});\n    if (node.dataset.lexProperty) bindColumnHighlight(node, node.dataset.lexProperty);\n''',
              marker="const labelTextNode =",
          )
          replace_once(
              "ui/framework.js",
              '''      const paint = () => fill.style.setProperty("--lex-value-ratio", String(ratio()));\n      input.addEventListener("input", paint);\n''',
              '''      const paint = () => fill.style.setProperty("--lex-value-ratio", String(ratio()));\n      input.__lexValueSliderPaint = paint;\n      input.addEventListener("input", paint);\n''',
              marker="input.__lexValueSliderPaint = paint",
          )
          replace_once(
              "ui/framework.js",
              '''      node.classList.add("lex-has-value-fill");\n      (control instanceof Element && control.matches(".lex-unit-field") ? control : input.parentElement)\n        ?.prepend(fill);\n      requestAnimationFrame(paint);\n''',
              '''      node.classList.add("lex-has-value-fill");\n      let valueHost = control instanceof Element && control.matches(".lex-unit-field") ? control : input.parentElement;\n      if (valueHost?.classList?.contains("lex-detail-field-control")) {\n        const wrapper = element("span", {class: "lex-value-box"});\n        input.before(wrapper);\n        wrapper.append(input);\n        valueHost = wrapper;\n      }\n      valueHost?.prepend(fill);\n      requestAnimationFrame(paint);\n''',
              marker="let valueHost = control",
          )
          replace_once(
              "ui/framework.js",
              '''      source.lexRevert(event);\n      showToast("Restored the vanilla value");\n''',
              '''      source.lexRevert(event);\n      input?.__lexValueSliderPaint?.();\n      node.classList.remove("lex-reset-flash");\n      void node.offsetWidth;\n      node.classList.add("lex-reset-flash");\n      setTimeout(() => node.classList.remove("lex-reset-flash"), 560);\n      showToast("Restored the vanilla value");\n''',
              marker="lex-reset-flash",
          )
          regex_once(
              "ui/framework.js",
              r'''      // Each switch carries its own type rail, matching every other property:.*?      return label;\n''',
              '''      const name = element("span", {class: "lex-toggle-name"}, toggle.label);\n      const label = element("label", {\n        class: ["lex-toggle", toggle.className || ""].filter(Boolean).join(" "),\n        "data-lex-toggle": toggle.key || toggle.label || "",\n      }, input, name, toggle.help ? infoHelp(toggle.help) : null);\n      autoFitBoxText(name, {minimum:7});\n      return label;\n''',
              marker='autoFitBoxText(name, {minimum:7})',
          )

          # Enabled is a first-class pinnable generated column.
          replace_once(
              "ui/framework.js",
              '''  const withEnabledColumn = (declared, rows, change) => {\n    const columns = declared || [];\n    if (!hasEnabledProperty(rows)) return columns;\n    if (columns.some(column => String(column.key).toLocaleLowerCase() === ENABLED_KEY)) return columns;\n    return [enabledColumn(change), ...columns];\n  };\n\n  const columnPreferences = (viewKey, definitions, changed = () => {}) => {\n    const key = `lexeditor:columns:${String(viewKey || "view")}`;\n    const source = numberedIdColumns(definitions || [], []);\n''',
              '''  const withEnabledColumn = (declared, rows, change) => {\n    const columns = declared || [];\n    const withoutEnabled = columns.filter(column => String(column.key).toLocaleLowerCase() !== ENABLED_KEY);\n    if (!hasEnabledProperty(rows)) return withoutEnabled;\n    if (!columns.some(column => String(column.key).toLocaleLowerCase() === ENABLED_KEY)) {\n      return [enabledColumn(change), ...withoutEnabled];\n    }\n    return [enabledColumn(change), ...withoutEnabled];\n  };\n\n  const columnPreferences = (viewKey, definitions, changed = () => {}) => {\n    const key = `lexeditor:columns:${String(viewKey || "view")}`;\n    const declared = definitions || [];\n    const preferenceColumns = declared.some(column => String(column.key).toLocaleLowerCase() === ENABLED_KEY)\n      ? declared\n      : [{key: ENABLED_KEY, label: "Enabled", generated: true, pinned: true}, ...declared];\n    const source = numberedIdColumns(preferenceColumns, []);\n''',
              marker="const preferenceColumns =",
          )
          regex_once(
              "ui/framework.js",
              r'''      // A changed column set changes the table's real minimum width\..*?      changed\(\[\.\.\.order\]\);''',
              '''      // Pinning changes columns, not the user's panel proportions.\n      changed([...order]);''',
              marker="Pinning changes columns, not the user's panel proportions",
          )

          # Remove the old hover-only shortcut badge; the permanent shared badge is enough.
          regex_once(
              "ui/framework.js",
              r'''\n    // Hovering a tab reveals the number that jumps to it\..*?\n    const removeControlHelp =''',
              '''\n    const removeControlHelp =''',
              marker="const removeControlHelp = installControlHelp",
          )

          # Developer Mode is the sole developer state and is identity-derived.
          value = text("ui/framework.js")
          value = value.replace('    let lexerMode = false;\n', '')
          value = value.replace('if (event.button !== 2 || !lexerMode) return;', 'if (event.button !== 2 || !developerMode) return;')
          value = value.replace(
              '''    const setLexerMode = enabled => { lexerMode = !!enabled; };\n    const initializeDeveloperMode = async () => {\n      try {\n        const value = rememberSharedSettings(await callWindow("lexeditor_settings"));\n        setDeveloperMode(value?.developerMode); setLexerMode(value?.lexerMode);\n      }\n      catch (_error) { setDeveloperMode(false); setLexerMode(false); }\n    };\n    window.addEventListener("lexeditor-settings-changed", event => {\n      rememberSharedSettings(event.detail);\n      setDeveloperMode(event.detail?.developerMode);\n      setLexerMode(event.detail?.lexerMode);\n    });\n''',
              '''    const initializeDeveloperMode = async () => {\n      try {\n        const value = rememberSharedSettings(await callWindow("lexeditor_settings"));\n        setDeveloperMode(value?.developerMode);\n      }\n      catch (_error) { setDeveloperMode(false); }\n    };\n    window.addEventListener("lexeditor-settings-changed", event => {\n      rememberSharedSettings(event.detail);\n      setDeveloperMode(event.detail?.developerMode);\n    });\n''')
          write("ui/framework.js", value)

          # Rewrite the Settings-dialog scope block without a Lexer-mode checkbox.
          value = text("ui/framework.js")
          value = value.replace('scope:"lexer"', 'scope:"default"')
          value = value.replace('        {key:"developerMode", scope:"developer", title:"Developer Mode", description:"Shows development tools such as the GitHub workspace and plugin Restart control.", type:"checkbox"},\n', '')
          value = value.replace('definitions.filter(definition => definition.scope !== "lexer")', 'definitions.filter(definition => definition.scope !== "default")')
          value = value.replace('(definition.scope !== "lexer" && !supportsCurrent(definition))', '(definition.scope !== "default" && !supportsCurrent(definition))')
          regex = re.compile(r'''      const currentControls = new Map\(\), defaultControls = new Map\(\), defaultCards = \[\];\n.*?      for \(const definition of definitions\) \{''', re.S)
