name: Warband shared preview CI fix

on:
  push:
    branches: [fix/ui-standardization-20260906]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/ui-standardization-20260906
          fetch-depth: 0
      - name: Update shared preview regression coverage
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new, label):
              p=Path(path); text=p.read_text(encoding='utf-8')
              count=text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected 1 match, got {count}')
              p.write_text(text.replace(old,new,1),encoding='utf-8',newline='\n')

          replace_once('games/warband/editor.html',
              'message.hidden=false;message.textContent=error.message;action.disabled=true;',
              'message.hidden=false;message.textContent=error.message;',
              'stale preview action reference')

          old='''                    page.wait_for_function('document.querySelector(".warband-item-thumbnail img")?.naturalWidth>0')\n                    page.wait_for_function('window.__warbandPreview?.length===1 || document.querySelector(".warband-preview-message")?.textContent.includes("cannot start the WebGL")')\n                    assert page.locator('.warband-item-thumbnail canvas').count()==0\n                    assert page.locator('.warband-preview-stage canvas').count()==1\n                    webgl=page.evaluate('window.__warbandPreview?.length===1')\n                    if os.environ.get('WARBAND_REQUIRE_WEBGL')=='1':assert webgl,'WebGL fixture rendering required by CI'\n                    if webgl:\n                        page.get_by_role('button',name='Close 3D preview',exact=True).click()\n                        assert page.locator('.warband-preview-stage').is_hidden()\n                        page.get_by_role('button',name='Open 3D preview',exact=True).click()\n                        page.wait_for_function('window.__warbandPreview?.length===1')\n                    else:\n                        assert page.locator('.warband-item-preview-action').is_disabled()\n'''
          new='''                    page.wait_for_function('document.querySelector(".warband-item-thumbnail img")?.naturalWidth>0')\n                    assert page.locator('.warband-item-thumbnail canvas').count()==0\n                    assert page.locator('.warband-preview-stage canvas').count()==1\n                    assert page.locator('.lex-model-preview-drawer').is_hidden()\n                    assert not page.evaluate('window.__warbandPreview?.length')\n                    page.get_by_role('button',name='Open model preview',exact=True).click()\n                    page.wait_for_function('window.__warbandPreview?.length===1 || document.querySelector(".warband-preview-message")?.textContent.includes("cannot start the WebGL")')\n                    webgl=page.evaluate('window.__warbandPreview?.length===1')\n                    if os.environ.get('WARBAND_REQUIRE_WEBGL')=='1':assert webgl,'WebGL fixture rendering required by CI'\n                    if webgl:\n                        page.get_by_role('button',name='Close model preview',exact=True).click()\n                        assert page.locator('.lex-model-preview-drawer').is_hidden()\n                        assert not page.evaluate('window.__warbandPreview?.length')\n                        page.get_by_role('button',name='Open model preview',exact=True).click()\n                        page.wait_for_function('window.__warbandPreview?.length===1')\n                    else:\n                        assert page.locator('.warband-preview-message').is_visible()\n'''
          replace_once('tests/warband_browser_check.py',old,new,'shared model preview browser flow')

          old='''                    page.evaluate('state.filters.items="Missing texture fixture";navigate("items")')\n                    page.wait_for_function('document.querySelector(".warband-preview-message")?.textContent.includes("Missing diffuse")')\n                    assert page.locator('.warband-item-preview-action').is_disabled()\n                    assert page.evaluate('!window.__warbandPreview')\n'''
          new='''                    page.evaluate('state.filters.items="Missing texture fixture";navigate("items")')\n                    page.get_by_role('button',name='Open model preview',exact=True).click()\n                    page.wait_for_function('document.querySelector(".warband-preview-message")?.textContent.includes("Missing diffuse")')\n                    assert page.locator('.lex-model-preview-drawer').is_visible()\n                    assert page.evaluate('!window.__warbandPreview')\n'''
          replace_once('tests/warband_browser_check.py',old,new,'missing preview dependency flow')
          PY
      - name: Validate syntax
        run: |
          node --check ui/framework.js
          python -m compileall -q tests/warband_browser_check.py
          grep -q 'Open model preview' tests/warband_browser_check.py
          ! grep -q 'warband-item-preview-action' tests/warband_browser_check.py
          ! grep -q 'action.disabled=true' games/warband/editor.html
      - name: Commit fix and remove this workflow
        run: |
          git rm -f .github/workflows/ui-warband-preview-ci-fix.yml
          git config user.name 'Lexeditor UI maintenance'
          git config user.email '89482099+Lexer-Lux@users.noreply.github.com'
          git add games/warband/editor.html tests/warband_browser_check.py
          git commit -m 'Test Warband model preview through shared drawer'
          git push origin HEAD:fix/ui-standardization-20260906
