name: Apply verified RDR2 header-save repair
on:
  push:
    branches: [fix/rdr2-issue-batch]
    paths: [.github/workflows/rdr2-save-repair.yml]
permissions:
  contents: write
  pull-requests: read
jobs:
  repair:
    if: github.repository == 'Lexer-Lux/Lexeditor' && github.ref == 'refs/heads/fix/rdr2-issue-batch'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Fetch the public source without optional gitlinks
        run: |
          git init .
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git fetch --depth=1 origin "$GITHUB_SHA"
          git checkout --detach FETCH_HEAD
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Preserve PR text before its status summary is corrected
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p worklog/issues/github-131/sources
          gh api repos/Lexer-Lux/Lexeditor/pulls/364 > worklog/issues/github-131/sources/pr364-before-save-dispatch.json
      - name: Reproduce the one-line production repair and verify exact bytes
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib
          p=Path('games/rdr2/editor.html')
          assert hashlib.sha256(p.read_bytes()).hexdigest()=='23d26ef16938d0479dfb7a06af240ccbf5a13c07f4f7a0343286ac4dee3d9628'
          s=p.read_text(encoding='utf-8')
          old='"itemEffectEdits","itemTagEdits","quickSelectEdits","descriptionKeyEdits","carryEdits","craftEdits","effectEdits","localizationEdits"];'
          new='"itemEffectEdits","itemTagEdits","quickSelectEdits","descriptionKeyEdits","carryEdits","craftEdits","effectEdits","localizationEdits","alcoholEdits"];'
          assert s.count(old)==1
          p.write_text(s.replace(old,new),encoding='utf-8')
          assert hashlib.sha256(p.read_bytes()).hexdigest()=='37d7b5c741679a6cb7fd1932dfd9cfd9c848ff7e035842bce96558ae0a651a1d'
          PY
          node tests/test_rdr2_global_save.js
          node tests/test_rdr2_boot.js
          python tests/test_rdr2_issue_repairs.py
      - name: Run actual rendered controls with offline synthetic API responses
        run: |
          python -m pip install playwright==1.57.0
          python -m playwright install --with-deps chromium
          python tests/rdr2_browser_check.py --screenshots artifacts/rdr2-browser
      - name: Commit only the verified source and preserved summary
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git add games/rdr2/editor.html
          git add -f worklog/issues/github-131/sources/pr364-before-save-dispatch.json
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Dispatch alcohol-only edits through the global Save control'
          gh auth setup-git
          git push origin HEAD:refs/heads/fix/rdr2-issue-batch
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: rdr2-save-browser-check
          path: artifacts/rdr2-browser/
          retention-days: 7
