name: Shared interface and installer verification
on:
  push:
    branches: [fix/global-review-help-20260906]
    paths: [.github/workflows/global-review-verification.yml]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: lexeditor-global-review-integration
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    outputs:
      tested_sha: ${{ steps.publish.outputs.sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: fix/global-review-help-20260906
          submodules: false
          persist-credentials: true
      - name: Apply reviewed source while preserving the newer Data Map
        run: |
          if [ -f maintenance/global-followup/reconcile.py ]; then
            python maintenance/global-followup/reconcile.py
          fi
          test -f tests/test_global_followup.py
          test -f ui/design-review.js
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Verify units, credits generation and JavaScript syntax
        run: |
          python -m pip install -r requirements.txt playwright
          python -m unittest discover -s tests -p 'test_global*.py' -v
          python tools/generate_credits.py --check
          node --check ui/framework.js
          node --check ui/design-review.js
          git diff --check
      - name: Verify rendered interactions without game installations
        run: |
          python -m playwright install --with-deps chromium
          python tests/global_browser_check.py
          python tests/global_design_review_check.py
          python tests/global_controls_check.py
      - name: Publish verified source without rewriting history
        id: publish
        run: |
          git config user.name 'Lexeditor Global Fixes'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/ADDING_A_GAME.md docs/SHARED_UI_DESIGN.md games/blank/editor.html games/rdr2/editor.html service_session.py tests/global_design_review_check.py tests/global_controls_check.py tests/test_global_followup.py tools/generate_credits.py ui/design-review.css ui/design-review.js ui/framework.js
          if [ -d maintenance/global-followup ]; then git rm -rf maintenance/global-followup; fi
          git diff --cached --check
          if ! git diff --cached --quiet; then git commit -m 'Add interactive UI design alternatives and accurate accessible control help'; fi
          git push origin HEAD:fix/global-review-help-20260906
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: shared-ui-regressions-${{ github.run_id }}
          path: |
            out/global-browser/
            out/global-review/
            out/global-controls/
          if-no-files-found: ignore
          retention-days: 30
  native:
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022, macos-14]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ needs.verify.outputs.tested_sha }}
          submodules: false
          persist-credentials: true
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt pyinstaller
      - name: Install Linux webview backend
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libopengl0 libxcb-cursor0 libxkbcommon-x11-0 libnss3 libasound2t64
          python -m pip install PySide6
      - name: Install Windows installer compiler
        if: runner.os == 'Windows'
        run: choco install innosetup --yes --no-progress
      - run: python -m unittest discover -s tests -p 'test_global*.py' -v
      - run: python tools/build_distribution.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: Lexeditor-${{ runner.os }}-${{ github.run_id }}
          path: |
            dist/installers/
            build/distribution/smoke.json
            build/Lexeditor/warn-Lexeditor.txt
          if-no-files-found: warn
          retention-days: 30
