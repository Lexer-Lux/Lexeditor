name: Chrono Trigger fresh checks

on:
  pull_request:
    paths:
      - 'plugins/chrono_trigger/**'
      - 'codex/chrono_trigger/**'
      - 'worklog/requests/chrono-trigger-plugin.md'
      - 'tests/test_chrono_trigger_replacement.py'
      - 'tests/chrono_trigger_browser_check.py'
      - 'desktop_host.py'
      - 'mod_library.py'
      - 'runtime_bootstrap.py'
      - 'ui/mod-loading.json'
      - 'ui/credits-sources.json'
      - 'ui/credits.json'
      - '.github/workflows/chrono-trigger-checks.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  CHRONO_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  core:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.CHRONO_HEAD_SHA }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install host dependency used by mod-library integration test
        run: python -m pip install Pillow==12.3.0
      - name: Compile fresh Chrono Trigger modules
        run: python -m compileall -q plugins/chrono_trigger
      - name: Run fresh Chrono Trigger roundtrip tests
        run: python -m unittest discover -s tests -p 'test_chrono_trigger_replacement.py' -v
      - name: Run synthetic managed-service smoke
        run: python -c "from plugins.chrono_trigger.plugin import smoke; print(smoke())"
      - name: Check editor JavaScript syntax
        run: node --check plugins/chrono_trigger/editor.js

  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.CHRONO_HEAD_SHA }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Lexeditor runtime dependencies
        run: python -m pip install -r requirements.txt
      - name: Validate the Chrono plugin descriptor directly
        run: |
          python - <<'PY'
          from plugins.chrono_trigger.plugin import PLUGIN
          from plugin_api import validate_plugin
          validate_plugin(PLUGIN)
          assert PLUGIN.plugin_id == "chrono-trigger"
          assert PLUGIN.mod_adapter is not None
          assert PLUGIN.mods_load is False
          print("Chrono Trigger descriptor passed")
          PY
      - name: Validate Chrono Credits and Mod Loading metadata
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from plugin_metadata import validate_credits_bundle, validate_mod_loading
          root = Path(".")
          credits = json.loads((root / "ui/credits.json").read_text(encoding="utf-8"))
          loading = json.loads((root / "ui/mod-loading.json").read_text(encoding="utf-8"))
          validate_credits_bundle(
              {"plugins": {"chrono-trigger": credits["plugins"]["chrono-trigger"]}},
              {"chrono-trigger"},
          )
          validate_mod_loading(
              {"plugins": {"chrono-trigger": loading["plugins"]["chrono-trigger"]}},
              {"chrono-trigger"},
          )
          print("Chrono Trigger metadata passed")
          PY
      - name: Verify registered Chrono child service module
        run: |
          python - <<'PY'
          import runtime_bootstrap
          registered = getattr(runtime_bootstrap, "SERVICE_MODULES", ())
          assert "plugins.chrono_trigger.server" in registered, registered
          print("Chrono Trigger service registration passed")
          PY

  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.CHRONO_HEAD_SHA }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install browser acceptance dependencies
        run: |
          python -m pip install playwright==1.57.0
          python -m playwright install --with-deps chromium
      - name: Run fixture-only Chrono Trigger browser acceptance
        run: python tests/chrono_trigger_browser_check.py out/chrono-trigger-browser
      - name: Preserve Chrono Trigger rendered evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chrono-trigger-browser-${{ env.CHRONO_HEAD_SHA }}
          path: out/chrono-trigger-browser
          if-no-files-found: warn
          retention-days: 7

  candidate:
    needs: [core, integration, browser]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.CHRONO_HEAD_SHA }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install normal Lexeditor runtime dependencies
        run: python -m pip install -r requirements.txt
      - name: Recheck Chrono source candidate
        shell: pwsh
        run: |
          python -m compileall -q plugins/chrono_trigger
          python -m unittest discover -s tests -p 'test_chrono_trigger_replacement.py' -v
          python -c "from plugins.chrono_trigger.plugin import PLUGIN, smoke; from plugin_api import validate_plugin; validate_plugin(PLUGIN); print(smoke())"
          node --check plugins/chrono_trigger/editor.js
      - name: Build exact-head tracked-source candidate
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force out/chrono-trigger-candidate | Out-Null
          $head = (git rev-parse HEAD).Trim()
          if ($head -ne "$env:CHRONO_HEAD_SHA") { throw "candidate checkout $head != requested $env:CHRONO_HEAD_SHA" }
          $zip = "out/chrono-trigger-candidate/Lexeditor-ChronoTrigger-$head.zip"
          git archive --format=zip --output="$zip" HEAD
          $hash = (Get-FileHash -Algorithm SHA256 $zip).Hash.ToLowerInvariant()
          [ordered]@{
            plugin = "chrono-trigger"
            headSha = $head
            candidateType = "exact tracked source"
            zipSha256 = $hash
            ctextBundled = $false
            modsLoadVerifiedInGame = $false
            installedGameAcceptance = $false
            note = "Source/distribution candidate only; contains no proprietary Chrono Trigger files or CTExt binary."
          } | ConvertTo-Json | Set-Content -Encoding utf8 "out/chrono-trigger-candidate/candidate.json"
      - name: Preserve isolated Chrono source candidate
        uses: actions/upload-artifact@v4
        with:
          name: chrono-trigger-source-candidate-${{ env.CHRONO_HEAD_SHA }}
          path: out/chrono-trigger-candidate/
          if-no-files-found: error
          retention-days: 7
