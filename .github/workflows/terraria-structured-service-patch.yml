name: Integrate Terraria structured content service

on:
  push:
    branches: [feature/terraria-plugin]
    paths:
      - '.github/workflows/terraria-structured-service-patch.yml'

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply service patch
        run: python .github/scripts/terraria_structured_service_patch.py
      - name: Verify Terraria
        run: |
          python -m compileall -q games/terraria plugin_api.py project_manager.py
          python -m unittest discover -s tests -p 'test_terraria_*.py'
          git diff --check
      - name: Commit service integration
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/terraria-structured-service-patch.yml .github/scripts/terraria_structured_service_patch.py
          git add games/terraria/server.py tests/test_terraria_structured_content_service.py
          git commit -m 'Expose Terraria structured content service'
          git push origin HEAD:feature/terraria-plugin
