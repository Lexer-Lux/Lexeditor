name: Integrate Terraria structured content service

on:
  push:
    branches: [feature/terraria-plugin]
    paths:
      - '.github/workflows/terraria-structured-service-patch.yml'

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Wire structured content API
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path=Path('games/terraria/server.py')
          text=path.read_text(encoding='utf-8')
          def one(old,new):
              global text
              count=text.count(old)
              if count!=1: raise SystemExit(f'expected one server anchor, found {count}: {old[:100]!r}')
              text=text.replace(old,new,1)

          one(
              'from .source_text import (\n',
              'from .structured_content import (\n    create_structured_content,\n    structured_content_index,\n    structured_content_state,\n    update_structured_content,\n)\nfrom .source_text import (\n',
          )
          one(
              'def create_content_item(name: object, display_name: object = "", tooltip: object = "") -> dict:\n',
              'def structured_content_catalog() -> dict:\n    return structured_content_index(project_root())\n\n\ndef structured_content_file(relative: str) -> dict:\n    return structured_content_state(project_root(), relative)\n\n\ndef create_structured_content_file(kind: object, name: object, values: object, display_name: object = "", description: object = "") -> dict:\n    return create_structured_content(project_root(), kind, name, values, display_name, description)\n\n\ndef save_structured_content_file(relative: str, values: object, expected_sha256: str) -> dict:\n    return update_structured_content(project_root(), relative, values, expected_sha256)\n\n\ndef create_content_item(name: object, display_name: object = "", tooltip: object = "") -> dict:\n',
          )
          one(
              '"build-metadata", "localization", "source-text", "assets", "content-wizard",\n',
              '"build-metadata", "localization", "source-text", "assets", "content-wizard", "structured-content",\n',
          )
          one(
              '            elif path == "/api/source":\n',
              '            elif path == "/api/content":\n                self.send_json(structured_content_catalog())\n            elif path == "/api/content/file":\n                self.send_json(structured_content_file(self._query_path(parsed, "Structured content")))\n            elif path == "/api/source":\n',
          )
          one(
              '            if path == "/api/content/system":\n',
              '            if path == "/api/content/create":\n                payload = self.read_json()\n                if not isinstance(payload, dict) or set(payload) != {"kind", "name", "values", "displayName", "description"}:\n                    raise ValueError("Expected kind, name, values, displayName and description only")\n                if not isinstance(payload["kind"], str) or not isinstance(payload["name"], str) or not isinstance(payload["values"], dict) or not isinstance(payload["displayName"], str) or not isinstance(payload["description"], str):\n                    raise ValueError("Invalid structured content create request")\n                self.send_json(create_structured_content_file(payload["kind"], payload["name"], payload["values"], payload["displayName"], payload["description"]))\n                return\n            if path == "/api/content/file":\n                payload = self.read_json()\n                if not isinstance(payload, dict) or set(payload) != {"path", "values", "expectedSha256"}:\n                    raise ValueError("Expected path, values and expectedSha256 only")\n                if not isinstance(payload["path"], str) or not isinstance(payload["values"], dict) or not isinstance(payload["expectedSha256"], str):\n                    raise ValueError("Invalid structured content save request")\n                self.send_json(save_structured_content_file(payload["path"], payload["values"], payload["expectedSha256"]))\n                return\n            if path == "/api/content/system":\n',
          )
          path.write_text(text,encoding='utf-8')

          Path('tests/test_terraria_structured_content_service.py').write_text(r'''from __future__ import annotations

import os
from pathlib import Path
import tempfile
import unittest

from games.terraria import server


class TerrariaStructuredContentServiceTests(unittest.TestCase):
    def test_selected_project_create_catalog_open_save_and_stale_guard(self):
        previous=os.environ.get("LEXEDITOR_TERRARIA_PROJECT")
        try:
            with tempfile.TemporaryDirectory() as directory:
                root=Path(directory)/"ExampleMod"; root.mkdir()
                os.environ["LEXEDITOR_TERRARIA_PROJECT"]=str(root)
                created=server.create_structured_content_file(
                    "npc","CaveBug",{"lifeMax":300,"damage":21},"Cave Bug",""
                )
                self.assertEqual(created["kind"],"npc")
                self.assertEqual(created["path"],"Content/NPCs/CaveBug.cs")
                catalog=server.structured_content_catalog()
                self.assertEqual(catalog["files"][0]["path"],created["path"])
                self.assertIn("npc",{schema["kind"] for schema in catalog["schemas"]})
                opened=server.structured_content_file(created["path"])
                values=dict(opened["values"]); values["lifeMax"]=999
                saved=server.save_structured_content_file(opened["path"],values,opened["sha256"])
                self.assertEqual(saved["values"]["lifeMax"],999)
                with self.assertRaisesRegex(ValueError,"changed outside Lexeditor"):
                    server.save_structured_content_file(opened["path"],values,opened["sha256"])
        finally:
            if previous is None: os.environ.pop("LEXEDITOR_TERRARIA_PROJECT",None)
            else: os.environ["LEXEDITOR_TERRARIA_PROJECT"]=previous

    def test_invalid_kind_and_path_fail_closed(self):
        previous=os.environ.get("LEXEDITOR_TERRARIA_PROJECT")
        try:
            with tempfile.TemporaryDirectory() as directory:
                root=Path(directory)/"ExampleMod"; root.mkdir()
                os.environ["LEXEDITOR_TERRARIA_PROJECT"]=str(root)
                with self.assertRaisesRegex(ValueError,"Unsupported structured content kind"):
                    server.create_structured_content_file("bossWizard","Thing",{},"","")
                with self.assertRaisesRegex(ValueError,"Invalid C# source path"):
                    server.structured_content_file("../Outside.cs")
        finally:
            if previous is None: os.environ.pop("LEXEDITOR_TERRARIA_PROJECT",None)
            else: os.environ["LEXEDITOR_TERRARIA_PROJECT"]=previous


if __name__ == "__main__":
    unittest.main()
''',encoding='utf-8')
          PY
          python -m compileall -q games/terraria plugin_api.py project_manager.py
          python -m unittest discover -s tests -p 'test_terraria_*.py'
          git diff --check
      - name: Commit service integration
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/terraria-structured-service-patch.yml
          git add games/terraria/server.py tests/test_terraria_structured_content_service.py
          git commit -m 'Expose Terraria structured content service'
          git push origin HEAD:feature/terraria-plugin
