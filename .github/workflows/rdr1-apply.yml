name: Apply reviewed RDR1 edits
on:
  push:
    branches: [fix/rdr1-editor-runtime-handoff]
    paths: ['.github/workflows/rdr1-apply.yml']
permissions:
  contents: write
concurrency:
  group: rdr1-reviewed-edit-transfer
  cancel-in-progress: false
jobs:
  apply:
    if: github.ref == 'refs/heads/fix/rdr1-editor-runtime-handoff' && github.actor == 'Lexer-Lux'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out this isolated branch without optional gitlinks
        run: |
          git init .
          git -c protocol.version=2 fetch --depth=1 "https://github.com/${GITHUB_REPOSITORY}.git" "$GITHUB_SHA"
          git checkout --detach FETCH_HEAD
      - name: Apply only the exact source versions checked locally
        shell: python
        run: |
          import hashlib, pathlib, subprocess
          before = {
            'games/rdr/server.py': 'e9f50d77b24fef0c77387c5526d6998b7f96addec2a50b80d7786e72ac651eba',
            'games/rdr/mission_rewards.py': 'c6c4207c1499c15d68802d98d3a2a840fb1743844ba73a0d06a9e0aa21502487',
            'games/rdr/editor.html': 'b9af4f33acf358c9fc0b65790261c7c94f0e78872e13d53c5812755dda855e5b',
            'games/rdr/plugin.py': 'e9ea976821a173a06e8981774964c9ef1c105288413849bef6a04cd282160c4d'}
          after = {
            'games/rdr/server.py': 'd3f9d53c9cef8da871593ca3805f5613d2c2e7a4c15f9eae0fffdbac35cd224d',
            'games/rdr/mission_rewards.py': '31e580eba61fec31b51088cc20247562c83a29c15368b53366718cc68939f961',
            'games/rdr/editor.html': 'b241e6833e407924d04ae1cdf348bea7249c9b6448f38d134452e803c8e51e64',
            'games/rdr/plugin.py': '41a54e0c27a34ed14fb76911dec91797de1c0c89425dc5fd7c761c96c9f54c4c'}
          for name, expected in before.items():
              assert hashlib.sha256(pathlib.Path(name).read_bytes()).hexdigest() == expected, name
          subprocess.run(['python', '.github/rdr1-server-edit.py'], check=True)
          subprocess.run(['python', '.github/rdr1-ui-edit.py'], check=True)
          for name, expected in after.items():
              assert hashlib.sha256(pathlib.Path(name).read_bytes()).hexdigest() == expected, name
      - name: Verify before committing
        run: |
          python -m compileall -q games/rdr
          python tools/verify_rdr_editing.py
          python tools/verify_rdr_cache_reuse_71.py
          python tools/verify_rdr_items_split_issue_19.py
          git diff --check
      - name: Record scope and remove temporary edit scripts
        shell: python
        run: |
          from pathlib import Path
          entries = {
            331: 'Workspace handoff remains incomplete. The setup screen now lists actual XML/WGD/INI/JSON write locations and distinguishes workspace Save from verified game delivery. Native loader path and installed build provenance remain unverified. No in-game test requested.',
            337: 'Implemented strict numeric/boolean/index/schema validation, item bounds and observed enum choices, exact float32 shop price normalization, whole-resource verification before replacing an override, full numeric preflight before multi-tab saves, fractional-loot validation, optional-evidence rendering, optional runtime JSON recovery, and correct loot discard. Added portable unit/browser fixtures. Remaining scope includes coverage and real native delivery. The branch is not installed on the user PC.',
            341: 'Reproduced decimal PriceModifier failure: Python float64 input 1.1 differs from WGD float32 readback, and the old path published before reporting failure. Fixed canonical comparison, shortest round-trip decimal display, and unpack/full-byte verification before backup/publish. Tests corrupt an unedited byte and preserve both override and prior backup. Codec fixtures do not prove RSC85/game delivery. Named shop/item, actual deployment/revert and game check remain incomplete.',
            344: 'Mission API rejects boolean/fractional/string IDs, noninteger schema versions, malformed override containers and invalid rewards. Browser preflight rejects empty reward input rather than silently saving zero. Tests save/reset mission 2 cash/honor in a temporary project and preserve the generated source table. Generator region index fixed. Native reward delivery and reproducible starting save remain unverified.',
            19: 'Existing Items/Shops/Missions split retained. Added synthetic-fixture browser checks for side-by-side bounds, complete last rows and no horizontal overflow at 1600x900 and 1280x720. Existing source-contract verifier passes. Local Chromium HTTP navigation is administratively blocked, so no local rendered acceptance is claimed; the PR browser job must supply rendered evidence. Installed WebView2/player review is separate.',
            55: 'Existing RDR cache verifier passes with synthetic valid cache, invalid XML/header and missing unpacked-resource cases. No installed RDR/FF8 cache is available, so the optional real-install repeated-startup branch did not run. No FF8 code changed and the existing player checklist is not claimed confirmed.',
            333: 'Read live crash comments. Tab access violation and failed centering/time-scale logs do not identify a faulting instruction. The configured runtime repo Lexer-Lux/rdr-overhaul redirects to Lexer-Lux/Lexers-Mod-For-RDR and its contents endpoint reports empty. Native source is not in Lexeditor; default runtime root is C:\\RDRMod. No native patch, installed build or game retest performed. Editor input validation does not establish a weapon-wheel crash fix.'}
          root = Path('worklog/issues')
          root.mkdir(parents=True, exist_ok=True)
          for issue, text in entries.items():
              (root / f'github-{issue}.md').write_text(f'# RDR1 issue #{issue}\n\n## 2026-09-06\n\n{text}\n\nBranch: `fix/rdr1-editor-runtime-handoff`.\n', encoding='utf-8')
          (root / 'rdr1-sweep-2026-09-06.md').write_text('''# RDR1 sweep — 2026-09-06

          All 17 open rdr1 issue bodies reviewed. No issue is closed by this pass.
          #331/#337 editor handoff and safety: partial fixes, actual delivery remains.
          #341 shop and #344 mission: editor repair/tests only, not end-to-end game tests.
          #19 split layout: source check passes; browser CI and installed review are distinct.
          #55 cache: synthetic RDR checks pass, real startup/FF8 checks not performed.
          #333 crash: history reviewed; native fault site/source unavailable, no repair claimed.
          #334 horse marker/icons, #335 shop quantity wheel, #336 camera bindings,
          #338 carriage rest, #342 cover shoulder swap, #343 first-person V and #345 Skip/Travel:
          native implementation/reference source is absent. None is implemented by this patch.
          #332 dev mode, #339 startup logos and #340 money/ammo HUD: issue bodies describe
          existing installed candidates; no new build or human test was performed.

          The configured runtime repository redirects to Lexer-Lux/Lexers-Mod-For-RDR,
          whose GitHub contents endpoint reports an empty repository. C:\\RDRMod is the
          configured external runtime root. Library search found no usable source archive.
          Missing source does not establish unfeasibility; keep remaining agent work actionable.
          Source/PR/CI success is not delivery and must not by itself become untested.

          Verification: 18 unit test methods plus subcases pass; the same tests fail on the
          original source. Existing RDR cache and split source contracts pass. Test data and
          the resource codec are synthetic, not installed game assets or an RSC85 compressor.
          Local browser HTTP navigation was administratively blocked; browser CI is required.
          ''', encoding='utf-8')
          Path('.github/rdr1-server-edit.py').unlink()
          Path('.github/rdr1-ui-edit.py').unlink()
      - name: Commit only RDR changes and fast-forward this branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: python
        run: |
          import os, subprocess, base64
          files = ['games/rdr/server.py', 'games/rdr/mission_rewards.py', 'games/rdr/editor.html', 'games/rdr/plugin.py', '.github/rdr1-server-edit.py', '.github/rdr1-ui-edit.py']
          subprocess.run(['git', 'config', 'user.name', 'github-actions[bot]'], check=True)
          subprocess.run(['git', 'config', 'user.email', '41898282+github-actions[bot]@users.noreply.github.com'], check=True)
          subprocess.run(['git', 'add', '--', *files], check=True)
          subprocess.run(['git', 'add', '-f', '--', 'worklog/issues'], check=True)
          subprocess.run(['git', 'commit', '-m', 'fix(rdr1): validate edits and verify shop resources before publishing'], check=True)
          auth = base64.b64encode(('x-access-token:' + os.environ['GH_TOKEN']).encode()).decode()
          subprocess.run(['git', '-c', 'http.https://github.com/.extraheader=AUTHORIZATION: basic ' + auth,
                          'push', 'https://github.com/' + os.environ['GITHUB_REPOSITORY'] + '.git',
                          'HEAD:refs/heads/fix/rdr1-editor-runtime-handoff'], check=True)
