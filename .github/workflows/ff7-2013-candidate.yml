name: FF7 2013 candidate

on:
  pull_request:
    paths:
      - 'plugins/ff7_2013/**'
      - 'tools/verify_ff7_2013_rendered.py'
      - 'tools/verify_ff7_2013_adapter.py'
      - '.github/workflows/ff7-2013-candidate.yml'

permissions:
  contents: read

concurrency:
  group: ff7-2013-candidate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-candidate:
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - name: Check out the exact PR head
        shell: bash
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          git init .
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git -c protocol.version=2 fetch --no-tags --depth=1 origin "$HEAD_SHA"
          git checkout --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "$HEAD_SHA"

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install pinned application and packaging dependencies
        run: |
          python -m pip install --disable-pip-version-check -r requirements.txt
          python -m pip install --disable-pip-version-check PyInstaller==6.22.3

      - name: Build and smoke portable Lexeditor
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          python -c "from tools.build_distribution import build_app, smoke; executable=build_app(); smoke(executable)"

      - name: Add candidate identity and acceptance steps
        shell: pwsh
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          $ErrorActionPreference = 'Stop'
          $candidate = 'dist/Lexeditor'
          @'
          FF7 2013 candidate
          =================
          PR: #486
          Platform: Windows x64 portable PyInstaller folder
          PyInstaller: 6.22.3
          Build smoke: tools.build_distribution.smoke passed before artifact upload.

          This candidate does not install to C:\Lexeditor and must be extracted to a new folder.

          Acceptance setup
          ----------------
          1. Extract this artifact to a new folder such as:
               %USERPROFILE%\Downloads\Lexeditor-FF7-2013-PR486
             Do not copy it over C:\Lexeditor or any existing Lexeditor installation.

          2. Open PowerShell in the extracted Lexeditor folder and set:
               $env:LEXEDITOR_FF7_2013_ROOT = '<Steam FF7 folder containing ff7_en.exe>'
               $env:LEXEDITOR_FF7_2013_PROJECT = "$env:LOCALAPPDATA\Lexeditor-Acceptance\ff7-2013\project"
               $env:LEXEDITOR_FF7_2013_DATA_ROOT = "$env:LOCALAPPDATA\Lexeditor-Acceptance\ff7-2013\data"

          3. Before editing, record the installed English kernel hash:
               Get-FileHash "$env:LEXEDITOR_FF7_2013_ROOT\data\lang-en\kernel\KERNEL.BIN" -Algorithm SHA256

          4. Run:
               .\Lexeditor.exe
             Open Final Fantasy 7 (Original) / FFVII 2013.

          5. Check Data Map and open representative structured screens:
             Items, Armor, Enemies, Field Encounters, Text, and FFNx Tweaks if FFNx.toml exists.
             Missing source families should remain visibly unavailable rather than disappearing.

          6. In Armor, change one bounded Defense value, Save, close Lexeditor, reopen this same
             portable candidate, and confirm the project value persists.

          7. Make a second unsaved change and use Discard. Confirm the saved value returns.

          8. Re-run Get-FileHash on the installed KERNEL.BIN. It must match step 3.
             Current project saves are not game deployment. Executable-backed changes remain project-only.

          Report the screen/category, exact control, expected/actual value, and any visible error for a failure.
          '@ | Set-Content -Encoding UTF8 "$candidate/FF7-2013-ACCEPTANCE.txt"
          $env:HEAD_SHA | Set-Content -Encoding ASCII "$candidate/FF7-2013-SOURCE-HEAD.txt"

      - name: Upload isolated portable candidate
        uses: actions/upload-artifact@v4
        with:
          name: ff7-2013-windows-candidate
          path: dist/Lexeditor/
          retention-days: 7
          if-no-files-found: error


  rendered-discard:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out the exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-test.txt

      - name: Install rendered-test dependencies
        run: |
          python -m pip install --disable-pip-version-check -r requirements-test.txt
          python -m playwright install --with-deps chromium

      - name: Verify FF7 2013 adapter source isolation
        run: python tools/verify_ff7_2013_adapter.py

      - name: Exercise FF7 2013 Discard in the real shared UI
        run: python tools/verify_ff7_2013_rendered.py

      - name: Retain FF7 2013 Discard screenshots
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ff7-2013-rendered-discard
          path: out/ff7-2013-acceptance/
          retention-days: 7
          if-no-files-found: error
