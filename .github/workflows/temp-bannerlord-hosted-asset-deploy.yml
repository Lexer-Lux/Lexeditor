name: Temporary Bannerlord hosted asset deployment

on:
  push:
    branches: [feature/bannerlord-plugin]
    paths:
      - '.github/workflows/temp-bannerlord-hosted-asset-deploy.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/bannerlord-plugin
      - name: Apply guarded hosted asset deployment patch
        run: python tools/temp_bannerlord_hosted_asset_deploy.py
      - name: Add regression
        run: |
          cat > tests/test_bannerlord_hosted_asset_deploy.py <<'PY'
          from pathlib import Path
          import unittest
          import xml.etree.ElementTree as ET

          from games.bannerlord import paths


          class BannerlordHostedAssetDeployTests(unittest.TestCase):
              def test_packaged_asset_copy_target_is_suppressed_only_for_hosted_builds(self):
                  template = paths.PLUGIN_ROOT / "template" / "BannerlordModule.csproj"
                  root = ET.parse(template).getroot()
                  target = next(
                      child for child in root
                      if child.tag.rsplit("}", 1)[-1] == "Target"
                      and child.attrib.get("Name") == "CopyModuleFiles"
                  )
                  condition = target.attrib.get("Condition", "")
                  self.assertIn("LexeditorSkipAssetDeploy", condition)
                  self.assertIn("!= 'true'", condition)
                  tasks = [child.tag.rsplit("}", 1)[-1] for child in target]
                  self.assertIn("Copy", tasks)


          if __name__ == "__main__":
              unittest.main()
          PY
      - name: Validate hosted asset deployment ownership
        run: |
          python -m compileall -q games/bannerlord
          python -m unittest tests.test_bannerlord_build_install tests.test_bannerlord_project_template tests.test_bannerlord_hosted_asset_deploy tests.test_bannerlord_deploy_preflight tests.test_bannerlord_deploy -v
      - name: Commit hosted asset deployment ownership
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add games/bannerlord/project_data.py games/bannerlord/template/BannerlordModule.csproj tests/test_bannerlord_build_install.py tests/test_bannerlord_hosted_asset_deploy.py
          git commit -m "Keep hosted asset deployment transactional"
          git push origin HEAD:feature/bannerlord-plugin
