name: Finish Terraria structured editor pass

on:
  push:
    branches: [feature/terraria-plugin]
    paths:
      - '.github/workflows/terraria-finish-patch.yml'

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply final structured pass
        run: python .github/scripts/terraria_finish_patch.py
      - name: Verify Terraria
        run: |
          python -m compileall -q games/terraria plugin_api.py project_manager.py
          python -m unittest discover -s tests -p 'test_terraria_*.py'
          python -c "from pathlib import Path; h=Path('games/terraria/editor.html').read_text(encoding='utf-8'); Path('/tmp/terraria-editor.js').write_text(h.split('<script>')[-1].split('</script>',1)[0],encoding='utf-8')"
          node --check /tmp/terraria-editor.js
          git diff --check
      - name: Commit final structured pass
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -f .github/workflows/terraria-finish-patch.yml .github/scripts/terraria_finish_patch.py
          git add games/terraria/content_wizard.py games/terraria/structured_content.py games/terraria/server.py games/terraria/editor.html tests/test_terraria_structured_finish.py
          git commit -m 'Finish Terraria structured content editors'
          git push origin HEAD:feature/terraria-plugin
