name: Finish verified issue comments
on:
  push:
    branches: [fix/global-issues-20260906]
    paths: [.github/workflows/finish-comment-cleanup.yml]
permissions:
  contents: write
  issues: write
concurrency:
  group: lexeditor-knowledge-store
  cancel-in-progress: false
jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          path: controller
          submodules: false
          sparse-checkout: tools/finish_issue_comments.py
          sparse-checkout-cone-mode: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: master
          path: repository
          submodules: false
          sparse-checkout: |
            tools/knowledge_store.py
            worklog
          sparse-checkout-cone-mode: false
      - name: Archive current comment versions; leave codices and active handoffs untouched
        working-directory: repository
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 -m py_compile ../controller/tools/finish_issue_comments.py
          python3 ../controller/tools/finish_issue_comments.py archive
      - name: Commit and verify exact sources before removing visible comments
        working-directory: repository
        run: |
          set -euo pipefail
          git config user.name 'Lexeditor Issue Archive'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f worklog/issues worklog/attachments worklog/migrations/comment-cleanup-plan.json
          if ! git diff --cached --quiet; then
            git commit -m 'Preserve exact comment versions before authorized cleanup; exclude #86 [skip ci]'
            git fetch --no-recurse-submodules origin master
            git -c submodule.recurse=false rebase origin/master
            git push origin HEAD:master
          fi
          git fetch --no-recurse-submodules origin master
          git merge-base --is-ancestor HEAD origin/master
          git diff --exit-code HEAD -- worklog
      - name: Remove only unchanged archived comments with preserved attachments
        working-directory: repository
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 ../controller/tools/finish_issue_comments.py cleanup
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: verified-comment-cleanup-${{ github.run_id }}
          path: |
            repository/comment-cleanup-result.json
            repository/worklog/migrations/comment-cleanup-plan.json
          if-no-files-found: warn
          retention-days: 30
