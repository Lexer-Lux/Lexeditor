name: Dark Souls 3 checks

on:
  push:
    branches:
      - codex/ds3-plugin
    paths:
      - 'games/ds3/**'
      - 'tests/test_ds3_plugin.py'
      - 'tests/ds3_browser_check.py'
      - '.github/workflows/ds3-checks.yml'
  pull_request:
    paths:
      - 'games/ds3/**'
      - 'tests/test_ds3_plugin.py'
      - 'tests/ds3_browser_check.py'
      - '.github/workflows/ds3-checks.yml'

permissions:
  contents: read

jobs:
  source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install DS3 format dependency
        run: python -m pip install 'cryptography>=42'
      - name: Compile DS3 plugin
        run: python -m compileall -q games/ds3 tests/test_ds3_plugin.py tests/ds3_browser_check.py
      - name: JavaScript syntax
        run: |
          node --check games/ds3/editor.js
          node --check games/ds3/boot.js
      - name: DS3 regulation regressions
        run: python -m unittest discover -s tests -p 'test_ds3_plugin.py' -v

  browser:
    runs-on: ubuntu-latest
    needs: source
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install browser dependencies
        run: |
          python -m pip install 'cryptography>=42' playwright
          python -m playwright install --with-deps chromium
      - name: DS3 rendered edit and export acceptance
        run: python tests/ds3_browser_check.py out/ds3-browser
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ds3-browser
          path: out/ds3-browser
          if-no-files-found: warn
