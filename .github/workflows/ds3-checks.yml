name: Dark Souls 3 checks

on:
  push:
    branches:
      - codex/ds3-plugin
    paths:
      - 'plugins/ds3/**'
      - 'tests/test_ds3_plugin.py'
      - 'tests/ds3_browser_check.py'
      - '.github/workflows/ds3-checks.yml'
  pull_request:
    paths:
      - 'plugins/ds3/**'
      - 'tests/test_ds3_plugin.py'
      - 'tests/ds3_browser_check.py'
      - '.github/workflows/ds3-checks.yml'

permissions:
  contents: read

jobs:
  source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install DS3 format dependency
        run: python -m pip install 'cryptography>=42'
      - name: Compile DS3 plugin
        run: python -m compileall -q plugins/ds3 tests/test_ds3_plugin.py tests/ds3_browser_check.py
      - name: JavaScript syntax
        run: |
          node --check plugins/ds3/editor.js
          node --check plugins/ds3/boot.js
      - name: DS3 regulation regressions
        run: python -m unittest discover -s tests -p 'test_ds3_plugin.py' -v

  browser:
    runs-on: ubuntu-latest
    needs: source
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install browser dependencies
        run: |
          python -m pip install 'cryptography>=42' playwright
          python -m playwright install --with-deps chromium
      - name: DS3 rendered edit and export acceptance
        run: python tests/ds3_browser_check.py out/ds3-browser
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ds3-browser
          path: out/ds3-browser
          if-no-files-found: warn


  candidate:
    runs-on: windows-latest
    needs: browser
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build isolated DS3 candidate
        shell: pwsh
        run: |
          $dest = "out/Lexeditor-DS3-PR493"
          New-Item -ItemType Directory -Force -Path $dest | Out-Null
          Get-ChildItem -Path . -Filter *.py -File | Copy-Item -Destination $dest
          Copy-Item requirements.txt -Destination $dest
          Copy-Item assets -Destination $dest -Recurse
          Copy-Item ui -Destination $dest -Recurse
          New-Item -ItemType Directory -Force -Path "$dest/games" | Out-Null
          Copy-Item plugins/__init__.py -Destination "$dest/plugins/__init__.py"
          Copy-Item plugins/ds3 -Destination "$dest/plugins/ds3" -Recurse
          Copy-Item plugins/ds3/candidate/ds3_candidate.py -Destination "$dest/ds3_candidate.py"
          Copy-Item plugins/ds3/candidate/Run-DS3-Candidate.ps1 -Destination "$dest/Run-DS3-Candidate.ps1"
          Copy-Item plugins/ds3/candidate/README-CANDIDATE.md -Destination "$dest/README-CANDIDATE.md"
          python -m pip install --disable-pip-version-check -r "$dest/requirements.txt"
          python "$dest/ds3_candidate.py" --check
          Get-ChildItem -Path $dest -Recurse -File |
            Sort-Object FullName |
            ForEach-Object {
              $relative = $_.FullName.Substring((Resolve-Path $dest).Path.Length + 1)
              $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath $_.FullName).Hash.ToLowerInvariant()
              "$hash  $relative"
            } | Set-Content -Encoding ascii "$dest/SHA256SUMS.txt"
      - uses: actions/upload-artifact@v4
        with:
          name: ds3-candidate-pr493
          path: out/Lexeditor-DS3-PR493
          if-no-files-found: error
          include-hidden-files: true
