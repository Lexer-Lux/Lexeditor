name: Temporary Warband item editor rework
on:
  push:
    branches: [codex/warband-items-icons-detail-20260907]
    paths: ['.github/workflows/tmp-warband-items-editor.yml']
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/warband-items-icons-detail-20260907
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test dependencies
        run: python -m pip install Pillow 'fonttools>=4.59,<5'
      - name: Apply item editor and icon repair
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p=Path('tools/warband/apply_item_editor_rework.py')
          s=p.read_text('utf-8')
          s=s.replace('if char in "([{":[\n', 'if char in "([{":\n')
          p.write_text(s,'utf-8')
          PY
          python tools/warband/apply_item_editor_rework.py
      - name: Verify source and structured item behavior
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile games/warband/server.py games/warband/item_icons.py tests/test_warband_items_editor.py tests/test_warband_batch.py tests/warband_browser_check.py
          python -m unittest tests.test_warband_items_editor -v
          python -m unittest tests.test_warband_batch -v
          python -m unittest tests.test_warband_icon_invalidation -v
          python -m unittest tests.test_data_map_coverage -v
          git diff --check
      - name: Commit verified product changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add games/warband/server.py games/warband/item_icons.py games/warband/editor.html tests/test_warband_items_editor.py tests/test_warband_batch.py tests/warband_browser_check.py
          git commit -m 'Make Warband items editable and auto-orient icons'
          git push origin HEAD:codex/warband-items-icons-detail-20260907
