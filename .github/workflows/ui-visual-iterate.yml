name: UI visual iteration

on:
  push:
    branches: [fix/ui-visual-acceptance-20260906]

permissions:
  contents: read

jobs:
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install browser tools
        run: |
          python -m pip install playwright Pillow
          python -m playwright install --with-deps chromium
      - name: Shared Blank acceptance
        run: python .github/scripts/ui_visual_acceptance.py out/ui-visual-acceptance
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ui-visual-iteration
          path: out/ui-visual-acceptance
          if-no-files-found: warn
          # Temporary branch-only visual loop; remove before merge. Same-slot preview rerun.
