name: Temporary Bannerlord relation save preflight

on:
  push:
    branches: [feature/bannerlord-plugin]
    paths:
      - '.github/workflows/temp-bannerlord-save-relation-preflight.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/bannerlord-plugin
      - name: Add atomic relation declaration preflight
        shell: python
        run: |
          from pathlib import Path

          def replace_once(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected one match, found {count}")
              return text.replace(old, new, 1)

          path = Path("games/bannerlord/module_data.py")
          text = path.read_text(encoding="utf-8")
          text = replace_once(
              text,
              'from .community_metadata import read_community_dependencies\n',
              'from .community_metadata import read_community_dependencies\nfrom .dependency_relations import dependency_declaration_conflicts\n',
              "relation validator import",
          )
          helper = '''\n\ndef _validate_relation_payload(path: Path, payload: dict) -> None:\n    relation_keys = {\n        "dependencies",\n        "communityDependencies",\n        "modulesToLoadAfterThis",\n        "incompatibleModules",\n    }\n    if not relation_keys.intersection(payload):\n        return\n\n    current = read_submodule(path)\n    current_extended = read_community_dependencies(path)\n    proposed = {\n        "dependencies": list(\n            payload.get("dependencies")\n            if "dependencies" in payload\n            else current.get("dependencies", [])\n        ),\n        "modulesToLoadAfterThis": list(\n            payload.get("modulesToLoadAfterThis")\n            if "modulesToLoadAfterThis" in payload\n            else current.get("modulesToLoadAfterThis", [])\n        ),\n        "incompatibleModules": list(\n            payload.get("incompatibleModules")\n            if "incompatibleModules" in payload\n            else current.get("incompatibleModules", [])\n        ),\n    }\n    if "communityDependencies" in payload:\n        structured = [dict(row) for row in list(payload.get("communityDependencies") or [])]\n        for row in structured:\n            row.setdefault("origin", "DependedModuleMetadatas")\n        legacy = [\n            row\n            for row in current_extended\n            if row.get("origin") != "DependedModuleMetadatas"\n        ]\n        extended = structured + legacy\n    else:\n        extended = current_extended\n\n    issues = dependency_declaration_conflicts(proposed, extended)\n    if issues:\n        raise ValueError(\n            "Invalid Bannerlord dependency declarations: " + "; ".join(issues)\n        )\n'''
          marker = '\n\ndef save_module(path: Path, payload: dict) -> dict:\n'
          if text.count(marker) != 1:
              raise SystemExit(f"save helper marker count: {text.count(marker)}")
          at = text.index(marker)
          text = text[:at] + helper + text[at:]
          text = replace_once(
              text,
              '    if unknown:\n        raise ValueError(f"Unsupported SubModule.xml sections: {\', \'.join(sorted(unknown))}")\n    tree = _parse_tree(path)\n',
              '    if unknown:\n        raise ValueError(f"Unsupported SubModule.xml sections: {\', \'.join(sorted(unknown))}")\n    _validate_relation_payload(path, payload)\n    tree = _parse_tree(path)\n',
              "save preflight call",
          )
          path.write_text(text, encoding="utf-8")
      - name: Write save preflight regressions
        run: |
          cat > tests/test_bannerlord_relation_save_preflight.py <<'PY'
          from pathlib import Path
          import tempfile
          import unittest

          from games.bannerlord.module_data import save_module


          BASE = '''<Module>
            <Name value="Example" />
            <Id value="Example" />
            <Version value="v1.0.0" />
            <SingleplayerModule value="true" />
            <DependedModules>
              <DependedModule Id="Library" />
            </DependedModules>
            <ModulesToLoadAfterThis />
            <IncompatibleModules />
            <DependedModuleMetadatas />
          </Module>
          '''


          class BannerlordRelationSavePreflightTests(unittest.TestCase):
              def test_cross_section_before_after_conflict_is_rejected_without_writing(self):
                  with tempfile.TemporaryDirectory() as name:
                      path = Path(name) / "SubModule.xml"
                      path.write_text(BASE, encoding="utf-8")
                      before = path.read_bytes()
                      with self.assertRaisesRegex(ValueError, "both LoadBeforeThis and LoadAfterThis"):
                          save_module(path, {"communityDependencies": [{
                              "id": "Library",
                              "order": "LoadAfterThis",
                              "optional": False,
                              "incompatible": False,
                              "version": "",
                          }]})
                      self.assertEqual(path.read_bytes(), before)
                      self.assertFalse(path.with_name(path.name + ".lexeditor.bak").exists())
                      self.assertFalse(path.with_name(path.name + ".lexeditor.tmp").exists())

              def test_incompatible_ordered_blse_row_is_rejected_without_writing(self):
                  with tempfile.TemporaryDirectory() as name:
                      path = Path(name) / "SubModule.xml"
                      path.write_text(BASE, encoding="utf-8")
                      before = path.read_bytes()
                      with self.assertRaisesRegex(ValueError, "marked incompatible but also declares LoadBeforeThis"):
                          save_module(path, {"communityDependencies": [{
                              "id": "Other",
                              "order": "LoadBeforeThis",
                              "optional": False,
                              "incompatible": True,
                              "version": "",
                          }]})
                      self.assertEqual(path.read_bytes(), before)

              def test_single_payload_can_resolve_existing_cross_section_conflict(self):
                  with tempfile.TemporaryDirectory() as name:
                      path = Path(name) / "SubModule.xml"
                      path.write_text(
                          BASE.replace(
                              '<ModulesToLoadAfterThis />',
                              '<ModulesToLoadAfterThis><Module Id="Library" /></ModulesToLoadAfterThis>',
                          ),
                          encoding="utf-8",
                      )
                      result = save_module(path, {
                          "dependencies": [{
                              "index": 0,
                              "id": "Library",
                              "dependentVersion": "",
                              "optional": False,
                              "attributes": {},
                          }],
                          "modulesToLoadAfterThis": [],
                      })
                      self.assertGreater(result["saved"], 0)
                      self.assertNotIn('<Module Id="Library"', path.read_text(encoding="utf-8"))

              def test_same_direction_duplicate_metadata_remains_saveable(self):
                  with tempfile.TemporaryDirectory() as name:
                      path = Path(name) / "SubModule.xml"
                      path.write_text(BASE.replace('<DependedModules>\n    <DependedModule Id="Library" />\n  </DependedModules>', '<DependedModules />'), encoding="utf-8")
                      result = save_module(path, {"communityDependencies": [
                          {"id": "Library", "order": "LoadBeforeThis", "optional": True, "incompatible": False, "version": ""},
                          {"id": "Library", "order": "LoadBeforeThis", "optional": False, "incompatible": False, "version": ""},
                      ]})
                      self.assertGreater(result["saved"], 0)


          if __name__ == "__main__":
              unittest.main()
          PY
      - name: Validate relation save preflight
        run: |
          python -m compileall -q games/bannerlord
          python -m unittest tests.test_bannerlord_relation_save_preflight tests.test_bannerlord_community_editor tests.test_bannerlord_dependency_declarations tests.test_bannerlord_dependency_relations -v
      - name: Commit relation save preflight
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add games/bannerlord/module_data.py tests/test_bannerlord_relation_save_preflight.py
          git commit -m "Preflight Bannerlord relation saves"
          git push origin HEAD:feature/bannerlord-plugin
