name: One-shot FF9 branch repair 2
on:
  push:
    branches: [codex/ff9-complete-20260906]
    paths: ['.github/workflows/ff9-branch-repair-run2.yml']
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/ff9-complete-20260906
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python tools/ff9/repair_battle_layout.py
      - run: python -m pip install pytest
      - run: |
          python -m compileall -q games/ff9
          python -m pytest -q tests/test_ff9*.py
          node --test tests/ff9_editor.test.cjs
      - name: Commit repaired battle layout
        run: |
          git config user.name 'Lexeditor FF9 Agent'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add games/ff9/battle_scene.py
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Fix FF9 battle scene serialized layout'
          git push origin HEAD:codex/ff9-complete-20260906
