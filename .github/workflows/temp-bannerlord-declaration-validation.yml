name: Temporary Bannerlord dependency declaration validation

on:
  push:
    branches: [feature/bannerlord-plugin]
    paths:
      - '.github/workflows/temp-bannerlord-declaration-validation.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/bannerlord-plugin
      - name: Add declaration conflict validation
        shell: python
        run: |
          from pathlib import Path

          def replace_once(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected one match, found {count}")
              return text.replace(old, new, 1)

          relations = Path("games/bannerlord/dependency_relations.py")
          text = relations.read_text(encoding="utf-8")
          addition = '''\n\ndef dependency_declaration_conflicts(module: dict, extended_rows: list[dict]) -> list[str]:\n    """Return ModuleManager-style contradictions in one module's declarations.\n\n    These checks intentionally inspect direction-specific/raw declaration sets,\n    not only the first-ID-wins effective load set. ModuleManager validates these\n    contradictions separately from sorting.\n    """\n    issues: list[str] = []\n\n    load_ids = {row["id"] for row in effective_load_relations(module, extended_rows)}\n    incompatible_ids = {\n        row["id"] for row in effective_incompatible_relations(module, extended_rows)\n    }\n    for module_id in sorted(load_ids & incompatible_ids, key=str.casefold):\n        issues.append(f"{module_id} is declared both loadable and incompatible")\n\n    before_ids = {\n        _module_id(row)\n        for row in extended_rows\n        if row.get("order") == "LoadBeforeThis" and _module_id(row)\n    }\n    before_ids.update(\n        _module_id(row)\n        for row in module.get("dependencies", [])\n        if _module_id(row)\n    )\n    after_ids = {\n        _module_id(row)\n        for row in extended_rows\n        if row.get("order") == "LoadAfterThis" and _module_id(row)\n    }\n    after_ids.update(\n        _module_id(row)\n        for row in module.get("modulesToLoadAfterThis", [])\n        if _module_id(row)\n    )\n    for module_id in sorted(before_ids & after_ids, key=str.casefold):\n        issues.append(f"{module_id} is declared both LoadBeforeThis and LoadAfterThis")\n\n    for row in extended_rows:\n        module_id = _module_id(row)\n        order = str(row.get("order") or "")\n        if module_id and row.get("incompatible") and order in {"LoadBeforeThis", "LoadAfterThis"}:\n            issues.append(f"{module_id} is marked incompatible but also declares {order}")\n\n    return list(dict.fromkeys(issues))\n'''
          marker = '\n\ndef effective_incompatible_relations(module: dict, extended_rows: list[dict]) -> list[dict]:\n'
          if text.count(marker) != 1:
              raise SystemExit(f"relation insertion marker count: {text.count(marker)}")
          at = text.index(marker)
          text = text[:at] + addition + text[at:]
          relations.write_text(text, encoding="utf-8")

          launch = Path("games/bannerlord/game_launch.py")
          text = launch.read_text(encoding="utf-8")
          text = replace_once(
              text,
              'from .dependency_relations import effective_incompatible_relations, effective_load_relations\n',
              'from .dependency_relations import (\n    dependency_declaration_conflicts,\n    effective_incompatible_relations,\n    effective_load_relations,\n)\n',
              "launch relation imports",
          )
          old = '''    def incompatible_relations(module_id: str) -> list[str]:\n        return [\n            row["id"]\n            for row in effective_incompatible_relations(metadata(module_id), community(module_id))\n        ]\n\n    included: set[str] = set()\n'''
          new = '''    def incompatible_relations(module_id: str) -> list[str]:\n        return [\n            row["id"]\n            for row in effective_incompatible_relations(metadata(module_id), community(module_id))\n        ]\n\n    declaration_cache: dict[str, list[str]] = {}\n\n    def declaration_issues(module_id: str) -> list[str]:\n        if module_id in declaration_cache:\n            return declaration_cache[module_id]\n        issues = dependency_declaration_conflicts(metadata(module_id), community(module_id))\n        for relation in dependencies_to_load(module_id):\n            related_id = str(relation.get("id") or "").strip()\n            order = str(relation.get("order") or "")\n            if not related_id or order not in {"LoadBeforeThis", "LoadAfterThis"} or related_id not in modules:\n                continue\n            reverse = next(\n                (\n                    row\n                    for row in dependencies_to_load(related_id)\n                    if str(row.get("id") or "").strip() == module_id\n                    and str(row.get("order") or "") in {"LoadBeforeThis", "LoadAfterThis"}\n                ),\n                None,\n            )\n            if reverse is not None and str(reverse.get("order") or "") == order:\n                issues.append(\n                    f"{module_id} and {related_id} have circular {order} dependency declarations"\n                )\n        declaration_cache[module_id] = list(dict.fromkeys(issues))\n        return declaration_cache[module_id]\n\n    included: set[str] = set()\n'''
          text = replace_once(text, old, new, "launch declaration validator")
          text = replace_once(
              text,
              '        visiting.add(module_id)\n        for dependency in dependencies_to_load(module_id):\n',
              '        visiting.add(module_id)\n        invalid = declaration_issues(module_id)\n        if invalid:\n            raise RuntimeError(\n                f"Invalid Bannerlord dependency declarations in {module_id}: " + "; ".join(invalid)\n            )\n        for dependency in dependencies_to_load(module_id):\n',
              "launch declaration gate",
          )
          launch.write_text(text, encoding="utf-8")

          runtime = Path("games/bannerlord/runtime_data.py")
          text = runtime.read_text(encoding="utf-8")
          text = replace_once(
              text,
              'from .dependency_relations import incompatible_relation_rows, load_relation_rows\n',
              'from .dependency_relations import (\n    dependency_declaration_conflicts,\n    incompatible_relation_rows,\n    load_relation_rows,\n)\n',
              "runtime relation imports",
          )
          text = replace_once(
              text,
              '    dependency_rows = []\n    missing_required = []\n',
              '    declaration_issues = dependency_declaration_conflicts(module, community_dependencies)\n    for issue in declaration_issues:\n        issues.append(f"Dependency declaration conflict: {issue}")\n\n    dependency_rows = []\n    missing_required = []\n',
              "runtime declaration issues",
          )
          text = replace_once(
              text,
              '        and not missing_required\n        and not missing_binaries\n',
              '        and not declaration_issues\n        and not missing_required\n        and not missing_binaries\n',
              "runtime runnable declaration gate",
          )
          text = replace_once(
              text,
              '        "dependencies": dependency_rows,\n        "binaries": binaries,\n',
              '        "dependencies": dependency_rows,\n        "dependencyDeclarationIssues": declaration_issues,\n        "binaries": binaries,\n',
              "runtime declaration field",
          )
          runtime.write_text(text, encoding="utf-8")
      - name: Update precedence expectations and add declaration regressions
        shell: python
        run: |
          from pathlib import Path

          path = Path("tests/test_bannerlord_dependency_precedence.py")
          text = path.read_text(encoding="utf-8")
          text = text.replace(
              '            self.assertEqual(module_load_order(game, workspace(root)), ["Selected", "Library"])\n',
              '            with self.assertRaisesRegex(RuntimeError, "both LoadBeforeThis and LoadAfterThis"):\n                module_load_order(game, workspace(root))\n',
              1,
          )
          text = text.replace(
              '                {"id":"Library","order":"LoadAfterThis"},\n            ])\n            self.assertEqual(module_load_order(game, workspace(root)), ["Selected"])\n',
              '                {"id":"Library","order":"LoadBeforeThis"},\n            ])\n            self.assertEqual(module_load_order(game, workspace(root)), ["Selected"])\n',
              1,
          )
          text = text.replace(
              '                {"id":"Library","order":"LoadAfterThis"},\n            ])\n            self.assertEqual(module_load_order(game, workspace(root)), ["Library", "Selected"])\n',
              '                {"id":"Library","order":"LoadBeforeThis","optional":True},\n            ])\n            self.assertEqual(module_load_order(game, workspace(root)), ["Library", "Selected"])\n',
              1,
          )
          text = text.replace(
              '            self.assertEqual(module_load_order(game, workspace(root)), ["Library", "Selected"])\n\n\nif __name__ == "__main__":\n',
              '            with self.assertRaisesRegex(RuntimeError, "both LoadBeforeThis and LoadAfterThis"):\n                module_load_order(game, workspace(root))\n\n\nif __name__ == "__main__":\n',
              1,
          )
          path.write_text(text, encoding="utf-8")

          Path("tests/test_bannerlord_dependency_declarations.py").write_text('''from pathlib import Path\nimport tempfile\nimport unittest\n\nfrom games.bannerlord.dependency_relations import dependency_declaration_conflicts\nfrom games.bannerlord.game_launch import module_load_order\n\n\ndef module_model(*, dependencies=(), load_after=(), incompatible=()):\n    return {\n        "dependencies": [{"id": value, "optional": optional} for value, optional in dependencies],\n        "modulesToLoadAfterThis": [{"id": value} for value in load_after],\n        "incompatibleModules": [{"id": value} for value in incompatible],\n    }\n\n\ndef write_module(game: Path, module_id: str, *, dependencies=(), incompatible=()) -> Path:\n    folder = game / "Modules" / module_id\n    folder.mkdir(parents=True, exist_ok=True)\n    deps = "\\n".join(\n        f'    <DependedModule Id="{dep_id}"{\' Optional="true"\' if optional else ""} />'\n        for dep_id, optional in dependencies\n    )\n    inc = "\\n".join(f'    <Module Id="{value}" />' for value in incompatible)\n    (folder / "SubModule.xml").write_text(\n        f''' + '"""' + '''<Module>\n  <Name value="{module_id}" />\n  <Id value="{module_id}" />\n  <Version value="v1.0.0" />\n  <SingleplayerModule value="true" />\n  <DependedModules>\n{deps}\n  </DependedModules>\n  <IncompatibleModules>\n{inc}\n  </IncompatibleModules>\n</Module>\n''' + '"""' + ''',\n        encoding="utf-8",\n    )\n    return folder\n\n\nclass BannerlordDependencyDeclarationTests(unittest.TestCase):\n    def test_loadable_and_incompatible_is_a_declaration_conflict_even_when_optional(self):\n        issues = dependency_declaration_conflicts(\n            module_model(dependencies=(("Library", True),), incompatible=("Library",)),\n            [],\n        )\n        self.assertTrue(any("both loadable and incompatible" in issue for issue in issues))\n\n    def test_before_and_after_is_a_declaration_conflict_before_sorting(self):\n        issues = dependency_declaration_conflicts(\n            module_model(dependencies=(("Library", False),), load_after=("Library",)),\n            [],\n        )\n        self.assertTrue(any("both LoadBeforeThis and LoadAfterThis" in issue for issue in issues))\n\n    def test_raw_blse_incompatible_order_is_a_declaration_conflict(self):\n        issues = dependency_declaration_conflicts(\n            module_model(),\n            [{\n                "id": "Library",\n                "order": "LoadBeforeThis",\n                "optional": False,\n                "incompatible": True,\n                "origin": "DependedModuleMetadatas",\n            }],\n        )\n        self.assertTrue(any("marked incompatible but also declares LoadBeforeThis" in issue for issue in issues))\n\n    def test_optional_circular_declarations_are_rejected_without_enabling_optional_target(self):\n        with tempfile.TemporaryDirectory() as name:\n            root = Path(name)\n            game = root / "game"\n            write_module(game, "Library", dependencies=(("Selected", True),))\n            write_module(game, "Selected", dependencies=(("Library", True),))\n            workspace = root / "workspace"\n            workspace.mkdir()\n            (workspace / "SubModule.xml").write_text('<Module><Id value="Selected" /></Module>', encoding="utf-8")\n            with self.assertRaisesRegex(RuntimeError, "circular LoadBeforeThis dependency declarations"):\n                module_load_order(game, workspace)\n\n    def test_optional_loadable_and_incompatible_target_is_rejected_even_if_not_installed(self):\n        with tempfile.TemporaryDirectory() as name:\n            root = Path(name)\n            game = root / "game"\n            write_module(\n                game,\n                "Selected",\n                dependencies=(("Missing.Optional", True),),\n                incompatible=("Missing.Optional",),\n            )\n            workspace = root / "workspace"\n            workspace.mkdir()\n            (workspace / "SubModule.xml").write_text('<Module><Id value="Selected" /></Module>', encoding="utf-8")\n            with self.assertRaisesRegex(RuntimeError, "both loadable and incompatible"):\n                module_load_order(game, workspace)\n\n\nif __name__ == "__main__":\n    unittest.main()\n''', encoding="utf-8")
      - name: Validate declaration semantics
        run: |
          python -m compileall -q games/bannerlord
          python -m unittest tests.test_bannerlord_dependency_declarations tests.test_bannerlord_dependency_relations tests.test_bannerlord_dependency_precedence tests.test_bannerlord_launch tests.test_bannerlord_community_metadata tests.test_bannerlord_dependency_diagnostics tests.test_bannerlord_shadowed_dependency_diagnostics -v
      - name: Commit declaration validation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add games/bannerlord/dependency_relations.py games/bannerlord/game_launch.py games/bannerlord/runtime_data.py tests/test_bannerlord_dependency_precedence.py tests/test_bannerlord_dependency_declarations.py
          git commit -m "Validate Bannerlord dependency declarations"
          git push origin HEAD:feature/bannerlord-plugin
