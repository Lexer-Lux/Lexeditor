name: Project Zomboid checks

on:
  push:
    branches: [master]
    paths:
      - 'plugins/project_zomboid/**'
      - 'tests/test_project_zomboid*.py'
      - 'tests/fixtures/project_zomboid_acceptance/**'
      - 'tools/verify_project_zomboid_ui.py'
      - 'codex/project-zomboid/acceptance.md'
      - 'worklog/acceptance/project-zomboid/pr-463.md'
      - 'runtime_bootstrap.py'
      - 'ui/credits-sources.json'
      - 'ui/credits.json'
      - 'ui/mod-loading.json'
      - '.github/workflows/project-zomboid-checks.yml'
  pull_request:
    paths:
      - 'plugins/project_zomboid/**'
      - 'tests/test_project_zomboid*.py'
      - 'tests/fixtures/project_zomboid_acceptance/**'
      - 'tools/verify_project_zomboid_ui.py'
      - 'codex/project-zomboid/acceptance.md'
      - 'worklog/acceptance/project-zomboid/pr-463.md'
      - 'runtime_bootstrap.py'
      - 'ui/credits-sources.json'
      - 'ui/credits.json'
      - 'ui/mod-loading.json'
      - '.github/workflows/project-zomboid-checks.yml'

permissions:
  contents: read

concurrency:
  group: project-zomboid-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  project-zomboid:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Project Zomboid regressions
        run: python -m unittest discover -v -s tests -p 'test_project_zomboid*.py'
      - name: Project Zomboid service smoke
        run: python -c "from plugins.project_zomboid.plugin import smoke; [print(line) for line in smoke()]"
      - name: Python syntax
        run: python -m compileall -q plugins/project_zomboid tests
      - name: Editor JavaScript syntax
        run: node --check plugins/project_zomboid/editor.js
      - name: Plugin metadata
        run: python plugin_metadata.py
      - name: Offline credits are current
        run: python tools/generate_credits.py --check


  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-test.txt
      - name: Install rendered UI dependencies
        run: python -m pip install -r requirements-test.txt
      - name: Install Chromium
        run: python -m playwright install --with-deps chromium
      - name: Project Zomboid rendered UI acceptance
        run: python tools/verify_project_zomboid_ui.py --screenshots _scratch/project-zomboid-ui
      - name: Keep rendered UI evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: project-zomboid-ui-${{ github.event.pull_request.head.sha || github.sha }}
          path: _scratch/project-zomboid-ui
          retention-days: 14
          if-no-files-found: ignore

  windows-candidate:
    if: github.event_name == 'pull_request'
    needs: [project-zomboid, browser]
    runs-on: windows-latest
    timeout-minutes: 35
    env:
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - name: Check out the exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Check candidate build space
        shell: pwsh
        run: |
          $drive = Get-PSDrive -Name (Get-Location).Drive.Name
          $freeGiB = [math]::Round($drive.Free / 1GB, 1)
          Write-Host "Candidate build expects under 5 GiB; runner has $freeGiB GiB free."
          if ($drive.Free -lt 10GB) { throw "Less than 10 GiB free before candidate build." }

      - name: Install packaging dependencies
        shell: pwsh
        run: |
          python -m pip install -r requirements.txt
          python -m pip install pyinstaller==6.16.0
          if (-not (Test-Path 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe')) {
            choco install innosetup -y --no-progress
          }

      - name: Build Windows installer
        run: python tools/build_distribution.py

      - name: Install and smoke the packaged candidate
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $installer = (Resolve-Path 'dist\installers\Lexeditor-0.1.0-windows-setup.exe').Path
          $installRoot = Join-Path $env:RUNNER_TEMP 'Lexeditor-PZ-PR463'
          $install = Start-Process -FilePath $installer -ArgumentList @(
            '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART',"/DIR=$installRoot"
          ) -Wait -PassThru
          if ($install.ExitCode -ne 0) { throw "Installer exited $($install.ExitCode)" }
          $exe = Join-Path $installRoot 'Lexeditor.exe'
          if (-not (Test-Path $exe)) { throw "Installed Lexeditor.exe is missing" }

          $env:LEXEDITOR_NO_AUTO_SCAN = '1'
          $serviceResult = Join-Path $env:RUNNER_TEMP 'pz-candidate-service-smoke.json'
          $service = Start-Process -FilePath $exe -ArgumentList @('--smoke-service', $serviceResult) -Wait -PassThru
          if ($service.ExitCode -ne 0) { throw "Installed service smoke exited $($service.ExitCode)" }
          $report = Get-Content $serviceResult -Raw | ConvertFrom-Json
          if (-not $report.passed -or -not $report.childStopped -or
              -not ($report.plugins -contains 'project-zomboid')) {
            throw "Installed service smoke did not confirm the Project Zomboid plugin"
          }

          $pz = Start-Process -FilePath $exe -ArgumentList @('--game','project-zomboid','--smoke') -Wait -PassThru
          if ($pz.ExitCode -ne 0) { throw "Installed Project Zomboid smoke exited $($pz.ExitCode)" }

      - name: Assemble acceptance candidate
        shell: pwsh
        run: |
          $short = $env:HEAD_SHA.Substring(0,12)
          "CANDIDATE_SHORT=$short" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          New-Item -ItemType Directory -Force candidate | Out-Null
          $sourceInstaller = 'dist\installers\Lexeditor-0.1.0-windows-setup.exe'
          $candidateInstaller = "candidate\Lexeditor-PR463-project-zomboid-$short.exe"
          Copy-Item $sourceInstaller $candidateInstaller
          Copy-Item 'tests\fixtures\project_zomboid_acceptance' 'candidate\Project-Zomboid-Acceptance-Mod' -Recurse
          Copy-Item 'worklog\acceptance\project-zomboid\pr-463.md' 'candidate\ACCEPTANCE.md'
          $hash = (Get-FileHash $candidateInstaller -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $(Split-Path $candidateInstaller -Leaf)" | Set-Content 'candidate\SHA256SUMS.txt'
          [ordered]@{
            pullRequest = 463
            branch = 'project-zomboid-plugin'
            headSha = $env:HEAD_SHA
            builtAtUtc = (Get-Date).ToUniversalTime().ToString('o')
            installedServiceSmoke = $true
            installedProjectZomboidSmoke = $true
          } | ConvertTo-Json | Set-Content 'candidate\candidate.json'

      - name: Upload installed-test candidate
        uses: actions/upload-artifact@v4
        with:
          name: project-zomboid-pr463-windows-${{ env.CANDIDATE_SHORT }}
          path: candidate
          retention-days: 14
          if-no-files-found: error
