name: Project Zomboid checks

on:
  push:
    branches: [master]
    paths:
      - 'games/project_zomboid/**'
      - 'tests/test_project_zomboid*.py'
      - 'runtime_bootstrap.py'
      - 'ui/credits-sources.json'
      - 'ui/credits.json'
      - 'ui/mod-loading.json'
      - '.github/workflows/project-zomboid-checks.yml'
  pull_request:
    paths:
      - 'games/project_zomboid/**'
      - 'tests/test_project_zomboid*.py'
      - 'runtime_bootstrap.py'
      - 'ui/credits-sources.json'
      - 'ui/credits.json'
      - 'ui/mod-loading.json'
      - '.github/workflows/project-zomboid-checks.yml'

permissions:
  contents: write

jobs:
  regenerate-credits:
    if: github.event_name == 'pull_request' && github.head_ref == 'project-zomboid-plugin'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Regenerate offline credits and restore workflow
        shell: bash
        run: |
          python tools/generate_credits.py
          git checkout HEAD^ -- .github/workflows/project-zomboid-checks.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ui/credits.json .github/workflows/project-zomboid-checks.yml
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Regenerate offline credits for Project Zomboid"
          git push origin HEAD:project-zomboid-plugin

  project-zomboid:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Project Zomboid regressions
        run: python -m unittest discover -v -s tests -p 'test_project_zomboid*.py'
      - name: Project Zomboid service smoke
        run: python -c "from games.project_zomboid.plugin import smoke; [print(line) for line in smoke()]"
      - name: Python syntax
        run: python -m compileall -q games/project_zomboid tests
      - name: Plugin metadata
        run: python plugin_metadata.py
      - name: Offline credits are current
        run: python tools/generate_credits.py --check
