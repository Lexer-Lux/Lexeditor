name: Project Zomboid checks

on:
  push:
    branches: [master]
    paths:
      - 'games/project_zomboid/**'
      - 'tests/test_project_zomboid*.py'
      - 'runtime_bootstrap.py'
      - 'ui/credits-sources.json'
      - 'ui/credits.json'
      - 'ui/mod-loading.json'
      - '.github/workflows/project-zomboid-checks.yml'
  pull_request:
    paths:
      - 'games/project_zomboid/**'
      - 'tests/test_project_zomboid*.py'
      - 'runtime_bootstrap.py'
      - 'ui/credits-sources.json'
      - 'ui/credits.json'
      - 'ui/mod-loading.json'
      - '.github/workflows/project-zomboid-checks.yml'

permissions:
  contents: read

concurrency:
  group: project-zomboid-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  project-zomboid:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Project Zomboid regressions
        run: python -m unittest discover -v -s tests -p 'test_project_zomboid*.py'
      - name: Project Zomboid service smoke
        run: python -c "from games.project_zomboid.plugin import smoke; [print(line) for line in smoke()]"
      - name: Python syntax
        run: python -m compileall -q games/project_zomboid tests
      - name: Editor JavaScript syntax
        run: |
          python -c "from pathlib import Path; text=Path('games/project_zomboid/editor.html').read_text(encoding='utf-8'); js=text.rsplit('<script>',1)[1].split('</script>',1)[0]; Path('.project-zomboid-editor.js').write_text(js,encoding='utf-8')"
          node --check .project-zomboid-editor.js
      - name: Plugin metadata
        run: python plugin_metadata.py
      - name: Offline credits are current
        run: python tools/generate_credits.py --check
