name: Project Zomboid checks

on:
  push:
    branches: [master]
    paths:
      - 'games/project_zomboid/**'
      - 'tests/test_project_zomboid*.py'
      - 'runtime_bootstrap.py'
      - 'ui/credits-sources.json'
      - 'ui/credits.json'
      - 'ui/mod-loading.json'
      - '.github/workflows/project-zomboid-checks.yml'
  pull_request:
    paths:
      - 'games/project_zomboid/**'
      - 'tests/test_project_zomboid*.py'
      - 'runtime_bootstrap.py'
      - 'ui/credits-sources.json'
      - 'ui/credits.json'
      - 'ui/mod-loading.json'
      - '.github/workflows/project-zomboid-checks.yml'

permissions:
  contents: read

jobs:
  project-zomboid:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Project Zomboid regressions
        run: python -m unittest discover -v -s tests -p 'test_project_zomboid*.py'
      - name: Python syntax
        run: python -m compileall -q games/project_zomboid
      - name: Plugin metadata
        run: python plugin_metadata.py
      - name: Offline credits are current
        run: python tools/generate_credits.py --check
