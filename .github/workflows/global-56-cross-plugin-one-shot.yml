name: Global 56 cross-plugin one-shot

on:
  push:
    branches:
      - fix/global-56-info-bubble-centering

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/global-56-info-bubble-centering
          fetch-depth: 0
      - name: Apply exact reviewed patch
        run: python maintenance/global-56/harden-all-plugins.py
      - name: Commit repaired cross-plugin contract
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "Keep shared info bubbles global across plugins (#56)"
          git push origin HEAD:fix/global-56-info-bubble-centering
