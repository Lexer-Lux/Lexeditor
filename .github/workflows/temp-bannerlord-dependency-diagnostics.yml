name: Temporary Bannerlord dependency diagnostics patch

on:
  push:
    branches: [feature/bannerlord-plugin]
    paths:
      - '.github/workflows/temp-bannerlord-dependency-diagnostics.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/bannerlord-plugin
      - name: Patch dependency provenance diagnostics
        shell: python
        run: |
          from pathlib import Path

          def replace_once(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected one match, found {count}")
              return text.replace(old, new, 1)

          runtime = Path("games/bannerlord/runtime_data.py")
          text = runtime.read_text(encoding="utf-8")
          text = replace_once(
              text,
              '                "source": "native",\n                "order": "LoadBeforeThis",\n',
              '                "source": "native",\n                "origin": "DependedModules",\n                "order": "LoadBeforeThis",\n',
              "native provenance",
          )
          text = replace_once(
              text,
              '                "source": "community",\n                "order": dependency.get("order") or "",\n',
              '                "source": "community" if dependency.get("origin") == "DependedModuleMetadatas" else "extended",\n                "origin": dependency.get("origin") or "DependedModuleMetadatas",\n                "order": dependency.get("order") or "",\n',
              "extended provenance",
          )
          runtime.write_text(text, encoding="utf-8")

          ui = Path("games/bannerlord/editor_balancing.js")
          text = ui.read_text(encoding="utf-8")
          helper = '''\n  function dependencyDiagnosticLine(row){\n    let source="Native dependency";\n    if(row.origin==="DependedModuleMetadatas")source="BLSE metadata";\n    else if(row.origin==="LoadAfterModules")source="Legacy LoadAfterModules";\n    else if(String(row.origin||"").startsWith("OptionalDependModules/")||row.origin==="DependedModules/OptionalDependModule")source="Launcher optional dependency";\n    const details=[source];\n    if(row.order==="LoadBeforeThis")details.push("loads before this");\n    else if(row.order==="LoadAfterThis")details.push("loads after this");\n    if(row.optional)details.push("optional");\n    if(row.incompatible)details.push("incompatible");\n    if(row.overriddenByCommunityMetadata)details.push("native row overridden by extended metadata");\n    if(row.requiredVersion)details.push(`requires ${row.requiredVersion}`);\n    if(row.installedVersion)details.push(`installed ${row.installedVersion}`);\n    if(row.versionMatch===true)details.push("version OK");\n    else if(row.versionMatch===false)details.push("VERSION MISMATCH");\n    return `${row.installed?"✓":"✗"} ${row.id} — ${details.join(" · ")}`;\n  }\n'''
          text = replace_once(
              text,
              '\n  function renderDeployment(){\n',
              helper + '\n  function renderDeployment(){\n',
              "deployment helper",
          )
          text = replace_once(
              text,
              '        deps.length?el("ul",{},...deps.map(row=>el("li",{},`${row.installed?"✓":"✗"} ${row.id}${row.optional?" (optional)":""}${row.requiredVersion?` requires ${row.requiredVersion}`:""}${row.installedVersion?` · installed ${row.installedVersion}`:""}`))):el("div",{class:"bl-note"},"No declared dependencies.")),\n',
              '        deps.length?el("ul",{},...deps.map(row=>el("li",{},dependencyDiagnosticLine(row)))):el("div",{class:"bl-note"},"No declared dependency relations.")),\n',
              "deployment dependency lines",
          )
          ui.write_text(text, encoding="utf-8")

          test = Path("tests/test_bannerlord_community_metadata.py")
          text = test.read_text(encoding="utf-8")
          needle = '            self.assertFalse(community_row["versionMatch"])\n            self.assertEqual(community_row["order"], "LoadBeforeThis")\n'
          replacement = '            self.assertFalse(community_row["versionMatch"])\n            self.assertEqual(community_row["source"], "community")\n            self.assertEqual(community_row["origin"], "DependedModuleMetadatas")\n            self.assertEqual(community_row["order"], "LoadBeforeThis")\n'
          text = replace_once(text, needle, replacement, "community provenance test")
          test.write_text(text, encoding="utf-8")
      - name: Validate diagnostics
        run: |
          python -m compileall -q games/bannerlord
          python -m unittest tests.test_bannerlord_community_metadata tests.test_bannerlord_community_editor -v
          node --check games/bannerlord/editor_balancing.js
      - name: Commit diagnostics and remove harness
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add games/bannerlord/runtime_data.py games/bannerlord/editor_balancing.js tests/test_bannerlord_community_metadata.py
          git rm .github/workflows/temp-bannerlord-dependency-diagnostics.yml
          git commit -m "Clarify Bannerlord dependency diagnostics"
          git push origin HEAD:feature/bannerlord-plugin
