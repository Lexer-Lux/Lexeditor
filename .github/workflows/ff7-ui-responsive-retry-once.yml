name: FF7 responsive UI retry one-shot

on:
  push:
    branches:
      - work/ff7-complete-kernel-surface
    paths:
      - 'tools/_ff7_ui_responsive_followup.py'

permissions:
  contents: write

jobs:
  apply-test-land:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/ff7-complete-kernel-surface
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Apply responsive FF7 UI repair
        run: |
          python tools/_ff7_ui_responsive_fix.py
          python tools/_ff7_ui_responsive_followup.py
      - name: Verify FF7 source contracts
        run: |
          python tools/verify_ff7_semantic_surface.py
          python tools/verify_ff7_blank_ui.py
      - name: Install Chromium
        run: |
          python -m pip install playwright==1.57.0
          python -m playwright install --with-deps chromium
      - name: Verify full rendered FF7 surface
        run: |
          python tools/verify_ff7_rendered_neutral.py
          python tools/verify_ff7_exe_rendered.py
          python tools/_ff7_ui_visual_audit.py
      - name: Commit tested responsive repair and remove scaffolds
        shell: bash
        run: |
          git rm tools/_ff7_ui_responsive_fix.py tools/_ff7_ui_responsive_followup.py tools/_ff7_ui_visual_audit.py .github/workflows/ff7-ui-responsive-fix-once.yml .github/workflows/ff7-ui-responsive-retry-once.yml .github/workflows/ff7-ui-visual-audit-once.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add games/ff7/editor.html tools/verify_ff7_rendered.py tools/verify_ff7_rendered_neutral.py
          git commit -m 'Finish FF7 responsive detail layouts'
          git push origin HEAD:work/ff7-complete-kernel-surface
