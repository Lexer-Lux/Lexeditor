name: Prepare native analysis tools
on:
  push:
    branches: [fix/ff8-native-battle-batch]
    paths: [.github/workflows/native-test-tools.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Download analysis wheels (no game data)
        run: python -m pip download --only-binary=:all: --dest tools-wheels pefile==2024.8.26 capstone==5.0.6 unicorn==2.1.4
      - name: Read pinned upstream source
        run: |
          git init ffnx
          git -C ffnx remote add origin https://github.com/julianxhokaxhiu/FFNx.git
          git -C ffnx fetch --depth=1 origin c056db2783f376a340fcefa6a48cc33618998876
          git -C ffnx checkout --detach FETCH_HEAD
          git -C ffnx archive --format=zip --output=../ffnx-source.zip HEAD
      - uses: actions/upload-artifact@v4
        with:
          name: native-analysis-tools
          path: |
            tools-wheels/
            ffnx-source.zip
          retention-days: 1
