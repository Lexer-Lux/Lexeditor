name: Publish reviewed managed WSE2
on:
  push:
    branches: [fix/warband-managed-wse2]
    paths: ['.github/workflows/wse2-publish-reviewed.yml']
permissions:
  contents: read
jobs:
  publish:
    if: github.ref == 'refs/heads/fix/warband-managed-wse2'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply exact reviewed source patch
        run: |
          python - <<'PY'
          import base64, hashlib, lzma, pathlib, subprocess
          encoded=''.join(pathlib.Path(f'.github/wse2-reviewed.patch.b64.{i}').read_text().strip() for i in range(4))
          patch=lzma.decompress(base64.b64decode(encoded,validate=True))
          assert hashlib.sha256(patch).hexdigest()=='2a448fb3730cf92863eef251fe3eb1e620bc20c23f584b8d4c9a902f0500afdf', 'Reviewed source checksum differs'
          paths=[line[6:] for line in patch.decode().splitlines() if line.startswith('+++ b/')]
          allowed={'desktop_host.py','game_installation.py','plugin_api.py','ui/chooser.html'}
          assert len(paths)==19 and all(p in allowed or p.startswith(('games/warband/','tests/','tools/','codex/warband/','docs/','worklog/issues/')) for p in paths)
          subprocess.run(['git','diff','--exit-code','ebe1a343102ddf770888a38ad0c6330961d07d82','HEAD','--',*paths],check=True)
          subprocess.run(['git','apply','--index','--check','-'],input=patch,check=True)
          subprocess.run(['git','apply','--index','-'],input=patch,check=True)
          PY
      - name: Reproduce the exact offline package from pinned publisher bytes
        run: |
          python - <<'PY'
          import hashlib, pathlib, urllib.request
          data=urllib.request.urlopen('https://github.com/Ruslan-700/WSE2-Releases/releases/download/v1.1.5.1/WSE2.zip',timeout=90).read()
          assert hashlib.sha256(data).hexdigest()=='755cbe31bd757595a1e83aea120029d5b35e0c41bd377413eb39d395b3cff503'
          pathlib.Path('/tmp/WSE2-pinned.zip').write_bytes(data)
          PY
          python tools/build_wse2_bundle.py /tmp/WSE2-pinned.zip
          git diff --exit-code -- games/warband/runtime/manifest.json
          git add -f games/warband/runtime/wse2-1.1.5.1-lex1.zip
      - run: python -m pip install Pillow 'fonttools>=4.59,<5'
      - name: Verify before committing
        run: |
          python -m compileall -q games/warband desktop_host.py plugin_api.py game_installation.py
          python -m unittest discover -s tests -p 'test_wse2*.py' -v
          python -m unittest discover -s tests -p 'test_warband*.py' -v
          python -m unittest discover -s tests -p test_data_map_coverage.py -v
          node tests/test_warband_trees.js
          git diff --cached --check
      - name: Commit only the reviewed sources and verified package
        run: |
          git rm .github/wse2-reviewed.patch.b64.*
          git config user.name 'Lexer'
          git config user.email '89482099+Lexer-Lux@users.noreply.github.com'
          git commit -m 'Bundle pinned WSE2 with guarded offline installation and Home version reporting'
          git push origin HEAD:fix/warband-managed-wse2
