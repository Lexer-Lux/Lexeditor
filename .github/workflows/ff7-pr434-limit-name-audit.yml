name: FF7 PR 434 Limit/name audit

on:
  push:
    branches:
      - work/ff7-complete-kernel-surface

permissions:
  contents: write

jobs:
  apply-test-land:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/ff7-complete-kernel-surface
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Apply Limit/name audit fixes
        run: |
          python tools/_ff7_limit_name_audit_patch.py
          python tools/_ff7_limit_name_audit_fix.py
      - name: Compile changed Python
        run: python -m py_compile games/ff7/kernel.py games/ff7/kernel_extra.py games/ff7/extended.py games/ff7/semantics.py games/ff7/storage.py tools/verify_ff7_datasets.py tools/verify_ff7_extended.py tools/verify_ff7_semantic_surface.py tools/verify_ff7_rendered_neutral.py
      - name: Verify binary and semantic contracts
        run: |
          python tools/verify_ff7_datasets.py
          python tools/verify_ff7_kernel_layout_contract.py
          python tools/verify_ff7_accessories.py
          python tools/verify_ff7_semantic_surface.py
          python tools/verify_ff7_extended.py
          python tools/verify_ff7_completion.py
          python tools/verify_ff7_edition_parity.py
          python tools/verify_ff7_blank_ui.py
      - name: Install Chromium
        run: |
          python -m pip install playwright==1.57.0
          python -m playwright install --with-deps chromium
      - name: Verify rendered Limit/name semantics
        run: python tools/verify_ff7_rendered_neutral.py
      - name: Commit tested Limit/name audit
        shell: bash
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add games/ff7/kernel.py games/ff7/kernel_extra.py games/ff7/extended.py games/ff7/semantics.py games/ff7/storage.py games/ff7/editor.html tools/verify_ff7_datasets.py tools/verify_ff7_extended.py tools/verify_ff7_semantic_surface.py tools/verify_ff7_rendered_neutral.py
          git commit -m 'Correct FF7 Limit data and make KERNEL names editable'
          git push origin HEAD:work/ff7-complete-kernel-surface
