name: Apply and validate Enemies UI
on:
  push:
    branches: [fix/ff8-enemies-layout]
    paths: [.github/workflows/apply-enemies-layout.yml]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Fetch exact source revision without initializing unrelated gitlinks
        env:
          REVISION: ${{ github.sha }}
        run: |
          git init editor
          git -C editor remote add origin https://github.com/Lexer-Lux/Lexeditor.git
          git -C editor fetch --depth=1 origin "$REVISION"
          git -C editor checkout --detach FETCH_HEAD
      - name: Apply hash-checked UI patch
        working-directory: editor
        run: |
          python - <<'PY'
          import base64, hashlib, pathlib, subprocess, zlib
          root = pathlib.Path('.')
          encoded = ''.join((root / f'.github/enemies-layout.{i}').read_text() for i in range(3))
          patch = zlib.decompress(base64.b64decode(encoded, validate=True))
          assert hashlib.sha256(patch).hexdigest() == 'e11be6fc1899ee8f2e572a11d9729edf113784dcd25964b05ee311961ebf6ec8'
          expected = {
              '.github/workflows/enemies-layout.yml', 'codex/ff8-enemy-controls.md',
              'games/ff8/card_art.py', 'games/ff8/editor.html', 'games/ff8/enemies_ui.css',
              'games/ff8/enemies_ui.js', 'games/ff8/paths.py', 'games/ff8/server.py',
              'tools/verify_ff8_card_art.py', 'tools/verify_ff8_enemies_editor_issue_39.py',
              'tools/verify_ff8_enemies_editor_visual_39.py', 'tools/verify_ff8_enemies_layout.py',
          }
          paths = [line[6:] for line in patch.decode().splitlines() if line.startswith('+++ b/')]
          assert len(paths) == len(expected) and set(paths) == expected
          subprocess.run(['git', 'apply', '--check', '-'], input=patch, check=True)
          subprocess.run(['git', 'apply', '-'], input=patch, check=True)
          (root / '.enemy-ui-paths').write_text('\n'.join(sorted(expected)) + '\n')
          PY
      - name: Browser and editor test dependencies
        run: |
          python -m pip install pillow fonttools playwright
          python -m playwright install --with-deps chromium
      - name: Execute full editor, persistence, artwork and search regressions
        working-directory: editor
        run: |
          python tools/verify_ff8_enemies_layout.py
          python tools/verify_ff8_card_art.py
          python tools/verify_ff8_ui_battle_regressions.py
          python -m compileall -q games/ff8 tools/verify_ff8_enemies_layout.py tools/verify_ff8_card_art.py
          node --check games/ff8/enemies_ui.js
          python - <<'PY'
          import pathlib, re, subprocess
          text = pathlib.Path('games/ff8/editor.html').read_text(encoding='utf-8')
          for script in re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>', text, re.S | re.I):
              subprocess.run(['node', '--check'], input=script, text=True, check=True)
          PY
          git diff --check
      - name: Commit only tested UI files and remove staging files
        working-directory: editor
        env:
          GH_TOKEN: ${{ github.token }}
          REPAIR_BRANCH: fix/ff8-enemies-layout
        run: |
          git config user.name 'Lexeditor repair'
          git config user.email '89482099+Lexer-Lux@users.noreply.github.com'
          git add --pathspec-from-file=.enemy-ui-paths
          git rm -- .github/enemies-layout.0 .github/enemies-layout.1 .github/enemies-layout.2 .github/workflows/apply-enemies-layout.yml
          git commit -m 'Compact FF8 enemy controls, add card artwork, and preserve canonical table edits'
          AUTH=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $AUTH" push origin "HEAD:refs/heads/$REPAIR_BRANCH"
          unset AUTH
