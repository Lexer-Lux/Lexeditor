name: Apply RDR1 runtime repository link
on:
  push:
    branches: [fix/rdr1-runtime-repo-link]
    paths: ['.github/workflows/rdr1-fix-runtime-link.yml']
permissions:
  contents: write
jobs:
  apply:
    if: github.actor == 'Lexer-Lux'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out exact branch tip without optional gitlinks
        run: |
          git init .
          git -c protocol.version=2 fetch --depth=1 "https://github.com/${GITHUB_REPOSITORY}.git" "$GITHUB_SHA"
          git checkout --detach FETCH_HEAD
      - name: Point RDR1 plugin at its actual runtime repository
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('games/rdr/plugin.py')
          s=p.read_text()
          old='full_name="Lexer-Lux/rdr-overhaul"'
          new='full_name="Lexer-Lux/Lexers-Mod-For-RDR"'
          if s.count(old) != 1:
              raise SystemExit('expected exactly one stale RDR repository link')
          p.write_text(s.replace(old,new))
          PY
          python -m py_compile games/rdr/plugin.py
          git rm .github/workflows/rdr1-fix-runtime-link.yml
      - name: Commit exact metadata repair
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add games/rdr/plugin.py
          git commit -m "fix(rdr1): point Lexeditor at the populated runtime repository"
          AUTH=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $AUTH" push https://github.com/${GITHUB_REPOSITORY}.git HEAD:refs/heads/fix/rdr1-runtime-repo-link
