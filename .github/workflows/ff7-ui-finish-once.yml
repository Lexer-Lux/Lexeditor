name: FF7 UI finish one-shot

on:
  push:
    branches:
      - work/ff7-complete-kernel-surface
    paths:
      - 'tools/_ff7_ui_finish_once.py'
      - 'tools/_ff7_ui_finish_fix.py'

permissions:
  contents: write

jobs:
  apply-test-land:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/ff7-complete-kernel-surface
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Apply FF7 finishing pass
        run: |
          python tools/_ff7_ui_finish_once.py
          python tools/_ff7_ui_finish_fix.py
      - name: Verify FF7 source contracts
        run: |
          python tools/verify_ff7_semantic_surface.py
          python tools/verify_ff7_blank_ui.py
      - name: Install Chromium
        run: |
          python -m pip install playwright==1.57.0
          python -m playwright install --with-deps chromium
      - name: Verify FF7 rendered UI
        run: |
          python tools/verify_ff7_rendered_neutral.py
          python tools/verify_ff7_exe_rendered.py
      - name: Commit tested finishing pass and remove scaffold
        shell: bash
        run: |
          git rm tools/_ff7_ui_finish_once.py tools/_ff7_ui_finish_fix.py .github/workflows/ff7-ui-finish-once.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add games/ff7/editor.html tools/verify_ff7_rendered_neutral.py
          git commit -m 'Finish FF7 high-value detail views'
          git push origin HEAD:work/ff7-complete-kernel-surface
