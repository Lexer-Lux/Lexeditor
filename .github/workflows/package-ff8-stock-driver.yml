name: Package reviewed FF8 stock driver
on:
  push:
    branches: [fix/ff8-backlog-runtime]
    paths: [.github/workflows/package-ff8-stock-driver.yml]
permissions:
  contents: read
  actions: read
jobs:
  package:
    runs-on: windows-2025-vs2026
    timeout-minutes: 15
    permissions:
      contents: write
      actions: read
    env:
      PYTHONUTF8: '1'
    steps:
      - name: Fetch exact source and pinned FFNx base
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          git config --global core.autocrlf false
          git config --global core.longpaths true
          git init editor
          git -C editor remote add origin https://github.com/Lexer-Lux/Lexeditor.git
          git -C editor fetch --depth=1 origin $env:GITHUB_SHA
          git -C editor checkout --detach FETCH_HEAD
          git init ffnx
          git -C ffnx remote add origin https://github.com/julianxhokaxhiu/FFNx.git
          git -C ffnx fetch --depth=1 origin c056db2783f376a340fcefa6a48cc33618998876
          git -C ffnx checkout --detach FETCH_HEAD
      - uses: actions/download-artifact@v4
        with:
          name: ff8-stock-driver-candidate
          run-id: 34042052122
          github-token: ${{ github.token }}
          path: candidate
      - name: Verify reviewed binary and publish complete provenance
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          python -m pip install pillow fonttools pefile==2024.8.26 unicorn==2.1.4
          @'
          from pathlib import Path
          p=Path('editor/tools/package_ff8_native_driver.py')
          code=p.read_text(encoding='utf-8')
          old='The full command sequence is in `.github/workflows/native-dependencies.yml`.'
          assert code.count(old)==1
          p.write_text(code.replace(old,'The full command sequence is in `.github/workflows/ff8-stock-build.yml`.'),encoding='utf-8',newline='\n')
          '@ | python -
          python editor/tools/package_ff8_native_driver.py --candidate candidate --ffnx-source ffnx --driver-sha256 b44009f4421f278ea10afc6f53e3f9e21cfdffbdcfd7332da89d01a61c41b250 --build-revision a1b76a19379e0356782a0c0dcbb3ba4e264ab93b --build-run 34042052122
          python editor/tools/verify_ff8_no_magic_consumption.py --driver editor/games/ff8/ffnx_issue_51/package/AF3DN.P
          python editor/tools/verify_ff8_native_package.py
          python editor/tools/verify_ff8_stock_tweak_settings.py
          python editor/tools/verify_ff8_gf_bar_settings.py
          python editor/tools/verify_ff8_mug_drops.py
      - name: Commit only the verified package and report correction
        working-directory: editor
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          git add games/ff8/ffnx_issue_51/package/AF3DN.P games/ff8/ffnx_issue_51/package/COPYING.TXT games/ff8/ffnx_issue_51/package/ISSUE51_DERIVATIVE_SOURCE.patch games/ff8/ffnx_issue_51/package/ISSUE51_BUILD_REPORT.md games/ff8/ffnx_issue_51/package/runtime-manifest.json games/ff8/ffnx_issue_51/runtime_package.py tools/package_ff8_native_driver.py
          git rm .github/workflows/package-ff8-stock-driver.yml
          git config user.name 'Lexeditor runtime repair'
          git config user.email '89482099+Lexer-Lux@users.noreply.github.com'
          git commit -m 'Package verified shared-stock Party Switch, configurable caps and no-consumption driver'
          $auth=[Convert]::ToBase64String([Text.Encoding]::UTF8.GetBytes("x-access-token:$env:GH_TOKEN"))
          Write-Output "::add-mask::$auth"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth" push origin HEAD:refs/heads/fix/ff8-backlog-runtime
          Remove-Variable auth
          git archive --format=zip --output=../ff8-stock-delivery-source.zip HEAD games/ff8 ui tools codex worklog .gitattributes .github
      - uses: actions/upload-artifact@v4
        with:
          name: ff8-stock-delivery-source
          path: ff8-stock-delivery-source.zip
          retention-days: 2
          if-no-files-found: error
