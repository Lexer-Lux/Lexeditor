name: Bannerlord relations patch runner

on:
  push:
    branches: [feature/bannerlord-plugin]
    paths:
      - '.github/workflows/bannerlord-submodule-relations-patch2.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/bannerlord-plugin
      - name: Apply patch
        run: python tools/_bannerlord_relations_patch.py
      - name: Check syntax
        run: |
          python -m py_compile games/bannerlord/module_data.py
          node --check games/bannerlord/editor_core.js
      - name: Commit patch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add games/bannerlord/module_data.py games/bannerlord/editor_core.js
          git commit -m "Edit Bannerlord inverse module relations"
          git push origin HEAD:feature/bannerlord-plugin
