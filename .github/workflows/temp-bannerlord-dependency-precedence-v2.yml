name: Temporary Bannerlord dependency precedence validation v2

on:
  push:
    branches: [feature/bannerlord-plugin]
    paths:
      - '.github/workflows/temp-bannerlord-dependency-precedence-v2.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/bannerlord-plugin
      - name: Reuse guarded resolver transform
        shell: python
        run: |
          from pathlib import Path
          import textwrap

          workflow = Path('.github/workflows/temp-bannerlord-dependency-precedence.yml').read_text(encoding='utf-8')
          section = workflow.split('      - name: Apply ModuleManager distinct-precedence resolver\n', 1)[1]
          section = section.split('      - name: Write precedence regressions\n', 1)[0]
          code = textwrap.dedent(section.split('        run: |\n', 1)[1])
          exec(compile(code, 'dependency-precedence-transform.py', 'exec'))
      - name: Replace obsolete duplicate-edge cycle regression
        shell: python
        run: |
          from pathlib import Path

          path = Path('tests/test_bannerlord_launch.py')
          text = path.read_text(encoding='utf-8')
          old = '''            write_module(game, "Library", "Library")
                      write_module(
                          game,
                          "LexerSkillTweaks",
                          "LexerSkillTweaks",
                          (("Library", False),),
                          load_after=("Library",),
                      )
          '''
          new = '''            write_module(
                          game,
                          "Library",
                          "Library",
                          (("LexerSkillTweaks", True),),
                      )
                      write_module(
                          game,
                          "LexerSkillTweaks",
                          "LexerSkillTweaks",
                          (("Library", False),),
                      )
          '''
          # The YAML/Python indentation is intentionally removed from both literals.
          import textwrap
          old = textwrap.dedent(old)
          new = textwrap.dedent(new)
          if text.count(old) != 1:
              raise SystemExit(f'cycle fixture match count: {text.count(old)}')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
      - name: Write precedence regressions
        run: |
          cat > tests/test_bannerlord_dependency_precedence.py <<'PY'
          from pathlib import Path
          import tempfile
          import unittest

          from games.bannerlord.game_launch import module_load_order


          def write_module(game: Path, module_id: str, *, native=(), native_after=(), community=()) -> Path:
              folder = game / "Modules" / module_id
              folder.mkdir(parents=True, exist_ok=True)
              native_xml = "\n".join(f'    <DependedModule Id="{value}" />' for value in native)
              after_xml = "\n".join(f'    <Module Id="{value}" />' for value in native_after)
              community_xml = "\n".join(
                  "    <DependedModuleMetadata " + " ".join(part for part in (
                      f'id="{row["id"]}"',
                      f'order="{row.get("order", "")}"' if row.get("order") else "",
                      'optional="true"' if row.get("optional") else "",
                  ) if part) + " />"
                  for row in community
              )
              (folder / "SubModule.xml").write_text(f'''<Module>
            <Id value="{module_id}" />
            <Name value="{module_id}" />
            <Version value="v1.0.0" />
            <SingleplayerModule value="true" />
            <DependedModules>
          {native_xml}
            </DependedModules>
            <ModulesToLoadAfterThis>
          {after_xml}
            </ModulesToLoadAfterThis>
            <DependedModuleMetadatas>
          {community_xml}
            </DependedModuleMetadatas>
          </Module>
          ''', encoding="utf-8")
              return folder


          def workspace(root: Path) -> Path:
              value = root / "workspace"
              value.mkdir()
              (value / "SubModule.xml").write_text('<Module><Id value="Selected" /></Module>', encoding="utf-8")
              return value


          class BannerlordDependencyPrecedenceTests(unittest.TestCase):
              def test_community_load_after_overrides_duplicate_native_dependency_edge(self):
                  with tempfile.TemporaryDirectory() as name:
                      root = Path(name); game = root / "game"
                      write_module(game, "Library")
                      write_module(game, "Selected", native=("Library",), community=[{"id":"Library","order":"LoadAfterThis"}])
                      self.assertEqual(module_load_order(game, workspace(root)), ["Selected", "Library"])

              def test_first_community_duplicate_optional_row_wins_requiredness(self):
                  with tempfile.TemporaryDirectory() as name:
                      root = Path(name); game = root / "game"
                      write_module(game, "Library")
                      write_module(game, "Selected", community=[
                          {"id":"Library","order":"LoadBeforeThis","optional":True},
                          {"id":"Library","order":"LoadAfterThis"},
                      ])
                      self.assertEqual(module_load_order(game, workspace(root)), ["Selected"])

              def test_first_community_duplicate_order_wins_without_creating_cycle(self):
                  with tempfile.TemporaryDirectory() as name:
                      root = Path(name); game = root / "game"
                      write_module(game, "Library")
                      write_module(game, "Selected", community=[
                          {"id":"Library","order":"LoadBeforeThis"},
                          {"id":"Library","order":"LoadAfterThis"},
                      ])
                      self.assertEqual(module_load_order(game, workspace(root)), ["Library", "Selected"])

              def test_native_dependency_precedes_duplicate_native_load_after_relation(self):
                  with tempfile.TemporaryDirectory() as name:
                      root = Path(name); game = root / "game"
                      write_module(game, "Library")
                      write_module(game, "Selected", native=("Library",), native_after=("Library",))
                      self.assertEqual(module_load_order(game, workspace(root)), ["Library", "Selected"])


          if __name__ == "__main__":
              unittest.main()
          PY
      - name: Validate precedence fix
        run: |
          python -m compileall -q games/bannerlord
          python -m unittest tests.test_bannerlord_dependency_precedence tests.test_bannerlord_community_metadata tests.test_bannerlord_launch -v
      - name: Commit precedence fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add games/bannerlord/game_launch.py tests/test_bannerlord_dependency_precedence.py tests/test_bannerlord_launch.py
          git commit -m "Match BUTR dependency distinct precedence"
          git push origin HEAD:feature/bannerlord-plugin
