name: Validate native battle repair
on:
  push:
    branches: [fix/ff8-native-battle-batch]
    paths: [.github/workflows/apply-native-repair.yml]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Fetch exact source revision
        env:
          REVISION: ${{ github.sha }}
        run: |
          git init editor
          git -C editor remote add origin https://github.com/Lexer-Lux/Lexeditor.git
          git -C editor fetch --depth=1 origin "$REVISION"
          git -C editor checkout --detach FETCH_HEAD
      - name: Apply reviewed source patch
        working-directory: editor
        run: |
          python - <<'PY'
          import base64, hashlib, pathlib, subprocess, zlib
          root = pathlib.Path('.')
          encoded = ''.join((root / f'.github/native-batch.{i}').read_text() for i in range(3))
          patch = zlib.decompress(base64.b64decode(encoded, validate=True))
          assert hashlib.sha256(patch).hexdigest() == '7ae1408dbb9a3908650bfeab1d852973bc18b48d8c86c4018043546cd0a80e62'
          subprocess.run(['git', 'apply', '--check', '-'], input=patch, check=True)
          subprocess.run(['git', 'apply', '-'], input=patch, check=True)
          paths = [line[6:] for line in patch.decode().splitlines() if line.startswith('+++ b/')]
          assert len(paths) == 15 and all(p.startswith(('games/ff8/', 'tools/')) and '..' not in pathlib.PurePosixPath(p).parts for p in paths)
          (root / '.native-paths').write_text('\n'.join(paths) + '\n')
          PY
      - name: Execute compiled production policy and settings tests
        working-directory: editor
        run: |
          python tools/verify_ff8_native_compiled.py
          python tools/verify_ff8_gf_bar_settings.py
          python -m compileall -q games/ff8 tools/prepare_ff8_native_build.py tools/verify_ff8_native_battle_regressions.py
          python - <<'PY'
          import pathlib, re, subprocess
          text=pathlib.Path('games/ff8/editor.html').read_text()
          for script in re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>',text,re.S|re.I):
              subprocess.run(['node','--check'],input=script,text=True,check=True)
          PY
      - name: Commit only verified source files
        working-directory: editor
        env:
          GH_TOKEN: ${{ github.token }}
          REPAIR_BRANCH: fix/ff8-native-battle-batch
        run: |
          git config user.name 'Lexeditor repair'
          git config user.email '89482099+Lexer-Lux@users.noreply.github.com'
          git add --pathspec-from-file=.native-paths
          git rm -- .github/native-batch.0 .github/native-batch.1 .github/native-batch.2
          git commit -m 'Fix native model-retirement deadlock, HP row placement, and GF HP bars'
          AUTH=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $AUTH" push origin "HEAD:refs/heads/$REPAIR_BRANCH"
          unset AUTH
