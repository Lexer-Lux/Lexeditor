name: FF7 PR 434 one-shot character detail redesign

on:
  push:
    branches:
      - work/ff7-complete-kernel-surface
    paths:
      - 'tools/_ff7_character_detail_once.py'

permissions:
  contents: write

jobs:
  apply-test-land:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/ff7-complete-kernel-surface
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Apply character detail redesign
        run: python tools/_ff7_character_detail_once.py
      - name: Verify FF7 source contracts
        run: |
          python tools/verify_ff7_semantic_surface.py
          python tools/verify_ff7_blank_ui.py
      - name: Install Chromium
        run: |
          python -m pip install playwright==1.57.0
          python -m playwright install --with-deps chromium
      - name: Verify FF7 rendered UI
        run: |
          python tools/verify_ff7_rendered_neutral.py
          python tools/verify_ff7_exe_rendered.py
      - name: Commit tested redesign and remove scaffold
        shell: bash
        run: |
          git rm tools/_ff7_character_detail_once.py .github/workflows/ff7-pr434-character-detail-once.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add games/ff7/editor.html
          git commit -m 'Redesign FF7 character detail editor'
          git push origin HEAD:work/ff7-complete-kernel-surface
