name: Global 56 one-shot repair

on:
  push:
    branches:
      - fix/global-56-info-bubble-centering

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/global-56-info-bubble-centering
          fetch-depth: 0
      - name: Apply exact reviewed patch
        run: python maintenance/global-56/apply.py
      - name: Commit repaired shared UI
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "Center shared info-bubble glyphs (#56)"
          git push origin HEAD:fix/global-56-info-bubble-centering
