name: FF9 Memoria Windows install
on:
  push:
    branches: [master]
    paths:
      - 'plugins/ff9/**'
      - 'tests/test_ff9_runtime.py'
      - 'tests/ff9_browser_check.py'
      - '.github/workflows/ff9-memoria-windows.yml'
      - 'tools/ff9/build_windows_candidate.py'
      - 'tools/build_distribution.py'
      - 'requirements.txt'
  pull_request:
    paths:
      - 'plugins/ff9/**'
      - 'tests/test_ff9_runtime.py'
      - 'tests/ff9_browser_check.py'
      - '.github/workflows/ff9-memoria-windows.yml'
      - 'tools/ff9/build_windows_candidate.py'
      - 'tools/build_distribution.py'
      - 'requirements.txt'
permissions:
  contents: read
jobs:
  publisher-patcher:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install test dependency
        run: python -m pip install pytest
      - name: Run FF9 runtime regressions
        run: python -m pytest -q tests/test_ff9_runtime.py
      - name: Exercise the pinned publisher patcher on a disposable Steam-layout fixture
        shell: pwsh
        run: |
          @'
          from pathlib import Path
          import json, tempfile
          from plugins.ff9 import memoria_manager as manager

          with tempfile.TemporaryDirectory(prefix="lexeditor-ff9-real-patcher-") as name:
              root = Path(name) / "FINAL FANTASY IX"
              for platform in ("x64", "x86"):
                  managed = root / platform / "FF9_Data" / "Managed"
                  managed.mkdir(parents=True, exist_ok=True)
                  (managed / "Assembly-CSharp.dll").write_bytes(b"synthetic pre-Memoria assembly")
              (root / "x64" / "FF9.exe").write_bytes(b"synthetic executable marker")
              (root / "FF9_Launcher.exe").write_bytes(b"synthetic launcher marker")
              original_ini = (b"\xef\xbb\xbf; lexeditor preservation fixture\r\n"
                              b"[Unknown]\r\nCustom = 7 ; keep this exactly\r\n")
              (root / "Memoria.ini").write_bytes(original_ini)
              state = Path(name) / "state" / "memoria.json"
              cache = Path(name) / "cache"

              installed = manager.install(root, state_path=state, cache_root=cache)
              assert installed["installed"], installed
              assert installed["updatesDisabled"], installed
              assert (root / "Memoria.ini").read_bytes() == original_ini
              assert "CheckUpdates = False" in (root / "Settings.ini").read_text(encoding="utf-8-sig")
              for platform in ("x64", "x86"):
                  assert (root / platform / "FF9_Data" / "Managed" / "Memoria.Prime.dll").is_file()
              assert (root / "FF9_Launcher.exe").stat().st_size > len(b"synthetic launcher marker")

              reinstalled = manager.install(root, state_path=state, cache_root=cache)
              assert reinstalled["installed"]
              assert reinstalled["updatesDisabled"], reinstalled
              assert (root / "Memoria.ini").read_bytes() == original_ini
              assert "CheckUpdates = False" in (root / "Settings.ini").read_text(encoding="utf-8-sig")
              assert reinstalled["lastInstalled"]
              print(json.dumps({"version": reinstalled["version"],
                                "pinned": reinstalled["pinned"],
                                "assemblies": reinstalled["assemblies"]}, indent=2))
          '@ | Set-Content -Encoding UTF8 ff9_real_patcher_check.py
          python ff9_real_patcher_check.py

  acceptance-candidate:
    needs: publisher-patcher
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install candidate dependencies
        run: python -m pip install -r requirements.txt pyinstaller==6.16.0
      - name: Build isolated FF9 acceptance candidate
        env:
          LEXEDITOR_CANDIDATE_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: python tools/ff9/build_windows_candidate.py
      - name: Verify candidate payload
        shell: pwsh
        run: |
          $root = 'out/ff9-windows-candidate'
          $manifest = Get-Content "$root/candidate-manifest.json" | ConvertFrom-Json
          if (-not (Test-Path "$root/Lexeditor/Lexeditor.exe")) { throw 'Candidate app is missing' }
          if (-not (Test-Path "$root/Launch-FF9-Candidate.cmd")) { throw 'Candidate launcher is missing' }
          if (-not (Test-Path "$root/FF9-ACCEPTANCE.txt")) { throw 'Candidate acceptance guide is missing' }
          if (-not (Test-Path "$root/FF9-project/StreamingAssets/Data")) { throw 'Candidate project is missing' }
          if (-not (Test-Path "$root/candidate-localappdata/Lexeditor/helpers/downloads/Memoria-v2025.07.04.exe")) { throw 'Pinned Memoria patcher is missing' }
          if ($manifest.productionHelperAllowlistModified) { throw 'Candidate must not modify the production helper allowlist' }
          $manifest | ConvertTo-Json -Depth 5
      - name: Upload isolated FF9 acceptance candidate
        uses: actions/upload-artifact@v4
        with:
          name: ff9-windows-candidate
          path: out/ff9-windows-candidate
          retention-days: 14
          if-no-files-found: error
