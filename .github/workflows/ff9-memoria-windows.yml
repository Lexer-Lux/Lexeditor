name: FF9 Memoria Windows install
on:
  push:
    branches: [codex/ff9-complete-20260906]
    paths:
      - 'games/ff9/memoria_*.py'
      - 'games/ff9/plugin.py'
      - 'tests/test_ff9_runtime.py'
      - '.github/workflows/ff9-memoria-windows.yml'
  pull_request:
    paths:
      - 'games/ff9/memoria_*.py'
      - 'games/ff9/plugin.py'
      - 'tests/test_ff9_runtime.py'
      - '.github/workflows/ff9-memoria-windows.yml'
permissions:
  contents: read
jobs:
  publisher-patcher:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install test dependency
        run: python -m pip install pytest
      - name: Run FF9 runtime regressions
        run: python -m pytest -q tests/test_ff9_runtime.py
      - name: Exercise the pinned publisher patcher on a disposable Steam-layout fixture
        shell: pwsh
        run: |
          @'
          from pathlib import Path
          import json, tempfile
          from games.ff9 import memoria_manager as manager

          with tempfile.TemporaryDirectory(prefix="lexeditor-ff9-real-patcher-") as name:
              root = Path(name) / "FINAL FANTASY IX"
              for platform in ("x64", "x86"):
                  managed = root / platform / "FF9_Data" / "Managed"
                  managed.mkdir(parents=True, exist_ok=True)
                  (managed / "Assembly-CSharp.dll").write_bytes(b"synthetic pre-Memoria assembly")
              (root / "x64" / "FF9.exe").write_bytes(b"synthetic executable marker")
              (root / "FF9_Launcher.exe").write_bytes(b"synthetic launcher marker")
              original_ini = (b"\xef\xbb\xbf; lexeditor preservation fixture\r\n"
                              b"[Unknown]\r\nCustom = 7 ; keep this exactly\r\n")
              (root / "Memoria.ini").write_bytes(original_ini)
              state = Path(name) / "state" / "memoria.json"
              cache = Path(name) / "cache"

              installed = manager.install(root, state_path=state, cache_root=cache)
              assert installed["installed"], installed
              assert (root / "Memoria.ini").read_bytes() == original_ini
              for platform in ("x64", "x86"):
                  assert (root / platform / "FF9_Data" / "Managed" / "Memoria.Prime.dll").is_file()
              assert (root / "FF9_Launcher.exe").stat().st_size > len(b"synthetic launcher marker")

              reinstalled = manager.install(root, state_path=state, cache_root=cache)
              assert reinstalled["installed"]
              assert (root / "Memoria.ini").read_bytes() == original_ini
              assert reinstalled["lastInstalled"]
              print(json.dumps({"version": reinstalled["version"],
                                "pinned": reinstalled["pinned"],
                                "assemblies": reinstalled["assemblies"]}, indent=2))
          '@ | Set-Content -Encoding UTF8 ff9_real_patcher_check.py
          python ff9_real_patcher_check.py
