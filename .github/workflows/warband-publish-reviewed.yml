name: Publish reviewed Warband completion
on:
  push:
    branches: [fix/warband-issue-batch]
    paths: ['.github/workflows/warband-publish-reviewed.yml']
permissions:
  contents: read
jobs:
  publish:
    if: github.ref == 'refs/heads/fix/warband-issue-batch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify source baseline and exact reviewed patch
        run: |
          python - <<'PY'
          import base64, hashlib, lzma, pathlib, subprocess
          encoded = ''.join(pathlib.Path(f'.github/warband-final.patch.xz.b64.{i}').read_text().strip() for i in range(4))
          patch = lzma.decompress(base64.b64decode(encoded, validate=True))
          assert hashlib.sha256(patch).hexdigest() == '3d995772f6a9e91b9b8d4e5c6e5cb1b0673f320c094610087aeb385bf8e94987', 'Reviewed patch checksum mismatch'
          paths = [line[6:] for line in patch.decode().splitlines() if line.startswith('+++ b/')]
          assert len(paths) == 26 and all(p.startswith(('games/', 'ui/', 'tests/', 'codex/', 'worklog/')) for p in paths)
          subprocess.run(['git', 'diff', '--exit-code', '984e5c5d550ccfd913c3c418965ed253cc830dfe', 'HEAD', '--', *paths], check=True)
          subprocess.run(['git', 'apply', '--unidiff-zero', '--index', '--check', '-'], input=patch, check=True)
          subprocess.run(['git', 'apply', '--unidiff-zero', '--index', '-'], input=patch, check=True)
          PY
      - run: python -m pip install Pillow 'fonttools>=4.59,<5'
      - name: Verify before publishing
        run: |
          python -m compileall -q games/warband games/ff7 games/ff8 games/ff9 games/rdr games/rdr2 desktop_host.py plugin_api.py
          python -m unittest discover -s tests -p 'test_warband*.py' -v
          python -m unittest discover -s tests -p test_data_map_coverage.py -v
          node --check ui/framework.js
          node tests/test_warband_trees.js
          git diff --cached --check
      - name: Publish only the tested reviewed changes
        run: |
          git rm .github/warband-final.patch.xz.b64.*
          git config user.name 'Lexer'
          git config user.email '89482099+Lexer-Lux@users.noreply.github.com'
          git commit -m 'Finish native Warband launch and cross-plugin Data Map coverage and paging'
          git push origin HEAD:fix/warband-issue-batch
