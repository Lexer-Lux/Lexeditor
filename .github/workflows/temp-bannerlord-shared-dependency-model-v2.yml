name: Temporary Bannerlord shared dependency model integration v2

on:
  push:
    branches: [feature/bannerlord-plugin]
    paths:
      - '.github/workflows/temp-bannerlord-shared-dependency-model-v2.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/bannerlord-plugin
      - name: Reuse successful Play/deployment refactor
        shell: python
        run: |
          from pathlib import Path
          import textwrap

          workflow = Path('.github/workflows/temp-bannerlord-shared-dependency-model.yml').read_text(encoding='utf-8')
          section = workflow.split('      - name: Refactor Play and deployment onto shared relation model\n', 1)[1]
          section = section.split('      - name: Add shadowed-row deployment regression\n', 1)[0]
          code = textwrap.dedent(section.split('        run: |\n', 1)[1])
          exec(compile(code, 'shared-dependency-model-transform.py', 'exec'))
      - name: Write standalone shadowed-row regression
        run: |
          cat > tests/test_bannerlord_shadowed_dependency_diagnostics.py <<'PY'
          from pathlib import Path
          import tempfile
          import unittest

          from games.bannerlord.runtime_data import deployment_status


          def write_selected(game: Path) -> Path:
              folder = game / "Modules" / "Selected"
              folder.mkdir(parents=True, exist_ok=True)
              (folder / "SubModule.xml").write_text(
                  '''<Module>
            <Name value="Selected" />
            <Id value="Selected" />
            <Version value="v1.0.0" />
            <SingleplayerModule value="true" />
            <DependedModules>
              <DependedModule Id="Missing.Library" />
            </DependedModules>
            <DependedModuleMetadatas>
              <DependedModuleMetadata id="Missing.Library" order="LoadBeforeThis" optional="true" />
            </DependedModuleMetadatas>
          </Module>
          ''',
                  encoding="utf-8",
              )
              return folder


          class BannerlordShadowedDependencyDiagnosticTests(unittest.TestCase):
              def test_shadowed_native_required_row_does_not_block_optional_extended_relation(self):
                  with tempfile.TemporaryDirectory() as name:
                      root = Path(name)
                      game = root / "game"
                      executable = game / "bin" / "Win64_Shipping_Client" / "Bannerlord.exe"
                      executable.parent.mkdir(parents=True)
                      executable.write_bytes(b"")
                      deployed = write_selected(game)
                      workspace = root / "workspace"
                      workspace.mkdir()
                      (workspace / "SubModule.xml").write_text(
                          (deployed / "SubModule.xml").read_text(encoding="utf-8"),
                          encoding="utf-8",
                      )

                      status = deployment_status(workspace, game)
                      rows = [row for row in status["dependencies"] if row["id"] == "Missing.Library"]
                      self.assertEqual(len(rows), 2)
                      effective = next(row for row in rows if row["effective"])
                      shadowed = next(row for row in rows if not row["effective"])
                      self.assertEqual(effective["origin"], "DependedModuleMetadatas")
                      self.assertTrue(effective["optional"])
                      self.assertEqual(shadowed["origin"], "DependedModules")
                      self.assertEqual(shadowed["shadowedByOrigin"], "DependedModuleMetadatas")
                      self.assertTrue(shadowed["overriddenByCommunityMetadata"])
                      self.assertFalse(any("Missing required dependencies" in issue for issue in status["issues"]))
                      self.assertEqual(status["loadOrder"], ["Selected"])
                      self.assertTrue(status["runnable"])


          if __name__ == "__main__":
              unittest.main()
          PY
      - name: Validate shared dependency model
        run: |
          python -m compileall -q games/bannerlord
          python -m unittest tests.test_bannerlord_dependency_relations tests.test_bannerlord_dependency_precedence tests.test_bannerlord_dependency_diagnostics tests.test_bannerlord_shadowed_dependency_diagnostics tests.test_bannerlord_community_metadata tests.test_bannerlord_launch -v
          node --check games/bannerlord/editor_balancing.js
      - name: Commit shared model integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add games/bannerlord/game_launch.py games/bannerlord/runtime_data.py games/bannerlord/editor_balancing.js tests/test_bannerlord_shadowed_dependency_diagnostics.py
          git commit -m "Share Bannerlord dependency precedence diagnostics"
          git push origin HEAD:feature/bannerlord-plugin
