name: RDR1 RPF copy checks
on:
  push:
    branches: [fix/rdr1-runtime-repo-link, fix/rdr1-carriage-auto-rest, fix/rdr1-skip-travel-remap, fix/rdr1-horse-icon]
    paths:
      - 'plugins/rdr/archive_deployment.py'
      - 'plugins/rdr/script_features.py'
      - 'plugins/rdr/input_remaps.py'
      - 'plugins/rdr/map_icon_features.py'
      - 'plugins/rdr/server.py'
      - 'tools/magic-rdr/cli/**'
      - 'tools/magic-rdr/app/Rpf6ReadCli.exe'
      - 'tools/verify_rdr_archive_deployment.py'
      - 'tools/verify_rdr_rpf_copy.ps1'
      - 'tools/verify_rdr_type2_resource.ps1'
      - 'tools/verify_rdr_script_features.py'
      - 'tools/verify_rdr_input_remaps.py'
      - 'tools/verify_rdr_map_icon_features.py'
      - '.github/workflows/rdr1-rpf-copy.yml'
  pull_request:
    paths:
      - 'plugins/rdr/archive_deployment.py'
      - 'plugins/rdr/script_features.py'
      - 'plugins/rdr/input_remaps.py'
      - 'plugins/rdr/map_icon_features.py'
      - 'plugins/rdr/server.py'
      - 'tools/magic-rdr/cli/**'
      - 'tools/magic-rdr/app/Rpf6ReadCli.exe'
      - 'tools/verify_rdr_archive_deployment.py'
      - 'tools/verify_rdr_rpf_copy.ps1'
      - 'tools/verify_rdr_type2_resource.ps1'
      - 'tools/verify_rdr_script_features.py'
      - 'tools/verify_rdr_input_remaps.py'
      - 'tools/verify_rdr_map_icon_features.py'
      - '.github/workflows/rdr1-rpf-copy.yml'
permissions:
  contents: read
jobs:
  copy-builder:
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - name: Check out without optional gitlinks
        shell: pwsh
        run: |
          git init .
          git -c protocol.version=2 fetch --depth=1 "https://github.com/${env:GITHUB_REPOSITORY}.git" $env:GITHUB_SHA
          git checkout --detach FETCH_HEAD
      - name: Verify update-folder transaction ownership
        shell: pwsh
        run: python tools/verify_rdr_archive_deployment.py
      - name: Verify passenger coach bytecode patch shape
        shell: pwsh
        run: python tools/verify_rdr_script_features.py
      - name: Verify camp/cutscene input-action relocation
        shell: pwsh
        run: python tools/verify_rdr_input_remaps.py
      - name: Verify owned-horse atlas transform
        shell: pwsh
        run: python tools/verify_rdr_map_icon_features.py
      - name: Build bridge and exercise a synthetic RPF6 replacement
        shell: powershell
        run: .\tools\verify_rdr_rpf_copy.ps1
      - name: Exercise encrypted RSC85 type-2 unpack/repack
        shell: powershell
        run: .\tools\verify_rdr_type2_resource.ps1
