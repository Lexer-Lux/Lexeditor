name: Apply FF8 in-game clock integration
# Retry after making the duplicate load/save payload seam explicit.
on:
  push:
    branches: [master]
    paths:
      - 'tools/apply_ff8_ingame_time.py'
      - '.github/workflows/apply_ff8_ingame_time.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 1
      - name: Apply guarded clock migration
        run: python tools/apply_ff8_ingame_time.py
      - name: Validate source contracts
        run: |
          python -m unittest tests.test_ff8_ingame_time -v
          python -m compileall -q games/ff8 tools/prepare_ff8_native_build.py
          python - <<'PY'
          import pathlib, re, subprocess
          text = pathlib.Path('games/ff8/editor.html').read_text(encoding='utf-8')
          for script in re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>', text, re.S | re.I):
              subprocess.run(['node', '--check'], input=script, text=True, check=True)
          PY
          git diff --check
      - name: Commit integrated source
        run: |
          if git diff --quiet -- games/ff8/menu_qol_issue_61.py games/ff8/ffnx_status_bars/ffnx-src/lexeditor_ff8_bars.cpp games/ff8/gameplay_settings.py games/ff8/editor.html tools/prepare_ff8_native_build.py; then
            echo 'No integration changes were needed.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add games/ff8/menu_qol_issue_61.py games/ff8/ffnx_status_bars/ffnx-src/lexeditor_ff8_bars.cpp games/ff8/gameplay_settings.py games/ff8/editor.html tools/prepare_ff8_native_build.py
          git commit -m 'Integrate FF8 local main-menu clock'
          git push origin HEAD:master