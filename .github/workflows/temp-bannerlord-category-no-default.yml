name: Temporary Bannerlord strict single-player classification

on:
  push:
    branches: [feature/bannerlord-plugin]
    paths:
      - '.github/workflows/temp-bannerlord-category-no-default.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/bannerlord-plugin
      - name: Remove invented single-player default
        shell: python
        run: |
          from pathlib import Path

          def replace_once(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected one match, found {count}")
              return text.replace(old, new, 1)

          module = Path('games/bannerlord/module_data.py')
          text = module.read_text(encoding='utf-8')
          old = '''def is_singleplayer_module(module: dict) -> bool:
              """Mirror ModuleManager's additive modern/legacy single-player flags."""
              category = str(module.get("moduleCategory") or "").strip().casefold()
              if module.get("singleplayer") or category in {"singleplayer", "singleplayeroptional"}:
                  return True
              if category or module.get("multiplayer"):
                  return False
              # Descriptors predating both category and legacy flags default to SP.
              return True
          '''
          import textwrap
          old = textwrap.dedent(old)
          new = '''def is_singleplayer_module(module: dict) -> bool:
              """Mirror ModuleManager's additive modern/legacy single-player flags."""
              category = str(module.get("moduleCategory") or "").strip().casefold()
              return bool(module.get("singleplayer")) or category in {
                  "singleplayer",
                  "singleplayeroptional",
              }
          '''
          new = textwrap.dedent(new)
          text = replace_once(text, old, new, 'single-player classification')
          module.write_text(text, encoding='utf-8')

          test = Path('tests/test_bannerlord_modern_metadata.py')
          text = test.read_text(encoding='utf-8')
          text = replace_once(
              text,
              '        self.assertTrue(is_singleplayer_module({"moduleCategory": "", "singleplayer": False, "multiplayer": False}))\n',
              '        self.assertFalse(is_singleplayer_module({"moduleCategory": "", "singleplayer": False, "multiplayer": False}))\n',
              'blank descriptor expectation',
          )
          test.write_text(text, encoding='utf-8')
      - name: Add direct-launch regression
        run: |
          cat > tests/test_bannerlord_ambiguous_category.py <<'PY'
          from pathlib import Path
          import tempfile
          import unittest

          from games.bannerlord.game_launch import module_load_order


          class BannerlordAmbiguousCategoryTests(unittest.TestCase):
              def test_module_without_category_or_legacy_sp_flag_is_not_launchable_as_singleplayer(self):
                  with tempfile.TemporaryDirectory() as name:
                      root = Path(name)
                      game = root / "game"
                      module = game / "Modules" / "Ambiguous"
                      module.mkdir(parents=True)
                      (module / "SubModule.xml").write_text(
                          '<Module><Name value="Ambiguous" /><Id value="Ambiguous" /><Version value="v1.0.0" /></Module>',
                          encoding="utf-8",
                      )
                      workspace = root / "workspace"
                      workspace.mkdir()
                      (workspace / "SubModule.xml").write_text(
                          '<Module><Id value="Ambiguous" /></Module>', encoding="utf-8"
                      )
                      with self.assertRaisesRegex(RuntimeError, "not declared as a single-player module"):
                          module_load_order(game, workspace)


          if __name__ == "__main__":
              unittest.main()
          PY
      - name: Validate strict classification
        run: |
          python -m compileall -q games/bannerlord
          python -m unittest tests.test_bannerlord_ambiguous_category tests.test_bannerlord_modern_metadata tests.test_bannerlord_module_categories tests.test_bannerlord_launch -v
      - name: Commit strict classification
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add games/bannerlord/module_data.py tests/test_bannerlord_modern_metadata.py tests/test_bannerlord_ambiguous_category.py
          git commit -m "Require declared Bannerlord single-player metadata"
          git push origin HEAD:feature/bannerlord-plugin
