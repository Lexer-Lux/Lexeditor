name: FF9 row rework finalize
on:
  push:
    branches: [codex/ff9-row-rework-20260906]
    paths:
      - '.github/workflows/ff9-row-finalize.yml'
permissions:
  contents: write
jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/ff9-row-rework-20260906
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - run: python -m pip install pytest
      - name: Implement issue 390
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              if old not in text:
                  raise SystemExit(f'{path}: replacement anchor not found: {old[:80]!r}')
              text = text.replace(old, new, 1)
              p.write_text(text, encoding='utf-8')

          # Project-owned toggle.
          replace_once(
              'games/ff9/features.py',
              'FEATURE_KEYS = ("ImprovedInterface", "BetterEat", "XPBars", "HPMPBars")',
              'FEATURE_KEYS = ("ImprovedInterface", "BetterEat", "XPBars", "HPMPBars", "RowRework")')

          # Runtime feature configuration.
          replace_once(
              'games/ff9/runtime/Bootstrap.cs',
              '        private static Boolean _xpBars;\n        private static Boolean _hpmpBars;\n',
              '        private static Boolean _xpBars;\n        private static Boolean _hpmpBars;\n        private static Boolean _rowRework;\n')
          replace_once(
              'games/ff9/runtime/Bootstrap.cs',
              '        public static Boolean HPMPBars\n        {\n            get { Refresh(); return _hpmpBars; }\n        }\n',
              '        public static Boolean HPMPBars\n        {\n            get { Refresh(); return _hpmpBars; }\n        }\n\n        public static Boolean RowRework\n        {\n            get { Refresh(); return _rowRework; }\n        }\n')
          replace_once(
              'games/ff9/runtime/Bootstrap.cs',
              '                    _xpBars = false;\n                    _hpmpBars = false;\n                    return;\n',
              '                    _xpBars = false;\n                    _hpmpBars = false;\n                    _rowRework = false;\n                    return;\n')
          replace_once(
              'games/ff9/runtime/Bootstrap.cs',
              '                Boolean xpBars = false;\n                Boolean hpmpBars = false;\n',
              '                Boolean xpBars = false;\n                Boolean hpmpBars = false;\n                Boolean rowRework = false;\n')
          replace_once(
              'games/ff9/runtime/Bootstrap.cs',
              '                    else if (key.Equals("HPMPBars", StringComparison.OrdinalIgnoreCase))\n                        hpmpBars = enabled;\n',
              '                    else if (key.Equals("HPMPBars", StringComparison.OrdinalIgnoreCase))\n                        hpmpBars = enabled;\n                    else if (key.Equals("RowRework", StringComparison.OrdinalIgnoreCase))\n                        rowRework = enabled;\n')
          replace_once(
              'games/ff9/runtime/Bootstrap.cs',
              '                _xpBars = xpBars;\n                _hpmpBars = hpmpBars;\n',
              '                _xpBars = xpBars;\n                _hpmpBars = hpmpBars;\n                _rowRework = rowRework;\n')
          replace_once(
              'games/ff9/runtime/Bootstrap.cs',
              '                _xpBars = false;\n                _hpmpBars = false;\n            }\n',
              '                _xpBars = false;\n                _hpmpBars = false;\n                _rowRework = false;\n            }\n')

          # Main runtime: shared target filter plus menu/battle row state.
          replace_once(
              'games/ff9/runtime/Runtime.cs',
              '        private Boolean _eatFilterWasActive;\n        private FieldInfo _opponentIdField;\n        private FieldInfo _currentCommandIdField;\n        private FieldInfo _targetPanelField;\n',
              '        private Boolean _targetFilterWasActive;\n        private readonly Dictionary<BTL_DATA, Single> _rowExtraZ = new Dictionary<BTL_DATA, Single>();\n        private readonly Dictionary<Int32, Byte> _menuRows = new Dictionary<Int32, Byte>();\n        private Boolean _menuRowsInitialized;\n        private Boolean _frontCollapseLatched;\n        private MethodInfo _displayCharacterMethod;\n        private FieldInfo _opponentIdField;\n        private FieldInfo _currentCommandIdField;\n        private FieldInfo _targetPanelField;\n')

          p = Path('games/ff9/runtime/Runtime.cs')
          text = p.read_text(encoding='utf-8')
          start = text.index('        public void GameLoopUpdate()')
          end = text.index('        private void UpdateDialogueControls()', start)
          game_loop = '''        public void GameLoopUpdate()\n        {\n            Boolean improvedInterface = LexeditorFeatureConfig.ImprovedInterface;\n            Boolean betterEat = LexeditorFeatureConfig.BetterEat;\n            Boolean rowRework = LexeditorFeatureConfig.RowRework;\n            if (!improvedInterface && !betterEat && !rowRework)\n            {\n                if (_targetFilterWasActive)\n                    RestoreTargetButtons();\n                RemoveAllGlows();\n                ResetRowRework();\n                return;\n            }\n            if (improvedInterface)\n            {\n                UpdateDialogueControls();\n                CaptureDialogueHistory();\n            }\n            if (betterEat)\n                UpdateBlueMagicGlows();\n            else\n                RemoveAllGlows();\n            if (betterEat || rowRework)\n                UpdateTargetAvailability();\n            else if (_targetFilterWasActive)\n                RestoreTargetButtons();\n            if (rowRework)\n                UpdateRowRework();\n            else\n                ResetRowRework();\n        }\n\n'''
          text = text[:start] + game_loop + text[end:]
          start = text.index('        private void UpdateEatTargetAvailability()')
          end = text.index('        private void RestoreTargetButtons()', start)
          target_filter = '''        private void UpdateTargetAvailability()\n        {\n            BattleHUD hud = UIManager.Battle;\n            if (hud == null || ButtonGroupState.ActiveGroup != BattleHUD.TargetGroupButton)\n            {\n                if (_targetFilterWasActive)\n                    RestoreTargetButtons();\n                return;\n            }\n            if (_currentCommandIdField == null)\n                _currentCommandIdField = typeof(BattleHUD).GetField("_currentCommandId", BindingFlags.Instance | BindingFlags.NonPublic);\n            if (_targetPanelField == null)\n                _targetPanelField = typeof(BattleHUD).GetField("_targetPanel", BindingFlags.Instance | BindingFlags.NonPublic);\n            if (_currentCommandIdField == null || _targetPanelField == null)\n                return;\n            BattleCommandId command = (BattleCommandId)_currentCommandIdField.GetValue(hud);\n            System.Object panel = _targetPanelField.GetValue(hud);\n            Array buttons = GetEntries(panel, "Enemies");\n            if (buttons == null)\n                return;\n\n            if (LexeditorFeatureConfig.RowRework && command == BattleCommandId.Attack)\n            {\n                BattleUnit caster = CurrentPlayerUnit(hud);\n                if (caster != null && caster.Row == 0 && !caster.HasLongRangeWeapon)\n                {\n                    for (Int32 i = 0; i < buttons.Length; i++)\n                    {\n                        GameObject go = GetGameObject(buttons.GetValue(i));\n                        if (go != null)\n                            ButtonGroupState.SetButtonEnable(go, false);\n                    }\n                    _targetFilterWasActive = true;\n                    return;\n                }\n            }\n\n            if (LexeditorFeatureConfig.BetterEat && (command == BattleCommandId.Eat || command == BattleCommandId.Cook))\n            {\n                PLAYER quina = FindQuinaPlayer();\n                Int32 power = command == BattleCommandId.Cook ? 2 : 4;\n                Int32 enemyIndex = 0;\n                foreach (BattleUnit unit in FF9StateSystem.Battle.FF9Battle.EnumerateBattleUnits())\n                {\n                    if (unit == null || unit.Id == 0 || !unit.IsTargetable || unit.IsPlayer)\n                        continue;\n                    if (enemyIndex >= buttons.Length)\n                        break;\n                    GameObject go = GetGameObject(buttons.GetValue(enemyIndex));\n                    if (go != null)\n                        ButtonGroupState.SetButtonEnable(go, CanLearnFrom(unit, quina, power));\n                    enemyIndex++;\n                }\n                _targetFilterWasActive = true;\n                return;\n            }\n\n            if (_targetFilterWasActive)\n                RestoreTargetButtons();\n        }\n\n        private static BattleUnit CurrentPlayerUnit(BattleHUD hud)\n        {\n            if (hud == null || hud.CurrentPlayerIndex < 0 || hud.CurrentPlayerIndex > 15)\n                return null;\n            UInt16 id = (UInt16)(1 << hud.CurrentPlayerIndex);\n            foreach (BattleUnit unit in FF9StateSystem.Battle.FF9Battle.EnumerateBattleUnits())\n                if (unit != null && unit.IsPlayer && unit.Id == id)\n                    return unit;\n            return null;\n        }\n\n'''
          text = text[:start] + target_filter + text[end:]
          text = text.replace('            _eatFilterWasActive = false;\n', '            _targetFilterWasActive = false;\n', 1)

          row_methods = '''        private void UpdateRowRework()\n        {\n            UpdateMenuFormationRule();\n            UpdateBattleRows();\n        }\n\n        private void ResetRowRework()\n        {\n            _menuRows.Clear();\n            _menuRowsInitialized = false;\n            _frontCollapseLatched = false;\n            UIManager manager = PersistenSingleton<UIManager>.Instance;\n            if (manager == null || manager.UnityScene != UIManager.Scene.Battle)\n            {\n                _rowExtraZ.Clear();\n                return;\n            }\n            List<BattleUnit> players = PlayerBattleUnits();\n            ApplyBackRowSpacing(players, false);\n        }\n\n        private void UpdateMenuFormationRule()\n        {\n            UIManager manager = PersistenSingleton<UIManager>.Instance;\n            if (manager == null || manager.State != UIManager.UIState.MainMenu)\n            {\n                _menuRows.Clear();\n                _menuRowsInitialized = false;\n                return;\n            }\n            PLAYER[] members = FF9StateSystem.Common.FF9.party.member;\n            List<PLAYER> party = new List<PLAYER>();\n            for (Int32 i = 0; i < members.Length; i++)\n                if (members[i] != null)\n                    party.Add(members[i]);\n            if (party.Count == 0)\n                return;\n\n            if (!_menuRowsInitialized)\n            {\n                _menuRowsInitialized = true;\n                if (AllPartyMembersBack(party))\n                {\n                    party[0].info.row = 1;\n                    RejectAllBackFormation(manager.MainMenuScene);\n                }\n                SnapshotMenuRows(party);\n                return;\n            }\n\n            if (AllPartyMembersBack(party))\n            {\n                PLAYER changed = null;\n                for (Int32 i = 0; i < party.Count; i++)\n                {\n                    Byte previous;\n                    Int32 key = (Int32)party[i].info.slot_no;\n                    if (_menuRows.TryGetValue(key, out previous) && previous == 1 && party[i].info.row == 0)\n                    {\n                        changed = party[i];\n                        break;\n                    }\n                }\n                (changed ?? party[0]).info.row = 1;\n                RejectAllBackFormation(manager.MainMenuScene);\n            }\n            SnapshotMenuRows(party);\n        }\n\n        private static Boolean AllPartyMembersBack(List<PLAYER> party)\n        {\n            for (Int32 i = 0; i < party.Count; i++)\n                if (party[i].info.row != 0)\n                    return false;\n            return party.Count > 0;\n        }\n\n        private void SnapshotMenuRows(List<PLAYER> party)\n        {\n            _menuRows.Clear();\n            for (Int32 i = 0; i < party.Count; i++)\n                _menuRows[(Int32)party[i].info.slot_no] = party[i].info.row;\n        }\n\n        private void RejectAllBackFormation(MainMenuUI menu)\n        {\n            FF9Sfx.FF9SFX_Play(102);\n            if (menu == null)\n                return;\n            if (_displayCharacterMethod == null)\n                _displayCharacterMethod = typeof(MainMenuUI).GetMethod("DisplayCharacter", BindingFlags.Instance | BindingFlags.NonPublic);\n            if (_displayCharacterMethod != null)\n                _displayCharacterMethod.Invoke(menu, null);\n        }\n\n        private void UpdateBattleRows()\n        {\n            UIManager manager = PersistenSingleton<UIManager>.Instance;\n            if (manager == null || manager.UnityScene != UIManager.Scene.Battle)\n            {\n                _rowExtraZ.Clear();\n                _frontCollapseLatched = false;\n                return;\n            }\n            List<BattleUnit> players = PlayerBattleUnits();\n            Boolean anyLiving = false;\n            Boolean anyLivingFront = false;\n            for (Int32 i = 0; i < players.Count; i++)\n            {\n                BattleUnit unit = players[i];\n                if (unit.CurrentHp == 0)\n                    continue;\n                anyLiving = true;\n                if (unit.Row == 1)\n                    anyLivingFront = true;\n            }\n\n            if (anyLiving && !anyLivingFront)\n            {\n                if (!_frontCollapseLatched && UIManager.Battle != null)\n                    UIManager.Battle.SetBattleMessage("Your enemies close in!", 3);\n                for (Int32 i = 0; i < players.Count; i++)\n                {\n                    BattleUnit unit = players[i];\n                    if (unit.Row == 0)\n                        btl_para.SwitchPlayerRow(unit.Data, !btl_util.IsBtlBusy(unit.Data, btl_util.BusyMode.CASTER));\n                    if (unit.Player != null)\n                        unit.Player.info.row = 1;\n                }\n                _frontCollapseLatched = true;\n            }\n            else\n            {\n                _frontCollapseLatched = false;\n            }\n\n            ApplyBackRowSpacing(players, true);\n        }\n\n        private static List<BattleUnit> PlayerBattleUnits()\n        {\n            List<BattleUnit> players = new List<BattleUnit>();\n            foreach (BattleUnit unit in FF9StateSystem.Battle.FF9Battle.EnumerateBattleUnits())\n                if (unit != null && unit.IsPlayer && unit.Id != 0)\n                    players.Add(unit);\n            return players;\n        }\n\n        private void ApplyBackRowSpacing(List<BattleUnit> players, Boolean doubled)\n        {\n            HashSet<BTL_DATA> active = new HashSet<BTL_DATA>();\n            for (Int32 i = 0; i < players.Count; i++)\n            {\n                BattleUnit unit = players[i];\n                active.Add(unit.Data);\n                Single previous;\n                if (!_rowExtraZ.TryGetValue(unit.Data, out previous))\n                    previous = 0f;\n                Single desired = doubled && unit.Row == 0 ? -400f : 0f;\n                Single delta = desired - previous;\n                if (Mathf.Abs(delta) > 0.01f)\n                {\n                    unit.Data.base_pos[2] += delta;\n                    if (!btl_util.IsBtlBusy(unit.Data, btl_util.BusyMode.CASTER))\n                        unit.Data.pos[2] += delta;\n                }\n                if (desired == 0f)\n                    _rowExtraZ.Remove(unit.Data);\n                else\n                    _rowExtraZ[unit.Data] = desired;\n            }\n            List<BTL_DATA> stale = new List<BTL_DATA>();\n            foreach (BTL_DATA data in _rowExtraZ.Keys)\n                if (!active.Contains(data))\n                    stale.Add(data);\n            for (Int32 i = 0; i < stale.Count; i++)\n                _rowExtraZ.Remove(stale[i]);\n        }\n\n'''
          marker = '        private static Array GetEntries(System.Object panel, String fieldName)\n'
          if marker not in text:
              raise SystemExit('Runtime.cs row insertion marker not found')
          text = text.replace(marker, row_methods + marker, 1)
          p.write_text(text, encoding='utf-8')

          # Battle-script overload. It reproduces Memoria's default pre-script behavior
          # when Row Rework is disabled, because the presence of an overload replaces it.
          Path('games/ff9/runtime/RowReworkScript.cs').write_text(r'''using Memoria;
          using Memoria.Data;
          using System;

          namespace Memoria.Scripts.Lexeditor
          {
              public sealed class LexeditorRowReworkScriptStart : IOverloadOnBattleScriptStartScript
              {
                  public Boolean OnBattleScriptStart(BattleCalculator v)
                  {
                      if (LexeditorFeatureConfig.RowRework && IsBlockedMelee(v))
                      {
                          v.Context.Flags |= BattleCalcFlags.Miss;
                          return true;
                      }

                      // ScriptsLoader uses one IOverloadOnBattleScriptStartScript globally.
                      // Preserve pinned Memoria's default pre-script behavior exactly when
                      // Row Rework does not veto the action.
                      if (Configuration.Battle.CustomBattleFlagsMeaning == 1)
                      {
                          if (v.Command.IsShortRange)
                          {
                              v.BonusBackstabAndPenaltyLongDistanceVisually();
                              if ((v.Command.AbilityCategory & 8) != 0 && v.Target.IsUnderAnyStatus(BattleStatus.Vanish))
                                  v.Context.Flags |= BattleCalcFlags.Miss;
                          }
                          if ((v.Command.AbilityType & 0x10) != 0 && v.Caster.IsPlayer)
                              v.ApplyElementFullStack(v.Caster.WeaponElement, v.Caster.WeaponElement);
                          if ((v.Context.Flags & (BattleCalcFlags.Miss | BattleCalcFlags.Guard)) != 0)
                              return true;
                      }
                      if ((v.Command.AbilityCategory & 8) != 0 && v.Target.TryKillFrozen())
                          return true;
                      return false;
                  }

                  internal static Boolean IsBlockedMelee(BattleCalculator v)
                  {
                      if (v == null || v.Caster == null || v.Target == null || v.Command == null)
                          return false;
                      Boolean physical = (v.Command.AbilityCategory & 8) != 0;
                      if (!physical || !v.Command.IsShortRange)
                          return false;
                      return (v.Caster.IsPlayer && v.Caster.Row == 0) ||
                             (v.Target.IsPlayer && v.Target.Row == 0);
                  }
              }
          }
          '''.replace('\n          ', '\n').lstrip(), encoding='utf-8')

          # Editor and its idempotent integration patcher must describe the same toggle.
          for path in ('games/ff9/editor.html', 'tools/ff9/patch_features_ui.py'):
              replace_once(
                  path,
                  '{id:"hpmp",label:"HP/MP Bars"}];',
                  '{id:"hpmp",label:"HP/MP Bars"},{id:"row",label:"Row Rework"}];')
              replace_once(
                  path,
                  'hpmp:{key:"HPMPBars",title:"HP/MP Bars",description:"Adds a red HP bar and blue MP bar directly below each party member\'s HP and MP text in battle."}\n',
                  'hpmp:{key:"HPMPBars",title:"HP/MP Bars",description:"Adds a red HP bar and blue MP bar directly below each party member\'s HP and MP text in battle."},\n      row:{key:"RowRework",title:"Row Rework",description:"Doubles the battle distance between the front and back rows, prevents an all-back-row party formation, pulls the whole party to the front when no living front-row character remains, and prevents short-range physical melee from being used by or against back-row party members."}\n')

          # Feature persistence tests.
          p = Path('tests/test_ff9_features.py')
          text = p.read_text(encoding='utf-8')
          text = text.replace(
              '{"ImprovedInterface": True, "BetterEat": True, "XPBars": True, "HPMPBars": True}',
              '{"ImprovedInterface": True, "BetterEat": True, "XPBars": True, "HPMPBars": True, "RowRework": True}')
          text = text.replace(
              'assert "XPBars = 1" in config and "HPMPBars = 1" in config',
              'assert "XPBars = 1" in config and "HPMPBars = 1" in config and "RowRework = 1" in config')
          p.write_text(text, encoding='utf-8')

          # Controller tests.
          p = Path('tests/ff9_editor.test.cjs')
          text = p.read_text(encoding='utf-8')
          text = text.replace(
              'ImprovedInterface:false, BetterEat:false, XPBars:false, HPMPBars:false',
              'ImprovedInterface:false, BetterEat:false, XPBars:false, HPMPBars:false, RowRework:false')
          text = text.replace(
              "['Memoria','Improved Interface','Better Eat','XP Bars','HP/MP Bars']",
              "['Memoria','Improved Interface','Better Eat','XP Bars','HP/MP Bars','Row Rework']")
          text = text.replace(
              "test('all four Lexeditor runtime toggles are project-owned and independently saveable'",
              "test('all five Lexeditor runtime toggles are project-owned and independently saveable'")
          text = text.replace(
              "['hpmp','HPMPBars']]) {",
              "['hpmp','HPMPBars'],['row','RowRework']]) {")
          text = text.replace("assert.equal(e.run('dirtyCount()'),4);", "assert.equal(e.run('dirtyCount()'),5);")
          text = text.replace(
              "  assert.equal(e.run('state.savedFeatures.features.HPMPBars'),true);\n",
              "  assert.equal(e.run('state.savedFeatures.features.HPMPBars'),true);\n  assert.equal(e.run('state.savedFeatures.features.RowRework'),true);\n")
          p.write_text(text, encoding='utf-8')

          # Source/binary contract tests.
          p = Path('tests/test_ff9_runtime_source.py')
          text = p.read_text(encoding='utf-8')
          text = text.replace(
              'def test_feature_config_has_independent_xp_and_hpmp_toggles():',
              'def test_feature_config_has_independent_xp_hpmp_and_row_toggles():')
          text = text.replace(
              '    assert \'key.Equals("HPMPBars"\' in text\n',
              '    assert \'key.Equals("HPMPBars"\' in text\n    assert "public static Boolean RowRework" in text\n    assert \'key.Equals("RowRework"\' in text\n')
          insertion = r'''

          def test_row_rework_uses_memoria_row_and_melee_contracts():
              runtime = source("Runtime.cs")
              script = source("RowReworkScript.cs")
              assert 'SetBattleMessage("Your enemies close in!", 3)' in runtime
              assert "AllPartyMembersBack" in runtime and "RejectAllBackFormation" in runtime
              assert "desired = doubled && unit.Row == 0 ? -400f : 0f" in runtime
              assert "btl_para.SwitchPlayerRow" in runtime
              assert "BattleCommandId.Attack" in runtime and "!caster.HasLongRangeWeapon" in runtime
              assert "IOverloadOnBattleScriptStartScript" in script
              assert "v.Command.IsShortRange" in script
              assert "(v.Command.AbilityCategory & 8) != 0" in script
              assert "v.Caster.Row == 0" in script and "v.Target.Row == 0" in script
              assert "BonusBackstabAndPenaltyLongDistanceVisually" in script
              assert "TryKillFrozen" in script
          '''.replace('\n          ', '\n')
          marker = '\ndef test_runtime_uses_mod_specific_scriptsloader_filename():'
          if marker not in text:
              raise SystemExit('runtime source test insertion marker missing')
          text = text.replace(marker, insertion + marker, 1)
          text = text.replace(
              '    assert b"LexeditorUIEnhancements" in data\n',
              '    assert b"LexeditorUIEnhancements" in data\n    assert b"LexeditorRowReworkScriptStart" in data\n')
          p.write_text(text, encoding='utf-8')

          # Permanent deterministic runtime build includes the new overload.
          p = Path('.github/workflows/ff9-verification.yml')
          text = p.read_text(encoding='utf-8')
          text = text.replace(
              'games/ff9/runtime/Bootstrap.cs games/ff9/runtime/Runtime.cs games/ff9/runtime/UIEnhancements.cs games/ff9/runtime/BetterEatScript.cs',
              'games/ff9/runtime/Bootstrap.cs games/ff9/runtime/Runtime.cs games/ff9/runtime/UIEnhancements.cs games/ff9/runtime/BetterEatScript.cs games/ff9/runtime/RowReworkScript.cs')
          text = text.replace(
              '          strings "$candidate" | grep -q LexeditorUIEnhancements\n',
              '          strings "$candidate" | grep -q LexeditorUIEnhancements\n          strings "$candidate" | grep -q LexeditorRowReworkScriptStart\n')
          p.write_text(text, encoding='utf-8')
          PY
      - name: Verify feature patcher remains idempotent
        shell: bash
        run: |
          set -euo pipefail
          cp games/ff9/editor.html /tmp/ff9-editor-before
          python tools/ff9/patch_features_ui.py
          cmp /tmp/ff9-editor-before games/ff9/editor.html
      - name: Build exact pinned Memoria runtime
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=. python tools/ff9/extract_memoria_refs.py out/ff9-refs
          mkdir -p out/packages out/ff9-runtime
          for spec in microsoft.netframework.referenceassemblies.net35:1.0.3 unityengine5:5.5.0; do
            name=${spec%:*}; version=${spec#*:}
            curl --fail --location --retry 2 "https://api.nuget.org/v3-flatcontainer/$name/$version/$name.$version.nupkg" -o "out/$name.nupkg"
            unzip -q "out/$name.nupkg" -d "out/packages/$name"
          done
          root=$(dirname "$(readlink -f "$(command -v dotnet)")")
          sdk=$(dotnet --list-sdks | grep '^8\.' | tail -1 | awk '{print $1}')
          csc="$root/sdk/$sdk/Roslyn/bincore/csc.dll"
          ref=out/packages/microsoft.netframework.referenceassemblies.net35/build/.NETFramework/v3.5
          unity=out/packages/unityengine5/lib/net35/UnityEngine.dll
          candidate=out/ff9-runtime/Memoria.Scripts.Lexeditor.dll
          dotnet "$csc" -nologo -target:library -langversion:7.3 -nostdlib+ -deterministic+ \
            -out:"$candidate" \
            -r:"$ref/mscorlib.dll" -r:"$ref/System.dll" -r:"$ref/System.Core.dll" \
            -r:out/ff9-refs/Assembly-CSharp.dll -r:out/ff9-refs/Memoria.Prime.dll -r:"$unity" \
            games/ff9/runtime/Bootstrap.cs games/ff9/runtime/Runtime.cs games/ff9/runtime/UIEnhancements.cs games/ff9/runtime/BetterEatScript.cs games/ff9/runtime/RowReworkScript.cs
          test -s "$candidate"
          strings "$candidate" | grep -q LexeditorRowReworkScriptStart
          cp "$candidate" games/ff9/runtime/Memoria.Scripts.Lexeditor.dll
      - name: Run FF9 checks
        shell: bash
        run: |
          set -euo pipefail
          python -m compileall -q games/ff9 tools/ff9
          python -m pytest -q tests/test_ff9*.py
          node --test tests/ff9_editor.test.cjs
          git diff --check
      - name: Commit implementation and rebuilt runtime
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add games/ff9 tests/test_ff9_features.py tests/test_ff9_runtime_source.py tests/ff9_editor.test.cjs tools/ff9/patch_features_ui.py .github/workflows/ff9-verification.yml
          git diff --cached --stat
          git commit -m 'Implement FF9 row rework tweak'
          git push origin HEAD:codex/ff9-row-rework-20260906
