name: Temporary Bannerlord dependency precedence validation v3

on:
  push:
    branches: [feature/bannerlord-plugin]
    paths:
      - '.github/workflows/temp-bannerlord-dependency-precedence-v3.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/bannerlord-plugin
      - name: Apply resolver and regressions
        shell: python
        run: |
          from pathlib import Path
          import textwrap

          resolver_workflow = Path('.github/workflows/temp-bannerlord-dependency-precedence.yml').read_text(encoding='utf-8')
          section = resolver_workflow.split('      - name: Apply ModuleManager distinct-precedence resolver\n', 1)[1]
          section = section.split('      - name: Write precedence regressions\n', 1)[0]
          resolver_code = textwrap.dedent(section.split('        run: |\n', 1)[1])
          exec(compile(resolver_code, 'dependency-precedence-transform.py', 'exec'))

          launch_path = Path('tests/test_bannerlord_launch.py')
          launch_text = launch_path.read_text(encoding='utf-8')
          start = '    def test_inverse_order_cycle_is_rejected(self):\n'
          end = '    def test_incompatible_enabled_module_is_rejected(self):\n'
          if launch_text.count(start) != 1 or launch_text.count(end) != 1:
              raise SystemExit('cycle test markers are not unique')
          start_at = launch_text.index(start)
          end_at = launch_text.index(end, start_at)
          replacement = '\n'.join([
              '    def test_inverse_order_cycle_is_rejected(self):',
              '        with tempfile.TemporaryDirectory() as name:',
              '            root = Path(name)',
              '            game = root / "game"',
              '            workspace = root / "workspace"',
              '            workspace.mkdir()',
              '            write_module(',
              '                game,',
              '                "Library",',
              '                "Library",',
              '                (("LexerSkillTweaks", True),),',
              '            )',
              '            write_module(',
              '                game,',
              '                "LexerSkillTweaks",',
              '                "LexerSkillTweaks",',
              '                (("Library", False),),',
              '            )',
              '            (workspace / "SubModule.xml").write_text(',
              '                \'<Module><Id value="LexerSkillTweaks" /></Module>\', encoding="utf-8"',
              '            )',
              '            with self.assertRaisesRegex(RuntimeError, "load-order constraints form a cycle"):',
              '                module_load_order(game, workspace)',
              '',
          ])
          launch_path.write_text(launch_text[:start_at] + replacement + launch_text[end_at:], encoding='utf-8')

          tests_workflow = Path('.github/workflows/temp-bannerlord-dependency-precedence-v2.yml').read_text(encoding='utf-8')
          test_section = tests_workflow.split('      - name: Write precedence regressions\n', 1)[1]
          test_section = test_section.split('      - name: Validate precedence fix\n', 1)[0]
          shell = textwrap.dedent(test_section.split('        run: |\n', 1)[1])
          prefix = "cat > tests/test_bannerlord_dependency_precedence.py <<'PY'\n"
          if shell.count(prefix) != 1 or '\nPY\n' not in shell:
              raise SystemExit('precedence regression heredoc shape changed')
          test_content = shell.split(prefix, 1)[1].rsplit('\nPY\n', 1)[0] + '\n'
          Path('tests/test_bannerlord_dependency_precedence.py').write_text(test_content, encoding='utf-8')
      - name: Validate precedence fix
        run: |
          python -m compileall -q games/bannerlord
          python -m unittest tests.test_bannerlord_dependency_precedence tests.test_bannerlord_community_metadata tests.test_bannerlord_launch -v
      - name: Commit precedence fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add games/bannerlord/game_launch.py tests/test_bannerlord_dependency_precedence.py tests/test_bannerlord_launch.py
          git commit -m "Match BUTR dependency distinct precedence"
          git push origin HEAD:feature/bannerlord-plugin
