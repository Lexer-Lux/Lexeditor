name: FF7 small-table UI one-shot

on:
  push:
    branches:
      - work/ff7-complete-kernel-surface
    paths:
      - 'tools/_ff7_ui_small_tables_once.py'

permissions:
  contents: write

jobs:
  apply-test-land:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/ff7-complete-kernel-surface
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Apply compact small-table UI
        run: python tools/_ff7_ui_small_tables_once.py
      - name: Verify source contracts
        run: |
          python tools/verify_ff7_semantic_surface.py
          python tools/verify_ff7_blank_ui.py
      - name: Install Chromium
        run: |
          python -m pip install playwright==1.57.0
          python -m playwright install --with-deps chromium
      - name: Verify rendered FF7
        run: |
          python tools/verify_ff7_rendered_neutral.py
          python tools/verify_ff7_exe_rendered.py
      - name: Commit tested small-table UI and remove scaffold
        shell: bash
        run: |
          git rm tools/_ff7_ui_small_tables_once.py .github/workflows/ff7-ui-small-tables-once.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add games/ff7/editor.html tools/verify_ff7_rendered_neutral.py
          git commit -m 'Polish FF7 small dataset views'
          git push origin HEAD:work/ff7-complete-kernel-surface
