name: Temporary Bannerlord source and dialog hardening

on:
  push:
    branches: [feature/bannerlord-plugin]
    paths:
      - '.github/workflows/temp-bannerlord-source-dialog-hardening.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/bannerlord-plugin
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply Windows source follow-up
        run: python tools/temp_bannerlord_source_windows_followup.py
      - name: Focused validation
        run: |
          python -m py_compile games/bannerlord/project_data.py tests/test_bannerlord_source_safety.py tests/test_bannerlord_plugin.py
          python -m unittest tests.test_bannerlord_source_safety tests.test_bannerlord_ui_contract -v
          python tools/verify_shared_ui_contract.py
          python -c "import glob, subprocess; [subprocess.run(['node','--check',path], check=True) for path in glob.glob('games/bannerlord/editor*.js')]"
          git diff --check
      - name: Commit source fidelity follow-up
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add games/bannerlord/project_data.py tests/test_bannerlord_plugin.py
          git commit -m "Finish Bannerlord raw source fidelity"
          git push origin HEAD:feature/bannerlord-plugin

  regression:
    needs: patch
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/bannerlord-plugin
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install Pillow 'fonttools>=4.59,<5'
      - run: python -m compileall -q games/bannerlord desktop_host.py service_session.py plugin_api.py project_manager.py runtime_bootstrap.py
      - run: python -m unittest discover -s tests -p 'test_bannerlord*.py' -v
      - run: python -m unittest discover -s tests -p 'test_project*.py' -v
      - run: python -m unittest discover -s tests -p test_data_map_coverage.py -v
      - run: python -c "import glob, subprocess; [subprocess.run(['node','--check',path], check=True) for path in glob.glob('games/bannerlord/editor*.js')]"

  shared-contract:
    needs: patch
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/bannerlord-plugin
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python tools/verify_shared_ui_contract.py
      - run: python -m unittest tests.test_bannerlord_ui_contract -v

  browser:
    needs: patch
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/bannerlord-plugin
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install playwright
      - run: python -m playwright install --with-deps chromium
      - run: python tests/bannerlord_browser_check.py out/bannerlord-source-hardening

  cleanup:
    if: ${{ always() && needs.patch.result == 'success' && needs.regression.result == 'success' && needs.shared-contract.result == 'success' && needs.browser.result == 'success' }}
    needs: [patch, regression, shared-contract, browser]
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/bannerlord-plugin
      - name: Remove temporary hardening files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/temp-bannerlord-source-dialog-hardening.yml tools/temp_bannerlord_source_dialog_hardening.py tools/temp_fix_bannerlord_source_dialog_hardening.py tools/temp_bannerlord_source_encoding_fix.py tools/temp_bannerlord_source_windows_fix.py tools/temp_bannerlord_source_windows_followup.py
          git commit -m "Clean Bannerlord source hardening harness"
          git push origin HEAD:feature/bannerlord-plugin
