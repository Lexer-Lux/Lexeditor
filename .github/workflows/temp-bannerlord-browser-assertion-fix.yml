name: Temporary Bannerlord browser assertion fix

on:
  push:
    branches: [feature/bannerlord-plugin]
    paths:
      - '.github/workflows/temp-bannerlord-browser-assertion-fix.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/bannerlord-plugin
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Patch rendered MOD LOADER assertion
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('tests/bannerlord_browser_check.py')
          text = path.read_text(encoding='utf-8')
          old = '''            deployment_text = page.locator("#main").inner_text()\n            assert "MOD LOADER" in deployment_text\n            assert "Bannerlord's native module loader" in deployment_text\n'''
          new = '''            deployment_text = page.locator("#main").inner_text()\n            assert "MOD LOADER" in deployment_text\n            loader_values = page.locator("#main .lex-detail-field input").evaluate_all(\n                "nodes => nodes.map(node => node.value)"\n            )\n            assert any("Bannerlord's native module loader" in value for value in loader_values), loader_values\n'''
          if text.count(old) != 1:
              raise SystemExit(f'Expected one MOD LOADER browser assertion block, found {text.count(old)}')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
      - run: python -m pip install playwright
      - run: python -m playwright install --with-deps chromium
      - run: python tests/bannerlord_browser_check.py out/bannerlord-browser-final
      - name: Commit tested assertion fix and remove workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/bannerlord_browser_check.py
          git rm .github/workflows/temp-bannerlord-browser-assertion-fix.yml
          git commit -m "Fix Bannerlord MOD LOADER browser assertion"
          git push origin HEAD:feature/bannerlord-plugin
