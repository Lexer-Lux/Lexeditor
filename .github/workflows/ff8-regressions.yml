name: FF8 regression checks
on:
  push:
    branches: [fix/ff8-ui-battle-regressions]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Check Python syntax
        run: python -m compileall -q games/ff8
      - name: Run focused regressions when present
        run: |
          if [ -f tools/verify_ff8_ui_battle_regressions.py ]; then
            python tools/verify_ff8_ui_battle_regressions.py
          fi
      - name: Archive tracked source for reproducing checks
        if: always()
        run: git archive --format=zip --output=lexeditor-source.zip HEAD
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lexeditor-source-${{ github.sha }}
          path: lexeditor-source.zip
          retention-days: 1
          if-no-files-found: error
