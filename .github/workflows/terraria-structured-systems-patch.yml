name: Integrate Terraria structured systems editors
# retry after exact patch-source repair

on:
  push:
    branches: [feature/terraria-plugin]
    paths:
      - '.github/workflows/terraria-structured-systems-patch.yml'

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply structured systems expansion
        run: |
          python .github/scripts/terraria_structured_systems_repair.py
          python .github/scripts/terraria_structured_systems_patch.py
      - name: Verify Terraria
        run: |
          python -m compileall -q games/terraria plugin_api.py project_manager.py
          python -m unittest discover -s tests -p 'test_terraria_*.py'
          python -c "from pathlib import Path; h=Path('games/terraria/editor.html').read_text(encoding='utf-8'); Path('/tmp/terraria-editor.js').write_text(h.split('<script>')[-1].split('</script>',1)[0],encoding='utf-8')"
          node --check /tmp/terraria-editor.js
          git diff --check
      - name: Commit systems editors
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -f .github/workflows/terraria-structured-systems-patch.yml .github/scripts/terraria_structured_systems_patch.py .github/scripts/terraria_structured_systems_repair.py
          git add games/terraria/structured_content.py games/terraria/editor.html tests/test_terraria_structured_content.py tests/test_terraria_structured_systems.py
          git commit -m 'Add Terraria structured systems editors'
          git push origin HEAD:feature/terraria-plugin
