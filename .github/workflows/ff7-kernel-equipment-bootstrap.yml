name: FF7 equipment KERNEL bootstrap

on:
  push:
    branches:
      - work/ff7-complete-kernel-surface

permissions:
  contents: write

jobs:
  apply:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/ff7-complete-kernel-surface
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Apply documented item and equipment fields
        shell: bash
        run: |
          printf '%s' '' | base64 -d > /tmp/ff7-equipment-surface.py
          python /tmp/ff7-equipment-surface.py
      - name: Run FF7 binary and semantic regressions
        run: |
          python tools/verify_ff7_datasets.py
          python tools/verify_ff7_accessories.py
          python tools/verify_ff7_semantic_surface.py
          python tools/verify_ff7_extended.py
          python tools/verify_ff7_completion.py
          python tools/verify_ff7_materia_semantics.py
      - name: Commit equipment surface
        shell: bash
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add games/ff7/kernel.py games/ff7/semantics.py tools/verify_ff7_semantic_surface.py
          git commit -m "Expose documented FF7 item and equipment fields"
          git push origin HEAD:work/ff7-complete-kernel-surface
