name: WSE2 package review
on:
  push:
    branches: [fix/warband-managed-wse2]
    paths: ['.github/workflows/wse2-review.yml']
permissions:
  contents: read
jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Export source and exact upstream release for offline review
        run: |
          python - <<'PY'
          import pathlib, subprocess, zipfile, urllib.request, hashlib
          root=pathlib.Path('.')
          with zipfile.ZipFile('wse2-source-review.zip','w',zipfile.ZIP_DEFLATED) as archive:
              archive.writestr('COMMIT_SHA',subprocess.check_output(['git','rev-parse','HEAD']))
              archive.writestr('TRACKED.json',__import__('json').dumps(subprocess.check_output(['git','ls-files','-s']).decode()))
              for raw in subprocess.check_output(['git','ls-files','-z']).decode().split('\0'):
                  p=root/raw
                  if raw and p.is_file() and p.suffix.lower() in {'.py','.js','.cjs','.css','.html','.md','.json','.ini','.toml','.yaml','.yml','.cmd','.bat','.txt','.ps1'}:
                      archive.write(p)
          url='https://github.com/Ruslan-700/WSE2-Releases/releases/download/v1.1.5.1/WSE2.zip'
          data=urllib.request.urlopen(url,timeout=90).read()
          assert hashlib.sha256(data).hexdigest()=='755cbe31bd757595a1e83aea120029d5b35e0c41bd377413eb39d395b3cff503'
          pathlib.Path('WSE2-1.1.5.1.zip').write_bytes(data)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: wse2-source-and-upstream-review
          path: |
            wse2-source-review.zip
            WSE2-1.1.5.1.zip
          retention-days: 1
