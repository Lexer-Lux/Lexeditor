name: FFX-X2 checks

on:
  pull_request:
    paths:
      - '.github/workflows/ffx-x2-checks.yml'

permissions:
  contents: write

concurrency:
  group: ffx-x2-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cleanup-dresspheres:
    if: github.head_ref == 'feature/ffx-x2-plugin'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/ffx-x2-plugin
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Update attribution and documentation
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              target = Path(path)
              text = target.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise RuntimeError(f'{path}: expected exactly one match, found {count}: {old[:100]!r}')
              target.write_text(text.replace(old, new, 1), encoding='utf-8')

          replace_once(
              'games/ffx_x2/server.py',
              '"notes": "English/US command animations and accessory base ability/price fields are structured; other FFX-2 formats remain read/extract-only until proved.",',
              '"notes": "English/US command animations, accessory base ability/price fields, and dressphere ability-tree pairs are structured; other FFX-2 formats remain read/extract-only until proved.",')
          replace_once(
              'games/ffx_x2/server.py',
              '"status": "partial", "coverage": "two-structured-families", "openable": False},',
              '"status": "partial", "coverage": "three-structured-families", "openable": False},')

          credits_path = Path('ui/credits-sources.json')
          credits = json.loads(credits_path.read_text(encoding='utf-8'))
          rows = credits['plugins']['ffx-x2']['contributions']
          if not any(row.get('url') == 'https://github.com/HeartlessSeph/FFX2-010-Templates' for row in rows):
              insert_at = next((i + 1 for i, row in enumerate(rows)
                                if row.get('url') == 'https://github.com/Karifean/FFXDataParser'), len(rows))
              rows.insert(insert_at, {
                  'name': 'HeartlessSeph / FFX2-010-Templates',
                  'role': 'Independent research cross-check for FFX-2 accessory and dressphere job.bin layouts; no source copied.',
                  'url': 'https://github.com/HeartlessSeph/FFX2-010-Templates',
              })
          credits_path.write_text(json.dumps(credits, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          codex = 'codex/ffx-x2/README.md'
          replace_once(
              codex,
              'The `+0x24..+0x53` creature extension, string references, unknown bytes and trailing strings remain opaque.\n\n## Structured write guarantees',
              '''The `+0x24..+0x53` creature extension, string references, unknown bytes and trailing strings remain opaque.\n\n### FFX-2 `job.bin` — dressphere ability trees\n\nPath:\n\n`FFX2_Data/ffx_ps2/ffx2/master/new_uspc/battle/kernel/job.bin`\n\nFahrenheit independently defines each FFX-2 `Job` record as `0xE4` bytes. Its 46-byte stat-growth block is followed by 32 `u16` values. `HeartlessSeph/FFX2-010-Templates` independently models the same region as sixteen records containing a required ability followed by the learned ability. Lexeditor therefore writes only:\n\n- sixteen required-ability IDs and ability IDs at `+0x3C..+0x7B`.\n\nStat-growth coefficients, weapon references, creature-extension data, flags, text references, unknown bytes and trailing strings remain opaque.\n\n## Structured write guarantees''')
          replace_once(codex,
              'The plugin currently exposes **15 proved structured tables**: thirteen FFX tables and two FFX-2 tables.',
              'The plugin currently exposes **16 proved structured tables**: thirteen FFX tables and three FFX-2 tables.')
          replace_once(codex,
              'reads and validates all 15 currently supported structured tables with the production parsers;',
              'reads and validates all 16 currently supported structured tables with the production parsers;')
          replace_once(codex,
              '- Two FFX-2 structured tables: command animation IDs and accessory base abilities/price.',
              '- Three FFX-2 structured tables: command animation IDs, accessory base abilities/price, and dressphere ability prerequisites/IDs.')

          worklog = 'worklog/issues/github-461.md'
          replace_once(worklog,
              'Status: actionable. One branch/PR: `feature/ffx-x2-plugin` / draft PR #462.',
              'Status: awaiting real-install acceptance. One branch/PR: `feature/ffx-x2-plugin` / draft PR #462.')
          replace_once(worklog,
              '- `HeartlessSeph/FFX2-010-Templates` independently establishes the FFX-2 `accessory.bin` `0x54` record layout.',
              '- `HeartlessSeph/FFX2-010-Templates` independently establishes the FFX-2 `accessory.bin` `0x54` layout and the sixteen required-ability / ability pairs in `job.bin`; Fahrenheit independently fixes `Job` at `0xE4` bytes with the same 32-u16 ability-tree region after its 46-byte stat-growth block.')
          replace_once(worklog,
              '''- **Two conservative FFX-2 structured tables**:\n  - `new_uspc/battle/kernel/command.bin` — animation IDs only at `+0x08/+0x0A`.\n  - `new_uspc/battle/kernel/accessory.bin` — four base ability IDs at `+0x18..+0x1F` and u32 price at `+0x20`; creature extension and strings remain opaque.\n- All **15 structured tables** use exact VBF-header MD5 plus exact table SHA-256 stale-write protection.''',
              '''- **Three conservative FFX-2 structured tables**:\n  - `new_uspc/battle/kernel/command.bin` — animation IDs only at `+0x08/+0x0A`.\n  - `new_uspc/battle/kernel/accessory.bin` — four base ability IDs at `+0x18..+0x1F` and u32 price at `+0x20`; creature extension and strings remain opaque.\n  - `new_uspc/battle/kernel/job.bin` — sixteen required-ability / learned-ability pairs at `+0x3C..+0x7B`; stat growth, weapons, creature data, flags and strings remain opaque.\n- All **16 structured tables** use exact VBF-header MD5 plus exact table SHA-256 stale-write protection.''')
          replace_once(worklog,
              '- FFX-2 accessory regressions compare all bytes outside the six writable fields and preserve the complete creature extension and trailing strings.',
              '- FFX-2 accessory regressions compare all bytes outside the six writable fields and preserve the complete creature extension and trailing strings.\n- FFX-2 dressphere regressions constrain changes to selected four-byte ability-tree pairs and preserve stat-growth bytes, post-tree data, other records and trailing strings byte-for-byte.')

          acceptance = 'worklog/acceptance/ffx-x2/README.md'
          replace_once(acceptance,
              '- Every one of the 15 `structured[]` rows has `status: "validated"`.',
              '- Every one of the 16 `structured[]` rows has `status: "validated"`.')
          replace_once(acceptance,
              '- FFX-2 accessory reports `0x54` records and a zero-based range as required by its parser.',
              '- FFX-2 accessory reports `0x54` records and a zero-based range as required by its parser.\n- FFX-2 dressphere `job.bin` reports `0xE4` records and sixteen ability-tree pairs per row.')
          replace_once(acceptance,
              '- **FFX Base Stats** opens `ply_save.bin` and exposes only base HP, base MP, Strength, Defense, Magic, Magic Defense, Agility, Luck, Evasion and Accuracy. It must not expose text/name metadata, AP, current HP/MP, current stats or any field at/after record `+0x14`.\n- No project file is created merely by browsing/refreshing.',
              '- **FFX Base Stats** opens `ply_save.bin` and exposes only base HP, base MP, Strength, Defense, Magic, Magic Defense, Agility, Luck, Evasion and Accuracy. It must not expose text/name metadata, AP, current HP/MP, current stats or any field at/after record `+0x14`.\n- **X-2 Dresspheres** opens `job.bin` and exposes exactly sixteen required-ability / ability-ID pairs per record. Stat-growth coefficients, weapon/creature data, flags and strings must remain uneditable.\n- No project file is created merely by browsing/refreshing.')
          PY
          python tools/generate_credits.py
          python tools/generate_credits.py --check
          python plugin_metadata.py
          python -m py_compile games/ffx_x2/server.py
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add games/ffx_x2/server.py ui/credits-sources.json ui/credits.json codex/ffx-x2/README.md worklog/issues/github-461.md worklog/acceptance/ffx-x2/README.md
          if git diff --cached --quiet; then
            echo 'Cleanup already applied.'
            exit 0
          fi
          git commit -m "Document FFX-2 dressphere ability trees"
          git push origin HEAD:feature/ffx-x2-plugin
