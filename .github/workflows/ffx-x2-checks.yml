name: FFX-X2 checks

on:
  push:
    branches: [master, feature/ffx-x2-plugin, 'work/ffx-x2-*']
    paths:
      - 'plugins/ffx_x2/**'
      - 'tests/test_ffx_x2_*.py'
      - 'tools/ffx_x2/**'
      - 'docs/acceptance/ffx-x2.md'
      - 'runtime_bootstrap.py'
      - 'plugin_api.py'
      - 'service_session.py'
      - 'ui/framework.js'
      - 'ui/framework.css'
      - 'ui/credits-sources.json'
      - 'ui/credits.json'
      - 'ui/mod-loading.json'
      - '.github/workflows/ffx-x2-checks.yml'
  pull_request:
    paths:
      - 'plugins/ffx_x2/**'
      - 'tests/test_ffx_x2_*.py'
      - 'tools/ffx_x2/**'
      - 'docs/acceptance/ffx-x2.md'
      - 'runtime_bootstrap.py'
      - 'plugin_api.py'
      - 'service_session.py'
      - 'ui/framework.js'
      - 'ui/framework.css'
      - 'ui/credits-sources.json'
      - 'ui/credits.json'
      - 'ui/mod-loading.json'
      - '.github/workflows/ffx-x2-checks.yml'

permissions:
  contents: read

concurrency:
  group: ffx-x2-${{ github.ref }}
  cancel-in-progress: true

jobs:
  regression:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install tests
        run: python -m pip install pytest
      - name: Python syntax
        run: python -m compileall -q plugins/ffx_x2
      - name: Acceptance PowerShell syntax
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          $path = (Resolve-Path 'tools/ffx_x2/run-verifier.ps1').Path
          [void][System.Management.Automation.Language.Parser]::ParseFile($path, [ref]$tokens, [ref]$errors)
          if ($errors.Count) {
            $errors | Format-List
            exit 1
          }
      - name: Editor module and markup contract
        shell: bash
        run: >-
          node --check plugins/ffx_x2/editor.js
          && python -c "from pathlib import Path; h=Path('plugins/ffx_x2/editor.html').read_text(encoding='utf-8'); c=Path('plugins/ffx_x2/editor.css').read_text(encoding='utf-8'); assert '<style' not in h and '<script>' not in h; assert './editor.js' in h and './editor.css' in h; assert len(c) <= 6000; print('markup-only editor + CSS budget OK')"
      - name: Plugin and metadata contracts
        run: >-
          python -c "from plugins.ffx_x2.plugin import PLUGIN; from plugin_api import validate_plugin; from runtime_bootstrap import SERVICE_MODULES; validate_plugin(PLUGIN); assert 'plugins.ffx_x2.server' in SERVICE_MODULES; print(PLUGIN.name)"
          && python tools/generate_credits.py --check
          && python plugin_metadata.py
      - name: FFX-X2 shared UI budget
        run: >-
          python -c "import runpy; c=runpy.run_path('tools/verify_shared_ui_budget.py')['counts'](); f={k:v for k,v in c.items() if k.startswith('plugins/ffx_x2/')}; assert not f, f; print('FFX-X2 shared UI budget: zero local shared selectors/hand-built rows')"
      - name: FFX-X2 regressions
        run: >-
          python -m pytest -q
          tests/test_ffx_x2_vbf.py
          tests/test_ffx_x2_paths.py
          tests/test_ffx_x2_deployment.py
          tests/test_ffx_x2_launch.py
          tests/test_ffx_x2_play_api.py
          tests/test_ffx_x2_verify_install.py
          tests/test_ffx_x2_theme.py
          tests/test_ffx_x2_treasures.py
          tests/test_ffx_x2_item_prices.py
          tests/test_ffx_x2_auto_ability_prices.py
          tests/test_ffx_x2_ffx_auto_abilities.py
          tests/test_ffx_x2_ffx_player_stats.py
          tests/test_ffx_x2_ctb_base.py
          tests/test_ffx_x2_mix_table.py
          tests/test_ffx_x2_item_shops.py
          tests/test_ffx_x2_gear_shops.py
          tests/test_ffx_x2_ffx_commands.py
          tests/test_ffx_x2_ffx2_abilities.py
          tests/test_ffx_x2_ffx2_accessories.py
          tests/test_ffx_x2_ffx2_jobs.py
          tests/test_ffx_x2_ui_focus.py
      - name: Managed service smoke
        run: python -c "from plugins.ffx_x2.plugin import smoke; [print('PASS:', line) for line in smoke()]"

  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install browser tools
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium
      - name: FFX-X2 page-module route
        run: >-
          python -c "import runpy; p=runpy.run_path('tests/plugin_module_routes_check.py')['check']('ffx_x2'); assert not p, p; print('FFX-X2 page modules served and loaded')"
      - name: FFX-X2 rendered acceptance
        run: python tests/test_ffx_x2_browser_check.py --screenshots out/ffx-x2-browser
      - name: Upload browser acceptance
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ffx-x2-browser-acceptance
          path: out/ffx-x2-browser
          if-no-files-found: warn

  candidate:
    if: github.event_name == 'pull_request'
    needs: [regression, browser]
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install candidate build dependencies
        run: python -m pip install -r requirements.txt pyinstaller
      - name: Distribution hygiene
        run: python -m unittest tests.test_distribution_hygiene -v
      - name: Build and smoke frozen Lexeditor
        shell: pwsh
        run: |
          python -c "from tools.build_distribution import build_app, smoke; candidate=build_app(); smoke(candidate); print(candidate)"
          $smoke = Get-Content -LiteralPath .\build\distribution\smoke.json -Raw | ConvertFrom-Json
          if (-not [bool]$smoke.passed -or -not [bool]$smoke.childStopped) {
            throw "Frozen Lexeditor service smoke did not pass."
          }
          if (@($smoke.plugins) -notcontains "ffx-x2") {
            throw "Frozen Lexeditor candidate did not discover the ffx-x2 plugin."
          }
      - name: Build and smoke frozen install verifier
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path build\distribution | Out-Null
          @'
          from plugins.ffx_x2.verify_install import main

          if __name__ == "__main__":
              raise SystemExit(main())
          '@ | Set-Content -LiteralPath build\distribution\ffx_x2_verify_entry.py -Encoding utf8
          python -m PyInstaller --noconfirm --clean --onefile --console --name FFX-X2-Verify --paths . build\distribution\ffx_x2_verify_entry.py
          $empty = Join-Path $env:RUNNER_TEMP "ffx-x2-empty-install"
          New-Item -ItemType Directory -Force -Path $empty | Out-Null
          $smokeJson = Join-Path $env:RUNNER_TEMP "ffx-x2-verifier-smoke.json"
          $process = Start-Process -FilePath .\dist\FFX-X2-Verify.exe `
            -ArgumentList @("--game-root", $empty, "--json") `
            -RedirectStandardOutput $smokeJson -NoNewWindow -Wait -PassThru
          if ($process.ExitCode -eq 0) {
            throw "Frozen verifier unexpectedly accepted an empty installation."
          }
          $report = Get-Content -LiteralPath $smokeJson -Raw | ConvertFrom-Json
          if ($report.contract -ne "Lexeditor.ffx-x2-install-verification" -or [bool]$report.verificationPassed) {
            throw "Frozen verifier smoke returned the wrong contract/result."
          }
      - name: Assemble acceptance bundle
        shell: pwsh
        run: |
          $bundle = "out\ffx-x2-windows-candidate"
          New-Item -ItemType Directory -Force -Path $bundle | Out-Null
          Copy-Item -Recurse -Force .\dist\Lexeditor (Join-Path $bundle "Lexeditor")
          Copy-Item -Force .\dist\FFX-X2-Verify.exe (Join-Path $bundle "FFX-X2-Verify.exe")
          Copy-Item -Force .\tools\ffx_x2\run-verifier.ps1 (Join-Path $bundle "run-verifier.ps1")
          Copy-Item -Force .\docs\acceptance\ffx-x2.md (Join-Path $bundle "ACCEPTANCE.md")
          [ordered]@{
            contract = "Lexeditor.ffx-x2-candidate"
            pr = 462
            headSha = "${{ github.event.pull_request.head.sha }}"
            workflowRun = "${{ github.run_id }}"
            frozenAppSmoke = $true
            frozenVerifierSmoke = $true
          } | ConvertTo-Json | Set-Content -LiteralPath (Join-Path $bundle "CANDIDATE.json") -Encoding utf8
      - name: Upload Windows acceptance candidate
        uses: actions/upload-artifact@v4
        with:
          name: ffx-x2-windows-candidate-${{ github.event.pull_request.head.sha }}
          path: out/ffx-x2-windows-candidate
          if-no-files-found: error
          retention-days: 14
