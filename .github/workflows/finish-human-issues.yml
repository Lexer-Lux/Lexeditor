name: Finish human-facing issues
on:
  push:
    branches: [fix/global-issues-20260906]
    paths: [maintenance/finish-human-issues.patch, .github/workflows/finish-human-issues.yml]
permissions:
  contents: write
  issues: write
concurrency:
  group: lexeditor-knowledge-store
  cancel-in-progress: false
jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          path: request
          submodules: false
          sparse-checkout: maintenance/finish-human-issues.patch
          sparse-checkout-cone-mode: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: master
          path: repository
          submodules: false
          sparse-checkout: |
            tools/knowledge_store.py
            worklog
          sparse-checkout-cone-mode: false
      - name: Apply reviewed archival repair only to its exact baseline
        working-directory: repository
        run: |
          set -euo pipefail
          test "$(git hash-object tools/knowledge_store.py)" = 1c9eb7584c0b5e5c78370205bf58ac46c188eec9
          git apply --check --recount ../request/maintenance/finish-human-issues.patch
          git apply --recount ../request/maintenance/finish-human-issues.patch
          python3 -m py_compile tools/knowledge_store.py
          git config user.name 'Lexeditor Issue Archive'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git config submodule.recurse false
          git config fetch.recurseSubmodules false
          python3 - <<'PY'
          import importlib.util,urllib.request
          spec=importlib.util.spec_from_file_location('store','tools/knowledge_store.py');m=importlib.util.module_from_spec(spec);spec.loader.exec_module(m)
          req=urllib.request.Request('https://github.com/user-attachments/assets/fixture')
          handler=m.AttachmentRedirect()
          assert handler.redirect_request(req,None,302,'',{},'https://github-production-user-asset-6210df.s3.amazonaws.com/fixture')
          for url in ['http://github.com/fixture','https://evil.s3.amazonaws.com/fixture','https://github.com.evil.test/fixture']:
              try: handler.redirect_request(req,None,302,'',{},url)
              except RuntimeError: pass
              else: raise AssertionError('Unsafe redirect accepted')
          PY
      - name: Preserve current issue text, original source records and attachments
        working-directory: repository
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tools/knowledge_store.py archive --exclude 86
      - name: Commit and verify the canonical archive before editing or deleting discussion
        working-directory: repository
        run: |
          set -euo pipefail
          git add -f tools/knowledge_store.py worklog/issues worklog/attachments worklog/migrations/comment-archive
          git commit -qm 'Repair attachment archival and preserve current issue sources before cleanup [skip ci]'
          pushed=0
          for attempt in 1 2 3; do
            git fetch --no-recurse-submodules origin master
            git rebase origin/master
            if git push origin HEAD:master; then pushed=1; break; fi
          done
          test "$pushed" = 1
          git fetch --no-recurse-submodules origin master
          git merge-base --is-ancestor HEAD origin/master
          git diff --exit-code HEAD -- worklog
      - name: Correct reviewed premature waiting states without overwriting new edits
        working-directory: repository
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import json,pathlib,subprocess,time
          changes={
            88:('2026-09-06T12:45:59Z','Prepare a safe open-world progression design','Make FF8 less linear without breaking progression. First map story gates and technical dependencies, then propose a concrete order compatible with saves, missables and Journal #87.\n\n**Actionable: design preparation remains.** Implementation still requires your approval of that proposal; you do not need to design it from scratch.'),
            90:('2026-09-06T12:46:03Z','Prepare the full-screen world map design','Open a full-screen map menu from the world-map Back action.\n\n**Actionable: recover the earlier requirements and prepare a concrete layout and interaction proposal.** A short issue body is not evidence that you supplied no context; do not ask you to repeat the whole design.'),
            140:('2026-09-06T13:54:12Z','Plan physical shop displays that match stock','Make physical shop displays reflect their stock where possible. Vanilla already has more menu entries than display positions.\n\n**Actionable: prepare representative display layouts and their limits before requesting a choice.** Full automatic one-to-one shelving is not established; no display implementation is ready to test.'),
            160:('2026-09-06T13:55:25Z','Replace or hide misleading Player-page core-drain rates','Show the overhaul’s real core-drain information on the Player page, or provide the requested option to hide the misleading vanilla rows.\n\n**Actionable.** The script-owned display bindings are identified; implementation remains. Your original request already permits hiding them, so another design approval is not required for that option.'),
            162:('2026-09-06T13:55:29Z','Expose pickup sound routing and add brass audio','Expose item-to-sound-category mappings and casing sound set/name controls. Use one brass event for native and custom casing pickup paths.\n\n**Actionable: editor/audio preparation remains.** The custom sample is the separate input still needed.\n\n- [ ] Supply the brass pickup sound with its source and credit/permission details when ready; this does not block exposing the existing sound controls.'),
            234:('2026-09-06T13:29:24Z','Explain horse movement before its rework','You believe the human movement work is done and want to understand horse movement before designing its rework.\n\n**Actionable: research and explain the horse gaits, input transitions, speed controls and relevant limits.** Do not ask you for the horse design before supplying that explanation; human-side acceptance has not been independently verified here.'),
            318:('2026-09-06T12:59:43Z','Plan Guardian Force acquisition without Draw','Provide a way to acquire GFs without Draw while preserving normal progression.\n\n**Actionable: map every GF’s acquisition evidence and propose replacement sources, recovery for missed GFs and progression safeguards.** Prepare the acquisition table before asking you to approve a concrete design; no replacement system is implemented yet.')
          }
          results=[]
          for number,(expected,title,body) in changes.items():
              endpoint=f'repos/Lexer-Lux/Lexeditor/issues/{number}'
              current=json.loads(subprocess.check_output(['gh','api',endpoint]))
              if current['updated_at']!=expected:
                  results.append({'issue':number,'result':'skipped-concurrent-change'});continue
              archived=False
              for path in pathlib.Path(f'worklog/issues/github-{number}/sources').glob('issue-*.json'):
                  saved=json.loads(subprocess.check_output(['git','show','HEAD:'+path.as_posix()]))['record']
                  if saved.get('body')==current.get('body') and saved.get('title')==current.get('title'):archived=True;break
              assert archived,'Missing exact committed pre-edit body'
              labels=[x['name'] for x in current['labels'] if x['name'] not in {'waiting','untested','actionable','unfeasible'}]+['actionable']
              payload={'title':title,'body':body,'labels':labels}
              changed=json.loads(subprocess.check_output(['gh','api',endpoint,'--method','PATCH','--input','-'],input=json.dumps(payload).encode()))
              assert changed['body']==body and changed['title']==title
              results.append({'issue':number,'result':'updated','url':changed['html_url']});time.sleep(1.1)
          pathlib.Path('issue-correction-results.json').write_text(json.dumps(results,indent=2))
          print(json.dumps(results))
          PY
      - name: Delete only the exact unchanged comments whose archives and attachments are committed
        working-directory: repository
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tools/knowledge_store.py cleanup
      - name: Record remaining comments and issue-format validation
        if: always()
        working-directory: repository
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import json,pathlib,subprocess
          def pages(url):return [x for page in json.loads(subprocess.check_output(['gh','api','--paginate','--slurp',url])) for x in page]
          issues=[i for i in pages('repos/Lexer-Lux/Lexeditor/issues?state=all&per_page=100') if 'pull_request' not in i]
          ids={i['number'] for i in issues if i['number']!=86}
          comments=[c for c in pages('repos/Lexer-Lux/Lexeditor/issues/comments?per_page=100') if int(c['issue_url'].rsplit('/',1)[1]) in ids]
          failures=[];workflow={'waiting','untested','actionable','unfeasible'}
          for i in issues:
              if i['state']!='open' or i['number']==86:continue
              labels={l['name'] for l in i['labels']};body=(i.get('body') or '').strip()
              if len(labels&workflow)!=1:failures.append([i['number'],'workflow-label-count'])
              if not body:failures.append([i['number'],'empty-body'])
              if labels&{'waiting','untested'} and (not body or not body.splitlines()[-1].startswith('- [ ] ')):failures.append([i['number'],'missing-final-checklist'])
          result={'issues':len(issues),'remaining_comments':len(comments),'remaining_comment_ids':[c['id'] for c in comments],'format_failures':failures,'excluded':[86]}
          pathlib.Path('issue-cleanup-validation.json').write_text(json.dumps(result,indent=2));print(json.dumps(result))
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: finished-issue-cleanup-${{ github.run_id }}
          path: |
            repository/knowledge-result.json
            repository/issue-correction-results.json
            repository/issue-cleanup-validation.json
            repository/worklog/attachments/index.json
            repository/worklog/migrations/comment-archive/snapshot.json
          if-no-files-found: warn
          retention-days: 30
