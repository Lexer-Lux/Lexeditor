name: FF7 PR 434 final verification

on:
  push:
    branches:
      - work/ff7-complete-kernel-surface

permissions:
  contents: read

jobs:
  binary-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/ff7-complete-kernel-surface
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Verify FF7 binary and semantic contracts
        run: |
          python tools/verify_ff7_datasets.py
          python tools/verify_ff7_kernel_layout_contract.py
          python tools/verify_ff7_accessories.py
          python tools/verify_ff7_semantic_surface.py
          python tools/verify_ff7_extended.py
          python tools/verify_ff7_completion.py
          python tools/verify_ff7_edition_parity.py
          python tools/verify_ff7_blank_ui.py
