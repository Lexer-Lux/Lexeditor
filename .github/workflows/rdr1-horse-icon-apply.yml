name: Apply RDR1 horse-icon integration
on:
  push:
    branches: [fix/rdr1-horse-icon]
    paths: ['.github/workflows/rdr1-horse-icon-apply.yml']
permissions:
  contents: write
concurrency:
  group: rdr1-horse-icon-integration
  cancel-in-progress: false
jobs:
  apply:
    runs-on: windows-2022
    timeout-minutes: 10
    steps:
      - name: Check out exact branch source without optional gitlinks
        shell: pwsh
        run: |
          git init .
          git -c protocol.version=2 fetch --depth=1 "https://github.com/${env:GITHUB_REPOSITORY}.git" $env:GITHUB_SHA
          git checkout --detach FETCH_HEAD
      - name: Apply exact integration edits
        shell: pwsh
        run: python .github/rdr1-horse-icon-apply.py
      - name: Verify source and map-icon contracts
        shell: pwsh
        run: |
          python -m compileall -q games/rdr
          python tools/verify_rdr_map_icon_features.py
          python tools/verify_rdr_archive_deployment.py
          git diff --check
      - name: Commit source integration and remove staging script
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          Remove-Item .github/rdr1-horse-icon-apply.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add games/rdr/server.py games/rdr/plugin.py .github/rdr1-horse-icon-apply.py
          git commit -m "feat(rdr1): deploy recreated owned-horse map icon"
          $auth = [Convert]::ToBase64String([Text.Encoding]::ASCII.GetBytes("x-access-token:$env:GH_TOKEN"))
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth" push "https://github.com/$env:GITHUB_REPOSITORY.git" HEAD:refs/heads/fix/rdr1-horse-icon
