name: Build archive reader
on:
  pull_request:
    paths:
      - 'tools/build_archive_runtime.py'
      - 'tools/archive_runtime_workflow.py'
      - '.github/workflows/archive-runtime.yml'
  workflow_dispatch:
jobs:
  archive:
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python tools/build_archive_runtime.py --output "${{ runner.temp }}/archive-runtime"
      - uses: actions/upload-artifact@v4
        with:
          name: archive-runtime-windows-x64
          path: ${{ runner.temp }}/archive-runtime
          retention-days: 7
