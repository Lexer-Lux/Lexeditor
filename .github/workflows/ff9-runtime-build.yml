name: Build FF9 Lexeditor runtime
on:
  push:
    branches: [codex/ff9-complete-20260906]
    paths:
      - 'games/ff9/runtime/LexeditorFF9.cs'
      - 'games/ff9/features.py'
      - 'tools/ff9/extract_memoria_refs.py'
      - '.github/workflows/ff9-runtime-build.yml'
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/ff9-complete-20260906
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Extract verified publisher references
        run: python tools/ff9/extract_memoria_refs.py out/ff9-refs
      - name: Download compile-time framework and Unity references
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out/packages
          for spec in microsoft.netframework.referenceassemblies.net35:1.0.3 unityengine5:5.5.0; do
            name=${spec%:*}; version=${spec#*:}
            curl --fail --location --retry 2 "https://api.nuget.org/v3-flatcontainer/$name/$version/$name.$version.nupkg" -o "out/$name.nupkg"
            unzip -q "out/$name.nupkg" -d "out/packages/$name"
          done
      - name: Compile runtime against pinned Memoria
        shell: bash
        run: |
          set -euo pipefail
          root=$(dirname "$(readlink -f "$(command -v dotnet)")")
          sdk=$(dotnet --list-sdks | grep '^8\.' | tail -1 | awk '{print $1}')
          csc="$root/sdk/$sdk/Roslyn/bincore/csc.dll"
          ref=out/packages/microsoft.netframework.referenceassemblies.net35/build/.NETFramework/v3.5
          unity=out/packages/unityengine5/lib/net35/UnityEngine.dll
          dotnet "$csc" -nologo -target:library -langversion:7.3 -nostdlib+ \
            -out:games/ff9/runtime/Memoria.Scripts.dll \
            -r:"$ref/mscorlib.dll" -r:"$ref/System.dll" -r:"$ref/System.Core.dll" \
            -r:out/ff9-refs/Assembly-CSharp.dll -r:out/ff9-refs/Memoria.Prime.dll -r:"$unity" \
            games/ff9/runtime/LexeditorFF9.cs
          test -s games/ff9/runtime/Memoria.Scripts.dll
          strings games/ff9/runtime/Memoria.Scripts.dll | grep -q BetterEatScript
          strings games/ff9/runtime/Memoria.Scripts.dll | grep -q LexeditorBootstrap
          strings games/ff9/runtime/Memoria.Scripts.dll | grep -q ImprovedInterface
          sha256sum games/ff9/runtime/Memoria.Scripts.dll
      - name: Verify deployment ownership and toggle behavior
        run: |
          python -m pip install pytest
          python -m pytest -q tests/test_ff9_features.py
      - name: Commit compiled runtime
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Lexeditor FF9 Runtime Build'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add games/ff9/runtime/Memoria.Scripts.dll
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Build FF9 Improved Interface and Better Eat runtime'
          git push origin HEAD:codex/ff9-complete-20260906
