name: Temporary Bannerlord community module metadata editor

on:
  push:
    branches: [feature/bannerlord-plugin]
    paths:
      - '.github/workflows/temp-bannerlord-community-module-metadata.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/bannerlord-plugin
      - name: Add URL/update metadata and safe module-level insertion
        shell: python
        run: |
          from pathlib import Path

          def replace_once(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected one match, found {count}")
              return text.replace(old, new, 1)

          path = Path("games/bannerlord/module_data.py")
          text = path.read_text(encoding="utf-8")
          text = replace_once(text, "from pathlib import Path\nimport shutil\n", "from pathlib import Path\nimport re\nimport shutil\n", "regex import")
          text = replace_once(
              text,
              '        "moduleType": _value(root, "ModuleType"),\n        "defaultModule": _truth(_value(root, "DefaultModule")),\n',
              '        "moduleType": _value(root, "ModuleType"),\n        "url": _value(root, "Url"),\n        "updateInfo": _value(root, "UpdateInfo"),\n        "defaultModule": _truth(_value(root, "DefaultModule")),\n',
              "metadata read fields",
          )
          text = replace_once(
              text,
              '    "moduleType": "ModuleType",\n    "defaultModule": "DefaultModule",\n',
              '    "moduleType": "ModuleType",\n    "url": "Url",\n    "updateInfo": "UpdateInfo",\n    "defaultModule": "DefaultModule",\n',
              "editable metadata fields",
          )
          text = replace_once(
              text,
              '_OPTIONAL_METADATA = set(_ENUM_METADATA)\n\n\ndef _set_value(parent: ET.Element, tag: str, value: str) -> bool:\n',
              '_OPTIONAL_TEXT_METADATA = {"url", "updateInfo"}\n_OPTIONAL_METADATA = set(_ENUM_METADATA) | _OPTIONAL_TEXT_METADATA\n_UPDATE_INFO_PATTERN = re.compile(\n    r"(?:NexusMods:[0-9]+|GitHub:[A-Za-z0-9._-]+/[A-Za-z0-9._-]+|"\n    r"NexusMods:[0-9]+;GitHub:[A-Za-z0-9._-]+/[A-Za-z0-9._-]+|"\n    r"GitHub:[A-Za-z0-9._-]+/[A-Za-z0-9._-]+;NexusMods:[0-9]+)"\n)\n_MODULE_STRUCTURAL_TAGS = {\n    "DependedModules",\n    "ModulesToLoadAfterThis",\n    "IncompatibleModules",\n    "DependedModuleMetadatas",\n    "LoadAfterModules",\n    "OptionalDependModules",\n    "SubModules",\n    "Xmls",\n}\n\n\ndef _set_value(parent: ET.Element, tag: str, value: str) -> bool:\n',
              "optional metadata constants",
          )
          insertion = '''\n\ndef _module_child_or_create(parent: ET.Element, tag: str) -> ET.Element:\n    element = parent.find(tag)\n    if element is not None:\n        return element\n    element = ET.Element(tag)\n    children = list(parent)\n    structural_index = next(\n        (index for index, child in enumerate(children) if child.tag in _MODULE_STRUCTURAL_TAGS),\n        len(children),\n    )\n    parent.insert(structural_index, element)\n    return element\n\n\ndef _set_module_value(parent: ET.Element, tag: str, value: str) -> bool:\n    element = parent.find(tag)\n    if element is None:\n        element = _module_child_or_create(parent, tag)\n        element.set("value", value)\n        return True\n    old = element.attrib.get("value", (element.text or "").strip())\n    if old == value:\n        return False\n    element.set("value", value)\n    return True\n\n\ndef _set_optional_module_value(parent: ET.Element, tag: str, value: str) -> bool:\n    if value:\n        return _set_module_value(parent, tag, value)\n    element = parent.find(tag)\n    if element is None:\n        return False\n    parent.remove(element)\n    return True\n'''
          text = replace_once(
              text,
              '\n\ndef _normalize_metadata(edits: dict) -> dict:\n',
              insertion + '\n\ndef _normalize_metadata(edits: dict) -> dict:\n',
              "module metadata insertion helpers",
          )
          text = replace_once(
              text,
              '        elif field in _ENUM_METADATA:\n            value = str(raw).strip()\n            if value and value not in _ENUM_METADATA[field]:\n                raise ValueError(f"{field} must be one of: {\', \'.join(sorted(_ENUM_METADATA[field]))}")\n            normalized[field] = value\n        else:\n',
              '        elif field in _ENUM_METADATA:\n            value = str(raw).strip()\n            if value and value not in _ENUM_METADATA[field]:\n                raise ValueError(f"{field} must be one of: {\', \'.join(sorted(_ENUM_METADATA[field]))}")\n            normalized[field] = value\n        elif field in _OPTIONAL_TEXT_METADATA:\n            value = str(raw).strip()\n            if field == "updateInfo" and value and _UPDATE_INFO_PATTERN.fullmatch(value) is None:\n                raise ValueError(\n                    "updateInfo must be NexusMods:<id>, GitHub:<user>/<repo>, or both separated by a semicolon"\n                )\n            normalized[field] = value\n        else:\n',
              "optional text validation",
          )
          text = replace_once(
              text,
              '        setter = _set_optional_value if field in _OPTIONAL_METADATA else _set_value\n        changes += int(setter(root, _EDITABLE_METADATA[field], value))\n',
              '        setter = _set_optional_module_value if field in _OPTIONAL_METADATA else _set_module_value\n        changes += int(setter(root, _EDITABLE_METADATA[field], value))\n',
              "module metadata setters",
          )
          path.write_text(text, encoding="utf-8")

          editor = Path("games/bannerlord/editor_core.js")
          text = editor.read_text(encoding="utf-8")
          text = replace_once(
              text,
              'const metadata=m=>({name:m.name,id:m.id,version:m.version,moduleCategory:m.moduleCategory||"",moduleType:m.moduleType||"",defaultModule:!!m.defaultModule,singleplayer:!!m.singleplayer,multiplayer:!!m.multiplayer});',
              'const metadata=m=>({name:m.name,id:m.id,version:m.version,moduleCategory:m.moduleCategory||"",moduleType:m.moduleType||"",url:m.url||"",updateInfo:m.updateInfo||"",defaultModule:!!m.defaultModule,singleplayer:!!m.singleplayer,multiplayer:!!m.multiplayer});',
              "frontend metadata payload",
          )
          text = replace_once(
              text,
              '        ...fieldRow("Module type",select(m.moduleType||"",[["","Default / not set"],["Community","Community"],["Official","Official"],["OfficialOptional","Official optional"]],value=>setModuleField("moduleType",value))),\n        ...fieldRow("Default module",checkbox(m.defaultModule,value=>setModuleField("defaultModule",value))),\n',
              '        ...fieldRow("Module type",select(m.moduleType||"",[["","Default / not set"],["Community","Community"],["Official","Official"],["OfficialOptional","Official optional"]],value=>setModuleField("moduleType",value))),\n        ...fieldRow("URL",textInput(m.url||"",value=>setModuleField("url",value),{placeholder:"Optional module/project URL"})),\n        ...fieldRow("Update info",textInput(m.updateInfo||"",value=>setModuleField("updateInfo",value),{placeholder:"NexusMods:1234;GitHub:user/repo"})),\n        ...fieldRow("Default module",checkbox(m.defaultModule,value=>setModuleField("defaultModule",value))),\n',
              "module metadata controls",
          )
          text = replace_once(
              text,
              '      el("div",{class:"bl-note"},"The remaining SubModule.xml records have dedicated list/detail tabs so record identity stays in the master list and editable fields stay in the detail pane.")\n',
              '      el("div",{class:"bl-note"},"Update info accepts NexusMods:<id>, GitHub:<user>/<repo>, or both separated by a semicolon. Missing module metadata is inserted before dependency/submodule/XML sections; existing node order is preserved."),\n      el("div",{class:"bl-note"},"The remaining SubModule.xml records have dedicated list/detail tabs so record identity stays in the master list and editable fields stay in the detail pane.")\n',
              "module metadata note",
          )
          editor.write_text(text, encoding="utf-8")
      - name: Add metadata regressions and attribution
        shell: python
        run: |
          from pathlib import Path
          import json

          Path("tests/test_bannerlord_module_metadata.py").write_text('''from pathlib import Path\nimport tempfile\nimport unittest\n\nfrom games.bannerlord.module_data import read_submodule, save_module\n\n\nclass BannerlordModuleMetadataTests(unittest.TestCase):\n    def test_url_and_update_info_round_trip_and_insert_before_structural_sections(self):\n        with tempfile.TemporaryDirectory() as name:\n            path = Path(name) / "SubModule.xml"\n            path.write_text(\n                """<Module>\n  <Name value=\"Example\" />\n  <Id value=\"Example\" />\n  <Version value=\"v1.0.0\" />\n  <DependedModules><DependedModule Id=\"Native\" /></DependedModules>\n  <SubModules />\n</Module>\n""",\n                encoding="utf-8",\n            )\n            result = save_module(path, {"metadata": {\n                "moduleCategory": "Singleplayer",\n                "moduleType": "Community",\n                "url": "https://example.invalid/mod",\n                "updateInfo": "NexusMods:1234;GitHub:user/repo",\n            }})\n            module = result["module"]\n            self.assertEqual(module["url"], "https://example.invalid/mod")\n            self.assertEqual(module["updateInfo"], "NexusMods:1234;GitHub:user/repo")\n            rewritten = path.read_text(encoding="utf-8")\n            structural = rewritten.index("<DependedModules>")\n            for tag in ("<ModuleCategory", "<ModuleType", "<Url", "<UpdateInfo"):\n                self.assertLess(rewritten.index(tag), structural)\n\n    def test_existing_metadata_position_and_unknown_attributes_are_preserved(self):\n        with tempfile.TemporaryDirectory() as name:\n            path = Path(name) / "SubModule.xml"\n            path.write_text(\n                """<Module>\n  <Name value=\"Example\" />\n  <Url value=\"old\" Future=\"keep\" />\n  <Id value=\"Example\" />\n  <Version value=\"v1.0.0\" />\n  <DependedModules />\n</Module>\n""",\n                encoding="utf-8",\n            )\n            before = path.read_text(encoding="utf-8").index("<Url")\n            save_module(path, {"metadata": {"url": "new"}})\n            rewritten = path.read_text(encoding="utf-8")\n            self.assertIn('Future="keep"', rewritten)\n            self.assertLess(rewritten.index("<Url"), rewritten.index("<Id"))\n            self.assertGreaterEqual(before, 0)\n\n    def test_blank_optional_community_metadata_removes_elements(self):\n        with tempfile.TemporaryDirectory() as name:\n            path = Path(name) / "SubModule.xml"\n            path.write_text(\n                '<Module><Name value="Example" /><Id value="Example" /><Version value="v1.0.0" /><Url value="x" /><UpdateInfo value="NexusMods:1" /></Module>',\n                encoding="utf-8",\n            )\n            result = save_module(path, {"metadata": {"url": "", "updateInfo": ""}})\n            self.assertEqual(result["module"]["url"], "")\n            self.assertEqual(result["module"]["updateInfo"], "")\n            rewritten = path.read_text(encoding="utf-8")\n            self.assertNotIn("<Url", rewritten)\n            self.assertNotIn("<UpdateInfo", rewritten)\n\n    def test_update_info_grammar_matches_documented_community_forms(self):\n        with tempfile.TemporaryDirectory() as name:\n            path = Path(name) / "SubModule.xml"\n            path.write_text('<Module><Name value="Example" /><Id value="Example" /><Version value="v1.0.0" /></Module>', encoding="utf-8")\n            accepted = [\n                "NexusMods:123",\n                "GitHub:user/repo",\n                "NexusMods:123;GitHub:user/repo",\n                "GitHub:user/repo;NexusMods:123",\n            ]\n            for value in accepted:\n                save_module(path, {"metadata": {"updateInfo": value}})\n                self.assertEqual(read_submodule(path)["updateInfo"], value)\n            with self.assertRaisesRegex(ValueError, "updateInfo must be"):\n                save_module(path, {"metadata": {"updateInfo": "https://example.invalid"}})\n\n\nif __name__ == "__main__":\n    unittest.main()\n''', encoding="utf-8")

          credits_path = Path("ui/credits-sources.json")
          credits = json.loads(credits_path.read_text(encoding="utf-8"))
          contributions = credits["plugins"]["bannerlord"]["contributions"]
          if not any(row.get("url") == "https://github.com/BUTR/Bannerlord.XmlSchemas" for row in contributions):
              contributions.append({
                  "name": "BUTR / Bannerlord.XmlSchemas",
                  "role": "Reference for SubModule.xml community metadata fields and UpdateInfo grammar.",
                  "url": "https://github.com/BUTR/Bannerlord.XmlSchemas",
              })
          credits_path.write_text(json.dumps(credits, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
      - name: Validate metadata editor and regenerate credits
        run: |
          python -m compileall -q games/bannerlord
          python -m unittest tests.test_bannerlord_module_metadata tests.test_bannerlord_module_categories tests.test_bannerlord_community_editor -v
          node --check games/bannerlord/editor_core.js
          python tools/generate_credits.py
          python tools/generate_credits.py --check
      - name: Commit module metadata editor
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add games/bannerlord/module_data.py games/bannerlord/editor_core.js tests/test_bannerlord_module_metadata.py ui/credits-sources.json ui/credits.json
          git commit -m "Edit Bannerlord community module metadata"
          git push origin HEAD:feature/bannerlord-plugin
