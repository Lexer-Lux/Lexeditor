name: Build release installers

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: Branch, tag, or commit to package
        required: true
        default: master
        type: string
  pull_request:
    paths:
      - .github/workflows/distribution-build.yml
      - tools/build_distribution.py
      - tests/test_distribution_hygiene.py
      - requirements.txt
      - runtime_bootstrap.py
      - app.py

permissions:
  contents: read

concurrency:
  group: distribution-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  native-installers:
    name: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022, macos-14]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40

    steps:
      - name: Check out the requested source revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.source_ref || github.event.pull_request.head.sha }}
          submodules: false
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python build dependencies
        run: python -m pip install -r requirements.txt pyinstaller

      - name: Install Linux native webview backend
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libopengl0 libxcb-cursor0 libxkbcommon-x11-0 libnss3 libasound2t64
          python -m pip install PySide6

      - name: Install Windows installer compiler
        if: runner.os == 'Windows'
        run: choco install innosetup --yes --no-progress

      - name: Verify distribution resource hygiene
        run: python -m unittest discover -s tests -p 'test_distribution_hygiene.py' -v

      - name: Build native application and installer
        run: python -c "from tools.build_distribution import build_app, build_installer; print('Application:', build_app()); print('Installer:', build_installer())"

      - name: Run full frozen service smoke where current plugin descriptors validate
        if: runner.os == 'Windows'
        run: python -c "from pathlib import Path; from tools.build_distribution import smoke; smoke(Path('dist/Lexeditor/Lexeditor.exe'))"

      - name: Record current POSIX plugin-discovery dependency
        if: runner.os != 'Windows'
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          from app import discover_plugins

          expected = "ff7r has an invalid project descriptor"
          try:
              discover_plugins()
          except ValueError as error:
              if str(error) != expected:
                  raise
          else:
              raise SystemExit("Known POSIX descriptor blocker is gone; restore the full frozen service smoke on this platform.")

          report = Path("build/distribution/posix-plugin-discovery-blocker.txt")
          report.parent.mkdir(parents=True, exist_ok=True)
          report.write_text(
              "Full plugin discovery is not accepted on this exact remote revision.\n"
              "Current blocker: games/ff7r/plugin.py uses a Windows-shaped default project path, "
              "while plugin_api validates ModProjectSpec.default_root with POSIX Path.is_absolute().\n"
              "PR #499 does not patch plugin_api or GamePlugin metadata; it builds/tests packaging only "
              "until the shared API/plugin contract change lands.\n",
              encoding="utf-8",
          )
          print(report.read_text("utf-8"))
          PY

      - name: Record exact packaged revision
        run: python -c "from pathlib import Path; import subprocess; p=Path('build/distribution/source-sha.txt'); p.parent.mkdir(parents=True,exist_ok=True); p.write_text(subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()+chr(10),encoding='utf-8')"

      - name: Verify one native installer was produced
        run: python -c "from pathlib import Path; p=Path('dist/installers'); files=[x for x in p.iterdir() if x.is_file()]; assert len(files)==1, files; print(files[0])"

      - name: Install and uninstall Linux package
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo dpkg -i dist/installers/*.deb
          test -x /opt/lexeditor/Lexeditor
          test -f /usr/share/applications/lexeditor.desktop
          grep -Fx 'Exec=/opt/lexeditor/Lexeditor' /usr/share/applications/lexeditor.desktop
          grep -Fx 'Terminal=false' /usr/share/applications/lexeditor.desktop
          sudo dpkg -r lexeditor
          test ! -e /opt/lexeditor/Lexeditor
          test ! -e /usr/share/applications/lexeditor.desktop

      - name: Install and remove macOS package
        if: runner.os == 'macOS'
        shell: bash
        run: |
          PKG="$(find dist/installers -maxdepth 1 -name '*.pkg' -print -quit)"
          test -n "$PKG"
          sudo installer -pkg "$PKG" -target /
          test -x /Applications/Lexeditor.app/Contents/MacOS/Lexeditor
          sudo rm -rf /Applications/Lexeditor.app
          sudo pkgutil --forget io.github.lexer-lux.lexeditor >/dev/null || true
          test ! -e /Applications/Lexeditor.app

      - name: Install, smoke and uninstall Windows package
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $installer = Get-ChildItem dist\installers\*.exe | Select-Object -First 1
          if (-not $installer) { throw 'Windows installer was not produced' }
          $process = Start-Process -FilePath $installer.FullName -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART' -PassThru -Wait
          if ($process.ExitCode -ne 0) { throw "Installer failed with exit code $($process.ExitCode)" }
          $app = Join-Path $env:LOCALAPPDATA 'Programs\Lexeditor\Lexeditor.exe'
          $uninstaller = Join-Path $env:LOCALAPPDATA 'Programs\Lexeditor\unins000.exe'
          $startShortcut = Join-Path $env:APPDATA 'Microsoft\Windows\Start Menu\Programs\Lexeditor\Lexeditor.lnk'
          if (-not (Test-Path $app)) { throw "Installed executable missing: $app" }
          if (-not (Test-Path $startShortcut)) { throw "Start Menu shortcut missing: $startShortcut" }
          $smokePath = Join-Path $env:GITHUB_WORKSPACE 'build\distribution\installed-smoke.json'
          $smoke = Start-Process -FilePath $app -ArgumentList '--smoke-service',$smokePath -PassThru -Wait
          if ($smoke.ExitCode -ne 0) { throw "Installed smoke failed with exit code $($smoke.ExitCode)" }
          if (-not (Test-Path $smokePath)) { throw "Installed smoke report missing: $smokePath" }
          $process = Start-Process -FilePath $uninstaller -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART' -PassThru -Wait
          if ($process.ExitCode -ne 0) { throw "Uninstaller failed with exit code $($process.ExitCode)" }
          if (Test-Path $app) { throw "Installed executable remained after uninstall: $app" }

      - name: Verify installed smoke report
        if: runner.os == 'Windows'
        run: python -c "from pathlib import Path; import json; p=Path('build/distribution/installed-smoke.json'); r=json.loads(p.read_text('utf-8')); assert r.get('passed') and r.get('childStopped'), r; print(r)"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: Lexeditor-${{ runner.os }}-${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          path: |
            dist/installers/
            build/distribution/smoke.json
            build/distribution/installed-smoke.json
            build/distribution/posix-plugin-discovery-blocker.txt
            build/distribution/source-sha.txt
            build/Lexeditor/warn-Lexeditor.txt
          if-no-files-found: error
          retention-days: 30
