name: RDR1 checks
on:
  push:
    branches: [fix/rdr1-editor-runtime-handoff]
  pull_request:
    paths:
      - 'games/rdr/**'
      - 'tools/*rdr*'
      - '.github/workflows/rdr1-checks.yml'
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Collect tracked source for isolated regression checks
        shell: python
        run: |
          import pathlib, subprocess, tarfile
          paths = subprocess.check_output(['git', 'ls-files', '-z']).decode().split('\0')
          extensions = {'.py', '.html', '.js', '.css', '.json', '.md', '.txt', '.ini', '.yml', '.yaml', '.cpp', '.h', '.hpp', '.cs', '.csproj', '.ps1', '.cmd'}
          with tarfile.open('rdr1-source.tar.gz', 'w:gz') as archive:
              for name in paths:
                  path = pathlib.Path(name)
                  if path.is_file() and (path.suffix.lower() in extensions or path.name == '.gitignore'):
                      archive.add(path, arcname=name, recursive=False)
      - uses: actions/upload-artifact@v4
        with:
          name: rdr1-source
          path: rdr1-source.tar.gz
          retention-days: 3
