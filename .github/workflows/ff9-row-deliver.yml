name: FF9 row rework deliver
on:
  push:
    branches: [codex/ff9-row-rework-20260906]
    paths:
      - '.github/workflows/ff9-row-deliver.yml'
permissions:
  contents: write
jobs:
  deliver:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/ff9-row-rework-20260906
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - run: python -m pip install pytest pyyaml
      - name: Reuse verified implementation steps
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import os
          from pathlib import Path
          import subprocess
          import yaml

          workflow = yaml.safe_load(Path('.github/workflows/ff9-row-finalize.yml').read_text(encoding='utf-8'))
          steps = workflow['jobs']['finalize']['steps']
          wanted = {
              'Implement issue 390',
              'Verify feature patcher remains idempotent',
              'Build exact pinned Memoria runtime',
              'Run FF9 checks',
          }
          for step in steps:
              if step.get('name') not in wanted:
                  continue
              print('RUN:', step['name'], flush=True)
              subprocess.run(['bash', '-c', step['run']], check=True, env=os.environ)
          PY
      - name: Commit candidate without workflow-file mutation
        shell: bash
        run: |
          set -euo pipefail
          git checkout -- .github/workflows/ff9-verification.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add games/ff9 tests/test_ff9_features.py tests/test_ff9_runtime_source.py tests/ff9_editor.test.cjs tools/ff9/patch_features_ui.py
          git diff --cached --stat
          git commit -m 'Implement FF9 row rework tweak'
          git push origin HEAD:codex/ff9-row-rework-20260906
