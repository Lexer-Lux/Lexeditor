name: Temporary Bannerlord XML concurrency

on:
  push:
    branches: [feature/bannerlord-plugin]
    paths:
      - '.github/workflows/temp-bannerlord-xml-concurrency.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/bannerlord-plugin
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply XML concurrency patch
        run: python tools/temp_bannerlord_xml_concurrency.py
      - name: Focused validation
        run: |
          python -m py_compile games/bannerlord/xml_patch.py games/bannerlord/gauntlet_data.py games/bannerlord/module_xml_data.py games/bannerlord/server.py tests/test_bannerlord_gauntlet.py tests/test_bannerlord_moduledata.py
          python -m unittest tests.test_bannerlord_gauntlet tests.test_bannerlord_moduledata tests.test_bannerlord_xsd tests.test_bannerlord_ui_contract -v
          python -c "from games.bannerlord.plugin import smoke; print(smoke())"
          python tools/verify_shared_ui_contract.py
          python -c "import glob, subprocess; [subprocess.run(['node','--check',path], check=True) for path in glob.glob('games/bannerlord/editor*.js')]"
          git diff --check
      - name: Commit XML concurrency hardening
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add games/bannerlord/xml_patch.py games/bannerlord/gauntlet_data.py games/bannerlord/module_xml_data.py games/bannerlord/server.py games/bannerlord/editor_gauntlet.js games/bannerlord/editor_moduledata.js tests/test_bannerlord_gauntlet.py tests/test_bannerlord_moduledata.py
          git commit -m "Protect Bannerlord XML editors from stale writes"
          git push origin HEAD:feature/bannerlord-plugin

  regression:
    needs: patch
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/bannerlord-plugin
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install Pillow 'fonttools>=4.59,<5'
      - run: python -m compileall -q games/bannerlord desktop_host.py service_session.py plugin_api.py project_manager.py runtime_bootstrap.py
      - run: python -m unittest discover -s tests -p 'test_bannerlord*.py' -v
      - run: python -m unittest discover -s tests -p 'test_project*.py' -v
      - run: python -m unittest discover -s tests -p test_data_map_coverage.py -v
      - run: python -c "import glob, subprocess; [subprocess.run(['node','--check',path], check=True) for path in glob.glob('games/bannerlord/editor*.js')]"

  shared-contract:
    needs: patch
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/bannerlord-plugin
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python tools/verify_shared_ui_contract.py
      - run: python -m unittest tests.test_bannerlord_ui_contract -v

  browser:
    needs: patch
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/bannerlord-plugin
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install playwright
      - run: python -m playwright install --with-deps chromium
      - run: python tests/bannerlord_browser_check.py out/bannerlord-xml-concurrency

  cleanup:
    if: always()
    needs: [patch, regression, shared-contract, browser]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/bannerlord-plugin
      - name: Remove temporary XML concurrency harness
        run: |
          rm -f tools/temp_bannerlord_xml_concurrency.py .github/workflows/temp-bannerlord-xml-concurrency.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "Remove temporary Bannerlord XML concurrency harness"
            git push origin HEAD:feature/bannerlord-plugin
          fi
