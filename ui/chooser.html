<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Lexeditor</title>
  <script>if(new URLSearchParams(location.hash.slice(1)).get("lexTransition")==="home")document.documentElement.classList.add("lex-transition-entry")</script>
  <link rel="stylesheet" href="framework.css">
  <link rel="stylesheet" href="neutral.css">
  <style>

    :root {
      /* The home screen declares no colours. It carries the unthemed
         presentation that ui/neutral.css supplies to Blank and to every other
         page without a game of its own, so a change there reaches this screen
         too. Only this screen's own behaviour switches live here. Anything
         drawn over cover art keeps its own white ink, because the art is dark
         whatever the interface is. */
      --lex-chooser-menu-height:9vh;
      --lex-page-overflow:auto;
      --lex-absent-desaturation:40%;
    }
    body { margin:0; overflow-x:hidden; min-height:100vh; color:var(--lex-text); background:var(--lex-bg); font:14px/1.45 var(--lex-font); opacity:1; transition:opacity .12s ease; }
    /* The home screen is revealed by fading its own surface in, rather than
       being held invisible and switched on: an instant opacity flip at the
       end of the slide is what read as the contents blinking out. */
    /* The outgoing editor already reveals a complete Home snapshot. Hiding the
       newly loaded Home document made that identical surface flash away once
       at native navigation. Keep the destination opaque from its first paint. */
    html.lex-transition-entry body{visibility:visible!important;opacity:1!important;transition:none!important}
    body{opacity:1;transition:opacity .22s ease}
    .chooser-surface { min-height:100vh; }
    /* An editor frame is laid out in the viewport without the scrollbar
       gutter, so while one covers this page the menu's own bar stayed visible
       in a strip down the right edge of every editor screen. The menu keeps
       its position and only stops scrolling. */
    html.lex-editor-open { --lex-page-overflow:hidden; }
    /* The home bar is the same chrome as an editor's: a shared border below it,
       not a bright accent stripe. Lexer: "the main menu still has a fuckton of
       weird custom styling. like the green bar below the menu bar." */
    #chooser-window-header { --lex-command-row-height:var(--lex-chooser-menu-height); position:relative; z-index:60; box-sizing:border-box; border-bottom:1px solid var(--lex-border); }
    .chooser-title { flex:1; user-select:none; -webkit-user-select:none; }
    .chooser-title h1 { user-select:none; -webkit-user-select:none; }
    .chooser-window-controls { position:relative; z-index:80; justify-self:end; }
    h1 { margin:0; font:900 clamp(20px,3.3vh,30px)/1 var(--lex-heading-font); }
    main { --lex-game-row-gap:52px; display:grid; grid-template-columns:repeat(auto-fit,minmax(190px,238px)); justify-content:center; align-items:start; column-gap:25px; row-gap:var(--lex-game-row-gap); padding:66px 28px 28px; }
    .game { position:relative; display:block; aspect-ratio:2/3; min-width:0; box-sizing:border-box; overflow:visible; padding:0; border:3px solid #30353d; border-radius:0; background:#20242a; box-shadow:0 9px 22px #0006; cursor:pointer; isolation:isolate; transition:transform .12s ease,box-shadow .12s ease,border-color .12s ease; }
    .game:hover,.game:focus-visible,.game:focus-within { z-index:5; border-color:var(--state-color); transform:translateY(-3px); box-shadow:0 13px 30px #0009; }
    .state-added { --state-color:#4f9a5a; }
    .state-warning,.state-broken { --state-color:#d6a936; }
    .state-not-added { --state-color:#b74a42; }
    .game-cover { position:absolute; inset:0; z-index:-3; width:100%; height:100%; object-fit:cover; }
    .cover-fallback { position:absolute; inset:0; z-index:-4; display:grid; place-items:center; padding:18px; color:#727984; background:radial-gradient(circle at 50% 28%,#303641,#171a20 62%,#0e1014); font:900 54px/1 var(--lex-heading-font); text-align:center; }
    .game-name { position:absolute; z-index:7; right:0; bottom:calc(100% + 3px); left:0; display:grid; height:var(--lex-game-row-gap); overflow:hidden; padding:0 7px; place-items:center; color:#fff; background:transparent; box-shadow:none; font:800 clamp(13px,1.2vw,18px)/1.15 var(--lex-heading-font); font-size:var(--game-name-size,clamp(13px,1.2vw,18px)); text-align:center; text-shadow:0 1px 3px #000; transform:translateY(12px); opacity:0; pointer-events:none; transition:transform .18s cubic-bezier(.2,.8,.2,1),opacity .1s ease; }
    /* fitGameName() shrinks the name to the row gap. Past its floor the
       clamp ellipsizes whole lines instead of cutting one in half. */
    /* The clamp above needs a clipping box, and a clip is measured on the line
       boxes: the descender of a letter like y, and the shadow under it, paint
       below the last line, so a flush box cut them off - the shadow simply
       stopped under the letter. Four pixels of padding give the descender its
       room back; the height fitter counts them because they are part of the
       element's scroll height. The same clip took the shadow off the right of
       the last letter in a hard line - Lexer saw the right edge of FF8's and
       FF9's names cut off on hover - so the sides get the same room. */
    .game-name-text { display:-webkit-box; box-sizing:border-box; max-width:100%; overflow:hidden; padding:0 4px 4px; -webkit-box-orient:vertical; -webkit-line-clamp:var(--game-name-lines,2); overflow-wrap:anywhere; }
    .game:hover .game-name,.game:focus-visible .game-name,.game:focus-within .game-name { transform:translateY(0); opacity:1; }
    /* A stamp: a ring of opaque ink with a mark in it, pressed on slightly
       crooked. The mark alone says the state, so there is no word to read. */
    .state-indicator { position:absolute; z-index:8; right:10px; bottom:10px; display:grid; width:38px; height:38px; place-items:center; box-sizing:border-box; padding:0; border:3px solid var(--state-color); border-radius:50%; color:var(--state-color); background:transparent; box-shadow:none; font:900 20px/1 "Segoe UI Symbol",var(--lex-font); rotate:-11deg; filter:drop-shadow(0 1px 2px #000a); }
    .game:hover .state-indicator,.game:focus-within .state-indicator { rotate:-5deg; }
    /* Stamped ink is never perfectly even. */
    .state-indicator::after { position:absolute; inset:-3px; border:3px solid currentColor; border-radius:50%; content:""; opacity:.5; clip-path:polygon(0 0,62% 0,58% 30%,100% 34%,100% 100%,0 100%); }
    .state-symbol { display:grid; width:20px; min-width:20px; height:20px; place-items:center; line-height:1; }
    /* The mark is centred on the stamp, not on its own line box. */
    .state-symbol > * { display:block; line-height:1; }
    .state-not-added .state-symbol { font:900 21px/1 "Segoe UI Symbol",sans-serif; }
    /* The mark is the whole stamp; the word it used to expand into is gone. */
    .state-label { display:none; }
    .state-not-added .game-cover { filter:grayscale(var(--lex-absent-desaturation)); }
    .state-indicator.scanning { color:transparent; }
    .state-indicator.scanning::after { width:14px; height:14px; border:3px solid #fff; border-right-color:transparent; border-radius:50%; content:""; animation:spin .7s linear infinite; }
    .game-hover { position:absolute; inset:0; display:flex; box-sizing:border-box; flex-direction:column; justify-content:flex-end; gap:6px; padding:15px 15px 45px; background:#00000078; opacity:0; transition:opacity .12s ease; }
    .game:hover .game-hover,.game:focus-visible .game-hover,.game:focus-within .game-hover { opacity:1; }
    .hover-detail { overflow-wrap:anywhere; color:#f0f2f5; text-shadow:0 1px 3px #000; font-size:11px; line-height:1.3; }
    .hover-detail:empty { display:none; }
    .game-folder-button,.game-version { position:absolute; z-index:3; top:12px; opacity:0; visibility:hidden; transition:opacity .1s ease,visibility .1s; }
    .game:hover .game-folder-button,.game:focus-visible .game-folder-button,.game:focus-within .game-folder-button,.game:hover .game-version,.game:focus-visible .game-version,.game:focus-within .game-version { opacity:1; visibility:visible; }
    .game-folder-button { left:12px; display:grid; width:38px; height:38px; place-items:center; padding:7px; color:#fff; border:0; border-radius:4px; background:#111b; box-shadow:0 2px 8px #0009; }
    .game-folder-button:hover { color:#fff; background:#4b5563; box-shadow:0 0 0 2px #fff8,0 4px 12px #000c; transform:scale(1.08); }
    .game-folder-button svg { width:24px; height:24px; }
    .game-version { right:12px; color:#fff; text-shadow:0 1px 4px #000; font:800 12px/1 var(--lex-font); }
    .game-action-icon { position:absolute; top:50%; left:50%; display:grid; width:82px; height:82px; place-items:center; color:#fff; filter:drop-shadow(0 3px 5px #000b); font:72px/1 "Segoe UI Emoji","Segoe UI Symbol",sans-serif; transform:translate(-50%,-50%); }
    .game-action-icon svg { width:70px; height:70px; fill:none; stroke:currentColor; stroke-width:2.4; stroke-linecap:round; stroke-linejoin:round; }
    @keyframes spin { to { transform:rotate(360deg); } }
    @keyframes loading-spin { to { rotate:360deg } }
    .dialog-actions button { align-self:flex-start; padding:9px 20px; color:var(--lex-accent-text); border:0; border-radius:5px; background:var(--lex-accent); cursor:pointer; font-weight:800; }
    button:disabled { cursor:default; filter:grayscale(1); opacity:.45; }
    @media (max-width:520px) { main { grid-template-columns:minmax(180px,238px); padding:20px; } }
    .modal-backdrop { position:fixed; inset:0; z-index:100; display:grid; place-items:center; padding:24px; background:#000b; }
    .modal-backdrop[hidden] { display:none; }
    .dialog { width:min(590px,calc(100vw - 48px)); padding:24px; border:1px solid var(--lex-border); border-radius:9px; background:var(--lex-panel); box-shadow:0 24px 70px #000; }
    .dialog {text-align:center;}
    .dialog-actions>button {flex:1 1 0;min-width:0;}
    .dialog h2 { margin:0 0 13px; }
    .dialog-message { color:var(--lex-text); white-space:pre-wrap; }
    .dialog-problems { margin:14px 0 0; padding-left:20px; color:var(--lex-warning,#c0392b); }
    .dialog-progress { margin-top:14px; color:var(--lex-muted); }
    .dialog-actions { display:flex; flex-wrap:wrap; gap:9px; margin-top:22px; }
    .dialog-actions .secondary { color:var(--lex-text); border:1px solid var(--lex-border); background:var(--lex-panel-2); }
    .resident-handle { position:fixed; z-index:40; top:0; right:0; bottom:0; display:block; width:var(--lex-resident-handle-width,5vw); height:100vh; overflow:hidden; padding:0; border:0; border-radius:0; color:#fff; background:#303640 left center/cover no-repeat; box-shadow:-4px 0 14px #0008; }
    body:has(.resident-handle:not([hidden])) .chooser-window-controls>.lex-window-actions{opacity:.5}
    body:has(.resident-handle:not([hidden])) .chooser-window-controls>.lex-window-actions:hover{opacity:1}
    /* The game cover is the handle's texture, not a picture to read: it is
       blurred and darkened behind the arrow and the save mark. Both amounts
       are developer settings, and 0% leaves the art untouched. The dark film
       is the same knob as the brightness, so one number darkens the whole
       treatment instead of two that fight each other. The sliver the reader
       sees is the cover's left edge, which is the part of a poster that is
       still recognisable at a hand's width - a centred crop showed the middle
       of the artwork, where the name and the figures are. */
    .resident-handle::before { position:absolute; inset:-10px; background:inherit; background-position:left center; background-size:cover; filter:blur(var(--lex-resident-cover-blur,8px)) brightness(calc(1 - var(--lex-resident-cover-darken,.58))); content:""; }
    .resident-handle::after { position:absolute; inset:0; background:rgb(8 10 13 / calc(var(--lex-resident-cover-darken,.58) * .74)); content:""; }
    .resident-arrow { position:absolute; z-index:1; top:50%; left:50%; display:grid; place-items:center; transform:translate(-50%,-50%); filter:drop-shadow(0 1px 3px #000); }
    .resident-arrow svg { width:auto; height:var(--lex-resident-arrow-height,33vh); fill:none; stroke:currentColor; stroke-width:6.5; stroke-linecap:butt; stroke-linejoin:miter; }
    .resident-save { position:absolute; z-index:2; top:var(--lex-resident-safe-inset,15%); left:50%; display:grid; width:var(--lex-resident-save-size,30px); height:var(--lex-resident-save-size,30px); place-items:center; transform:translateX(-50%); }
    .resident-save>svg { width:100%; height:100%; }
    .resident-save.disabled>svg { opacity:.28;filter:grayscale(1); }
    .resident-save .lex-save-count { top:-7px; right:-8px; }
    .resident-game-name { position:absolute; z-index:2; left:50%; bottom:var(--lex-resident-safe-inset,15%); display:block; max-height:var(--lex-resident-name-height,26vh); overflow:hidden; color:#fff; font:700 var(--lex-resident-name-size,12px)/1.05 "Lexend","Segoe UI",sans-serif; letter-spacing:.02em; text-overflow:ellipsis; text-shadow:0 1px 3px #000; white-space:nowrap; writing-mode:vertical-rl; transform:translateX(-50%) rotate(180deg); }
    .resident-handle:hover,.resident-handle:focus-visible { width:calc(var(--lex-resident-handle-width,5vw) + .65vw); color:#fff; }
    .resident-handle[hidden] { display:none; }
    /* Developer drawer handle: mirrors the back-to-editor handle on the
       opposite edge. Same sizing rules, arrow flipped to point outward. */
    .lexer-handle { position:fixed; z-index:40; top:0; left:0; bottom:0; display:block; width:var(--lex-resident-handle-width,5vw); height:100vh; overflow:hidden; padding:0; border:0; border-radius:0; color:#fff; background:#303640 center/cover no-repeat; box-shadow:4px 0 14px #0008; }
    .lexer-handle:hover,.lexer-handle:focus-visible { width:calc(var(--lex-resident-handle-width,5vw) + .65vw); color:#fff; }
    .lexer-handle[hidden] { display:none; }
    .lexer-handle-name { position:absolute; z-index:2; left:50%; bottom:var(--lex-resident-safe-inset,15%); display:block; max-height:var(--lex-resident-name-height,26vh); overflow:hidden; color:#fff; font:700 var(--lex-resident-name-size,12px)/1.05 "Lexend","Segoe UI",sans-serif; letter-spacing:.02em; text-overflow:ellipsis; text-shadow:0 1px 3px #000; white-space:nowrap; writing-mode:vertical-rl; transform:translateX(-50%); }
    /* Developer helper-version reporting path. Lexeditor helpers are custom
       forks with self-updating disabled, because a user updating one part on
       its own can break the whole program, so this panel only ever REPORTS
       what upstream has published. It slides in over the left edge, opened by its own edge handle. */
    .lexer-panel { position:fixed; z-index:70; top:0; left:0; bottom:0; display:flex; width:min(430px,86vw); box-sizing:border-box; flex-direction:column; gap:12px; padding:18px; border-right:1px solid var(--lex-border); background:var(--lex-panel); box-shadow:14px 0 34px #000a; transform:translateX(-100%); transition:transform .22s cubic-bezier(.4,0,.2,1); }
    .lexer-panel.open { transform:translateX(0); }
    .lexer-panel[hidden] { display:none; }
    .lexer-panel-head { display:flex; align-items:center; justify-content:space-between; gap:10px; }
    .lexer-panel-head h2 { margin:0; font:900 15px/1 var(--lex-heading-font,var(--lex-font)); letter-spacing:.08em; }
    .lexer-panel-note { margin:0; color:var(--lex-muted); font-size:11px; line-height:1.45; }
    .lexer-panel { width:100vw; }
    /* The helper cards keep their narrowest comfortable width and the games
       table takes the rest: thirteen columns whose headings alone need about
       970px. Below this width the two panels stack, or the games table has
       to scroll sideways to reach its own last column. */
    .lexer-dev-body { display:grid; grid-template-columns:minmax(0,1fr); gap:18px; flex:1 1 auto; min-height:0; }
    .lexer-dev-body:has(.lexer-dev-helpers:not([hidden])) { grid-template-columns:minmax(0,1fr) 280px; }
    .lexer-dev-body > section[hidden] { display:none; }
    .lexer-dev-loading { display:grid; place-items:center; flex:1; min-height:100px; }
    .lexer-dev-loading .lex-plugin-loading-pulse { position:static; margin:0; }
    @media (max-width:1319px){ .lexer-dev-body { grid-template-columns:1fr; overflow:auto; } }
    .lexer-dev-body > section { display:flex; flex-direction:column; gap:10px; min-height:0; }
    .lexer-dev-body h3 { margin:0; font:800 12px/1 var(--lex-heading-font,var(--lex-font)); letter-spacing:.1em; color:var(--lex-muted); }
    /* The table owns the column's spare height rather than leaving a blank
       band below it, and its text columns share the width instead of each
       holding a floor of its own, which is what forced the sideways scroll. */
    .lexer-dev-table-wrap { display:flex; overflow:auto; flex:1 1 auto; min-height:0; }
    #lexer-dev-table { display:flex; flex:1 1 auto; flex-direction:column; min-height:0; }
    /* Grows into the space it has, and never shrinks below its own rows: a
       squeezed grid keeps its stated height and paints the last games outside
       the scroll area, where the scrollbar cannot reach them. */
    #lexer-dev-table > .lex-column-list { flex:1 1 auto; min-height:max-content; }
    /* Stacked, each panel takes the height its own content needs and the drawer
       itself scrolls. A stacked grid splits the page between its rows instead,
       which left the games table a four-row window with the rest of the height
       empty below it. */
    @media (max-width:1319px){
      .lexer-dev-body,.lexer-dev-body:has(.lexer-dev-helpers:not([hidden])) { grid-template-columns:1fr; grid-auto-rows:max-content; align-content:start; }
      .lexer-dev-table-wrap { display:block; flex:none; overflow:visible; }
      #lexer-dev-table { display:block; flex:none; }
      #lexer-dev-table > .lex-column-list { flex:none; min-height:0; }
    }
    /* The overview's own columns hold sentences and lists, not values: they
       wrap inside their cell instead of pushing the table past its column,
       which is what gave the drawer a horizontal scrollbar. */
    .lexer-dev-table-wrap .lex-column-cell-content {
      white-space:normal;
      overflow-wrap:anywhere;
      min-width:0;
    }
    /* A disclosure with nothing behind it is not a control: the shared-UI file
       list is only there when there are files to list. */
    .lexer-dev-files[hidden] { display:none; }
    #lexer-dev-table .lex-column-list { font-size:13px; }
    .lexer-dev-summary { margin:0; font-size:12px; color:var(--lex-muted); }
    .lexer-dev-files { font-size:12px; color:var(--lex-muted); }
    .lexer-dev-files ul { margin:6px 0 0; padding-left:18px; display:grid; gap:2px; }
    .lexer-dev-files li.over { color:var(--lex-text); font-weight:600; }
    .lexer-dev-error { color:var(--lex-warning,#c0392b); font-size:13px; }
    /* One plugin subissue or one status count: a link to GitHub dressed as the
       cell's value, not as a button. */
    .lexer-dev-issue { all:unset; cursor:pointer; display:inline-flex; align-items:center; justify-content:center;
      min-width:18px; min-height:18px; border-radius:4px; font-variant-numeric:tabular-nums; }
    .lexer-dev-issue:hover, .lexer-dev-issue:focus-visible { outline:1px solid var(--lex-accent); outline-offset:2px; }
    .lexer-dev-issue.zero { color:var(--lex-muted); }
    .lexer-dev-dot { display:inline-block; width:16px; height:16px; border-radius:50%;
      background:var(--lexer-dev-status,var(--lex-muted)); box-shadow:inset 0 0 0 1px rgba(0,0,0,.25); }
    /* A blocked subissue wears GitHub's blocked badge on its lower right. The
       mark keeps room for it: a table cell clips whatever hangs outside. */
    .lexer-dev-mark { position:relative; display:inline-flex; padding:0 6px 6px 0; margin:6px 0 0 6px; }
    .lexer-dev-blocked { position:absolute; right:0; bottom:0; width:12px; height:12px;
      color:var(--lex-warning,#c0392b); background:var(--lex-panel,#fff); border-radius:3px; }
    .lexer-dev-dot.none { background:none; box-shadow:inset 0 0 0 1.5px var(--lex-muted); }
    .lexer-dev-closed { color:var(--lex-success,#34784b); font-weight:800; }
    .lexer-dev-missing { color:var(--lex-warning,#c0392b); font-weight:800; }
    .lex-dev-todo { color:var(--lex-muted); }
    .lex-dev-over { color:var(--lex-warning,#c0392b); font-weight:600; }
    .lexer-panel-list { display:flex; overflow:auto; flex:1 1 auto; flex-direction:column; gap:9px; margin:0; padding:0; list-style:none; }
    .lexer-helper { display:grid; gap:3px; padding:10px 11px; border:1px solid var(--lex-border); border-radius:5px; background:var(--lex-panel-2); }
    .lexer-helper[class*="state-"] { border-color:var(--state-color); }
    .lexer-helper-name { display:flex; align-items:baseline; justify-content:space-between; gap:8px; font-weight:700; }
    .lexer-helper-state { color:var(--state-color,var(--lex-muted)); font-size:10px; letter-spacing:.06em; }
    .lexer-helper-versions { color:var(--lex-text); font-size:12px; overflow-wrap:anywhere; line-height:1.5; }
    button.lexer-helper-source { justify-self:start; padding:3px 0; background:none; border:0; text-decoration:underline; cursor:pointer; }
    .lexer-helper-source,.lexer-helper-error { overflow-wrap:anywhere; color:var(--lex-muted); font-size:11px; }
    .lexer-helper-error { color:var(--lex-warning,#c0392b); }
    .lexer-panel-actions { display:flex; gap:8px; }
    .lexer-panel-actions button { padding:6px 11px; color:var(--lex-text); border:1px solid var(--lex-border); border-radius:5px; background:var(--lex-panel-2); font:inherit; }
    .lexer-panel-actions button:hover { border-color:var(--lex-highlight); }
    #lexer-handle-name { font-weight:700; }
    .home-social { position:fixed; z-index:45; left:16px; bottom:15px; display:flex; gap:8px; }
    .home-social-button { display:grid; width:38px; height:38px; place-items:center; padding:7px; color:var(--lex-text); border:1px solid var(--lex-border); border-radius:5px; background:var(--lex-panel-2); box-shadow:0 3px 12px #0008; }
    .home-social-button:hover,.home-social-button:focus-visible { color:#fff; border-color:var(--lex-highlight); background:var(--lex-panel-2); transform:translateY(-1px); }
    .home-social-button svg { width:22px; height:22px; fill:currentColor; }
    .home-social-twitter .twitter-x { display:none; }
    .home-social-twitter:hover .twitter-bird,.home-social-twitter:focus-visible .twitter-bird { display:none; }
    .home-social-twitter:hover .twitter-x,.home-social-twitter:focus-visible .twitter-x { display:block; }
    .loading-screen { position:fixed; inset:0; z-index:90; display:block; padding:0; color:#fff; background:#080a0d94; backdrop-filter:brightness(.62); animation:loading-blocker-enter .34s ease both; }
    @keyframes loading-blocker-enter { from { opacity:0 } to { opacity:1 } }
    @keyframes loading-quote-enter { from { opacity:0;translate:-42px 0 } to { opacity:1;translate:0 0 } }
    @keyframes loading-pulse-enter { from { opacity:0;translate:42px 0 } to { opacity:1;translate:0 0 } }
    .loading-screen.closing { animation:none;opacity:0;pointer-events:none;transition:opacity .3s ease; }
    .loading-screen[hidden] { display:none; }
    .loading-quote { animation:loading-quote-enter .34s .1s ease both; position:absolute; left:30px; bottom:27px; width:min(850px,70vw); margin:0; font:650 clamp(17px,2vw,28px)/1.3 "Lexend","Segoe UI",system-ui,sans-serif; text-align:left; text-wrap:balance; }
    .loading-pulse { position:absolute; right:30px; bottom:28px; display:block; width:32px; height:32px; margin:0; border:4px solid #fff5; border-right-color:#fff; border-radius:50%; animation:loading-pulse-enter .34s .1s ease both,loading-spin .75s linear infinite; }

  <script>
    const games=document.querySelector("#games"),surface=document.querySelector("#chooser-surface"),residentHandle=document.querySelector("#resident-handle"),loadingScreen=document.querySelector("#loading-screen"),loadingQuote=document.querySelector("#loading-quote");
    const modal=document.querySelector("#modal"),dialogTitle=document.querySelector("#dialog-title"),dialogMessage=document.querySelector("#dialog-message"),dialogProblems=document.querySelector("#dialog-problems"),dialogProgress=document.querySelector("#dialog-progress"),dialogActions=document.querySelector("#dialog-actions");
    // The loading screen waits for pending covers so the menu does not pop
    // in half-drawn, but never longer than this: a cover stuck "loading"
    // held the whole menu behind a black screen. Late covers draw in place.
    const COVER_WAIT_MS=6000;
    const chooser={plugins:[],active:null,timer:null,loading:false,deferredRender:false,settingsLoaded:false,menuReady:false,menuStarted:Date.now(),quoteRequested:false};
    const updateButton=document.querySelector("#app-update");
    async function refreshAppUpdate(){
      try {
        const result=await window.pywebview.api.app_update_status();
        updateButton.hidden=result?.available!==true;
        return result;
      } catch(error) {updateButton.hidden=true;throw error;}
    }
    window.addEventListener("pywebviewready",()=>{refreshAppUpdate().catch(error=>console.warn("Update check failed",error));},{once:true});
    updateButton.onclick=async()=>{
      if(updateButton.disabled)return;
      updateButton.disabled=true;updateButton.setAttribute("aria-busy","true");updateButton.title="Checking for updates…";
      try{
        const result=await refreshAppUpdate();
        if(!result?.available)return;
        const actions=[button("CLOSE",closeDialog,true)];
        if(result.available)actions.unshift(button(`INSTALL ${result.tag}`,async()=>{
          dialogActions.querySelectorAll("button").forEach(control=>control.disabled=true);
          dialogMessage.textContent="Preparing the release. Lexeditor will close, update and reopen.";
          try{const installed=await window.pywebview.api.install_app_update();if(!installed?.updating)throw Error("The update did not start.");}
          catch(error){setDialog("Update failed",String(error?.message||error),[button("CLOSE",closeDialog,true)]);}
        }));
        setDialog("Lexeditor update",`${result.message} Latest release: ${result.tag}.`,actions);
      }catch(error){setDialog("Could not check for updates",String(error?.message||error),[button("CLOSE",closeDialog,true)]);}
      finally{updateButton.disabled=false;updateButton.removeAttribute("aria-busy");updateButton.title="Update Lexeditor";}
    };
    const windowControls=LexeditorUI.createWindowActions();
    const restartButton=document.createElement("button");restartButton.id="chooser-restart";restartButton.className="lex-window-button lex-window-restart";restartButton.title="Restart Lexeditor";restartButton.setAttribute("aria-label","Restart Lexeditor");restartButton.hidden=true;restartButton.innerHTML='<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M16.59 5.45 A8 8 0 1 1 9.26 4.48" fill="none" stroke="currentColor" stroke-linecap="round"/><path d="M12.46 3.32 L10.05 6.64 L8.48 2.32 Z" fill="currentColor" stroke="none"/></svg>';
    const settingsButton=document.createElement("button");settingsButton.id="chooser-settings";settingsButton.className="lex-settings-button";settingsButton.title="Lexeditor settings";settingsButton.setAttribute("aria-label","Open Lexeditor settings");settingsButton.append(LexeditorUI.settingsIcon());settingsButton.onclick=LexeditorUI.openSettings;
    const residentSave=residentHandle.querySelector(".resident-save"),residentName=residentHandle.querySelector(".resident-game-name");residentSave.append(LexeditorUI.saveIcon(),Object.assign(document.createElement("span"),{className:"lex-save-count",hidden:true}));
    const lexerHandle=document.querySelector("#lexer-handle");
    windowControls.root.prepend(restartButton);
    document.querySelector("#chooser-window-controls").replaceChildren(
      LexeditorUI.element("div",{class:"lex-shell-right-actions"},LexeditorUI.uiScaleControl(),settingsButton),windowControls.root);
    const lexerPanel=document.querySelector("#lexer-panel"),lexerList=document.querySelector("#lexer-panel-list");
    function lexerHelperRow(helper){
      const unavailable=!!helper.error||!helper.latest;
      const row=document.createElement("li");row.className=`lexer-helper state-${unavailable?"not-added":helper.behind?"warning":"added"}`;
      const name=document.createElement("div");name.className="lexer-helper-name";
      const label=document.createElement("span");label.textContent=`${helper.helper||helper.runtime||"Helper"} — ${helper.plugin||helper.pluginId||""}`;
      const state=document.createElement("span");state.className="lexer-helper-state";
      state.textContent=unavailable?"UNAVAILABLE":helper.behind?"UPDATE AVAILABLE":"UP TO DATE";
      name.append(label,state);row.append(name);
      const versions=document.createElement("div");versions.className="lexer-helper-versions";
      for(const text of [
        `Pinned: ${helper.pinned||"Unknown"}${helper.packageVersion?` · Package ${helper.packageVersion}`:""}`,
        `Installed: ${helper.installedVersion||"Not detected"}${helper.installedStatus?` (${helper.installedStatus})`:""}`,
        `Latest upstream: ${helper.latest||"Unavailable"}`,
        `Published: ${helper.published||"Unavailable"}`]){
        const line=document.createElement("div");line.textContent=text;versions.append(line);
      }
      row.append(versions);
      // Every other helper here is a pinned fork: this panel reports and does
      // not install, because updating one part on its own can break the
      // program. ReShade is unmodified upstream and shared by every game, so
      // it is the one row that carries an install action.
      if(helper.installable){
        const action=document.createElement("button");
        action.type="button";action.className="lexer-helper-install";
        // The button installs the pin, never whatever upstream published
        // today, so it says the pinned version and not the latest one.
        const pinned=helper.pinned||helper.latest||"";
        action.textContent=helper.installed
          ?(helper.behind?`Install the pinned ${pinned}`:"Reinstall the bundled build")
          :`Install ${helper.helper||"helper"}${pinned?` ${pinned}`:""}`;
        action.onclick=async()=>{
          action.disabled=true;const was=action.textContent;action.textContent="Downloading…";
          try{
            const result=await window.pywebview.api.install_reshade_loader("","");
            if(result?.error)throw new Error(result.error);
            await loadHelperVersions(true);
          }catch(error){
            action.disabled=false;action.textContent=was;
            const problem=document.createElement("div");problem.className="lexer-helper-error";
            problem.textContent=String(error?.message||error);row.append(problem);
          }
        };
        row.append(action);
      }
      for(const error of [helper.error,helper.installedError]){
        if(!error)continue;
        const problem=document.createElement("div");problem.className="lexer-helper-error";problem.textContent=error;row.append(problem);
      }
      if(helper.releaseNotes){
        // Never navigate the privileged desktop WebView to remote content.
        try{const url=new URL(helper.releaseNotes);
          if(url.protocol==="https:"&&url.hostname==="github.com"&&/^\/[^/]+\/[^/]+\/releases\/tag\//.test(url.pathname)){
            const link=document.createElement("button");link.type="button";link.className="lexer-helper-source";link.textContent="Release notes ↗";
            link.onclick=()=>window.pywebview.api.open_helper_release_notes(helper.pluginId||"").catch(error=>{
              const problem=document.createElement("div");problem.className="lexer-helper-error";problem.textContent=String(error);row.append(problem);
            });row.append(link);
          }
        }catch(_ignored){}
      }
      return row;
    }
    async function loadHelperVersions(refresh=false){
      lexerList.replaceChildren(Object.assign(document.createElement("li"),{className:"lexer-helper",textContent:"Checking GitHub…"}));
      try{
        const result=await window.pywebview.api.helper_versions(refresh);
        const helpers=result?.helpers||[];
        lexerList.replaceChildren(...(helpers.length
          ?helpers.map(lexerHelperRow)
          :[Object.assign(document.createElement("li"),{className:"lexer-helper",textContent:"No plugin declares a managed helper."})]));
      }catch(error){
        lexerList.replaceChildren(Object.assign(document.createElement("li"),
          {className:"lexer-helper",textContent:String(error?.message||error)}));
      }
    }
    // The five independent tasks every game tracks (AGENTS.md), and the
    // four workflow labels plus "none" for the open-issue counts.
    const DEV_SUBISSUES=[["editor","EDITOR"],["ux","UX"],["modloader","MODLOADER"],["theme","THEME"],["reshade","RESHADE"]];
    const DEV_STATUSES=[["actionable","Actionable"],["untested","Needs testing"],["waiting","Waiting"],["unfeasible","Unfeasible"],["none","No status"]];
    const devStatusName=Object.fromEntries(DEV_STATUSES);
    // A load that starts after this one has begun owns the table.
    let developerOverviewLoad=0;
    // One row per game through the shared table: the plugin subissues, open
    // issues by status, quotes and copied lines. The shared pools live in the summary line and the file disclosure
    // below, not in separate tables.
    async function loadDeveloperOverview(){
      const load=++developerOverviewLoad;
      const mount=document.querySelector("#lexer-dev-table");
      const summary=document.querySelector("#lexer-dev-summary");
      const files=document.querySelector("#lexer-dev-files");
      mount.setAttribute("aria-busy","true");
      mount.replaceChildren(LexeditorUI.element("div",{class:"lexer-dev-loading",role:"status","aria-label":"Loading developer overview"},
        LexeditorUI.element("span",{class:"lex-plugin-loading-pulse","aria-hidden":"true"})));
      summary.textContent="";files.replaceChildren();
      document.querySelector("#lexer-dev-files-wrap").hidden=true;
      const copiedText=row=>row.copiedLines==null?"—"
        :row.copiedLines===row.copiedRecorded?String(row.copiedLines)
        :`${row.copiedLines} (was ${row.copiedRecorded})`;
      // Reveal a complete table once both independent reads have settled.
      let board=null,boardError="",colors={};
      const dot=status=>{const node=document.createElement("span");
        node.className=`lexer-dev-dot${status&&status!=="none"?"":" none"}`;
        if(colors[status])node.style.setProperty("--lexer-dev-status",colors[status]);return node;};
      // A row's issues live under its label, which two editions of one game share.
      const labelOf=row=>row.issueLabel||row.id;
      // GitHub's "blocked" octicon: a circle struck through.
      const blockedBadge=()=>{const svg=document.createElementNS("http://www.w3.org/2000/svg","svg");
        svg.setAttribute("viewBox","0 0 16 16");svg.setAttribute("class","lexer-dev-blocked");svg.setAttribute("aria-hidden","true");
        svg.innerHTML='<path fill="currentColor" d="M4.467.22a.749.749 0 0 1 .53-.22h6.006c.199 0 .389.079.53.22l4.247 4.247c.141.14.22.331.22.53v6.006a.749.749 0 0 1-.22.53l-4.247 4.247a.749.749 0 0 1-.53.22H4.997a.749.749 0 0 1-.53-.22L.22 11.533a.749.749 0 0 1-.22-.53V4.997c0-.199.079-.389.22-.53Zm.84 1.28L1.5 5.308v5.384L5.308 14.5h5.384l3.808-3.808V5.308L10.692 1.5ZM4 7.75A.75.75 0 0 1 4.75 7h6.5a.75.75 0 0 1 0 1.5h-6.5A.75.75 0 0 1 4 7.75Z"/>';
        return svg;};
      const openIssues=(row,number,status)=>window.pywebview.api.open_developer_issues(labelOf(row),number??null,status??null);
      const link=(title,onclick,...children)=>{const node=document.createElement("button");
        node.type="button";node.className="lexer-dev-issue";node.title=title;node.onclick=onclick;node.append(...children);return node;};
      const pending=()=>Object.assign(document.createElement("span"),{className:"lex-dev-todo",textContent:"—",title:boardError||"Reading GitHub…"});
      const subissueCell=(row,key,name)=>{
        // Global is the shared application, not a plugin: it has no subissues.
        if(row.global)return "";
        if(!board)return pending();
        const issue=board.games?.[labelOf(row)]?.subissues?.[key];
        if(!issue)return Object.assign(document.createElement("span"),
          {className:"lexer-dev-missing",textContent:"!",title:`${row.game} has no ${name} subissue`});
        const label=issue.closed?"closed":devStatusName[issue.status||"none"].toLowerCase();
        const mark=issue.closed?Object.assign(document.createElement("span"),{className:"lexer-dev-closed",textContent:"✓"}):dot(issue.status||"none");
        if(issue.closed||!issue.blocked)return link(`#${issue.number} ${name}: ${label}`,()=>openIssues(row,issue.number),mark);
        const wrap=Object.assign(document.createElement("span"),{className:"lexer-dev-mark"});
        wrap.append(mark,blockedBadge());
        return link(`#${issue.number} ${name}: ${label}, blocked`,()=>openIssues(row,issue.number),wrap);
      };
      const countCell=(row,status,name)=>{
        if(!board)return pending();
        const count=board.games?.[labelOf(row)]?.counts?.[status]??0;
        const node=link(`${row.game}: ${count} open ${name.toLowerCase()} issue${count===1?"":"s"}`,()=>openIssues(row,null,status),String(count));
        if(!count)node.classList.add("zero");
        return node;
      };
      const draw=(table,rows)=>{
        colors={...(table.workflowColors||{}),...(board?.colors||{})};
        mount.replaceChildren(LexeditorUI.columnList({
          "aria-label":"Developer overview by game",
          // The table seats itself in the column it is given, the way the
          // barrel tables do, instead of leaving the lower half of the drawer
          // empty under a short table.
          fill:true,
          columns:[
            {key:"game",label:"GAME",align:"start"},
            ...DEV_SUBISSUES.map(([key,label])=>({key:`issue-${key}`,label,
              headerTitle:`The game's ${label.toLowerCase()} subissue: its status colour, or a tick once closed. Click one to open it on GitHub.`,
              sortable:false,render:row=>subissueCell(row,key,label)})),
            ...DEV_STATUSES.map(([status,name])=>({key:`count-${status}`,
              label:()=>status==="none"?Object.assign(document.createElement("span"),{textContent:"✕"}):dot(status),
              headerTitle:`Open ${name.toLowerCase()} issues. Click a count to list them on GitHub.`,
              sortable:false,render:row=>countCell(row,status,name)})),
            {key:"quotes",label:"QUOTES",numeric:true,
              render:row=>row.quotes??"—",sortValue:row=>row.quotes??-1},
            // Not a numeric column: the cell reads "12 (was 9)", so the
            // no-squeeze rule for numbers would only add a floor the drawer
            // has to scroll sideways to reach.
            {key:"copiedLines",label:"COPIED LINES",
              render:row=>copiedText(row),
              cellClass:row=>row.copiedOver?"lex-dev-over":"",
              sortValue:row=>row.copiedLines??-1},
          ],
          rows,
          // Every column can give space back, so the table fits the drawer
          // instead of pushing a horizontal scrollbar under it. The issue and
          // count columns hold one mark or a short number each, and are not
          // sortable: a sort control's padding would add 40px to each.
          template:"minmax(110px,1.1fr)"+" max-content".repeat(DEV_SUBISSUES.length)
            +" 32px".repeat(DEV_STATUSES.length)+" 64px 96px",
        }));
      };
      try{
        const [overview,issues]=await Promise.allSettled([
          window.pywebview.api.developer_overview(),window.pywebview.api.developer_issue_board()]);
        if(load!==developerOverviewLoad)return;
        if(overview.status==="rejected")throw overview.reason;
        if(issues.status==="fulfilled"&&issues.value?.games)board=issues.value;
        else boardError=`GitHub could not be read: ${issues.reason?.message||issues.reason||"No issue data returned"}`;
        const table=overview.value?.table||{};
        const rows=table.rows||[];
        draw(table,rows);
        if(boardError)mount.prepend(LexeditorUI.element("div",{class:"lexer-dev-error",role:"alert"},boardError,
          LexeditorUI.element("button",{type:"button",onclick:loadDeveloperOverview},"Retry")));
        const ui=table.sharedUi||{files:[],totalShared:0,totalHand:0};
        summary.textContent=`${rows.filter(row=>!row.global).length} games · ${table.quotesTotal||0} loading quotes`
          +` (Global (shared): ${table.globalQuotes||0}) · shared UI ${ui.totalShared||0} selectors,`
          +` ${ui.totalHand||0} hand-built rows across ${(ui.files||[]).length} files`;
        const count=(now,was)=>now===was?String(now):`${now} (was ${was})`;
        // The disclosure only exists when it has something to disclose.
        document.querySelector("#lexer-dev-files-wrap").hidden=!(ui.files||[]).length;
        files.replaceChildren(...(ui.files||[]).map(row=>{
          const item=document.createElement("li");
          if(row.over)item.classList.add("over");
          item.textContent=`${row.file}: ${count(row.sharedSelectors,row.recordedSelectors)} shared,`
            +` ${count(row.handBuiltRows,row.recordedRows)} hand-built`;
          return item;
        }));
      }catch(error){
        if(load!==developerOverviewLoad)return;
        mount.replaceChildren(Object.assign(document.createElement("div"),
          {className:"lexer-dev-error",textContent:String(error?.message||error)}));
        summary.textContent="";files.replaceChildren();
      }finally{if(load===developerOverviewLoad)mount.setAttribute("aria-busy","false");}
    }
    const helpersToggle=document.querySelector("#lexer-helpers-toggle"),helpersPanel=document.querySelector("#lexer-dev-helpers");
    helpersToggle.onclick=()=>{
      helpersPanel.hidden=!helpersPanel.hidden;
      helpersToggle.setAttribute("aria-expanded",String(!helpersPanel.hidden));
      if(!helpersPanel.hidden)loadHelperVersions(false);
    };
    function setLexerPanel(open){
      if(open){lexerPanel.hidden=false;requestAnimationFrame(()=>lexerPanel.classList.add("open"));if(!helpersPanel.hidden)loadHelperVersions(false);loadDeveloperOverview();}
      else{lexerPanel.classList.remove("open");setTimeout(()=>{lexerPanel.hidden=true;},240);}
      lexerHandle.setAttribute("aria-expanded",String(!!open));lexerHandle.setAttribute("aria-label",open?"Close helper versions":"Open helper versions");
